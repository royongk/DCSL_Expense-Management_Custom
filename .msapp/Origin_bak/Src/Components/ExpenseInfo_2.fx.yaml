ExpenseInfo_2 As CanvasComponent:
    OnReload():
        ThisProperty:
            Default: ="Text"
    Amount1: ="Text"
    Amount2: ="Text"
    ChildTabPriority: =true
    CostType: ="Text"
    Currency1: ="Text"
    Currency2: ="Text"
    Fill: =RGBA(231, 231, 231, 0.8)
    HeaderText1: ="Text"
    HeaderText2: ="Text"
    Height: =180
    IconVisibleFlag: =true
    Mileage: ="Text"
    NoOfPassengers: ="Text"
    RowId: ="Text"
    TransactionDate: ="Text"
    VehicleType: ="Text"
    Width: =Max(App.Width, App.MinScreenWidth)
    X: =0
    Y: =0
    ZIndex: =1

    HeaderText1_1 As label:
        FontWeight: =FontWeight.Bold
        Height: =52
        Size: =21
        Text: =ExpenseInfo_2.HeaderText1
        Width: =205
        X: |-
            =If(Icon6_1.Visible,
            Icon6_1.X + Icon6_1.Width + 5,
            25
            )
        ZIndex: =1

    HeaderText2_1 As label:
        FontWeight: =FontWeight.Bold
        Height: =56
        Size: =21
        Text: =ExpenseInfo_2.HeaderText2
        Width: =233
        X: |-
            =If(Icon6_1.Visible,
            Icon6_1.X + Icon6_1.Width + 5,
            25
            )
        Y: =45
        ZIndex: =2

    Amount1_1 As label:
        Align: =Align.Right
        FontWeight: =FontWeight.Bold
        Height: =61
        Size: =21
        Text: =ExpenseInfo_2.Amount1
        Width: =229
        X: =Currency1_1.X - Amount1_1.Width
        ZIndex: =3

    Currency1_1 As label:
        FontWeight: =FontWeight.Bold
        Height: =61
        Size: =21
        Text: =ExpenseInfo_2.Currency1
        Width: =99
        X: =524
        ZIndex: =4

    Amount2_1 As label:
        Align: =Align.Right
        FontWeight: =FontWeight.Bold
        Height: =70
        Size: =21
        Text: =ExpenseInfo_2.Amount2
        Width: =229
        X: =Currency2_1.X - Amount2_1.Width
        Y: =38
        ZIndex: =5

    Currency2_1 As label:
        FontWeight: =FontWeight.Bold
        Height: =70
        Size: =21
        Text: =ExpenseInfo_2.Currency2
        Width: =82
        X: =524
        Y: =38
        ZIndex: =6

    Icon6_1 As icon.Sync:
        AccessibleLabel: ="Refresh"
        Height: =37
        Icon: =Icon.Sync
        OnSelect: =ExpenseInfo_2.OnReload()
        Visible: =ExpenseInfo_2.IconVisibleFlag
        Width: =33
        X: =14
        Y: =HeaderText2_1.Y + (HeaderText2_1.Y - HeaderText1_1.Y - HeaderText1_1.Height)*2
        ZIndex: =7

