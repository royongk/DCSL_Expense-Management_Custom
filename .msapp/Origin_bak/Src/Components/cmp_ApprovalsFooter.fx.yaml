cmp_ApprovalsFooter As CanvasComponent:
    OnApprovalsButtonClick():
        ThisProperty:
            Default: ="Text"
    OnDelegateButtonClick():
        ThisProperty:
            Default: ="Text"
    OnRejectButtonClick():
        ThisProperty:
            Default: =true
    ApprovalText: ="Text"
    DelegateText: ="Text"
    DisplayMode: =true
    Fill: =RGBA(250, 249, 248, 1)
    Height: =100
    IsDelegateVisible: =true
    OnReset: =Set(varSelectedTab,cmp_ApprovalsFooter.paramInDefaultSelectedTab)
    paramInDefaultSelectedTab: =2
    paramOutSelectedTabIndex: =
    RejectText: ="Text"
    Width: =Max(App.Width, App.MinScreenWidth)
    X: =0
    Y: =0
    ZIndex: =1

    cmp_footer_img_Approve As image:
        DisplayMode: |-
            =If(
                cmp_ApprovalsFooter.DisplayMode,
                DisplayMode.Edit,
                DisplayMode.View
            )
        Height: =40.96
        Image: =ApprovalIcon
        OnSelect: =cmp_ApprovalsFooter.OnApprovalsButtonClick()
        Width: =40.96
        X: =(delegateRegion_2.X + approveRegion_2.X)/2 - 20
        Y: =14.88
        ZIndex: =1

    cmp_footer_img_Delegate As image:
        DisplayMode: |-
            =If(
                cmp_ApprovalsFooter.DisplayMode,
                DisplayMode.Edit,
                DisplayMode.View
            )
        Height: =40.96
        Image: =DelegateIcon
        OnSelect: =cmp_ApprovalsFooter.OnDelegateButtonClick()
        Visible: =cmp_ApprovalsFooter.IsDelegateVisible
        Width: =40.96
        X: =(rejectRegion_2.X + delegateRegion_2.X)/2 - 20
        Y: =16.59
        ZIndex: =2

    cmp_footer_img_Reject As image:
        DisplayMode: |-
            =If(
                cmp_ApprovalsFooter.DisplayMode,
                DisplayMode.Edit,
                DisplayMode.View
            )
        Height: =40.96
        Image: =RejectIcon
        OnSelect: =cmp_ApprovalsFooter.OnRejectButtonClick()
        Width: =40.96
        X: =(rejectRegion_2.X + Parent.Width)/2 - 20
        Y: =14.88
        ZIndex: =3

    cmp_footer_lbl_Approve As label:
        Color: =RGBA(34, 102, 227, 1)
        DisplayMode: |-
            =If(
                cmp_ApprovalsFooter.DisplayMode,
                DisplayMode.Edit,
                DisplayMode.View
            )
        Font: =Font.'Segoe UI'
        Height: =28
        PaddingBottom: =0
        PaddingLeft: =0
        PaddingTop: =0
        Size: =16
        Text: =cmp_ApprovalsFooter.ApprovalText
        Width: =120
        X: =cmp_footer_img_Approve.X - 25
        Y: =60
        ZIndex: =4

    cmp_footer_lbl_Delegate As label:
        Color: =RGBA(34, 102, 227, 1)
        DisplayMode: |-
            =If(
                cmp_ApprovalsFooter.DisplayMode,
                DisplayMode.Edit,
                DisplayMode.View
            )
        Font: =Font.'Segoe UI'
        Height: =28
        PaddingBottom: =0
        PaddingLeft: =0
        PaddingTop: =0
        Size: =16
        Text: =cmp_ApprovalsFooter.DelegateText
        Visible: =cmp_ApprovalsFooter.IsDelegateVisible
        Width: =120
        X: =cmp_footer_img_Delegate.X - 25
        Y: =60
        ZIndex: =5

    cmp_footer_lbl_Reject As label:
        Color: |
            =RGBA(165, 33, 33, 1)
        DisplayMode: |-
            =If(
                cmp_ApprovalsFooter.DisplayMode,
                DisplayMode.Edit,
                DisplayMode.View
            )
        Font: =Font.'Segoe UI'
        Height: =28
        PaddingBottom: =0
        PaddingLeft: =0
        PaddingTop: =0
        Size: =16
        Text: =cmp_ApprovalsFooter.RejectText
        Width: =120
        X: |
            =cmp_footer_img_Reject.X - 20
        Y: =60
        ZIndex: =6

    delegateRegion_2 As rectangle:
        AccessibleLabel: ="Select to delegate current workitem"
        DisplayMode: |-
            =If(
                cmp_ApprovalsFooter.DisplayMode,
                DisplayMode.Edit,
                DisplayMode.View
            )
        Fill: =RGBA(0, 0, 0, 0)
        FocusedBorderThickness: =0
        Height: =Parent.Height
        HoverFill: =
        OnSelect: =Select(cmp_footer_img_Delegate)
        PressedFill: =
        TabIndex: =0
        Width: =Parent.Width/3
        X: =Self.Width
        ZIndex: =9

    approveRegion_2 As rectangle:
        AccessibleLabel: ="Select to approve current workitem"
        DisplayMode: |-
            =If(
                cmp_ApprovalsFooter.DisplayMode,
                DisplayMode.Edit,
                DisplayMode.View
            )
        Fill: =RGBA(0, 0, 0, 0)
        FocusedBorderThickness: =0
        Height: =Parent.Height
        HoverFill: =
        OnSelect: =Select(cmp_footer_img_Approve)
        PressedFill: =
        TabIndex: =0
        Width: =Parent.Width/3
        ZIndex: =10

    rejectRegion_2 As rectangle:
        AccessibleLabel: ="Select to reject current workitem"
        DisplayMode: |-
            =If(
                cmp_ApprovalsFooter.DisplayMode,
                DisplayMode.Edit,
                DisplayMode.View
            )
        Fill: =RGBA(0, 0, 0, 0)
        FocusedBorderThickness: =0
        Height: =Parent.Height
        HoverFill: =
        OnSelect: =Select(cmp_footer_img_Reject)
        PressedFill: =
        TabIndex: =0
        Width: =Parent.Width/3
        X: =2 * Self.Width
        ZIndex: =11

