ComponentDefinitions:
  cmp_Footer_3:
    DefinitionType: CanvasComponent
    AccessAppScope: true
    CustomProperties:
      ApprovalsAccessibleLabel:
        PropertyKind: Input
        DisplayName: ApprovalsAccessibleLabel
        Description: A custom property
        DataType: Text
        Default: ="Text"
      ApprovalsText:
        PropertyKind: Input
        DisplayName: ApprovalsText
        Description: Defines the label text for Approvals tab
        DataType: Text
        Default: ="Text"
      DisplayMode:
        PropertyKind: Input
        DisplayName: DisplayMode
        Description: control mode of components
        DataType: Boolean
        Default: =true
      ExpenseAccessibleLabel:
        PropertyKind: Input
        DisplayName: ExpenseAccessibleLabel
        Description: A custom property
        DataType: Text
        Default: ="Text"
      ExpensesText:
        PropertyKind: Input
        DisplayName: ExpensesText
        Description: A custom property
        DataType: Text
        Default: ="Text"
      OnApprovalsButtonClick:
        PropertyKind: Event
        DisplayName: OnApprovalsButtonClick
        Description: Defines action on click of Approvals region
        ReturnType: Boolean
        Default: =true
      OnExpensesButtonClick:
        PropertyKind: Event
        DisplayName: OnExpensesButtonClick
        Description: OnExpensesButtonClick
        ReturnType: Text
        Default: ="Text"
      OnReceiptsButtonClick:
        PropertyKind: Event
        DisplayName: OnReceiptsButtonClick
        Description: OnReceiptsClick
        ReturnType: Text
        Default: ="Text"
      OnReportsButtonClick:
        PropertyKind: Event
        DisplayName: OnReportsButtonClick
        Description: OnReportsButtonClick
        ReturnType: Boolean
        Default: =true
      ReceiptAccessibleLabel:
        PropertyKind: Input
        DisplayName: ReceiptAccessibleLabel
        Description: A custom property
        DataType: Text
        Default: =
      ReceiptText:
        PropertyKind: Input
        DisplayName: ReceiptText
        Description: A custom property
        DataType: Text
        Default: ="Text"
      ReportAccessibleLabel:
        PropertyKind: Input
        DisplayName: ReportAccessibleLabel
        Description: A custom property
        DataType: Text
        Default: ="Text"
      ReportText:
        PropertyKind: Input
        DisplayName: ReportText
        Description: A custom property
        DataType: Text
        Default: ="Text"
      SelectedTab:
        PropertyKind: Input
        DisplayName: SelectedTab
        Description: Currently selected tab
        DataType: Number
        Default: =100
      paramInDefaultAppMode:
        PropertyKind: Input
        DisplayName: paramInDefaultAppMode
        Description: 사용자 지정 속성
        RaiseOnReset: true
        DataType: Text
        Default: ="텍스트"
      paramInDefaultSelectedTab:
        PropertyKind: Input
        DisplayName: paramInDefaultSelectedTab
        Description: A custom input property used to set default selected tab
        RaiseOnReset: true
        DataType: Number
        Default: =2
      paramOutSelectedTabIndex:
        PropertyKind: Output
        DisplayName: paramOutSelectedTabIndex
        Description: Selected Tab Index
        DataType: Number
    Properties:
      Fill: =RGBA(248, 248, 248, 0.94)
      Height: =84
      OnReset: =Set(varSelectedTab,cmp_Footer_3.paramInDefaultSelectedTab)
      Width: =Max(App.Width, App.MinScreenWidth)
      paramOutSelectedTabIndex: =
    Children:
      - cmp_footer_img_Approvals:
          Control: Image@2.2.3
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Height: =28.16
            Image: |-
              =If(
                  cmp_Footer_3.paramInDefaultAppMode = "AirfareAllowance",
                  If(
                      Value(cmp_Footer_3.paramInDefaultSelectedTab=4),
                      travelSelected,
                      travelDeselectedIcon
                  ),
                  If(
                      Value(cmp_Footer_3.paramInDefaultSelectedTab=4),
                      approvalsSelectedIcon,
                      approvalsIcon
                  )
              )
            OnSelect: =cmp_Footer_3.OnApprovalsButtonClick()
            Width: =28.16
            X: =approvalsRegion_1.X + (approvalsRegion_1.Width - Self.Width)/2
            Y: =14.88
      - cmp_footer_img_Receipts_6:
          Control: Image@2.2.3
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            DisplayMode: |-
              =If(
                  cmp_Footer_3.DisplayMode,
                  DisplayMode.Edit,
                  DisplayMode.View
              )
            Height: =28.16
            Image: =If( cmp_Footer_3.paramInDefaultSelectedTab=1 ,IcnFooterReceiptSelected,IcnFooterReceiptUnSelected)
            OnSelect: =cmp_Footer_3.OnReceiptsButtonClick()
            Width: =28.16
            X: =receiptRegion_1.X + (receiptRegion_1.Width - Self.Width)/2
            Y: =14.88
      - cmp_footer_img_Expenses_6:
          Control: Image@2.2.3
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            DisplayMode: |-
              =If(
                  cmp_Footer_3.DisplayMode,
                  DisplayMode.Edit,
                  DisplayMode.View
              )
            Height: =28.16
            Image: =If( cmp_Footer_3.paramInDefaultSelectedTab=2,IcnFooterExpenseSelected,IcnFooterExpenseUnSelected)
            OnSelect: =cmp_Footer_3.OnExpensesButtonClick()
            Width: =28.16
            X: =expensesRegion_1.X + (expensesRegion_1.Width - Self.Width)/2
            Y: =16.59
      - cmp_footer_img_Reports_6:
          Control: Image@2.2.3
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            DisplayMode: |-
              =If(
                  cmp_Footer_3.DisplayMode,
                  DisplayMode.Edit,
                  DisplayMode.View
              )
            Height: =28.16
            Image: =If( Value(cmp_Footer_3.paramInDefaultSelectedTab=3),IcnFooterReportsSelected, IcnFooterReportsUnSelected)
            OnSelect: =cmp_Footer_3.OnReportsButtonClick()
            Width: =28.16
            X: =reportsRegion_1.X + (reportsRegion_1.Width - Self.Width)/2
            Y: =14.88
      - cmp_footer_lbl_Approvals:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =If(varSelectedTab=4,RGBA(34, 102, 227, 1), RGBA(110, 110, 110, 1))
            DisplayMode: |-
              =If(
                  cmp_Footer_3.DisplayMode,
                  DisplayMode.Edit,
                  DisplayMode.View
              )
            Font: =Font.'Segoe UI'
            Height: =28
            PaddingBottom: =0
            PaddingTop: =0
            Size: =16
            Text: =cmp_Footer_3.ApprovalsText
            Width: =App.Width / 4
            Wrap: =false
            X: =approvalsRegion_1.X
            Y: =49.49
      - cmp_footer_lbl_Receipts_6:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =If(varSelectedTab=1,RGBA(34, 102, 227, 1), RGBA(110, 110, 110, 1))
            DisplayMode: |-
              =If(
                  cmp_Footer_3.DisplayMode,
                  DisplayMode.Edit,
                  DisplayMode.View
              )
            Font: =Font.'Segoe UI'
            Height: =28
            PaddingBottom: =0
            PaddingTop: =0
            Size: =16
            Text: =cmp_Footer_3.ReceiptText
            Width: =App.Width / 4
            Wrap: =false
            X: =receiptRegion_1.X
            Y: =49.49
      - cmp_footer_lbl_Expenses_6:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =If(varSelectedTab=2,RGBA(34, 102, 227, 1), RGBA(110, 110, 110, 1))
            DisplayMode: |-
              =If(
                  cmp_Footer_3.DisplayMode,
                  DisplayMode.Edit,
                  DisplayMode.View
              )
            Font: =Font.'Segoe UI'
            Height: =28
            PaddingBottom: =0
            PaddingTop: =0
            Size: =16
            Text: =cmp_Footer_3.ExpensesText
            Width: =App.Width / 4
            Wrap: =false
            X: =expensesRegion_1.X
            Y: =49.49
      - cmp_footer_lbl_Reports_6:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =If(varSelectedTab=3,RGBA(34, 102, 227, 1), RGBA(110, 110, 110, 1))
            DisplayMode: |-
              =If(
                  cmp_Footer_3.DisplayMode,
                  DisplayMode.Edit,
                  DisplayMode.View
              )
            Font: =Font.'Segoe UI'
            Height: =28
            PaddingBottom: =0
            PaddingTop: =0
            Size: =16
            Text: =cmp_Footer_3.ReportText
            Width: =App.Width / 4
            Wrap: =false
            X: =reportsRegion_1.X
            Y: =49.49
      - cmp_footer_rct_Seprator_7:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =RGBA(200, 200, 200, 1)
            Height: =0.85
            Width: =Parent.Width
      - expensesRegion_1:
          Control: Rectangle@2.3.0
          Properties:
            AccessibleLabel: |-
              =If(
                  cmp_Footer_3.SelectedTab = 2,
                  "Expenses, selected",
                  "Expenses"
              )
            BorderColor: =RGBA(0, 18, 107, 1)
            DisplayMode: |-
              =If(
                  cmp_Footer_3.DisplayMode,
                  DisplayMode.Edit,
                  DisplayMode.View
              )
            Fill: =RGBA(0, 0, 0, 0)
            FocusedBorderThickness: =0
            Height: =84
            HoverFill: =
            OnSelect: =Select(cmp_footer_img_Expenses_6)
            PressedFill: =
            TabIndex: =0
            Width: =Parent.Width/4
            X: =Self.Width
      - receiptRegion_1:
          Control: Rectangle@2.3.0
          Properties:
            AccessibleLabel: |-
              =If(
                  cmp_Footer_3.SelectedTab = 1,
                  "Receipts, selected",
                  "Receipts"
              )
            BorderColor: =RGBA(0, 18, 107, 1)
            DisplayMode: |-
              =If(
                  cmp_Footer_3.DisplayMode,
                  DisplayMode.Edit,
                  DisplayMode.View
              )
            Fill: =RGBA(0, 0, 0, 0)
            FocusedBorderThickness: =0
            Height: =84
            HoverFill: =
            OnSelect: =Select(cmp_footer_img_Receipts_6)
            PressedFill: =
            TabIndex: =0
            Width: =Parent.Width/4
      - reportsRegion_1:
          Control: Rectangle@2.3.0
          Properties:
            AccessibleLabel: |-
              =If(
                  cmp_Footer_3.SelectedTab = 3,
                  "Reports, selected",
                  "Reports"
              )
            BorderColor: =RGBA(0, 18, 107, 1)
            DisplayMode: |-
              =If(
                  cmp_Footer_3.DisplayMode,
                  DisplayMode.Edit,
                  DisplayMode.View
              )
            Fill: =RGBA(0, 0, 0, 0)
            FocusedBorderThickness: =0
            Height: =84
            HoverFill: =
            OnSelect: =Select(cmp_footer_img_Reports_6)
            PressedFill: =
            TabIndex: =0
            Width: =Parent.Width/4
            X: =2 * Self.Width
      - approvalsRegion_1:
          Control: Rectangle@2.3.0
          Properties:
            AccessibleLabel: |-
              =If(
                  cmp_Footer_3.SelectedTab = 4,
                  "Approvals, selected",
                  "Approvals"
              )
            BorderColor: =RGBA(0, 18, 107, 1)
            DisplayMode: |-
              =If(
                  cmp_Footer_3.DisplayMode,
                  DisplayMode.Edit,
                  DisplayMode.View
              )
            Fill: =RGBA(0, 0, 0, 0)
            FocusedBorderThickness: =0
            Height: =84
            HoverFill: =
            OnSelect: =Select(cmp_footer_img_Approvals)
            PressedFill: =
            TabIndex: =0
            Width: =Parent.Width/4
            X: =3 * Self.Width
