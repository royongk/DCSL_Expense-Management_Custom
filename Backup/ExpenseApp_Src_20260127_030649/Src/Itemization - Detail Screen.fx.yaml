"'Itemization - Detail Screen' As screen":
    Fill: =RGBA(244, 244, 244, 1)
    OnVisible: |-
        =UpdateContext({locDeleteCntrl : false});
        UpdateContext({locOpenItemizationChangesDialogBox : false});

    ItemizationFooterdetailscreen As ItemizationFooter:
        ButtonName: |-
            =GlobalLabels.Labels.'15062:LocalizedName,msdyn_DoneButtonLabel'
        ItemizedAmountLabel: |-
            =GlobalLabels.Labels.'15062:LocalizedName,msdyn_ItemizedAmountLabel'
        itemizedAmountValue: |-
            =If(
                !IsBlank(
                    Sum(
                        dsItemizations,
                        DailyRate * Quantity
                    )
                ),
                Concatenate(
                    Text(
                        Value(
                            Sum(
                                dsItemizations,
                                DailyRate * Quantity
                            )
                        ),
                        "#,#0.00",
                        varDefaultLanguage
                    ),
                    " ",
                    If(
                        varSelectedExpenseDoc.IsCreditcardTransactionInLocalCurrency = 'NoYes (mserp)'.No,
                    varSelectedExpenseDoc.'Currency (mserp_exchangecode)',
                    varSelectedExpenseDoc.'Local currency'
                    )
                ),
                Concatenate(
                    Text(
                        Value(0),
                        "#,#0.00",
                        varDefaultLanguage
                    ),
                    " ",
                    If(
                        varSelectedExpenseDoc.IsCreditcardTransactionInLocalCurrency = 'NoYes (mserp)'.No,
                    varSelectedExpenseDoc.'Currency (mserp_exchangecode)',
                    varSelectedExpenseDoc.'Local currency'
                    )
                )
            )
        OnButtonClick: |
            =UpdateContext({locItemizationError: Blank()});
            If(
                isDirtyItemization,
                'Expense lines (mserp)'.mserp_trvexpmobileexpenseentity_itemizeexpensequickly(
                    LookUp(
                        'Expense lines (mserp)',
                        'Expense transaction number (mserp_exptransnumber)' = varSelectedExpenseDoc.'Expense transaction number (mserp_exptransnumber)' && 'Company (mserp_company)' = varSelectedLegalEntity,
                        'Expense Line Expense Mobile Entity (mserp)'
                    ),
                    {itemizations: Text(JSON(dsItemizations))}
                )
            );
            
            Set(isDirtyItemization, false);
            
            // To get the refreshed values from the entity
            Set(
                varSelectedExpenseDoc,
                LookUp('Expense lines (mserp)','Expense transaction number (mserp_exptransnumber)' = varSelectedExpenseDoc.'Expense transaction number (mserp_exptransnumber)')
            );
            
            // populating base64 to show image on selection of expense
                Set(
                    varReceiptImage,
                    LookUp(
                        'Expense Mobile Attached Document Entity (mserp)',
                        EntRecId = Value(varSelectedExpenseDoc.AttachedReceiptId),
                        CapturedDocument
                    )
                );
                
            // collect policy violations
            If(
                varSelectedExpenseDoc.PolicyViolationCount,
                ClearCollect(
                    colPolViolations,
                    Split(
                        varSelectedExpenseDoc.PolicyViolationErrorMessage,
                        "~|~"
                    )
                );
                UpdateContext({varMaxViolationLevel: varSelectedExpenseDoc.PolicyViolationsLevel});
                UpdateContext({varNumViolation: varSelectedExpenseDoc.PolicyViolationCount}),
                Clear(colPolViolations);
                UpdateContext({varMaxViolationLevel: 0});
                UpdateContext({varNumViolation: 0})
            );
            Navigate(
                'Expenses - Edit Screen',
                ScreenTransition.None,
                {
                    varNavigatedFrom : varNavigatedFrom,
                    varMaxViolationLevel: varMaxViolationLevel,
                    varNumViolation: varNumViolation,
                    varRemainingAmount: 
                    If( 
                        varSelectedExpenseDoc.IsCreditcardTransactionInLocalCurrency = 'NoYes (mserp)'.No,
                        Value(
                            varSelectedExpenseDoc.'Transaction amount' - Sum(
                                dsItemizations,
                                DailyRate * Quantity
                            )
                        ),
                        Value(
                            varSelectedExpenseDoc.'Local amount' - Sum(
                                dsItemizations,
                                DailyRate * Quantity
                            )
                        )
                    )
                }
            );
        RemainingAmountLabel: |-
            =GlobalLabels.Labels.'15062:LocalizedName,msdyn_RemainingAmountLabel'
        RemainingAmountValue: |-
            =If(
                varSelectedExpenseDoc.IsCreditcardTransactionInLocalCurrency = 'NoYes (mserp)'.No,
                Concatenate(
                    Text(
                        Value(
                            varSelectedExpenseDoc.'Transaction amount' - Sum(
                                dsItemizations,
                                DailyRate * Quantity
                            )
                        ),
                        "#,#0.00",
                        varDefaultLanguage
                    ),
                    " ",
                    varSelectedExpenseDoc.'Currency (mserp_exchangecode)'
                ),
                Concatenate(
                    Text(
                        Value(
                            varSelectedExpenseDoc.'Local amount' - Sum(
                                dsItemizations,
                                DailyRate * Quantity
                            )
                        ),
                        "#,#0.00",
                        varDefaultLanguage
                    ),
                    " ",
                    varSelectedExpenseDoc.'Local currency'
                )
            )
        Y: =App.Height - Self.Height

    CreateImizationContainer As groupContainer.horizontalAutoLayoutContainer:
        DropShadow: =DropShadow.Regular
        Height: =App.Height * 0.0616
        LayoutGridColumns: =6
        LayoutGridRows: =6
        LayoutMode: =LayoutMode.Auto
        Visible: =!locDeleteCntrl
        Width: =App.Width * 0.625
        X: =App.Width / 2 - CreateItemizationButton.Width / 2
        Y: =ItemizedExpenseList.Y + ItemizedExpenseList.Height + 25
        ZIndex: =2

        CreateItemizationButton As button:
            Color: =RGBA(34, 102, 227, 1)
            Fill: =Color.White
            FontWeight: =FontWeight.Normal
            Height: =Parent.Height
            LayoutMaxHeight: =
            LayoutMaxWidth: =
            LayoutMinHeight: =70
            LayoutMinWidth: =280
            OnSelect: |-
                =Set(
                    gblCurrentItemizeExpense,
                    Blank()
                );
                Navigate('Itemization - Create Itemize Expense Screen',ScreenTransition.None,{locDuplicateItemizedExpense:false})
            Size: |-
                =//22
                If(
                    App.Width>App.Height,
                Parent.Width * 0.025,
                Parent.Height * 0.3
                )
            Text: |-
                =GlobalLabels.Labels.'15062:LocalizedName,msdyn_CreateNewItemizationLabel'
            Visible: =!locDeleteCntrl
            Width: =Parent.Width
            ZIndex: =1

    "ItemizedExpenseList As gallery.'BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0'":
        '#CopilotOverlayLabel': ="Filtered"
        DelayItemLoading: =true
        Fill: =Color.White
        Height: =Min(App.Height * 0.425, ItemizedExpenseList.TemplateHeight * ItemizedExpenseList.AllItemsCount)
        Items: =dsItemizations
        Layout: =Layout.Vertical
        LoadingSpinner: =LoadingSpinner.Data
        OnSelect: |-
            =Set(
                gblCurrentItemizeExpense , LookUp(dsItemizations, StartDate = ThisItem.StartDate && SubCategoryRecId = ThisItem.SubCategoryRecId)
            );
            Clear(colSelectedItemizedExpense);
            Reset(SelectItemizedExpenseCheckbox);
            Navigate('Itemization - Create Itemize Expense Screen',ScreenTransition.None,{locEditItemizeExpense: true})
        TemplatePadding: =0
        TemplateSize: =App.Height * 0.123
        Width: =App.Width
        Y: |-
            =If(!locDeleteCntrl,
            viewAllItemizedExpenseLabel.Y + viewAllItemizedExpenseLabel.Height,
            ItemizationDetailHeader.Height
            )
        ZIndex: =3

        SubCategoryName As label:
            BorderColor: =RGBA(0, 0, 0, 1)
            Color: =RGBA(71, 69, 64, 1)
            DisabledColor: =RGBA(186, 186, 186, 1)
            FontWeight: =FontWeight.Semibold
            Height: =Parent.TemplateHeight * 0.55
            OnSelect: =Select(Parent)
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =Parent.TemplateHeight * 0.157
            Text: =ThisItem.SubCategoryName
            Width: =App.Width - Self.X - AmountLabel.Width - NextArrow2.Width
            X: |-
                =If(locDeleteCntrl,
                  SelectItemizedExpenseCheckbox.X + SelectItemizedExpenseCheckbox.Width - 5,
                  App.Width * 0.0234 
                )
            Y: =Parent.TemplateHeight * 0.064
            ZIndex: =2

        TransactionDateSubcategory As label:
            BorderColor: =RGBA(0, 0, 0, 1)
            Color: =RGBA(71, 69, 64, 1)
            DisabledColor: =RGBA(186, 186, 186, 1)
            Height: =Parent.TemplateHeight * 0.25
            OnSelect: =Select(Parent)
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =Parent.TemplateHeight * 0.121
            Text: |-
                =Text(
                    DateValue(ThisItem.StartDate),
                    "dd mmm, yyyy"
                )
            VerticalAlign: =VerticalAlign.Top
            Width: =SubCategoryName.Width
            X: |-
                =If(locDeleteCntrl,
                  SelectItemizedExpenseCheckbox.X + SelectItemizedExpenseCheckbox.Width - 5,
                  App.Width * 0.0234 
                )
            Y: =SubCategoryName.Y + SubCategoryName.Height + Parent.TemplateHeight * 0.0286
            ZIndex: =3

        scr01_shp_Seprator_3 As rectangle:
            Fill: =RGBA(225, 225, 225, 1)
            Height: =1
            Width: =Parent.TemplateWidth
            Y: =Parent.TemplateHeight - 1
            ZIndex: =5

        AmountLabel As label:
            Align: =Align.Right
            FontWeight: =FontWeight.Bold
            Height: =Parent.TemplateHeight * 0.514
            OnSelect: =Select(Parent)
            Size: =Parent.TemplateHeight * 0.15
            Text: |-
                =Concatenate(Text(Value(ThisItem.DailyRate), "#,#0.00", varDefaultLanguage), " ", 
                If(
                            varSelectedExpenseDoc.IsCreditcardTransactionInLocalCurrency = 'NoYes (mserp)'.No,
                        varSelectedExpenseDoc.'Currency (mserp_exchangecode)',
                        varSelectedExpenseDoc.'Local currency'
                        )
                    )
            Width: =App.Width * 0.422
            X: =NextArrow2.X - Self.Width
            Y: =Parent.TemplateHeight * 0.064
            ZIndex: =6

        NoOfdaysLabel As label:
            Align: =Align.Right
            Height: =Parent.TemplateHeight * 0.342
            OnSelect: =Select(Parent)
            Size: =Parent.TemplateHeight * 0.15
            Text: |-
                =Substitute(GlobalLabels.Labels.'15062:LocalizedName,msdyn_DaysCountLabel'
                ,"$",ThisItem.Quantity)
            Width: =AmountLabel.Width
            X: =AmountLabel.X
            Y: =AmountLabel.Y + AmountLabel.Height + Parent.TemplateHeight * 0.0286
            ZIndex: =7

        NextArrow2 As icon.ChevronRight:
            AccessibleLabel: =Self.Tooltip
            BorderColor: =RGBA(0, 0, 0, 1)
            Color: =RGBA(110, 110, 110, 1)
            DisabledBorderColor: =RGBA(56, 56, 56, 1)
            DisabledColor: =RGBA(119, 119, 119, 1)
            Height: =Parent.TemplateHeight
            Icon: =Icon.ChevronRight
            OnSelect: =Select(Parent)
            PaddingBottom: =16
            PaddingLeft: =16
            PaddingRight: =16
            PaddingTop: =16
            Tooltip: ="View item details"
            Width: =App.Width * 0.0766
            X: =App.Width - Self.Width
            ZIndex: =8

        SelectItemizedExpenseCheckbox As checkbox:
            CheckboxBackgroundFill: =If(Self.Value, RGBA(34, 102, 227, 1),Color.White)
            CheckboxBorderColor: =RGBA(34, 102, 227, 1)
            CheckboxSize: =45
            CheckmarkFill: =Color.White
            FocusedBorderThickness: =0
            Height: =77
            OnCheck: |-
                =Collect(
                    colSelectedItemizedExpense, 
                    {subCategoryRecid : ThisItem.SubCategoryRecId,
                     startDate : ThisItem.StartDate
                    }
                )
            OnUncheck: |
                =RemoveIf(colSelectedItemizedExpense,
                    subCategoryRecid = ThisItem.SubCategoryRecId && startDate = ThisItem.StartDate
                )
            Reset: |-
                =
                If(locCrossControlClick,
                true,
                false
                )
            Size: =21
            Text: =""
            Visible: =locDeleteCntrl
            Width: =57
            X: =11
            Y: =28
            ZIndex: =9

    viewAllItemizedExpenseLabel As label:
        Color: |-
            =/*If(CountRows(dsItemizations)>0 ,
            RGBA(34, 102, 227, 1),
            gblParams.expenseDataCardViewOnly
            )*/
            RGBA(34, 102, 227, 1)
        FontWeight: =FontWeight.Semibold
        Height: =App.Height * 0.0379
        OnSelect: |-
            =UpdateContext({locItemizationError: Blank()});
            If(isDirtyItemization,
            IfError(
                'Expense lines (mserp)'.mserp_trvexpmobileexpenseentity_itemizeexpensequickly(
                    LookUp(
                        'Expense lines (mserp)',
                        'Expense transaction number (mserp_exptransnumber)' = varSelectedExpenseDoc.'Expense transaction number (mserp_exptransnumber)' && 'Company (mserp_company)' = varSelectedLegalEntity,
                        'Expense Line Expense Mobile Entity (mserp)'
                    ),
                    {itemizations: Text(JSON(dsItemizations))}
                ),
                UpdateContext({locItemizationError: JSON(FirstError.Details)});
                ,
                Refresh('Expense lines (mserp)');
                Set(isDirtyItemization, false);
            );
            );
            Navigate('Itemization - View All Itemize Expense Screen',Transition.None,{varNavigatedFrom : varNavigatedFrom,varItemizationScreen: varItemizationScreen});
            Set(isDirtyItemization, false);
            If(
                !IsBlank(locItemizationError),
                Notify(
                    Text(locItemizationError),
                    NotificationType.Error,
                    gblParams.notificationTime
                )
            )
        PaddingLeft: =15
        Size: =App.Height * 0.0159
        Text: |-
            =GlobalLabels.Labels.'15062:LocalizedName,msdyn_ViewAllItemizedExpenseLabel'
        Visible: =!locDeleteCntrl
        Width: =App.Width
        Wrap: =false
        Y: =ItemizationDetailHeader.Height
        ZIndex: =4

    "ItemizationDetailHeader As 'header-navigation-PolicyViolation_1'":
        Fill: =RGBA(255, 255, 255, 1)
        HeaderText: |-
            =GlobalLabels.Labels.'15062:LocalizedName,msdyn_ItemizationsLabel'
        OnBackIconSelect: |-
            =// populating base64 to show image on selection of expense
            If(!isDirtyItemization,
            
            // To get the refreshed values from the entity
            Set(
                varSelectedExpenseDoc,
                LookUp('Expense lines (mserp)','Expense transaction number (mserp_exptransnumber)' = varSelectedExpenseDoc.'Expense transaction number (mserp_exptransnumber)')
            );
            
            // populating base64 to show image on selection of expense
            Set(
                varReceiptImage,
                LookUp('Expense Mobile Attached Document Entity (mserp)', EntRecId = Value(varSelectedExpenseDoc.AttachedReceiptId),CapturedDocument) 
            );
            
            // collect policy violations
            If(
                varSelectedExpenseDoc.PolicyViolationCount,
                ClearCollect(
                    colPolViolations,
                    Split(varSelectedExpenseDoc.PolicyViolationErrorMessage, "~|~")
                );
                UpdateContext({varMaxViolationLevel : varSelectedExpenseDoc.PolicyViolationsLevel});
                UpdateContext({varNumViolation : varSelectedExpenseDoc.PolicyViolationCount}),
                Clear(colPolViolations);
                UpdateContext({varMaxViolationLevel : 0});
                UpdateContext({varNumViolation : 0})
            );
            
            Navigate('Expenses - Edit Screen', ScreenTransition.None, 
            {
                varNavigatedFrom : varNavigatedFrom, 
                varMaxViolationLevel : varMaxViolationLevel, 
                varNumViolation: varNumViolation, 
                varRemainingAmount: If( 
                        varSelectedExpenseDoc.IsCreditcardTransactionInLocalCurrency = 'NoYes (mserp)'.No,
                        Value(
                            varSelectedExpenseDoc.'Transaction amount' - Sum(
                                dsItemizations,
                                DailyRate * Quantity
                            )
                        ),
                        Value(
                            varSelectedExpenseDoc.'Local amount' - Sum(
                                dsItemizations,
                                DailyRate * Quantity
                            )
                        )
                    )
                }
            ),
            
            // This variable controls the opening of the Dailog box when certain itemizations changes are done.
            UpdateContext({locOpenItemizationChangesDialogBox : true});
            )
        Width: =App.Width
        ZIndex: =5

    cmp02_ConfirmationDialog_5 As cmp02_ConfirmationDialog:
        controlName: ="cmp02_ConfirmationDialog_5"
        OnLeftButtonClick: |-
            =// To get the refreshed values from the entity
            Set(
                varSelectedExpenseDoc,
                LookUp('Expense lines (mserp)','Expense transaction number (mserp_exptransnumber)' = varSelectedExpenseDoc.'Expense transaction number (mserp_exptransnumber)')
            );
            
            // populating base64 to show image on selection of expense
            Set(
                varReceiptImage,
                LookUp('Expense Mobile Attached Document Entity (mserp)', EntRecId = Value(varSelectedExpenseDoc.AttachedReceiptId),CapturedDocument) 
            );
            
            // collect policy violations
            If(
                varSelectedExpenseDoc.PolicyViolationCount,
                ClearCollect(
                    colPolViolations,
                    Split(varSelectedExpenseDoc.PolicyViolationErrorMessage, "~|~")
                );
                UpdateContext({varMaxViolationLevel : varSelectedExpenseDoc.PolicyViolationsLevel});
                UpdateContext({varNumViolation : varSelectedExpenseDoc.PolicyViolationCount}),
                Clear(colPolViolations);
                UpdateContext({varMaxViolationLevel : 0});
                UpdateContext({varNumViolation : 0})
            );
            
            Set(isDirtyItemization, false);
            
            Navigate('Expenses - Edit Screen', ScreenTransition.None, {varNavigatedFrom : Blank(), varMaxViolationLevel : varMaxViolationLevel, varNumViolation: varNumViolation})
        OnRightButtonClick: |-
            =UpdateContext({locOpenItemizationChangesDialogBox : false});
        parmInDescriptionText: |-
            =GlobalLabels.Labels.'15062:LocalizedName,msdyn_ThereAreUnsavedChangesLabel'
        parmInHeaderText: |-
            =GlobalLabels.Labels.'15062:LocalizedName,msdyn_UnsavedChangesLabel'
        parmInLeftButtonColor: =RGBA(195, 39, 39, 1)
        parmInLeftButtonText: |-
            =GlobalLabels.Labels.'15062:LocalizedName,msdyn_LeaveLabel'
        parmInRightButtonColor: =RGBA(34, 102, 227, 1)
        parmInRightButtonText: |-
            =GlobalLabels.Labels.'15062:LocalizedName,msdyn_CancelLabel'
        returnFocus: ="ItemizationDetailHeader"
        Visible: =locOpenItemizationChangesDialogBox
        Y: =0
        ZIndex: =11

    HeaderButtons As group:
        Height: =5
        Width: =5
        X: =40
        Y: =40
        ZIndex: =11

        DeleteDisableImage As image:
            Height: =SelectorImage.Height
            Image: =DeleteIconDisabled
            Width: =SelectorImage.Width
            X: =SelectorImage.X + SelectorImage.Width * 3 / 2
            Y: =SelectorImage.Y
            ZIndex: =6

        SelectorImage As image:
            AccessibleLabel: ="Select itemized expense"
            Height: =ItemizationDetailHeader.Height / 2
            Image: =SelectorIcon
            OnSelect: |-
                =UpdateContext({locDeleteCntrl : true});
                UpdateContext({locCrossControlClick : false})
            TabIndex: =0
            Visible: =!locDeleteCntrl
            Width: =App.Width * 0.0531
            X: =App.Width * 0.797
            Y: =ItemizationDetailHeader.Height / 2 - SelectorImage.Height / 2
            ZIndex: =7

        SelectorCloseImage As image:
            AccessibleLabel: ="close selector"
            Height: =SelectorImage.Height
            Image: =SelectorCloseIcon
            OnSelect: |-
                =UpdateContext({locDeleteCntrl : false});
                Clear(colSelectedItemizedExpense);
                UpdateContext({locCrossControlClick : true})
            TabIndex: =0
            Visible: =locDeleteCntrl
            Width: =SelectorImage.Width
            X: =SelectorImage.X
            Y: =SelectorImage.Y
            ZIndex: =8

        DeleteEnabledImage As image:
            AccessibleLabel: ="Delete Button"
            Height: =SelectorImage.Height
            Image: =DeleteIconEnabled
            OnSelect: |-
                =ForAll(
                    colSelectedItemizedExpense,
                    RemoveIf(dsItemizations,
                    StartDate = colSelectedItemizedExpense[@startDate] && SubCategoryRecId = colSelectedItemizedExpense[@subCategoryRecid])
                );
                Clear(colSelectedItemizedExpense);
                UpdateContext({locDeleteCntrl : false});
                Set(isDirtyItemization, true)
            TabIndex: =0
            Visible: =CountRows(colSelectedItemizedExpense) > 0
            Width: =SelectorImage.Width
            X: =DeleteDisableImage.X
            Y: =SelectorImage.Y
            ZIndex: =9

