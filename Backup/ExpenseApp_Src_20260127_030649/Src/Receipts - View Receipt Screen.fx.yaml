"'Receipts - View Receipt Screen' As screen":
    Fill: =RGBA(229, 229, 229, 1)
    OnVisible: |-
        =//UpdateContext({varCntShowConfirmationDialog:false})
        Set(varCntShowConfirmationDialog,false)

    imageView_footer_rectangle_3 As rectangle:
        Fill: =RGBA(37, 36, 35, 1)
        Height: =278
        Width: =Max(App.Width, App.MinScreenWidth)
        Y: =Parent.Height - Self.Height
        ZIndex: =1

    scr14_btn_Done As button:
        BorderColor: =RGBA(255, 255, 255, 1)
        BorderThickness: =3
        Fill: =RGBA(33, 33, 33, 1)
        Height: =88
        HoverColor: =Self.Color
        HoverFill: =Self.Fill
        OnSelect: |-
            =Navigate('Receipts - List Screen',ScreenTransition.Fade,{varCntSelect:varCntSelect})
        PressedBorderColor: =Self.BorderColor
        PressedColor: =Self.Color
        PressedFill: =Self.Fill
        Size: =22
        Text: |-
            =GlobalLabels.Labels.'15062:LocalizedName,msdyn_DoneButtonLabel'
        Width: =Parent.Width - Self.X*2
        X: =30
        Y: =scr14_btn_AttachToExpense.Y + scr14_btn_AttachToExpense.Height + 30
        ZIndex: =2

    scr14_btn_AttachToExpense As button:
        Fill: =RGBA(34, 102, 227, 1)
        Height: =87
        OnSelect: |-
            =If(
                !IsBlank(varReceiptImage),
                Navigate(
                    'Receipts - Select Expense Screen',
                    ScreenTransition.None
                ),
                Notify(
                    GlobalLabels.Labels.'15062:LocalizedName,msdyn_InvalidReceiptLabel',
                    NotificationType.Error,
                    gblParams.notificationTime
                )
            )
        Size: =24
        Text: |-
            =GlobalLabels.Labels.'15062:LocalizedName,msdyn_AttachToAnExpenseLabel'
        Width: =Parent.Width - Self.X*2
        X: =30
        Y: =imageView_footer_rectangle_3.Y + 25
        ZIndex: =3

    scr14_lbl_NoPreview As label:
        Align: =Align.Center
        Font: =Font.'Segoe UI'
        Height: =64
        Size: =18
        Text: |-
            =GlobalLabels.Labels.'15062:LocalizedName,msdyn_FilePreviewNotSupportedLabel'
        Visible: =!(scr14_pdfViewer.Visible || scr14_img_Receipt.Visible)
        Width: =406     
        X: =(Parent.Width - Self.Width)/2
        Y: =scr14_img_NoPreview.Y + scr14_img_NoPreview.Height + 10
        ZIndex: =4

    scr14_img_NoPreview As image:
        Height: =85
        Image: |-
            =If(
                varFileFormat in ["xlsx", "xls"],
                IconExcel,
                varFileFormat in ["docx", "doc"],
                IconWord,
                varFileFormat = "txt",
                IconTxt,
                IconMail
            )
        Visible: =scr14_lbl_NoPreview.Visible
        Width: =85
        X: =(Parent.Width - Self.Width)/2
        Y: =scr14_img_Receipt.Y + (scr14_img_Receipt.Height - Self.Height)/2
        ZIndex: =5

    scr14_img_Receipt As image:
        Height: =imageView_footer_rectangle_3.Y - Self.Y
        Image: =varReceiptImage
        Visible: =varFileFormat in ["jpeg","png","jpg","bmp","tiff"] && !IsBlank(varReceiptImage)
        Width: =Parent.Width
        Y: =scr14_hdr_TopHeader.Height
        ZIndex: =6

    scr14_pdfViewer As pdfViewer:
        BorderColor: =RGBA(0, 0, 0, 1)
        Document: =varReceiptImage
        Fill: =RGBA(0, 0, 0, 0.5)
        Height: =scr14_img_Receipt.Height
        Visible: =varFileFormat = "pdf" && !IsBlank(varReceiptImage)
        Width: =Parent.Width
        X: =scr14_img_Receipt.X
        Y: =scr14_img_Receipt.Y
        ZIndex: =7

    scr14_hdr_TopHeader As hdr02_Header:
        Fill: =scr14_hdr_TopHeader.paramFill
        paramColor: =RGBA(255, 255, 255, 1)
        paramFill: |
            =RGBA(33, 33, 33, 1)
        paramTitle: |-
            =GlobalLabels.Labels.'15062:LocalizedName,msdyn_ViewReceiptLabel'
        ZIndex: =8

    scr14_lbl_Discard As label:
        Align: =Align.Center
        Color: =RGBA(255, 255, 255, 1)
        Font: =Font.'Segoe UI'
        Height: =82
        OnSelect: |-
            =//UpdateContext({varCntShowConfirmationDialog:true})
            Set(varCntShowConfirmationDialog,true)
        Size: =21
        TabIndex: =0
        Text: |-
            =GlobalLabels.Labels.'15062:LocalizedName,msdyn_DiscardLabel'
        Width: =193
        X: =Parent.Width - Self.Width
        ZIndex: =9

    scr14_ico_Back As icon.ChevronLeft:
        AccessibleLabel: ="Press to go back"
        Color: =Color.White
        Fill: =icongconfig_backbutton.Fill
        Height: =icongconfig_backbutton.Height
        Icon: =Icon.ChevronLeft
        OnSelect: |-
            =Navigate('Receipts - List Screen',ScreenTransition.Fade,{varCntSelect:varCntSelect})
        TabIndex: =0
        Width: =icongconfig_backbutton.Width
        X: =8.5*Value(lbconfig_resolution_factor.Text)
        Y: =(scr02_hdr_TopHeader.Height-Self.Height)/2
        ZIndex: =10

    cmp02_ConfirmationDialog_2 As cmp02_ConfirmationDialog:
        controlName: ="cmp02_ConfirmationDialog_2"
        OnLeftButtonClick: |-
            =//UpdateContext({varCntShowConfirmationDialog:false});
            Set(varCntShowConfirmationDialog,false)
        OnRightButtonClick: |-
            =Set(varCntShowConfirmationDialog,false);
            
            
            IfError(
                Remove(
                    'Expense Mobile Unattached Document Entity (mserp)',
                    LookUp(
                        'Expense Mobile Unattached Document Entity (mserp)',
                        EntRecId = Value(varSelectedReceiptNumber)
                                    )
                ),
                Collect(
                    deleteReceiptError,
                    {
                        message : Last(Split(FirstError.Message, ":")).Value
                    }
                )   
            );       
            
            If(
                CountRows(deleteReceiptError) = 0,
                Notify(
                    GlobalLabels.Labels.'15062:LocalizedName,msdyn_ReceiptDiscardedSuccessfullyLabel',
                    NotificationType.Success, 
                    gblParams.notificationTime
                ),
                ForAll(
                    Distinct(deleteReceiptError,message),
                    Notify(
                        ThisRecord.Value,
                        NotificationType.Error , 
                        gblParams.notificationTime
                    )
                )
            );
            
            Concurrent(
                Set(
                    varSelectedReceiptNumber, 
                    Blank()
                    ),
                Set(varFileFormat, Blank())
            );
            Navigate('Receipts - List Screen')
        parmInDescriptionText: ="Are you sure you want to parmanently delete this receipt?"
        parmInHeaderText: |-
            =GlobalLabels.Labels.'15062:LocalizedName,msdyn_DeleteSelectedReceiptsHeaderLabel'
        parmInLeftButtonColor: =RGBA(34, 102, 227, 1)
        parmInLeftButtonText: |-
            =GlobalLabels.Labels.'15062:LocalizedName,msdyn_CancelLabel'
        parmInRightButtonColor: =RGBA(195, 39, 39, 1)
        parmInRightButtonText: |-
            =GlobalLabels.Labels.'15062:LocalizedName,msdyn_DeleteLabel'
        returnFocus: ="scr14_lbl_Discard"
        Visible: =varCntShowConfirmationDialog
        Y: =0
        ZIndex: =11

