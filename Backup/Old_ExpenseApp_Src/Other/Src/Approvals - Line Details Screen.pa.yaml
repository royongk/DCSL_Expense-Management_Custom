                  Visible: =currExpenseType = 'TrvExpType (mserp)'.Entertainment || currExpenseType = 'TrvExpType (mserp)'.'Gift certificates/Tangible gifts' || currExpenseType = 'TrvExpType (mserp)'.Meals
