                        AddColumns(
                            Filter([@'PerDiem Data for Expense Lines for Line Approvals (mserp)'],'Expense transaction number' = varSelectedLineItem.'Expense transaction number (mserp_exptransnumber)' && User = userRecord.ID),
                            isGalleryVisible,
