Screens:
  Approvals - Line Details Screen:
    Properties:
      Fill: =RGBA(244, 244, 244, 1)
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: "=UpdateContext(\n    {\n        featureEnabled :\n        If(userRecord.IsReimaginedUIEnabled = 'NoYes (mserp)'.Yes, \"True\", \"False\")\n    }\n);\nIf(\n    CountRows(labelTableLookUp) <= 0,\n    Collect(\n        labelTableLookUp,\n        {\n            fieldName : \"CostType\",\n            labelName : \"Expense category\",\n            localisedLabelName : GlobalLabels.Labels.'15062:LocalizedName,msdyn_ExpenseCategoryLabel',\n            visible : true,\n            required : true\n        },\n        {\n            fieldName : \"TransDate\",\n            labelName : \"Transaction date\",\n            localisedLabelName : GlobalLabels.Labels.'15062:LocalizedName,msdyn_TransactionDateLabel',\n            visible : true,\n            required : true\n        },\n        {\n            fieldName : \"AmountCurr\",\n            labelName : \"Transaction amount\",\n            localisedLabelName : GlobalLabels.Labels.'15062:LocalizedName,msdyn_TransactionAmountLabel',\n            visible : true,\n            required : true\n        },\n        {\n            fieldName : \"ExchangeCode\",\n            labelName : \"Currency\",\n            localisedLabelName : GlobalLabels.Labels.'15062:LocalizedName,msdyn_CurrencyLabel',\n            visible : true,\n            required : true\n        },\n        {\n            fieldName : \"PayMethod\",\n            labelName : \"Payment method\",\n            localisedLabelName : GlobalLabels.Labels.'15062:LocalizedName,msdyn_PaymentMethodLabel',\n            visible : true,\n            required : true\n        },\n        {\n            fieldName : \"SubmitterJustification\",\n            labelName : \"Employee justification\",\n            localisedLabelName : GlobalLabels.Labels.'15062:LocalizedName,msdyn_EmployeeJustificationLabel',\n            visible : false,\n            required : false\n        }\n    );\n    ForAll(\n            Filter('@ExpenseManagement:ExpenseMobileFieldVisibilityEntity (mserp)',LegalEntityId = varSelectedLegalEntity) As VisibilityTable,\n            Collect(\n                labelTableLookUp,\n                {\n                    fieldName : VisibilityTable.FieldName,\n                    labelName : VisibilityTable.Labels,\n                    localisedLabelName : VisibilityTable.LocalisedLabelName\n                }\n            )\n        );\n    If(\n        featureEnabled = \"True\",\n        ForAll(\n            Filter('@ExpenseManagement:ExpenseMobileFieldVisibilityEntity (mserp)',LegalEntityId = varSelectedLegalEntity) As VisibilityTable,\n            Patch(\n                labelTableLookUp,\n                LookUp(labelTableLookUp,fieldName = VisibilityTable.FieldName),\n                {\n                    visible : VisibilityTable.VisibilityType <> 'ExpenseFieldVisibilityType (mserp)'.'Do not display',\n                    required : VisibilityTable.VisibilityType = 'ExpenseFieldVisibilityType (mserp)'.Required\n                }\n            )\n        ),\n        ForAll(\n            Filter('Display fields (mserp)', 'Company Code' = varSelectedLegalEntity) As VisibilityTable,\n            Patch(\n                labelTableLookUp,\n                LookUp(labelTableLookUp,fieldName = VisibilityTable.FieldName),\n                {\n                    visible : VisibilityTable.Visibility <> 'Visibility (mserp)'.'Do not display',\n                    required : false\n                }\n            )\n        )\n   \n    )\n);\nUpdateContext(\n    {\n        currExpenseType : Coalesce(varSelectedLineItem.'Expense type', LookUp([@'Expense category (mserp)'],'Expense category' = ComboBox1_52.Selected.'Expense category','Expense type'))\n    }\n)"
    Children:
      - scr22_shp_Rectangle_1:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =Color.White
            Height: =115
            Visible: =false
            Width: |
              =Parent.Width
            Y: =scr22_hdr_TopHeader_1.Height + scr22_btn_TabView_1.Height - 2
      - scr22_cmp_ApprovalsFooter_1:
          Control: CanvasComponent
          ComponentName: cmp_ApprovalsFooter_1
          Properties:
            ApprovalText: =Upper(GlobalLabels.Labels.'15062:LocalizedName,msdyn_ApproveLabel')
            DelegateText: =Upper(GlobalLabels.Labels.'15062:LocalizedName,msdyn_DelegateLabel')
            DisplayMode: =true
            Fill: =RGBA(250, 249, 248, 1)
            Height: =135
            IsDelegateVisible: =true
            OnApprovalsButtonClick: |-
              =Navigate('Approvals - Line Action Screen', ScreenTransition.None, {varAction : 1, varNavigatedFrom: "scr22"});
            OnDelegateButtonClick: |-
              =Navigate('Approvals - Line Delegate Screen', ScreenTransition.None, {varNavigatedFrom : "scr22"})
            OnRejectButtonClick: |-
              =Navigate('Approvals - Line Action Screen', ScreenTransition.None, {varAction : 2, varNavigatedFrom: "scr22"});
            RejectText: =Upper(GlobalLabels.Labels.'15062:LocalizedName,msdyn_RejectLabel')
            Width: =Max(App.Width, App.MinScreenWidth)
            Y: =Parent.Height - Self.Height
            paramInDefaultSelectedTab: =2
