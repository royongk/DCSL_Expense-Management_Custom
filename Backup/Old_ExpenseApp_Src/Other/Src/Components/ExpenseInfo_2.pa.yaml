ComponentDefinitions:
  ExpenseInfo_2:
    DefinitionType: CanvasComponent
    CustomProperties:
      Amount1:
        PropertyKind: Input
        DisplayName: Amount1
        Description: A custom property
        DataType: Text
        Default: ="Text"
      Amount2:
        PropertyKind: Input
        DisplayName: Amount2
        Description: A custom property
        DataType: Text
        Default: ="Text"
      CostType:
        PropertyKind: Input
        DisplayName: CostType
        Description: Expense Category
        DataType: Text
        Default: ="Text"
      Currency1:
        PropertyKind: Input
        DisplayName: Currency1
        Description: A custom property
        DataType: Text
        Default: ="Text"
      Currency2:
        PropertyKind: Input
        DisplayName: Currency2
        Description: A custom property
        DataType: Text
        Default: ="Text"
      HeaderText1:
        PropertyKind: Input
        DisplayName: HeaderText1
        Description: A custom property
        DataType: Text
        Default: ="Text"
      HeaderText2:
        PropertyKind: Input
        DisplayName: HeaderText2
        Description: A custom property
        DataType: Text
        Default: ="Text"
      IconVisibleFlag:
        PropertyKind: Input
        DisplayName: IconVisibleFlag
        Description: A custom property
        DataType: Boolean
        Default: =true
      Mileage:
        PropertyKind: Input
        DisplayName: Mileage
        Description: Distance Travelled
        DataType: Text
        Default: ="Text"
      NoOfPassengers:
        PropertyKind: Input
        DisplayName: NoOfPassengers
        Description: Number of Passengers as per the rate tier setup.
        DataType: Text
        Default: ="Text"
      OnReload:
        PropertyKind: Event
        DisplayName: OnReload
        Description: A custom property
        ReturnType: Text
        Default: ="Text"
      RowId:
        PropertyKind: Input
        DisplayName: RowId
        Description: Rowid of the entity
        DataType: Text
        Default: ="Text"
      TransactionDate:
        PropertyKind: Input
        DisplayName: TransactionDate
        Description: Transaction date of the expense
        DataType: Text
        Default: ="Text"
      VehicleType:
        PropertyKind: Input
        DisplayName: VehicleType
        Description: Vehicle Type as per rate tier setup.
        DataType: Text
        Default: ="Text"
    Properties:
      Fill: =RGBA(231, 231, 231, 0.8)
      Height: =180
      Width: =Max(App.Width, App.MinScreenWidth)
    Children:
      - HeaderText1_1:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Height: =52
            Text: =ExpenseInfo_2.HeaderText1
            Width: =205
            X: |-
              =If(Icon6_1.Visible,
              Icon6_1.X + Icon6_1.Width + 5,
              25
              )
      - HeaderText2_1:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Height: =56
            Text: =ExpenseInfo_2.HeaderText2
            Width: =233
            X: |-
              =If(Icon6_1.Visible,
              Icon6_1.X + Icon6_1.Width + 5,
              25
              )
            Y: =45
      - Amount1_1:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Right
            BorderColor: =RGBA(0, 18, 107, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Height: =61
            Text: =ExpenseInfo_2.Amount1
            Width: =229
            X: =Currency1_1.X - Amount1_1.Width
      - Currency1_1:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Height: =61
            Text: =ExpenseInfo_2.Currency1
            Width: =99
            X: =524
      - Amount2_1:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Right
            BorderColor: =RGBA(0, 18, 107, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Text: =ExpenseInfo_2.Amount2
            Width: =229
            X: =Currency2_1.X - Amount2_1.Width
            Y: =38
      - Currency2_1:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Text: =ExpenseInfo_2.Currency2
            Width: =82
            X: =524
            Y: =38
      - Icon6_1:
          Control: Classic/Icon@2.5.0
          Properties:
            AccessibleLabel: ="Refresh"
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(0, 18, 107, 1)
            Height: =37
            Icon: =Icon.Sync
            OnSelect: =ExpenseInfo_2.OnReload()
            Visible: =ExpenseInfo_2.IconVisibleFlag
            Width: =33
            X: =14
            Y: =HeaderText2_1.Y + (HeaderText2_1.Y - HeaderText1_1.Y - HeaderText1_1.Height)*2
