      - scr01_hdr_TopHeader_1:
          Control: CanvasComponent
          ComponentName: main-app-header
          Properties:
            Fill: =Color.White
            Height: =85
            OnSelectButton: |
              =Set(
                  gblNavigationDrawerVisibility,
                  true
              );
              Set(
                  gblScreenName,
                  'Expenses - List Screen_Custom'
              );
              Refresh('Expense mobile notifications (mserp)');
              ClearCollect(
                  colExpenseNoticationInfo,
                  ForAll(
                      Filter('Expense mobile notifications (mserp)',NotifiedEmailId = User().Email) As ExpenseNotification,
                      {
                          RecId: ExpenseNotification.EntRecId,
                          ReadMessage: ExpenseNotification.Read
                      }
                  )
              );
            Width: =Max(App.Width, App.MinScreenWidth)
            firstIcon: =If(CountRows(collSelectedExpenseIds)=0, AttachIconDisabled,AttachIconEnabled)
            firstIconAccessibleLabel: =If(Self.firstIcon = AttachIconEnabled, "Attach to report", "Disabled attach to report")
            firstIconAction: |-
              =If(
                  CountRows(collSelectedExpenseIds) > 0,
                  Navigate('Expenses - Select Report Screen')
              )
            paramAvatar: =Coalesce(userImage, blankImage)
            paramTitle: =GlobalLabels_1.Labels.'15062:LocalizedName,msdyn_ExpensesLabel'
            refreshIconAction: |-
              =//set default first screen to expense list screen
              Set(
                  varSelectedTab,
                  2
              );

              Set(   
                  userRecord,
                  LookUp('Expense mobile master data (mserp)',Email = User().Email)
              );
              Set(
                  varDefaultSalesTaxGroupUserContext,
                  userRecord.WorkerDefaultTaxGroup
              );
              Set(
                  varDefaultLegalEntity,
                  userRecord.UserPreferredLegalEntity
              );
              Set(
                  varDefaultLanguage,
                  userRecord.UserPreferredLanguage
              );
              If(
                  LookUp('Legal entities (mserp)',Company = varDefaultLegalEntity,IsEmployed) = 'NoYes (mserp)'.Yes,
                  Set(
                      varSelectedLegalEntity, Upper(Text(varDefaultLegalEntity))
                  ),
                  Set(
                      varSelectedLegalEntity, Blank()
                  )
              );
              ClearCollect(
                  collectionICLE,
                  ForAll(
                  Split(LookUp('Legal entities (mserp)', Upper(Company) = varSelectedLegalEntity,IntercompanyLEs), ",") As legalEntityAlias,
                  {
                      Value: Upper(legalEntityAlias.Value)
                  }
                  )
              );
              If(
                  !IsBlank(varSelectedLegalEntity),
                  Set(
                      varDefaultCurrency,
                      LookUp('Legal entities (mserp)',Company = varSelectedLegalEntity, Currency)
                  )
              );
              Refresh('Expense lines (mserp)');
              Refresh('Expense management parameters (mserp)');
            secondIcon: =If(CountRows(collSelectedExpenseIds)=0, DeleteIconDisabled,DeleteIconEnabled)
            secondIconAccessibleLabel: =If(Self.secondIcon = DeleteIconEnabled, "Delete expenses", "Disabled delete")
            secondIconAction: |-
              =If(
                  CountRows(collSelectedExpenseIds) > 0,
                  UpdateContext({varCntDelete: true})
              )
            thirdIcon: =If(varCntSelect,SelectorCloseIcon,SelectorIcon)
            thirdIconAccessibleLabel: =If(Self.thirdIcon = SelectorIcon, "Multiselect expenses", "Cancel")
            thirdIconAction: |-
              =If(
                  varCntSelect,
                  UpdateContext({varCntSelect: false});
                  Clear(collSelectedExpenseIds),
                  UpdateContext({varCntSelect: true})
              )
      - scr01_btn_CreateNewReport_1:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(30, 144, 255, 1)
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            DisabledColor: =RGBA(172, 172, 172, 1)
            DisabledFill: =RGBA(225, 225, 225, 1)
            DisplayMode: |-
              =If(
                  !IsBlank(varSelectedLegalEntity),
                  DisplayMode.Edit,
                  DisplayMode.View
              )
            Fill: =RGBA(34, 102, 227, 1)
            Font: =Font.'Open Sans'
            Height: =83
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            OnSelect: |-
              =Trace(
                  "Expense canvas app log",
                  TraceSeverity.Information,
                  {
                      UserName: User().FullName,
                      UserEmail: User().Email,
                      Screen: 'Expenses - List Screen_Custom'.Name,
                      Message: "Clicked Create expense report button"
                  }
              );
              IfError(
                  Set(
                      varSelectedReport,
                      Patch(
                          'Expense reports (mserp)',
                          Defaults('Expense reports (mserp)'),
                          {
                              'Legal entity for expenses': varSelectedLegalEntity
                          }
                      )
                  ),
                  UpdateContext(
                      {
                          varCreateReportError : 
                          Substitute(
                              Match(FirstError.Details.HttpResponse, """message"":""([^""]*)""").FullMatch, 
                              """message"":", 
                              ""
                          )
                      }
                  )
              );
              If(
                  IsBlank(varCreateReportError),
                  Set(
                      varSelectedReport,
                      Patch(
                          'Expense reports (mserp)',
                          varSelectedReport,
                          {
                              ExpTransNumber: Concat(collSelectedExpenseIds, transactionId, ",")
                          }
                      )
                  );
                  Reset(ComboBox_Location);
                  Reset(ComboBox_Purpose);
                  Reset(scr17_txt_Description_1);
                  Set(
                      varIsCreateReport,
                      false
                  );
                  Set(
                      varSelectedReportStatusItem,
                      varSelectedReport.'Document status'
                  );
                  Clear(colAttachedExpensesForReport);
                  ForAll(
                      Split(varSelectedReport.ExpTransNumber, ",") As attachedExpenses,
                      Collect(
                          colAttachedExpensesForReport,
                          LookUp('Expense lines (mserp)','Expense transaction number (mserp_exptransnumber)' = attachedExpenses[@Value] && 'Expense line type' <> 'Expense line type (mserp)'.'Itemized line')
                      )
                  );
                  ClearCollect(
                      colAttachedExpenses,
                      colAttachedExpensesForReport
                  );
                  Refresh('Expense lines (mserp)');
                  Navigate('Reports - Edit Screen', ScreenTransition.None),
                  Notify(
                      Substitute(varCreateReportError, """", ""),
                      NotificationType.Error,
                      gblParams.notificationTime
                  )
              );
              UpdateContext({varCreateReportError:Blank()});
              UpdateContext({varCntSelect:false});
              Clear(collSelectedExpenseIds);
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Size: =18
            Text: |
              ="Create expense report"
            Visible: =varCntSelect
            Width: |
              =Parent.Width -  Self.X*2
            X: =40
            Y: =scr01_shp_BaseRectangle_1.Y + (scr01_shp_BaseRectangle_1.Height - Self.Height)/2
      - cmp02_DeleteConfirmationDialog_1:
          Control: CanvasComponent
          ComponentName: cmp02_ConfirmationDialog
          Properties:
            Height: =App.Height
            LegalEntity: ="Text"
            OnLeftButtonClick: |-
              = UpdateContext({varCntDelete: false});
            OnRightButtonClick: |-
              =Clear(deleteErrorsList);

              // Deleting the selected reports
              ForAll(
                  collSelectedExpenseIds,
                  IfError(
                      Remove(
                          'Expense lines (mserp)',
                          LookUp(
                              'Expense lines (mserp)',
                              'Expense transaction number (mserp_exptransnumber)' = collSelectedExpenseIds[@transactionId]
                          )
                      ),
                      Collect(
                          deleteErrorsList,
                          {
                              message : Last(Split(FirstError.Message, ":")).Value
                          }
                      )
                  )
              );
              If(
                  CountRows(deleteErrorsList) = 0,
                  Notify(
                      GlobalLabels_1.Labels.'15062:LocalizedName,msdyn_ExpenseDeleteMessageLabel',
                      NotificationType.Success,
                      gblParams.notificationTime
                  ),
                  ForAll(
                      Distinct(deleteErrorsList,message),
                      Notify(
                          ThisRecord.Value,
                          NotificationType.Error,
                          gblParams.notificationTime
                      )
                  )
              );

              UpdateContext({varCntDelete: false});
              UpdateContext({varCntSelect: false});
              Clear(collSelectedExpenseIds);
            SelectedExpense: =
            SelectedList: ="Text"
            SelectedReceiptNumber: =
            Visible: =varCntDelete
            Width: =Max(App.Width, App.MinScreenWidth)
            controlName: ="cmp02_DeleteConfirmationDialog"
            parmInDescriptionText: =GlobalLabels_1.Labels.'15062:LocalizedName,msdyn_ConfirmExpenseDeletionLabel'
            parmInHeaderText: =GlobalLabels_1.Labels.'15062:LocalizedName,msdyn_DeleteSelectedExpensesLabel'
            parmInLeftButtonColor: =RGBA(34, 102, 227, 1)
            parmInLeftButtonText: =GlobalLabels_1.Labels.'15062:LocalizedName,msdyn_CancelLabel'
            parmInRightButtonColor: =RGBA(195, 39, 39, 1)
            parmInRightButtonText: =GlobalLabels_1.Labels.'15062:LocalizedName,msdyn_DeleteLabel'
            returnFocus: ="scr01_hdr_TopHeader"
