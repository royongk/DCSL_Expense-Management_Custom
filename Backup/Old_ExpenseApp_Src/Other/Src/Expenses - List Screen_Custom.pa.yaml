              RGBA(248, 248, 248, 0.6)
            Height: =App.Height
            OnSelect: |-
              =Set(
                  gblNavigationDrawerVisibility,
                  false
              )
            Visible: =gblNavigationDrawerVisibility
            Width: =App.Width
