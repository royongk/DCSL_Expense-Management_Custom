Screens:
  Receipts - Capture Receipt Screen:
    Properties:
      Fill: =RGBA(255, 255, 255, 1)
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |-
        =Set(varReceiptImage, Blank());
        Set(varFileFormat, Blank());
        UpdateContext({varCam : LookUp(bsea_cam_ReceiptClick.AvailableDevices, "back" in Lower(Name) || "rear" in Lower(Name), Id)})
    Children:
      - imageCapture_footer_rectangle_1:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =RGBA(33, 33, 33, 1)
            Height: |
              =290//Max(App.Height, App.MinScreenHeight)/5
            Width: =Max(App.Width, App.MinScreenWidth)
            Y: =Parent.Height - Self.Height
      - attachmentControl - Receipt:
          Control: Attachments@2.3.0
          Properties:
            AccessibleLabel: ="Select receipt from device"
            AddAttachmentColor: =Color.Red
            AddAttachmentText: =GlobalLabels.Labels.'15062:LocalizedName,msdyn_SelectDromDeviceLabel'
            AddedItemColor: =
            AddedItemFill: =
            BorderColor: =
            BorderStyle: =
            BorderThickness: =0
            Color: =RGBA(255, 255, 255, 1)
            DropTargetBorderThickness: =0
            Fill: =RGBA(37, 36, 35, 1)
            FocusedBorderThickness: =0
            Font: =Font.'Open Sans'
            Height: =150
            HoverBorderColor: =
            HoverColor: =
            HoverFill: =
            ItemColor: =RGBA(255, 255, 255, 1)
            ItemFill: =
            ItemHoverFill: =
            Items: =colDeviceAttachedFile
            Items.Name: =Name
            Items.Value: =Value
            MaxAttachmentSize: =15
            MaxAttachments: =1
            MaxAttachmentsText: =
            NoAttachmentsText: =
            OnAddFile: |
              =Set(
                  varReceiptFileName,
                  First(Self.Attachments).Name
              );
              Set(
                  varReceiptImage,
                  First(Self.Attachments).Value
              );
              ClearCollect(
                  colDeviceAttachedFile,
                  Self.Attachments
              );
              ClearCollect(
                  colFileSplit,
                  ForAll(
                      Lower(
                          ForAll(
                              Split(
                                  varReceiptFileName,
                                  "."
                              ),
                              {Result: ThisRecord.Value}
                          )
                      ),
                      {Result: ThisRecord.Value}
                  )
              );
              Set(
                  varFileFormat,
                  Last(colFileSplit).Result
              );
              Navigate('Receipts - Receipt Preview Screen')
            OnRemoveFile: |-
              =ClearCollect(colDeviceAttachedFile, Self.Attachments);
              Clear(colFileSplit);
              Set(
                  varFileFormat,
                  Blank()
              );
              Set(
                  varReceiptImage,
                  Blank()
              )
            PaddingBottom: =5
            PaddingLeft: =Self.Width/4
            PaddingRight: =5
            PressedColor: =RGBA(255, 255, 255, 1)
            PressedFill: =
            Size: =20
            Tooltip: =
            Width: =Parent.Width - 2 * Self.X
            X: =60
            Y: =Parent.Height - Self.Height - 35
      - lbl_imge_help_1:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans'
            Height: =31
            Size: =17
            Text: |
              =GlobalLabels.Labels.'15062:LocalizedName,msdyn_ReceiptEntirelyInViewLabel'
            Width: =Parent.Width
            Y: =imageCapture_footer_rectangle_1.Y + (imageCapture_footer_rectangle_1.Height - Self.Height)/2 - 35
      - bsea_cam_ReceiptClick_1:
          Control: Camera@2.4.0
          Properties:
            AccessibleLabel: ="Take receipt image"
            BorderColor: =RGBA(255, 255, 255, 1)
            Camera: =Coalesce(varCam, 0)
            Height: =imageCapture_footer_rectangle_1.Y - Self.Y
            OnSelect: =Select(scr11_icn_CameraIcon)
            StreamRate: =100
            Width: =App.Width
            Y: =scr11_hdr_TopHeader.Height
      - img_click_outer_ring_3:
          Control: Image@2.2.3
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Height: =108
            Image: ='Ellipse 3_1'
            Width: =141
            X: =(Parent.Width - Self.Width)/2
            Y: =imageCapture_footer_rectangle_1.Y - (Self.Height/2)
      - img_click_outer_ring_4:
          Control: Image@2.2.3
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Height: =92
            Image: ='Ellipse 2_1'
            Width: =153
            X: =(Parent.Width - Self.Width)/2
            Y: =imageCapture_footer_rectangle_1.Y - (Self.Height/2)
      - scr11_img_ClickInner:
          Control: Image@2.2.3
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Height: =77
            Image: ='Ellipse 1_1'
            OnSelect: |-
              =Set(
                  varReceiptImage,
                  bsea_cam_ReceiptClick_1.Stream
              );
              Set(
                  varReceiptFileName,
                  Concatenate(
                      "Receipt",
                      Text(GUID()),
                      ".png"
                  )
              );
              Set(
                  varFileFormat,
                  "png"
              );
              Navigate('Receipts - Receipt Preview Screen')
            Width: =94
            X: =(Parent.Width - Self.Width)/2
            Y: =imageCapture_footer_rectangle_1.Y - (Self.Height/2)
      - scr11_icn_CameraIcon:
          Control: Image@2.2.3
          Properties:
            AccessibleLabel: ="Click receipt image"
            ApplyEXIFOrientation: =false
            BorderColor: =RGBA(0, 18, 107, 1)
            Height: =22 * Value(lbconfig_resolution_factor.Text)
            Image: =Icon_Camera
            OnSelect: |-
              =Set(varReceiptImage,bsea_cam_ReceiptClick_1.Stream);
              //find the file format using base64 instead of directly using png
              UpdateContext({varCntFileB64 : JSON(bsea_cam_ReceiptClick_1.Stream, JSONFormat.IncludeBinaryData)});
              Set(
                  varFileFormat,
                  Mid(varCntFileB64, Find("/", varCntFileB64) + 1, Find(";", varCntFileB64) - Find("/", varCntFileB64) - 1)
              );
              Set(varReceiptFileName,Concatenate( "Receipt-",Text(GUID())));
              Navigate('Receipts - Receipt Preview Screen')
            TabIndex: =0
            Width: =24 * Value(lbconfig_resolution_factor.Text)
            X: =(Parent.Width - Self.Width)/2
            Y: =imageCapture_footer_rectangle_1.Y - (Self.Height/2)
      - scr11_img_CameraSwitchOuter:
          Control: Image@2.2.3
          Properties:
            AccessibleLabel: ="Switch camera"
            BorderColor: =RGBA(0, 18, 107, 1)
            Height: =68*1
            Image: ='Ellipse 3_1'
            OnSelect: |-
              =If(
                  CountRows(bsea_cam_ReceiptClick_1.AvailableDevices),
                  UpdateContext({varCam : Mod(Value(varCam) + 1, CountRows(bsea_cam_ReceiptClick_1.AvailableDevices))})
              )
            TabIndex: =0
            Width: =68*1
            X: =Parent.Width/4 - Self.Width/2
            Y: =imageCapture_footer_rectangle_1.Y - (Self.Height/2)
      - scr11_img_CameraSwitchInner:
          Control: Image@2.2.3
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Height: =58
            Image: ='Ellipse 1_1'
            OnSelect: |-
              =If(
                  CountRows(bsea_cam_ReceiptClick_1.AvailableDevices),
                  UpdateContext({varCam : Mod(Value(varCam) + 1, CountRows(bsea_cam_ReceiptClick_1.AvailableDevices))})
              )
            Width: =58
            X: =Parent.Width/4 - Self.Width/2
            Y: =imageCapture_footer_rectangle_1.Y - (Self.Height/2)
      - scr11_img_CameraSwitch:
          Control: Image@2.2.3
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Height: =27.27
            Image: =CameraSwitchIcon
            OnSelect: |-
              =If(
                  CountRows(bsea_cam_ReceiptClick_1.AvailableDevices),
                  UpdateContext({varCam : Mod(Value(varCam) + 1, CountRows(bsea_cam_ReceiptClick_1.AvailableDevices))})
              )
            Width: =27.27
            X: =Parent.Width/4 - Self.Width/2
            Y: =imageCapture_footer_rectangle_1.Y - (Self.Height/2)
      - scr11_hdr_TopHeader:
          Control: CanvasComponent
          ComponentName: hdr02_Header
          Properties:
            Fill: =scr11_hdr_TopHeader.paramFill
            Height: =82
            Width: =Max(App.Width, App.MinScreenWidth)
            paramColor: =RGBA(255, 255, 255, 1)
            paramFill: |
              =RGBA(33, 33, 33, 1)
            paramTitle: =GlobalLabels.Labels.'15062:LocalizedName,msdyn_CaptureReceiptLabel'
      - scr11_ico_Back:
          Control: Classic/Icon@2.5.0
          Properties:
            AccessibleLabel: ="Press to go back"
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =Color.White
            Fill: =icongconfig_backbutton.Fill
            Height: =icongconfig_backbutton.Height
            Icon: =Icon.ChevronLeft
            OnSelect: =Navigate('Receipts - List Screen')
            TabIndex: =0
            Width: =icongconfig_backbutton.Width
            X: =22.5
            Y: =(scr11_hdr_TopHeader.Height-Self.Height)/2
