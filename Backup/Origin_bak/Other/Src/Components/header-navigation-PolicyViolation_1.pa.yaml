ComponentDefinitions:
  header-navigation-PolicyViolation_1:
    DefinitionType: CanvasComponent
    CustomProperties:
      HeaderText:
        PropertyKind: Input
        DisplayName: HeaderText
        Description: Text for the header
        RaiseOnReset: true
        DataType: Text
        Default: ="Text"
      OnBackIconSelect:
        PropertyKind: Event
        DisplayName: OnBackIconSelect
        Description: On Pressing Back Button.
        ReturnType: Boolean
        Default: =true
    Properties:
      Height: =82
    Children:
      - Label9_2:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Semibold
            Height: =37
            Text: ='header-navigation-PolicyViolation_1'.HeaderText
            Width: =App.Width - Icon2_1.X - Icon2_1.Width - App.Width * 0.0625
            X: =54
            Y: =('header-navigation-PolicyViolation_1'.Height - Label9_2.Height) / 2
      - Icon2_1:
          Control: Classic/Icon@2.5.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(0, 18, 107, 1)
            Height: =27
            Icon: =Icon.ChevronLeft
            OnSelect: ='header-navigation-PolicyViolation_1'.OnBackIconSelect()
            Width: =19
            X: =24
            Y: =('header-navigation-PolicyViolation_1'.Height - Icon2_1.Height) / 2
