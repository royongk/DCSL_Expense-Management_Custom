Screens:
  AddGuest - Add Guest to Expense Screen:
    Properties:
      Fill: =RGBA(244, 244, 244, 1)
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |-
        =UpdateContext({locPreviousGuestView: true});
        ClearCollect(gblGuestAttchedToExpenseCol,Filter('Guest Against an Expense Line for Expense Mobile (mserp)','Reference (mserp_trvexptrans)' = varSelectedExpenseDoc.ExpenseRecId));
        Set(ItemizedAmountValue, Text(Sum(gblGuestAttchedToExpenseCol,'The gift amount')));
        Set(RemainingAmountValue, Text(varSelectedExpenseDoc.'Transaction amount' - ItemizedAmountValue))
    Children:
      - ShadowElementFooter_4:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Group: AddGuestToExpenseFooterButton
          Properties:
            DropShadow: =DropShadow.ExtraBold
            Height: =3
            LayoutDirection: =LayoutDirection.Vertical
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =App.Width - 4
            X: =4
            Y: =ButtonBackgroundExpense_4.Y
      - ButtonBackgroundExpense_4:
          Control: Rectangle@2.3.0
          Group: AddGuestToExpenseFooterButton
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =RGBA(244, 244, 244, 1)
            Height: |-
              =If(SelectedGuestsForGiftCategory.Visible,
              RemainingAmountAddGuestLabel.Height 
              ) +
              scr03_btn_Done_5.Height * 1.5
            Width: =App.Width
            Y: =App.Height - ButtonBackgroundExpense_4.Height
      - scr03_btn_Done_5:
          Control: Classic/Button@2.2.0
          Group: AddGuestToExpenseFooterButton
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            DisplayMode: =
            Fill: =RGBA(34, 102, 227, 1)
            Font: =Font.'Segoe UI'
            Height: =App.Height * 0.0704
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            OnSelect: |+
              =Reset(SearchTextInput);
              Set(varSelectedReceiptNumber, Blank());
              // To get the refreshed values from the entity
              Set(
                  varSelectedExpenseDoc,
                  LookUp('Expense Line Expense Mobile Entity (mserp)','Expense transaction number (mserp_exptransnumber)' = varSelectedExpenseDoc.'Expense transaction number (mserp_exptransnumber)')
              );

              // populating base64 to show image on selection of expense
              Set(
                  varReceiptImage,
                  LookUp('Expense Mobile Attached Document Entity (mserp)', EntRecId = Value(varSelectedExpenseDoc.AttachedReceiptId),CapturedDocument) 
              );

              // collect policy violations
              If(
                  varSelectedExpenseDoc.PolicyViolationCount,
                  ClearCollect(
                      colPolViolations,
                      Split(varSelectedExpenseDoc.PolicyViolationErrorMessage, "~|~")
                  );
                  UpdateContext({varMaxViolationLevel : varSelectedExpenseDoc.PolicyViolationsLevel});
                  UpdateContext({varNumViolation : varSelectedExpenseDoc.PolicyViolationCount}),
                  Clear(colPolViolations);
                  UpdateContext({varMaxViolationLevel : 0});
                  UpdateContext({varNumViolation : 0})
              );
              Set(ItemizedAmountValue, "0.0");
              Set(RemainingAmountValue, "0.0");

              Navigate('Expenses - Edit Screen', ScreenTransition.Fade, {varNavigatedFrom : varNavigatedFrom, varMaxViolationLevel : varMaxViolationLevel, varNumViolation: varNumViolation})

            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Size: =App.Height * 0.0211
            Text: =GlobalLabels.Labels.'15062:LocalizedName,msdyn_DoneButtonLabel'
            Width: =App.Width * 0.891
            X: =(ButtonBackgroundExpense_4.Width - scr03_btn_Done_5.Width) / 2
            Y: |-
              =
              ButtonBackgroundExpense_4.Y + (ButtonBackgroundExpense_4.Height - scr03_btn_Done_5.Height) / 2 +

              If(RemainingAmountAddGuestLabel.Visible,
              RemainingAmountAddGuestLabel.Height / 3
              )
      - AmountRemainingValue:
          Control: Label@2.5.1
          Group: AddGuestToExpenseFooterButton
          Properties:
            Align: =Align.Right
            BorderColor: =RGBA(0, 18, 107, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Height: =RemainingAmountAddGuestLabel.Height
            PaddingRight: =10
            Size: =App.Height * 0.01760
            Text: =Concatenate(Coalesce(RemainingAmountValue,"0.0")," ", varSelectedExpenseDoc.'Currency (mserp_exchangecode)')
            Visible: =SelectedGuestsForGiftCategory.Visible
            Width: =App.Width / 2
            X: =RemainingAmountAddGuestLabel.Width
            Y: =RemainingAmountAddGuestLabel.Y
      - RemainingAmountAddGuestLabel:
          Control: Label@2.5.1
          Group: AddGuestToExpenseFooterButton
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Height: =App.Height * 0.06161
            Size: |
              =App.Height * 0.01760
            Text: =GlobalLabels.Labels.'15062:LocalizedName,msdyn_RemainingAmountLabel'
            Visible: =SelectedGuestsForGiftCategory.Visible
            Width: =App.Width / 2
            X: =40
            Y: =ButtonBackgroundExpense_4.Y
      - AddGuestToExpenseHeader:
          Control: CanvasComponent
          ComponentName: header-navigation-PolicyViolation_3
          Properties:
            BackButtonClicked: |-
              =Reset(SearchTextInput);
              Set(varSelectedReceiptNumber, Blank());

              // To get the refreshed values from the entity
              Set(
                  varSelectedExpenseDoc,
                  LookUp('Expense Line Expense Mobile Entity (mserp)','Expense transaction number (mserp_exptransnumber)' = varSelectedExpenseDoc.'Expense transaction number (mserp_exptransnumber)')
              );

              // populating base64 to show image on selection of expense
              Set(
                  varReceiptImage,
                  LookUp('Expense Mobile Attached Document Entity (mserp)', EntRecId = Value(varSelectedExpenseDoc.AttachedReceiptId),CapturedDocument) 
              );

              // collect policy violations
              If(
                  varSelectedExpenseDoc.PolicyViolationCount,
                  ClearCollect(
                      colPolViolations,
                      Split(varSelectedExpenseDoc.PolicyViolationErrorMessage, "~|~")
                  );
                  UpdateContext({varMaxViolationLevel : varSelectedExpenseDoc.PolicyViolationsLevel});
                  UpdateContext({varNumViolation : varSelectedExpenseDoc.PolicyViolationCount}),
                  Clear(colPolViolations);
                  UpdateContext({varMaxViolationLevel : 0});
                  UpdateContext({varNumViolation : 0})
              );
              Set(ItemizedAmountValue, "0.0");
              Set(RemainingAmountValue, "0.0");
              Navigate('Expenses - Edit Screen', ScreenTransition.Fade, {varNavigatedFrom : varNavigatedFrom, varMaxViolationLevel : varMaxViolationLevel, varNumViolation: varNumViolation })
            Fill: =RGBA(255, 255, 255, 1)
            HeaderText: =GlobalLabels.Labels.'15062:LocalizedName,msdyn_AddGuestsToExpenseLabel'
            Height: =82
            Width: =App.Width
      - PreviousGuestList:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
          Properties:
            AccessibleLabel: ="List of Previous Guest"
            BorderColor: =RGBA(0, 18, 107, 1)
            Height: =App.Height - (SearchTextInput.Y + SearchTextInput.Height + ButtonBackgroundExpense_4.Height + ShadowElementFooter_4.Height * 2)
            Items: =Search(Filter('Previous guest Lists for Expense Mobile (mserp)',Employee = varSelectedExpenseDoc.'Employee (mserp_creatingworker)'),SearchTextInput.Text,Name)
            OnSelect: |-
              =UpdateContext({varGuestPatchCallErrors: Blank()});
              IfError(
              Patch('Previous guest Lists for Expense Mobile (mserp)',
                  ThisItem,
                  {
                      ExpTransNumber: varSelectedExpenseDoc.'Expense transaction number (mserp_exptransnumber)'
                  }
              ),
                  UpdateContext(
                      {
                          varGuestPatchCallErrors: Substitute(
                              Match(
                                  FirstError.Details.HttpResponse,
                                  """message"":""([^""]*)"""
                              ).FullMatch,
                              """message"":""",
                              ""
                          )
                      }
                  )
              );
              If(
                  !IsBlank(varGuestPatchCallErrors),
                  Notify(
                      Left(
                          varGuestPatchCallErrors,
                          Len(varGuestPatchCallErrors) - 1
                      ),
                      NotificationType.Error,
                      gblParams.notificationTime
                  )
              );
              Refresh('Guest Against an Expense Line for Expense Mobile (mserp)')
            TemplateSize: =App.Height * 0.10563
            Visible: =!CoworkerList.Visible
            Width: =App.Width - App.Width * 0.015625
            X: =10
            Y: =SearchTextInput.Y + SearchTextInput.Height
