                        UpdateContext(
                            {
                                varGuestPatchCallErrors: Substitute(
                                    Match(
                                        FirstError.Details.HttpResponse,
                                        """message"":""([^""]*)"""
                                    ).FullMatch,
                                    """message"":""",
                                    ""
                                )
                            }
                        )
                    );
                    If(
                        !IsBlank(varGuestPatchCallErrors),
                        Notify(
                            Left(
                                varGuestPatchCallErrors,
                                Len(varGuestPatchCallErrors) - 1
                            ),
                            NotificationType.Error,
                            gblParams.notificationTime
                        )
                    );

                    Set(
                        gblGuestAttchedToExpense,
                        LookUp(
                            'Guest Against an Expense Line for Expense Mobile (mserp)',
                             'Reference (mserp_trvexptrans)' = varSelectedExpenseDoc.ExpenseRecId && EntRecId = ThisItem.EntRecId
                        )
                    );
                    Set(
                        ItemizedAmountValue,
                        Text(gblGuestAttchedToExpense.ItemizedCostAmount)
                    );
                    Set(
                        RemainingAmountValue,
                        Text(gblGuestAttchedToExpense.RemainingAmount)
                    )
                  RadiusBottomLeft: =App.Width * 0.015625
                  RadiusBottomRight: =App.Width * 0.015625
                  RadiusTopLeft: =App.Width * 0.015625
                  RadiusTopRight: =App.Width * 0.015625
                  Size: =Parent.TemplateHeight * 0.175
                  Width: =App.Width * 0.265
                  X: =BackgroundButtonGift.X + BackgroundButtonGift.Width + App.Width * 0.0234
                  Y: =(Parent.TemplateHeight - GiftAmountTextInput.Height) / 2
            - DeleteIconGift:
                Control: Image@2.2.3
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Height: =Self.Width
                  Image: =SelectorCloseIcon
                  OnSelect: |-
                    =Remove('Guest Against an Expense Line for Expense Mobile (mserp)',ThisItem);
                    ClearCollect(gblGuestAttchedToExpenseCol,Filter('Guest Against an Expense Line for Expense Mobile (mserp)','Reference (mserp_trvexptrans)' = varSelectedExpenseDoc.'Expense subcategory'));
                    Set(ItemizedAmountValue, Text(Sum(gblGuestAttchedToExpenseCol,'The gift amount')));
                    Set(RemainingAmountValue, Text(varSelectedExpenseDoc.'Transaction amount' - ItemizedAmountValue))
                  TabIndex: =0
                  Width: =App.Width * 0.05
                  X: =GiftAmountTextInput.X + GiftAmountTextInput.Width + App.Width * 0.0234
                  Y: =(Parent.TemplateHeight - DeleteIconGift.Height) / 2
            - DesignationLabelGift:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Font: =Font.'Open Sans'
                  Height: =Parent.TemplateHeight - DesignationLabelGift.Y * 3 / 2
                  OnSelect: =Select(Parent)
                  Size: =Parent.TemplateHeight * 0.0917
                  TabIndex: =If(IsBlank(Self.Text), -1, 0)
                  Text: =ThisItem.Title
                  VerticalAlign: =VerticalAlign.Top
                  Width: =App.Width * 0.210
                  X: =CompanyNameGift.X + CompanyNameGift.Width + App.Width * 0.03125
                  Y: =GuestnameGift.Y
