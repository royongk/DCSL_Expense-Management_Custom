Screens:
  AddGuest - View Guest Attached to Expense Approvals:
    Properties:
      Fill: =RGBA(244, 244, 244, 1)
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: "=UpdateContext({locPreviousGuestView: true});\nForAll(\n    Table(\n    ParseJSON(\n        Coalesce(varExpenseAgainstWorkItem.AttachedGuestDetails,varSelectedLineItem.AttachedGuestDetails)\n        )\n    ),\n    Collect(\n        guestListExpense,\n    {\n        Name: Text(ThisRecord.Value.GuestId),\n        'Organization/Country': Text(ThisRecord.Value.Company),\n        Title: Text(ThisRecord.Value.Title),\n        'The gift amount': Value(ThisRecord.Value.AmountCurr,\"en-us\")\n    }\n    )\n)\n\n    "
    Children:
      - ShadowElementFooter_6:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Group: AddGuestToExpenseFooterButton_2
          Properties:
            DropShadow: =DropShadow.ExtraBold
            Height: =3
            LayoutDirection: =LayoutDirection.Vertical
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =App.Width - 4
            X: =4
            Y: =ButtonBackgroundExpense_6.Y
      - ButtonBackgroundExpense_6:
          Control: Rectangle@2.3.0
          Group: AddGuestToExpenseFooterButton_2
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =Color.White
            Height: =scr03_btn_Done_7.Height * 1.5
            Width: =App.Width
            Y: =App.Height - ButtonBackgroundExpense_6.Height
      - scr03_btn_Done_7:
          Control: Classic/Button@2.2.0
          Group: AddGuestToExpenseFooterButton_2
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            DisplayMode: =
            Fill: =RGBA(34, 102, 227, 1)
            Font: =Font.'Segoe UI'
            Height: =App.Height * 0.0704
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            OnSelect: |-
              =If(
                  varItemizationScreen = "viewOnlyApprovalExpenseScreen",
                  Concurrent(
                  Set(
                      varIsCreate,
                      false
                  ),
                  Set(
                      varReceiptImage,  //set as receiptUrl of attached expense
                      Blank()
                  )
              );

              Set(
                  varReceiptImage,
                  LookUp(receiptsAgainstWorkItems,ExpenseLineAttachedTo = varExpenseAgainstWorkItem.'Expense transaction number (mserp_exptransnumber)',CapturedDocument)
              );
              Set(
                  varSelectedReceiptNumber,
                  Blank()
              );
              If(
                  varExpenseAgainstWorkItem.PolicyViolationCount,
                  ClearCollect(
                      colPolViolations,
                      Split(varExpenseAgainstWorkItem.PolicyViolationMessage, "~|~")
                  );
                  UpdateContext({varMaxViolationLevel : varExpenseAgainstWorkItem.PolicyViolationsLevel});
                  UpdateContext({varNumViolation : varExpenseAgainstWorkItem.PolicyViolationCount}),
                  Clear(colPolViolations);
                  UpdateContext({varMaxViolationLevel : 0});
                  UpdateContext({varNumViolation : 0})
              );
              UpdateContext({testVar : varExpenseAgainstWorkItem});
              Navigate('Expenses - View Only Screen', ScreenTransition.None, {varNavigatedFrom : varNavigatedFrom, varMaxViolationLevel : varMaxViolationLevel, varNumViolation : varNumViolation}),
              Concurrent(
                  Set(
                      varIsCreate,
                      false
                  ),
                  Set(
                      varReceiptImage,  //set as receiptUrl of attached expense
                      Blank()
                  )
              );
              Set(
                  varReceiptImage,
                  LookUp('View privilege for Receipts attached to Expense Lines for Approvals (mserp)', EntRecId = Value(varSelectedLineItem.AttachedReceiptId),CapturedDocument)
              );
              Set(
                  varSelectedReceiptNumber,
                  Blank()
              );
              Navigate('Approvals - Line Details Screen', ScreenTransition.None, {varSelectedTab : 1, locItemizationLineFlag: varSelectedLineItem.'Expense line type' = 'Expense line type (mserp)'.'Itemized line'})
              );
              Clear(guestListExpense);
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Size: =App.Height * 0.0211
            Text: =GlobalLabels.Labels.'15062:LocalizedName,msdyn_DoneButtonLabel'
            Width: =App.Width * 0.891
            X: =(App.Width - Self.Width) / 2
            Y: |-
              =
              ButtonBackgroundExpense_6.Y + (ButtonBackgroundExpense_6.Height - scr03_btn_Done_7.Height) / 2
      - AddGuestToExpenseHeader_2:
          Control: CanvasComponent
          ComponentName: header-navigation-PolicyViolation_3
          Properties:
            BackButtonClicked: |-
              =
              If(
                  varItemizationScreen = "viewOnlyApprovalExpenseScreen",
                  Concurrent(
                  Set(
                      varIsCreate,
                      false
                  ),
                  Set(
                      varReceiptImage,  //set as receiptUrl of attached expense
                      Blank()
                  )
              );

              Set(
                  varReceiptImage,
                  LookUp(receiptsAgainstWorkItems,ExpenseLineAttachedTo = varExpenseAgainstWorkItem.'Expense transaction number (mserp_exptransnumber)',CapturedDocument)
              );
              Set(
                  varSelectedReceiptNumber,
                  Blank()
              );
              If(
                  varExpenseAgainstWorkItem.PolicyViolationCount,
                  ClearCollect(
                      colPolViolations,
                      Split(varExpenseAgainstWorkItem.PolicyViolationMessage, "~|~")
                  );
                  UpdateContext({varMaxViolationLevel : varExpenseAgainstWorkItem.PolicyViolationsLevel});
                  UpdateContext({varNumViolation : varExpenseAgainstWorkItem.PolicyViolationCount}),
                  Clear(colPolViolations);
                  UpdateContext({varMaxViolationLevel : 0});
                  UpdateContext({varNumViolation : 0})
              );
              UpdateContext({testVar : varExpenseAgainstWorkItem});
              Navigate('Expenses - View Only Screen', ScreenTransition.None, {varNavigatedFrom : varNavigatedFrom, varMaxViolationLevel : varMaxViolationLevel, varNumViolation : varNumViolation}),
              Concurrent(
                  Set(
                      varIsCreate,
                      false
                  ),
                  Set(
                      varReceiptImage,  //set as receiptUrl of attached expense
                      Blank()
                  )
              );
              Set(
                  varReceiptImage,
                  LookUp('View privilege for Receipts attached to Expense Lines for Approvals (mserp)', EntRecId = Value(varSelectedLineItem.AttachedReceiptId),CapturedDocument)
              );
              Set(
                  varSelectedReceiptNumber,
                  Blank()
              );
              Navigate('Approvals - Line Details Screen', ScreenTransition.None, {varSelectedTab : 1, locItemizationLineFlag: varSelectedLineItem.'Expense line type' = 'Expense line type (mserp)'.'Itemized line'})
              );
              Clear(guestListExpense);
            Fill: =RGBA(255, 255, 255, 1)
            HeaderText: ="View guests attached to expense"
            Height: =82
            Width: =App.Width
      - SelectedGuestsForNonGiftCategory_2:
