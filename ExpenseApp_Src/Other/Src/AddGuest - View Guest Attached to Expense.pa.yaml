Screens:
  AddGuest - View Guest Attached to Expense:
    Properties:
      Fill: =RGBA(244, 244, 244, 1)
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |-
        =UpdateContext({locPreviousGuestView: true});
    Children:
      - ShadowElementFooter_5:
          Control: GroupContainer@1.3.0
          Variant: AutoLayout
          Group: AddGuestToExpenseFooterButton_1
          Properties:
            DropShadow: =DropShadow.ExtraBold
            Height: =3
            LayoutDirection: =LayoutDirection.Vertical
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =App.Width - 4
            X: =4
            Y: =ButtonBackgroundExpense_5.Y
      - ButtonBackgroundExpense_5:
          Control: Rectangle@2.3.0
          Group: AddGuestToExpenseFooterButton_1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =Color.White
            Height: =scr03_btn_Done_6.Height * 1.5
            Width: =App.Width
            Y: =App.Height - ButtonBackgroundExpense_5.Height
      - scr03_btn_Done_6:
          Control: Classic/Button@2.2.0
          Group: AddGuestToExpenseFooterButton_1
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            DisplayMode: =
            Fill: =RGBA(34, 102, 227, 1)
            Font: =Font.'Segoe UI'
            Height: =App.Height * 0.0704
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            OnSelect: |-
              =Concurrent(
                  Set(
                      varIsCreate,
                      false
                  ),
                  Set(
                      varReceiptImage,  //set as receiptUrl of attached expense
                      Blank()
                  )
              );

              Set(
                  varReceiptImage,
                  LookUp('Expense Mobile Attached Document Entity (mserp)', EntRecId = Value(varSelectedExpenseDoc.AttachedReceiptId),CapturedDocument)
              );
              Set(
                  varSelectedReceiptNumber,
                  Blank()
              );
              If(
                  varSelectedExpenseDoc.PolicyViolationCount,
                  ClearCollect(
                      colPolViolations,
                      Split(varSelectedExpenseDoc.PolicyViolationErrorMessage, "~|~")
                  );
                  UpdateContext({varMaxViolationLevel : varSelectedExpenseDoc.PolicyViolationsLevel});
                  UpdateContext({varNumViolation : varSelectedExpenseDoc.PolicyViolationCount}),
                  Clear(colPolViolations);
                  UpdateContext({varMaxViolationLevel : 0});
                  UpdateContext({varNumViolation : 0})
              );
              Navigate('Expenses - View Only Screen', ScreenTransition.None, {varNavigatedFrom : varNavigatedFrom, varMaxViolationLevel : varMaxViolationLevel, varNumViolation : varNumViolation})
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Size: =App.Height * 0.0211
            Text: =GlobalLabels.Labels.'15062:LocalizedName,msdyn_DoneButtonLabel'
            Width: =App.Width * 0.891
            X: =(ButtonBackgroundExpense_5.Width - scr03_btn_Done_6.Width) / 2
            Y: |-
              =
              ButtonBackgroundExpense_5.Y + (ButtonBackgroundExpense_5.Height - scr03_btn_Done_6.Height) / 2
      - AddGuestToExpenseHeader_1:
          Control: CanvasComponent
          ComponentName: header-navigation-PolicyViolation_3
          Properties:
            BackButtonClicked: |-
              =Concurrent(
                  Set(
                      varIsCreate,
                      false
                  ),
                  Set(
                      varReceiptImage,  //set as receiptUrl of attached expense
                      Blank()
                  )
              );

              Set(
                  varReceiptImage,
                  LookUp('Expense Mobile Attached Document Entity (mserp)', EntRecId = Value(varSelectedExpenseDoc.AttachedReceiptId),CapturedDocument)
              );
              Set(
                  varSelectedReceiptNumber,
                  Blank()
              );
              If(
                  varSelectedExpenseDoc.PolicyViolationCount,
                  ClearCollect(
                      colPolViolations,
                      Split(varSelectedExpenseDoc.PolicyViolationErrorMessage, "~|~")
                  );
                  UpdateContext({varMaxViolationLevel : varSelectedExpenseDoc.PolicyViolationsLevel});
                  UpdateContext({varNumViolation : varSelectedExpenseDoc.PolicyViolationCount}),
                  Clear(colPolViolations);
                  UpdateContext({varMaxViolationLevel : 0});
                  UpdateContext({varNumViolation : 0})
              );
              Navigate('Expenses - View Only Screen', ScreenTransition.None, {varNavigatedFrom : varNavigatedFrom, varMaxViolationLevel : varMaxViolationLevel, varNumViolation : varNumViolation})
            Fill: =RGBA(255, 255, 255, 1)
            HeaderText: =GlobalLabels.Labels.'15062:LocalizedName,msdyn_ViewGuestsAttachedToExpenseLabel'
            Height: =82
            Width: =App.Width
      - SelectedGuestsForNonGiftCategory_1:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_OneImageTwoColumnVariant_ver5.0
          Properties:
            AccessibleLabel: ="List to attached guest"
            BorderColor: =RGBA(0, 18, 107, 1)
            DelayItemLoading: =true
            DisplayMode: =DisplayMode.View
            Height: =App.Height * 0.7
            Items: |
              =Filter('Guest Against an Expense Line for Expense Mobile (mserp)','Reference (mserp_trvexptrans)' = varSelectedExpenseDoc.ExpenseRecId)
            LoadingSpinner: =LoadingSpinner.Data
            TemplateSize: =App.Height * 0.1496
            Visible: =!SelectedGuestsForGiftCategory_1.Visible
            Width: =App.Width - App.Width * 0.015625
            X: =App.Width * 0.015625 / 2
            Y: =SelectedGuestsForGiftCategory_1.Y
          Children:
            - Button6_2:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =ColorFade(Self.Fill, -15%)
                  Color: =RGBA(255, 255, 255, 1)
                  DisabledBorderColor: =RGBA(166, 166, 166, 1)
                  Fill: =Color.White
                  Font: =Font.'Open Sans'
                  Height: =Parent.TemplateHeight * 0.8663
                  HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: =Color.White
                  OnSelect: =Select(Parent)
                  PressedBorderColor: =Self.Fill
                  PressedColor: =Self.Fill
                  PressedFill: =Self.Color
                  Text: =""
                  Width: =Parent.TemplateWidth * 0.94
                  X: =(Parent.TemplateWidth - Button6_2.Width) / 2
                  Y: =(Parent.TemplateHeight - Button6_2.Height) / 2
            - DesignationLabel_2:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 1)
                  Color: =RGBA(71, 69, 64, 1)
                  DisabledColor: =RGBA(186, 186, 186, 1)
                  Font: =Font.'Open Sans'
                  Height: =Parent.TemplateHeight * 0.2353
                  OnSelect: =Select(Parent)
                  Size: =Parent.TemplateHeight * 0.09412
                  TabIndex: =If(IsBlank(Self.Text), -1, 0)
                  Text: =ThisItem.Title
                  Width: =Button6_2.Width - Self.X
                  Wrap: =false
                  X: =NameLabel_2.X
                  Y: =NameLabel_2.Y + NameLabel_2.Height + 5
            - LegalEntityLabel_2:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =RGBA(71, 69, 64, 1)
                  Font: =Font.'Open Sans'
                  Height: =Parent.TemplateHeight * 0.2353
                  OnSelect: =Select(Parent)
                  Size: =Parent.TemplateHeight * 0.09412
                  TabIndex: =If(IsBlank(Self.Text), -1, 0)
                  Text: =ThisItem.'Organization/Country'
                  Width: =DesignationLabel_2.Width
                  Wrap: =false
                  X: =NameLabel_2.X
                  Y: =DesignationLabel_2.Y + DesignationLabel_2.Height
            - NameLabel_2:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Font: =Font.'Open Sans'
                  Height: =Parent.TemplateHeight * 0.2353
                  OnSelect: =Select(Parent)
                  Size: =Parent.TemplateHeight * 0.1059
                  TabIndex: =If(IsBlank(Self.Text), -1, 0)
                  Text: =ThisItem.Name
                  Width: =Parent.TemplateWidth * 0.6928
                  Wrap: =false
                  X: =Button6_2.X + 10
                  Y: =Button6_2.Y + 10
      - SelectedGuestsForGiftCategory_1:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
          Properties:
            AccessibleLabel: ="List to attached guest"
            BorderColor: =RGBA(0, 18, 107, 1)
            DisplayMode: =DisplayMode.View
            Height: |-
              =//App.Height * 0.2263
              App.Height - AddGuestToExpenseHeader_1.Height - GuestsLabel_1.Height -  ButtonBackgroundExpense_5.Height - 10
            Items: |
              =Filter('Guest Against an Expense Line for Expense Mobile (mserp)','Reference (mserp_trvexptrans)' = varSelectedExpenseDoc.ExpenseRecId)
            TemplateSize: =App.Height * 0.10563
            Visible: =currExpenseType = 'TrvExpType (mserp)'.'Gift certificates/Tangible gifts'
            Width: =App.Width
            Y: =GuestsLabel_1.Y + GuestsLabel_1.Height
          Children:
            - Button7_1:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =ColorFade(Self.Fill, -15%)
                  Color: =RGBA(255, 255, 255, 1)
                  DisabledBorderColor: =RGBA(166, 166, 166, 1)
                  DisplayMode: =DisplayMode.View
                  Fill: =Color.White
                  Font: =Font.'Open Sans'
                  Height: =Parent.TemplateHeight * 0.8667
                  HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: =Color
                  OnSelect: =Select(Parent)
                  PressedBorderColor: =Self.Fill
                  PressedColor: =Self.Fill
                  PressedFill: =Self.Color
                  RadiusBottomLeft: =App.Width * 0.015625
                  RadiusBottomRight: =App.Width * 0.015625
                  RadiusTopLeft: =App.Width * 0.015625
                  RadiusTopRight: =App.Width * 0.015625
                  Text: =""
                  Width: =App.Width * 0.591
                  X: =App.Width * 0.032375
                  Y: =(Parent.TemplateHeight - Button7_1.Height) / 2
            - Title9_1:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 1)
                  Color: =RGBA(71, 69, 64, 1)
                  DisabledColor: =RGBA(186, 186, 186, 1)
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Semibold
                  Height: =Parent.TemplateHeight * 0.208
                  OnSelect: =Select(Parent)
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =Parent.TemplateHeight * 0.1
                  TabIndex: =If(IsBlank(Self.Text), -1, 0)
                  Text: =ThisItem.Name
                  VerticalAlign: =VerticalAlign.Top
                  Width: =App.Width * 0.3125
                  Wrap: =false
                  X: =App.Width * 0.0515
                  Y: =Parent.TemplateHeight * 0.1333
            - Subtitle7_1:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 1)
                  Color: =RGBA(71, 69, 64, 1)
                  DisabledColor: =RGBA(186, 186, 186, 1)
                  Font: =Font.'Open Sans'
                  Height: =Parent.TemplateHeight * 0.5
                  OnSelect: =Select(Parent)
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =Parent.TemplateHeight * 0.0917
                  TabIndex: =If(IsBlank(Self.Text), -1, 0)
                  Text: =ThisItem.'Organization/Country'
                  VerticalAlign: =VerticalAlign.Top
                  Width: =Title9_1.Width
                  X: =Title9_1.X
                  Y: =Title9_1.Y + Title9_1.Height
            - TextInput1_1:
                Control: Classic/TextInput@2.3.2
                Properties:
                  BorderColor: =ColorFade(Self.Fill, -15%)
                  Default: =ThisItem.'The gift amount'
                  DisplayMode: =DisplayMode.View
                  Font: =Font.'Open Sans'
                  Height: =Button7_1.Height
                  HoverBorderColor: =RGBA(0, 18, 107, 1)
                  HoverFill: =RGBA(186, 202, 226, 1)
                  OnChange: =
                  RadiusBottomLeft: =App.Width * 0.015625
                  RadiusBottomRight: =App.Width * 0.015625
                  RadiusTopLeft: =App.Width * 0.015625
                  RadiusTopRight: =App.Width * 0.015625
                  Size: =Parent.TemplateHeight * 0.175
                  Width: =App.Width * 0.265
                  X: =Button7_1.X + Button7_1.Width + App.Width * 0.0234
                  Y: =(Parent.TemplateHeight - TextInput1_1.Height) / 2
            - Label1_1:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  DisplayMode: =DisplayMode.View
                  Font: =Font.'Open Sans'
                  Height: =Parent.TemplateHeight - Label1_1.Y * 3 / 2
                  OnSelect: =Select(Parent)
                  Size: =Parent.TemplateHeight * 0.0917
                  TabIndex: =If(IsBlank(Self.Text), -1, 0)
                  Text: =ThisItem.Title
                  VerticalAlign: =VerticalAlign.Top
                  Width: =App.Width * 0.210
                  X: =Subtitle7_1.X + Subtitle7_1.Width + App.Width * 0.03125
                  Y: =Title9_1.Y
      - GuestsLabel_1:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Font: =Font.'Open Sans'
            Height: =App.Height * 0.0326
            Size: =App.Height * 0.0184
            Text: =GlobalLabels.Labels.'15062:LocalizedName,msdyn_GuestsLabel'
            Width: =App.Width * 0.591
            X: =App.Width * 0.032375
            Y: =AddGuestToExpenseHeader_1.Height + App.Width * 0.0088
      - GiftAmountLabel_1:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Font: =Font.'Open Sans'
            Height: =GuestsLabel_1.Height
            Size: =App.Height * 0.0184
            Text: =GlobalLabels.Labels.'15062:LocalizedName,msdyn_GiftAmountLabel'
            Visible: =SelectedGuestsForGiftCategory_1.Visible
            Width: =App.Width * 0.35
            Wrap: =false
            X: =GuestsLabel_1.X + GuestsLabel_1.Width + App.Width * 0.0234
            Y: =GuestsLabel_1.Y
      - NoGuestAddesViewLabel:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(145, 145, 145, 1)
            Font: =Font.'Open Sans'
            Height: =NoItemizedAmountViewLabel.Height
            Size: =App.Width * 0.0285
            Text: =GlobalLabels.Labels.'15062:LocalizedName,msdyn_NoGuestsAddedLabel'
            Visible: =SelectedGuestsForGiftCategory_1.AllItemsCount = 0 || SelectedGuestsForNonGiftCategory_1.AllItemsCount = 0
            Width: =App.Width/2
            X: =40
            Y: =NoItemizedAmountViewLabel.Y
      - NoItemizedAmountViewLabel:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(145, 145, 145, 1)
            Font: =Font.'Open Sans'
            Height: =App.Height * 0.02917
            Text: =Substitute(Substitute(GlobalLabels.Labels.'15062:LocalizedName,msdyn_AmountItemizedLabel',"$","0.0"),"#",varSelectedExpenseDoc.'Currency (mserp_exchangecode)')
            Visible: =SelectedGuestsForGiftCategory_1.AllItemsCount = 0 && SelectedGuestsForGiftCategory_1.Visible
            Width: =App.Width/2
            X: =App.Width - Self.Width
            Y: =GiftAmountLabel_1.Y + GiftAmountLabel_1.Height + 10
