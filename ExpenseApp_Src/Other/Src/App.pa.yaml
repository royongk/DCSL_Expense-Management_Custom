      gblIsProjectValidationFlag = LookUp('Expense management parameters (mserp)','Company Code' = varSelectedLegalEntity).'Enable project validations' = 'NoYes (mserp)'.Yes;


    MinScreenWidth: =320
    OnStart: "=// 사용자의 이메일 변수 저장 (API 호출 최소화)\n// 1. 현재 접속자가 앱 소유자(마스터 관리자)인지 확인하는 변수 생성\n// 본인의 이메일 주소(또는 공동 개발자의 이메일)를 배열 내부에 정확히 입력하세요.\nSet(\n    varIsOwner, \n    varUserEmail in [\n        \"PowerApps.Admin@dulwich-seoul.kr\"\n    ]\n);\n\nSet(varUserEmail, User().Email);\n\n// 1. Local 그룹 소속 여부 (※ \"개체-ID\" 부분을 실제 그룹의 Object ID로 변경하세요)\nSet(\n    varIsLocal, \n    !IsBlank(LookUp(Office365그룹.ListGroupMembers(\"b9c7b018-c604-4a68-b9ab-e61b0a265f23\").value, mail = varUserEmail))\n);\n\n// 2. Full 그룹 소속 여부\nSet(\n    varIsFull, \n    !IsBlank(LookUp(Office365그룹.ListGroupMembers(\"f135e183-009e-48d8-b88a-71850795b8cf\").value, mail = varUserEmail))\n);\n\n\n// 3. Expat 그룹 소속 여부\nSet(\n    varIsExpat, \n    !IsBlank(LookUp(Office365그룹.ListGroupMembers(\"f7691104-2166-43db-a229-fbb15179fc47\").value, mail = varUserEmail))\n);\n// Main Screen 랜딩 페이지 메뉴 구성용 컬렉션\nClearCollect(\n    colLandingMenu,\n    \n    // 1. Expense Reimbursement\n    {\n        DisplayName: \"Expense Reimbursement\",\n        Category: \"Finance\",\n        AppMode: \"ExpenseReport\",\n        // ⭐ 오너이거나, Local/Full/Expat 그룹 중 하나에 속한 경우\n        IsVisible: varIsOwner Or varIsLocal Or varIsFull Or varIsExpat\n    },\n    \n    // 2. School Trip Expense Settlement\n    {\n        DisplayName: \"School Trip Expense Settlement\",\n        Category: \"Finance\",\n        AppMode: \"BillingTripSettlement\",\n        // ⭐ 오너이거나, Local/Full 그룹 중 하나에 속한 경우\n        IsVisible: varIsOwner Or varIsLocal Or varIsFull\n    },\n    \n    // 3. Cash Advance / Settlement\n    {\n        DisplayName: \"Cash Advance / Settlement\",\n        Category: \"Finance\",\n        AppMode: \"CashAdvance\",\n        // ⭐ 오너이거나, Full 그룹에 속한 경우\n        IsVisible: varIsOwner Or varIsFull\n    },\n    \n    // 4. Airfare & Shipping Allowance Claim\n    {\n        DisplayName: \"Airfare & Shipping Allowance Claim\",\n        Category: \"HR\",\n        AppMode: \"AirfareAllowance\",\n        // ⭐ 오너이거나, Expat 그룹에 속한 경우\n        IsVisible: varIsOwner Or varIsExpat\n    },\n    \n    // 5. Employee Benefits Claim\n    {\n        DisplayName: \"Employee Benefits Claim\",\n        Category: \"HR\",\n        AppMode: \"EmployeeBenefit\",\n        // ⭐ 오너이거나, Local/Full 그룹 중 하나에 속한 경우\n        IsVisible: varIsOwner Or varIsLocal Or varIsFull\n    },\n    \n    // 6. Salary Advance\n    {\n        DisplayName: \"Salary Advance\",\n        Category: \"HR\",\n        AppMode: \"SalaryAdvance\",\n        // 모두에게 보이는 메뉴는 그대로 true 유지\n        IsVisible: true\n    }\n);\nClearCollect(\n    dsTimePeriods,\n    {\n        Value : \"AM\"\n    },\n    {\n        Value : \"PM\"\n    }\n);\nSet(\n    gblNavigationDrawerVisibility,\n    false\n);\nForAll(\n    Filter('Expense category (mserp)', Inactive = 'NoYes (mserp)'.No),\n    Collect(\n        dsCategoryImages,\n        {\n            expenseType : ThisRecord.'Expense type',\n            icon : \n                Switch(\n                    ThisRecord.'Expense type',\n                    'TrvExpType (mserp)'.'Cash advance returns',\n                    Cash,\n                    'TrvExpType (mserp)'.'Per diem',\n                    perdiem,\n                    'TrvExpType (mserp)'.Mileage,\n                    Mileage,\n                    'TrvExpType (mserp)'.Personal,\n                    Personal,\n                    'TrvExpType (mserp)'.Airline,\n                    Airline,\n                    'TrvExpType (mserp)'.'Car rental',\n                    CarRental,\n                    'TrvExpType (mserp)'.Conference,\n                    Conference,\n                    'TrvExpType (mserp)'.Entertainment,\n                    Entertainment,\n                    'TrvExpType (mserp)'.Hotel,\n                    Hotel,\n                    'TrvExpType (mserp)'.Meals,\n                    Meals,\n                    'TrvExpType (mserp)'.'Gift certificates/Tangible gifts',\n                    Gift,\n                    Misc\n                ),\n            iconRed : \n                Switch(\n                    ThisRecord.'Expense type',\n                    'TrvExpType (mserp)'.'Cash advance returns',\n                    Cash_1,\n                    'TrvExpType (mserp)'.'Per diem',\n                    perdiemRed,\n                    'TrvExpType (mserp)'.Mileage,\n                    Mileage_1,\n                    'TrvExpType (mserp)'.Personal,\n                    Personal_1,\n                    'TrvExpType (mserp)'.Airline,\n                    Airline_1,\n                    'TrvExpType (mserp)'.'Car rental',\n                    CarRental_1,\n                    'TrvExpType (mserp)'.Conference,\n                    Conference_1,\n                    'TrvExpType (mserp)'.Entertainment,\n                    Entertainment_1,\n                    'TrvExpType (mserp)'.Hotel,\n                    Hotel_1,\n                    'TrvExpType (mserp)'.Meals,\n                    Meals_1,\n                    'TrvExpType (mserp)'.'Gift certificates/Tangible gifts',\n                    Gift_1,\n                    Misc_1\n                ),\n            iconYellow : \n                Switch(\n                    ThisRecord.'Expense type',\n                    'TrvExpType (mserp)'.'Cash advance returns',\n                    Cash_2,\n                    'TrvExpType (mserp)'.'Per diem',\n                    perdiemWarning,\n                    'TrvExpType (mserp)'.Mileage,\n                    Mileage_2,\n                    'TrvExpType (mserp)'.Personal,\n                    Personal_2,\n                    'TrvExpType (mserp)'.Airline,\n                    Airline_2,\n                    'TrvExpType (mserp)'.'Car rental',\n                    CarRental_2,\n                    'TrvExpType (mserp)'.Conference,\n                    Conference_2,\n                    'TrvExpType (mserp)'.Entertainment,\n                    Entertainment_2,\n                    'TrvExpType (mserp)'.Hotel,\n                    Hotel_2,\n                    'TrvExpType (mserp)'.Meals,\n                    Meals_2,\n                    'TrvExpType (mserp)'.'Gift certificates/Tangible gifts',\n                    Gift_2,\n                    Misc_2\n                )\n        }\n    )\n);\n\nSet(\n    gblWarningOnEdit,\n    true\n);\nSet(\n    gblWarningOnCreate,\n    true\n);\n\nSet(\n    gblParams,\n    {\n        dropDownHeight : 60,\n        dorpDownBorderThickness : 2,\n        dropDownBorderColor : RGBA(34, 102, 227, 1),\n        dropDownLabelColor : Color.Black,\n        dropDownHoverFill : RGBA(204, 222, 255, 1),\n        errorMessageSize : 18,\n        dropDownFontSize : 24,\n        expenseDataCardViewOnly: RGBA(110, 110, 110, 1),\n        notificationTime : 6000\n    }\n);\nSet(\n    varSelectedTab,\n    2\n);\nSet(\n    varAppMode,\n    \"ExpenseReport\"\n);\nSet(\n    varSelectedTravelReq,\n    Blank()\n);\n\nClearCollect(\n    labelTableLookUp,\n    {\n        fieldName : \"\",\n        labelName : \"\",\n        localisedLabelName : \"\",\n        visible : true,\n        required : false\n    }\n);\nClear(labelTableLookUp);\nClear(gblExpenseReportFieldVisibilityLookup); \nClear(gblExpenseReportFieldVisibilityReImaginedLookup);\nSet(   \n    userRecord,\n    LookUp('Expense mobile master data (mserp)',Email = User().Email)\n);\nSet(\n    varDefaultSalesTaxGroupUserContext,\n    userRecord.WorkerDefaultTaxGroup\n);\nSet(\n    varDefaultLegalEntity,\n    userRecord.UserPreferredLegalEntity\n);\n//Set(\n//    varDefaultLanguage,\n//    Coalesce(\n//        userRecord.UserPreferredLanguage,\n//        \"en-US\"\n//    )\n//);\nSet(\n    varDefaultLanguage,\n    \"en-us\" \n);\nClear(collectionCountries);\n\nCollect(\n    collectionCountries,\n    ForAll(\n        Filter('Country Region Translation for Expense Mobile (mserp)', Language = varDefaultLanguage) As countryRegion,\n        {\n            Code: countryRegion.'Country/region',\n            Name: countryRegion.'Short name'\n        }\n    )\n);\n\nIf(\n    LookUp('Legal entities (mserp)',Company = varDefaultLegalEntity,IsEmployed) = 'NoYes (mserp)'.Yes,\n    Set(\n        varSelectedLegalEntity, Upper(Text(varDefaultLegalEntity))\n    ),\n    Set(\n        varSelectedLegalEntity, Blank()\n    )\n);\n\nClearCollect(\n    collectionICLE,\n    ForAll(\n    Split(LookUp('Legal entities (mserp)', Upper(Company) = varSelectedLegalEntity,IntercompanyLEs), \",\") As legalEntityAlias,\n    {\n        Value: Upper(legalEntityAlias.Value)\n    }\n    )\n);\nIf(\n    !IsBlank(varSelectedLegalEntity),\n    Set(\n        varDefaultCurrency,\n        LookUp('Legal entities (mserp)',Company = varSelectedLegalEntity, Currency)\n    )\n);\n////////////////Concurrent API calls to get master data and expense lines data//////////////////\nIf(\n    IsBlank(varSelectedLegalEntity),\n    Notify(\n        GlobalLabels.Labels.'15062:LocalizedName,msdyn_WeCouldntFindEmploymentLabel',\n        NotificationType.Error,\n        gblParams.notificationTime\n    )\n);\nSet(\n    varOCREnabled,\n    userRecord.IsExpenseOCREnabled = 'NoYes (mserp)'.Yes\n);\nSet(\n    NotFoundStatusCode,\n    \"404\"\n);\nClearCollect(\n    dsReceiptImages,\n    {\n        docuRefRecId : \"\",\n        base64 : \"\"\n    }\n);\nClear(dsReceiptImages);\n// Document Status collections updated to use new 'Document Status (mserp)' OptionSet\n// New OptionSet values: Draft, Submitted, Approved, Rejected\nClearCollect(\n   dsDrafts,\n   [\n       'Document Status (mserp)'.Draft\n   ]\n);\nClearCollect(\n   dsInReview,\n   [\n       'Document Status (mserp)'.Submitted\n   ]\n);\nClearCollect(\n   dsApproved,\n   [\n       'Document Status (mserp)'.Approved\n   ]\n);\nClearCollect(\n   dsRejected,\n   [\n       'Document Status (mserp)'.Rejected\n   ]\n);\nSet(\n    blankImage,\n    \"data:image/png;base64,\"\n);\nSet(\n    userImage,\n    LookUp('View User image for Expense Mobile (mserp)',User = userRecord.ID,UserImage)\n);\nSet(\n    gblDatePickerResolutionFactor,\n    0.0186\n);\nSet(\n    gblMin,\n    -79228162514264337593543950335\n);\nSet(\n    gblMax,\n    79228162514264337593543950335\n)"
    StartScreen: ='Main Screen'
    Theme: =PowerAppsTheme
