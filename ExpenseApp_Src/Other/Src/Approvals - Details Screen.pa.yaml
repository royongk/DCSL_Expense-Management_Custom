                        AlignInContainer: =AlignInContainer.SetByContainer
                        BorderColor: =RGBA(0, 18, 107, 1)
                        DelayItemLoading: =false
                        Fill: =Color.White
                        FocusedBorderColor: =
                        FocusedBorderThickness: =0
                        Height: =
                        Items: =Filter(colExpensesAgainstWorkItem, 'Expense line type' <> 'Expense line type (mserp)'.'Itemized line')
                        LayoutMinWidth: =Parent.Width
                        LoadingSpinner: =LoadingSpinner.None
                        OnSelect: |
                          =
                          Concurrent(
                              Set(
                                  varIsCreate,
                                  false
                              ),
                              Set(
                                  varReceiptImage,  //set as receiptUrl of attached expense
                                  Blank()
                              )
                          );
                          Set(
                              varExpenseAgainstWorkItem,
                              LookUp('Expense Lines Attached to a Report for Approvals (mserp)', 'Expense transaction number (mserp_exptransnumber)' = ThisItem.'Expense transaction number (mserp_exptransnumber)')
                          );
                          Set(
                              varReceiptImage,
                              LookUp(receiptsAgainstWorkItems,ExpenseLineAttachedTo = varExpenseAgainstWorkItem.'Expense transaction number (mserp_exptransnumber)',CapturedDocument)
                          );
                          Set(
                              varFileFormat,
                              LookUp(receiptsAgainstWorkItems,ExpenseLineAttachedTo = varExpenseAgainstWorkItem.'Expense transaction number (mserp_exptransnumber)',FileExtension)
                          );
                          Set(
                              varSelectedReceiptNumber,
                              Blank()
                          );
                          If(
                              varExpenseAgainstWorkItem.PolicyViolationCount,
                              ClearCollect(
                                  colPolViolations,
                                  Split(varExpenseAgainstWorkItem.PolicyViolationMessage, "~|~")
                              );
                              UpdateContext({varMaxViolationLevel : varExpenseAgainstWorkItem.PolicyViolationsLevel});
                              UpdateContext({varNumViolation : varExpenseAgainstWorkItem.PolicyViolationCount}),
                              Clear(colPolViolations);
                              UpdateContext({varMaxViolationLevel : 0});
                              UpdateContext({varNumViolation : 0})
                          );
                          UpdateContext({testVar : varExpenseAgainstWorkItem});
                          Navigate('Expenses - View Only Screen', ScreenTransition.None, {varNavigatedFrom : "scr22", varMaxViolationLevel : varMaxViolationLevel, varNumViolation : varNumViolation})
