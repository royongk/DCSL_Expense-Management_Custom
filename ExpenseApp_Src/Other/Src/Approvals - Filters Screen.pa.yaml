            Y: =637
      - scr25_shp_ButtonCard:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =RGBA(248, 248, 248, 1)
            Height: =250
            Width: =Parent.Width
            Y: =Parent.Height-scr25_shp_ButtonCard.Height
      - scr25_btn_Cancel:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(34, 102, 227, 1)
            Color: |+
              =RGBA(34, 102, 227, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =Color.White
            Font: =Font.'Segoe UI'
            Height: =76
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            OnSelect: |-
              =Select(scr25_lbl_ClearAll);
              Navigate('Approvals - List Screen')
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Size: =19.15
            Text: =GlobalLabels.Labels.'15062:LocalizedName,msdyn_CancelLabel'
            Width: =Parent.Width -  Self.X*2
            X: =40
            Y: =scr25_shp_ButtonCard.Y + 140
      - scr25_btn_ApplyFilter:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(34, 102, 227, 1)
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: |
              =RGBA(34, 102, 227, 1)
            Font: =Font.'Segoe UI'
            Height: =76
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            OnSelect: |+
              =//Store the values context variables
              //Navigate(scr21_ApprovalsList)
              UpdateContext({varSelectedUsers : scr25_cmb_User.SelectedItems});
              UpdateContext({varSelectedProjects : scr25_cmb_Project.SelectedItems});
              UpdateContext({
                  varMinMaxAmounts : {
                          minAmount : Coalesce(Value(scr25_txt_MinAmount.Text), 0), 
                          maxAmount : Coalesce(Value(scr25_txt_MaxAmount.Text), 1000000)
                  }
              });
              UpdateContext({varDateFilter : First(SortByColumns(colSelectedFilterOptions, "number")).number}); 
              Navigate('Approvals - List Screen', ScreenTransition.None, 
                  {
                      varSelectedUsers : varSelectedUsers, 
                      varSelectedProjects : varSelectedProjects,
                      varMinMaxAmounts : varMinMaxAmounts,
                      varDateFilter : varDateFilter,
                      varFiltersApplied : ((!IsBlank(varSelectedUsers) && !IsEmpty(varSelectedUsers)) ||
                                           (!IsBlank(varSelectedProjects) && !IsEmpty(varSelectedProjects)) ||
                                           (varMinMaxAmounts.minAmount <> 0 || varMinMaxAmounts.maxAmount <> 1000000) ||
                                           (!IsBlank(varSelectedProjects) && !IsEmpty(varSelectedProjects)))
                  }
              )
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Size: =19.15
            Text: =GlobalLabels.Labels.'15062:LocalizedName,msdyn_ApplyLabel'
            Width: =Parent.Width -  Self.X*2
            X: =40
            Y: |-
              =
              scr25_shp_ButtonCard.Y + 35
