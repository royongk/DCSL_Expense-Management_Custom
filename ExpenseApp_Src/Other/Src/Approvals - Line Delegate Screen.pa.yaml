Screens:
  Approvals - Line Delegate Screen:
    Properties:
      Fill: |
        =RGBA(244, 244, 244, 1)
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |-
        =Reset(scr24_txt_Comments_2);
        Reset(scr24_cmb_AssignedTo_2);
        If(
            IsEmpty(collectionUsers),
            UpdateContext({
                flowResponse:
                'View/Approve/Reject Expense Lines for Approvals (mserp)'.mserp_trvexpmobilelineapprovalentity_getdelegatelist(First('View/Approve/Reject Expense Lines for Approvals (mserp)').'View/Approve/Reject Expense Lines for Approvals (mserp)').return
            });
            ForAll(
                Table(
                    ParseJSON(
                        flowResponse
                    )
                ),
                Collect(
                    collectionUsers,
                    {
                        id: Text(ThisRecord.Value.Id),       
                        name : Text(ThisRecord.Value.Name),
                        email : Text(ThisRecord.Value.Email)
                    }
                )
            )
        );
    Children:
      - scr24_shp_ButtonCard_1:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =RGBA(248, 248, 248, 1)
            Height: =250
            Width: =Parent.Width
            Y: =Parent.Height-scr24_shp_ButtonCard_1.Height
      - scr24_btn_Cancel_1:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(34, 102, 227, 1)
            Color: |
              =RGBA(34, 102, 227, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =Color.White
            Font: =Font.'Segoe UI'
            Height: =76
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            OnSelect: |-
              =//navigate to previous screen
              Navigate('Approvals - Line Details Screen')
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Size: =19.15
            Text: =GlobalLabels.Labels.'15062:LocalizedName,msdyn_CancelLabel'
            Width: |
              =Parent.Width -  Self.X*2
            X: =40
            Y: =scr24_shp_ButtonCard_1.Y + 140
      - scr24_btn_DelegateAction_1:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(34, 102, 227, 1)
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            DisplayMode: |-
              =If(
                  IsBlank(scr24_cmb_AssignedTo_2.Selected),
                  DisplayMode.Disabled,
                  DisplayMode.Edit
              )
            Fill: |
              =RGBA(34, 102, 227, 1)
            Font: =Font.'Segoe UI'
            Height: =76
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            OnSelect: |-
              =Clear(actionErrors);
              ForAll(
                  colSelectedLineItemIds,
                  With(
                      {
                          varSelectedRecord : LookUp(
                              'View/Approve/Reject Expense Lines for Approvals (mserp)',
                              'Expense transaction number (mserp_exptransnumber)' = colSelectedLineItemIds[@transactionId]
                          )
                      },
                      IfError(
                          Patch(
                              'View/Approve/Reject Expense Lines for Approvals (mserp)',
                              varSelectedRecord,
                              {
                                  Action: "Delegate",
                                  WorkflowComment: scr24_txt_Comments_2.Text,
                                  DelegateUserId: scr24_cmb_AssignedTo_2.Selected.id  
                              }
                          ),
                          First(
                              Collect( 
                                  actionErrors,
                                  {
                                      statusCode : FirstError.Details.HttpStatusCode,
                                      response : FirstError.Details.HttpResponse
                                  }
                              ) 
                          )
                      )
                  )
              );
              RemoveIf(
                  actionErrors,
                  Text(statusCode) = NotFoundStatusCode
              );
              If(
                  CountRows(
                      Distinct(
                          actionErrors,
                          statusCode
                      )
                  ) >= 1,
                  ForAll(
                      actionErrors,
                      If(
                          Text(ThisRecord.statusCode) <> NotFoundStatusCode,
                          Notify(
                              Substitute(
                                  Match(
                                      ThisRecord.response,
                                      """message"":""([^""]*)"""
                                  ).FullMatch,
                                  """message"":",
                                  ""
                              ),
                              NotificationType.Error
                          )
                      )
                  ),
                  Notify(
                      Substitute(GlobalLabels.Labels.'15062:LocalizedName,msdyn_ExpenseDelegateSuccessfulLabel', "$", scr24_cmb_AssignedTo_2.Selected.name),
                      NotificationType.Success
                  );
                  Navigate('Approvals - List Screen')
              )
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Size: =19.15
            Text: =GlobalLabels.Labels.'15062:LocalizedName,msdyn_DelegateLabel'
            Width: |
              =Parent.Width -  Self.X*2
            X: =40
            Y: |-
              =
              scr24_shp_ButtonCard_1.Y + 35
      - DelegateDetails_1:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =scr24_shp_ButtonCard_1.Y - Self.Y
            LayoutDirection: =LayoutDirection.Vertical
            LayoutOverflowY: =LayoutOverflow.Scroll
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
            Y: =scr24_hdr_TopHeader_3.Height
          Children:
            - AssignTo_1:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =150
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =10
                  LayoutJustifyContent: =LayoutJustifyContent.Center
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  LayoutMinWidth: =Parent.Width
                  PaddingLeft: =25
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width
                Children:
                  - scr24_lbl_AssignTo_2:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Font: =Font.'Segoe UI'
                        Height: =32
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingTop: =0
                        Size: =18
                        TabIndex: =0
                        Text: =GlobalLabels.Labels.'15062:LocalizedName,msdyn_AssignToLabel'
                        VerticalAlign: =VerticalAlign.Top
                        Width: =300
                        X: =
                        Y: =
                  - scr24_cmb_AssignedTo_2:
                      Control: Classic/ComboBox@2.4.0
                      Properties:
                        AccessibleLabel: ="Assign To"
                        BorderColor: =gblParams.dropDownBorderColor
                        BorderThickness: =gblParams.dorpDownBorderThickness
                        ChevronBackground: =RGBA(56, 96, 178, 1)
                        ChevronFill: =RGBA(255, 255, 255, 1)
                        ChevronHoverBackground: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                        ChevronHoverFill: =RGBA(255, 255, 255, 1)
                        DisplayFields: =["name","mserp_description"]
                        FocusedBorderThickness: =2
                        Font: =Font.'Open Sans'
                        Height: =gblParams.dropDownHeight
                        HoverFill: =gblParams.dropDownHoverFill
                        InputTextPlaceholder: =GlobalLabels.Labels.'15062:LocalizedName,msdyn_EnterUserNameLabel'
                        Items: =collectionUsers
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        NoSelectionText: =GlobalLabels.Labels.'15062:LocalizedName,msdyn_EnterUserNameLabel'
                        OnChange: =
                        OnSelect: |-
                          =UpdateContext({varOnSelectTriggered: true});
                        PressedColor: =RGBA(255, 255, 255, 1)
                        PressedFill: =RGBA(0, 18, 107, 1)
                        SearchFields: =["name"]
                        SelectMultiple: =false
                        SelectionColor: =Color.Black
                        SelectionFill: =gblParams.dropDownBorderColor
                        SelectionTagColor: =RGBA(0, 0, 0, 1)
                        Size: =24
                        Width: =Parent.Width - 2 * Self.X
                        X: =40
                        Y: =scr17_hdr_TopHeader_1.Height + 66
            - Comments_1:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =250
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =10
                  LayoutJustifyContent: =LayoutJustifyContent.Center
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  LayoutMinWidth: =Parent.Width
                  PaddingLeft: =25
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width
                Children:
                  - scr24_lbl_Comments_2:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Font: =Font.'Segoe UI'
                        Height: =32
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingTop: =0
                        Size: =18
                        TabIndex: =0
                        Text: =GlobalLabels.Labels.'15062:LocalizedName,msdyn_CommentsOptionalLabel'
                        VerticalAlign: =VerticalAlign.Top
                        Width: =300
                        X: =
                        Y: =
                  - scr24_txt_Comments_2:
                      Control: Classic/TextInput@2.3.2
                      Properties:
                        AccessibleLabel: ="Comments, optional"
                        BorderColor: =RGBA(255, 255, 255, 1)
                        BorderThickness: =0
                        Default: |-
                          =If(
                              !(IsBlank(varSelectedReport) || IsBlank(varSelectedReport.Description)),
                              varSelectedReport.Description
                          )
                        FocusedBorderThickness: =0
                        Font: =Font.'Segoe UI'
                        Height: =150
                        HintText: =GlobalLabels.Labels.'15062:LocalizedName,msdyn_EnterCommentsLabel'
                        HoverBorderColor: =RGBA(0, 18, 107, 1)
                        HoverFill: =
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        Mode: =TextMode.MultiLine
                        OnChange: |-
                          =RemoveIf(colReportPostDetails, fieldName = "Description");
                          Collect(
                              colReportPostDetails,
                              {
                                  fieldName: "Description",
                                  fieldValue: scr24_txt_Comments_2.Text,
                                  fieldType: "String"
                              }
                          )
                        OnSelect: |
                          =UpdateContext({ctLabel1 : false});
                          UpdateContext({ctLabel2 : false});
                          UpdateContext({ctLabel3 : true});
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Reset: =true
                        Size: =24
                        Width: =Parent.Width -  Self.X*2
                        X: =40
                        Y: =
            - AttachedLines:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  DropShadow: =DropShadow.None
                  Height: =scr24_shp_ButtonCard_1.Y - Self.Y
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  LayoutMinWidth: =Parent.Width
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width
                Children:
                  - scr23_shpBorder_3:
                      Control: Rectangle@2.3.0
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Fill: =RGBA(0, 0, 0, 0)
                        FillPortions: =1
                        Height: =250
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        LayoutMinHeight: =0
                        Width: =Parent.Width
                        Y: =Parent.Height-scr23_shpBorder_3.Height
                  - scr23_SelectedWorkItems_3:
                      Control: Gallery@2.15.0
                      Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver4.0
                      Properties:
                        AccessibleLabel: ="List of selected work items"
                        AlignInContainer: =AlignInContainer.SetByContainer
                        BorderColor: =RGBA(0, 18, 107, 1)
                        DelayItemLoading: =false
                        Fill: =RGBA(244, 244, 244, 1)
                        Height: =Self.TemplateHeight * Self.AllItemsCount
                        Items: |-
                          =Filter(
                              lineItemsAssignedToMe,'Expense transaction number (mserp_exptransnumber)' in colSelectedLineItemIds[@transactionId]
                          )
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        LayoutMinHeight: =Self.TemplateHeight * Self.AllItemsCount
                        LayoutMinWidth: =Parent.Width
                        ShowScrollbar: =false
                        TemplateFill: =Color.White
                        TemplatePadding: =5
                        TemplateSize: =125
                        Width: =Max(Parent.Width, App.Width)
                        Y: =Parent.Height - Self.Height
                      Children:
                        - lblLineOwner_1:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0, 18, 107, 1)
                              Font: =Font.'Segoe UI'
                              Height: =32
                              OnSelect: =Select(Parent)
                              Text: =ThisItem.User
                              Width: =371
                              Wrap: =false
                              X: =scr21_img_UserImage_7.X + scr21_img_UserImage_7.Width + 10
                              Y: =reportDate_7.Y
                        - lblMerchant_1:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0, 18, 107, 1)
                              Font: =Font.'Segoe UI'
                              Height: =34
                              OnSelect: =Select(Parent)
                              Text: |-
                                =If(
                                    ThisItem.'Expense type' = 'TrvExpType (mserp)'.'Per diem',
                                    Concatenate("Perdiem - ", ThisItem.Location),
                                    ThisItem.Merchant
                                )
                              Width: =250
                              Wrap: =false
                              X: =scr21_img_UserImage_7.X + scr21_img_UserImage_7.Width + 10
                              Y: =22
                        - reportDate_7:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Right
                              BorderColor: =RGBA(0, 18, 107, 1)
                              Color: |
                                =RGBA(102, 102, 102, 1)
                              Font: =Font.'Segoe UI'
                              Height: =29
                              OnSelect: =Select(Parent)
                              Size: =16.5
                              Text: |-
                                =Text(
                                    DateValue(ThisItem.'Transaction date'),
                                    "mmm dd, yyyy"
                                )
                              Width: =150
                              X: =reportAmount_7.X +reportAmount_7.Width - Self.Width
                              Y: =reportAmount_7.Y + reportAmount_7.Height + 10
                        - reportAmount_7:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Right
                              BorderColor: =RGBA(0, 18, 107, 1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Bold
                              Height: =39
                              OnSelect: =Select(Parent)
                              Text: |
                                =Concatenate(Text(Value(ThisItem.'Transaction amount'),"#,#0.00", varDefaultLanguage), " ", ThisItem.'Currency (mserp_exchangecode)')
                              Width: =250
                              X: =Parent.Width - Self.Width - 50
                              Y: =22
                        - scr21_img_UserImage_7:
                            Control: Image@2.2.3
                            Properties:
                              BorderColor: =RGBA(0, 18, 107, 1)
                              Height: =45
                              Image: =User().Image
                              OnSelect: =Select(Parent)
                              RadiusBottomLeft: =45
                              RadiusBottomRight: =45
                              RadiusTopLeft: =45
                              RadiusTopRight: =45
                              Width: =45
                              X: =25
                              Y: =41
      - scr24_hdr_TopHeader_3:
          Control: CanvasComponent
          ComponentName: hdr02_Header_2
          Properties:
            Fill: =scr24_hdr_TopHeader_3.paramFill
            Height: =82
            Width: =Max(App.Width, App.MinScreenWidth)
            paramColor: =RGBA(0, 0, 0, 1)
            paramFill: =RGBA(255, 255, 255, 1)
            paramTitle: =GlobalLabels.Labels.'15062:LocalizedName,msdyn_DelegateExpenseLabel'
      - scr24_ico_Back_5:
          Control: Classic/Icon@2.5.0
          Properties:
            AccessibleLabel: ="Press to go back"
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =icongconfig_backbutton.Color
            Fill: =icongconfig_backbutton.Fill
            Height: =icongconfig_backbutton.Height
            Icon: =Icon.ChevronLeft
            OnSelect: =Select(scr24_btn_Cancel_1)
            TabIndex: =0
            Width: =icongconfig_backbutton.Width
            X: =22
            Y: =(scr03_hdr_TopHeader_1.Height-Self.Height)/2
