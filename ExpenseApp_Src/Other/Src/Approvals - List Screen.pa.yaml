            - galExpenseLineItems:
                Control: Gallery@2.15.0
                Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Default: ={}
                  Items: |-
                    =SortByColumns(Filter(
                        lineItemsAssignedToMe,
                        (IsEmpty(varSelectedUsers) || IsBlank(varSelectedUsers) || User in varSelectedUsers[@Value]),
                        (IsEmpty(varSelectedProjects) || IsBlank(varSelectedProjects) || ProjectName in varSelectedProjects[@Value]),
                        (IsBlank(varDateFilter) || 
                        Switch(
                            varDateFilter,
                            1,
                            DateAdd(DateValue('Transaction date'), 7, TimeUnit.Days) >= Today(),
                            2,
                            DateAdd(DateValue('Transaction date'), 30, TimeUnit.Days) >= Today(),
                            3,
                            DateAdd(DateValue('Transaction date'), 180, TimeUnit.Days) >= Today(),
                            4,
                            DateAdd(DateValue('Transaction date'), 365, TimeUnit.Days) >= Today()
                        )),
                        ('Transaction amount' >= Coalesce(varMinMaxAmounts.minAmount, gblMin) && 'Transaction amount' <= Coalesce(varMinMaxAmounts.maxAmount, gblMax))
                    ),"mserp_transdate",SortOrder.Descending)
