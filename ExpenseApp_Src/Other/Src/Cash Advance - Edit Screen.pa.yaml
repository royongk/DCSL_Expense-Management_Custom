Screens:
  Cash Advance - Edit Screen:
    Properties:
      Fill: =RGBA(248, 248, 248, 1)
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |-
        =UpdateContext({varIsCreateCashAdvance: IsBlank(varSelectedCashAdvance)});
    Children:
      - CashAdvanceEdit_Header:
          Control: CanvasComponent
          ComponentName: hdr02_Header
          Properties:
            Fill: =CashAdvanceEdit_Header.paramFill
            Height: =82
            Width: =Max(App.Width, App.MinScreenWidth)
            paramColor: =RGBA(0, 0, 0, 1)
            paramFill: =RGBA(255, 255, 255, 1)
            paramTitle: |-
              =If(
                  varIsCreateCashAdvance,
                  "New Cash Advance",
                  "Edit Cash Advance"
              )
      - CashAdvanceEdit_BackIcon:
          Control: Classic/Icon@2.5.0
          Properties:
            AccessibleLabel: ="Press to go back"
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =icongconfig_backbutton.Color
            Fill: =icongconfig_backbutton.Fill
            Height: =icongconfig_backbutton.Height
            Icon: =Icon.ChevronLeft
            OnSelect: =Navigate('Cash Advance - List Screen', ScreenTransition.None)
            TabIndex: =0
            Width: =icongconfig_backbutton.Width
            X: =22.5
            Y: =(CashAdvanceEdit_Header.Height-Self.Height)/2
      - CashAdvanceEdit_Container:
          Control: GroupContainer@1.4.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =Parent.Height - CashAdvanceEdit_Header.Height - CashAdvanceEdit_ButtonsContainer.Height
            LayoutDirection: =LayoutDirection.Vertical
            LayoutOverflowY: =LayoutOverflow.Scroll
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
            Y: =CashAdvanceEdit_Header.Height
          Children:
            - EditCashAdvanceForm:
                Control: Form@2.4.4
                Variant: Classic
                Layout: Horizontal
                Properties:
                  AcceptsFocus: =
                  AlignInContainer: =AlignInContainer.SetByContainer
                  BorderColor: =RGBA(0, 18, 107, 1)
                  DataSource: ='DCSL TrvCash Advance Entity  (mserp)'
                  DefaultMode: |-
                    =If(
                        varIsCreateCashAdvance,
                        FormMode.New,
                        FormMode.Edit
                    )
                  Item: =If(varIsCreateCashAdvance, Defaults('DCSL TrvCash Advance Entity  (mserp)'), varSelectedCashAdvance)
                  OnFailure: |-
                    =If(
                        CountRows(Split(Text(Self.Error), ":")) > 2,
                        Notify(
                            Mid(Mid(EditCashAdvanceForm.Error, Find(":", EditCashAdvanceForm.Error) + 2), Find(":", Mid(EditCashAdvanceForm.Error, Find(":", EditCashAdvanceForm.Error) + 2)) + 2),
                            NotificationType.Error,
                            gblParams.notificationTime
                        ),
                        Notify(
                            Last(Split(Text(Self.Error), ":")).Value,
                            NotificationType.Error,
                            gblParams.notificationTime
                        )
                    )
                  OnSuccess: "=Set(varSelectedCashAdvance, EditCashAdvanceForm.LastSubmit);\n// 1. 방금 저장된 레코드(LastSubmit)를 찾아 WorkflowAction을 \"Submit\"으로 업데이트\nPatch(\n    'DCSL TrvCash Advance Entity  (mserp)',\n    EditCashAdvanceForm.LastSubmit, \n    {\n        WorkflowAction: \"Submit\"\n    }\n);\n\n// 2. (선택 사항) 업데이트 중 에러가 발생했는지 확인하는 로직 (사용자가 제공한 예시 기반)\nIf(\n    !IsEmpty(Errors('DCSL TrvCash Advance Entity  (mserp)')),\n    Notify(First(Errors('DCSL TrvCash Advance Entity  (mserp)')).Message, NotificationType.Error),\n    \n    // 3. 에러가 없으면 성공 알림 및 화면 이동\n    Notify(\"Cash Advance has been submitted successfully.\", NotificationType.Success);\n    Navigate('Cash Advance - List Screen', ScreenTransition.None);\n    ResetForm(EditCashAdvanceForm)\n)\n/*\nNotify(\"Cash advance saved successfully\", NotificationType.Success, gblParams.notificationTime);\nNavigate('Cash Advance - List Screen', ScreenTransition.None)\n*/"
                  Width: =Parent.Width
                Children:
                  - Requested date_DataCard:
                      Control: TypedDataCard@1.0.7
                      Variant: ClassicDateTimeEdit
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        DataField: ="mserp_requesteddate"
