      - CashAdvanceEdit_ButtonsButtonsContainer:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(250, 249, 248, 1)
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
            Y: =Parent.Height - Self.Height
          Children:
            - CashAdvanceEdit_SaveDraftButton:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =ColorFade(Self.Fill, -15%)
                  Color: =RGBA(255, 255, 255, 1)
                  DisabledBorderColor: =RGBA(166, 166, 166, 1)
                  Fill: =RGBA(34, 102, 227, 1)
                  Font: =Font.'Segoe UI'
                  Height: =76
                  HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                  OnSelect: "=If(\n    IsBlank(dtp_RequestedDate.SelectedDate) || IsBlank(txt_RequestedAmount.Text) || IsEmpty(cb_CostCenter.SelectedItems),\n    Notify(\"Please fill in all required fields (Requested Date, Amount)\", NotificationType.Error, gblParams.notificationTime),\n    \n    Patch(\n        'DCSL TrvCash Advance Entity  (mserp)',\n        If(varIsCreateCashAdvance, Defaults('DCSL TrvCash Advance Entity  (mserp)'), varSelectedCashAdvance),\n        {\n            'Requested date': DateTime(Year(dtp_RequestedDate.SelectedDate), Month(dtp_RequestedDate.SelectedDate), Day(dtp_RequestedDate.SelectedDate), 0, 0, 0),\n            Location: If(IsBlank(cb_Location.Selected.Location), cb_Location.SearchText, cb_Location.Selected.Location),\n            Purpose: If(IsBlank(cb_Purpose.Selected.'Purpose (mserp_value)'), cb_Purpose.SearchText, cb_Purpose.Selected.'Purpose (mserp_value)'),\n            'Requested amount': Value(Substitute(txt_RequestedAmount.Text, \",\", \"\")),\n            Currency: If(IsBlank(cb_Currency.Selected.mserp_currencycode), If(varIsCreateCashAdvance, varDefaultCurrency, varSelectedCashAdvance.Currency), cb_Currency.Selected.mserp_currencycode),\n            'Collection method': cb_CollectionMethod.Selected.Value,\n            'Collection/Transfer Date (mserp_deexcollectiontransferdate)': DateTime(Year(dtp_CollectionTrasferDate.SelectedDate), Month(dtp_CollectionTrasferDate.SelectedDate), Day(dtp_CollectionTrasferDate.SelectedDate), 0, 0, 0),\n            'Collection/Transfer Date (mserp_deexsalarydeductionperiod)': cb_SalaryDeductionPeriod.Selected.Value,\n            CostCenter: cb_CostCenter.Selected.mserp_dimensionvalue,\n            Project: cb_ProjectCode.Selected.mserp_projectvalue\n        }\n    );\n    Notify(\"Cash Advance saved successfully\", NotificationType.Success, gblParams.notificationTime);\n    Navigate('Cash Advance - List Screen', ScreenTransition.None)\n)"
                  PressedBorderColor: =Self.Fill
                  PressedColor: =Self.Fill
                  PressedFill: =Self.Color
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Size: =19.15
                  Text: ="Save Draft"
                  Width: =Parent.Width - Self.X*2
                  X: =40
                  Y: =20
            - CashAdvanceEdit_SubmitButton:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =RGBA(34, 102, 227, 1)
                  Color: =RGBA(34, 102, 227, 1)
                  DisabledBorderColor: =RGBA(166, 166, 166, 1)
                  Fill: =Color.White
                  Font: =Font.'Segoe UI'
                  Height: =76
                  HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                  OnSelect: "=If(\n    IsBlank(dtp_RequestedDate.SelectedDate) || IsBlank(txt_RequestedAmount.Text) || IsEmpty(cb_CostCenter.SelectedItems),\n    Notify(\"Please fill in all required fields (Requested Date, Amount)\", NotificationType.Error, gblParams.notificationTime),\n    \n    // 1단계: 기존 데이터를 생성하거나 수정하고, 그 결과를 'ctxSavedRecord' 변수에 저장합니다.\n    // (이때 mserp_workflowaction 필드는 업데이트하지 않습니다.)\n    UpdateContext({\n        ctxSavedRecord: Patch(\n            'DCSL TrvCash Advance Entity  (mserp)',\n            If(varIsCreateCashAdvance, Defaults('DCSL TrvCash Advance Entity  (mserp)'), varSelectedCashAdvance),\n            {\n                'Requested date': DateTime(Year(dtp_RequestedDate.SelectedDate), Month(dtp_RequestedDate.SelectedDate), Day(dtp_RequestedDate.SelectedDate), 0, 0, 0),\n                Location: If(IsBlank(cb_Location.Selected.Location), cb_Location.SearchText, cb_Location.Selected.Location),\n                Purpose: If(IsBlank(cb_Purpose.Selected.'Purpose (mserp_value)'), cb_Purpose.SearchText, cb_Purpose.Selected.'Purpose (mserp_value)'),\n                'Requested amount': Value(Substitute(txt_RequestedAmount.Text, \",\", \"\")),\n                Currency: If(IsBlank(cb_Currency.Selected.mserp_currencycode), If(varIsCreateCashAdvance, varDefaultCurrency, varSelectedCashAdvance.Currency), cb_Currency.Selected.mserp_currencycode),\n                'Collection method': cb_CollectionMethod.Selected.Value,\n                'Collection/Transfer Date (mserp_deexcollectiontransferdate)': DateTime(Year(dtp_CollectionTrasferDate.SelectedDate), Month(dtp_CollectionTrasferDate.SelectedDate), Day(dtp_CollectionTrasferDate.SelectedDate), 0, 0, 0),\n                'Collection/Transfer Date (mserp_deexsalarydeductionperiod)': cb_SalaryDeductionPeriod.Selected.Value,\n                CostCenter: cb_CostCenter.Selected.mserp_dimensionvalue,\n                Project: cb_ProjectCode.Selected.mserp_projectvalue\n            }\n        )\n    });\n    \n    // 2단계: 위에서 저장된 레코드(ctxSavedRecord)를 타겟으로 WorkflowAction을 \"Submit\"으로 업데이트합니다.\n    Patch(\n        'DCSL TrvCash Advance Entity  (mserp)',\n        ctxSavedRecord,\n        {\n            WorkflowAction: \"Submit\"\n        }\n    );\n    \n    // 3단계: 성공 알림 및 화면 이동\n    Notify(\"Cash Advance submitted successfully\", NotificationType.Success, gblParams.notificationTime);\n    Navigate('Cash Advance - List Screen', ScreenTransition.None)\n)"
                  PressedBorderColor: =Self.Fill
                  PressedColor: =Self.Fill
                  PressedFill: =Self.Color
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Size: =19.15
                  Text: ="Submit"
                  Width: =Parent.Width - Self.X*2
                  X: =40
                  Y: =CashAdvanceEdit_SaveDraftButton.Y + CashAdvanceEdit_SaveDraftButton.Height + 20
