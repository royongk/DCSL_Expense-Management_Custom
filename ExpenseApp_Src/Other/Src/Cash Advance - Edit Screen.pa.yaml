Screens:
  Cash Advance - Edit Screen:
    Properties:
      Fill: =RGBA(248, 248, 248, 1)
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |-
        =UpdateContext({ctVarCashDetailsBack:false});
        UpdateContext({varIsCreateCashAdvance: IsBlank(varSelectedCashAdvance)});
        Reset(dtp_RequestedDate);
        Reset(cb_Location);
        Reset(cb_Purpose);
        Reset(txt_RequestedAmount);
        Reset(cb_Currency);
        // --- [신규 추가] 금액 천단위 콤마 표시용 변수 초기화 ---
        UpdateContext({ locIsEditingAmount: false, dirtyTransAmount: Blank() });
    Children:
      - CashAdvanceEdit_Header:
          Control: CanvasComponent
          ComponentName: hdr02_Header
          Properties:
            Fill: =CashAdvanceEdit_Header.paramFill
            Height: =82
            Width: =Max(App.Width, App.MinScreenWidth)
            paramColor: =RGBA(0, 0, 0, 1)
            paramFill: =RGBA(255, 255, 255, 1)
            paramTitle: =If(varIsCreateCashAdvance, "New ", "Edit ") & If(varAppMode = "SalaryAdvance", "Salary Advance Request", "Cash Advance Request")
      - CashAdvanceEdit_BackIcon:
          Control: Classic/Icon@2.5.0
          Properties:
            AccessibleLabel: ="Press to go back"
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =icongconfig_backbutton.Color
            Fill: =icongconfig_backbutton.Fill
            Height: =icongconfig_backbutton.Height
            Icon: =Icon.ChevronLeft
            OnSelect: |-
              =If(
                  varIsCreateCashAdvance, 
                  UpdateContext({ctVarCashDetailsBack: true}),          // 신규 모드면: 다이얼로그 변수 True
                  Navigate('Cash Advance - List Screen', ScreenTransition.None) // 수정 모드면: 즉시 이동
              )
            TabIndex: =0
            Width: =icongconfig_backbutton.Width
            X: =22.5
            Y: =(CashAdvanceEdit_Header.Height-Self.Height)/2
      - CashAdvanceEdit_Container:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =Parent.Height - CashAdvanceEdit_Header.Height - CashAdvanceEdit_ButtonsButtonsContainer.Height
            LayoutDirection: =LayoutDirection.Vertical
            LayoutOverflowY: =LayoutOverflow.Scroll
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
            Y: =CashAdvanceEdit_Header.Height
          Children:
            - CollectionMethod_Container:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  DropShadow: =DropShadow.None
                  Height: =LblContainer_CollectionMethod.Height + cb_CollectionMethod.Height + 20
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =10
                  LayoutMinHeight: =32
                  LayoutMinWidth: =32
                  PaddingLeft: =25
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width
                Children:
                  - LblContainer_CollectionMethod:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        DropShadow: =DropShadow.None
                        Height: =35
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutMinHeight: =32
                        LayoutMinWidth: =32
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =Parent.Width
                      Children:
                        - lbl_CollectionMethod:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0, 18, 107, 1)
                              Font: =Font.'Segoe UI'
                              Height: =32
                              LayoutMinHeight: =40
                              LayoutMinWidth: =150
                              Size: =18
                              Text: ="Collection Method"
                              VerticalAlign: =VerticalAlign.Top
                              Width: =Parent.Width
                  - cb_CollectionMethod:
                      Control: Classic/ComboBox@2.4.0
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        ChevronBackground: =RGBA(56, 96, 178, 1)
                        ChevronFill: =RGBA(255, 255, 255, 1)
                        ChevronHoverBackground: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                        ChevronHoverFill: =RGBA(255, 255, 255, 1)
                        DefaultSelectedItems: =If(!varIsCreateCashAdvance, [varSelectedCashAdvance.'Collection method'])
                        DisplayFields: =["Value"]
                        FillPortions: =1
                        Font: =Font.'Open Sans'
                        Height: =Min('Cash Advance - Edit Screen'.Height * 0.0616, 50)
                        HoverFill: =RGBA(186, 202, 226, 1)
                        InputTextPlaceholder: ="Select method"
                        Items: =Choices('DCSL TrvCash Advance Entity  (mserp)'.'Collection method')
                        LayoutMinHeight: =40
                        LayoutMinWidth: =328
                        PaddingBottom: =5
                        PaddingLeft: =5
                        PaddingRight: =5
                        PaddingTop: =5
                        PressedColor: =RGBA(255, 255, 255, 1)
                        PressedFill: =RGBA(0, 18, 107, 1)
                        SearchFields: =["Value"]
                        SelectMultiple: =false
                        SelectionColor: =RGBA(255, 255, 255, 1)
                        SelectionFill: =RGBA(56, 96, 178, 1)
                        Width: =Parent.Width - Self.X*2
                        X: =40
