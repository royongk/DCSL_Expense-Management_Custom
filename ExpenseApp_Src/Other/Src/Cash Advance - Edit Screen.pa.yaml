                              Font: =Font.'Segoe UI'
                              Height: =32
                              LayoutMinHeight: =40
                              LayoutMinWidth: =150
                              Size: =18
                              Text: ="Purpose"
                              VerticalAlign: =VerticalAlign.Top
                              Width: =Parent.Width
                  - cb_Purpose:
                      Control: Classic/ComboBox@2.4.0
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        ChevronBackground: =RGBA(56, 96, 178, 1)
                        ChevronFill: =RGBA(255, 255, 255, 1)
                        ChevronHoverBackground: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                        ChevronHoverFill: =RGBA(255, 255, 255, 1)
                        DefaultSelectedItems: "=If(\n    !varIsCreateCashAdvance, \n    // 1. 기존 데이터를 수정하는 경우 (기존 로직 유지)\n    LookUp(\n        'DimAttributeTrvTravelTxtEntity (mserp)', \n        'Purpose (mserp_value)' = varSelectedCashAdvance.Purpose\n    ), \n    \n    // 2. 신규 생성하는 경우 (AppMode에 따른 자동 선택 로직 추가)\n    LookUp(\n        'DimAttributeTrvTravelTxtEntity (mserp)', \n        'Purpose (mserp_value)' = If(varAppMode = \"SalaryAdvance\", \"Salary Advance\", \"Cash Advance\")\n    )\n)"
                        DisplayFields: =["mserp_value"]
                        DisplayMode: |-
                          =If(
                              varAppMode in ["CashAdvance", "SalaryAdvance"] && !IsEmpty(Self.SelectedItems),
                              DisplayMode.View,
                              DisplayMode.Edit
                          )
                        FillPortions: =1
                        Font: =Font.'Open Sans'
                        Height: =Min('Cash Advance - Edit Screen'.Height * 0.0616, 50)
                        HoverFill: =RGBA(186, 202, 226, 1)
                        InputTextPlaceholder: ="Select Purpose"
                        Items: =Filter('DimAttributeTrvTravelTxtEntity (mserp)', 'Company Code' = varSelectedLegalEntity)
                        LayoutMinHeight: =40
                        LayoutMinWidth: =328
                        PaddingBottom: =5
                        PaddingLeft: =5
                        PaddingRight: =5
                        PaddingTop: =5
                        PressedColor: =RGBA(255, 255, 255, 1)
                        PressedFill: =RGBA(0, 18, 107, 1)
                        SearchFields: =["mserp_value"]
                        SelectMultiple: =false
                        SelectionColor: =RGBA(255, 255, 255, 1)
                        SelectionFill: =RGBA(56, 96, 178, 1)
                        Width: =Parent.Width - Self.X*2
                        X: =40
            - RequestedAmount_Container:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  DropShadow: =DropShadow.None
                  Height: =LblContainer_RequestedAmount.Height + txt_RequestedAmount.Height + 20
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =10
                  LayoutMinHeight: =32
                  LayoutMinWidth: =32
                  PaddingLeft: =25
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width
                Children:
                  - LblContainer_RequestedAmount:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        DropShadow: =DropShadow.None
                        Height: =35
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutMinHeight: =32
                        LayoutMinWidth: =32
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =Parent.Width
                      Children:
                        - lbl_RequestedAmount:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0, 18, 107, 1)
                              Font: =Font.'Segoe UI'
                              Height: =32
                              LayoutMinHeight: =40
                              LayoutMinWidth: =150
                              Size: =18
                              Text: ="* Requested Amount"
                              VerticalAlign: =VerticalAlign.Top
                              Width: =Parent.Width
                  - txt_RequestedAmount:
                      Control: Classic/TextInput@2.3.2
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Default: |-
                          =If(
                              varIsCreateCashAdvance && IsBlank(dirtyTransAmount),
                              "",
                              With(
                                  { 
                                      baseAmount: Value(Coalesce(dirtyTransAmount, Text(varSelectedCashAdvance.'Requested amount'))) 
                                  },
                                  If(
                                      locIsEditingAmount, 
                                      Text(baseAmount, "#"),                   
                                      Text(baseAmount, "#,##0.00", "en-US") // 소수점이 필요없다면 "#,##0" 으로 변경 가능
                                  )
                              )
                          )
                        FillPortions: =1
                        Font: =Font.'Open Sans'
                        Height: =Min('Cash Advance - Edit Screen'.Height * 0.0616, 50)
                        HintText: ="0.00"
                        HoverBorderColor: =RGBA(0, 18, 107, 1)
                        HoverFill: =RGBA(186, 202, 226, 1)
                        LayoutMinHeight: =40
                        LayoutMinWidth: =320
                        OnChange: |-
                          =UpdateContext({ dirtyTransAmount: Substitute(Self.Text, ",", "") });
                          UpdateContext({ locIsEditingAmount: false });
                          Reset(Self);
                        OnSelect: |-
                          =UpdateContext({ locIsEditingAmount: true })
                        Width: =Parent.Width - Self.X*2
                        X: =40
