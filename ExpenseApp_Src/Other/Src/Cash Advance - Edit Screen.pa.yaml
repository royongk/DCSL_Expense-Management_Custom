Screens:
  Cash Advance - Edit Screen:
    Properties:
      Fill: =RGBA(248, 248, 248, 1)
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |-
        =UpdateContext({varIsCreateCashAdvance: IsBlank(varSelectedCashAdvance)});
    Children:
      - CashAdvanceEdit_Header:
          Control: CanvasComponent
          ComponentName: hdr02_Header
          Properties:
            Fill: =CashAdvanceEdit_Header.paramFill
            Height: =82
            Width: =Max(App.Width, App.MinScreenWidth)
            paramColor: =RGBA(0, 0, 0, 1)
            paramFill: =RGBA(255, 255, 255, 1)
            paramTitle: |-
              =If(
                  varIsCreateCashAdvance,
                  "New Cash Advance",
                  "Edit Cash Advance"
              )
      - CashAdvanceEdit_BackIcon:
          Control: Classic/Icon@2.5.0
          Properties:
            AccessibleLabel: ="Press to go back"
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =icongconfig_backbutton.Color
            Fill: =icongconfig_backbutton.Fill
            Height: =icongconfig_backbutton.Height
            Icon: =Icon.ChevronLeft
            OnSelect: =Navigate('Cash Advance - List Screen', ScreenTransition.None)
            TabIndex: =0
            Width: =icongconfig_backbutton.Width
            X: =22.5
            Y: =(CashAdvanceEdit_Header.Height-Self.Height)/2
      - CashAdvanceEdit_Container:
          Control: GroupContainer@1.4.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =Parent.Height - CashAdvanceEdit_Header.Height - CashAdvanceEdit_ButtonsContainer.Height
            LayoutDirection: =LayoutDirection.Vertical
            LayoutOverflowY: =LayoutOverflow.Scroll
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
            Y: =CashAdvanceEdit_Header.Height
          Children:
            - EditCashAdvanceForm:
                Control: Form@2.4.4
                Variant: Classic
                Layout: Horizontal
                Properties:
                  AcceptsFocus: =
                  AlignInContainer: =AlignInContainer.SetByContainer
                  BorderColor: =RGBA(0, 18, 107, 1)
                  DataSource: ='Cash advances (mserp)'
                  DefaultMode: |-
                    =If(
                        varIsCreateCashAdvance,
                        FormMode.New,
                        FormMode.Edit
                    )
                  Item: =varSelectedCashAdvance
                  OnFailure: |-
                    =If(
                        CountRows(Split(Text(Self.Error), ":")) > 2,
                        Notify(
                            Mid(Mid(EditCashAdvanceForm.Error, Find(":", EditCashAdvanceForm.Error) + 2), Find(":", Mid(EditCashAdvanceForm.Error, Find(":", EditCashAdvanceForm.Error) + 2)) + 2),
                            NotificationType.Error,
                            gblParams.notificationTime
                        ),
                        Notify(
                            Last(Split(Text(Self.Error), ":")).Value,
                            NotificationType.Error,
                            gblParams.notificationTime
                        )
                    )
                  OnSuccess: |-
                    =Set(varSelectedCashAdvance, EditCashAdvanceForm.LastSubmit);
                    Notify("Cash advance saved successfully", NotificationType.Success, gblParams.notificationTime);
                    Navigate('Cash Advance - List Screen', ScreenTransition.None)
                  Width: =Parent.Width
                Children:
                  - Requested date_DataCard:
                      Control: TypedDataCard@1.0.7
                      Variant: ClassicDateTimeEdit
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        DataField: ="mserp_requesteddate"
                        Default: =ThisItem.'Requested date'
                        DisplayName: ="Requested date"
                        Height: =80
                        Required: =true
                        Update: =DatePicker_CashAdvance_RequestedDate.SelectedDate
                        Width: =Min(Parent.Width, 640)
                        X: =(Parent.Width - Self.Width) / 2
                        Y: =0
                      Children:
                        - CashAdvance_RequestedDate_Label:
                            Control: Label@2.5.1
                            Properties:
                              AutoHeight: =true
                              BorderColor: =RGBA(0, 0, 0, 0)
                              Color: =gblParams.dropDownLabelColor
                              Font: =Font.'Segoe UI'
                              Height: =24
                              Text: ="Requested date"
                              Width: =Parent.Width - 60
                              Wrap: =false
                              X: =30
                              Y: =5
                        - CashAdvance_RequestedDate_Star:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Center
                              BorderColor: =RGBA(0, 0, 0, 0)
                              Color: =RGBA(0, 18, 107, 1)
                              Font: =Font.'Open Sans'
                              Height: =CashAdvance_RequestedDate_Label.Height
                              Text: ="*"
                              Visible: =And(Parent.Required, Parent.DisplayMode = DisplayMode.Edit)
                              Width: =30
                              Wrap: =false
                              X: =CashAdvance_RequestedDate_Label.X + CashAdvance_RequestedDate_Label.Width
                              Y: =CashAdvance_RequestedDate_Label.Y
                        - DatePicker_CashAdvance_RequestedDate:
                            Control: Classic/DatePicker@2.6.0
                            Properties:
                              BorderColor: =RGBA(0, 18, 107, 1)
                              DisplayMode: =Parent.DisplayMode
                              Font: =Font.'Open Sans'
                              Height: =gblParams.dropDownHeight
                              IconBackground: =RGBA(56, 96, 178, 1)
                              IconFill: =RGBA(255, 255, 255, 1)
                              Size: =14
                              Width: =Parent.Width - 80
                              X: =40
                              Y: =CashAdvance_RequestedDate_Label.Y + CashAdvance_RequestedDate_Label.Height + 8
                  - Location_DataCard:
                      Control: TypedDataCard@1.0.7
                      Variant: ClassicTextualEdit
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        DataField: ="mserp_location"
                        Default: =ThisItem.Location
                        DisplayName: ="Location"
                        Height: =80
                        MaxLength: =DataSourceInfo(%DATACARD_DATASOURCE_NAME.ID%, %DataSourceInfo.RESERVED%.MaxLength, '%DATACARD_FIELD_NAME.ID%')
                        Required: =true
                        Update: =If(IsBlank(ComboBox_CashAdvance_Location.Selected.Location), ComboBox_CashAdvance_Location.SearchText, ComboBox_CashAdvance_Location.Selected.Location)
                        Width: =Min(Parent.Width, 640)
                        X: =(Parent.Width - Self.Width) / 2
                        Y: =1
                      Children:
                        - CashAdvance_Location_Label:
                            Control: Label@2.5.1
                            Properties:
                              AutoHeight: =true
                              BorderColor: =RGBA(0, 0, 0, 0)
                              Color: =gblParams.dropDownLabelColor
                              Font: =Font.'Segoe UI'
                              Height: =24
                              Text: ="Location"
                              Width: =Parent.Width - 60
                              Wrap: =false
                              X: =20
                              Y: =5
                        - CashAdvance_Location_Star:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Center
                              BorderColor: =RGBA(0, 0, 0, 0)
                              Font: =Font.'Open Sans'
                              Height: =CashAdvance_Location_Label.Height
                              Text: ="*"
                              Visible: =And(Parent.Required, Parent.DisplayMode = DisplayMode.Edit)
                              Width: =30
                              Wrap: =false
                              X: =CashAdvance_Location_Label.X + CashAdvance_Location_Label.Width
                              Y: =CashAdvance_Location_Label.Y
                        - ComboBox_CashAdvance_Location:
                            Control: Classic/ComboBox@2.4.0
                            Properties:
                              BorderColor: =RGBA(0, 18, 107, 1)
                              ChevronBackground: =RGBA(56, 96, 178, 1)
                              ChevronFill: =RGBA(255, 255, 255, 1)
                              ChevronHoverBackground: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                              ChevronHoverFill: =RGBA(255, 255, 255, 1)
                              DefaultSelectedItems: =If(IsBlank(ThisItem.Location), Blank(), LookUp('Travel locations (mserp)', Location = ThisItem.Location))
                              DisplayFields: =["mserp_destination"]
                              DisplayMode: =Parent.DisplayMode
                              Font: =Font.'Open Sans'
                              Height: =gblParams.dropDownHeight
                              HoverFill: =RGBA(186, 202, 226, 1)
                              Items: =Filter('Travel locations (mserp)', 'Company Code' = varSelectedLegalEntity)
                              PaddingBottom: =5
                              PaddingLeft: =5
                              PaddingRight: =5
                              PaddingTop: =5
                              PressedColor: =RGBA(255, 255, 255, 1)
                              PressedFill: =RGBA(0, 18, 107, 1)
                              SearchFields: =["mserp_destination"]
                              SelectMultiple: =false
                              SelectionColor: =RGBA(255, 255, 255, 1)
                              SelectionFill: =RGBA(56, 96, 178, 1)
                              Size: =13
                              Width: =Parent.Width - 80
                              X: =40
                              Y: =CashAdvance_Location_Label.Y + CashAdvance_Location_Label.Height + 8
                  - Purpose_DataCard:
                      Control: TypedDataCard@1.0.7
                      Variant: ClassicTextualEdit
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        DataField: ="mserp_purpose"
                        Default: =ThisItem.Purpose
                        DisplayName: ="Purpose"
                        Height: =80
                        MaxLength: =DataSourceInfo(%DATACARD_DATASOURCE_NAME.ID%, %DataSourceInfo.RESERVED%.MaxLength, '%DATACARD_FIELD_NAME.ID%')
                        Required: =true
                        Update: =If(IsBlank(ComboBox_CashAdvance_Purpose.Selected.'Purpose (mserp_value)'), ComboBox_CashAdvance_Purpose.SearchText, ComboBox_CashAdvance_Purpose.Selected.'Purpose (mserp_value)')
                        Width: =Min(Parent.Width, 640)
                        X: =(Parent.Width - Self.Width) / 2
                        Y: =2
                      Children:
                        - CashAdvance_Purpose_Label:
                            Control: Label@2.5.1
                            Properties:
                              AutoHeight: =true
                              BorderColor: =RGBA(0, 0, 0, 0)
                              Color: =gblParams.dropDownLabelColor
                              Font: =Font.'Segoe UI'
                              Height: =24
                              Text: ="Purpose"
                              Width: =Parent.Width - 60
                              Wrap: =false
                              X: =30
                              Y: =5
                        - CashAdvance_Purpose_Star:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Center
                              BorderColor: =RGBA(0, 0, 0, 0)
                              Font: =Font.'Open Sans'
                              Height: =CashAdvance_Purpose_Label.Height
                              Text: ="*"
                              Visible: =And(Parent.Required, Parent.DisplayMode = DisplayMode.Edit)
                              Width: =30
                              Wrap: =false
                              X: =CashAdvance_Purpose_Label.X + CashAdvance_Purpose_Label.Width
                              Y: =CashAdvance_Purpose_Label.Y
                        - ComboBox_CashAdvance_Purpose:
                            Control: Classic/ComboBox@2.4.0
                            Properties:
                              BorderColor: =RGBA(0, 18, 107, 1)
                              ChevronBackground: =RGBA(56, 96, 178, 1)
                              ChevronFill: =RGBA(255, 255, 255, 1)
                              ChevronHoverBackground: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                              ChevronHoverFill: =RGBA(255, 255, 255, 1)
                              DefaultSelectedItems: =If(IsBlank(ThisItem.Purpose), Blank(), LookUp('DimAttributeTrvTravelTxtEntity (mserp)', 'Purpose (mserp_value)' = ThisItem.Purpose))
                              DisplayFields: =["mserp_value"]
                              DisplayMode: =Parent.DisplayMode
                              Font: =Font.'Open Sans'
                              Height: =gblParams.dropDownHeight
                              HoverFill: =RGBA(186, 202, 226, 1)
                              Items: =Filter('DimAttributeTrvTravelTxtEntity (mserp)', 'Company Code' = varSelectedLegalEntity)
                              PaddingBottom: =5
                              PaddingLeft: =5
                              PaddingRight: =5
                              PaddingTop: =5
                              PressedColor: =RGBA(255, 255, 255, 1)
                              PressedFill: =RGBA(0, 18, 107, 1)
                              SearchFields: =["mserp_value"]
                              SelectMultiple: =false
                              SelectionColor: =RGBA(255, 255, 255, 1)
                              SelectionFill: =RGBA(56, 96, 178, 1)
                              Size: =13
                              Width: =Parent.Width - 80
                              X: =40
                              Y: =CashAdvance_Purpose_Label.Y + CashAdvance_Purpose_Label.Height + 8
                  - Requested amount_DataCard:
                      Control: TypedDataCard@1.0.7
                      Variant: ClassicNumberEdit
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        DataField: ="mserp_requestedamount"
                        Default: =ThisItem.'Requested amount'
                        DisplayName: ="Requested amount"
                        Height: =80
                        Required: =true
                        Update: =Value(DataCardValue_CashAdvance_RequestedAmount.Text)
                        Width: =Min(Parent.Width, 640)
                        X: =(Parent.Width - Self.Width) / 2
                        Y: =3
                      Children:
                        - CashAdvance_RequestedAmount_Label:
                            Control: Label@2.5.1
                            Properties:
                              AutoHeight: =true
                              BorderColor: =RGBA(0, 0, 0, 0)
                              Color: =gblParams.dropDownLabelColor
                              Font: =Font.'Segoe UI'
                              Height: =24
                              Text: ="Requested amount"
                              Width: =Parent.Width - 60
                              Wrap: =false
                              X: =30
                              Y: =5
                        - CashAdvance_RequestedAmount_Star:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Center
                              BorderColor: =RGBA(0, 0, 0, 0)
                              Font: =Font.'Open Sans'
                              Height: =CashAdvance_RequestedAmount_Label.Height
                              Text: ="*"
                              Visible: =And(Parent.Required, Parent.DisplayMode = DisplayMode.Edit)
                              Width: =30
                              Wrap: =false
                              X: =CashAdvance_RequestedAmount_Label.X + CashAdvance_RequestedAmount_Label.Width
                              Y: =CashAdvance_RequestedAmount_Label.Y
                        - DataCardValue_CashAdvance_RequestedAmount:
                            Control: Classic/TextInput@2.3.2
                            Properties:
                              BorderColor: =RGBA(0, 18, 107, 1)
                              Default: =If(IsBlank(ThisItem.'Requested amount'), "", Text(ThisItem.'Requested amount'))
                              DisplayMode: =Parent.DisplayMode
                              Font: =Font.'Open Sans'
                              Format: =TextFormat.Number
                              Height: =gblParams.dropDownHeight
                              HintText: =
                              HoverBorderColor: =RGBA(0, 18, 107, 1)
                              HoverFill: =RGBA(186, 202, 226, 1)
                              Size: =13
                              Width: =Parent.Width - 80
                              X: =40
                              Y: =CashAdvance_RequestedAmount_Label.Y + CashAdvance_RequestedAmount_Label.Height + 8
                  - Currency_DataCard:
                      Control: TypedDataCard@1.0.7
                      Variant: ClassicTextualEdit
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        DataField: ="mserp_currency"
                        Default: =ThisItem.Currency
                        DisplayName: ="Currency"
                        Height: =80
                        MaxLength: =DataSourceInfo(%DATACARD_DATASOURCE_NAME.ID%, %DataSourceInfo.RESERVED%.MaxLength, '%DATACARD_FIELD_NAME.ID%')
                        Required: =true
                        Update: =ComboBox_CashAdvance_Currency.Selected.mserp_currencycode
                        Width: =Min(Parent.Width, 640)
                        X: =(Parent.Width - Self.Width) / 2
                        Y: =4
                      Children:
                        - CashAdvance_Currency_Label:
                            Control: Label@2.5.1
                            Properties:
                              AutoHeight: =true
                              BorderColor: =RGBA(0, 0, 0, 0)
                              Color: =gblParams.dropDownLabelColor
                              Font: =Font.'Segoe UI'
                              Height: =24
                              Text: ="Currency"
                              Width: =Parent.Width - 60
                              Wrap: =false
                              X: =30
                              Y: =5
                        - CashAdvance_Currency_Star:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Center
                              BorderColor: =RGBA(0, 0, 0, 0)
                              Font: =Font.'Open Sans'
                              Height: =CashAdvance_Currency_Label.Height
                              Text: ="*"
                              Visible: =And(Parent.Required, Parent.DisplayMode = DisplayMode.Edit)
                              Width: =30
                              Wrap: =false
                              X: =CashAdvance_Currency_Label.X + CashAdvance_Currency_Label.Width
                              Y: =CashAdvance_Currency_Label.Y
                        - ComboBox_CashAdvance_Currency:
                            Control: Classic/ComboBox@2.4.0
                            Properties:
                              BorderColor: =RGBA(0, 18, 107, 1)
                              ChevronBackground: =RGBA(56, 96, 178, 1)
                              ChevronFill: =RGBA(255, 255, 255, 1)
                              ChevronHoverBackground: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                              ChevronHoverFill: =RGBA(255, 255, 255, 1)
                              DefaultSelectedItems: =If(IsBlank(ThisItem.Currency), Blank(), LookUp('Currencies (mserp)', 'Currency code' = ThisItem.Currency))
                              DisplayFields: =["mserp_currencycode"]
                              DisplayMode: =Parent.DisplayMode
                              Font: =Font.'Open Sans'
                              Height: =gblParams.dropDownHeight
                              HoverFill: =RGBA(186, 202, 226, 1)
                              Items: =ShowColumns('Currencies (mserp)', 'Currency code', Name)
                              PaddingBottom: =5
                              PaddingLeft: =5
                              PaddingRight: =5
                              PaddingTop: =5
                              PressedColor: =RGBA(255, 255, 255, 1)
                              PressedFill: =RGBA(0, 18, 107, 1)
                              SearchFields: =["mserp_currencycode"]
                              SelectMultiple: =false
                              SelectionColor: =RGBA(255, 255, 255, 1)
                              SelectionFill: =RGBA(56, 96, 178, 1)
                              Size: =13
                              Width: =Parent.Width - 80
                              X: =40
                              Y: =CashAdvance_Currency_Label.Y + CashAdvance_Currency_Label.Height + 8
                  - Note_DataCard:
                      Control: TypedDataCard@1.0.7
                      Variant: ClassicTextualEdit
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        DataField: ="mserp_note"
                        Default: =ThisItem.Note
                        DisplayName: ="Note"
                        Height: =120
                        MaxLength: =DataSourceInfo(%DATACARD_DATASOURCE_NAME.ID%, %DataSourceInfo.RESERVED%.MaxLength, '%DATACARD_FIELD_NAME.ID%')
                        Required: =false
                        Update: =DataCardValue_CashAdvance_Note.Text
                        Width: =Min(Parent.Width, 640)
                        X: =(Parent.Width - Self.Width) / 2
                        Y: =5
                      Children:
                        - CashAdvance_Note_Label:
                            Control: Label@2.5.1
                            Properties:
                              AutoHeight: =true
                              BorderColor: =RGBA(0, 0, 0, 0)
                              Color: =gblParams.dropDownLabelColor
                              Font: =Font.'Segoe UI'
                              Height: =24
                              Text: ="Note"
                              Width: =Parent.Width - 60
                              Wrap: =false
                              X: =30
                              Y: =5
                        - DataCardValue_CashAdvance_Note:
                            Control: Classic/TextInput@2.3.2
                            Properties:
                              BorderColor: =RGBA(0, 18, 107, 1)
                              Default: =ThisItem.Note
                              DisplayMode: =Parent.DisplayMode
                              Font: =Font.'Open Sans'
                              Height: =80
                              HintText: =
                              HoverBorderColor: =RGBA(0, 18, 107, 1)
                              HoverFill: =RGBA(186, 202, 226, 1)
                              Mode: =TextMode.MultiLine
                              Size: =13
                              Width: =Parent.Width - 80
                              X: =40
                              Y: =CashAdvance_Note_Label.Y + CashAdvance_Note_Label.Height + 8
                  - CompanyCode_DataCard:
                      Control: TypedDataCard@1.0.7
                      Variant: ClassicTextualEdit
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        DataField: ="mserp_dataareaid"
                        Default: =varSelectedLegalEntity
                        DisplayName: ="Company Code"
                        Height: =0
                        MaxLength: =DataSourceInfo(%DATACARD_DATASOURCE_NAME.ID%, %DataSourceInfo.RESERVED%.MaxLength, '%DATACARD_FIELD_NAME.ID%')
                        Required: =true
                        Update: =varSelectedLegalEntity
                        Visible: =false
                        Width: =Min(Parent.Width, 640)
                        X: =(Parent.Width - Self.Width) / 2
                        Y: =6
      - CashAdvanceEdit_ButtonsContainer:
          Control: GroupContainer@1.4.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(250, 249, 248, 1)
            Height: =160
            LayoutDirection: =LayoutDirection.Vertical
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
            Y: =Parent.Height - Self.Height
          Children:
            - CashAdvanceEdit_SaveDraftButton:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =ColorFade(Self.Fill, -15%)
                  Color: =RGBA(255, 255, 255, 1)
                  DisabledBorderColor: =RGBA(166, 166, 166, 1)
                  Fill: =RGBA(34, 102, 227, 1)
                  Font: =Font.'Segoe UI'
                  Height: =60
                  HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                  LayoutMinHeight: =40
                  LayoutMinWidth: =160
                  OnSelect: |-
                    =If(
                        IsBlank(DatePicker_CashAdvance_RequestedDate.SelectedDate) ||
                        IsBlank(ComboBox_CashAdvance_Location.Selected.Location) ||
                        IsBlank(ComboBox_CashAdvance_Purpose.Selected.'Purpose (mserp_value)') && IsBlank(ComboBox_CashAdvance_Purpose.SearchText) ||
                        IsBlank(DataCardValue_CashAdvance_RequestedAmount.Text) ||
                        IsBlank(ComboBox_CashAdvance_Currency.Selected.mserp_currencycode),
                        Notify("Please fill in all required fields", NotificationType.Error, gblParams.notificationTime),
                        SubmitForm(EditCashAdvanceForm)
                    )
                  PressedBorderColor: =Self.Fill
                  PressedColor: =Self.Fill
                  PressedFill: =Self.Color
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Size: =18
                  Text: ="Save Draft"
                  Width: =Min(Parent.Width - 80, 640)
                  X: =(Parent.Width - Self.Width) / 2
                  Y: =20
            - CashAdvanceEdit_SubmitButton:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =RGBA(34, 102, 227, 1)
                  Color: =RGBA(34, 102, 227, 1)
                  DisabledBorderColor: =RGBA(166, 166, 166, 1)
                  Fill: =Color.White
                  Font: =Font.'Segoe UI'
                  Height: =60
                  HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                  LayoutMinHeight: =40
                  LayoutMinWidth: =160
                  OnSelect: |-
                    =If(
                        IsBlank(DatePicker_CashAdvance_RequestedDate.SelectedDate) ||
                        IsBlank(ComboBox_CashAdvance_Location.Selected.Location) ||
                        IsBlank(ComboBox_CashAdvance_Purpose.Selected.'Purpose (mserp_value)') && IsBlank(ComboBox_CashAdvance_Purpose.SearchText) ||
                        IsBlank(DataCardValue_CashAdvance_RequestedAmount.Text) ||
                        IsBlank(ComboBox_CashAdvance_Currency.Selected.mserp_currencycode),
                        Notify("Please fill in all required fields", NotificationType.Error, gblParams.notificationTime),
                        SubmitForm(EditCashAdvanceForm)
                    )
                  PressedBorderColor: =Self.Fill
                  PressedColor: =Self.Fill
                  PressedFill: =Self.Color
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Size: =18
                  Text: ="Submit(추후 적용)"
                  Width: =Min(Parent.Width - 80, 640)
                  X: =(Parent.Width - Self.Width) / 2
                  Y: =CashAdvanceEdit_SaveDraftButton.Y + CashAdvanceEdit_SaveDraftButton.Height + 10
