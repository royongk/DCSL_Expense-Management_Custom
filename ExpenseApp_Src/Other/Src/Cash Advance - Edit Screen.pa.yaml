                      Children:
                        - lbl_Location:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0, 18, 107, 1)
                              Font: =Font.'Segoe UI'
                              Height: =32
                              LayoutMinHeight: =40
