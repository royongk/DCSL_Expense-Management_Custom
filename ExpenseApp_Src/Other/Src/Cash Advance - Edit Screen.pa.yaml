      - CashAdvanceEdit_ButtonsContainer:
          Control: GroupContainer@1.4.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(250, 249, 248, 1)
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
            Y: =Parent.Height - Self.Height
          Children:
            - CashAdvanceEdit_SaveDraftButton:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =ColorFade(Self.Fill, -15%)
                  Color: =RGBA(255, 255, 255, 1)
                  DisabledBorderColor: =RGBA(166, 166, 166, 1)
                  Fill: =RGBA(34, 102, 227, 1)
                  Font: =Font.'Segoe UI'
                  Height: =76
                  HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                  OnSelect: |-
                    =If(
                        // 1. 필수 값 체크 수정 (속성 불일치 해결)
                        IsBlank(DatePicker_CashAdvance_RequestedDate.SelectedDate) ||
                        IsBlank(ComboBox_CashAdvance_Location.Selected.Value) || 
                        IsBlank(ComboBox_CashAdvance_Purpose.Selected.Value) || 
                        IsBlank(DataCardValue_CashAdvance_RequestedAmount.Text) ||
                        IsBlank(ComboBox_CashAdvance_Currency.Selected.Value), 

                        // 2. 값이 하나라도 비어있으면 알림 표시
                        Notify("Please fill in all required fields", NotificationType.Error, gblParams.notificationTime),

                        // 3. 모든 값이 채워져 있으면 폼 제출
                        SubmitForm(EditCashAdvanceForm)
                    )
                  PressedBorderColor: =Self.Fill
                  PressedColor: =Self.Fill
                  PressedFill: =Self.Color
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Size: =19.15
                  Text: ="Save Draft"
                  Width: =Parent.Width - Self.X*2
                  X: =40
                  Y: =20
            - CashAdvanceEdit_SubmitButton:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =RGBA(34, 102, 227, 1)
                  Color: =RGBA(34, 102, 227, 1)
                  DisabledBorderColor: =RGBA(166, 166, 166, 1)
                  Fill: =Color.White
                  Font: =Font.'Segoe UI'
                  Height: =76
                  HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                  OnSelect: "=If(\n    // 1. 필수 값 체크 (신규 필드 기준)\n    IsBlank(DatePicker_CashAdvance_RequestedDate.SelectedDate) ||\n    IsBlank(ComboBox_CashAdvance_Location.Selected.Location) ||  // Location이 텍스트 필드인 경우 .Value 또는 .Text 확인 필요\n    IsBlank(ComboBox_CashAdvance_Purpose.Selected.'Purpose (mserp_value)') ||   // Purpose가 텍스트 필드인 경우 .Value, Lookup인 경우 해당 ID 참조\n    IsBlank(DataCardValue_CashAdvance_RequestedAmount.Text) ||\n    IsBlank(ComboBox_CashAdvance_Currency.Selected.mserp_currencycode),    // mserp_currency가 Lookup이 아닌 단순 코드값일 경우 .Value\n\n    // 2. 누락 시 알림\n    Notify(\"Please fill in all required fields\", NotificationType.Error, gblParams.notificationTime),\n\n    // 1. 방금 저장된 레코드(LastSubmit)를 찾아 WorkflowAction을 \"Submit\"으로 업데이트\n    Patch(\n        'DCSL TrvCash Advance Entity  (mserp)',\n        EditCashAdvanceForm.LastSubmit, \n        {\n            WorkflowAction: \"Submit\"\n        }\n    );\n\n    // 2. (선택 사항) 업데이트 중 에러가 발생했는지 확인하는 로직 (사용자가 제공한 예시 기반)\n    If(\n        !IsEmpty(Errors('DCSL TrvCash Advance Entity  (mserp)')),\n        Notify(First(Errors('DCSL TrvCash Advance Entity  (mserp)')).Message, NotificationType.Error),\n        \n        // 3. 에러가 없으면 성공 알림 및 화면 이동\n        Notify(\"Cash Advance has been submitted successfully.\", NotificationType.Success);\n        Navigate('Cash Advance - List Screen', ScreenTransition.None);\n        ResetForm(EditCashAdvanceForm)\n    );\n\n    // 3. 폼 제출\n    SubmitForm(EditCashAdvanceForm)\n)"
                  PressedBorderColor: =Self.Fill
                  PressedColor: =Self.Fill
                  PressedFill: =Self.Color
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Size: =19.15
                  Text: ="Submit"
                  Width: =Parent.Width - Self.X*2
                  X: =40
                  Y: =CashAdvanceEdit_SaveDraftButton.Y + CashAdvanceEdit_SaveDraftButton.Height + 20
