Screens:
  Cash Advance - Edit Screen:
    Properties:
      Fill: =RGBA(248, 248, 248, 1)
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |-
        =UpdateContext({ctVarCashDetailsBack:false});
        UpdateContext({varIsCreateCashAdvance: IsBlank(varSelectedCashAdvance)});
        Reset(dtp_RequestedDate);
        Reset(cb_Location);
        Reset(cb_Purpose);
        Reset(txt_RequestedAmount);
        Reset(cb_Currency);
    Children:
      - CashAdvanceEdit_Header:
          Control: CanvasComponent
          ComponentName: hdr02_Header
          Properties:
            Fill: =CashAdvanceEdit_Header.paramFill
            Height: =82
            Width: =Max(App.Width, App.MinScreenWidth)
            paramColor: =RGBA(0, 0, 0, 1)
            paramFill: =RGBA(255, 255, 255, 1)
            paramTitle: |-
              =If(
                  varIsCreateCashAdvance,
                  "New Cash Advance Request",
                  "Edit Cash Advance Request"
              )
      - CashAdvanceEdit_BackIcon:
          Control: Classic/Icon@2.5.0
          Properties:
            AccessibleLabel: ="Press to go back"
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =icongconfig_backbutton.Color
            Fill: =icongconfig_backbutton.Fill
            Height: =icongconfig_backbutton.Height
            Icon: =Icon.ChevronLeft
            OnSelect: |-
              =If(
                  varIsCreateCashAdvance, 
                  UpdateContext({ctVarCashDetailsBack: true}),          // 신규 모드면: 다이얼로그 변수 True
                  Navigate('Cash Advance - List Screen', ScreenTransition.None) // 수정 모드면: 즉시 이동
              )
            TabIndex: =0
            Width: =icongconfig_backbutton.Width
            X: =22.5
            Y: =(CashAdvanceEdit_Header.Height-Self.Height)/2
      - CashAdvanceEdit_Container:
          Control: GroupContainer@1.4.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =Parent.Height - CashAdvanceEdit_Header.Height - CashAdvanceEdit_ButtonsButtonsContainer.Height
            LayoutDirection: =LayoutDirection.Vertical
            LayoutOverflowY: =LayoutOverflow.Scroll
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
            Y: =CashAdvanceEdit_Header.Height
          Children:
            - RequestedDate_Container:
                Control: GroupContainer@1.4.0
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  DropShadow: =DropShadow.None
                  Height: =LblContainer_RequestedDate.Height + dtp_RequestedDate.Height + 20
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =10
                  LayoutMinHeight: =32
                  LayoutMinWidth: =32
                  PaddingLeft: =25
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width
                Children:
                  - LblContainer_RequestedDate:
                      Control: GroupContainer@1.4.0
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        DropShadow: =DropShadow.None
                        Height: =50
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutMinHeight: =32
                        LayoutMinWidth: =32
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =Parent.Width
                      Children:
                        - lbl_RequestedDate:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0, 18, 107, 1)
                              Font: =Font.'Segoe UI'
                              Height: =32
                              LayoutMinHeight: =40
                              LayoutMinWidth: =150
                              Size: =18
                              Text: ="* Requested Date"
                              VerticalAlign: =VerticalAlign.Top
                              Width: =Parent.Width
                  - dtp_RequestedDate:
                      Control: Classic/DatePicker@2.6.0
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        DefaultDate: =If(varIsCreateCashAdvance, Today(), varSelectedCashAdvance.'Requested date')
                        FillPortions: =1
                        Font: =Font.'Open Sans'
                        Height: =Min('Cash Advance - Edit Screen'.Height * 0.0616, 50)
                        IconBackground: =RGBA(56, 96, 178, 1)
                        IconFill: =RGBA(255, 255, 255, 1)
                        LayoutMinHeight: =40
                        LayoutMinWidth: =328
                        Size: =21
                        Width: =Parent.Width - Self.X*2
                        X: =40
            - Location_Container:
                Control: GroupContainer@1.4.0
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  DropShadow: =DropShadow.None
                  Height: =LblContainer_Location.Height + cb_Location.Height + 20
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =10
                  LayoutMinHeight: =32
                  LayoutMinWidth: =32
                  PaddingLeft: =25
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width
                Children:
                  - LblContainer_Location:
                      Control: GroupContainer@1.4.0
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        DropShadow: =DropShadow.None
                        Height: =35
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutMinHeight: =32
                        LayoutMinWidth: =32
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =Parent.Width
                      Children:
                        - lbl_Location:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0, 18, 107, 1)
                              Font: =Font.'Segoe UI'
                              Height: =32
                              LayoutMinHeight: =40
                              LayoutMinWidth: =150
                              Size: =18
                              Text: ="Location"
                              VerticalAlign: =VerticalAlign.Top
                              Width: =Parent.Width
                  - cb_Location:
                      Control: Classic/ComboBox@2.4.0
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        ChevronBackground: =RGBA(56, 96, 178, 1)
                        ChevronFill: =RGBA(255, 255, 255, 1)
                        ChevronHoverBackground: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                        ChevronHoverFill: =RGBA(255, 255, 255, 1)
                        DefaultSelectedItems: =If(!varIsCreateCashAdvance, LookUp('Travel locations (mserp)', Location = varSelectedCashAdvance.Location), Blank())
                        DisplayFields: =["mserp_destination"]
                        FillPortions: =1
                        Font: =Font.'Open Sans'
                        Height: =Min('Cash Advance - Edit Screen'.Height * 0.0616, 50)
                        HoverFill: =RGBA(186, 202, 226, 1)
                        InputTextPlaceholder: ="Select Location"
                        Items: =Filter('Travel locations (mserp)','Company Code' = varSelectedLegalEntity)
                        LayoutMinHeight: =40
                        LayoutMinWidth: =328
                        PaddingBottom: =5
                        PaddingLeft: =5
                        PaddingRight: =5
                        PaddingTop: =5
                        PressedColor: =RGBA(255, 255, 255, 1)
                        PressedFill: =RGBA(0, 18, 107, 1)
                        SearchFields: =["mserp_destination"]
                        SelectMultiple: =false
                        SelectionColor: =RGBA(255, 255, 255, 1)
                        SelectionFill: =RGBA(56, 96, 178, 1)
                        Width: =Parent.Width - Self.X*2
                        X: =40
            - Purpose_Container:
                Control: GroupContainer@1.4.0
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  DropShadow: =DropShadow.None
                  Height: =LblContainer_Purpose.Height + cb_Purpose.Height + 20
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =10
                  LayoutMinHeight: =32
                  LayoutMinWidth: =32
                  PaddingLeft: =25
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width
                Children:
                  - LblContainer_Purpose:
                      Control: GroupContainer@1.4.0
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        DropShadow: =DropShadow.None
                        Height: =35
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutMinHeight: =32
                        LayoutMinWidth: =32
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =Parent.Width
                      Children:
                        - lbl_Purpose:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0, 18, 107, 1)
                              Font: =Font.'Segoe UI'
                              Height: =32
                              LayoutMinHeight: =40
                              LayoutMinWidth: =150
                              Size: =18
                              Text: ="Purpose"
                              VerticalAlign: =VerticalAlign.Top
                              Width: =Parent.Width
                  - cb_Purpose:
                      Control: Classic/ComboBox@2.4.0
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        ChevronBackground: =RGBA(56, 96, 178, 1)
                        ChevronFill: =RGBA(255, 255, 255, 1)
                        ChevronHoverBackground: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                        ChevronHoverFill: =RGBA(255, 255, 255, 1)
                        DefaultSelectedItems: =If(!varIsCreateCashAdvance, LookUp('DimAttributeTrvTravelTxtEntity (mserp)', 'Purpose (mserp_value)' = varSelectedCashAdvance.Purpose), Blank())
                        DisplayFields: =["mserp_value"]
                        FillPortions: =1
                        Font: =Font.'Open Sans'
                        Height: =Min('Cash Advance - Edit Screen'.Height * 0.0616, 50)
                        HoverFill: =RGBA(186, 202, 226, 1)
                        InputTextPlaceholder: ="Select Purpose"
                        Items: =Filter('DimAttributeTrvTravelTxtEntity (mserp)', 'Company Code' = varSelectedLegalEntity)
                        LayoutMinHeight: =40
                        LayoutMinWidth: =328
                        PaddingBottom: =5
                        PaddingLeft: =5
                        PaddingRight: =5
                        PaddingTop: =5
                        PressedColor: =RGBA(255, 255, 255, 1)
                        PressedFill: =RGBA(0, 18, 107, 1)
                        SearchFields: =["mserp_value"]
                        SelectMultiple: =false
                        SelectionColor: =RGBA(255, 255, 255, 1)
                        SelectionFill: =RGBA(56, 96, 178, 1)
                        Width: =Parent.Width - Self.X*2
                        X: =40
            - RequestedAmount_Container:
                Control: GroupContainer@1.4.0
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  DropShadow: =DropShadow.None
                  Height: =LblContainer_RequestedAmount.Height + txt_RequestedAmount.Height + 20
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =10
                  LayoutMinHeight: =32
                  LayoutMinWidth: =32
                  PaddingLeft: =25
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width
                Children:
                  - LblContainer_RequestedAmount:
                      Control: GroupContainer@1.4.0
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        DropShadow: =DropShadow.None
                        Height: =35
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutMinHeight: =32
                        LayoutMinWidth: =32
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =Parent.Width
                      Children:
                        - lbl_RequestedAmount:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0, 18, 107, 1)
                              Font: =Font.'Segoe UI'
                              Height: =32
                              LayoutMinHeight: =40
                              LayoutMinWidth: =150
                              Size: =18
                              Text: ="* Requested Amount"
                              VerticalAlign: =VerticalAlign.Top
                              Width: =Parent.Width
                  - txt_RequestedAmount:
                      Control: Classic/TextInput@2.3.2
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Default: =If(varIsCreateCashAdvance, "", Text(varSelectedCashAdvance.'Requested amount'))
                        FillPortions: =1
                        Font: =Font.'Open Sans'
                        Format: =TextFormat.Number
                        Height: =Min('Cash Advance - Edit Screen'.Height * 0.0616, 50)
                        HintText: ="0.00"
                        HoverBorderColor: =RGBA(0, 18, 107, 1)
                        HoverFill: =RGBA(186, 202, 226, 1)
                        LayoutMinHeight: =40
                        LayoutMinWidth: =320
                        Width: =Parent.Width - Self.X*2
                        X: =40
            - Currency_Container:
                Control: GroupContainer@1.4.0
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  DropShadow: =DropShadow.None
                  Height: =LblContainer_Currency.Height + cb_Currency.Height + 20
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =10
                  LayoutMinHeight: =32
                  LayoutMinWidth: =32
                  PaddingLeft: =25
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width
                Children:
                  - LblContainer_Currency:
                      Control: GroupContainer@1.4.0
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        DropShadow: =DropShadow.None
                        Height: =35
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutMinHeight: =32
                        LayoutMinWidth: =32
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =Parent.Width
                      Children:
                        - lbl_Currency:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0, 18, 107, 1)
                              Font: =Font.'Segoe UI'
                              Height: =32
                              LayoutMinHeight: =40
                              LayoutMinWidth: =150
                              Size: =18
                              Text: ="Currency"
                              VerticalAlign: =VerticalAlign.Top
                              Width: =Parent.Width
                  - cb_Currency:
                      Control: Classic/ComboBox@2.4.0
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        ChevronBackground: =RGBA(56, 96, 178, 1)
                        ChevronFill: =RGBA(255, 255, 255, 1)
                        ChevronHoverBackground: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                        ChevronHoverFill: =RGBA(255, 255, 255, 1)
                        DefaultSelectedItems: =LookUp('Currencies (mserp)', 'Currency code' = Coalesce(varSelectedCashAdvance.Currency, varDefaultCurrency))
                        DisplayFields: =["mserp_currencycode"]
                        FillPortions: =1
                        Font: =Font.'Open Sans'
                        Height: =Min('Cash Advance - Edit Screen'.Height * 0.0616, 50)
                        HoverFill: =RGBA(186, 202, 226, 1)
                        InputTextPlaceholder: ="Find items"
                        Items: =ShowColumns('Currencies (mserp)','Currency code',Name)
                        LayoutMinHeight: =40
                        LayoutMinWidth: =328
                        PaddingBottom: =5
                        PaddingLeft: =5
                        PaddingRight: =5
                        PaddingTop: =5
                        PressedColor: =RGBA(255, 255, 255, 1)
                        PressedFill: =RGBA(0, 18, 107, 1)
                        SearchFields: =["mserp_currencycode"]
                        SelectMultiple: =false
                        SelectionColor: =RGBA(255, 255, 255, 1)
                        SelectionFill: =RGBA(56, 96, 178, 1)
                        Width: =Parent.Width - Self.X*2
                        X: =40
      - CashAdvanceEdit_ButtonsButtonsContainer:
          Control: GroupContainer@1.4.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(250, 249, 248, 1)
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
            Y: =Parent.Height - Self.Height
          Children:
            - CashAdvanceEdit_SaveDraftButton:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =ColorFade(Self.Fill, -15%)
                  Color: =RGBA(255, 255, 255, 1)
                  DisabledBorderColor: =RGBA(166, 166, 166, 1)
                  Fill: =RGBA(34, 102, 227, 1)
                  Font: =Font.'Segoe UI'
                  Height: =76
                  HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                  OnSelect: "=If(\n    IsBlank(dtp_RequestedDate.SelectedDate) || IsBlank(txt_RequestedAmount.Text),\n    Notify(\"Please fill in all required fields (Requested Date, Amount)\", NotificationType.Error, gblParams.notificationTime),\n    \n    Patch(\n        'DCSL TrvCash Advance Entity  (mserp)',\n        If(varIsCreateCashAdvance, Defaults('DCSL TrvCash Advance Entity  (mserp)'), varSelectedCashAdvance),\n        {\n            mserp_requesteddate: DateTime(Year(dtp_RequestedDate.SelectedDate), Month(dtp_RequestedDate.SelectedDate), Day(dtp_RequestedDate.SelectedDate), 0, 0, 0),\n            mserp_location: If(IsBlank(cb_Location.Selected.Location), cb_Location.SearchText, cb_Location.Selected.Location),\n            mserp_purpose: If(IsBlank(cb_Purpose.Selected.'Purpose (mserp_value)'), cb_Purpose.SearchText, cb_Purpose.Selected.'Purpose (mserp_value)'),\n            mserp_requestedamount: Value(txt_RequestedAmount.Text),\n            mserp_currency: If(IsBlank(cb_Currency.Selected.mserp_currencycode), If(varIsCreateCashAdvance, varDefaultCurrency, varSelectedCashAdvance.Currency), cb_Currency.Selected.mserp_currencycode)\n        }\n    );\n    Notify(\"Cash Advance saved successfully\", NotificationType.Success, gblParams.notificationTime);\n    Navigate('Cash Advance - List Screen', ScreenTransition.None)\n)"
                  PressedBorderColor: =Self.Fill
                  PressedColor: =Self.Fill
                  PressedFill: =Self.Color
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Size: =19.15
                  Text: ="Save Draft"
                  Width: =Parent.Width - Self.X*2
                  X: =40
                  Y: =20
            - CashAdvanceEdit_SubmitButton:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =RGBA(34, 102, 227, 1)
                  Color: =RGBA(34, 102, 227, 1)
                  DisabledBorderColor: =RGBA(166, 166, 166, 1)
                  Fill: =Color.White
                  Font: =Font.'Segoe UI'
                  Height: =76
                  HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                  OnSelect: "=If(\n    IsBlank(dtp_RequestedDate.SelectedDate) || IsBlank(txt_RequestedAmount.Text),\n    Notify(\"Please fill in all required fields (Requested Date, Amount)\", NotificationType.Error, gblParams.notificationTime),\n    \n    Patch(\n        'DCSL TrvCash Advance Entity  (mserp)',\n        If(varIsCreateCashAdvance, Defaults('DCSL TrvCash Advance Entity  (mserp)'), varSelectedCashAdvance),\n        {\n            mserp_requesteddate: DateTime(Year(dtp_RequestedDate.SelectedDate), Month(dtp_RequestedDate.SelectedDate), Day(dtp_RequestedDate.SelectedDate), 0, 0, 0),\n            mserp_location: If(IsBlank(cb_Location.Selected.Location), cb_Location.SearchText, cb_Location.Selected.Location),\n            mserp_purpose: If(IsBlank(cb_Purpose.Selected.'Purpose (mserp_value)'), cb_Purpose.SearchText, cb_Purpose.Selected.'Purpose (mserp_value)'),\n            mserp_requestedamount: Value(txt_RequestedAmount.Text),\n            mserp_currency: If(IsBlank(cb_Currency.Selected.mserp_currencycode), If(varIsCreateCashAdvance, varDefaultCurrency, varSelectedCashAdvance.Currency), cb_Currency.Selected.mserp_currencycode),\n            mserp_workflowaction: \"Submit\"\n        }\n    );\n    \n    Notify(\"Cash Advance submitted successfully\", NotificationType.Success, gblParams.notificationTime);\n    Navigate('Cash Advance - List Screen', ScreenTransition.None)\n)"
                  PressedBorderColor: =Self.Fill
                  PressedColor: =Self.Fill
                  PressedFill: =Self.Color
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Size: =19.15
                  Text: ="Submit"
                  Width: =Parent.Width - Self.X*2
                  X: =40
                  Y: =CashAdvanceEdit_SaveDraftButton.Y + CashAdvanceEdit_SaveDraftButton.Height + 20
      - scr17_cmp02_CancelDialog_2:
          Control: CanvasComponent
          ComponentName: cmp02_ConfirmationDialog
          Properties:
            Height: =App.Height
            LegalEntity: ="Text"
            OnLeftButtonClick: |-
              =UpdateContext({ctVarExpenseDetailsBack: false});
            OnRightButtonClick: |-
              =UpdateContext({ctVarExpenseDetailsBack: false});
              Navigate('Cash Advance - List Screen', ScreenTransition.None)
            SelectedExpense: =
            SelectedList: ="Text"
            SelectedReceiptNumber: =
            Visible: =ctVarCashDetailsBack
            Width: =Max(App.Width, App.MinScreenWidth)
            controlName: ="scr17_cmp02_CancelDialog_1"
            parmInDescriptionText: ="All unsaved changes will be lost."
            parmInHeaderText: ="Do you want to go back?"
            parmInLeftButtonColor: =RGBA(34, 102, 227, 1)
            parmInLeftButtonText: ="No"
            parmInRightButtonColor: =RGBA(195, 39, 39, 1)
            parmInRightButtonText: ="Yes"
            returnFocus: ="scr17_ico_Back_1"
