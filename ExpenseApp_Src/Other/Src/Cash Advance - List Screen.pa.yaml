Screens:
  Cash Advance - List Screen:
    Properties:
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |-
        =// =========================================================================
        // 1. 공통 앱 파라미터 및 전역 변수 초기화 (Expenses Screen과 동일 로직)
        // =========================================================================

        // 현재 선택된 메뉴(AppMode)에 맞는 D365 Expense Type 텍스트 결정
        Set(
            varTargetExpenseType,
            Switch(
                varAppMode,
                "AirfareAllowance", "Allowance",
                "BillingTripSettlement", "Billing Trip Settlement",
                "CashAdvance", "Cash Advance",
                "EmployeeBenefit", "Employee Benefit",
                "SalaryAdvance", "Salary Advance",
                "ExpenseReport", "Expense Reimbursement", 
                Blank()
            )
        );

        // 해당 Type에 매핑된 카테고리(Expense category) 목록을 로컬 컬렉션에 저장
        ClearCollect(
            colMappedCategories,
            Filter(
                'DCSL Expense Category Mapping Setup Entity (mserp)',
                'Expense Type' = varTargetExpenseType
            )
        );

        // 공통 UI 테마 및 동작 파라미터 설정
        Set(
            gblParams,
            {
                dropDownHeight : 60,
                dorpDownBorderThickness : 2,
                dropDownBorderColor : RGBA(34, 102, 227, 1),
                dropDownLabelColor : Color.Black,
                dropDownHoverFill : RGBA(204, 222, 255, 1),
                errorMessageSize : 18,
                dropDownFontSize : 24,
                expenseDataCardViewOnly: RGBA(110, 110, 110, 1),
                notificationTime : 4000
            }
        );

        // 화면 동작 제어용 컨텍스트 변수 초기화
        UpdateContext({varOnShowFields : false});
        UpdateContext({varOnSelectTriggered : false});
        UpdateContext({varOnChangeTriggered : false});
        Set(varExpenseButtonClicked, false);
        Set(varDefaultSalesTaxGroup, Blank());
        Set(varItemSalesTaxDefaultValue, Blank());
        Set(varSelectedExpenseDoc, Blank());

        Set(
            varDefaultSalesTaxGroupUserContext,
            userRecord.WorkerDefaultTaxGroup
        );

        // 관리 매개변수 데이터 리프레시
        Refresh('Expense management parameters (mserp)');


        // =========================================================================
        // 2. Cash Advance - List Screen 고유 초기화 및 데이터 로드
        // =========================================================================

        // 선택 및 필터 상태 초기화
        UpdateContext({varCntSelect: false});
        UpdateContext({varCashAdvanceStatusFilter: ""});
        UpdateContext({varCashAdvanceDateFilterStart: Blank()});
        UpdateContext({varCashAdvanceDateFilterEnd: Blank()});
        UpdateContext({varCashAdvanceShowDateFilter: false});
        Set(varSelectedCashAdvance, Blank());
        UpdateContext({varCntDelete: false});

        // Cash Advance 데이터 로드
        Refresh('Cash advances (mserp)');
        Clear(colSelectedCashAdvanceIds);
        Reset(scrCashAdvance_Gallery);
        Reset(ComboBox_CashAdvanceStatusFilter);

        // ★ 하단 네비게이션 Footer 탭 번호를 Cash Advance 목적에 맞게 4로 강제 지정
        Set(varSelectedTab, 4);

        // 상태 필터용 콤보박스 옵션 컬렉션 생성 (All + 선택 항목)
        ClearCollect(
            colCashAdvanceStatusOptions,
            {
                Value: Coalesce(Blank(), LookUp(Choices('Cash advances (mserp)'.'Cash advance status'), true, Value)), 
                DisplayName: "All"
            }
        );

        Collect(
            colCashAdvanceStatusOptions,
            ForAll(
                Choices('Cash advances (mserp)'.'Cash advance status'),
                {
                    Value: Value,
                    DisplayName: Text(Value)
                }
            )
        );
    Children:
      - emptyStateComponent_CashAdvance:
          Control: CanvasComponent
          ComponentName: emptyStateComponent
          Properties:
            Height: |
              =350
            Visible: =scrCashAdvance_Gallery.AllItemsCount <= 0
            Width: =Self.Height
            X: |
              =(Parent.Width - Self.Width)/2
            Y: |
              =scrCashAdvance_Gallery.Y + (Parent.Height - scrCashAdvance_hdr_TopHeader.Height - scrCashAdvance_cmp_Footer_1.Height - Self.Height)/2
            subTitle: |-
              =If(
                  varAppMode = "SalaryAdvance",
                  "No Salary Advance Purpose available",
                  "No cash advances Purpose available"
              )
            title: =GlobalLabels.Labels.'15062:LocalizedName,msdyn_NothingHereYetLabel'
      - scrCashAdvance_Gallery:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
          Properties:
            AccessibleLabel: ="List of cash advances"
            BorderColor: =RGBA(0, 18, 107, 1)
            Default: ={}
            Height: |-
              =Min(
                  scrCashAdvance_cmp_Footer_1.Y - Self.Y,
                  Self.TemplateHeight * CountRows(Self.AllItems)
              )
            Items: "=SortByColumns(\n    Filter(\n        'DCSL TrvCash Advance Entity  (mserp)',\n        // 1. 법인 필터\n        'Company (mserp_company)' = Upper(varSelectedLegalEntity),\n        \n        // 2. 상태 필터 (다중 선택 지원 로직으로 변경)\n        (\n            // A. 아무것도 선택하지 않았으면 전체 표시\n            IsEmpty(ComboBox_CashAdvanceStatusFilter.SelectedItems) ||\n            \n            // B. \"All\" (Value가 Blank인 항목)이 선택 목록에 포함되어 있으면 전체 표시\n            CountRows(Filter(ComboBox_CashAdvanceStatusFilter.SelectedItems, IsBlank(Value))) > 0 ||\n            \n            // C. 그 외: 현재 행의 상태가 선택된 목록 안에 있는지 확인 (in 연산자)\n            'Cash advance status' in ComboBox_CashAdvanceStatusFilter.SelectedItems.Value\n        ),\n        \n        // 3. 날짜 범위 필터 (이전에 수정한 로직 유지)\n        (\n            IsBlank(varCashAdvanceDateFilterStart) || \n            'Requested date' >= varCashAdvanceDateFilterStart\n        ) &&\n        (\n            IsBlank(varCashAdvanceDateFilterEnd) || \n            'Requested date' < DateAdd(varCashAdvanceDateFilterEnd, 1, TimeUnit.Days)\n        ),\n\n        // 4. 로그인한 사용자 필터\n        Employee = userRecord.CreatingWorker,\n\n        // 5. ★ AppMode에 따른 Purpose 필터 추가\n        Purpose = If(varAppMode = \"SalaryAdvance\", \"Salary Advance\", \"Cash Advance\")\n    ),\n    \"mserp_requesteddate\", \n    SortOrder.Descending\n)"
            OnSelect: |-
              =If(
                  varCntSelect,
                  If(
                      IsBlank(LookUp(colSelectedCashAdvanceIds, cashAdvanceNumber = ThisItem.'Cash advance number')),
                      Collect(colSelectedCashAdvanceIds, {cashAdvanceNumber: ThisItem.'Cash advance number'}),
                      RemoveIf(colSelectedCashAdvanceIds, cashAdvanceNumber = ThisItem.'Cash advance number')
                  ),
                  Set(varSelectedCashAdvance, ThisItem);
                  If(
                      ThisItem.'Cash advance status' = 'Cash advance status (mserp)'.Draft,
                      Set(varIsCreateCashAdvance, false);
                      Navigate('Cash Advance - Edit Screen', ScreenTransition.Fade),

                      // Draft가 아니면 (Submitted, In Review 등) 무조건 View Only Screen으로 이동
                      Navigate('Cash Advance - View Only Screen', ScreenTransition.Fade)
                  )
              )
            TemplateSize: =150
            Width: =Parent.Width
            Y: =scr16_rct_seprator_3.Y
          Children:
            - Container11_CashAdvance:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Height: =150
                  LayoutDirection: =LayoutDirection.Vertical
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width
                Children:
                  - Container6_CashAdvance:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Height: =Parent.Height - scrCashAdvance_shp_GalleryBaseSeparator_1.Height
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =Parent.Width
                      Children:
                        - shpBorder_CashAdvance:
                            Control: Rectangle@2.3.0
                            Properties:
                              BorderColor: =RGBA(0, 18, 107, 1)
                              Fill: =Color.Transparent
                              Height: =Parent.Height
                              LayoutMaxHeight: =
                              LayoutMaxWidth: =
                              Width: =10
                        - scrCashAdvance_chk_Select:
                            Control: Classic/CheckBox@2.1.0
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              BorderColor: =RGBA(0, 18, 107, 1)
                              BorderStyle: =BorderStyle.None
                              CheckboxBackgroundFill: =If(Self.Value, RGBA(34, 102, 227, 1), Color.White)
                              CheckboxBorderColor: =RGBA(34, 102, 227, 1)
                              CheckboxSize: =42
                              CheckmarkFill: =Color.White
                              Color: =RGBA(34, 102, 227, 1)
                              Default: =!IsEmpty(Filter(colSelectedCashAdvanceIds, cashAdvanceNumber = ThisItem.'Cash advance number'))
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Lighter
                              Height: =35
                              HoverColor: =RGBA(0, 18, 107, 1)
                              LayoutMaxHeight: =
                              LayoutMaxWidth: =
                              OnCheck: |-
                                =Collect(colSelectedCashAdvanceIds, {cashAdvanceNumber: ThisItem.'Cash advance number'})
                              OnSelect: =Select(scrCashAdvance_shp_SelectRegion)
                              OnUncheck: =RemoveIf(colSelectedCashAdvanceIds, cashAdvanceNumber = ThisItem.'Cash advance number')
                              Reset: =varCntSelect Or scrCashAdvance_chk_SelectAll.Value
                              Text: =Concatenate("Cash advance ", ThisItem.'Cash advance number', If(Self.Value, " selected", " unselected"))
                              VerticalAlign: =VerticalAlign.Bottom
                              Visible: =varCntSelect
                              Width: =43
                              X: =18
                              Y: =40
                        - Container7_CashAdvance:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutJustifyContent: =LayoutJustifyContent.Center
                              LayoutMaxHeight: =
                              LayoutMaxWidth: =
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                            Children:
                              - Label_CashAdvanceNumber:
                                  Control: Label@2.5.1
                                  Properties:
                                    AutoHeight: =true
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    Font: =Font.'Segoe UI'
                                    LayoutMaxHeight: =
                                    LayoutMaxWidth: =
                                    OnSelect: =Select(scrCashAdvance_shp_SelectRegion)
                                    PaddingLeft: =15
                                    PaddingRight: =0
                                    TabIndex: =If(IsBlank(Self.Text), -1, 0)
                                    Text: =ThisItem.'Cash advance number'
                                    Width: =Parent.Width
                              - Label_RequestedDate:
                                  Control: Label@2.5.1
                                  Properties:
                                    AutoHeight: =true
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    Color: =RGBA(102, 102, 102, 1)
                                    Font: =Font.'Segoe UI'
                                    LayoutMaxHeight: =
                                    LayoutMaxWidth: =
                                    OnSelect: =Select(scrCashAdvance_shp_SelectRegion)
                                    PaddingLeft: =15
                                    PaddingRight: =0
                                    TabIndex: =If(IsBlank(Self.Text), -1, 0)
                                    Text: =Text(DateTimeValue(ThisItem.'Requested date'), "mmm dd, yyyy")
                                    Width: =Parent.Width
                        - Container9_CashAdvance:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutJustifyContent: =LayoutJustifyContent.Center
                              LayoutMaxHeight: =
                              LayoutMaxWidth: =
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Width: =200
                            Children:
                              - Label_RequestedAmount:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =Align.Center
                                    AutoHeight: =true
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Bold
                                    LayoutMaxHeight: =
                                    LayoutMaxWidth: =
                                    OnSelect: =Select(scrCashAdvance_shp_SelectRegion)
                                    TabIndex: =If(IsBlank(Self.Text), -1, 0)
                                    Text: |-
                                      =Concatenate(
                                          Text(Value(ThisItem.'Requested amount'), "#,#0.00", varDefaultLanguage),
                                          " ",
                                          varDefaultCurrency
                                      )
                                    Width: =Parent.Width
                        - Icon3_CashAdvance:
                            Control: Classic/Icon@2.5.0
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              BorderColor: =RGBA(0, 18, 107, 1)
                              Color: =RGBA(110, 110, 110, 1)
                              Icon: =Icon.ChevronRight
                              LayoutMaxHeight: =
                              LayoutMaxWidth: =
                              OnSelect: =Select(scrCashAdvance_shp_SelectRegion);
                              PaddingBottom: =15
                              PaddingTop: =15
                              Visible: =!varCntSelect
                  - scrCashAdvance_shp_GalleryBaseSeparator_1:
                      Control: Rectangle@2.3.0
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Fill: =RGBA(225, 225, 225, 1)
                        Height: =1
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        LayoutMinHeight: =1
                        Width: =Parent.Width - 10
            - scrCashAdvance_shp_SelectRegion:
                Control: Rectangle@2.3.0
                Properties:
                  AccessibleLabel: ="Select cash advance"
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Fill: =RGBA(0, 0, 0, 0)
                  FocusedBorderThickness: =0
                  Height: =Parent.TemplateHeight
                  OnSelect: |-
                    =If(
                        varCntSelect,
                        If(
                            IsBlank(LookUp(colSelectedCashAdvanceIds, cashAdvanceNumber = ThisItem.'Cash advance number')) && ThisItem.'Cash advance status' = 'Cash advance status (mserp)'.Draft,
                            Collect(colSelectedCashAdvanceIds, {cashAdvanceNumber: ThisItem.'Cash advance number'}),
                            RemoveIf(colSelectedCashAdvanceIds, cashAdvanceNumber = ThisItem.'Cash advance number')
                        ),
                        Select(Parent)
                    )
                  TabIndex: =0
                  Width: =Container9_CashAdvance.X + Container9_CashAdvance.Width
      - scrCashAdvance_cmp_Footer_1:
          Control: CanvasComponent
          ComponentName: cmp_Footer_5
          Properties:
            ApprovalsAccessibleLabel: ="Text"
            ApprovalsText: |-
              =If(
                  varAppMode = "SalaryAdvance", "Salary Request",
                  If(
                      varAppMode = "CashAdvance", "1. Cash Request",
                      If(
                          varAppMode = "AirfareAllowance", "Submit Reports",
                          GlobalLabels.Labels.'15062:LocalizedName,msdyn_ApprovalsLabel'
                      )
                  )
              )
            DisplayMode: =!IsBlank(varSelectedLegalEntity)
            ExpenseAccessibleLabel: ="Text"
            ExpensesText: |-
              =If(
                  varAppMode = "CashAdvance",
                  "2. Add Expenses",
                  "Add Expenses"
              )
            Fill: =RGBA(248, 248, 248, 0.94)
            Height: =If(App.Width >= 1024, 120, 84)
            OnApprovalsButtonClick: |-
              =If(
                  varAppMode in ["CashAdvance", "SalaryAdvance"], // 이 부분 수정
                  Set(varSelectedTab, 4);
                  Navigate('Cash Advance - List Screen', ScreenTransition.Fade),
                  If(
                      varAppMode = "AirfareAllowance",
                      Set(varSelectedTab, 4);
                      Navigate('Travel - List Screen', ScreenTransition.Fade),
                      UpdateContext({varcntShowFilter: false});
                      Set(varSelectedTab, 4);
                      Navigate('Approvals - List Screen', ScreenTransition.Fade, {varFiltersApplied:false, varSelectedProjects:Blank(), varSelectedUsers: Blank(), varcntSelectedStatus:1});
                      Reset(scr25_cmb_Project);
                      Reset(scr25_cmb_User)
                  )
              )
            OnExpensesButtonClick: |-
              =UpdateContext({varcntShowFilter: false});
              Set(varSelectedTab, 2);
              Navigate('Expenses - List Screen', ScreenTransition.Fade)
            OnReceiptsButtonClick: ="Text"
            OnReportsButtonClick: |-
              =UpdateContext({varcntShowFilter: false});
              Set(varSelectedTab, 3);
              Navigate('Reports - List Screen', ScreenTransition.Fade, {varcntSelectedStatus:0})
            ReceiptAccessibleLabel: =
            ReceiptText: ="Text"
            ReportAccessibleLabel: ="Text"
            ReportText: |-
              =If(
                  varAppMode = "AirfareAllowance",
                  "View Reports",
                  If(
                      varAppMode = "CashAdvance",
                      "3. Submit Reportst",
                      "Submit Reports"
                  )
              )
            SelectedTab: =4
            Visible: =!varCntSelect
            Width: =Max(App.Width, App.MinScreenWidth)
            Y: =App.Height - Self.Height
            paramInDefaultAppMode: =varAppMode
            paramInDefaultSelectedTab: =4
      - scrCashAdvance_shp_Rectangle:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =Color.White
            Height: =105
            OnSelect: |-
              =UpdateContext({varcntShowFilter: false});
              UpdateContext({varCashAdvanceShowDateFilter: false})
            Width: =Parent.Width
            Y: =scrCashAdvance_hdr_TopHeader.Height - 2
      - ComboBox_CashAdvanceStatusFilter:
          Control: Classic/ComboBox@2.4.0
          Properties:
            AccessibleLabel: ="Filter by cash advance status"
            BorderColor: =RGBA(0, 18, 107, 1)
            ChevronBackground: =RGBA(56, 96, 178, 1)
            ChevronFill: =RGBA(255, 255, 255, 1)
            ChevronHoverBackground: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            ChevronHoverFill: =RGBA(255, 255, 255, 1)
            Default: =Blank()
            DefaultSelectedItems: =First(ComboBoxSample)
            DisplayFields: =["DisplayName"]
            Font: =Font.'Segoe UI'
            Height: =44
            HoverFill: =RGBA(186, 202, 226, 1)
            InputTextPlaceholder: ="Filter by Status"
            Items: |-
              =//Table(
              //    {Value: Blank(), DisplayName: "All"},
              //    {Value: 'Cash advance status (mserp)'.Draft, DisplayName: "Draft"},
              //    {Value: 'Cash advance status (mserp)'.Submitted, DisplayName: "Submitted"},
              //    {Value: 'Cash advance status (mserp)'.'In review', DisplayName: "In review"},
              //    {Value: 'Cash advance status (mserp)'.Approved, DisplayName: "Approved"},
              //    {Value: 'Cash advance status (mserp)'.Returned, DisplayName: "Returned"},
              //    {Value: 'Cash advance status (mserp)'.Ordered, DisplayName: "Ordered"},
              //    {Value: 'Cash advance status (mserp)'.'Ready to pay', DisplayName: "Ready to pay"},
              //    {Value: 'Cash advance status (mserp)'.Paid, DisplayName: "Paid"}
              //)

              colCashAdvanceStatusOptions
            OnChange: |-
              =//UpdateContext({varCashAdvanceStatusFilter: Self.Selected.Value});
              UpdateContext({varCntSelect: false});
              Clear(colSelectedCashAdvanceIds)
            PaddingBottom: =5
            PaddingLeft: =5
            PaddingRight: =5
            PaddingTop: =5
            PressedColor: =RGBA(255, 255, 255, 1)
            PressedFill: =RGBA(0, 18, 107, 1)
            SearchFields: =["DisplayName"]
            SelectionColor: =RGBA(255, 255, 255, 1)
            SelectionFill: =RGBA(56, 96, 178, 1)
            Size: =16
            Width: |-
              =//If(App.Width > 640, 200, Parent.Width - 40)
              If(App.Width > 640, Min(400, Parent.Width * 0.4), Parent.Width - 40)
            X: |-
              =//20
              If(
                  App.Width > 640,
                  // PC: 날짜 필터 라벨의 왼쪽에 위치 (여백 20)
                  scrCashAdvance_lbl_DateFilter.X - Self.Width - 20,
                  // Mobile: 왼쪽 벽에 붙임 (여백 20)
                  20
              )
            Y: |-
              =//scrCashAdvance_shp_Rectangle.Y + 10
              scrCashAdvance_shp_Rectangle.Y + 10
      - scrCashAdvance_img_DateFilter:
          Control: Image@2.2.3
          Properties:
            AccessibleLabel: ="Filter by date collapsed"
            BorderColor: =RGBA(0, 18, 107, 1)
            Height: =45
            Image: =icnFilter
            OnSelect: |-
              =//UpdateContext({varCashAdvanceShowDateFilter: true});
              //SetFocus(scrCashAdvance_lbl_DateFilterFocus)
              UpdateContext({varCashAdvanceShowDateFilter: !varCashAdvanceShowDateFilter});
              If(varCashAdvanceShowDateFilter, SetFocus(scrCashAdvance_lbl_DateFilterFocus))
            TabIndex: =0
            Visible: |-
              =//!varCashAdvanceShowDateFilter && IsBlank(varCashAdvanceDateFilterStart) && IsBlank(varCashAdvanceDateFilterEnd)
              IsBlank(varCashAdvanceDateFilterStart) && IsBlank(varCashAdvanceDateFilterEnd) && (App.Width > 400)
            Width: =28
            X: |-
              =//If(App.Width > 640, Parent.Width - Self.Width - 25, Parent.Width - Self.Width - 25)
              Parent.Width - Self.Width - 25
            Y: |-
              =//If(App.Width > 640, scrCashAdvance_shp_Rectangle.Y + 10, ComboBox_CashAdvanceStatusFilter.Y + ComboBox_CashAdvanceStatusFilter.Height + 10)
              If(
                  App.Width > 640,
                  // PC: 콤보박스와 같은 높이 (윗줄)
                  scrCashAdvance_shp_Rectangle.Y + 10,
                  // Mobile: 콤보박스 아래로 내려감 (아랫줄)
                  ComboBox_CashAdvanceStatusFilter.Y + ComboBox_CashAdvanceStatusFilter.Height + 10
              )
      - scrCashAdvance_lbl_DateFilter:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Right
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(34, 102, 227, 1)
            Font: =Font.'Segoe UI'
            Height: =32
            Size: =18
            Text: ="Filter by request date"
            Visible: =!varCashAdvanceShowDateFilter && IsBlank(varCashAdvanceDateFilterStart) && IsBlank(varCashAdvanceDateFilterEnd) && (App.Width > 400)
            Width: =250
            X: |-
              =//scrCashAdvance_img_DateFilter.X - Self.Width - 15
              scrCashAdvance_img_DateFilter.X - Self.Width - 10
            Y: |-
              =//If(App.Width > 640, scrCashAdvance_shp_Rectangle.Y + 14, scrCashAdvance_img_DateFilter.Y + 2)
              scrCashAdvance_img_DateFilter.Y + 8
      - scrCashAdvance_shp_Rectangle_1:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =Color.White
            Height: =105
            Visible: =varCntSelect
            Width: =Parent.Width
            Y: =scrCashAdvance_shp_Rectangle.Y + scrCashAdvance_shp_Rectangle.Height
      - scrCashAdvance_lbl_DateFilterFocus:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            Color: =RGBA(0, 0, 0, 0)
            Font: =Font.'Open Sans'
            Height: =164
            OnSelect: |-
              =//false
              UpdateContext({varCashAdvanceShowDateFilter: false})
            PaddingBottom: =10
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =10
            TabIndex: =0
            Text: ="Date filter expanded"
            Visible: =varCashAdvanceShowDateFilter
