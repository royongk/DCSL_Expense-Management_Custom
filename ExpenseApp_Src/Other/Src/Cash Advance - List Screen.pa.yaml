      - scrCashAdvance_hdr_TopHeader:
          Control: CanvasComponent
          ComponentName: main-app-header
          Properties:
            Fill: =Color.White
            Height: =85
            OnSelectButton: |-
              =Set(
                  gblNavigationDrawerVisibility,
                  true
              );
              Set(
                  gblScreenName,
                  'Cash Advance - List Screen'
              );
              Refresh('Expense mobile notifications (mserp)');
              ClearCollect(
                  colExpenseNoticationInfo,
                  ForAll(
                      Filter('Expense mobile notifications (mserp)', NotifiedEmailId = User().Email) As ExpenseNotification,
                      {
                          RecId: ExpenseNotification.EntRecId,
                          ReadMessage: ExpenseNotification.Read
                      }
                  )
              );
            Width: =Max(App.Width, App.MinScreenWidth)
            firstIcon: =
            firstIconAccessibleLabel: =
            firstIconAction: =
            homeIcon: =homeIcon
            homeIconAccessibleLabel: ="Navigate Home"
            homeIconAction: =Navigate('Main Screen', ScreenTransition.Fade)
            paramAvatar: =Coalesce(userImage, blankImage)
            paramTitle: =If(varAppMode = "SalaryAdvance", "Salary Advance", "Cash Advance")
            refreshIconAction: |-
              =UpdateContext({varCntSelect: false});
              Refresh('Cash advances (mserp)');
              Clear(colSelectedCashAdvanceIds);
              Reset(scrCashAdvance_Gallery)
            secondIcon: |-
              =If(
                  varCashAdvanceStatusFilter = 'Cash advance status (mserp)'.Draft,
                  If(
                      CountRows(colSelectedCashAdvanceIds) > 0,
                      DeleteIconEnabled,
                      DeleteIconDisabled
                  )
              )
            secondIconAccessibleLabel: =If(Self.secondIcon = DeleteIconEnabled, "Delete cash advances", "Disabled delete")
            secondIconAction: |-
              =If(
                  varCashAdvanceStatusFilter = 'Cash advance status (mserp)'.Draft && CountRows(colSelectedCashAdvanceIds) > 0,
                  UpdateContext({varCntDelete: true})
              )
            thirdIcon: |-
              =If(
                  varCashAdvanceStatusFilter = 'Cash advance status (mserp)'.Draft,
                  If(
                      varCntSelect,
                      SelectorCloseIcon,
                      SelectorIcon
                  )
              )
            thirdIconAccessibleLabel: =If(Self.thirdIcon = SelectorIcon, "Multiselect cash advances", "Cancel")
            thirdIconAction: |-
              =If(
                  varCntSelect,
                  UpdateContext({varCntSelect: false}),
                  UpdateContext({varCntSelect: true})
              );
              Clear(colSelectedCashAdvanceIds)
