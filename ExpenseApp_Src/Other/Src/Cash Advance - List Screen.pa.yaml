              =UpdateContext({varCashAdvanceShowDateFilter: true});
              SetFocus(scrCashAdvance_lbl_DateFilterFocus)
            PaddingLeft: =12
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
