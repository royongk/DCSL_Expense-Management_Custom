                  Concatenate(
                      Text(varCashAdvanceDateFilterStart, "mmm dd, yyyy"),
                      " - ",
                      Text(varCashAdvanceDateFilterEnd, "mmm dd, yyyy")
                  ),
                  If(
                      !IsBlank(varCashAdvanceDateFilterStart),
                      Concatenate("From ", Text(varCashAdvanceDateFilterStart, "mmm dd, yyyy")),
                      If(
                          !IsBlank(varCashAdvanceDateFilterEnd),
