                        RadiusTopRight: =0
                        Width: =Parent.Width
                      Children:
                        - lbl_RequestedAmount_1:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0, 18, 107, 1)
                              Font: =Font.'Segoe UI'
                              Height: =32
                              LayoutMinHeight: =40
                              LayoutMinWidth: =150
                              Size: =18
                              Text: ="* Requested Amount"
                              VerticalAlign: =VerticalAlign.Top
                              Width: =Parent.Width
                  - txt_RequestedAmount_1:
                      Control: Classic/TextInput@2.3.2
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Default: |-
                          =If(
                              varIsCreateCashAdvance && IsBlank(dirtyTransAmount),
                              "",
                              With(
                                  { 
                                      baseAmount: Value(Coalesce(dirtyTransAmount, Text(varSelectedCashAdvance.'Requested amount'))) 
                                  },
                                  If(
                                      locIsEditingAmount, 
                                      Text(baseAmount, "#"),                   
                                      Text(baseAmount, "#,##0.00", "en-US") // 소수점이 필요없다면 "#,##0" 으로 변경 가능
                                  )
                              )
                          )
                        DisplayMode: =DisplayMode.View
                        FillPortions: =1
                        Font: =Font.'Open Sans'
                        Height: =Min('Cash Advance - View Only Screen'.Height * 0.0616, 50)
                        HintText: ="0.00"
                        HoverBorderColor: =RGBA(0, 18, 107, 1)
                        HoverFill: =RGBA(186, 202, 226, 1)
                        LayoutMinHeight: =40
                        LayoutMinWidth: =320
                        OnChange: |-
                          =UpdateContext({ dirtyTransAmount: Substitute(Self.Text, ",", "") });
                          UpdateContext({ locIsEditingAmount: false });
                          Reset(Self);
                        OnSelect: |-
                          =UpdateContext({ locIsEditingAmount: true })
