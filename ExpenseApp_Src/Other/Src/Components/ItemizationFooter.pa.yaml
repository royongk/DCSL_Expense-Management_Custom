ComponentDefinitions:
  ItemizationFooter:
    DefinitionType: CanvasComponent
    CustomProperties:
      ButtonName:
        PropertyKind: Input
        DisplayName: ButtonName
        Description: Name of the button
        DataType: Text
        Default: ="Text"
      ItemizedAmountLabel:
        PropertyKind: Input
        DisplayName: ItemizedAmountLabel
        Description: A custom property
        DataType: Text
        Default: ="Text"
      OnButtonClick:
        PropertyKind: Event
        DisplayName: OnButtonClick
        Description: On Click of the button
        ReturnType: Text
        Default: ="Text"
      RemainingAmountLabel:
        PropertyKind: Input
        DisplayName: RemainingAmountLabel
        Description: A custom property
        DataType: Text
        Default: ="Text"
      RemainingAmountValue:
        PropertyKind: Input
        DisplayName: RemainingAmountValue
        Description: Amount remaining to be itemized
        DataType: Text
        Default: ="Text"
      itemizedAmountValue:
        PropertyKind: Input
        DisplayName: itemizedAmountValue
        Description: Itemized Amount Value
        DataType: Text
        Default: ="Text"
      subCategoryRecid:
        PropertyKind: Input
        DisplayName: subCategoryRecid
        Description: Contains subcategoryRecId value
        DataType: Text
        Default: ="Text"
    Properties:
      Fill: =Color.White
      Height: =App.Height * 0.2377
      Width: =Max(App.Width, App.MinScreenWidth)
    Children:
      - Container8_1:
          Control: GroupContainer@1.3.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.ExtraBold
            Height: =1
            LayoutDirection: =LayoutDirection.Vertical
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =App.Width - 4
            X: =2
      - FooterVerticalAlignment:
          Control: GroupContainer@1.3.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =itemizedAmountContainer.Height + RemainingAmountContainer.Height + ButtonContainer.Height
            LayoutDirection: =LayoutDirection.Vertical
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =ItemizationFooter.Width
          Children:
            - itemizedAmountContainer:
                Control: GroupContainer@1.3.0
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =itemizedAmountLabel.Height
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutMinHeight: =itemizedAmountLabel.Height
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =ItemizationFooter.Width
                Children:
                  - itemizedAmountLabel:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =ItemizationFooter.Height * 0.2963
                        PaddingLeft: =10
                        Size: =ItemizationFooter.Height * 0.0778
                        Text: =ItemizationFooter.ItemizedAmountLabel
                        Width: =itemizedAmountContainer.Width / 2
                  - ItemizedAmountValue:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Right
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =ItemizationFooter.Height * 0.2963
                        PaddingRight: =10
                        Size: =ItemizationFooter.Height * 0.0778
                        Text: =ItemizationFooter.itemizedAmountValue
                        Width: =itemizedAmountContainer.Width / 2
            - RemainingAmountContainer:
                Control: GroupContainer@1.3.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =RemainingAmountLabel.Height
                  LayoutDirection: =LayoutDirection.Horizontal
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - RemainingAmountLabel:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =ItemizationFooter.Height * 0.2963
                        PaddingLeft: =10
                        Size: =ItemizationFooter.Height * 0.0778
                        Text: =ItemizationFooter.RemainingAmountLabel
                        Width: =itemizedAmountContainer.Width / 2
                  - RemainingAmountValue:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Right
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =ItemizationFooter.Height * 0.2963
                        PaddingRight: =10
                        Size: =ItemizationFooter.Height * 0.0778
                        Text: =ItemizationFooter.RemainingAmountValue
                        Width: =itemizedAmountContainer.Width / 2
            - ButtonContainer:
                Control: GroupContainer@1.3.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =ActionButton.Height * 3 / 2
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutJustifyContent: =LayoutJustifyContent.Center
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =FooterVerticalAlignment.Width
                Children:
                  - ActionButton:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =ColorFade(Self.Fill, -15%)
                        Color: =RGBA(255, 255, 255, 1)
                        DisabledBorderColor: =RGBA(166, 166, 166, 1)
                        Fill: =RGBA(34, 102, 227, 1)
                        Font: =Font.'Open Sans'
                        Height: =ItemizationFooter.Height * 0.2593
                        HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                        HoverColor: =RGBA(255, 255, 255, 1)
                        HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                        OnSelect: =ItemizationFooter.OnButtonClick()
                        PressedBorderColor: =Self.Fill
                        PressedColor: =Self.Fill
                        PressedFill: =Self.Color
                        Size: =ItemizationFooter.Height * 0.0889
                        Text: =ItemizationFooter.ButtonName
                        Width: =App.Width * 0.891
