ComponentDefinitions:
  cmp_ApprovalsFooter:
    DefinitionType: CanvasComponent
    CustomProperties:
      ApprovalText:
        PropertyKind: Input
        DisplayName: ApprovalText
        Description: Text displayed under Approvals button
        DataType: Text
        Default: ="Text"
      DelegateText:
        PropertyKind: Input
        DisplayName: DelegateText
        Description: Text under delegate button
        DataType: Text
        Default: ="Text"
      DisplayMode:
        PropertyKind: Input
        DisplayName: DisplayMode
        Description: control mode of components
        DataType: Boolean
        Default: =true
      IsDelegateVisible:
        PropertyKind: Input
        DisplayName: IsDelegateVisible
        Description: Property to control visibility of the delegate button
        DataType: Boolean
        Default: =true
      OnApprovalsButtonClick:
        PropertyKind: Event
        DisplayName: OnApprovalsButtonClick
        Description: Action to perform when user clicks on Approve
        ReturnType: Text
        Default: ="Text"
      OnDelegateButtonClick:
        PropertyKind: Event
        DisplayName: OnDelegateButtonClick
        Description: Action to perform when user clicks on delegate
        ReturnType: Text
        Default: ="Text"
      OnRejectButtonClick:
        PropertyKind: Event
        DisplayName: OnRejectButtonClick
        Description: Action when user clicks on Reject
        ReturnType: Boolean
        Default: =true
      RejectText:
        PropertyKind: Input
        DisplayName: RejectText
        Description: Text that comes up under Reject button
        DataType: Text
        Default: ="Text"
      paramInDefaultSelectedTab:
        PropertyKind: Input
        DisplayName: paramInDefaultSelectedTab
        Description: A custom input property used to set default selected tab
        RaiseOnReset: true
        DataType: Number
        Default: =2
      paramOutSelectedTabIndex:
        PropertyKind: Output
        DisplayName: paramOutSelectedTabIndex
        Description: Selected Tab Index
        DataType: Number
    Properties:
      Fill: =RGBA(250, 249, 248, 1)
      Height: =100
      OnReset: =Set(varSelectedTab,cmp_ApprovalsFooter.paramInDefaultSelectedTab)
      Width: =Max(App.Width, App.MinScreenWidth)
      paramOutSelectedTabIndex: =
    Children:
      - cmp_footer_img_Approve:
          Control: Image@2.2.3
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            DisplayMode: |-
              =If(
                  cmp_ApprovalsFooter.DisplayMode,
                  DisplayMode.Edit,
                  DisplayMode.View
              )
            Height: =40.96
            Image: =ApprovalIcon
            OnSelect: =cmp_ApprovalsFooter.OnApprovalsButtonClick()
            Width: =40.96
            X: =(delegateRegion_2.X + approveRegion_2.X)/2 - 20
            Y: =14.88
      - cmp_footer_img_Delegate:
          Control: Image@2.2.3
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            DisplayMode: |-
              =If(
                  cmp_ApprovalsFooter.DisplayMode,
                  DisplayMode.Edit,
                  DisplayMode.View
              )
            Height: =40.96
            Image: =DelegateIcon
            OnSelect: =cmp_ApprovalsFooter.OnDelegateButtonClick()
            Visible: =cmp_ApprovalsFooter.IsDelegateVisible
            Width: =40.96
            X: =(rejectRegion_2.X + delegateRegion_2.X)/2 - 20
            Y: =16.59
      - cmp_footer_img_Reject:
          Control: Image@2.2.3
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            DisplayMode: |-
              =If(
                  cmp_ApprovalsFooter.DisplayMode,
                  DisplayMode.Edit,
                  DisplayMode.View
              )
            Height: =40.96
            Image: =RejectIcon
            OnSelect: =cmp_ApprovalsFooter.OnRejectButtonClick()
            Width: =40.96
            X: =(rejectRegion_2.X + Parent.Width)/2 - 20
            Y: =14.88
      - cmp_footer_lbl_Approve:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(34, 102, 227, 1)
            DisplayMode: |-
              =If(
                  cmp_ApprovalsFooter.DisplayMode,
                  DisplayMode.Edit,
                  DisplayMode.View
              )
            Font: =Font.'Segoe UI'
            Height: =28
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingTop: =0
            Size: =16
            Text: =cmp_ApprovalsFooter.ApprovalText
            Width: =120
            X: =cmp_footer_img_Approve.X - 25
            Y: =60
      - cmp_footer_lbl_Delegate:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(34, 102, 227, 1)
            DisplayMode: |-
              =If(
                  cmp_ApprovalsFooter.DisplayMode,
                  DisplayMode.Edit,
                  DisplayMode.View
              )
            Font: =Font.'Segoe UI'
            Height: =28
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingTop: =0
            Size: =16
            Text: =cmp_ApprovalsFooter.DelegateText
            Visible: =cmp_ApprovalsFooter.IsDelegateVisible
            Width: =120
            X: =cmp_footer_img_Delegate.X - 25
            Y: =60
      - cmp_footer_lbl_Reject:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: |+
              =RGBA(165, 33, 33, 1)
            DisplayMode: |-
              =If(
                  cmp_ApprovalsFooter.DisplayMode,
                  DisplayMode.Edit,
                  DisplayMode.View
              )
            Font: =Font.'Segoe UI'
            Height: =28
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingTop: =0
            Size: =16
            Text: =cmp_ApprovalsFooter.RejectText
            Width: =120
            X: |+
              =cmp_footer_img_Reject.X - 20
            Y: =60
      - delegateRegion_2:
          Control: Rectangle@2.3.0
          Properties:
            AccessibleLabel: ="Select to delegate current workitem"
            BorderColor: =RGBA(0, 18, 107, 1)
            DisplayMode: |-
              =If(
                  cmp_ApprovalsFooter.DisplayMode,
                  DisplayMode.Edit,
                  DisplayMode.View
              )
            Fill: =RGBA(0, 0, 0, 0)
            FocusedBorderThickness: =0
            Height: =Parent.Height
            HoverFill: =
            OnSelect: =Select(cmp_footer_img_Delegate)
            PressedFill: =
            TabIndex: =0
            Width: =Parent.Width/3
            X: =Self.Width
      - approveRegion_2:
          Control: Rectangle@2.3.0
          Properties:
            AccessibleLabel: ="Select to approve current workitem"
            BorderColor: =RGBA(0, 18, 107, 1)
            DisplayMode: |-
              =If(
                  cmp_ApprovalsFooter.DisplayMode,
                  DisplayMode.Edit,
                  DisplayMode.View
              )
            Fill: =RGBA(0, 0, 0, 0)
            FocusedBorderThickness: =0
            Height: =Parent.Height
            HoverFill: =
            OnSelect: =Select(cmp_footer_img_Approve)
            PressedFill: =
            TabIndex: =0
            Width: =Parent.Width/3
      - rejectRegion_2:
          Control: Rectangle@2.3.0
          Properties:
            AccessibleLabel: ="Select to reject current workitem"
            BorderColor: =RGBA(0, 18, 107, 1)
            DisplayMode: |-
              =If(
                  cmp_ApprovalsFooter.DisplayMode,
                  DisplayMode.Edit,
                  DisplayMode.View
              )
            Fill: =RGBA(0, 0, 0, 0)
            FocusedBorderThickness: =0
            Height: =Parent.Height
            HoverFill: =
            OnSelect: =Select(cmp_footer_img_Reject)
            PressedFill: =
            TabIndex: =0
            Width: =Parent.Width/3
            X: =2 * Self.Width
