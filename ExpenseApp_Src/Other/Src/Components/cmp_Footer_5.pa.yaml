ComponentDefinitions:
  cmp_Footer_5:
    DefinitionType: CanvasComponent
    AccessAppScope: true
    CustomProperties:
      ApprovalsAccessibleLabel:
        PropertyKind: Input
        DisplayName: ApprovalsAccessibleLabel
        Description: A custom property
        DataType: Text
        Default: ="Text"
      ApprovalsText:
        PropertyKind: Input
        DisplayName: ApprovalsText
        Description: Defines the label text for Approvals tab
        DataType: Text
        Default: ="Text"
      DisplayMode:
        PropertyKind: Input
        DisplayName: DisplayMode
        Description: control mode of components
        DataType: Boolean
        Default: =true
      ExpenseAccessibleLabel:
        PropertyKind: Input
        DisplayName: ExpenseAccessibleLabel
        Description: A custom property
        DataType: Text
        Default: ="Text"
      ExpensesText:
        PropertyKind: Input
        DisplayName: ExpensesText
        Description: A custom property
        DataType: Text
        Default: ="Text"
      OnApprovalsButtonClick:
        PropertyKind: Event
        DisplayName: OnApprovalsButtonClick
        Description: Defines action on click of Approvals region
        ReturnType: Boolean
        Default: =true
      OnExpensesButtonClick:
        PropertyKind: Event
        DisplayName: OnExpensesButtonClick
        Description: OnExpensesButtonClick
        ReturnType: Text
        Default: ="Text"
      OnReceiptsButtonClick:
        PropertyKind: Event
        DisplayName: OnReceiptsButtonClick
        Description: OnReceiptsClick
        ReturnType: Text
        Default: ="Text"
      OnReportsButtonClick:
        PropertyKind: Event
        DisplayName: OnReportsButtonClick
        Description: OnReportsButtonClick
        ReturnType: Boolean
        Default: =true
      ReceiptAccessibleLabel:
        PropertyKind: Input
        DisplayName: ReceiptAccessibleLabel
        Description: A custom property
        DataType: Text
        Default: =
      ReceiptText:
        PropertyKind: Input
        DisplayName: ReceiptText
        Description: A custom property
        DataType: Text
        Default: ="Text"
      ReportAccessibleLabel:
        PropertyKind: Input
        DisplayName: ReportAccessibleLabel
        Description: A custom property
        DataType: Text
        Default: ="Text"
      ReportText:
        PropertyKind: Input
        DisplayName: ReportText
        Description: A custom property
        DataType: Text
        Default: ="Text"
      SelectedTab:
        PropertyKind: Input
        DisplayName: SelectedTab
        Description: Currently selected tab
        DataType: Number
        Default: =100
      paramInDefaultAppMode:
        PropertyKind: Input
        DisplayName: paramInDefaultAppMode
        Description: 사용자 지정 속성
        RaiseOnReset: true
        DataType: Text
        Default: ="텍스트"
      paramInDefaultSelectedTab:
        PropertyKind: Input
        DisplayName: paramInDefaultSelectedTab
        Description: A custom input property used to set default selected tab
        RaiseOnReset: true
        DataType: Number
        Default: =2
      paramOutSelectedTabIndex:
        PropertyKind: Output
        DisplayName: paramOutSelectedTabIndex
        Description: Selected Tab Index
        DataType: Number
    Properties:
      Fill: =RGBA(248, 248, 248, 0.94)
      Height: =84
      OnReset: =Set(varSelectedTab,cmp_Footer_5.paramInDefaultSelectedTab)
      Width: =Max(App.Width, App.MinScreenWidth)
      paramOutSelectedTabIndex: =
    Children:
      - cmp_footer_rct_Seprator_9:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =RGBA(200, 200, 200, 1)
            Height: =0.85
            Width: =Parent.Width
      - expensesRegion_3:
          Control: Rectangle@2.3.0
          Properties:
            AccessibleLabel: |-
              =If(
                  cmp_Footer_5.SelectedTab = 2,
                  "Expenses, selected",
                  "Expenses"
              )
            BorderColor: =RGBA(0, 18, 107, 1)
            DisplayMode: |-
              =If(
                  cmp_Footer_5.DisplayMode,
                  DisplayMode.Edit,
                  DisplayMode.View
              )
            Fill: =RGBA(0, 0, 0, 0)
            FocusedBorderThickness: =0
            Height: =84
            HoverFill: =
            OnSelect: =Select(cmp_footer_img_Expenses_8)
            PressedFill: =
            TabIndex: =0
            Width: |-
              =If(
                  cmp_Footer_5.paramInDefaultAppMode in ["CashAdvance", "AirfareAllowance"],
                  Parent.Width/3,
                  Parent.Width/2
              )
      - reportsRegion_3:
          Control: Rectangle@2.3.0
          Properties:
            AccessibleLabel: |-
              =If(
                  cmp_Footer_5.SelectedTab = 3,
                  "Reports, selected",
                  "Reports"
              )
            BorderColor: =RGBA(0, 18, 107, 1)
            DisplayMode: |-
              =If(
                  cmp_Footer_5.DisplayMode,
                  DisplayMode.Edit,
                  DisplayMode.View
              )
            Fill: =RGBA(0, 0, 0, 0)
            FocusedBorderThickness: =0
            Height: =84
            HoverFill: =
            OnSelect: =Select(cmp_footer_img_Reports_8)
            PressedFill: =
            TabIndex: =0
            Width: |-
              =If(
                  cmp_Footer_5.paramInDefaultAppMode in ["CashAdvance", "AirfareAllowance"],
                  Parent.Width/3,
                  Parent.Width/2
              )
            X: =Self.Width
      - approvalsRegion_3:
          Control: Rectangle@2.3.0
          Properties:
            AccessibleLabel: |-
              =If(
                  cmp_Footer_5.SelectedTab = 4,
                  "Approvals, selected",
                  "Approvals"
              )
            BorderColor: =RGBA(0, 18, 107, 1)
            DisplayMode: |-
              =If(
                  cmp_Footer_5.DisplayMode,
                  DisplayMode.Edit,
                  DisplayMode.View
              )
            Fill: =RGBA(0, 0, 0, 0)
            FocusedBorderThickness: =0
            Height: =84
            HoverFill: =
            OnSelect: =Select(cmp_footer_img_Approvals_2)
            PressedFill: =
            TabIndex: =0
            Visible: |-
              =If(
                  cmp_Footer_5.paramInDefaultAppMode in ["CashAdvance", "AirfareAllowance"],
                  true,
                  false
              )
            Width: =Parent.Width/3
            X: =2 * Self.Width
      - cmp_footer_img_Reports_8:
          Control: Image@2.2.3
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            DisplayMode: |-
              =If(
                  cmp_Footer_5.DisplayMode,
                  DisplayMode.Edit,
                  DisplayMode.View
              )
            Height: =28.16
            Image: =If( Value(cmp_Footer_5.paramInDefaultSelectedTab=3),IcnFooterReportsSelected, IcnFooterReportsUnSelected)
            OnSelect: =cmp_Footer_5.OnReportsButtonClick()
            Width: =28.16
            X: =reportsRegion_3.X + (reportsRegion_3.Width - Self.Width)/2
            Y: =14.88
      - cmp_footer_img_Approvals_2:
          Control: Image@2.2.3
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Height: =28.16
            Image: |-
              =If(
                  cmp_Footer_5.paramInDefaultAppMode = "CashAdvance",
                  If(
                      Value(cmp_Footer_5.paramInDefaultSelectedTab=4),
                      cashSelectedIcon,
                      cashDeselectedIcon
                  ),
                  If(
                      cmp_Footer_5.paramInDefaultAppMode = "AirfareAllowance",
                      If(
                          Value(cmp_Footer_5.paramInDefaultSelectedTab=4),
                          travelSelected,
                          travelDeselectedIcon
                      ),
                      If(
                          Value(cmp_Footer_5.paramInDefaultSelectedTab=4),
                          approvalsSelectedIcon,
                          approvalsIcon
                      )
                  )
              )
            OnSelect: =cmp_Footer_5.OnApprovalsButtonClick()
            Visible: =approvalsRegion_3.Visible
            Width: =28.16
            X: =approvalsRegion_3.X + (approvalsRegion_3.Width - Self.Width)/2
            Y: =14.88
      - cmp_footer_img_Expenses_8:
          Control: Image@2.2.3
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            DisplayMode: |-
              =If(
                  cmp_Footer_5.DisplayMode,
                  DisplayMode.Edit,
                  DisplayMode.View
              )
            Height: =28.16
            Image: =If( cmp_Footer_5.paramInDefaultSelectedTab=2,IcnFooterExpenseSelected,IcnFooterExpenseUnSelected)
            OnSelect: =cmp_Footer_5.OnExpensesButtonClick()
            Width: =28.16
            X: =expensesRegion_3.X + (expensesRegion_3.Width - Self.Width)/2
            Y: =16.59
      - cmp_footer_lbl_Expenses_8:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =If(varSelectedTab=2,RGBA(34, 102, 227, 1), RGBA(110, 110, 110, 1))
            DisplayMode: |-
              =If(
                  cmp_Footer_5.DisplayMode,
                  DisplayMode.Edit,
                  DisplayMode.View
              )
            Font: =Font.'Segoe UI'
            Height: =28
            PaddingBottom: =0
            PaddingTop: =0
            Size: =16
            Text: =cmp_Footer_5.ExpensesText
            Width: |-
              =If(
                  cmp_Footer_5.paramInDefaultAppMode in ["CashAdvance", "AirfareAllowance"],
                  App.Width / 3,
                  App.Width / 2
              )
            Wrap: =false
            X: =expensesRegion_3.X
            Y: =49.49
      - cmp_footer_lbl_Reports_8:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =If(varSelectedTab=3,RGBA(34, 102, 227, 1), RGBA(110, 110, 110, 1))
            DisplayMode: |-
              =If(
                  cmp_Footer_5.DisplayMode,
                  DisplayMode.Edit,
                  DisplayMode.View
              )
            Font: =Font.'Segoe UI'
            Height: =28
            PaddingBottom: =0
            PaddingTop: =0
            Size: =16
            Text: =cmp_Footer_5.ReportText
            Width: |-
              =If(
                  cmp_Footer_5.paramInDefaultAppMode in ["CashAdvance", "AirfareAllowance"],
                  App.Width / 3,
                  App.Width / 2
              )
            Wrap: =false
            X: =reportsRegion_3.X
            Y: =49.49
      - cmp_footer_lbl_Approvals_2:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =If(varSelectedTab=4,RGBA(34, 102, 227, 1), RGBA(110, 110, 110, 1))
            DisplayMode: |-
              =If(
                  cmp_Footer_5.DisplayMode,
                  DisplayMode.Edit,
                  DisplayMode.View
              )
            Font: =Font.'Segoe UI'
            Height: =28
            PaddingBottom: =0
            PaddingTop: =0
            Size: =16
            Text: =cmp_Footer_5.ApprovalsText
            Visible: =approvalsRegion_3.Visible
            Width: =App.Width / 3
            Wrap: =false
            X: =approvalsRegion_3.X
            Y: =49.49
