ComponentDefinitions:
  emptyStateComponent:
    DefinitionType: CanvasComponent
    CustomProperties:
      subTitle:
        PropertyKind: Input
        DisplayName: subTitle
        Description: A custom property
        DataType: Text
        Default: ="Text"
      title:
        PropertyKind: Input
        DisplayName: title
        Description: A custom property
        DataType: Text
        Default: ="Text"
    Properties:
      Height: |
        =350
      Width: =Self.Height
    Children:
      - Image Text:
          Control: GroupContainer@1.4.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =10
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - icnEmptyState:
                Control: Image@2.2.3
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  FillPortions: =1
                  Height: =Parent.Height - Title.Height - SubTitle.Height
                  Image: |
                    =IcnEmptyState
                  ImagePosition: =ImagePosition.Center
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  LayoutMinHeight: =200
                  Width: =Parent.Width
            - Title:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Semibold
                  Height: |
                    =35
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  Size: =18
                  Text: =emptyStateComponent.title
                  Width: =Parent.Width
            - SubTitle:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  AutoHeight: =true
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Font: =Font.'Open Sans'
                  Height: |
                    =50
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  Size: =14
                  Text: =emptyStateComponent.subTitle
                  Width: =Parent.Width
