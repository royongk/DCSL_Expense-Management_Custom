ComponentDefinitions:
  hdr02_Header_5:
    DefinitionType: CanvasComponent
    CustomProperties:
      paramColor:
        PropertyKind: Input
        DisplayName: paramColor
        Description: A custom property
        DataType: Color
        Default: =RGBA(0, 0, 0, 1)
      paramFill:
        PropertyKind: Input
        DisplayName: paramFill
        Description: A custom property
        DataType: Color
        Default: =RGBA(0, 0, 0, 1)
      paramTitle:
        PropertyKind: Input
        DisplayName: paramTitle
        Description: A custom property
        DataType: Text
        Default: ="Text"
    Properties:
      Fill: =hdr02_Header_5.paramFill
      Height: =82
      Width: =Max(App.Width, App.MinScreenWidth)
    Children:
      - hdr02_lbl_Title_5:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =hdr02_Header_5.paramColor
            Fill: =hdr02_Header_5.paramFill
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Semibold
            Height: =38
            Role: =TextRole.Heading1
            Text: =hdr02_Header_5.paramTitle
            Width: =450
            Wrap: =false
            X: =(Parent.Width - Self.Width)/2
            Y: =21
