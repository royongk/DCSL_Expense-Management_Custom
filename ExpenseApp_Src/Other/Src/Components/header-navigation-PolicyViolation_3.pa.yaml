ComponentDefinitions:
  header-navigation-PolicyViolation_3:
    DefinitionType: CanvasComponent
    CustomProperties:
      BackButtonClicked:
        PropertyKind: Event
        DisplayName: BackButtonClicked
        Description: A custom property
        ReturnType: Boolean
        Default: =true
      HeaderText:
        PropertyKind: Input
        DisplayName: HeaderText
        Description: Text for the header
        RaiseOnReset: true
        DataType: Text
        Default: ="Text"
    Properties:
      Height: =82
    Children:
      - Label9_3:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Semibold
            Height: =37
            Text: ='header-navigation-PolicyViolation_3'.HeaderText
            Width: =App.Width
            Y: =21
      - Icon2_2:
          Control: Classic/Icon@2.5.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(0, 18, 107, 1)
            Height: =27
            Icon: =Icon.ChevronLeft
            OnSelect: ='header-navigation-PolicyViolation_3'.BackButtonClicked()
            Width: =19
            X: =24
            Y: =31
