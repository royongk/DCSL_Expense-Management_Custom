            - lbl_ShowHideAll:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: |
                    =RGBA(34, 102, 227, 1)
                  FillPortions: =1
                  Font: =Font.'Segoe UI'
                  FontWeight: =FontWeight.Semibold
                  Height: =Parent.Height
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  LayoutMinWidth: =250
                  OnSelect: "=If(\n    Self.Text = GlobalLabels.Labels.'15062:LocalizedName,ShowAllLabel',\n    UpdateIf(\n        dsPerdiemDetails,\n        true,\n        {\n            isGalleryVisible: true\n        }\n    ),\n    Self.Text = GlobalLabels.Labels.'15062:LocalizedName,HideAllLabel',\n    UpdateIf(\n        dsPerdiemDetails,\n        true,\n        {\n            isGalleryVisible: false\n        }\n    )\n)\n    "
                  Size: =16
                  Text: |-
