Screens:
  Expense - Perdiem Details Screen:
    Properties:
      Fill: =RGBA(244, 244, 244, 1)
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |
        =/*ClearCollect(
            dsPerdiemDetails,
            AddColumns(
                'PerDiem Data Lines for Expense Lines (mserp)',
                "isGalleryVisible",
                false,
                "isDirty",
                false
            )
        );*/
        UpdateContext(
            {
                isDirty : false,
                locNavigateBack: false
            }
        )
    Children:
      - buttonDetailsContainer:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(248, 248, 248, 1)
            Height: =250
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =5
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
            Y: =Parent.Height - Self.Height
          Children:
            - mealsAndIncidentalsContainer:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =70
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  PaddingLeft: =15
                  PaddingRight: =15
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Visible: =!isDirty
                Children:
                  - lblMealsIncidentals:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        FillPortions: =1
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        LayoutMinWidth: =250
                        Text: =GlobalLabels.Labels.'15062:LocalizedName,MealsAndIncidentalsLabel'
                  - lblMealsIncidentalsAmount:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Right
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        Text: |+
                          =Concatenate(Text(Sum(dsPerdiemDetails,'Meals and incidentals'), "#,#0.00", varDefaultLanguage), " ", varDefaultCurrency)


                        Width: =250
            - totalsContainer:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =70
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  PaddingLeft: =15
                  PaddingRight: =15
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Visible: =!isDirty
                Children:
                  - lblTotals:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        FillPortions: =1
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        LayoutMinWidth: =250
                        Text: =GlobalLabels.Labels.'15062:LocalizedName,msdyn_TotalLabel'
                  - lblTotalsAmount:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Right
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        Text: |+
                          =Concatenate(Text(varSelectedExpenseDoc.'Amount (mserp_amountmst)', "#,#0.00", varDefaultLanguage), " ", varDefaultCurrency)


                        Width: =250
            - footerButtonsContainer:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - btnSavePerdiems:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =RGBA(34, 102, 227, 1)
                        Color: |
                          =RGBA(34, 102, 227, 1)
                        DisabledBorderColor: =RGBA(166, 166, 166, 1)
                        DisplayMode: |-
                          =If(
                              locDisableSaveButton,
                              DisplayMode.Disabled,
                              DisplayMode.Edit
                          )
                        Fill: =Color.White
                        Font: =Font.'Segoe UI'
                        Height: =76
                        HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                        HoverColor: =RGBA(255, 255, 255, 1)
                        HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                        OnSelect: |
                          =//navigate to previous screen
                          Clear(perDiemCalcErrors);
                          // if any fields have been altered update the perdiems entity
                          // collect errors if any in perDiemCalcErrors
                          If(
                              isDirty,
                              ForAll(
                                  Filter(dsPerdiemDetails,isDirty) As dirtyPerdiemLines,
                                  IfError(
                                      Patch(
                                          [@'PerDiem Data Lines for Expense Lines (mserp)'],
                                          LookUp(
                                              [@'PerDiem Data Lines for Expense Lines (mserp)'],
                                              EntRecId = dirtyPerdiemLines.EntRecId
                                          ),
                                          {
                                              Breakfast: dirtyPerdiemLines.Breakfast,
                                              Lunch: dirtyPerdiemLines.Lunch,
                                              Dinner: dirtyPerdiemLines.Dinner
                                          }
                                      ),
                                      First(
                                          Collect( 
                                              perDiemCalcErrors,
                                              {
                                                  statusCode : FirstError.Details.HttpStatusCode,
                                                  response : FirstError.Details.HttpResponse
                                              }
                                          ) 
                                      )
                                  )
                              );
                              UpdateContext({isDirty : false});
                          );
                          If(
                              // if there are errors present
                              CountRows(
                                  Distinct(
                                      perDiemCalcErrors,
                                      statusCode
                                  )
                              ) >= 1,
                              // show distinct errors
                              ForAll(
                                  perDiemCalcErrors,
                                  If(
                                      Text(ThisRecord.statusCode) <> NotFoundStatusCode,
                                      Notify(
                                          Substitute(
                                              Match(
                                                  ThisRecord.response,
                                                  """message"":""([^""]*)"""
                                              ).FullMatch,
                                              """message"":",
                                              ""
                                          ),
                                          NotificationType.Error
                                      )
                                  )
                              ),
                              // since no errors are present navigate back to previous screen
                              // update dsPerDiemDetails and varSelectedExpenseDoc
                              UpdateContext({isDirty: false});
                              ClearCollect(
                                  dsPerdiemDetails,
                                  AddColumns(
                                      Filter(
                                          [@'PerDiem Data Lines for Expense Lines (mserp)'],
                                          'Expense transaction number' = varSelectedExpenseDoc.'Expense transaction number (mserp_exptransnumber)'
                                      ),
                                      isGalleryVisible,
                                      false,
                                      isDirty,
                                      false
                                  )
                              );
                              Set(
                                  varSelectedExpenseDoc,
                                  LookUp([@'Expense lines (mserp)'],'Expense transaction number (mserp_exptransnumber)'=varSelectedExpenseDoc.'Expense transaction number (mserp_exptransnumber)')
                              );
                              Navigate('Expenses - Edit Screen', ScreenTransition.None, {varSalesTaxAmount : varSelectedExpenseDoc.'Actual sales tax amount'})
                              // add navigation logic based on where we have navigated from -> simply Back() might do
                          );
                        PressedBorderColor: =Self.Fill
                        PressedColor: =Self.Fill
                        PressedFill: =Self.Color
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Size: =19.15
                        Text: =GlobalLabels.Labels.'15062:LocalizedName,SaveLabel'
                        Width: =Parent.Width -  Self.X*2
                        X: =40*1
                        Y: |-
                          =If(
                              isDirty,
                              btnCalculatePerdiems_1.Y + btnCalculatePerdiems_1.Height + 25,
                              10
                          )
                  - btnCalculatePerdiems:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =RGBA(34, 102, 227, 1)
                        Color: =RGBA(255, 255, 255, 1)
                        DisabledBorderColor: =RGBA(166, 166, 166, 1)
                        Fill: |
                          =RGBA(34, 102, 227, 1)
                        Font: =Font.'Segoe UI'
                        Height: =76
                        HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                        HoverColor: =RGBA(255, 255, 255, 1)
                        HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                        OnSelect: |-
                          =//context variable to disable save button as long as there are network calls ongoing
                          UpdateContext({locDisableSaveButton : true});
                          // clear error list
                          Clear(perDiemCalcErrors);
                          // for all dirty perdiem lines
                          // patch the breakfast, lunch and dinner values
                          // if error collect them in perDiemCalcErrors
                          ForAll(
                              Filter(dsPerdiemDetails,isDirty) As dirtyPerdiemLines,
                              IfError(
                                  Patch(
                                      [@'PerDiem Data Lines for Expense Lines (mserp)'],
                                      LookUp(
                                          [@'PerDiem Data Lines for Expense Lines (mserp)'],
                                          EntRecId = dirtyPerdiemLines.EntRecId
                                      ),
                                      {
                                          Breakfast: dirtyPerdiemLines.Breakfast,
                                          Lunch: dirtyPerdiemLines.Lunch,
                                          Dinner: dirtyPerdiemLines.Dinner
                                      }
                                  ),
                                  First(
                                      Collect(
                                          perDiemCalcErrors,
                                          {
                                              statusCode: FirstError.Details.HttpStatusCode,
                                              response: FirstError.Details.HttpResponse
                                          }
                                      )
                                  )
                              )
                          );
                          If(
                              // if there are errors present
                              CountRows(
                                  Distinct(
                                      perDiemCalcErrors,
                                      statusCode
                                  )
                              ) >= 1,
                              // show distinct errors
                              ForAll(
                                  perDiemCalcErrors,
                                  If(
                                      Text(ThisRecord.statusCode) <> NotFoundStatusCode,
                                      Notify(
                                          Substitute(
                                              Match(
                                                  ThisRecord.response,
                                                  """message"":""([^""]*)"""
                                              ).FullMatch,
                                              """message"":",
                                              ""
                                          ),
                                          NotificationType.Error
                                      )
                                  )
                              ),
                              // since no errors are present update dsPerDiemDetails and varSelectedExpenseDoc
                              UpdateContext({isDirty: false});
                              ClearCollect(
                                  dsPerdiemDetails,
                                  AddColumns(
                                      Filter(
                                          [@'PerDiem Data Lines for Expense Lines (mserp)'],
                                          'Expense transaction number' = varSelectedExpenseDoc.'Expense transaction number (mserp_exptransnumber)'
                                      ),
                                      isGalleryVisible,
                                      false,
                                      isDirty,
                                      false
                                  )
                              );
                              Set(
                                  varSelectedExpenseDoc,
                                  LookUp([@'Expense lines (mserp)'],'Expense transaction number (mserp_exptransnumber)'=varSelectedExpenseDoc.'Expense transaction number (mserp_exptransnumber)')
                              )
                          );
                          UpdateContext({locDisableSaveButton : false});
                        PressedBorderColor: =Self.Fill
                        PressedColor: =Self.Fill
                        PressedFill: =Self.Color
                        Size: =19.15
                        Text: =GlobalLabels.Labels.'15062:LocalizedName,CalculateMealsAndIncidentalsLabel'
                        Visible: =isDirty
                        Width: |
                          =Parent.Width -  Self.X*2
                        X: =40*1
                        Y: =36
