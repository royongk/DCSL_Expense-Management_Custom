                        DisabledBorderColor: =RGBA(166, 166, 166, 1)
                        Fill: =Color.White
                        Font: =Font.'Segoe UI'
                        Height: =76
                        HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                        HoverColor: =RGBA(255, 255, 255, 1)
                        HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                        OnSelect: |-
                          =UpdateContext({locNavigatedFrom:Blank()});
                          UpdateContext({locReportApprovalItem:false});
                          Back();
                        PressedBorderColor: =Self.Fill
                        PressedColor: =Self.Fill
                        PressedFill: =Self.Color
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Size: =19.15
                        Text: =GlobalLabels.Labels.'15062:LocalizedName,msdyn_DoneButtonLabel'
                        Width: =Parent.Width -  Self.X*2
                        X: =40*1
                        Y: |-
                          =If(
                              isDirty,
                              btnCalculatePerdiems_1.Y + btnCalculatePerdiems_1.Height + 25,
                              10
                          )
                  - btnCalculatePerdiems_1:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =RGBA(34, 102, 227, 1)
                        Color: =RGBA(255, 255, 255, 1)
                        DisabledBorderColor: =RGBA(166, 166, 166, 1)
                        Fill: |
                          =RGBA(34, 102, 227, 1)
                        Font: =Font.'Segoe UI'
                        Height: =76
                        HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                        HoverColor: =RGBA(255, 255, 255, 1)
                        HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                        OnSelect: |
                          =// clear error list
                          Clear(perDiemCalcErrors);
                          // for all dirty perdiem lines
                          // patch the breakfast, lunch and dinner values
                          // if error collect them in perDiemCalcErrors
                          ForAll(
                              Filter(dsPerdiemDetails,isDirty) As dirtyPerdiemLines,
                              IfError(
                                  Patch(
                                      [@'PerDiem Data Lines for Expense Lines (mserp)'],
                                      LookUp(
                                          [@'PerDiem Data Lines for Expense Lines (mserp)'],
                                          EntRecId = dirtyPerdiemLines.EntRecId
                                      ),
                                      {
                                          Breakfast: dirtyPerdiemLines.Breakfast,
                                          Lunch: dirtyPerdiemLines.Lunch,
                                          Dinner: dirtyPerdiemLines.Dinner
                                      }
                                  ),
                                  First(
                                      Collect(
                                          perDiemCalcErrors,
                                          {
                                              statusCode: FirstError.Details.HttpStatusCode,
                                              response: FirstError.Details.HttpResponse
                                          }
                                      )
                                  )
                              )
                          );
                          If(
                              // if there are errors present
                              CountRows(
                                  Distinct(
                                      perDiemCalcErrors,
                                      statusCode
                                  )
                              ) >= 1,
                              // show distinct errors
                              ForAll(
                                  perDiemCalcErrors,
                                  If(
                                      Text(ThisRecord.statusCode) <> NotFoundStatusCode,
                                      Notify(
                                          Substitute(
                                              Match(
                                                  ThisRecord.response,
                                                  """message"":""([^""]*)"""
                                              ).FullMatch,
                                              """message"":",
                                              ""
                                          ),
                                          NotificationType.Error
                                      )
                                  )
                              ),
                              // since no errors are present update dsPerDiemDetails and varSelectedExpenseDoc
                              UpdateContext({isDirty: false});
                              ClearCollect(
                                  dsPerdiemDetails,
                                  AddColumns(
                                      Filter(
                                          [@'PerDiem Data Lines for Expense Lines (mserp)'],
                                          'Expense transaction number' = varSelectedExpenseDoc.'Expense transaction number (mserp_exptransnumber)'
                                      ),
                                      isGalleryVisible,
                                      false,
                                      isDirty,
                                      false
                                  )
                              );
                              Set(
                                  varSelectedExpenseDoc,
                                  LookUp([@'Expense Line Expense Mobile Entity (mserp)'],'Expense transaction number (mserp_exptransnumber)'=varSelectedExpenseDoc.'Expense transaction number (mserp_exptransnumber)')
                              )
                          );
                        PressedBorderColor: =Self.Fill
                        PressedColor: =Self.Fill
                        PressedFill: =Self.Color
                        Size: =19.15
                        Text: ="Calculate meals and incidentals"
                        Visible: =false
                        Width: |
                          =Parent.Width -  Self.X*2
                        X: =40*1
                        Y: =36
