Screens:
  Expenses - Capture Receipt Screen:
    Properties:
      Fill: =RGBA(255, 255, 255, 1)
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |-
        =Set(varReceiptImage, Blank());
        Set(varFileFormat, Blank());
        UpdateContext({varCam : LookUp(bsea_cam_ReceiptClick.AvailableDevices, "back" in Lower(Name) || "rear" in Lower(Name), Id)})
    Children:
      - imageCapture_footer_rectangle:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =RGBA(33, 33, 33, 1)
            Height: |
              =290//Max(App.Height, App.MinScreenHeight)/5
            Width: =Max(App.Width, App.MinScreenWidth)
            Y: =Parent.Height - Self.Height
      - scr02_btn_SelectExistingBorder:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(255, 255, 255, 1)
            BorderThickness: =3
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =RGBA(33, 33, 33, 1)
            Font: =Font.'Open Sans'
            Height: =88
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =Self.Color
            HoverFill: =Self.Fill
            OnSelect: =Navigate('Expenses - Select Existing Receipt Screen')
            PressedBorderColor: =Self.BorderColor
            PressedFill: =Self.Fill
            Size: =22
            Text: =GlobalLabels.Labels.'15062:LocalizedName,msdyn_SelectExistingLabel'
            Width: |+
              =Parent.Width -  Self.X*2
            X: =54
            Y: =Parent.Height - Self.Height - 35
      - lbl_imge_help:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.'Segoe UI'
            Height: =31
            Size: =17
            Text: =GlobalLabels.Labels.'15062:LocalizedName,msdyn_ReceiptEntirelyInViewLabel'
            Width: =Parent.Width
            Y: =imageCapture_footer_rectangle.Y + (imageCapture_footer_rectangle.Height - Self.Height)/2 - 35
      - bsea_cam_ReceiptClick:
          Control: Camera@2.4.0
          Properties:
            AccessibleLabel: ="Take receipt image"
            BorderColor: =RGBA(255, 255, 255, 1)
            Camera: =Coalesce(varCam, 0)
            Height: =imageCapture_footer_rectangle.Y - Self.Y
            OnSelect: =Select(scr02_icn_CameraIcon)
            StreamRate: =100
            Width: =App.Width
            Y: =82
      - img_click_outer_ring_2:
          Control: Image@2.2.3
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Height: =108
            Image: ='Ellipse 3_1'
            Width: =141
            X: =(Parent.Width - Self.Width)/2
            Y: =imageCapture_footer_rectangle.Y - (Self.Height/2)
      - img_click_outer_ring_1:
          Control: Image@2.2.3
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Height: =92
            Image: ='Ellipse 2_1'
            Width: =153
            X: =(Parent.Width - Self.Width)/2
            Y: =imageCapture_footer_rectangle.Y - (Self.Height/2)
      - scr02_img_ClickInner:
          Control: Image@2.2.3
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Height: =77
            Image: ='Ellipse 1_1'
            OnSelect: |-
              =Set(varReceiptImage,bsea_cam_ReceiptClick.Stream); 
              Set(
                  varFileFormat,
                  "png"
              );
              Set(varReceiptFileName,Concatenate( "Receipt-",Text(GUID())));
              Navigate('Expenses - Preview Receipt Screen', ScreenTransition.None)
            Width: =94
            X: =(Parent.Width - Self.Width)/2
            Y: =imageCapture_footer_rectangle.Y - (Self.Height/2)
      - scr02_icn_CameraIcon:
          Control: Image@2.2.3
          Properties:
            AccessibleLabel: ="Click receipt image"
            BorderColor: =RGBA(0, 18, 107, 1)
            Height: =22 * Value(lbconfig_resolution_factor.Text)
            Image: =Icon_Camera
            OnSelect: |-
              =Set(varReceiptImage,bsea_cam_ReceiptClick.Stream); 
              Set(
                  varFileFormat,
                  "png"
              );
              Set(varReceiptFileName,Concatenate( "Receipt-",Text(GUID())));
              Navigate('Expenses - Preview Receipt Screen', BorderStyle.None)
            TabIndex: =0
            Width: =24 * Value(lbconfig_resolution_factor.Text)
            X: =(Parent.Width - Self.Width)/2
            Y: =imageCapture_footer_rectangle.Y - (Self.Height/2)
      - scr02_img_CameraSwitchOuter:
          Control: Image@2.2.3
          Properties:
            AccessibleLabel: ="Switch camera"
            BorderColor: =RGBA(0, 18, 107, 1)
            Height: =68*1
            Image: ='Ellipse 3_1'
            OnSelect: |-
              =If(
                  CountRows(bsea_cam_ReceiptClick.AvailableDevices),
                  UpdateContext({varCam : Mod(Value(varCam) + 1, CountRows(bsea_cam_ReceiptClick.AvailableDevices))})
              )
            TabIndex: =0
            Width: =68*1
            X: =(Parent.Width/2 - Self.Width)/2
            Y: =imageCapture_footer_rectangle.Y - (Self.Height/2)
      - scr02_img_CameraSwitchInner:
          Control: Image@2.2.3
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Height: =58
            Image: ='Ellipse 1_1'
            OnSelect: |-
              =If(
                  CountRows(bsea_cam_ReceiptClick.AvailableDevices),
                  UpdateContext({varCam : Mod(Value(varCam) + 1, CountRows(bsea_cam_ReceiptClick.AvailableDevices))})
              )
            Width: =58
            X: =(Parent.Width/2 - Self.Width)/2
            Y: =imageCapture_footer_rectangle.Y - (Self.Height/2)
      - scr02_img_CameraSwitch:
          Control: Image@2.2.3
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Height: =27.27
            Image: =CameraSwitchIcon
            OnSelect: |-
              =If(
                  CountRows(bsea_cam_ReceiptClick.AvailableDevices),
                  UpdateContext({varCam : Mod(Value(varCam) + 1, CountRows(bsea_cam_ReceiptClick.AvailableDevices))})
              )
            Width: =27.27
            X: =(Parent.Width/2 - Self.Width)/2
            Y: =imageCapture_footer_rectangle.Y - (Self.Height/2)
      - scr02_hdr_TopHeader:
          Control: CanvasComponent
          ComponentName: hdr02_Header
          Properties:
            Fill: =scr02_hdr_TopHeader.paramFill
            Height: =82
            Width: =Max(App.Width, App.MinScreenWidth)
            paramColor: =RGBA(255, 255, 255, 1)
            paramFill: |
              =RGBA(33, 33, 33, 1)
            paramTitle: =GlobalLabels.Labels.'15062:LocalizedName,msdyn_NewExpenseLabel'
      - scr02_lbl_Skip:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Semibold
            Height: =33
            OnSelect: |
              =
              Set(
                  varReceiptImage,
                  Blank()
              );
              Set(
                  varFileFormat,
                  Blank()
              );
              If(
                  !IsBlank(OCRresponse),
                  Set(
                      OCRresponse,
                      Blank()
                  )
              );
              If(
                  varNavigateFromExpense = "NavigatedFromItemizedEditExpense",
                  Navigate('Itemization - Itemized Expense Edit Screen'),
                  Navigate('Expenses - Edit Screen',ScreenTransition.Fade,{locItemizeButtonVisibilityFlag : false})
              )
            Size: =17
            TabIndex: =0
            Text: =GlobalLabels.Labels.'15062:LocalizedName,msdyn_SkipLabel'
            Width: =scr02_hdr_TopHeader.Width * 0.21875
            Wrap: =false
            X: =(Parent.Width - Self.Width) - 15
            Y: =24
      - scr02_ico_Back:
          Control: Classic/Icon@2.5.0
          Properties:
            AccessibleLabel: ="Press to go back"
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =Color.White
            Fill: =icongconfig_backbutton.Fill
            Height: =icongconfig_backbutton.Height
            Icon: =Icon.ChevronLeft
            OnSelect: =Back();
            TabIndex: =0
            Width: =icongconfig_backbutton.Width
            X: =22.5
            Y: =(scr02_hdr_TopHeader.Height-Self.Height)/2
