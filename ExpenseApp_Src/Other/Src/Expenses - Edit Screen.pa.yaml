Screens:
  Expenses - Edit Screen:
    Properties:
      Fill: =RGBA(248, 248, 248, 1)
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: "=UpdateContext({varStateSelected: Blank()});\nUpdateContext({varZipCodeSelectedRecId: -1 });\nUpdateContext({varProjectHierarchyId: Blank()});\nUpdateContext({onReloadButtonClick: false});\n// 3-level category selection variables\nUpdateContext({varSelectedDepartment: Blank()});\nUpdateContext({varSelectedBenefitType: Blank()});\nUpdateContext({varSelectedBenefitTypeValue: \"\"});\nUpdateContext({curCategory: If(!varIsCreate && !IsBlank(varSelectedExpenseDoc.'Expense category (mserp_costtype)'), varSelectedExpenseDoc.'Expense category (mserp_costtype)', Blank())});\n// Cost Center context\nUpdateContext({varSelectedCostCenter: Blank()});\nIf(\n    !varIsCreate && !IsBlank(varSelectedExpenseDoc.CostCenter),\n    UpdateContext({\n        varSelectedCostCenter: LookUp(\n            'DCSL Financial Dimension CostCenter (mserp)',\n            'Combination display' = varSelectedExpenseDoc.CostCenter\n        )\n    })\n);\n// Project context\nUpdateContext({varSelectedProject: Blank()});\nIf(\n    !varIsCreate && !IsBlank(varSelectedExpenseDoc.Project),\n    UpdateContext({\n        varSelectedProject: LookUp(\n            Filter(\n                'DCSL Financial Dimension Master (mserp)',\n                'Dimension name' = \"Project\"\n            ),\n            'Dimension value' = varSelectedExpenseDoc.Project\n        )\n    })\n);\n// Load existing Department and Benefit Type from Expense Category (reverse lookup)\nIf(\n    !varIsCreate && !IsBlank(varSelectedExpenseDoc.'Expense category (mserp_costtype)'),\n    With(\n        {\n            mappingRecord: LookUp(\n                'DCSL Expense Category Mapping Setup Entity (mserp)',\n                'Expense category' = varSelectedExpenseDoc.'Expense category (mserp_costtype)'\n            )\n        },\n        If(\n            !IsBlank(mappingRecord),\n            UpdateContext({\n                varSelectedDepartment: mappingRecord.Department\n            });\n            UpdateContext({\n                varSelectedBenefitType: mappingRecord.'Benefit Type'\n            })\n        )\n    )\n);\nUpdateContext({curIntercompanyLE: Coalesce(DataCardValue39_1.Selected.Value, varSelectedExpenseDoc.'Legal entity')});\nUpdateContext({curInterCompanyProjectCategory: varSelectedExpenseDoc.'Intercompany project category'});\nUpdateContext({curProjIdSelected: varSelectedExpenseDoc.'Project ID'});\nUpdateContext({curCountrySelected: varSelectedExpenseDoc.'Country/region (mserp_countryregion)'});\nUpdateContext({curStateSelected: varSelectedExpenseDoc.'State/province'});\nUpdateContext({curBillIssuedToSelected: varSelectedExpenseDoc.'Hotel bill issued to'});\nUpdateContext({taxModifiedByUser: false});\nUpdateContext({varLoadingSpinner : true});\nIf(\n    !varIsCreate && !IsBlank(varSelectedExpenseDoc.'Expense category (mserp_costtype)'),\n    UpdateContext(\n        {\n            locItemizeButtonVisibilityFlag : 'Expense mobile master data (mserp)'.mserp_trvexpmobilemasterdataentity_isexpenseitemizable(LookUp('Expense mobile master data (mserp)',Email = User().Email).'Expense mobile master data (mserp)', \n            {\n                CostType: varSelectedExpenseDoc.'Expense category (mserp_costtype)',\n                SplitLineType:\"Default\",\n                LineType: If(varSelectedExpenseDoc.'Expense line type' = 'Expense line type (mserp)'.'Itemized header',\"ItemizedHeader\",\"Default\")\n            }).return\n\n        }\n    )\n);\nIf(\n    !varIsCreate && gblIsProjectValidationFlag,\n    Clear(colGetProjectsBasedOnResourceCategory);\n    UpdateContext({\n        varGetProjectsJson :\n        IfError(\n            Text(\n                'Projects (mserp)'.mserp_trvexpmobileprojentity_getprojectsbasedonresourcecategory(LookUp('Expense mobile master data (mserp)',Email = User().Email).'Expense mobile master data (mserp)',\n                    {\n                        employeeLegalEntity: varSelectedLegalEntity,\n                        interCompanyLegalEntity: curIntercompanyLE,\n                        categoryId: \n                        If(\n                            IsBlank(If(Upper(varSelectedLegalEntity) <> Upper(curIntercompanyLE), varSelectedExpenseDoc.'Intercompany project category', curCategory)),\n                            \"\",\n                            If(Upper(varSelectedLegalEntity) <> Upper(curIntercompanyLE), varSelectedExpenseDoc.'Intercompany project category', curCategory)\n                        )\n                    }).return\n            ),\n            \"\"\n        )\n    });\n    If(\n        !IsBlank(varGetProjectsJson),\n        ClearCollect(\n            colGetProjectsBasedOnResourceCategory,\n            ForAll(\n                MatchAll(varGetProjectsJson, \"\\{\"\"projId\"\":\"\"(?<projId>[^\"\"]*)\"\",\"\"projName\"\":\"\"(?<projName>[^\"\"]*)\"\"\\}\") As ProjectListFromCol,\n                {\n                    projectId: ProjectListFromCol.projId, \n                    projectName: ProjectListFromCol.projName\n                }\n            )\n        ),\n        Clear(colGetProjectsBasedOnResourceCategory)\n    );\n    \n    If(\n        !IsBlankOrError(curProjIdSelected),\n        UpdateContext({\n            varProjectHierarchyId:\n                LookUp(\n                    'Projects (mserp)',\n                    'Project ID' = curProjIdSelected,\n                    HierarchyId\n                )\n        })\n    );\n);\nUpdateContext({locItemizationCheck : locItemizeButtonVisibilityFlag});\nUpdateContext(\n    {\n        timerCostType: false,\n        timerProj: false,\n        timerHBIT: false,\n        timerCountry: false,\n        timerState: false,\n        locAllowNavigationBack: true\n    }\n);\n// populate the current expense type of the selected document\nUpdateContext(\n    {\n        currExpenseType: Coalesce(\n            varSelectedExpenseDoc.'Expense type',\n            If(\n                !IsBlank(varSelectedExpenseDoc.'Expense category (mserp_costtype)'),\n                LookUp(\n                    'Expense category (mserp)',\n                    'Expense category' = varSelectedExpenseDoc.'Expense category (mserp_costtype)',\n                    'Expense type'\n                ),\n                Blank()\n            )\n        )\n    }\n);\nIf(\n    !varIsCreate,\n    UpdateContext({msCallStartedForSalestaxCalculation: true});\n    UpdateContext({varOnShowFields: false});\n    UpdateContext({varOnSelectTriggered: false});\n    UpdateContext({varOnChangeTriggered: false});\n    \n);\nUpdateContext(\n    {\n        featureEnabled: If(\n            userRecord.IsReimaginedUIEnabled = 'NoYes (mserp)'.Yes,\n            \"True\",\n            \"False\"\n        ),\n        perdiemFeatureEnabled: If(\n            userRecord.IsReImaginedPerDiemEnabled = 'NoYes (mserp)'.Yes,  //this needs to be changed to the perdiem feature enabled\n            \"True\",\n            \"False\"\n        )\n    }\n);\n//Check if the itemization is over or under distributed\nIf(\n    !varIsCreate,\n    If(\n        varRemainingAmount < 0,\n        Notify(\n            GlobalLabels.Labels.'15062:LocalizedName,msdyn_ThisExpenseIsOverItemizedLabel',\n            NotificationType.Error,\n            gblParams.notificationTime\n        ),\n        varRemainingAmount > 0,\n        Notify(GlobalLabels.Labels.'15062:LocalizedName,msdyn_ThisExpenseIsNotCompletelyItemizedLabel',\n            NotificationType.Warning,\n            gblParams.notificationTime\n        )\n    )\n);\nIf(\n    currExpenseType = 'TrvExpType (mserp)'.'Per diem' && (featureEnabled = \"False\" || perdiemFeatureEnabled = \"False\"),\n    Notify(\n        GlobalLabels.Labels.'15062:LocalizedName,msdyn_PerdiemFeatureDisabledWarning',\n        //\"Enable both re-imagined features to be able to edit this expense\",\n        NotificationType.Warning,\n        gblParams.notificationTime\n    )\n);\n//if labelTableLookUp not empty\nIf(\n    CountRows(labelTableLookUp) <= 0,\n    Collect(\n        labelTableLookUp,\n        {\n            fieldName: \"CostType\",\n            labelName: \"Expense category\",\n            localisedLabelName: GlobalLabels.Labels.'15062:LocalizedName,msdyn_ExpenseCategoryLabel',\n            visible: true,\n            required: true\n        },\n        {\n            fieldName: \"TransDate\",\n            labelName: \"Transaction date\",\n            localisedLabelName: GlobalLabels.Labels.'15062:LocalizedName,msdyn_TransactionDateLabel',\n            visible: true,\n            required: true\n        },\n        {\n            fieldName: \"AmountCurr\",\n            labelName: \"Transaction amount\",\n            localisedLabelName: GlobalLabels.Labels.'15062:LocalizedName,msdyn_TransactionAmountLabel',\n            visible: true,\n            required: true\n        },\n        {\n            fieldName: \"ExchangeCode\",\n            labelName: \"Currency\",\n            localisedLabelName: GlobalLabels.Labels.'15062:LocalizedName,msdyn_CurrencyLabel',\n            visible: true,\n            required: true\n        },\n        {\n            fieldName: \"PayMethod\",\n            labelName: \"Payment method\",\n            localisedLabelName: GlobalLabels.Labels.'15062:LocalizedName,msdyn_PaymentMethodLabel',\n            visible: true,\n            required: true\n        },\n        {\n            fieldName: \"SubmitterJustification\",\n            labelName: \"Employee justification\",\n            localisedLabelName: GlobalLabels.Labels.'15062:LocalizedName,msdyn_EmployeeJustificationLabel',\n            visible: false,\n            required: false\n        }\n    );\n    ForAll(\n        Filter(\n            '@ExpenseManagement:ExpenseMobileFieldVisibilityEntity (mserp)',\n            LegalEntityId = varSelectedLegalEntity\n        ) As VisibilityTable,\n        Collect(\n            labelTableLookUp,\n            {\n                fieldName: VisibilityTable.FieldName,\n                labelName: VisibilityTable.Labels,\n                localisedLabelName: VisibilityTable.LocalisedLabelName\n            }\n        )\n    );\n    If(\n        featureEnabled = \"True\",\n        ForAll(\n            Filter(\n                '@ExpenseManagement:ExpenseMobileFieldVisibilityEntity (mserp)',\n                LegalEntityId = varSelectedLegalEntity\n            ) As VisibilityTable,\n            Patch(\n                labelTableLookUp,\n                LookUp(\n                    labelTableLookUp,\n                    fieldName = VisibilityTable.FieldName\n                ),\n                {\n                    visible: VisibilityTable.VisibilityType <> 'ExpenseFieldVisibilityType (mserp)'.'Do not display',\n                    required: VisibilityTable.VisibilityType = 'ExpenseFieldVisibilityType (mserp)'.Required\n                }\n            )\n        ),\n        ForAll(\n            Filter(\n                'Display fields (mserp)',\n                'Company Code' = varSelectedLegalEntity\n            ) As VisibilityTable,\n            Patch(\n                labelTableLookUp,\n                LookUp(\n                    labelTableLookUp,\n                    fieldName = VisibilityTable.FieldName\n                ),\n                {\n                    visible: VisibilityTable.Visibility <> 'Visibility (mserp)'.'Do not display',\n                    required: false\n                }\n            )\n        )\n    )\n);\nUpdateContext({varLoadingSpinner : false});\nSet(\n    varDefaultSalesTaxGroupCode,\n    varSelectedExpenseDoc.'Sales tax group'\n);\nSet(\n    varItemSalesTaxDefaultValueCode,\n    varSelectedExpenseDoc.'Item sales tax group'\n);\nUpdateContext(\n    {\n        varSalesTaxAmount: Coalesce(\n            varSalesTaxAmount,\n            varSelectedExpenseDoc.'Actual sales tax amount'\n        )\n    }\n);\nUpdateContext({msCallStartedForSalestaxCalculation: false});\nSet(\n    IsreceiptALreadyCreated,\n    false\n);\nSet(\n    isProjIdCalledFromAttach,\n    false\n);\nSet(\n    gblParams,\n    {\n        dropDownHeight: 60,\n        dorpDownBorderThickness: 2,\n        dropDownBorderColor: RGBA(\n            34,\n            102,\n            227,\n            1\n        ),\n        dropDownLabelColor: Color.Black,\n        dropDownHoverFill: RGBA(\n            204,\n            222,\n            255,\n            1\n        ),\n        errorMessageSize: 18,\n        dropDownFontSize: 24,\n        expenseDataCardViewOnly: RGBA(\n            110,\n            110,\n            110,\n            1\n        ),\n        notificationTime: 4000\n    }\n);\n//varibale determines whether any fields were changed\nUpdateContext({isDirty: false});\n\nUpdateContext({categoryModified: false});\nUpdateContext({varDefaultItemSalesTaxError: Blank()});\nUpdateContext({varDefaultSalesTaxError: Blank()});\nUpdateContext({leModified: false});\nUpdateContext({varRatePerMile: Blank()});\nUpdateContext({varMileageTotal: Blank()});\nUpdateContext(\n    {\n        locPerdiemAmountCurr: If(\n            currExpenseType = 'TrvExpType (mserp)'.'Per diem',\n            Text(varSelectedExpenseDoc.'Transaction amount'),\n            Blank()\n        )\n    }\n);\nUpdateContext(\n    {\n        varCurrentSelectedDate: If(\n            varIsCreate,\n            If(\n                IsBlank(OCRresponse),\n                Today(),\n                OCRresponse.transDate\n            ),\n            varSelectedExpenseDoc.'Transaction date'\n        )\n    }\n);\nSet(\n    varDefaultSalesTaxGroupCode,\n    varSelectedExpenseDoc.'Sales tax group'\n);\nSet(\n    varItemSalesTaxDefaultValueCode,\n    varSelectedExpenseDoc.'Item sales tax group'\n);\nUpdateContext(\n    {\n        varSalesTaxAmount: Coalesce(\n            varSalesTaxAmount,\n            varSelectedExpenseDoc.'Actual sales tax amount'\n        )\n    }\n);\nSet(\n    varCurMileage,\n    varSelectedExpenseDoc.Mileage\n);\n\nUpdateContext({varCurVehicleType: varSelectedExpenseDoc.'Vehicle type'});\nUpdateContext({varCurNoOfPass: varSelectedExpenseDoc.'Number of passengers'});\nUpdateContext({varDefaultProjLineStatus: varSelectedExpenseDoc.Billable});\nUpdateContext({varZipCodeChanged: false});\nUpdateContext({varCityChanged: false});\nUpdateContext({varStateChanged: false});\nUpdateContext({varCountryChanged: false});\nUpdateContext({varProjectChanged: false});\n"
    Children:
      - scr03_ico_Back_4:
          Control: Classic/Icon@2.5.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =icongconfig_backbutton.Color
            Fill: =icongconfig_backbutton.Fill
            Height: =icongconfig_backbutton.Height
            Icon: =Icon.ChevronLeft
            OnSelect: |-
              =
              Switch(
                  varNavigatedFrom,
                  "scr17",
                  Navigate('Reports - Edit Screen'),
                  "scr20",
                  Navigate('Reports - View Only Screen'),
                  "scr18",
                  Navigate('Reports - Attach Expenses Screen'),
                  "scr19",
                  Navigate('Reports - View Attached Expenses Screen'),
                  Blank(),
                  Navigate('Expenses - List Screen')
              );
              UpdateContext({
                  varNavigatedFrom:
                  Blank()
              });
              UpdateContext(
                  {
                      dirtyTransAmount : Blank(),
                      dirtyTransDate : Blank(),
                      dirtyMerchant : Blank(),    
                      varOnSelectTriggered: false,
                      varOnShowFields:false,
                      varOnChangeTriggered:false,
                      varSalesTaxAmount: Blank()
                  }
              );
            Visible: =false
            Width: =icongconfig_backbutton.Width
            X: =303
            Y: =19
      - scr03_img_NoReceiptOuter_1:
          Control: Image@2.2.3
          Properties:
            BorderColor: =RGBA(255, 0, 37, 0.2)
            BorderStyle: =BorderStyle.Dashed
            Fill: =RGBA(255, 255, 255, 1)
            Height: =Parent.Height / 4
            Image: |-
              =If(
                  varFileFormat in ["jpg", "bmp", "jpeg", "png", "heic", "tif", "tiff", "raw"] && !IsBlank(varReceiptImage),
                  varReceiptImage,
                  varFileFormat in ["xlsx", "xls"],
                  IconExcel,
                  varFileFormat in ["docx", "doc"],
                  IconWord,
                  varFileFormat = "pdf",
                  IconPDF,
                  varFileFormat = "txt",
                  IconTxt,
                  IconMail
              )
            ImagePosition: |-
              =If(
                  varFileFormat in ["jpg", "bmp", "jpeg", "png", "heic", "tif", "tiff", "raw"] && !IsBlank(varReceiptImage),
                  ImagePosition.Stretch,
                  ImagePosition.Center
              )
            RadiusBottomLeft: =18
            RadiusBottomRight: =18
            RadiusTopLeft: =18
            RadiusTopRight: =18
            Visible: =!IsBlank(varReceiptImage)
            Width: |
              =Parent.Width -  Self.X*2
            X: =24
            Y: |-
              =If(
                  scr03_lbl_PolicyViolationWarning_1.Visible,
                  scr03_lbl_PolicyViolationWarning_1.Y + scr03_lbl_PolicyViolationWarning_1.Height + 27,
                  scr03_lbl_ValidationWarning_1.Y + scr03_lbl_ValidationWarning_1.Height + 27
              )
      - scr03_img_NoReceiptInner_1:
          Control: Image@2.2.3
          Properties:
            BorderColor: =RGBA(166, 166, 166, 1)
            BorderStyle: =BorderStyle.Dashed
            BorderThickness: =5
            Fill: =RGBA(255, 255, 255, 1)
            Height: =Parent.Height/5
            Image: =ImgWhite
            ImagePosition: =ImagePosition.Fill
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Visible: '=IsBlank(varReceiptImage) '
            Width: |
              =Parent.Width -  Self.X*2
            X: =44
            Y: =scr03_img_NoReceiptOuter_1.Y +(scr03_img_NoReceiptOuter_1.Height-scr03_img_NoReceiptInner_1.Height)/2
      - scr03_lbl_AddReceipt_1:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(34, 102, 227, 1)
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Semibold
            Height: =Parent.Height / 4
            OnSelect: |-
              =Navigate('Expenses - Capture Receipt Screen', ScreenTransition.None);
              UpdateContext(
                  {
                      varOnSelectTriggered: false,
                      varOnShowFields:false,
                      varOnChangeTriggered:false
                  }
              )
            TabIndex: =0
            Text: =GlobalLabels.Labels.'15062:LocalizedName,msdyn_AddReceiptLabel'
            Visible: '=IsBlank(varReceiptImage) '
            Width: |
              =Parent.Width -  Self.X*2
            X: =26
            Y: =scr03_img_NoReceiptOuter_1.Y
      - scr03_lbl_ChangeReceipt_1:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =scr03_lbl_AddReceipt_1.Color
            Fill: =Color.White
            Font: =Font.'Open Sans'
            OnSelect: |-
              =Navigate('Expenses - View Receipt Screen', ScreenTransition.None, {varViewOnly : false});
              UpdateContext(
                  {
                      varOnSelectTriggered: false,
                      varOnShowFields:false,
                      varOnChangeTriggered:false
                  }
              )
            PaddingLeft: =35 + scr03_ico_ViewReceipt_1.Width
            Size: =17
            TabIndex: =0
            Text: =GlobalLabels.Labels.'15062:LocalizedName,msdyn_ViewReceiptLabel'
            Visible: =!(IsBlank(varReceiptImage))
            Width: =scr03_img_NoReceiptOuter_1.Width+1
            X: =scr03_img_NoReceiptOuter_1.X
            Y: =scr03_img_NoReceiptOuter_1.Y + (scr03_img_NoReceiptOuter_1.Height -Self.Height)+1
      - scr03_ico_ViewReceipt_1:
          Control: Image@2.2.3
          Properties:
            AccessibleLabel: ="View receipt"
            BorderColor: =RGBA(0, 18, 107, 1)
            Height: =33
            Image: =imageicon
            OnSelect: |-
              =Navigate('Expenses - View Receipt Screen', ScreenTransition.None, {varViewOnly : false});
              UpdateContext(
                  {
                      varOnSelectTriggered: false,
                      varOnShowFields:false,
                      varOnChangeTriggered:false
                  }
              )
            TabIndex: =0
            Visible: =!(IsBlank(varReceiptImage))
            Width: =18
            X: =scr03_lbl_ChangeReceipt_1.X + 25
            Y: =scr03_lbl_ChangeReceipt_1.Y + (scr03_lbl_ChangeReceipt_1.Height-scr03_ico_ViewReceipt_1.Height)/2
      - scr03_lbl_ValidationWarning_1:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(165, 33, 33, 1)
            Fill: =RGBA(249, 217, 217, 1)
            Font: =Font.'Segoe UI'
            Height: |-
              =If(
                  Self.Visible,
                  88,
                  0
              )
            Size: =15
            Text: |-
              =//If(ctVarIsRequiredFieldEmpty,GlobalLabels.Labels.ValidationMsgExpenseNeedMoreDetails)
              //not having receipt in expense is part of policy violation
            Visible: =//ctVarIsRequiredFieldEmpty //Or ((varSelectedExpenseDoc.receiptsAttached = "No" Or IsBlank(varSelectedExpenseDoc)) And IsBlank(varReceiptImage))
            Width: =Parent.Width
            Y: =scr03_hdr_TopHeader_1.Height
      - scr03_hdr_TopHeader_1:
          Control: CanvasComponent
          ComponentName: hdr02_Header
          Properties:
            Fill: =scr03_hdr_TopHeader_1.paramFill
            Height: =82
            Width: =Max(App.Width, App.MinScreenWidth)
            paramColor: =RGBA(0, 0, 0, 1)
            paramFill: =RGBA(255, 255, 255, 1)
            paramTitle: |-
              =If(
                  varIsCreate,
                  GlobalLabels.Labels.'15062:LocalizedName,msdyn_NewExpenseLabel',
                  GlobalLabels.Labels.'15062:LocalizedName,msdyn_EditExpenseLabel'
              )
      - scr03_ico_Back_1:
          Control: Classic/Icon@2.5.0
          Properties:
            AccessibleLabel: ="Press to go back"
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =icongconfig_backbutton.Color
            Fill: =icongconfig_backbutton.Fill
            Height: =icongconfig_backbutton.Height
            Icon: =Icon.ChevronLeft
            OnSelect: "=If(\n    varExpenseButtonClicked,\n    UpdateContext({varCntSelect: false});\n    Navigate('Expenses - List Screen'),\n    If(\n        varIsCreate || isDirty,\n        UpdateContext({ctVarExpenseDetailsBack: true}),\n        Select(scr03_ico_Back_4)\n    );\n    \n);\nUpdateContext({dirtyTransAmount: Blank()});\nUpdateContext({varSalesTaxAmount: Blank()});\nSet(\n    gblNavigationDrawerVisibility,\n    false\n);"
            TabIndex: =0
            Width: =icongconfig_backbutton.Width
            X: =22.5
            Y: =(scr03_hdr_TopHeader_1.Height-Self.Height)/2
      - scr03_lbl_PolicyViolationWarning_1:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: |-
              =/*If(
                  !IsBlank(varMaxViolationLevel),
                  If(
                      Value(varMaxViolationLevel) > 0 && Value(varMaxViolationLevel) <= 2,
                      RGBA(152, 111, 11, 1), //yellow
                      RGBA(217, 44, 44, 1)     //red
                  )
              )*/
            Fill: |-
              =If(
                  !IsBlank(varMaxViolationLevel),
                  If(
                      Value(varMaxViolationLevel) > 0 && Value(varMaxViolationLevel) <= 2,
                      RGBA(255, 242, 195, 1), //yellow  
                      RGBA(249, 217, 217, 1)   //red
                  )
              )
            Font: =Font.'Segoe UI'
            Height: |+
              =//If(ctVarIsRequiredFieldEmpty,GlobalLabels.Labels.ValidationMsgExpenseNeedMoreDetails,"Please add a receipt to this expense")
              If(
                  CountRows(colPolViolations) > 0,
                  88, 0
              )

            OnSelect: |-
              =Navigate('Expenses - Policy Violations Screen', ScreenTransition.None, {varCntExpenseTransactionNumber : varSelectedExpenseDoc.'Expense transaction number (mserp_exptransnumber)'})
            PaddingBottom: =18
            PaddingLeft: =54
            PaddingTop: =18
            Size: =15
            TabIndex: =0
            Text: |
              =Substitute(GlobalLabels.Labels.'15062:LocalizedName,msdyn_PolicyViolationExistsLabel', "$", Text(varNumViolation))
            Visible: =varNumViolation > 0
            Width: |
              =Parent.Width
            Y: =scr03_hdr_TopHeader_1.Height
      - Expense Entr Container:
          Control: GroupContainer@1.4.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: |-
              =If(
                  currExpenseType <> 'TrvExpType (mserp)'.Mileage,
                      Value('footerButtonsContainer - ExpenseEditScreen'.Y - Self.Y - 10),
                      Value(Parent.Height - Self.Y - 5 - ExpenseInfo_1.Height)
              )
            LayoutDirection: =LayoutDirection.Vertical
            LayoutOverflowY: =LayoutOverflow.Scroll
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: |
              =Parent.Width
            Y: =scr03_img_NoReceiptOuter_1.Y + scr03_img_NoReceiptOuter_1.Height + 30
          Children:
            - EditExpenseForm:
                Control: Form@2.4.4
                Variant: Classic
                Layout: Vertical
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  BorderColor: =RGBA(0, 18, 107, 1)
                  DataSource: ='Expense lines (mserp)'
                  DefaultMode: |-
                    =If(
                        varIsCreate,
                        FormMode.New,
                        If(
                            btnEditRefreshExpense.Visible && (featureEnabled = "False" || perdiemFeatureEnabled = "False"),
                            FormMode.View,
                            FormMode.Edit
                        )
                    )
                  Height: |-
                    =If(
                        currExpenseType <> 'TrvExpType (mserp)'.Mileage,
                            500,
                            Value(Parent.Height - Self.Y - 10 - ExpenseInfo_1.Height)    
                    )
                  Item: =varSelectedExpenseDoc
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  OnFailure: "=// [최종 수정] 정확한 카드 이름 반영 (_DataCard2_3)\n//UpdateContext({\n//    varDebugErrorMsg: Concatenate(\n//        // 1. 프로젝트 및 재무 관련\n//        If(!IsBlank('Project ID_DataCard2_3'.Error), \"Project 오류: \" & 'Project ID_DataCard2_3'.Error & Char(10), \"\"),\n        \n//        // 2. 숨겨진 세금 관련 (가장 유력한 범인!)\n//        If(!IsBlank('Sales tax group_DataCard2_3'.Error), \"Sales Tax 오류: \" & 'Sales tax group_DataCard2_3'.Error & Char(10), \"\"),\n//        If(!IsBlank('Item sales tax group_DataCard2_3'.Error), \"Item Tax 오류: \" & 'Item sales tax group_DataCard2_3'.Error & Char(10), \"\"),\n        \n        // 3. 기타 필드\n//        If(!IsBlank(Merchant_DataCard1_3.Error), \"Merchant(상호) 오류: \" & Merchant_DataCard1_3.Error & Char(10), \"\")\n//    )\n//});\n\n//Notify(\n//    If(\n//        IsBlank(varDebugErrorMsg), \n//        \"알 수 없는 오류 (폼 메시지): \" & EditExpenseForm.Error & \" -> 세금(Tax) 필드 설정을 확인하세요.\", \n//        \"★범인 발견!★\" & Char(10) & varDebugErrorMsg\n//    ),\n//    NotificationType.Error,\n//    0\n//);\n\nIf(\n    CountRows(Split(Text(Self.Error), \":\")) > 2,\n    Notify(\n        Mid(Mid(EditExpenseForm.Error, Find(\":\", EditExpenseForm.Error) + 2), Find(\":\", Mid(EditExpenseForm.Error, Find(\":\", EditExpenseForm.Error) + 2)) + 2), \n        NotificationType.Error, \n        gblParams.notificationTime\n    ),\n    Notify(\n        Last(Split(Text(Self.Error), \":\")).Value, \n        NotificationType.Error, \n        gblParams.notificationTime\n    )\n);\nUpdateContext({msCallStartedForSalestaxCalculation: false});"
                  OnSuccess: "=UpdateContext({varSubmittedExpTransNumber : EditExpenseForm.LastSubmit.'Expense transaction number (mserp_exptransnumber)'});\n//attach receipt if any\nUpdateContext({varAttachReceiptError : Blank()});\nIf(\n    IsBlank(varSelectedExpenseDoc),\n        If(\n            !IsBlank(varSubmittedExpTransNumber) && !IsBlank(varSelectedReceiptNumber),\n            IfError(\n                Patch(\n                    'Expense Mobile Unattached Document Entity (mserp)',\n                    LookUp('Expense Mobile Unattached Document Entity (mserp)', EntRecId = varSelectedReceiptNumber),\n                    {\n                        ExpTransNumber:varSubmittedExpTransNumber\n                    }\n                ),\n                UpdateContext({varAttachReceiptError : FirstError.Details})\n            );\n            If(\n                !IsBlank(varAttachReceiptError) && !(Text(varAttachReceiptError.HttpStatusCode) = NotFoundStatusCode),\n                Notify(\n                    Substitute(\n                        Substitute( Match(varAttachReceiptError.HttpResponse, \"\"\"message\"\":\"\"([^\"\"]*)\"\"\").FullMatch, \n                            \"\"\"message\"\":\", \n                            \"\"), \"\"\"\", \"\"),\n                    NotificationType.Error,\n                    gblParams.notificationTime\n                ),\n                Notify(\n                    GlobalLabels.Labels.'15062:LocalizedName,msdyn_ReceiptAttachedSuccessfullyLabel',\n                    NotificationType.Success,\n                    gblParams.notificationTime\n                )\n            )       \n        ),\n\n        If(\n            !IsBlank(varSelectedReceiptNumber) && \n            (IsBlank(varSelectedExpenseDoc.AttachedReceiptId) || Value(varSelectedExpenseDoc.AttachedReceiptId) <> varSelectedReceiptNumber),\n            IfError(\n                Patch(\n                    'Expense Mobile Unattached Document Entity (mserp)',\n                    LookUp('Expense Mobile Unattached Document Entity (mserp)', EntRecId = varSelectedReceiptNumber),\n                    {\n                        ExpTransNumber: varSelectedExpenseDoc.'Expense transaction number (mserp_exptransnumber)'\n                    }\n                ),\n                UpdateContext({varAttachReceiptError : FirstError.Details})\n            );\n            If(\n                !IsBlank(varAttachReceiptError) && !(Text(varAttachReceiptError.HttpStatusCode) = NotFoundStatusCode),\n                Notify(\n                    Substitute(\n                        Substitute( \n                            Match(varAttachReceiptError.HttpResponse, \"\"\"message\"\":\"\"([^\"\"]*)\"\"\").FullMatch, \n                            \"\"\"message\"\":\", \n                            \"\"\n                        ), \"\"\"\", \"\"\n                    ),\n                    NotificationType.Error,\n                    gblParams.notificationTime\n                ),\n               Notify(\n                GlobalLabels.Labels.'15062:LocalizedName,msdyn_ReceiptAttachedSuccessfullyLabel',\n                NotificationType.Success,\n                gblParams.notificationTime\n            )\n        )\n    )\n);\n//create or update expense\nIf(\n    varIsCreate,\n    Notify(\n        GlobalLabels.Labels.'15062:LocalizedName,msdyn_ExpenseCreateMessageLabel',\n        NotificationType.Success,\n        gblParams.notificationTime\n    ),\n    If(\n        isDirty || isExpenseReceiptAttached,\n        Notify(\n            GlobalLabels.Labels.'15062:LocalizedName,msdyn_ExpenseUpdateMessageLabel', \n            NotificationType.Success,\n            gblParams.notificationTime)   \n    )\n);\n\n// no longer new expense creation\nSet(\n    varIsCreate,\n    false\n);\n\nSet(\n    varSelectedExpenseDoc,\n    EditExpenseForm.LastSubmit\n);\nUpdateContext({varSubmittedExpTransNumber :Blank()});\nSet(\n    varIsCreate,\n    false\n);\nSet(\n    isExpenseReceiptAttached,\n    false\n);\nSet(\n    OCRresponse,\n    Blank()\n);\nSet(\n    gblNavigationDrawerVisibility,\n    false\n);\nIf(gblItemizeExpenseButtonClick,\n\nSet(\n    IsCreditcardTransactionInLocalCurrency,\n    LookUp('Expense lines (mserp)', 'Expense transaction number (mserp_exptransnumber)' = varSelectedExpenseDoc.'Expense transaction number (mserp_exptransnumber)', IsCreditcardTransactionInLocalCurrency\n    )\n        );\n        ClearCollect(\n            dsItemizations,\n            AddColumns(\n                GroupBy(\n                    Filter(\n                        'Expense lines (mserp)',\n                        'Expense line type' = 'Expense line type (mserp)'.'Itemized line' && 'Expense transaction number (mserp_itemizedline_exptransnumber)' = varSelectedExpenseDoc.'Expense transaction number (mserp_exptransnumber)'\n                    ),\n                    'Itemization group',\n                    Itemization\n                ),\n                StartDate, Text(Last(SortByColumns(Itemization,\"mserp_transdate\",SortOrder.Descending)).'Transaction date',\"yyyy-mm-dd hh:mm:ssZ\"),\n                DailyRate,\n                If(\n                    IsCreditcardTransactionInLocalCurrency = 'NoYes (mserp)'.No,\n                    First(Itemization).'Transaction amount',\n                    First(Itemization).'Local amount'\n                ),\n                Quantity, CountRows(Itemization),\n                SubCategoryName, First(Itemization).'Expense subcategory name',\n                SubCategoryRecId, First(Itemization).'Expense subcategory',\n                ItemizationGroupId , mserp_expenseitemizationgroupid\n            )\n        );\n        \n);\n\n//locAllowNavigationBack is set to false in cases when the user clicks on the perdiems or the itemization button\nIf(\n    locAllowNavigationBack,\n    If(\n        varIsCreate,\n        Navigate('Expenses - List Screen'),\n        If(\n            !IsBlank(varNavigatedFrom),\n            UpdateContext({varExpenseReportNumber : varSelectedReport.'Expense report number'});\n            Set(\n                varSelectedReport,\n                LookUp('Expense reports (mserp)','Expense report number' = varExpenseReportNumber)\n            );\n            ClearCollect(\n                colAttachedExpensesForReport,\n                Filter(\n                    'Expense lines (mserp)',\n                    'Expense report number (mserp_expnumber)' = varSelectedReport.'Expense report number' \n                    && 'Expense line type' <> 'Expense line type (mserp)'.'Itemized line'\n                )\n            );\n            ClearCollect(\n                colAttachedExpenses,\n                colAttachedExpensesForReport\n            )\n        );\n\n        If(\n            gblItemizeExpenseButtonClick,\n            Navigate('Itemization - Detail Screen',Transition.None,{varNavigatedFrom : varNavigatedFrom, varItemizationScreen: \"itemizationDetailScreen\"}),\n        Switch(\n            varNavigatedFrom,\n            \"scr17\",\n            Navigate('Reports - Edit Screen'),\n            \"scr20\",\n            Navigate('Reports - View Only Screen'),\n            \"scr18\",\n            Navigate('Reports - Attach Expenses Screen'),\n            \"scr19\",\n            Navigate('Reports - View Attached Expenses Screen'),\n            Blank(),\n            Navigate('Expenses - List Screen')\n        );\n        UpdateContext({varNavigatedFrom : Blank()});\n        )\n    );\n    UpdateContext(\n        {\n            dirtyTransAmount:Blank(),\n            dirtyTransDate : Blank(),\n            dirtyMerchant : \"\",\n            varOnSelectTriggered: false,\n            varOnShowFields:false,\n            varOnChangeTriggered:false,\n            varSalesTaxAmount: Blank()\n        }\n    )\n);\nSet(gblItemizeExpenseButtonClick, false);\nUpdateContext({msCallStartedForSalestaxCalculation: false});\nNavigate('Expenses - List Screen', ScreenTransition.None);"
