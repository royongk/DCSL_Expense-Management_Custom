                              OnChange: "=UpdateContext({varOnChangeTriggered : true});\nIf(\n    varOnChangeTriggered && varOnSelectTriggered,\n    UpdateContext({varOnShowFields : true})\n);\nUpdateContext({msCallStartedForSalestaxCalculation : true});\nIf(varOnShowFields,\n    If(\n        IsBlank(Self.Selected.projectId),\n        Reset(DataCardValue9_1); //billable\n        Reset(ComboBox1_14); //activity\n    );\n    If(Self.Selected.projectId <> curProjIdSelected,\n        UpdateContext({varProjectChanged: true});\n        Reset(ComboBox1_15);\n        Reset(ComboBox1_14); // Reset Activity\n        UpdateContext({curProjIdSelected:Self.Selected.projectId});\n        \n        //O-data call to an entity to bring in the projstatusid and hierarchyid\n        Concurrent(\n        UpdateContext({\n            varDefaultProjLineStatus:\n            'Projects (mserp)'.mserp_trvexpmobileprojentity_getprojstatusid(LookUp('Projects (mserp)', 'Project ID' = Self.Selected.projectId).'Project Expense Mobile (mserp)',\n            {\n                CategoryId: ComboBox1_8.Selected.'Expense category',\n                LegalEntity: DataCardValue39_1.Selected.Value\n            }).return\n        }),\n        If(\n            !IsBlank(Self.Selected.projectId),\n        UpdateContext({\n            varProjectHierarchyId:\n                LookUp(\n                    'Projects (mserp)',\n                    'Project ID' = curProjIdSelected,\n                    HierarchyId\n                )\n        })\n        )\n        );\n        \n        Set(\n            varDefaultSalesTaxGroup,\n            Blank()\n        );\n\n        Set(\n            varDefaultSalesTaxGroup, \n            IfError(\n                'Expense mobile master data (mserp)'.mserp_getdefaultsalestaxvalue(\n                    LookUp('Expense mobile master data (mserp)',Email = User().Email,'Expense mobile master data (mserp)'),\n                    {\n                        IntercompanyLE : If(IsBlank(DataCardValue39_1.Selected.Value),\"\",DataCardValue39_1.Selected.Value),\n                        CountryRegion : If(IsBlank(ComboBox1_17.Selected.Code),\"\",ComboBox1_17.Selected.Code),\n                        AddressState : If(IsBlank(ComboBox1_18.Selected.State),\"\",ComboBox1_18.Selected.State),\n                        ProjId : If(IsBlank(If(gblIsProjectValidationFlag,ProjectICheckbox_ES.Selected.projectId,ProjectCheckbox_Entity.Selected.'Project ID')),\"\",If(gblIsProjectValidationFlag,ProjectICheckbox_ES.Selected.projectId,ProjectCheckbox_Entity.Selected.'Project ID')),\n                        TrvExpTableRecId :  \"\"\n                    }\n                ).return,\n                UpdateContext({\n                    varDefaultSalesTaxError : Substitute(\n                        Match(\n                            FirstError.Details.HttpResponse,\n                            \"\"\"message\"\":\"\"([^\"\"]*)\"\"\"\n                        ).FullMatch,\n                        \"\"\"message\"\":\"\"\",\n                        \"\"\n                    )      \n                })\n            )\n        );\n        If(!IsBlank(varDefaultSalesTaxError),\n            Notify(\n                Left(varDefaultSalesTaxError,Len(varDefaultSalesTaxError)-1),\n                NotificationType.Error,\n                gblParams.notificationTime\n            )\n        );\n        UpdateContext({timerProj : true});\n        If(\n            !(IsBlank(ComboBox1_15.Selected.'Sales tax group') || IsBlank(ComboBox1_16.Selected.'Item sales tax group') || IsBlank(ComboBox1_12.Selected.mserp_currencycode) || IsBlank(Text(DateValue1_18.SelectedDate, \"yyyy-mm-dd HH:mm:ssZ\")) || IsBlank(DataCardValue4_1.Text) || IsBlank(DataCardValue39_1.Selected.Value)),\n            UpdateContext({\n                varSalesTaxAmount : \n                IfError(\n                    Value('Expense mobile master data (mserp)'.mserp_getactualsalestaxamount(\n                        LookUp('Expense mobile master data (mserp)',Email = User().Email,'Expense mobile master data (mserp)'),\n                        {\n                            TaxGroup : If(IsBlank(ComboBox1_15.Selected.'Sales tax group'), \"\", ComboBox1_15.Selected.'Sales tax group'),\n                            TaxItemGroup : If(IsBlank(ComboBox1_16.Selected.'Item sales tax group'), \"\", ComboBox1_16.Selected.'Item sales tax group'),\n                            ExchangeCode : If(IsBlank(ComboBox1_12.Selected.mserp_currencycode), \"\", ComboBox1_12.Selected.mserp_currencycode),\n                            TransDate : If(IsBlank(Text(DateValue1_18.SelectedDate, \"yyyy-mm-dd HH:mm:ssZ\")), \"\", Text(DateValue1_18.SelectedDate, \"yyyy-mm-dd HH:mm:ssZ\")),\n                            AmountCurr : Text(Value(If(IsBlank(DataCardValue4_1.Text), \"0\", DataCardValue4_1.Text),varDefaultLanguage), \"#,#0.00\",\"en-US\"),\n                            LegalEntity : If(IsBlank(DataCardValue39_1.Selected.Value),\"\",Text(DataCardValue39_1.Selected.Value)),\n                            TaxIncluded : If('Tax included_DataCard1_3'.Visible,If(Toggle1_1.Value, \"Yes\", \"No\"),If(LookUp('Expense management parameters (mserp)','Company Code'=varDefaultLegalEntity,'Tax included')='NoYes (mserp)'.Yes,\"Yes\", \"No\"))\n                        }\n                    ).return,\"en-US\"),\n                    UpdateContext({\n                        varErrorActualTaxCal : \n                        Substitute(\n                            Match(\n                                FirstError.Details.HttpResponse,\n                                \"\"\"message\"\":\"\"([^\"\"]*)\"\"\"\n                            ).FullMatch,\n                            \"\"\"message\"\":\"\"\",\n                            \"\"\n                        )      \n                    })\n                )\n            });\n        );\n        If(!IsBlank(varErrorActualTaxCal),\n            Notify(\n                Left(varErrorActualTaxCal,Len(varErrorActualTaxCal)-1),\n                NotificationType.Error,\n                gblParams.notificationTime\n            )\n        );\n\n        Reset(DataCardValue25_1);\n    );\n    UpdateContext({isDirty : true});\n);\nUpdateContext({msCallStartedForSalestaxCalculation : false});\n\n"
