      - ExpenseInfo_1:
          Control: CanvasComponent
          ComponentName: ExpenseInfo
          Properties:
            Amount1: |-
              =Concatenate(
              If(IsBlank(
              If(
                  IsBlank(varRatePerMile),
                  Text(Value(varSelectedExpenseDoc.'Rate per mile'), "#,#0.000", varDefaultLanguage),
                  Text(Value(varRatePerMile,"en-US"), "#,#0.000", varDefaultLanguage)
              )),
              Text(Value(0.00), "#,#0.000", varDefaultLanguage),
              If(
                  IsBlank(varRatePerMile),
                  Text(Value(varSelectedExpenseDoc.'Rate per mile'), "#,#0.000", varDefaultLanguage),
                  Text(Value(varRatePerMile,"en-US"), "#,#0.000", varDefaultLanguage)
              )
              ), " ", varDefaultCurrency
              )
            Amount2: |-
              =Concatenate(
                  If(
                      IsBlank(
                          If(
                              IsBlank(varMileageTotal),
                              Text(
                                  Value(varSelectedExpenseDoc.'Transaction amount'),
                                  "#,#0.00",
                                  varDefaultLanguage
                              ),
                              Text(
                                  Value(varMileageTotal,"en-US"),
                                  "#,#0.00",
                                  varDefaultLanguage
                              )
                          )
                      ),
                      Text(
                          Value(0.00),
                          "#,#0.00",
                          varDefaultLanguage
                      ),
                      If(
                          IsBlank(varMileageTotal),
                          Text(
                              Value(varSelectedExpenseDoc.'Transaction amount'),
                              "#,#0.00",
                              varDefaultLanguage
                          ),
                          Text(
                              Value(varMileageTotal,"en-US"),
                              "#,#0.00",
                              varDefaultLanguage
                          )
                      )
                  ), " ", varDefaultCurrency
              )
            CostType: =curCategory
            Currency1: =varDefaultCurrency
            Currency2: =varDefaultCurrency
            Fill: =RGBA(231, 231, 231, 0.8)
            HeaderText1: =GlobalLabels.Labels.'15062:LocalizedName,msdyn_RatePerMileLabel'
            HeaderText2: =GlobalLabels.Labels.'15062:LocalizedName,msdyn_TotalLabel'
            Height: =250
            IconVisibleFlag: =ComboBox1_8.Selected.'Expense type' = 'TrvExpType (mserp)'.Mileage && !IsBlank(DataCardValue40.Text)
            Mileage: =varCurMileage
            NoOfPassengers: =varCurNoOfPass
            OnReload: |-
              =UpdateContext({onReloadButtonClick : true});
              UpdateContext({msCallStartedForSalestaxCalculation : true});
              Set(varCollectCacheV2,
              'Expense mobile master data (mserp)'.mserp_calckm(If(IsBlank(ExpenseInfo_1.RowId),"",ExpenseInfo_1.RowId),
                      {
                          TransDate: If(IsBlank(DatePickerCanvas1_18.SelectedDate),"",Text(DateTimeValue(DatePickerCanvas1_18.SelectedDate),"yyyy-mm-dd hh:mm:ssZ")),
                          CostType: If(IsBlank(ComboBox1_8.Selected.'Expense category'),"",ComboBox1_8.Selected.'Expense category'),
                          KmOwnCar: Text(Value(If(IsBlank(DataCardValue40.Text), "0", DataCardValue40.Text),varDefaultLanguage), "#,#0.00","en-US"),
                          VehicleType: If(IsBlank(VehicleTypeCombobox.Selected.Value),"",VehicleTypeCombobox.Selected.Value),
                          NumberOfPassengers: If(IsBlank(DataCardValue63.Text),0,DataCardValue63.Text)
                      }
                      )
              );

              UpdateContext({varRatePerMile : Text(ParseJSON(varCollectCacheV2.result).KMPrice)});
              UpdateContext({varMileageTotal : Text(ParseJSON(varCollectCacheV2.result).AmountMST)});
              If(
                  !IsBlank(Text(ParseJSON(varCollectCacheV2.result).Warnings)),
                  Notify(
                      Text(ParseJSON(varCollectCacheV2.result).Warnings),
                      NotificationType.Warning,
                      gblParams.notificationTime
                  )
              );
              If(!IsBlank(ComboBox1_15.Selected) && !IsBlank(ComboBox1_16.Selected),
              UpdateContext({taxModifiedByUser:false});

              UpdateContext({
                  varSalesTaxAmount : 
                  IfError(
                  Value('Expense mobile master data (mserp)'.mserp_getactualsalestaxamount(
                      LookUp('Expense mobile master data (mserp)',Email = User().Email,'Expense mobile master data (mserp)'),
