                              OnChange: "=UpdateContext({taxModifiedByUser:false});\nUpdateContext({varOnChangeTriggered : true});\nUpdateContext({msCallStartedForSalestaxCalculation : true});\nIf(\n    varOnChangeTriggered && varOnSelectTriggered,\n    UpdateContext({varOnShowFields : true})\n);\n// --- [수정] 환율 조회 및 LCY(KRW) 계산 로직 (직접 조회 방식) ---\nIf(\n    !IsBlank(DataCardValue4_1.Text) && !IsBlank(Self.Selected.mserp_currencycode),\n    \n    With(\n        {\n            // 1. 'Currency table (mserp)' 테이블에서 선택한 통화 코드(Currency)로 환율(Exchange rate) 조회\n            fetchedRate: LookUp(\n                colExchangeRates,\n                Currency = Self.Selected.mserp_currencycode\n            ).'Exchange rate',\n            \n            // 2. 화면에 입력된 외화 금액의 콤마(,)를 제거하고 숫자로 변환\n            currentAmount: Value(Substitute(DataCardValue4_1.Text, \",\", \"\"))\n        },\n        \n        // 3. KRW 환산 금액 계산 및 로컬 변수(locCalculatedLCY)에 저장\n        // 참고: 조회된 환율이 없을 경우(Blank) 수식 오류를 방지하기 위해 Coalesce로 기본값(100) 처리\n        UpdateContext({ \n            locCalculatedLCY: Text(\n                Round((currentAmount * Value(Coalesce(fetchedRate, 100))) / 100, 0)\n            )\n        })\n    )\n);\n/*\nIf(\n    varOnShowFields,\n    If(\n    !(IsBlank(ComboBox1_15.Selected.'Sales tax group') || IsBlank(ComboBox1_16.Selected.'Item sales tax group') || IsBlank(ComboBox1_12.Selected.mserp_currencycode) || IsBlank(Text(DateValue1_18.SelectedDate, \"yyyy-mm-dd HH:mm:ssZ\")) || IsBlank(DataCardValue4_1.Text) || IsBlank(DataCardValue39_1.Selected.Value)),\n    UpdateContext({\n        varSalesTaxAmount : \n        IfError(\n        Value('Expense mobile master data (mserp)'.mserp_getactualsalestaxamount(\n            LookUp('Expense mobile master data (mserp)',Email = User().Email,'Expense mobile master data (mserp)'),\n            {\n                TaxGroup : If(IsBlank(ComboBox1_15.Selected.'Sales tax group'), \"\", ComboBox1_15.Selected.'Sales tax group'),\n                TaxItemGroup : If(IsBlank(ComboBox1_16.Selected.'Item sales tax group'), \"\", ComboBox1_16.Selected.'Item sales tax group'),\n                ExchangeCode : If(IsBlank(ComboBox1_12.Selected.mserp_currencycode), \"\", ComboBox1_12.Selected.mserp_currencycode),\n                TransDate : If(IsBlank(Text(DateValue1_18.SelectedDate, \"yyyy-mm-dd HH:mm:ssZ\")), \"\", Text(DateValue1_18.SelectedDate, \"yyyy-mm-dd HH:mm:ssZ\")),\n                AmountCurr : Text(Value(If(IsBlank(DataCardValue4_1.Text), \"0\", DataCardValue4_1.Text),varDefaultLanguage), \"#,#0.00\",\"en-US\"),\n                LegalEntity : If(IsBlank(DataCardValue39_1.Selected.Value),\"\",Text(DataCardValue39_1.Selected.Value)),\n                TaxIncluded : If('Tax included_DataCard1_3'.Visible,If(Toggle1_1.Value, \"Yes\", \"No\"),If(LookUp('Expense management parameters (mserp)','Company Code'=varDefaultLegalEntity,'Tax included')='NoYes (mserp)'.Yes,\"Yes\", \"No\"))\n            }\n        ).return,\"en-US\"),\n        UpdateContext({\n            varErrorActualTaxCal : \n            Substitute(\n                Match(\n                    FirstError.Details.HttpResponse,\n                    \"\"\"message\"\":\"\"([^\"\"]*)\"\"\"\n                ).FullMatch,\n                \"\"\"message\"\":\"\"\",\n                \"\"\n            )      \n        })\n        )\n    });\n);\nIf(!IsBlank(varErrorActualTaxCal),\nNotify(\n    Left(varErrorActualTaxCal,Len(varErrorActualTaxCal)-1),\n    NotificationType.Error,\n    gblParams.notificationTime\n)\n);\n\nReset(DataCardValue25_1);\nUpdateContext({isDirty : true});\n);\n*/\nUpdateContext({msCallStartedForSalestaxCalculation : false})"
