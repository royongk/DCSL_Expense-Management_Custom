                  - Transaction amount_DataCard1_3:
                      Control: TypedDataCard@1.0.7
                      Variant: ClassicNumberEdit
                      Properties:
                        BorderColor: =gblParams.dropDownBorderColor
                        DataField: ="mserp_amountcurr"
                        Default: =ThisItem.'Transaction amount'
                        DisplayMode: "=If(\n    // 1. 기존 조건: 일당(Per diem) 경비인 경우\n    currExpenseType = 'TrvExpType (mserp)'.'Per diem' || \n    \n    // 2. \U0001F680 [신규 추가] 고정 금액이 설정된 카테고리인 경우\n    !IsBlank(locCurrentSetup.Amount) && \n    locCurrentSetup.'Fixed Amount' = 'NoYes (mserp)'.Yes,\n    \n    // 위 조건 중 하나라도 맞으면 읽기 전용(수정 불가)\n    DisplayMode.View,\n    \n    // 일반적인 상황에서는 편집 가능\n    DisplayMode.Edit\n)"
                        DisplayName: ="Expense amount"
                        Required: =currExpenseType <> 'TrvExpType (mserp)'.'Per diem'
                        Update: "=// 천단위 구분 기호 해제 로직 포함\n/*\nValue(\n    // 일반 경비인 경우 입력된 텍스트 사용\n    If(IsBlank(DataCardValue4_1.Text) || Value(DataCardValue4_1.Text) = 0,\n        Blank(),\n        // [중요] 텍스트 입력값(\"1,000\")을 숫자(1000)로 변환\n        Substitute(DataCardValue4_1.Text, \",\", \"\") // 입력된 텍스트에서 쉼표(,)를 모두 빈값으로 치환\n    ),\n    varDefaultLanguage\n)\n*/\nValue(\n    If(\n        // 계산된 LCY 값(locCalculatedLCY)이 존재하면 해당 환산 금액을 우선 저장\n        !IsBlank(locCalculatedLCY),\n        locCalculatedLCY,\n        \n        // 계산된 값이 없다면 기존처럼 텍스트 박스에 입력된 값을 숫자로 변환하여 저장\n        If(IsBlank(DataCardValue4_1.Text) || Value(DataCardValue4_1.Text) = 0,\n            Blank(),\n            Substitute(DataCardValue4_1.Text, \",\", \"\")\n        )\n    ),\n    varDefaultLanguage\n)"
                        Visible: =true && currExpenseType <> 'TrvExpType (mserp)'.Mileage && !(Breakfast_DataCard1.Visible)
                        Width: =Parent.Width/2 - 10
                        X: =0
                        Y: =transactionAmountFieldOrder_Y
                      Children:
                        - DataCardKey4_1:
                            Control: Label@2.5.1
                            MetadataKey: FieldName
                            Properties:
                              AutoHeight: =true
                              BorderColor: =RGBA(0, 0, 0, 1)
                              Color: =gblParams.dropDownLabelColor
                              FocusedBorderThickness: =
                              Font: =Font.'Segoe UI'
                              Height: =48
                              Text: ="Expense amount"
                              Tooltip: =Self.Text
                              Width: =Parent.Width - 60
                              Wrap: =false
                              X: =30
                              Y: =10
                        - DataCardValue4_1:
                            Control: Classic/TextInput@2.3.2
                            MetadataKey: FieldValue
                            Properties:
                              AccessibleLabel: =Concatenate("Enter ", Parent.DisplayName, If(Parent.Required, "and it is a required field"))
                              BorderColor: |-
                                =If(
                                    !IsBlank(Parent.Error), 
                                    Color.Red,  // 조건 1: 저장 시도 후 시스템/유효성 검사 에러가 발생한 경우

                                    Parent.Visible && Parent.Required && IsBlank(Parent.Update), 
                                    Color.Red,  // 조건 2: 화면에 보이고 필수 항목인데 아직 값을 입력하지 않은 경우

                                    RGBA(166, 166, 166, 1) // 기본값: 위 두 조건에 모두 해당하지 않는 경우 (정상 상태)
                                )
                              BorderThickness: |-
                                =If(
                                    !IsBlank(Parent.Error) || (Parent.Visible && Parent.Required && IsBlank(Parent.Update)), 
                                    2,  // 에러가 있거나( || ) 필수 항목이 비어있으면 두께를 2로 설정
                                    0   // 정상 상태에서는 두께를 1로 설정
                                )
                              Default: "=// 천단위 구분 기호 로직 수정\nWith(\n    {\n        baseAmount: If(\n            !IsBlank(locCurrentSetup.Amount) && locCurrentSetup.'Fixed Amount' = 'NoYes (mserp)'.Yes,\n            locCurrentSetup.Amount, \n            \n            // 핵심 변경: varSelectedExpenseDoc.'Transaction amount' 보다 파싱된 locOriginalAmount(100)를 우선 사용\n            Value(Coalesce(dirtyTransAmount, locOriginalAmount, Text(varSelectedExpenseDoc.'Transaction amount')))\n        )\n    },\n    If(\n        locIsEditingAmount, \n        Text(baseAmount, \"#\"),                   \n        Text(baseAmount, \"#,##0.00\", varDefaultLanguage) \n    )\n)"
                              DelayOutput: =true
                              DisplayMode: =Parent.DisplayMode
                              FocusedBorderThickness: =gblParams.dorpDownBorderThickness
                              Font: =Font.'Open Sans'
                              Format: |-
                                =//TextFormat.Number
                                TextFormat.Text
                              Height: =gblParams.dropDownHeight
                              HintText: ="Enter Expense amount"
                              HoverBorderColor: =
                              HoverFill: =gblParams.dropDownHoverFill
                              OnChange: "=// 1. 입력값에서 콤마를 제거한 '순수 숫자'를 임시 변수에 저장\nUpdateContext({ locTempAmount: Substitute(Self.Text, \",\", \"\") });\n\n// 2. 최대 금액 초과 여부 체크 및 알림\nIf(\n    !IsBlank(locCurrentSetup.'Max Amount') && \n    locCurrentSetup.'Max Amount' > 0 && \n    Value(locTempAmount) > locCurrentSetup.'Max Amount',\n    Notify(\"입력한 금액이 최대 허용 금액을 초과했습니다. 금액을 다시 확인해주세요.\", NotificationType.Error, 4000)\n);\n\n// 3. 실제 저장될 변수(dirtyTransAmount)에 '순수 숫자'만 업데이트\nUpdateContext({ dirtyTransAmount: locTempAmount });\n\n// --- [수정] 환율 조회 및 LCY(KRW) 계산 로직 (캐싱된 컬렉션 활용) ---\nIf(\n    !IsBlank(ComboBox1_12.Selected.mserp_currencycode) && !IsBlank(varSelectedLegalEntity) && !IsBlank(locTempAmount),\n    \n    With(\n        {\n            // 1. 메모리에 캐싱된 컬렉션(colExchangeRates)에서 환율 즉시 조회\n            fetchedRate: LookUp(\n                colExchangeRates,\n                Currency = ComboBox1_12.Selected.mserp_currencycode\n            ).'Exchange rate',\n            \n            // 2. 화면에 입력된 '현재 텍스트 값'을 실시간으로 가져와 강제 숫자 변환\n            currentAmount: Value(Substitute(DataCardValue4_1.Text, \",\", \"\"))\n        },\n        \n        // 3. 순수 계산 숫자만 변수에 저장 (무조건 100으로 나누고, Round 함수로 소수점 0자리까지만 남김)\n        // [안전장치] Coalesce를 사용하여 환율 누락 시 계산식 오류 방지\n        UpdateContext({ \n            locCalculatedLCY: Text(\n                Round((currentAmount * Value(Coalesce(fetchedRate, 100))) / 100, 0)\n            )\n        })\n    )\n);\n\n// 4. 편집 모드 종료\nUpdateContext({ locIsEditingAmount: false });\n\n// 5. 컨트롤 리셋 (이때 Default 로직이 돌아가며 천 단위 콤마가 예쁘게 적용됨)\nReset(Self);\n\n// 6. 기타 필수 상태 업데이트\nUpdateContext({isDirty : true});\nUpdateContext({varOnChangeTriggered : true});\n\n// \U0001F680 [가장 중요한 수정] 기존에 있던 아래 코드는 절대 사용하면 안 됩니다. 삭제했습니다.\n// UpdateContext({dirtyTransAmount : Self.Text}); \n\nUpdateContext({taxModifiedByUser:false});\nUpdateContext({msCallStartedForSalestaxCalculation : true});\n\nIf(\n    varOnChangeTriggered && varOnSelectTriggered,\n    UpdateContext({varOnShowFields : true})\n);\n\nReset(DataCardValue25_1);\nUpdateContext({msCallStartedForSalestaxCalculation : false});"
