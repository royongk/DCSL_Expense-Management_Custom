            - btnEditRefreshExpense:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =RGBA(34, 102, 227, 1)
                  BorderThickness: =4
                  Color: |
                    =RGBA(34, 102, 227, 1)
                  DisabledBorderColor: =RGBA(166, 166, 166, 1)
                  DisplayMode: |-
                    =If(
                        (msCallStartedForSalestaxCalculation  || timerProj || timerCostType || timerHBIT || timerCountry || timerState) ||
                        (Self.Visible && (featureEnabled = "False" || perdiemFeatureEnabled = "False")),
                        DisplayMode.Disabled,
                        DisplayMode.Edit
                    )
                  Fill: =Color.White
                  Font: =Font.'Segoe UI'
                  Height: =87
                  HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  OnSelect: "=If(\n    userRecord.IsReImaginedPerDiemEnabled  = 'NoYes (mserp)'.Yes,\n    If(\n        // check if the meal reduction is of the type of Meal Type per trip\n\n        LookUp('Expense management parameters (mserp)','Company Code'= varSelectedLegalEntity,'Calculate meal reduction by') = 'Meal reductions (mserp)'.'Meal type per trip',\n\n        // if it is of meal type per trip, then invoke odata action to get amountCurr values\n        Clear(dsPerdiemActionResponse);\n        UpdateContext({onReloadButtonClick : true});\n        UpdateContext({msCallStartedForSalestaxCalculation : true});\n        UpdateContext(\n            {\n                locPerdiemActionResponse : 'Expense mobile master data (mserp)'.mserp_trvexpmobilemasterdataentity_calcmealpertripreduction(LookUp('Expense mobile master data (mserp)',Email = User().Email,'Expense mobile master data (mserp)'),\n                {\n                    DateFrom: Text('Per diem from date_DataCard1'.Update, \"yyyy-mm-dd HH:mm:ss\"),\n                    DateTo: Text('Per diem to date_DataCard1'.Update, \"yyyy-mm-dd HH:mm:ss\"),\n                    CostType: \"Perdiem\",\n                    Location: cmbPerdiemLocation.Selected.EntRecId,\n                    DedBreakfast: DataCardValue1.Text,\n                    DedLunch: DataCardValue2.Text,\n                    DedDinner: DataCardValue3.Text\n                }).return\n            }\n        );\n        UpdateContext({locPerdiemActionResponse : Concatenate(\"[\", locPerdiemActionResponse, \"]\")});\n        ForAll(\n            Table(\n                ParseJSON(\n                    locPerdiemActionResponse\n                )\n            ),\n            Collect(\n                dsPerdiemActionResponse,\n                {\n                    amountCurr: Text(ThisRecord.Value.AmountCurr),       \n                    amountMST : Text(ThisRecord.Value.AmountMST),\n                    exchangeCode : Text(ThisRecord.Value.ExchangeCode),\n                    warnings : Text(ThisRecord.Value.Warnings)\n                }\n            )\n        );\n        If(\n            !IsBlank(First(dsPerdiemActionResponse).warnings),\n            // there are errors in odata action show them\n            Notify(\n                Text(First(dsPerdiemActionResponse).warnings),\n                NotificationType.Warning,\n                gblParams.notificationTime\n            ),\n            // no errors, proceed to calculate tax based on the latest fetched transaction amount from odata action\n            UpdateContext({locPerdiemAmountCurr : First(dsPerdiemActionResponse).amountCurr});\n            If(\n                !IsBlank(ComboBox1_15.Selected) && !IsBlank(ComboBox1_16.Selected),\n                //if sales tax group and item sales tax group are not blank issue a call to get the sales tax amount \n                UpdateContext({taxModifiedByUser:false});\n                UpdateContext\n                (\n                    {\n                        varSalesTaxAmount : \n                        IfError(\n                            Value(\n                                'Expense mobile master data (mserp)'.mserp_trvexpmobilemasterdataentity_getactualsalestaxamount(\n                                LookUp('Expense mobile master data (mserp)',Email = User().Email,'Expense mobile master data (mserp)'),\n                                {\n                                    TaxGroup : If(IsBlank(ComboBox1_15.Selected.'Sales tax group'), \"\", ComboBox1_15.Selected.'Sales tax group'),\n                                    TaxItemGroup : If(IsBlank(ComboBox1_16.Selected.'Item sales tax group'), \"\", ComboBox1_16.Selected.'Item sales tax group'),\n                                    ExchangeCode : If(IsBlank(ComboBox1_12.Selected.mserp_currencycode), \"\", ComboBox1_12.Selected.mserp_currencycode),\n                                    TransDate : If(IsBlank(Text(DateValue1_18.SelectedDate, \"yyyy-mm-dd HH:mm:ssZ\")), \"\", Text(DateValue1_18.SelectedDate, \"yyyy-mm-dd HH:mm:ssZ\")),\n                                    AmountCurr : If(IsBlank(First(dsPerdiemActionResponse).amountCurr), \"0\", First(dsPerdiemActionResponse).amountCurr),\n                                    LegalEntity : If(IsBlank(DataCardValue39_1.Selected.Value),\"\",Text(DataCardValue39_1.Selected.Value)),\n                                    TaxIncluded : If('Tax included_DataCard1_3'.Visible,If(Toggle1_1.Value, \"Yes\", \"No\"),If(LookUp('Expense management parameters (mserp)','Company Code'=varDefaultLegalEntity,'Tax included')='NoYes (mserp)'.Yes,\"Yes\", \"No\"))\n                                }).return,\"en-US\"\n                            ),\n                            UpdateContext(\n                                {\n                                    varErrorActualTaxCal : \n                                    Substitute(\n                                        Match(\n                                            FirstError.Details.HttpResponse,\n                                            \"\"\"message\"\":\"\"([^\"\"]*)\"\"\"\n                                        ).FullMatch,\n                                        \"\"\"message\"\":\"\"\",\n                                        \"\"\n                                    )      \n                                }\n                            )\n                        )\n                    }\n                );\n                // show errors if any\n                If(\n                    !IsBlank(varErrorActualTaxCal),\n                    Notify(\n                        Left(varErrorActualTaxCal,Len(varErrorActualTaxCal)-1),\n                        NotificationType.Error,\n                        gblParams.notificationTime\n                    )\n                )\n            );\n        );\n        UpdateContext({msCallStartedForSalestaxCalculation : false}),\n\n        // if it is of meal type per day or number of meals per day then collect details and navigate to meal reduction screen\n        \n        If(\n            varIsCreate || isDirty,\n            // if it is a newly created expense or if an existing expense had its perdiem dates changed\n            // then submit the form and pick the updated expense and perdiem details\n            UpdateContext({locAllowNavigationBack : false});\n            SubmitForm(EditExpenseForm);\n            If(\n                // there are no errors, then proceed with picking the updated/created expense\n                // no need to notify as the OnFailure and OnSuccess of the form should take care of it\n                IsBlank(Last(Split(Text(EditExpenseForm.Error), \":\")).Value) || \n                Last(Split(Text(EditExpenseForm.Error), \":\")).Value = \"\",\n                // update the expense record\n                Set(\n                    varSelectedExpenseDoc,\n                    EditExpenseForm.LastSubmit\n                );\n                \n                // update perdiem details and navigate\n                ClearCollect(\n                    dsPerdiemDetails,\n                    AddColumns(\n                        Filter([@'PerDiem Data Lines for Expense Lines (mserp)'],'Expense transaction number' = varSelectedExpenseDoc.'Expense transaction number (mserp_exptransnumber)'),\n                        isGalleryVisible,\n                        false,\n                        isDirty,\n                        false\n                    )\n                );\n                Navigate('Expense - Perdiem Details Screen', ScreenTransition.None, {locNavigatedFrom : \"Expense\"})\n            ),\n            ClearCollect(\n                dsPerdiemDetails,\n                AddColumns(\n                    Filter([@'PerDiem Data Lines for Expense Lines (mserp)'],'Expense transaction number' = varSelectedExpenseDoc.'Expense transaction number (mserp_exptransnumber)'),\n                    isGalleryVisible,\n                    false,\n                    isDirty,\n                    false\n                )\n            );\n            Navigate('Expense - Perdiem Details Screen', ScreenTransition.None, {locNavigatedFrom : \"Expense\"})\n\n        )\n    ),\n    Notify(\n        GlobalLabels.Labels.'15062:LocalizedName,msdyn_PerdiemFeatureDisabledWarningOnCreate',\n        NotificationType.Error,\n        gblParams.notificationTime\n    )\n)"
                  PressedBorderColor: =Self.Fill
                  PressedColor: =Self.Fill
                  PressedFill: =Self.Color
                  Text: |-
                    =If(
