                            Value(Parent.Height - Self.Y - 10 - ExpenseInfo_1.Height)    
                    )
                  Item: =varSelectedExpenseDoc
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  OnFailure: |-
                    =If(
                        CountRows(Split(Text(Self.Error), ":")) > 2,
                        Notify(
                            Mid(
                                Mid(
                                    EditExpenseForm.Error,
                                    Find(":", EditExpenseForm.Error) + 2
                                ),
                                Find(
                                    ":",
                                    Mid(
                                        EditExpenseForm.Error,
                                        Find(":", EditExpenseForm.Error) + 2
                                    )
                                ) + 2
                            ), 
                            NotificationType.Error, 
                            gblParams.notificationTime
                        ),
                        Notify(
                            Last(Split(Text(Self.Error), ":")).Value, 
                            NotificationType.Error, 
                            gblParams.notificationTime
                        )
                    );
                    UpdateContext({msCallStartedForSalestaxCalculation: false});
                  OnSuccess: "=// [신규 추가] 폼 제출 완료 직후의 생성 상태를 보존 (중간에 varIsCreate가 false로 바뀌는 버그 방지)\nUpdateContext({locWasCreate: varIsCreate});\n\n// 1. 새로 생성된 경비 번호(ExpTransNumber) 확보\nSet(\n    varTargetExpTransNumber,\n    Self.LastSubmit.'Expense transaction number (mserp_exptransnumber)'\n);\n\n// 2. RecId 확보\nUpdateContext({varSubmittedExpRecId: Self.LastSubmit.ExpenseRecId});\n\n// [수정됨] F&O 엔터티에 대한 무거운 Refresh() 호출 제거\nIf(\n    IsBlank(varSubmittedExpRecId) || varSubmittedExpRecId = 0,\n    UpdateContext({\n        varSubmittedExpRecId: LookUp(\n            'DCSL Expense Line Expense Moblie Entity (mserp)', \n            'Expense transaction number (mserp_exptransnumber)' = varTargetExpTransNumber\n        ).ExpenseRecId\n    })\n);\n\n// 3. 진행 표시 시작\nUpdateContext({varLoadingSpinner: true});\n\n// 4. 첨부 파일 업로드 처리\nIf(\n    !IsEmpty(colPendingReceipts) && !IsBlank(varTargetExpTransNumber),\n    \n    // [4-1] JSON 페이로드 생성\n    UpdateContext({\n        locNewJsonPayload: JSON(\n            ForAll(\n                colPendingReceipts,\n                {\n                    FileName: Coalesce(mserp_filename, \"Receipt\"),\n                    FileExtension: Coalesce(mserp_fileextension, \"jpg\"), \n                    \n                    FileContent: With(\n                        {\n                            varBase64String: Substitute(JSON(mserp_captureddocument, JSONFormat.IncludeBinaryData), \"\"\"\", \"\")\n                        },\n                        If(\n                            Find(\"base64,\", varBase64String) > 0,\n                            Mid(varBase64String, Find(\"base64,\", varBase64String) + 7),\n                            varBase64String\n                        )\n                    )\n                }\n            ), \n            JSONFormat.IgnoreUnsupportedTypes\n        )\n    });\n    \n    // [4-2] D365 Action 호출 (업로드만 실행)\n    UpdateContext({\n        locNewReturnedIds: 'DCSL Apps Action Entity (mserp)'.mserp_uploadmultipleattachment({\n            _jsonPayload: locNewJsonPayload\n        })\n    });\n    \n    // [4-3] 반환된 ID가 있을 경우 D365 트랜잭션 커밋을 기다리기 위해 타이머 시작\n    If(\n        !IsBlank(locNewReturnedIds),\n        UpdateContext({ varStartAttachTimer: true }), // 타이머 시작\n        \n        // 업로드 자체가 실패한 경우 에러 알림 및 스피너 닫기\n        UpdateContext({varLoadingSpinner: false});\n        Notify(\"Uploading the attachment failed. Please try again.\", NotificationType.Error, 5000)\n    )\n);\n\n// \U0001F4A1 [핵심 수정 분기점]\n// 케이스 A: 처리할 첨부 파일이 없다면 곧바로 공통 마무리 로직 버튼(btn_ExecutePostSubmit)을 호출하여 화면을 이동시킵니다.\n// 케이스 B: 첨부 파일이 있다면 여기서 식을 끝내고, 화면 이동 없이 타이머(tmrAttachReceiptDelay)가 끝나기를 차분히 기다립니다.\nIf(\n    IsEmpty(colPendingReceipts),\n    Select(btn_ExecutePostSubmit)\n)"
                  SnapToColumns: =false
                  Width: =Parent.Width
                  Y: =scr03_img_NoReceiptOuter_1.Y + scr03_img_NoReceiptOuter_1.Height + 30
