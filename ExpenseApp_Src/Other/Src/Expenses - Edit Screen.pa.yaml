                        DataField: ="mserp_deexcostcenter"
                        Default: =varSelectedExpenseDoc.CostCenter
                        DisplayName: ="Budget"
                        Required: "=If(\n    // Salary Advance (가불/급여 선지급) 유형이면 Cost Center 숨김\n    varAppMode = \"SalaryAdvance\" || varAppMode = \"AirfareAllowance\" || varAppMode = \"EmployeeBenefit\",\n    false,\n    \n    // 그 외의 경우는 정상 표시 (이후 필요에 따라 Visible 조건을 더 추가할 수 있습니다)\n    true\n)"
                        Update: =ComboBox_CostCenter.Selected.'Dimension value'
                        Visible: "=If(\n    // Salary Advance (가불/급여 선지급) 유형이면 Cost Center 숨김\n    varAppMode = \"SalaryAdvance\" || varAppMode = \"AirfareAllowance\" || varAppMode = \"EmployeeBenefit\",\n    false,\n    \n    // 그 외의 경우는 정상 표시 (이후 필요에 따라 Visible 조건을 더 추가할 수 있습니다)\n    true\n)"
                        Width: =Parent.Width
                        X: =0
                        Y: =costCenterFieldOrder_Y
                      Children:
                        - CostCenter_DataCardKey:
                            Control: Label@2.5.1
                            Properties:
                              AutoHeight: =true
                              BorderColor: =RGBA(0, 0, 0, 1)
                              Color: =gblParams.dropDownLabelColor
                              Font: =Font.'Segoe UI'
                              Height: =48
                              Text: =Parent.DisplayName
                              Width: =Parent.Width - 60
                              Wrap: =false
                              X: =30
                              Y: =10
                        - ComboBox_CostCenter:
                            Control: Classic/ComboBox@2.4.0
                            Properties:
                              AccessibleLabel: =Concatenate("Select ", Parent.DisplayName)
                              BorderColor: |-
                                =If(
                                    !IsBlank(Parent.Error), 
                                    Color.Red,  // 조건 1: 저장 시도 후 시스템/유효성 검사 에러가 발생한 경우

                                    Parent.Visible && Parent.Required && IsBlank(Parent.Update), 
                                    Color.Red,  // 조건 2: 화면에 보이고 필수 항목인데 아직 값을 입력하지 않은 경우

                                    RGBA(166, 166, 166, 1) // 기본값: 위 두 조건에 모두 해당하지 않는 경우 (정상 상태)
                                )
                              BorderThickness: |-
                                =If(
                                    !IsBlank(Parent.Error) || (Parent.Visible && Parent.Required && IsBlank(Parent.Update)), 
                                    2,  // 에러가 있거나( || ) 필수 항목이 비어있으면 두께를 2로 설정
                                    0   // 정상 상태에서는 두께를 1로 설정
                                )
                              ChevronBackground: =RGBA(56, 96, 178, 1)
                              ChevronFill: =RGBA(255, 255, 255, 1)
                              ChevronHoverBackground: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                              ChevronHoverFill: =RGBA(255, 255, 255, 1)
                              DefaultSelectedItems: "=If(\n    // [1순위] 신규 생성 모드이면서, 복사된 원본 데이터(Copy)가 존재하는 경우\n    varIsCreate && !IsBlank(varSelectedExpenseDoc.'Expense transaction number (mserp_exptransnumber)'),\n    \n    // 원본 문서의 CostCenter 텍스트 값을 이용하여 마스터 데이터에서 정확한 레코드를 찾아 반환합니다.\n    LookUp(\n        'DCSL HPRCostShareApproval Entity (mserp)', \n        'Dimension value' = varSelectedExpenseDoc.CostCenter // ※ 실제 필드명 확인 필요\n    ),\n    \n    // [2순위] 복사 모드가 아닌 일반 신규 작성(New)이거나 수정(Edit) 모드인 경우 (기존 로직 유지)\n    Switch(\n        varAppMode,\n        \n        // 1. Employee Benefits Claim\n        \"EmployeeBenefit\",\n        LookUp('DCSL HPRCostShareApproval Entity (mserp)', 'Dimension value' = \"6104\"),\n        \n        // 2. Airfare & Shipping Allowance Claim\n        \"AirfareAllowance\",\n        If(\n            !IsBlank(varSelectedCostCenter),\n            varSelectedCostCenter,\n            Blank()\n        ),\n        \n        // 3. 기본값 (일반적인 경우)\n        If(\n            !IsBlank(varSelectedCostCenter),\n            varSelectedCostCenter,\n            Blank()\n        )\n    )\n)"
                              DisplayFields: =["mserp_dimensionvaluefir","mserp_description"]
                              DisplayMode: =Parent.DisplayMode
                              FocusedBorderThickness: =2
                              Font: =Font.'Open Sans'
                              Height: =gblParams.dropDownHeight
                              HoverFill: =gblParams.dropDownHoverFill
                              InputTextPlaceholder: ="Select Budget"
                              Items: |-
                                =SortByColumns(
                                    'DCSL HPRCostShareApproval Entity (mserp)',
                                    "mserp_dimensionvaluefir",
                                    SortOrder.Ascending
                                )
                              NoSelectionText: ="Select Budget"
                              OnChange: |-
                                =UpdateContext(
                                    {
                                        varSelectedCostCenter: ComboBox_CostCenter.Selected,
                                        isDirty: true
                                    }
                                )
                              PaddingBottom: =5
                              PaddingLeft: =5
                              PaddingRight: =5
                              PaddingTop: =5
                              PressedColor: =RGBA(255, 255, 255, 1)
                              PressedFill: =RGBA(0, 18, 107, 1)
                              SearchFields: =["mserp_dimensionvaluefir"]
                              SelectMultiple: =false
                              SelectionColor: =Color.Black
