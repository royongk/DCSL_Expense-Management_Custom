                              NoSelectionText: "=GlobalLabels.Labels.'15062:LocalizedName,msdyn_EnterExpenseCategoryLabel' "
                              OnChange: "=UpdateContext({varOnChangeTriggered : true});\n// Extract key values from custom record structure\nReset(VehicleTypeCombobox);\nUpdateContext({varDefaultVehicleType : \"\"});\nUpdateContext({msCallStartedForSalestaxCalculation : true});\nIf(\n    varOnChangeTriggered && varOnSelectTriggered,\n    UpdateContext({varOnShowFields : true})\n);\nUpdateContext({ \n    varSelectedCategoryRecord: LookUp(colExpenseCategories, 'Expense category' = ComboBox1_8.Selected.'Expense category') \n});\nIf(\n    varOnShowFields && \n    !IsBlank(ComboBox1_8.Selected) &&\n    !IsBlank(varSelectedCategoryRecord) &&\n    !IsBlank(varSelectedCategoryRecord.'Expense category'),\n    UpdateContext(\n        {\n            locItemizeButtonVisibilityFlag : \n            'Expense mobile master data (mserp)'.mserp_trvexpmobilemasterdataentity_isexpenseitemizable(LookUp('Expense mobile master data (mserp)',Email = User().Email).'Expense mobile master data (mserp)', \n            {\n                CostType: varSelectedCategoryRecord.'Expense category',\n                SplitLineType:\"Default\",\n                LineType: If(!IsBlank(ComboBox1_8.Selected) && ComboBox1_8.Selected.'Itemization mandatory' = 'NoYes (mserp)'.Yes,\"ItemizedHeader\",\"Default\")\n            }\n            ).return\n        }\n    ),\n    // Fallback: curCategory 사용 또는 false\n    UpdateContext({\n        locItemizeButtonVisibilityFlag: If(\n            !IsBlank(curCategory) && curCategory <> \"\",\n            IfError(\n                'Expense mobile master data (mserp)'.mserp_trvexpmobilemasterdataentity_isexpenseitemizable(\n                    LookUp('Expense mobile master data (mserp)',Email = User().Email).'Expense mobile master data (mserp)', \n                    {\n                        CostType: curCategory,\n                        SplitLineType:\"Default\",\n                        LineType: \"Default\"\n                    }\n                ).return,\n                false\n            ),\n            false\n        )\n    })\n    );\nIf(\n    IsBlank(Self.Selected),\n    Reset(DataCardValue16_1); //remove payment method\n    If( \n        gblIsProjectValidationFlag,\n        Reset(ProjectICheckbox_ES),  //remove project\n        Reset(ProjectCheckbox_Entity)\n    ); \n    Reset(DataCardValue9_1); //remove line status\n    Reset(ComboBox1_14); //remove activity\n    Reset(ComboBox1_15); //sales tax\n    Reset(ComboBox1_16); //item sales tax\n    UpdateContext({varDefaultProjLineStatus: Blank()}); // Reset Billable\n    UpdateContext({varSalesTaxAmount:0});\n    Reset(DataCardValue25_1); //actual sales tax\n    //Clear(collectionActivities),\n    If(\n        !IsBlank(ComboBox1_8.Selected) && ComboBox1_8.Selected.'Use in Project' = 'NoYes (mserp)'.No,\n        If( \n            gblIsProjectValidationFlag,\n            Reset(ProjectICheckbox_ES),  //remove project\n            Reset(ProjectCheckbox_Entity)\n        );\n        Reset(DataCardValue9_1); //reset line status id\n        Reset(ComboBox1_14); //remove activity\n        //Clear(collectionActivities)\n    );\n    \n    \n);\n\nIf(\n    !IsBlank(ComboBox1_8.Selected) && ComboBox1_8.Selected.'Expense category' <> curCategory,\n    If( \n        gblIsProjectValidationFlag,\n        Clear(colGetProjectsBasedOnResourceCategory);\n        /*\n        UpdateContext({\n            varGetProjectsBasedOnResourceCategory :\n            'Projects (mserp)'.mserp_trvexpmobileprojentity_getprojectsbasedonresourcecategory(LookUp('Expense mobile master data (mserp)',Email = User().Email).'Expense mobile master data (mserp)',\n            {\n                employeeLegalEntity: varSelectedLegalEntity,\n                interCompanyLegalEntity: Coalesce(DataCardValue39_1.Selected.Value, varSelectedExpenseDoc.'Legal entity'),\n                categoryId:If(IsBlank(If(Upper(varSelectedLegalEntity) <> Upper(Coalesce(DataCardValue39_1.Selected.Value, varSelectedExpenseDoc.'Legal entity')),