                                =UpdateContext({isDirty : true})
                              Placeholder: ="12"
                              ValidationState: |-
                                =If(
                                    Value(drpFromDateHours_1.Value) < 0 || Value(drpFromDateHours_1.Value) > 12,
                                    "Error",
                                    "None"
                                )
                              Value: |-
                                =If(
                                    Self.Visible,
                                    If(
                                        //if true, then 12 hour time format else 24 hour
                                        Last(Split(varSelectedExpenseDoc.'Per diem from date', " ")) in dsTimePeriods,
                                        //parse for 12 hour time 
                                        First(Split(First(LastN(Split(varSelectedExpenseDoc.'Per diem from date', " "), 2)).Value, ":")).Value,
                                        // parse for 24 hour time
                                        If(
                                            Mod(Value(First(Split(Last(Split(varSelectedExpenseDoc.'Per diem from date', " ")).Value, ":")).Value), 12) = 0,
                                            "12",
                                            Text(Mod(Value(First(Split(Last(Split(varSelectedExpenseDoc.'Per diem from date', " ")).Value, ":")).Value), 12))
                                        )
                                    ),
                                    "00"
                                )
