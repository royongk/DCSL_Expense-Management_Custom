Screens:
  Expenses - Edit Screen_1:
    Properties:
      Fill: =RGBA(248, 248, 248, 1)
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: "=UpdateContext({varStateSelected: Blank()});\nUpdateContext({varZipCodeSelectedRecId: -1 });\nUpdateContext({varProjectHierarchyId: Blank()});\nUpdateContext({onReloadButtonClick: false});\nUpdateContext({curCategory: ComboBox1_13.Selected.'Expense category'});\nUpdateContext({curIntercompanyLE: Coalesce(DataCardValue39_8.Selected.Value, varSelectedExpenseDoc.'Legal entity')});\nUpdateContext({curInterCompanyProjectCategory: varSelectedExpenseDoc.'Intercompany project category'});\nUpdateContext({curProjIdSelected: Coalesce(Text(varSelectedExpenseDoc.'Project ID'), \"\")});\nUpdateContext({curCountrySelected: varSelectedExpenseDoc.'Country/region (mserp_countryregion)'});\nUpdateContext({curStateSelected: varSelectedExpenseDoc.'State/province'});\nUpdateContext({curBillIssuedToSelected: varSelectedExpenseDoc.'Hotel bill issued to'});\nUpdateContext({taxModifiedByUser: false});\nUpdateContext({varLoadingSpinner : true});\n// varRemainingAmount는 Navigate 파라미터로 전달됨\n// 파라미터가 없을 경우 기본값 0 사용\nUpdateContext({varRemainingAmount: Coalesce(varRemainingAmount, 0)});\nIf(\n    !varIsCreate && !IsBlank(varSelectedExpenseDoc.'Expense category (mserp_costtype)'),\n    UpdateContext(\n        {\n            locItemizeButtonVisibilityFlag : 'Expense mobile master data (mserp)'.mserp_trvexpmobilemasterdataentity_isexpenseitemizable(LookUp('Expense mobile master data (mserp)',Email = User().Email).'Expense mobile master data (mserp)', \n            {\n                CostType: varSelectedExpenseDoc.'Expense category (mserp_costtype)',\n                SplitLineType:\"Default\",\n                LineType: If(varSelectedExpenseDoc.'Expense line type' = 'Expense line type (mserp)'.'Itemized header',\"ItemizedHeader\",\"Default\")\n            }).return\n\n        }\n    )\n);\nIf(\n    !varIsCreate && gblIsProjectValidationFlag,\n    Clear(colGetProjectsBasedOnResourceCategory);\n    UpdateContext({\n        varGetProjectsBasedOnResourceCategory:\n            IfError(\n                'Projects (mserp)'.mserp_trvexpmobileprojentity_getprojectsbasedonresourcecategoryv2(\n                    LookUp('Expense mobile master data (mserp)', Email = User().Email).'Expense mobile master data (mserp)',\n                    {\n                        employeeLegalEntity: varSelectedLegalEntity,\n                        interCompanyLegalEntity: varSelectedExpenseDoc.'Legal entity',\n                        categoryId:\n                            If(\n                                IsBlank(\n                                    If(\n                                        Upper(varSelectedLegalEntity) <> Upper(curIntercompanyLE),\n                                        varSelectedExpenseDoc.'Intercompany project category',\n                                        varSelectedExpenseDoc.'Expense category (mserp_costtype)'\n                                    )\n                                ),\n                                \"\",\n                                If(\n                                    Upper(varSelectedLegalEntity) <> Upper(curIntercompanyLE),\n                                    varSelectedExpenseDoc.'Intercompany project category',\n                                    varSelectedExpenseDoc.'Expense category (mserp_costtype)'\n                                )\n                            )\n                    }\n                ).return,\n                Blank()\n            )\n    });\n    If(\n        !IsBlank(varGetProjectsBasedOnResourceCategory),\n        Clear(colGetProjectsBasedOnResourceCategory);\n        Collect(\n            colGetProjectsBasedOnResourceCategory,\n            ForAll(\n                MatchAll(\n                    varGetProjectsBasedOnResourceCategory,\n                    \"\\{\"\"projId\"\":\"\"(?<projId>[^\"\"]*)\"\",\"\"projName\"\":\"\"(?<projName>[^\"\"]*)\"\"\\}\"\n                ) As ProjectListFromCol,\n                {\n                    projectId: Text(ProjectListFromCol.SubMatches.projId),\n                    projectName: Text(ProjectListFromCol.SubMatches.projName)\n                }\n            )\n        )\n    );\n    If(\n        !IsBlank(curProjIdSelected),\n        UpdateContext({\n            varProjectHierarchyId:\n                IfError(\n                    'Projects (mserp)'.mserp_trvexpmobileprojentity_getprojecthierarchyid(\n                        userRecord.'Expense mobile master data (mserp)',\n                        {\n                            interCompanyLegalEntity: curIntercompanyLE,\n                            projId: curProjIdSelected\n                        }\n                    ).return,\n                    Blank()\n                )\n        })\n    );\n);\nUpdateContext({locItemizationCheck : locItemizeButtonVisibilityFlag});\nUpdateContext(\n    {\n        timerCostType: false,\n        timerProj: false,\n        timerHBIT: false,\n        timerCountry: false,\n        timerState: false,\n        locAllowNavigationBack: true\n    }\n);\n// populate the current expense type of the selected document\nUpdateContext(\n    {\n        currExpenseType: Coalesce(\n            varSelectedExpenseDoc.'Expense type',\n            LookUp(\n                'Expense category (mserp)',\n                'Expense category' = curCategory,\n                'Expense type'\n            )\n        )\n    }\n);\nIf(\n    !varIsCreate,\n    UpdateContext({msCallStartedForSalestaxCalculation: true});\n    UpdateContext({varOnShowFields: false});\n    UpdateContext({varOnSelectTriggered: false});\n    UpdateContext({varOnChangeTriggered: false});\n    \n);\nUpdateContext(\n    {\n        featureEnabled: If(\n            userRecord.IsReimaginedUIEnabled = 'NoYes (mserp)'.Yes,\n            \"True\",\n            \"False\"\n        ),\n        perdiemFeatureEnabled: If(\n            userRecord.IsReImaginedPerDiemEnabled = 'NoYes (mserp)'.Yes,  //this needs to be changed to the perdiem feature enabled\n            \"True\",\n            \"False\"\n        )\n    }\n);\n//Check if the itemization is over or under distributed\nIf(\n    !varIsCreate,\n    If(\n        varRemainingAmount < 0,\n        Notify(\n            GlobalLabels.Labels.'15062:LocalizedName,msdyn_ThisExpenseIsOverItemizedLabel',\n            NotificationType.Error,\n            gblParams.notificationTime\n        ),\n        varRemainingAmount > 0,\n        Notify(GlobalLabels.Labels.'15062:LocalizedName,msdyn_ThisExpenseIsNotCompletelyItemizedLabel',\n            NotificationType.Warning,\n            gblParams.notificationTime\n        )\n    )\n);\nIf(\n    currExpenseType = 'TrvExpType (mserp)'.'Per diem' && (featureEnabled = \"False\" || perdiemFeatureEnabled = \"False\"),\n    Notify(\n        GlobalLabels.Labels.'15062:LocalizedName,msdyn_PerdiemFeatureDisabledWarning',\n        //\"Enable both re-imagined features to be able to edit this expense\",\n        NotificationType.Warning,\n        gblParams.notificationTime\n    )\n);\n//if labelTableLookUp not empty\nIf(\n    CountRows(labelTableLookUp) <= 0,\n    Collect(\n        labelTableLookUp,\n        {\n            fieldName: \"CostType\",\n            labelName: \"Expense category\",\n            localisedLabelName: GlobalLabels.Labels.'15062:LocalizedName,msdyn_ExpenseCategoryLabel',\n            visible: true,\n            required: true\n        },\n        {\n            fieldName: \"TransDate\",\n            labelName: \"Transaction date\",\n            localisedLabelName: GlobalLabels.Labels.'15062:LocalizedName,msdyn_TransactionDateLabel',\n            visible: true,\n            required: true\n        },\n        {\n            fieldName: \"AmountCurr\",\n            labelName: \"Transaction amount\",\n            localisedLabelName: GlobalLabels.Labels.'15062:LocalizedName,msdyn_TransactionAmountLabel',\n            visible: true,\n            required: true\n        },\n        {\n            fieldName: \"ExchangeCode\",\n            labelName: \"Currency\",\n            localisedLabelName: GlobalLabels.Labels.'15062:LocalizedName,msdyn_CurrencyLabel',\n            visible: true,\n            required: true\n        },\n        {\n            fieldName: \"PayMethod\",\n            labelName: \"Payment method\",\n            localisedLabelName: GlobalLabels.Labels.'15062:LocalizedName,msdyn_PaymentMethodLabel',\n            visible: true,\n            required: true\n        },\n        {\n            fieldName: \"SubmitterJustification\",\n            labelName: \"Employee justification\",\n            localisedLabelName: GlobalLabels.Labels.'15062:LocalizedName,msdyn_EmployeeJustificationLabel',\n            visible: false,\n            required: false\n        }\n    );\n    ForAll(\n        Filter(\n            '@ExpenseManagement:ExpenseMobileFieldVisibilityEntity (mserp)',\n            LegalEntityId = varSelectedLegalEntity\n        ) As VisibilityTable,\n        Collect(\n            labelTableLookUp,\n            {\n                fieldName: VisibilityTable.FieldName,\n                labelName: VisibilityTable.Labels,\n                localisedLabelName: VisibilityTable.LocalisedLabelName\n            }\n        )\n    );\n    If(\n        featureEnabled = \"True\",\n        ForAll(\n            Filter(\n                '@ExpenseManagement:ExpenseMobileFieldVisibilityEntity (mserp)',\n                LegalEntityId = varSelectedLegalEntity\n            ) As VisibilityTable,\n            Patch(\n                labelTableLookUp,\n                LookUp(\n                    labelTableLookUp,\n                    fieldName = VisibilityTable.FieldName\n                ),\n                {\n                    visible: VisibilityTable.VisibilityType <> 'ExpenseFieldVisibilityType (mserp)'.'Do not display',\n                    required: VisibilityTable.VisibilityType = 'ExpenseFieldVisibilityType (mserp)'.Required\n                }\n            )\n        ),\n        ForAll(\n            Filter(\n                'Display fields (mserp)',\n                'Company Code' = varSelectedLegalEntity\n            ) As VisibilityTable,\n            Patch(\n                labelTableLookUp,\n                LookUp(\n                    labelTableLookUp,\n                    fieldName = VisibilityTable.FieldName\n                ),\n                {\n                    visible: VisibilityTable.Visibility <> 'Visibility (mserp)'.'Do not display',\n                    required: false\n                }\n            )\n        )\n    )\n);\nUpdateContext({varLoadingSpinner : false});\nSet(\n    varDefaultSalesTaxGroup,\n    varSelectedExpenseDoc.'Sales tax group'\n);\nSet(\n    varItemSalesTaxDefaultValue,\n    varSelectedExpenseDoc.'Item sales tax group'\n);\nUpdateContext(\n    {\n        varSalesTaxAmount: Coalesce(\n            varSalesTaxAmount,\n            varSelectedExpenseDoc.'Actual sales tax amount'\n        )\n    }\n);\nUpdateContext({msCallStartedForSalestaxCalculation: false});\nSet(\n    IsreceiptALreadyCreated,\n    false\n);\nSet(\n    isProjIdCalledFromAttach,\n    false\n);\nSet(\n    gblParams,\n    {\n        dropDownHeight: 60,\n        dorpDownBorderThickness: 2,\n        dropDownBorderColor: RGBA(\n            34,\n            102,\n            227,\n            1\n        ),\n        dropDownLabelColor: Color.Black,\n        dropDownHoverFill: RGBA(\n            204,\n            222,\n            255,\n            1\n        ),\n        errorMessageSize: 18,\n        dropDownFontSize: 24,\n        expenseDataCardViewOnly: RGBA(\n            110,\n            110,\n            110,\n            1\n        ),\n        notificationTime: 4000\n    }\n);\n//varibale determines whether any fields were changed\nUpdateContext({isDirty: false});\n\nUpdateContext({categoryModified: false});\nUpdateContext({varDefaultItemSalesTaxError: Blank()});\nUpdateContext({varDefaultSalesTaxError: Blank()});\nUpdateContext({leModified: false});\nUpdateContext({varRatePerMile: Blank()});\nUpdateContext({varMileageTotal: Blank()});\nUpdateContext(\n    {\n        locPerdiemAmountCurr: If(\n            currExpenseType = 'TrvExpType (mserp)'.'Per diem',\n            Text(varSelectedExpenseDoc.'Transaction amount'),\n            Blank()\n        )\n    }\n);\nUpdateContext(\n    {\n        varCurrentSelectedDate: If(\n            varIsCreate,\n            If(\n                IsBlank(OCRresponse),\n                Today(),\n                OCRresponse.transDate\n            ),\n            varSelectedExpenseDoc.'Transaction date'\n        )\n    }\n);\nSet(\n    varDefaultSalesTaxGroup,\n    varSelectedExpenseDoc.'Sales tax group'\n);\nSet(\n    varItemSalesTaxDefaultValue,\n    varSelectedExpenseDoc.'Item sales tax group'\n);\nUpdateContext(\n    {\n        varSalesTaxAmount: Coalesce(\n            varSalesTaxAmount,\n            varSelectedExpenseDoc.'Actual sales tax amount'\n        )\n    }\n);\nSet(\n    varCurMileage,\n    varSelectedExpenseDoc.Mileage\n);\n\nUpdateContext({varCurVehicleType: varSelectedExpenseDoc.'Vehicle type'});\nUpdateContext({varCurNoOfPass: varSelectedExpenseDoc.'Number of passengers'});\nUpdateContext({varDefaultProjLineStatus: varSelectedExpenseDoc.Billable});\nUpdateContext({varZipCodeChanged: false});\nUpdateContext({varCityChanged: false});\nUpdateContext({varStateChanged: false});\nUpdateContext({varCountryChanged: false});\nUpdateContext({varProjectChanged: false});\n"
    Children:
      - scr03_ico_Back_11:
          Control: Classic/Icon@2.5.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =icongconfig_backbutton.Color
            Fill: =icongconfig_backbutton.Fill
            Height: =icongconfig_backbutton.Height
            Icon: =Icon.ChevronLeft
            OnSelect: |-
              =
              Switch(
                  varNavigatedFrom,
                  "scr17",
                  Navigate('Reports - Edit Screen'),
                  "scr20",
                  Navigate('Reports - View Only Screen'),
                  "scr18",
                  Navigate('Reports - Attach Expenses Screen'),
                  "scr19",
                  Navigate('Reports - View Attached Expenses Screen'),
                  Blank(),
                  Navigate('Expenses - List Screen')
              );
              UpdateContext({
                  varNavigatedFrom:
                  Blank()
              });
              UpdateContext(
                  {
                      dirtyTransAmount : Blank(),
                      dirtyTransDate : Blank(),
                      dirtyMerchant : Blank(),    
                      varOnSelectTriggered: false,
                      varOnShowFields:false,
                      varOnChangeTriggered:false,
                      varSalesTaxAmount: Blank()
                  }
              );
            Visible: =false
            Width: =icongconfig_backbutton.Width
            X: =303
            Y: =19
      - scr03_ico_Back_10:
          Control: Classic/Icon@2.5.0
          Properties:
            AccessibleLabel: ="Press to go back"
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =icongconfig_backbutton.Color
            Fill: =icongconfig_backbutton.Fill
            Height: =icongconfig_backbutton.Height
            Icon: =Icon.ChevronLeft
            OnSelect: "=If(\n    varExpenseButtonClicked,\n    UpdateContext({varCntSelect: false});\n    Navigate('Expenses - List Screen'),\n    If(\n        varIsCreate || isDirty,\n        UpdateContext({ctVarExpenseDetailsBack: true}),\n        Select(scr03_ico_Back_11)\n    );\n    \n);\nUpdateContext({dirtyTransAmount: Blank()});\nUpdateContext({varSalesTaxAmount: Blank()});\nSet(\n    gblNavigationDrawerVisibility,\n    false\n);"
            TabIndex: =0
            Width: =icongconfig_backbutton.Width
            X: =22.5
            Y: =(scr03_hdr_TopHeader_6.Height-Self.Height)/2
      - scr03_img_NoReceiptOuter_6:
          Control: Image@2.2.3
          Properties:
            BorderColor: =RGBA(255, 0, 37, 0.2)
            BorderStyle: =BorderStyle.Dashed
            Fill: =RGBA(255, 255, 255, 1)
            Height: =Parent.Height / 4
            Image: |-
              =If(
                  varFileFormat in ["jpg", "bmp", "jpeg", "png", "heic", "tif", "tiff", "raw"] && !IsBlank(varReceiptImage),
                  varReceiptImage,
                  varFileFormat in ["xlsx", "xls"],
                  IconExcel,
                  varFileFormat in ["docx", "doc"],
                  IconWord,
                  varFileFormat = "pdf",
                  IconPDF,
                  varFileFormat = "txt",
                  IconTxt,
                  IconMail
              )
            ImagePosition: |-
              =If(
                  varFileFormat in ["jpg", "bmp", "jpeg", "png", "heic", "tif", "tiff", "raw"] && !IsBlank(varReceiptImage),
                  ImagePosition.Stretch,
                  ImagePosition.Center
              )
            RadiusBottomLeft: =18
            RadiusBottomRight: =18
            RadiusTopLeft: =18
            RadiusTopRight: =18
            Visible: =!IsBlank(varReceiptImage)
            Width: |
              =Parent.Width -  Self.X*2
            X: =24
            Y: |-
              =If(
                  scr03_lbl_PolicyViolationWarning_6.Visible,
                  scr03_lbl_PolicyViolationWarning_6.Y + scr03_lbl_PolicyViolationWarning_6.Height + 27,
                  scr03_lbl_ValidationWarning_6.Y + scr03_lbl_ValidationWarning_6.Height + 27
              )
      - scr03_img_NoReceiptInner_6:
          Control: Image@2.2.3
          Properties:
            BorderColor: =RGBA(166, 166, 166, 1)
            BorderStyle: =BorderStyle.Dashed
            BorderThickness: =5
            Fill: =RGBA(255, 255, 255, 1)
            Height: =Parent.Height/5
            Image: =ImgWhite
            ImagePosition: =ImagePosition.Fill
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Visible: '=IsBlank(varReceiptImage) '
            Width: |
              =Parent.Width -  Self.X*2
            X: =44
            Y: =scr03_img_NoReceiptOuter_6.Y +(scr03_img_NoReceiptOuter_6.Height-scr03_img_NoReceiptInner_6.Height)/2
      - scr03_lbl_AddReceipt_6:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(34, 102, 227, 1)
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Semibold
            Height: =Parent.Height / 4
            OnSelect: |-
              =Navigate('Expenses - Capture Receipt Screen', ScreenTransition.None);
              UpdateContext(
                  {
                      varOnSelectTriggered: false,
                      varOnShowFields:false,
                      varOnChangeTriggered:false
                  }
              )
            TabIndex: =0
            Text: =GlobalLabels.Labels.'15062:LocalizedName,msdyn_AddReceiptLabel'
            Visible: '=IsBlank(varReceiptImage) '
            Width: |
              =Parent.Width -  Self.X*2
            X: =26
            Y: =scr03_img_NoReceiptOuter_6.Y
      - scr03_lbl_ChangeReceipt_6:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =scr03_lbl_AddReceipt_6.Color
            Fill: =Color.White
            Font: =Font.'Open Sans'
            OnSelect: |-
              =Navigate('Expenses - View Receipt Screen', ScreenTransition.None, {varViewOnly : false});
              UpdateContext(
                  {
                      varOnSelectTriggered: false,
                      varOnShowFields:false,
                      varOnChangeTriggered:false
                  }
              )
            PaddingLeft: =35 + scr03_ico_ViewReceipt_6.Width
            Size: =17
            TabIndex: =0
            Text: =GlobalLabels.Labels.'15062:LocalizedName,msdyn_ViewReceiptLabel'
            Visible: =!(IsBlank(varReceiptImage))
            Width: =scr03_img_NoReceiptOuter_6.Width+1
            X: =scr03_img_NoReceiptOuter_6.X
            Y: =scr03_img_NoReceiptOuter_6.Y + (scr03_img_NoReceiptOuter_6.Height -Self.Height)+1
      - scr03_ico_ViewReceipt_6:
          Control: Image@2.2.3
          Properties:
            AccessibleLabel: ="View receipt"
            BorderColor: =RGBA(0, 18, 107, 1)
            Height: =33
            Image: =imageicon
            OnSelect: |-
              =Navigate('Expenses - View Receipt Screen', ScreenTransition.None, {varViewOnly : false});
              UpdateContext(
                  {
                      varOnSelectTriggered: false,
                      varOnShowFields:false,
                      varOnChangeTriggered:false
                  }
              )
            TabIndex: =0
            Visible: =!(IsBlank(varReceiptImage))
            Width: =18
            X: =scr03_lbl_ChangeReceipt_6.X + 25
            Y: =scr03_lbl_ChangeReceipt_6.Y + (scr03_lbl_ChangeReceipt_6.Height-scr03_ico_ViewReceipt_6.Height)/2
      - scr03_lbl_ValidationWarning_6:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(165, 33, 33, 1)
            Fill: =RGBA(249, 217, 217, 1)
            Font: =Font.'Segoe UI'
            Height: |-
              =If(
                  Self.Visible,
                  88,
                  0
              )
            Size: =15
            Text: |-
              =//If(ctVarIsRequiredFieldEmpty,GlobalLabels.Labels.ValidationMsgExpenseNeedMoreDetails)
              //not having receipt in expense is part of policy violation
            Visible: =//ctVarIsRequiredFieldEmpty //Or ((varSelectedExpenseDoc.receiptsAttached = "No" Or IsBlank(varSelectedExpenseDoc)) And IsBlank(varReceiptImage))
            Width: =Parent.Width
            Y: =scr03_hdr_TopHeader_6.Height
      - scr03_hdr_TopHeader_6:
          Control: CanvasComponent
          ComponentName: hdr02_Header
          Properties:
            Fill: =scr03_hdr_TopHeader_6.paramFill
            Height: =82
            Width: =Max(App.Width, App.MinScreenWidth)
            paramColor: =RGBA(0, 0, 0, 1)
            paramFill: =RGBA(255, 255, 255, 1)
            paramTitle: |-
              =If(
                  varIsCreate,
                  GlobalLabels.Labels.'15062:LocalizedName,msdyn_NewExpenseLabel',
                  GlobalLabels.Labels.'15062:LocalizedName,msdyn_EditExpenseLabel'
              )
      - scr03_lbl_PolicyViolationWarning_6:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: |-
              =/*If(
                  !IsBlank(varMaxViolationLevel),
                  If(
                      Value(varMaxViolationLevel) > 0 && Value(varMaxViolationLevel) <= 2,
                      RGBA(152, 111, 11, 1), //yellow
                      RGBA(217, 44, 44, 1)     //red
                  )
              )*/
            Fill: |-
              =If(
                  !IsBlank(varMaxViolationLevel),
                  If(
                      Value(varMaxViolationLevel) > 0 && Value(varMaxViolationLevel) <= 2,
                      RGBA(255, 242, 195, 1), //yellow  
                      RGBA(249, 217, 217, 1)   //red
                  )
              )
            Font: =Font.'Segoe UI'
            Height: |+
              =//If(ctVarIsRequiredFieldEmpty,GlobalLabels.Labels.ValidationMsgExpenseNeedMoreDetails,"Please add a receipt to this expense")
              If(
                  CountRows(colPolViolations) > 0,
                  88, 0
              )

            OnSelect: |-
              =Navigate('Expenses - Policy Violations Screen', ScreenTransition.None, {varCntExpenseTransactionNumber : varSelectedExpenseDoc.'Expense transaction number (mserp_exptransnumber)'})
            PaddingBottom: =18
            PaddingLeft: =54
            PaddingTop: =18
            Size: =15
            TabIndex: =0
            Text: |
              =Substitute(GlobalLabels.Labels.'15062:LocalizedName,msdyn_PolicyViolationExistsLabel', "$", Text(varNumViolation))
            Visible: =varNumViolation > 0
            Width: |
              =Parent.Width
            Y: =scr03_hdr_TopHeader_6.Height
      - Expense Entr Container_4:
          Control: GroupContainer@1.4.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: |-
              =If(
                  currExpenseType <> 'TrvExpType (mserp)'.Mileage,
                      Value('footerButtonsContainer - ExpenseEditScreen_1'.Y - Self.Y - 10),
                      Value(Parent.Height - Self.Y - 5 - ExpenseInfo_7.Height)
              )
            LayoutDirection: =LayoutDirection.Vertical
            LayoutOverflowY: =LayoutOverflow.Scroll
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: |
              =Parent.Width
            Y: =scr03_img_NoReceiptOuter_6.Y + scr03_img_NoReceiptOuter_6.Height + 30
          Children:
            - EditExpenseForm_1:
                Control: Form@2.4.4
                Variant: Classic
                Layout: Vertical
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  BorderColor: =RGBA(0, 18, 107, 1)
                  DataSource: ='Expense lines (mserp)'
                  DefaultMode: |-
                    =If(
                        varIsCreate,
                        FormMode.New,
                        If(
                            btnEditRefreshExpense_2.Visible && (featureEnabled = "False" || perdiemFeatureEnabled = "False"),
                            FormMode.View,
                            FormMode.Edit
                        )
                    )
                  Height: |-
                    =If(
                        currExpenseType <> 'TrvExpType (mserp)'.Mileage,
                            500,
                            Value(Parent.Height - Self.Y - 10 - ExpenseInfo_7.Height)    
                    )
                  Item: =varSelectedExpenseDoc
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  OnFailure: |-
                    =If(
                        CountRows(Split(Text(Self.Error), ":")) > 2,
                        Notify(
                            Mid(Mid(EditExpenseForm_1.Error, Find(":", EditExpenseForm_1.Error) + 2), Find(":", Mid(EditExpenseForm_1.Error, Find(":", EditExpenseForm_1.Error) + 2)) + 2), 
                            NotificationType.Error, 
                            gblParams.notificationTime
                        ),
                        Notify(
                            Last(Split(Text(Self.Error), ":")).Value, 
                            NotificationType.Error, 
                            gblParams.notificationTime
                        )
                    );
                    UpdateContext({msCallStartedForSalestaxCalculation: false});
                  OnSuccess: "=UpdateContext({varSubmittedExpTransNumber : EditExpenseForm_1.LastSubmit.'Expense transaction number (mserp_exptransnumber)'});\n//attach receipt if any\nUpdateContext({varAttachReceiptError : Blank()});\nIf(\n    IsBlank(varSelectedExpenseDoc),\n        If(\n            !IsBlank(varSubmittedExpTransNumber) && !IsBlank(varSelectedReceiptNumber),\n            IfError(\n                Patch(\n                    'Expense Mobile Unattached Document Entity (mserp)',\n                    LookUp('Expense Mobile Unattached Document Entity (mserp)', EntRecId = varSelectedReceiptNumber),\n                    {\n                        ExpTransNumber:varSubmittedExpTransNumber\n                    }\n                ),\n                UpdateContext({varAttachReceiptError : FirstError.Details})\n            );\n            If(\n                !IsBlank(varAttachReceiptError) && !(Text(varAttachReceiptError.HttpStatusCode) = NotFoundStatusCode),\n                Notify(\n                    Substitute(\n                        Substitute( Match(varAttachReceiptError.HttpResponse, \"\"\"message\"\":\"\"([^\"\"]*)\"\"\").FullMatch, \n                            \"\"\"message\"\":\", \n                            \"\"), \"\"\"\", \"\"),\n                    NotificationType.Error,\n                    gblParams.notificationTime\n                ),\n                Notify(\n                    GlobalLabels.Labels.'15062:LocalizedName,msdyn_ReceiptAttachedSuccessfullyLabel',\n                    NotificationType.Success,\n                    gblParams.notificationTime\n                )\n            )       \n        ),\n\n        If(\n            !IsBlank(varSelectedReceiptNumber) && \n            (IsBlank(varSelectedExpenseDoc.AttachedReceiptId) || Value(varSelectedExpenseDoc.AttachedReceiptId) <> varSelectedReceiptNumber),\n            IfError(\n                Patch(\n                    'Expense Mobile Unattached Document Entity (mserp)',\n     