                            Collect(
                                collSelectedExpenseIds, 
                                {transactionId : ThisItem.'Expense transaction number (mserp_exptransnumber)'}
                            ),
                            RemoveIf(collSelectedExpenseIds, transactionId = ThisItem.'Expense transaction number (mserp_exptransnumber)')
