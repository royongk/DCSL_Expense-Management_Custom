Screens:
  Expenses - List Screen:
    Properties:
      Fill: =RGBA(0 ,0, 0, 0)
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |-
        =// 1. 현재 선택된 메뉴(AppMode)에 맞는 D365 Expense Type 텍스트 결정
        Set(
            varTargetExpenseType,
            Switch(
                varAppMode,
                "AirfareAllowance", "Allowance",
                "BillingTripSettlement", "Billing Trip Settlement",
                "CashAdvance", "Cash Advance",
                "EmployeeBenefit", "Employee Benefit",
                "SalaryAdvance", "Salary Advance",
                "ExpenseReport", "Expense Reimbursement", // 일반 재무 경비일 경우의 기본값
                Blank()
            )
        );

        // 2. 해당 Type에 매핑된 카테고리(Expense category) 목록을 로컬 컬렉션에 저장
        ClearCollect(
            colMappedCategories,
            Filter(
                'DCSL Expense Category Mapping Setup Entity (mserp)',
                'Expense Type' = varTargetExpenseType
            )
        );

        Set(
            gblParams,
            {
                dropDownHeight : 60,
                dorpDownBorderThickness : 2,
                dropDownBorderColor : RGBA(34, 102, 227, 1),
                dropDownLabelColor : Color.Black,
                dropDownHoverFill : RGBA(204, 222, 255, 1),
                errorMessageSize : 18,
                dropDownFontSize : 24,
                expenseDataCardViewOnly: RGBA(110, 110, 110, 1),
                notificationTime : 4000
            }
        );

        UpdateContext({varOnShowFields : false});
        UpdateContext({varOnSelectTriggered : false});
        UpdateContext({varOnChangeTriggered : false});
        If(!varExpenseButtonClicked,
        UpdateContext({varCntSelect: false});
        Clear(collSelectedExpenseIds);
        );
        Set(varExpenseButtonClicked,false);
        Set(varDefaultSalesTaxGroup, Blank());
        Set(varItemSalesTaxDefaultValue,Blank());
        Set(
            varSelectedExpenseDoc,
            Blank()
        );

        Set(
            varSelectedTab,
            2
        );

        Set(
            varDefaultSalesTaxGroupUserContext,
            userRecord.WorkerDefaultTaxGroup
        );
        Refresh('Expense management parameters (mserp)');

        // --- [대리자 권한 목록 사전 조회 로직 추가] ---
        // 1. 접속한 사용자의 마스터 정보 세팅 (Edit Screen에서 사용하는 방식과 동일)
        Set(
            varCurrentD365User,
            LookUp('Expense mobile master data (mserp)', Email = User().Email)
        );

        // 2. 현재 활성화된 대리 위임 내역을 컬렉션으로 저장
        ClearCollect(
            colActiveDelegations,
            Filter(
                '@DEEX:DEEX_20316 (mserp)',
                Delegate = varCurrentD365User.ID && 
                'Start date' <= Today() &&
                'End date' >= Today()
            )
        );

        Reset(scr01_glr_ListExpense);
    Children:
      - emptyStateComponent_1:
          Control: CanvasComponent
          ComponentName: emptyStateComponent
          Properties:
            Height: |
              =350
            Visible: =!scr01_glr_ListExpense.Visible
            Width: =Self.Height
            X: |
              =(Parent.Width - Self.Width)/2
            Y: |
              =scr01_glr_ListExpense.Y + (Parent.Height - scr01_hdr_TopHeader.Height - scr01_cmp_Footer.Height - Self.Height)/2
            subTitle: =GlobalLabels.Labels.'15062:LocalizedName,msdyn_AddExpensesToStartReportsLabel'
            title: =GlobalLabels.Labels.'15062:LocalizedName,msdyn_NothingHereYetLabel'
      - scr01_shp_Rectangle:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =Color.White
            Height: =105
            Visible: =varCntSelect
            Width: =Parent.Width
            Y: =85
      - scr01_shp_Seprator_1:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =RGBA(225, 225, 225, 1)
            Height: =1
            Visible: =varCntSelect
            Width: =Parent.Width
            Y: =190
      - scr01_shp_BaseRectangle:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =RGBA(250, 249, 248, 1)
            Height: =156
            Visible: =varCntSelect
            Width: =Parent.Width
            Y: =Parent.Height-scr01_shp_BaseRectangle.Height
      - scr01_cmp_Footer:
          Control: CanvasComponent
          ComponentName: cmp_Footer_5
          Properties:
            ApprovalsAccessibleLabel: ="Text"
            ApprovalsText: |-
              =If(
                  varAppMode = "CashAdvance",
                  "1. Cash Request",
                  If(
                      varAppMode = "AirfareAllowance",
                      "Submit Reports",
                      GlobalLabels.Labels.'15062:LocalizedName,msdyn_ApprovalsLabel'
                  )
              )
            DisplayMode: =true
            ExpenseAccessibleLabel: ="Text"
            ExpensesText: |-
              =If(
                  varAppMode = "CashAdvance",
                  "2. Add Expenses",
                  "Add Expenses"
              )
            Fill: =RGBA(248, 248, 248, 0.94)
            Height: =If(App.Width >= 1024, 120, 84)
            OnApprovalsButtonClick: |-
              =If(
                  varAppMode = "CashAdvance",
                  Set(varSelectedTab, 4);
                  Navigate('Cash Advance - List Screen', ScreenTransition.Fade),
                  If(
                      varAppMode = "AirfareAllowance",
                      Set(varSelectedTab, 4);
                      Navigate('Travel - List Screen', ScreenTransition.Fade),
                      Set(varSelectedTab, 4); Navigate('Approvals - List Screen', ScreenTransition.Fade, {varFiltersApplied:false, varSelectedProjects:Blank(), varSelectedUsers: Blank(), varcntSelectedStatus:1});
                      Reset(scr25_cmb_Project);
                      Reset(scr25_cmb_User)
                  )
              )
            OnExpensesButtonClick: |-
              =If(
                  !IsBlank(varSelectedLegalEntity),
                  Set(
                      varSelectedTab,
                      2
                  );
                  Navigate(
                      'Expenses - List Screen',
                      ScreenTransition.Fade
                  ),
                  Notify(
                      GlobalLabels.Labels.'15062:LocalizedName,msdyn_WeCouldntFindEmploymentLabel',
                      NotificationType.Error,
                      gblParams.notificationTime
                  )
              )
            OnReceiptsButtonClick: ="Text"
            OnReportsButtonClick: |-
              =If(
                  !IsBlank(varSelectedLegalEntity),
                  Set(
                      varSelectedTab,
                      3
                  );
                  Navigate(
                      'Reports - List Screen',
                      ScreenTransition.Fade,
                      {varcntSelectedStatus: 1}
                  ),
                  Notify(
                      GlobalLabels.Labels.'15062:LocalizedName,msdyn_WeCouldntFindEmploymentLabel',
                      NotificationType.Error,
                      gblParams.notificationTime
                  )
              )
            ReceiptAccessibleLabel: =
            ReceiptText: ="Text"
            ReportAccessibleLabel: ="Text"
            ReportText: |-
              =If(
                  varAppMode = "AirfareAllowance",
                  "View Reports",
                  If(
                      varAppMode = "CashAdvance",
                      "3. Submit Reportst",
                      "Submit Reports"
                  )
              )
            SelectedTab: =2
            Visible: =!varCntSelect
            Width: =Max(App.Width, App.MinScreenWidth)
            Y: =App.Height - Self.Height
            paramInDefaultAppMode: =varAppMode
            paramInDefaultSelectedTab: =2
      - scr01_glr_ListExpense:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
          Properties:
            AccessibleLabel: ="List of draft expenses"
            BorderColor: =RGBA(0, 18, 107, 1)
            Default: ={}
            Height: "=If(\n    varCntSelect,\n    Min(Parent.Height - scr01_hdr_TopHeader.Height - scr01_shp_BaseRectangle.Height-scr01_shp_Rectangle.Height, Self.TemplateHeight * CountRows(Self.AllItems)),\n    Min(Parent.Height - scr01_hdr_TopHeader.Height - scr01_cmp_Footer.Height,Self.TemplateHeight * CountRows(Self.AllItems)) \n    \n)"
            Items: "=If(\n    // 1. 위임자 목록(colActiveDelegations)이 비어있는 경우: 'in' 구문을 제외하고 본인 데이터만 검색합니다.\n    IsEmpty(colActiveDelegations),\n    Filter(\n        SortByColumns('DCSL Expense Line Expense Moblie Entity (mserp)', \"mserp_transdate\", SortOrder.Descending),\n        'Company (mserp_company)' = varSelectedLegalEntity && \n        'Approval status' = 'Document status (mserp)'.Draft && \n        IsBlank('Expense report number (mserp_expnumber)') && \n        ('Expense line type' = 'Expense line type (mserp)'.Default \n        || 'Expense line type' = 'Expense line type (mserp)'.'Itemized header') &&\n        'Expense Type' = varTargetExpenseType &&\n        \n        // 본인의 ID만 확인\n        'Employee (mserp_creatingworker)' = userRecord.CreatingWorker\n    ),\n    \n    // 2. 위임자 목록이 존재하는 경우: 기존처럼 본인 ID와 위임자 목록을 함께 검색합니다.\n    Filter(\n        SortByColumns('DCSL Expense Line Expense Moblie Entity (mserp)', \"mserp_transdate\", SortOrder.Descending),\n        'Company (mserp_company)' = varSelectedLegalEntity && \n        'Approval status' = 'Document status (mserp)'.Draft && \n        IsBlank('Expense report number (mserp_expnumber)') && \n        ('Expense line type' = 'Expense line type (mserp)'.Default \n        || 'Expense line type' = 'Expense line type (mserp)'.'Itemized header') &&\n        'Expense Type' = varTargetExpenseType &&\n        \n        (\n            'Employee (mserp_creatingworker)' = userRecord.CreatingWorker ||\n            'Employee (mserp_creatingworker)' in colActiveDelegations.Employee\n        )\n    )\n)"
            OnSelect: |-
              =
              //set details for the next screen 
              Concurrent(
                  Set(
                      varIsCreate,
                      false
                  ),
                  Set(
                      varReceiptImage,
                      Blank()
                  ),
                  Set(
                      varChangeReceiptItemizedExpense,
                      false
                  )
              );

              Clear(colPendingReceipts);
              // assign the expense to a varSelectedExpenseDoc
              Set(
                  varSelectedExpenseDoc,
                  LookUp('DCSL Expense Line Expense Moblie Entity (mserp)','Expense transaction number (mserp_exptransnumber)' = ThisItem.'Expense transaction number (mserp_exptransnumber)')
              );

              // 1. [Attached Entity] 조회 (이미 완전히 연결된 파일)
              ClearCollect(colFromAttached,
                  Filter(
                      'Expense Mobile Attached Document Entity (mserp)',
                      'Reference record ID' = Value(varSelectedExpenseDoc.ExpenseRecId)
                  )
              );

              // 2. Unattached Entity 조회 (서버 직접 쿼리로 성능 최적화)
              // 1. [1차 필터링 - 서버 사이드] 전체가 아닌 "최소한의 물리적 조건"으로 데이터 다운로드 (성능 대폭 개선)
              // 주의: 아래 'Worker'나 'Personnel number', 'Legal entity' 등 실제 해당 엔터티에 존재하는 '물리적 필드'를 사용해야 합니다.
              ClearCollect(
                  colMyUnattachedTemp,
                  Filter(
                      'Expense Mobile Unattached Document Entity (mserp)',
                      'Company accounts' = varSelectedLegalEntity
                  )
              );

              // 2. [2차 필터링 - 앱 로컬 메모리] 소량으로 좁혀진 임시 컬렉션에서 가상 필드(ExpTransNumber) 필터링 수행
              ClearCollect(
                  colFromUnattached,
                  Filter(
                      colMyUnattachedTemp,
                      ExpTransNumber = varSelectedExpenseDoc.'Expense transaction number (mserp_exptransnumber)'
                  )
              );

              // 3. [데이터 병합] 두 결과를 하나의 컬렉션(colAttachedReceipts)으로 통합
              // 화면 표시를 위해 필드명을 통일합니다.
              ClearCollect(
                  colAttachedReceipts,
                  // 1. 이미 첨부된 파일들 (Attached Entity)
                  ForAll(colFromAttached, {
                      mserp_entrecid: EntRecId,
                      mserp_captureddocument: CapturedDocument,
                      mserp_fileextension: FileExtension,
                      mserp_filename: Description,
                      mserp_createddatetime: CreatingDateTime // Attached 엔터티의 필드명
                  }),
                  // 2. 방금 연결하여 대기 중인 파일들 (Unattached Entity)
                  ForAll(colFromUnattached, {
                      mserp_entrecid: EntRecId,
                      mserp_captureddocument: CapturedDocument,
                      mserp_fileextension: FileExtension,
                      mserp_filename: Coalesce(Description, Concatenate("Receipt-", Text(EntRecId))),
                      // [수정 포인트] CreatedDateTime -> mserp_createddatetime (또는 Now())
                      mserp_createddatetime: CreatingDateTime 
                  })
              );

              // 4. 최종 정렬
              ClearCollect(
                  colAttachedReceipts,
                  SortByColumns(colAttachedReceipts, "mserp_createddatetime", SortOrder.Descending)
              );

              // 4. 미리보기 이미지 설정 (컬렉션 기준)
              Set(
                  varReceiptImage,
                  If(
                      !IsEmpty(colAttachedReceipts),
                      First(colAttachedReceipts).mserp_captureddocument,
                      Blank()
                  )
              );
              Set(
                  varFileFormat,
                  If(
                      !IsEmpty(colAttachedReceipts),
                      First(colAttachedReceipts).mserp_fileextension,
                      Blank()
                  )
              );
              Set(
                  varExpenseAgainstWorkItem,
                  Blank()
              );
              // collect policy violations

              If(
                  varSelectedExpenseDoc.PolicyViolationCount,
                  ClearCollect(
                      colPolViolations,
                      Split(varSelectedExpenseDoc.PolicyViolationErrorMessage, "~|~")
                  );
                  UpdateContext({varMaxViolationLevel : varSelectedExpenseDoc.PolicyViolationsLevel});
                  UpdateContext({varNumViolation : varSelectedExpenseDoc.PolicyViolationCount}),
                  Clear(colPolViolations);
                  UpdateContext({varMaxViolationLevel : 0});
                  UpdateContext({varNumViolation : 0})
              );


              Navigate('Expenses - Edit Screen', ScreenTransition.None, {varNavigatedFrom : Blank(),varMaxViolationLevel : varMaxViolationLevel, varNumViolation: varNumViolation, varRemainingAmount: 0, locCategoryChange: false, locItemizeButtonVisibilityFlag: false});

              // Adding a warning if FnO default user language is not equal to the user's device language
              If(
                  Lower(varDefaultLanguage) <> "en-us" && gblWarningOnEdit,
                  Notify(
                    Substitute(Substitute(GlobalLabels.Labels.'15062:LocalizedName,msdyn_FnOAndMobileLanguageDifferentLabel',"$", varDefaultLanguage), "#", Language()),
                  NotificationType.Warning,
                  15000
                  )
              );
              Set(
                  gblWarningOnEdit,
                  false
              );
            TemplateSize: =150
            Visible: =Self.AllItemsCount > 0
            Width: =Parent.Width
            Y: =If(varCntSelect,scr01_hdr_TopHeader.Height+scr01_shp_Rectangle.Height,scr01_hdr_TopHeader.Height)
          Children:
            - Container11:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Height: =150
                  LayoutDirection: =LayoutDirection.Vertical
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width
                Children:
                  - Container6:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Height: =Parent.Height - scr01_shp_GalleryBaseSeparator.Height
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =Parent.Width
                      Children:
                        - shpBorder_3:
                            Control: Rectangle@2.3.0
                            Properties:
                              BorderColor: =RGBA(0, 18, 107, 1)
                              Fill: =Color.Transparent
                              Height: =Parent.Height
                              LayoutMaxHeight: =
                              LayoutMaxWidth: =
                              Width: =10
                        - scr01_chk_Select_2:
                            Control: Classic/CheckBox@2.1.0
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              BorderColor: =RGBA(0, 18, 107, 1)
                              BorderStyle: =BorderStyle.None
                              CheckboxBackgroundFill: =If(Self.Value, RGBA(34, 102, 227, 1),Color.White)
                              CheckboxBorderColor: =RGBA(34, 102, 227, 1)
                              CheckboxSize: =42
                              CheckmarkFill: =Color.White
                              Color: =RGBA(34, 102, 227, 1)
                              Default: =!IsEmpty(Filter(collSelectedExpenseIds, transactionId = ThisItem.'Expense transaction number (mserp_exptransnumber)'))
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Lighter
                              Height: =35
                              HoverColor: =RGBA(0, 18, 107, 1)
                              LayoutMaxHeight: =
                              LayoutMaxWidth: =
                              OnCheck: |-
                                =Collect(
                                    collSelectedExpenseIds, 
                                    {transactionId : ThisItem.'Expense transaction number (mserp_exptransnumber)'}
                                )
                              OnSelect: =
                              OnUncheck: =RemoveIf(collSelectedExpenseIds, transactionId = ThisItem.'Expense transaction number (mserp_exptransnumber)')
                              Reset: =varCntSelect Or scr01_chk_SelectAll.Value
                              Text: |-
                                =If(
                                    ThisItem.Merchant <> "" || !IsBlank(ThisItem.Merchant),
                                    Concatenate("Expense against merchant ", ThisItem.Merchant, If(Self.Value, " selected", " unselected")),
                                    Concatenate("Expense bearing amount ", Concatenate(Text(Value(ThisItem.'Transaction amount'), "#,#0.00", varDefaultLanguage), " ", ThisItem.'Currency (mserp_exchangecode)'), If(Self.Value, " selected", " unselected"))
                                )
                              VerticalAlign: =VerticalAlign.Bottom
                              Visible: =varCntSelect
                              Width: =43
                              X: =18
                              Y: =41
                        - Image6:
                            Control: Image@2.2.3
                            Properties:
                              BorderColor: =RGBA(0, 18, 107, 1)
                              Height: =Parent.Height
                              Image: |-
                                =If(
                                    Value(ThisItem.PolicyViolationsLevel) = 0,
                                    LookUp(dsCategoryImages, expenseType = ThisItem.'Expense type', icon),
                                    Value(ThisItem.PolicyViolationsLevel) > 0 && Value(ThisItem.PolicyViolationsLevel) <= 2,
                                    LookUp(dsCategoryImages, expenseType = ThisItem.'Expense type', iconYellow), //iconYellow
                                    Value(ThisItem.PolicyViolationsLevel) > 2,
                                    LookUp(dsCategoryImages, expenseType = ThisItem.'Expense type', iconRed) //iconRed
                                )
                              ImagePosition: =ImagePosition.Center
                              LayoutMaxHeight: =
                              LayoutMaxWidth: =
                              Visible: =!varCntSelect
                              Width: =60
                        - Container7:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutJustifyContent: =LayoutJustifyContent.Center
                              LayoutMaxHeight: =
                              LayoutMaxWidth: =
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                            Children:
                              - Label5:
                                  Control: Label@2.5.1
                                  Properties:
                                    AutoHeight: =true
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    Font: =Font.'Segoe UI'
                                    LayoutMaxHeight: =
                                    LayoutMaxWidth: =
                                    OnSelect: =Select(scr01_shp_SelectRegion_3)
                                    PaddingLeft: =15
                                    PaddingRight: =0
                                    TabIndex: =If(IsBlank(Self.Text), -1, 0)
                                    Text: =Coalesce(ThisItem.'Item or Service', "")
                                    Width: =Parent.Width
                              - Label6:
                                  Control: Label@2.5.1
                                  Properties:
                                    AutoHeight: =true
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    Color: =RGBA(102, 102, 102, 1)
                                    Font: =Font.'Segoe UI'
                                    LayoutMaxHeight: =
                                    LayoutMaxWidth: =
                                    OnSelect: =Select(scr01_shp_SelectRegion_3)
                                    PaddingLeft: =15
                                    PaddingRight: =0
                                    TabIndex: =If(IsBlank(Self.Text), -1, 0)
                                    Text: =ThisItem.'Additional information'
                                    Width: =Parent.Width
                        - Container9:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutJustifyContent: =LayoutJustifyContent.Center
                              LayoutMaxHeight: =
                              LayoutMaxWidth: =
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Width: =200
                            Children:
                              - Label5_1:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =Align.Center
                                    AutoHeight: =true
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Bold
                                    LayoutMaxHeight: =
                                    LayoutMaxWidth: =
                                    OnSelect: =Select(scr01_shp_SelectRegion_3)
                                    TabIndex: =If(IsBlank(Self.Text), -1, 0)
                                    Text: |+
                                      =Concatenate(Text(Value(ThisItem.'Transaction amount'), "#,#0.00", varDefaultLanguage), " ", ThisItem.'Currency (mserp_exchangecode)')

                                    Width: =Parent.Width
                              - Label6_1:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =Align.Center
                                    AutoHeight: =true
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    Color: |
                                      =RGBA(102, 102, 102, 1)
                                    Font: =Font.'Segoe UI'
                                    LayoutMaxHeight: =
                                    LayoutMaxWidth: =
                                    OnSelect: =Select(scr01_shp_SelectRegion_3)
                                    TabIndex: =If(IsBlank(Self.Text), -1, 0)
                                    Text: |-
                                      =Text(
                                          DateValue(ThisItem.'Purchase Date'),
                                          "mmm dd, yyyy"
                                      )
                                    Width: =Parent.Width
                        - Icon3:
                            Control: Classic/Icon@2.5.0
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              BorderColor: =RGBA(0, 18, 107, 1)
                              Color: =RGBA(110, 110, 110, 1)
                              Icon: =Icon.ChevronRight
                              LayoutMaxHeight: =
                              LayoutMaxWidth: =
                              OnSelect: |-
                                =Select(scr01_glr_ListExpense);
                                Set(varExpenseButtonClicked, true)
                              PaddingBottom: =15
                              PaddingTop: =15
                              Visible: =varCntSelect
                  - scr01_shp_GalleryBaseSeparator:
                      Control: Rectangle@2.3.0
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Fill: =RGBA(225, 225, 225, 1)
                        Height: =1
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        LayoutMinHeight: =1
                        Width: =Parent.Width - 10
            - scr01_shp_SelectRegion_RightIcon:
                Control: Rectangle@2.3.0
                Properties:
                  AccessibleLabel: ="Select to view expense"
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Fill: =RGBA(0, 0, 0, 0)
                  FocusedBorderThickness: =0
                  Height: =Parent.TemplateHeight
                  OnSelect: |-
                    =Select(Parent);
                    Set(varExpenseButtonClicked, true)
                  TabIndex: =0
                  Visible: =varCntSelect
                  Width: =Parent.Width - Self.X
                  X: =scr01_shp_SelectRegion_3.Width
            - scr01_shp_SelectRegion_3:
                Control: Rectangle@2.3.0
                Properties:
                  AccessibleLabel: ="Select expense"
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Fill: =RGBA(0, 0, 0, 0)
                  FocusedBorderThickness: =0
                  Height: =Parent.TemplateHeight
