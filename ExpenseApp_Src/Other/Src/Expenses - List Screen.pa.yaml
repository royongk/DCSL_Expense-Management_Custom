                  Width: =Container9.X + Container9.Width
      - scr01_btn_CreateExpense:
          Control: Image@2.2.3
          Properties:
            AccessibleLabel: ="Create new expense"
            BorderColor: =RGBA(0, 18, 107, 1)
            DisplayMode: |-
              =If(
                  !IsBlank(varSelectedLegalEntity),
                  DisplayMode.Edit,
                  DisplayMode.View
              )
            FocusedBorderThickness: =0
            Height: =Self.Width
            Image: =CreateButton
            ImagePosition: =ImagePosition.Fill
            OnSelect: |-
              =// Adding a warning if FnO default user language is not equal to the user's device language
              If(
                  Lower(varDefaultLanguage) <> "en-us" && gblWarningOnCreate,
                  Notify(
                    Substitute(Substitute(GlobalLabels.Labels.'15062:LocalizedName,msdyn_FnOAndMobileLanguageDifferentLabel',"$", varDefaultLanguage), "#", Language()),
                  NotificationType.Warning,
                  15000
                  )
              );
              Set(
                  gblWarningOnCreate,
                  false
              );
              Concurrent(
                  Set(
                      varIsCreate,
                      true
                  ),
                  Set(
                      varSelectedExpenseDoc,
                      Blank()
                  ),
                  Set(
                      varSelectedReceiptNumber,
                      Blank()
                  ),
                  Set(
                      varReceiptImage,
                      Blank()
                  ),
                  Set(
                      varFileFormat,
                      Blank()
                  ),
                  Set(
                      IsreceiptALreadyCreated,
                      false
                  ),
                  Set(
                      isProjIdCalledFromAttach,
                      false
                  ),
                  Set(
                      mileageResponse,
                      {return: ""}
                  ),
                  Set(
                      varCollectCacheV2,
                      Blank()
                  ),
                  Set(
                      varCollectCacheV23,
                      Blank()
                  ),
                  Set(
                      varExpenseAgainstWorkItem,
                      Blank()
                  ),
                  Set(
                      varChangeReceiptItemizedExpense,
                      false
                  )
              );
              UpdateContext({currExpenseType: {return: ""}});
              UpdateContext({varOnShowFields: true});
              UpdateContext({varMileageTotal: {return: ""}});
              UpdateContext({varDefaultVehicleType: {return: ""}});
              Clear(colPolViolations);
              Clear(colAttachedReceipts);
              Clear(colPendingReceipts);
              ResetForm(EditExpenseForm);
              // 기존 캡처 화면 대신 Edit Screen으로 즉시 이동하며 초기화 컨텍스트 전달
              Navigate(
                  'Expenses - Edit Screen', 
                  ScreenTransition.Fade, 
                  { locItemizeButtonVisibilityFlag: false }
              )
            TabIndex: =0
            Visible: =!varCntSelect
            Width: =If(Parent.Width >= 768, 180, 120)
            X: =If(Parent.Width >= 768, (Parent.Width - Self.Width) / 2, Parent.Width - Self.Width - 15)
            Y: =If(Parent.Width >= 768, scr01_cmp_Footer.Y - Self.Height - 30, scr01_cmp_Footer.Y - Self.Height - 15)
      - scr01_btn_CreateNewReport:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(30, 144, 255, 1)
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            DisabledColor: =RGBA(172, 172, 172, 1)
            DisabledFill: =RGBA(225, 225, 225, 1)
            DisplayMode: |-
              =If(
                  !IsBlank(varSelectedLegalEntity),
                  DisplayMode.Edit,
                  DisplayMode.View
              )
            Fill: =RGBA(34, 102, 227, 1)
            Font: =Font.'Open Sans'
            Height: =83
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            OnSelect: |-
              =Trace(
                  "Expense canvas app log",
                  TraceSeverity.Information,
                  {
                      UserName: User().FullName,
                      UserEmail: User().Email,
                      Screen: 'Expenses - List Screen'.Name,
                      Message: "Clicked Create expense report button"
                  }
              );
              IfError(
                  Set(
                      varSelectedReport,
                      Patch(
                          'DCSL Expense Moblie Report (mserp)',
                          Defaults('DCSL Expense Moblie Report (mserp)'),
                          {
                              'Legal entity for expenses': varSelectedLegalEntity
                          }
                      )
                  ),
                  UpdateContext(
                      {
                          varCreateReportError : 
                          Substitute(
                              Match(FirstError.Details.HttpResponse, """message"":""([^""]*)""").FullMatch, 
                              """message"":", 
                              ""
                          )
                      }
                  )
              );
              If(
                  IsBlank(varCreateReportError),
                  Set(
                      varSelectedReport,
                      Patch(
                          'DCSL Expense Moblie Report (mserp)',
                          varSelectedReport,
                          {
                              ExpTransNumber: Concat(collSelectedExpenseIds, transactionId, ",")
                          }
                      )
                  );
                  Reset(ComboBox_Location);
                  Reset(ComboBox_Purpose);
                  Reset(scr17_txt_Description_1);
                  Set(
                      varIsCreateReport,
                      false
                  );
                  Set(
                      varSelectedReportStatusItem,
                      varSelectedReport.'Document Status'
                  );
                  ClearCollect(
                      colAttachedExpensesForReport,
                      Filter(
                          'DCSL Expense Line Expense Moblie Entity (mserp)',
                          'Expense report number (mserp_expnumber)' = varSelectedReport.'Expense report number' 
                          && 'Expense line type' <> 'Expense line type (mserp)'.'Itemized line'
                      )
                  );
                  ClearCollect(
                      colAttachedExpenses,
                      colAttachedExpensesForReport
                  );
                  Refresh('DCSL Expense Line Expense Moblie Entity (mserp)');
                  Navigate('Reports - Edit Screen', ScreenTransition.None),
                  Notify(
                      Substitute(varCreateReportError, """", ""),
                      NotificationType.Error,
                      gblParams.notificationTime
                  )
              );
              UpdateContext({varCreateReportError:Blank()});
              UpdateContext({varCntSelect:false});
              Clear(collSelectedExpenseIds);
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Size: =18
            Text: |
              ="Create expense report"
            Visible: =varCntSelect
            Width: |
              =Parent.Width -  Self.X*2
            X: =40
            Y: =scr01_shp_BaseRectangle.Y + (scr01_shp_BaseRectangle.Height - Self.Height)/2
