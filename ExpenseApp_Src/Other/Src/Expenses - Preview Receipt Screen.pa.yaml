Screens:
  Expenses - Preview Receipt Screen:
    Properties:
      Fill: =RGBA(229, 229, 229, 1)
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |-
        =UpdateContext(
            {
                defaultOCRDate: "1900-01-01T12:00:00",
                varReceiptSizeOk: true
            }
        )
    Children:
      - imageView_footer_rectangle:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =RGBA(37, 36, 35, 1)
            Height: =168
            Width: =Max(App.Width, App.MinScreenWidth)
            Y: =Parent.Height - Self.Height
      - scr05_btn_Done:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =RGBA(34, 102, 227, 1)
            Font: =Font.'Open Sans'
            Height: =88
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            OnSelect: "=If(\r\n    !IsreceiptALreadyCreated,\r\n    If(\r\n        IsBlank(varSelectedReceiptNumber),\r\n        UpdateContext({varText : JSON(scr05_img_Receipt.Image,JSONFormat.IncludeBinaryData)});\r\n        If(\r\n            !IsBlank(varText) || !IsMatch(varText, \"\"),\r\n            UpdateContext({varB64 : Mid(varText, Find(\",\", varText) + 1, Len(varText) - Find(\",\", varText) - 1)});\r\n            UpdateContext({varType : Mid(varText, Find(\":\", varText) + 1, (Find(\";\", varText) - 1) - (Find(\":\", varText) + 1) + 1)});\r\n            UpdateContext({varExtension : Mid(varType, Find(\"/\", varType) + 1)});\r\n        );\r\n        IfError(\r\n            Set(\r\n                gblCreatedReceiptResponse,\r\n                'Expense mobile master data (mserp)'.mserp_trvexpmobilemasterdataentity_uploadlargeimage(\r\n                    LookUp('Expense mobile master data (mserp)',Email = User().Email).'Expense mobile master data (mserp)', \r\n                    {\r\n                        imageBase64: varB64,\r\n                        ContentType: varType,\r\n                        FileExtension: varExtension,\r\n                        FileName: If(IsMatch( varReceiptFileName, \"\\.\",MatchOptions.Contains),varReceiptFileName, Concatenate(varReceiptFileName,\".\",varExtension))\r\n                    }\r\n                )\r\n            ),\r\n            UpdateContext({varCreateReceiptError : FirstError}) \r\n        );\r\n        If(\r\n            IsBlank(varCreateReceiptError),\r\n            Notify(\r\n                GlobalLabels.Labels.'15062:LocalizedName,msdyn_ReceiptCreatedSuccessfullyLabel',\r\n                NotificationType.Success, \r\n                gblParams.notificationTime\r\n            );\r\n            Set(\r\n                varReceiptImage,\r\n                Substitute(varText,\"\"\"\",\"\"));\r\n            Set(\r\n                varSelectedReceiptNumber,\r\n                Value(ParseJSON(gblCreatedReceiptResponse.return).DocuRefRecId)\r\n            ),\r\n            Notify(\r\n                Substitute(\r\n                    Match(varCreateReceiptError.Details.HttpResponse, \"\"\"message\"\":\"\"([^\"\"]*)\"\"\").FullMatch, \r\n                    \"\"\"message\"\":\", \r\n                    Blank()\r\n                ),\r\n                NotificationType.Error, \r\n                gblParams.notificationTime\r\n            )\r\n        )\r\n    ),\r\n    Set(\r\n        varReceiptImage,\r\n        Substitute(JSON(scr05_img_Receipt.Image,JSONFormat.IncludeBinaryData),\"\"\"\",\"\")\r\n    )\r\n);\r\n        \r\nIf(\r\n    varIsCreate && varOCREnabled && !IsBlank(varSelectedReceiptNumber),\r\n    UpdateContext({\r\n        flowResponse :\r\n        'Expense Mobile Unattached Document Entity (mserp)'.mserp_trvexpmobileunattacheddocumententity_populatereceiptdetails(LookUp('Expense Mobile Unattached Document Entity (mserp)',EntRecId = varSelectedReceiptNumber).'Expense Mobile Unattached Document Entity (mserp)').return\r\n    });\r\n    Clear(OCRresponse_Receipt);\r\n    ForAll(\r\n        Table(\r\n            ParseJSON(\r\n                Concatenate(\"[\", flowResponse, \"]\")\r\n            )\r\n        ),\r\n        Collect(\r\n            OCRresponse_Receipt,\r\n            {\r\n                merchantId: Text(ThisRecord.Value.Merchant),\r\n                amountCurr: Text(ThisRecord.Value.TotalAmount),\r\n                transDate : If(\r\n                                Text(DateValue(ThisRecord.Value.TransDate, \"en-US\")) <> Text(DateValue(defaultOCRDate, \"en-US\")),\r\n                                Text(DateValue(ThisRecord.Value.TransDate, \"en-US\")),\r\n                                Text(Today())\r\n                            )\r\n            }\r\n        )\r\n    );\r\n    Set(\r\n        OCRresponse, \r\n        First(OCRresponse_Receipt)\r\n    )\r\n); \r\nUpdateContext({varCreateReceiptError : Blank()});\r\n\r\nIf(\r\n    !IsBlank(varReceiptImage),\r\n    If(\r\n        varNavigateFromExpense = \"NavigatedFromItemizedEditExpense\",\r\n        Navigate('Itemization - Itemized Expense Edit Screen',ScreenTransition.None),\r\n        Navigate('Expenses - Edit Screen',ScreenTransition.None, {varRemainingAmount: 0, locItemizeButtonVisibilityFlag: false})\r\n    ),\r\n    Notify(\r\n        GlobalLabels.Labels.'15062:LocalizedName,msdyn_InvalidReceiptLabel',\r\n        NotificationType.Error,\r\n        gblParams.notificationTime\r\n    )\r\n);\r\nClear(colFileSplit);\r\nClear(colDeviceAttachedFile);\r\n"
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Text: =GlobalLabels.Labels.'15062:LocalizedName,msdyn_DoneButtonLabel'
            Width: =Parent.Width -  Self.X*2
            X: =40
            Y: =imageView_footer_rectangle.Y + 30
      - scr05_lbl_NoPreview:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Font: =Font.'Segoe UI'
            Height: =64
            Size: =18
            Text: |
              =//GlobalLabels.Labels.PreviewNotAvailable
              GlobalLabels.Labels.'15062:LocalizedName,msdyn_FilePreviewNotSupportedLabel'
            Visible: =!(scr05_pdfViewer.Visible || scr05_img_Receipt.Visible)
            Width: '=406     '
            X: =(Parent.Width - Self.Width)/2
            Y: '=scr05_img_NoPreview.Y + scr05_img_NoPreview.Height + 10 '
      - scr05_img_NoPreview:
          Control: Image@2.2.3
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Height: =85
            Image: |-
              =If(
                  varFileFormat in ["xlsx", "xls"],
                  IconExcel,
                  varFileFormat in ["docx", "doc"],
                  IconWord,
                  varFileFormat = "txt",
                  IconTxt,
                  IconMail
              )
            Visible: =scr05_lbl_NoPreview.Visible
            Width: =85
            X: =(Parent.Width - Self.Width)/2
            Y: =scr05_img_Receipt.Y + (scr05_img_Receipt.Height - Self.Height)/2
      - scr05_img_Receipt:
          Control: Image@2.2.3
          Properties:
            ApplyEXIFOrientation: =false
            BorderColor: =RGBA(0, 18, 107, 1)
            Height: =imageView_footer_rectangle.Y - Self.Y
            Image: =varReceiptImage
            Visible: =varFileFormat in ["jpeg","png","jpg","bmp","tiff"] && !IsBlank(varReceiptImage)
            Width: |+
              =Parent.Width
            Y: =scr05_hdr_TopHeader.Height
      - scr05_pdfViewer:
          Control: PDFViewer@2.5.0
          Properties:
            Document: =varReceiptImage
            Height: =scr05_img_Receipt.Height
            Visible: =varFileFormat = "pdf" && !IsBlank(varReceiptImage)
            Width: =scr05_img_Receipt.Width
            X: =scr05_img_Receipt.X
            Y: =scr05_img_Receipt.Y
      - scr05_hdr_TopHeader:
          Control: CanvasComponent
          ComponentName: hdr02_Header
          Properties:
            Fill: =scr05_hdr_TopHeader.paramFill
            Height: =82
            Width: =Max(App.Width, App.MinScreenWidth)
            paramColor: =RGBA(255, 255, 255, 1)
            paramFill: |
              =RGBA(33, 33, 33, 1)
            paramTitle: =GlobalLabels.Labels.'15062:LocalizedName,msdyn_AddReceiptLabel'
      - scr05_lbl_Retake:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Semibold
            Height: =33
            OnSelect: |-
              =Set(
                  varReceiptImage, 
                  Blank()
              );
              Set(
                  varFileFormat, 
                  Blank()
              );
              Clear(colFileSplit);
              Clear(colDeviceAttachedFile);
              Back()
            Size: =17
            TabIndex: =0
            Text: =GlobalLabels.Labels.'15062:LocalizedName,msdyn_RetakeLabel'
            Width: =110
            X: =(Parent.Width - Self.Width - 15)
            Y: =24
      - scr05_ico_Back:
          Control: Classic/Icon@2.5.0
          Properties:
            AccessibleLabel: ="Press to go back"
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =Color.White
            Fill: =icongconfig_backbutton.Fill
            Height: =icongconfig_backbutton.Height
            Icon: =Icon.ChevronLeft
            OnSelect: |-
              =Set(
                  varReceiptImage, 
                  Blank()
              );
              Set(
                  varFileFormat, 
                  Blank()
              );
              Clear(colFileSplit);
              Clear(colDeviceAttachedFile);
              Back()
            TabIndex: =0
            Width: =icongconfig_backbutton.Width
            X: =22.5
            Y: =(scr02_hdr_TopHeader.Height-Self.Height)/2
