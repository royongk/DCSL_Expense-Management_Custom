Screens:
  Expenses - Select Existing Receipt Screen:
    Properties:
      Fill: =RGBA(255, 255, 255, 1)
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |-
        =// Initialize multi-select state for existing receipts
        Clear(colSelectedExistingReceipts);
    Children:
      - scr10_lbl_Skip:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Semibold
            Height: =33
            OnSelect: |-
              =Navigate('Expenses - Edit Screen',ScreenTransition.Fade,{locItemizeButtonVisibilityFlag: false})
            Size: =13
            Width: =150
      - attachmentControl - Expense_1:
          Control: Attachments@2.3.0
          Properties:
            AccessibleLabel: ="Select receipt from device"
            AddAttachmentColor: =Color.Red
            AddAttachmentText: =GlobalLabels.Labels.'15062:LocalizedName,msdyn_SelectDromDeviceLabel'
            AddedItemColor: =
            AddedItemFill: =
            BorderColor: =
            BorderStyle: =
            BorderThickness: =0
            Color: =RGBA(255, 255, 255, 1)
            DropTargetBorderThickness: =0
            Fill: =RGBA(37, 36, 35, 1)
            FocusedBorderThickness: =0
            Font: =Font.'Open Sans'
            Height: =160
            HoverBorderColor: =
            HoverColor: =
            HoverFill: =
            ItemColor: =RGBA(255, 255, 255, 1)
            ItemFill: =
            ItemHoverFill: =
            Items: =colDeviceAttachedFile
            Items.Name: =Name
            Items.Value: =Value
            MaxAttachmentSize: =15
            MaxAttachments: =10
            MaxAttachmentsText: =
            NoAttachmentsText: =
            OnAddFile: |-
              =// Multi-select upload from device: keep attachments in a collection and upload on Done
              ClearCollect(colDeviceAttachedFile, Self.Attachments);
              Set(varReceiptImage, Blank());
              Set(varFileFormat, Blank());
              Set(varReceiptFileName, Blank());
            OnRemoveFile: |-
              =ClearCollect(colDeviceAttachedFile, Self.Attachments);
              Clear(colFileSplit);
              Set(
                  varFileFormat,
                  Blank()
              );
              Set(
                  varReceiptImage,
                  Blank()
              )
            PaddingBottom: =5
            PaddingLeft: =25
            PaddingRight: =5
            PressedColor: =RGBA(255, 255, 255, 1)
            PressedFill: =
            Size: =20
            Tooltip: =
            Width: =Parent.Width
            Y: =Parent.Height - Self.Height
      - Select Existing receipt:
          Control: GroupContainer@1.4.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(37, 36, 35, 1)
            Height: =425
            LayoutDirection: =LayoutDirection.Vertical
            PaddingLeft: =20
            PaddingTop: =15
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
            Y: =Parent.Height - Self.Height - 'attachmentControl - Expense_1'.Height/2
          Children:
            - scr10_lbl_SelectAReceipt_2:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =RGBA(243, 242, 241, 1)
                  Font: =Font.'Segoe UI'
                  Height: =35
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  Size: =15
                  Text: =GlobalLabels.Labels.'15062:LocalizedName,msdyn_SelectExistingReceiptLabel'
                  Width: =380
                  X: =25
                  Y: =710
            - scr10_glr_Receipts_2:
                Control: Gallery@2.15.0
                Variant: BrowseLayout_Horizontal_TwoTextOneImageVariant_ver4.0
                Properties:
                  AccessibleLabel: ="List of unattached receipts"
                  AlignInContainer: =AlignInContainer.SetByContainer
                  BorderColor: =RGBA(255, 255, 255, 1)
                  DelayItemLoading: =false
                  FocusedBorderThickness: =0
                  Height: =300
                  Items: |
                    =Filter('Expense Mobile Unattached Document Entity (mserp)', IsReceiptValid = 'NoYes (mserp)'.Yes)
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  LayoutMinHeight: =250
                  LoadingSpinner: =LoadingSpinner.None
                  NavigationStep: =2
                  ShowScrollbar: =false
                  TemplatePadding: =10
                  TemplateSize: =300
                  Width: =Parent.Width -  Self.X*2
                  X: =10
                  Y: =745
                Children:
                  - Container3_7:
                      Control: GroupContainer@1.4.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.Regular
                        Height: =Parent.Height
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutOverflowY: =LayoutOverflow.Scroll
                        RadiusBottomLeft: =10
                        RadiusBottomRight: =10
                        RadiusTopLeft: =10
                        RadiusTopRight: =10
                        Width: =Parent.TemplateWidth
                      Children:
                        - scr10_img_ReceiptImage_2:
                            Control: Image@2.2.3
                            Properties:
                              AccessibleLabel: =ThisItem.Description
                              BorderColor: =RGBA(0, 0, 0, 1)
                              BorderThickness: =1
                              Fill: |-
                                =If(
                                    ThisItem.FileExtension in ["jpg", "bmp", "jpeg", "png", "heic", "tif", "tiff", "raw"],
                                    RGBA(0, 0, 0, 0),
                                    RGBA(229, 229, 229, 1)
                                )
                              Height: =250
                              Image: |-
                                =If(
                                    ThisItem.FileExtension in ["jpg", "bmp", "jpeg", "png", "heic", "tif", "tiff", "raw"] && !IsBlank(ThisItem.CapturedDocument),
                                    ThisItem.CapturedDocument,
                                    ThisItem.FileExtension in ["xlsx", "xls"],
                                    IconExcel,
                                    ThisItem.FileExtension in ["docx", "doc"],
                                    IconWord,
                                    ThisItem.FileExtension = "pdf",
                                    IconPDF,
                                    ThisItem.FileExtension = "txt",
                                    IconTxt,
                                    IconMail
                                )
                              ImagePosition: |-
                                =/*If(
                                    scr09_img_ReceiptList.Image = ThisItem.receiptUrl,
                                    ImagePosition.Fill,
                                    ImagePosition.Center
                                )*/
                                ImagePosition.Center
                              LayoutMaxHeight: =
                              LayoutMaxWidth: =
                              OnSelect: |-
                                =Set(
                                    varSelectedReceiptNumber,
                                    ThisItem.EntRecId
                                );
                                Set(
                                    IsreceiptALreadyCreated,
                                    true
                                );
                                Set(
                                    varFileFormat,
                                    ThisItem.FileExtension
                                );
                                Set(
                                    varReceiptImage,
                                    ThisItem.CapturedDocument
                                );
                                Navigate('Expenses - Preview Receipt Screen')
                              Width: =Parent.Width
                              X: =15
                              Y: =18
                        - Container4_7:
                            Control: GroupContainer@1.4.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =Color.DimGrey
                              FillPortions: =0
                              Height: =80
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutMaxHeight: =
                              LayoutMaxWidth: =
                              LayoutMinHeight: =70
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                            Children:
                              - shpBorder_19:
                                  Control: Rectangle@2.3.0
                                  Properties:
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    Fill: =Color.Transparent
                                    Height: =Parent.Height
                                    LayoutMaxHeight: =
                                    LayoutMaxWidth: =
                                    Width: |
                                      =25
                              - scr10_icn_AttachIcn_2:
                                  Control: Image@2.2.3
                                  Properties:
                                    AccessibleLabel: ="Attach this receipt"
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    Height: =24
                                    Image: =AttachIcnWhite
                                    LayoutMaxHeight: =
                                    LayoutMaxWidth: =
                                    OnSelect: |-
                                      =// Toggle selection for multi-attach (do not navigate)
                                      If(
                                          IsBlank(LookUp(colSelectedExistingReceipts, EntRecId = ThisItem.EntRecId)),
                                          Collect(colSelectedExistingReceipts, {EntRecId: ThisItem.EntRecId}),
                                          RemoveIf(colSelectedExistingReceipts, EntRecId = ThisItem.EntRecId)
                                      )
                                    Width: =24
                                    X: =33
                                    Y: =201
                              - scr10_lbl_Attach_2:
                                  Control: Label@2.5.1
                                  Properties:
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    Color: =Color.White
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Lighter
                                    Height: =48
                                    LayoutMaxHeight: =
                                    LayoutMaxWidth: =
                                    OnSelect: |-
                                      =// Toggle selection for multi-attach (do not navigate)
                                      If(
                                          IsBlank(LookUp(colSelectedExistingReceipts, EntRecId = ThisItem.EntRecId)),
                                          Collect(colSelectedExistingReceipts, {EntRecId: ThisItem.EntRecId}),
                                          RemoveIf(colSelectedExistingReceipts, EntRecId = ThisItem.EntRecId)
                                      )
                                    TabIndex: =0
                                    Text: =GlobalLabels.Labels.'15062:LocalizedName,msdyn_AttachLabel'
                                    VerticalAlign: =VerticalAlign.Top
                                    Width: =101
                                    X: =scr10_icn_AttachIcn_2.X + scr10_icn_AttachIcn_2.Width + 8
                                    Y: =scr10_icn_AttachIcn_2.Y - 10
                              - scr10_icn_SelectedCheck:
                                  Control: Classic/Icon@2.5.0
                                  Properties:
                                    AccessibleLabel: ="Selected"
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    Color: =Color.White
                                    Height: =24
                                    Icon: =Icon.Check
                                    OnSelect: =Select(scr10_icn_AttachIcn_2)
                                    Visible: =!IsBlank(LookUp(colSelectedExistingReceipts, EntRecId = ThisItem.EntRecId))
                                    Width: =24
                                    X: =Parent.Width - Self.Width - 20
                                    Y: =(Parent.Height - Self.Height) / 2
      - scr10_img_SelectedReceipt:
          Control: Image@2.2.3
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =RGBA(0, 0, 0, 1)
            Height: ='Select Existing receipt'.Y - Self.Y
            HoverFill: =Self.Fill
            Image: =
            ImagePosition: =ImagePosition.Center
            Width: =Parent.Width
            Y: =scr10_hdr_TopHeader.Height
      - scr10_hdr_TopHeader:
          Control: CanvasComponent
          ComponentName: hdr02_Header
          Properties:
            Fill: =scr10_hdr_TopHeader.paramFill
            Height: =82
            Width: =Max(App.Width, App.MinScreenWidth)
            paramColor: =RGBA(255, 255, 255, 1)
            paramFill: |
              =RGBA(33, 33, 33, 1)
            paramTitle: |-
              =
              GlobalLabels.Labels.'15062:LocalizedName,msdyn_AddReceiptLabel'
      - scr10_ico_Back:
          Control: Classic/Icon@2.5.0
          Properties:
            AccessibleLabel: ="Press to go back"
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =Color.White
            Fill: =icongconfig_backbutton.Fill
            Height: =icongconfig_backbutton.Height
            Icon: =Icon.ChevronLeft
            OnSelect: =Back();
            TabIndex: =0
            Width: =icongconfig_backbutton.Width
            X: =22.5
            Y: =(scr10_hdr_TopHeader.Height-Self.Height)/2
      - scr10_btn_DoneMultiAttach:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =RGBA(34, 102, 227, 1)
            Font: =Font.'Open Sans'
            Height: =72
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            OnSelect: |-
              =// Commit selected existing receipts into attached receipts collection
              ForAll(
                  colSelectedExistingReceipts As sel,
                  With(
                      {
                          receiptRecord: LookUp(
                              'Expense Mobile Unattached Document Entity (mserp)',
                              EntRecId = sel.EntRecId
                          )
                      },
                      If(
                          !IsBlank(receiptRecord) &&
                          IsBlank(LookUp(colAttachedReceipts, EntRecId = receiptRecord.EntRecId)),
                          Collect(colAttachedReceipts, receiptRecord)
                      )
                  )
              );
              // Set preview vars to first receipt for backward compatibility UI
              If(
                  !IsEmpty(colAttachedReceipts),
                  Set(varReceiptImage, First(colAttachedReceipts).CapturedDocument);
                  Set(varFileFormat, First(colAttachedReceipts).FileExtension)
              );
              Clear(colSelectedExistingReceipts);
              Navigate('Expenses - Edit Screen', ScreenTransition.None, {locItemizeButtonVisibilityFlag: false})
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Size: =20
            Text: ="Done"
            Visible: =CountRows(colSelectedExistingReceipts) > 0
            Width: =Parent.Width - 80
            X: =40
            Y: ='attachmentControl - Expense_1'.Y - Self.Height - 20
      - scr10_btn_UploadDeviceFiles:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =RGBA(34, 102, 227, 1)
            Font: =Font.'Open Sans'
            Height: =72
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            OnSelect: |-
              =// 1. [단계 1] 파일 일괄 업로드 및 결과 수집 (Set 제거)
              // ForAll은 각 파일에 대한 API 호출 결과를 반환하며, 이를 colUploadResults 컬렉션에 저장합니다.
              ClearCollect(
                  colUploadResults,
                  ForAll(
                      colDeviceAttachedFile As f,
                      With(
                          {
                              // 바이너리 데이터 변환 로직 (중복 호출 방지 최적화)
                              jsonRaw: JSON(f.Value, JSONFormat.IncludeBinaryData)
                          },
                          With(
                              {
                                  // [수정] 구분자(',')가 있는지 확인 후 b64 추출
                                  b64: If(
                                      Find(",", jsonRaw) > 0,
                                      Mid(jsonRaw, Find(",", jsonRaw) + 1, Len(jsonRaw) - Find(",", jsonRaw) - 1),
                                      "" // 구분자 없으면 빈 값
                                  ),
                                  // [수정] 구분자(':', ';')가 모두 있는지 확인 후 contentType 추출
                                  contentType: If(
                                      Find(":", jsonRaw) > 0 && Find(";", jsonRaw) > 0,
                                      Mid(jsonRaw, Find(":", jsonRaw) + 1, Find(";", jsonRaw) - Find(":", jsonRaw) - 1),
                                      "application/octet-stream" // 기본 MIME 타입 설정
                                  ),
                                  ext: Lower(Last(Split(f.Name, ".")).Value),
                                  fileName: f.Name
                              },
                              // F&O API 호출 (이후 코드는 동일)
                              'Expense mobile master data (mserp)'.mserp_trvexpmobilemasterdataentity_uploadlargeimage(
                                  LookUp('Expense mobile master data (mserp)', Email = User().Email).'Expense mobile master data (mserp)',
                                  {
                                      imageBase64: b64,
                                      ContentType: contentType,
                                      FileExtension: ext,
                                      FileName: fileName
                                  }
                              )
                          )
                      )
                  )
              );

              // 2. [단계 2] 데이터 리프레시 및 앱 내 데이터 연결
              // 업로드가 완료된 후 데이터 소스를 1회만 갱신합니다. (성능 향상)
              Refresh('Expense Mobile Unattached Document Entity (mserp)');

              // 수집된 업로드 결과(colUploadResults)를 순회하며 실제 영수증 레코드를 찾아 colAttachedReceipts에 추가
              ForAll(
                  colUploadResults As resp,
                  With(
                      {
                          // API 응답에서 RecId 추출 (응답 구조에 따라 경로 확인 필요)
                          newId: Value(ParseJSON(resp.return).DocuRefRecId)
                      },
                      If(
                          !IsBlank(newId),
                          With(
                              {
                                  // 새로 생성된 영수증 조회
                                  newReceipt: LookUp('Expense Mobile Unattached Document Entity (mserp)', EntRecId = newId)
                              },
                              // 유효한 레코드이고 목록에 없으면 추가
                              If(
                                  !IsBlank(newReceipt) && IsBlank(LookUp(colAttachedReceipts, EntRecId = newReceipt.EntRecId)),
                                  Collect(colAttachedReceipts, newReceipt)
                              )
                          )
                      )
                  )
              );

              // 3. [단계 3] UI 상태 업데이트 및 화면 이동
              If(
                  !IsEmpty(colAttachedReceipts),
                  Set(varReceiptImage, First(colAttachedReceipts).CapturedDocument);
                  Set(varFileFormat, First(colAttachedReceipts).FileExtension)
              );

              // 임시 컬렉션 정리
              Clear(colDeviceAttachedFile);
              Clear(colFileSplit);
              Clear(colUploadResults); // 결과 컬렉션 초기화

              // 화면 이동
              Navigate('Expenses - Edit Screen', ScreenTransition.None, {locItemizeButtonVisibilityFlag: false})
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Size: =20
            Text: ="Upload & Done"
            Visible: =CountRows(colDeviceAttachedFile) > 0
            Width: =Parent.Width - 80
            X: =40
            Y: =scr10_btn_DoneMultiAttach.Y - Self.Height - 12
