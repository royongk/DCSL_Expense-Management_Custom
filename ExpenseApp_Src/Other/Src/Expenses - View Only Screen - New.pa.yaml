                              OnChange: "=UpdateContext({varSelectedItemOrService: Parent.Update});\n// Derive project type from 3-level category selection\nUpdateContext(\n    {\n        varSelectedProjectType: \n            LookUp(\n                'DCSL Expense Category Mapping Setup Entity (mserp)',\n                'Expense Type' = varSelectedExpenseType &&\n                'Purchase Category' = varSelectedPurchaseCategory &&\n                'Item or Service' = Parent.Update,\n                'Project Type'\n            )\n    }\n);\n// cmbItemOrService 컨트롤의 OnChange 속성\nUpdateContext({\n    locCurrentSetup: LookUp(\n        'DCSL Expense Category Mapping Setup Entity (mserp)',\n        'Expense Type' = scr030_ComboBox_ExpenseType.Selected.Value && \n        'Purchase Category' = scr030_ComboBox_PurchaseCategory.Selected.Value && \n        'Item or Service' = Self.Selected.Value\n    )\n});\n\n// 금액 필드 초기화 (선택 사항)\nReset(scr030_DataCardValue4_1);\n\n// Fixed Amount가 Yes(true)로 바뀌었을 때만 통화 콤보박스를 초기화\nIf(\n    locCurrentSetup.'Fixed Amount' = 'NoYes (mserp)'.Yes,\n    Reset(scr030_ComboBox1_12);\n    \n    // --- [수정] 환율 조회 및 LCY(KRW) 계산 로직 (캐싱된 컬렉션 활용) ---\n    If(\n        !IsBlank(scr030_ComboBox1_12.Selected.mserp_currencycode) && !IsBlank(varSelectedLegalEntity) && !IsBlank(locCurrentSetup.Amount),\n        \n        With(\n            {\n                // 1. 메모리에 캐싱된 컬렉션(colExchangeRates)에서 환율 즉시 조회\n                fetchedRate: LookUp(\n                    colExchangeRates,\n                    Currency = scr030_ComboBox1_12.Selected.mserp_currencycode\n                ).'Exchange rate',\n                \n                // 2. locCurrentSetup(설정 정보)의 Amount 값을 숫자로 변환\n                currentAmount: Value(locCurrentSetup.Amount)\n            },\n            \n            // 3. KRW 환산 금액 계산 및 로컬 변수(locCalculatedLCY) 저장\n            // [안전장치] Coalesce를 사용하여 환율 누락 시 계산식 오류 방지 및 반올림(Round) 적용\n            UpdateContext({ \n                locCalculatedLCY: Text(\n                    Round((currentAmount * Value(Coalesce(fetchedRate, 100))) / 100, 0)\n                )\n            })\n        )\n    )\n);"
