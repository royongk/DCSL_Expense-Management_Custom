                                    0   // 정상 상태에서는 두께를 1로 설정
                                )
                              Default: "=// 천단위 구분 기호 로직 수정\nWith(\n    {\n        baseAmount: If(\n            !IsBlank(locCurrentSetup.Amount) && locCurrentSetup.'Fixed Amount' = 'NoYes (mserp)'.Yes,\n            locCurrentSetup.Amount, \n            \n            // 핵심 변경: varSelectedExpenseDoc.'Transaction amount' 보다 파싱된 locOriginalAmount(100)를 우선 사용\n            Value(Coalesce(dirtyTransAmount, locOriginalAmount, Text(varSelectedExpenseDoc.'Transaction amount')))\n        )\n    },\n    If(\n        locIsEditingAmount, \n        Text(baseAmount, \"#\"),                   \n        Text(baseAmount, \"#,##0.00\", varDefaultLanguage) \n    )\n)"
                              DelayOutput: =true
                              DisplayMode: =DisplayMode.View
                              FocusedBorderThickness: =gblParams.dorpDownBorderThickness
                              Font: =Font.'Open Sans'
                              Format: |-
                                =//TextFormat.Number
                                TextFormat.Text
                              Height: =gblParams.dropDownHeight
                              HintText: ="Enter Expense amount"
                              HoverBorderColor: =
                              HoverFill: =gblParams.dropDownHoverFill
                              OnChange: "=// 1. 입력값에서 콤마를 제거한 '순수 숫자'를 임시 변수에 저장\nUpdateContext({ locTempAmount: Substitute(Self.Text, \",\", \"\") });\n\n// 2. 최대 금액 초과 여부 체크 및 알림\nIf(\n    !IsBlank(locCurrentSetup.'Max Amount') && \n    locCurrentSetup.'Max Amount' > 0 && \n    Value(locTempAmount) > locCurrentSetup.'Max Amount',\n    Notify(\"입력한 금액이 최대 허용 금액을 초과했습니다. 금액을 다시 확인해주세요.\", NotificationType.Error, 4000)\n);\n\n// 3. 실제 저장될 변수(dirtyTransAmount)에 '순수 숫자'만 업데이트\nUpdateContext({ dirtyTransAmount: locTempAmount });\n\n// --- [수정] 환율 조회 및 LCY(KRW) 계산 로직 (캐싱된 컬렉션 활용) ---\nIf(\n    !IsBlank(scr030_ComboBox1_12.Selected.mserp_currencycode) && !IsBlank(varSelectedLegalEntity) && !IsBlank(locTempAmount),\n    \n    With(\n        {\n            // 1. 메모리에 캐싱된 컬렉션(colExchangeRates)에서 환율 즉시 조회\n            fetchedRate: LookUp(\n                colExchangeRates,\n                Currency = scr030_ComboBox1_12.Selected.mserp_currencycode\n            ).'Exchange rate',\n            \n            // 2. 화면에 입력된 '현재 텍스트 값'을 실시간으로 가져와 강제 숫자 변환\n            currentAmount: Value(Substitute(scr030_DataCardValue4_1.Text, \",\", \"\"))\n        },\n        \n        // 3. 순수 계산 숫자만 변수에 저장 (무조건 100으로 나누고, Round 함수로 소수점 0자리까지만 남김)\n        // [안전장치] Coalesce를 사용하여 환율 누락 시 계산식 오류 방지\n        UpdateContext({ \n            locCalculatedLCY: Text(\n                Round((currentAmount * Value(Coalesce(fetchedRate, 100))) / 100, 0)\n            )\n        })\n    )\n);\n\n// 4. 편집 모드 종료\nUpdateContext({ locIsEditingAmount: false });\n\n// 5. 컨트롤 리셋 (이때 Default 로직이 돌아가며 천 단위 콤마가 예쁘게 적용됨)\nReset(Self);\n\n// 6. 기타 필수 상태 업데이트\nUpdateContext({isDirty : true});\nUpdateContext({varOnChangeTriggered : true});\n\n// \U0001F680 [가장 중요한 수정] 기존에 있던 아래 코드는 절대 사용하면 안 됩니다. 삭제했습니다.\n// UpdateContext({dirtyTransAmount : Self.Text}); \n\nUpdateContext({taxModifiedByUser:false});\nUpdateContext({msCallStartedForSalestaxCalculation : true});\n\nIf(\n    varOnChangeTriggered && varOnSelectTriggered,\n    UpdateContext({varOnShowFields : true})\n);\n\nReset(scr030_DataCardValue25_1);\nUpdateContext({msCallStartedForSalestaxCalculation : false});"
                              OnSelect: |-
                                =UpdateContext({ locIsEditingAmount: true }); // 편집 모드 시작
                                UpdateContext({varOnSelectTriggered: true})
                              PaddingLeft: =5
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Reset: =
                              Size: =24
                              Tooltip: =Parent.DisplayName
