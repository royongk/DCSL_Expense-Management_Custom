                              If(
                                  varIsCreate,
                                  LookUp(
                                      'DCSL Expense Category Mapping Setup Entity (mserp)',
                                      'Expense Type' = varSelectedExpenseType &&
                                      'Purchase Category' = varSelectedPurchaseCategory &&
                                      'Item or Service' = varSelectedItemOrService,
                                      'Expense category'
                                  ),
                                  Blank()
                              )
                          )
                        DisplayName: =DataSourceInfo([@'DCSL Expense Line Expense Moblie Entity (mserp)'],DataSourceInfo.DisplayName,'Expense category (mserp_costtype)')
                        Required: =true
                        Update: |-
                          =With(
                              {
                                  // Existing category from the current expense line (edit mode only)
                                  currentCategory: varSelectedExpenseDoc.'Expense category (mserp_costtype)',
                                  // Mapped category from 3-level selection
                                  mappedCategory: 
                                      LookUp(
                                          'DCSL Expense Category Mapping Setup Entity (mserp)',
                                          'Expense Type' = varSelectedExpenseType &&
                                          'Purchase Category' = varSelectedPurchaseCategory &&
                                          'Item or Service' = varSelectedItemOrService,
                                          'Expense category'
                                      )
                              },
                              With(
                                  {
                                      // Apply mapping only when it actually changes from the existing category
                                      isCategoryChanged:
                                          !IsBlank(currentCategory) &&
                                          !IsBlank(mappedCategory) &&
                                          mappedCategory <> currentCategory
                                  },
                                  Coalesce(
                                      // 1) User-selected category from scr030_ComboBox1_8
                                      If(
                                          !IsBlank(scr030_ComboBox1_8.Selected),
                                          scr030_ComboBox1_8.Selected.'Expense category',
                                          Blank()
                                      ),
                                      // 2) Mapped category when new or when 3-level selection changed
                                      If(
                                          IsBlank(currentCategory) || isCategoryChanged,
                                          mappedCategory,
                                          Blank()
                                      ),
                                      // 3) Fallback to curCategory (existing behavior for backward compatibility)
                                      curCategory,
                                      // 4) Final fallback: "Dummy for Expense" lookup
                                      If(
                                          !IsBlank(varSelectedLegalEntity),
                                          LookUp(
                                              'Expense category (mserp)',
                                              'Expense category' = "Dummy for Expense" &&
                                              'Company Code' = varSelectedLegalEntity,
                                              'Expense category'
                                          ),
