                              OnChange: "=UpdateContext({taxModifiedByUser:false});\nUpdateContext({varOnChangeTriggered : true});\nUpdateContext({msCallStartedForSalestaxCalculation : true});\nIf(\n    varOnChangeTriggered && varOnSelectTriggered,\n    UpdateContext({varOnShowFields : true})\n);\n// --- [수정] 환율 조회 및 LCY(KRW) 계산 로직 (직접 조회 방식) ---\nIf(\n    !IsBlank(scr030_DataCardValue4_1.Text) && !IsBlank(Self.Selected.mserp_currencycode),\n    \n    With(\n        {\n            // 1. 'Currency table (mserp)' 테이블에서 선택한 통화 코드(Currency)로 환율(Exchange rate) 조회\n            fetchedRate: LookUp(\n                colExchangeRates,\n                Currency = Self.Selected.mserp_currencycode\n            ).'Exchange rate',\n            \n            // 2. 화면에 입력된 외화 금액의 콤마(,)를 제거하고 숫자로 변환\n            currentAmount: Value(Substitute(scr030_DataCardValue4_1.Text, \",\", \"\"))\n        },\n        \n        // 3. KRW 환산 금액 계산 및 로컬 변수(locCalculatedLCY)에 저장\n        // 참고: 조회된 환율이 없을 경우(Blank) 수식 오류를 방지하기 위해 Coalesce로 기본값(100) 처리\n        UpdateContext({ \n            locCalculatedLCY: Text(\n                Round((currentAmount * Value(Coalesce(fetchedRate, 100))) / 100, 0)\n            )\n        })\n    )\n);\n/*\nIf(\n    varOnShowFields,\n    If(\n    !(IsBlank(scr030_ComboBox1_15.Selected.'Sales tax group') || IsBlank(scr030_ComboBox1_16.Selected.'Item sales tax group') || IsBlank(scr030_ComboBox1_12.Selected.mserp_currencycode) || IsBlank(Text(scr030_DateValue1_18.SelectedDate, \"yyyy-mm-dd HH:mm:ssZ\")) || IsBlank(scr030_DataCardValue4_1.Text) || IsBlank(scr030_DataCardValue39_1.Selected.Value)),\n    UpdateContext({\n        varSalesTaxAmount : \n        IfError(\n        Value('Expense mobile master data (mserp)'.mserp_getactualsalestaxamount(\n            LookUp('Expense mobile master data (mserp)',Email = User().Email,'Expense mobile master data (mserp)'),\n            {\n                TaxGroup : If(IsBlank(scr030_ComboBox1_15.Selected.'Sales tax group'), \"\",