Screens:
  Expenses - View Only Screen - New:
    Properties:
      Fill: =RGBA(248, 248, 248, 1)
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnHidden: |-
        =UpdateContext({ varRemainingAmount: 0 })
      OnVisible: "=// OnVisible 최상단에 조건문 추가\nIf(\n    !varIsAddingReceipt, // 첨부 파일 추가 중이 아닐 때만(즉, 처음 진입 시에만) 초기화\n    UpdateContext({ \n        locCurrentSetup: Blank(),\n        dirtyTransAmount: Blank(),\n        locIsEditingAmount: false,\n        locCategoryChange: false,\n        \n        // \U0001F680 [수정됨] 에러의 원인이었던 ctxTargetPurpose 관련 자기 참조 및 초기화 삭제 완료\n        \n        varViewOnly: false,\n        varStateSelected: Blank(),\n        varZipCodeSelectedRecId: -1,\n        varProjectHierarchyId: Blank(),\n        onReloadButtonClick: false,\n        // LCY 계산 결과 저장 변수 초기화 (기존 값이 있으면 사용, 없으면 빈 값)\n        // 1. 기존 LCY에 문자열로 저장된 값(\"100.00 USD\")에서 공백(\" \")을 기준으로 금액과 통화를 분리\n        locOriginalAmount: If(\n            !varIsCreate && !IsBlank(varSelectedExpenseDoc.LCY) && Find(\" \", varSelectedExpenseDoc.LCY) > 0, \n            Left(varSelectedExpenseDoc.LCY, Find(\" \", varSelectedExpenseDoc.LCY) - 1),\n            Blank()\n        ),\n        locOriginalCurrency: If(\n            !varIsCreate && !IsBlank(varSelectedExpenseDoc.LCY) && Find(\" \", varSelectedExpenseDoc.LCY) > 0, \n            Right(varSelectedExpenseDoc.LCY, Len(varSelectedExpenseDoc.LCY) - Find(\" \", varSelectedExpenseDoc.LCY)),\n            Blank()\n        ),\n        // 2. locCalculatedLCY에는 Value() 오류 방지를 위해, 실제로 환산된 '숫자'인 Transaction amount(예: 137601)를 저장\n        locCalculatedLCY: If(\n            !varIsCreate, \n            Text(varSelectedExpenseDoc.'Transaction amount'), \n            Blank()\n        )\n    })\n);\n\n// 신규 경비 작성 모드 진입 시(영수증 추가를 위한 리프레시 상태가 아닐 때) 임시 영수증 비우기\nIf(\n    varIsCreate && !varIsAddingReceipt,\n    Clear(colPendingReceipts);\n    Clear(colAttachedReceipts)\n);\n\n\n// 통화 데이터를 가져와서 미리 정렬한 뒤 'colSortedCurrencies'라는 컬렉션에 저장합니다.\nClearCollect(\n    colCurrencies,\n    'Currencies (mserp)'\n);\n\nClearCollect(\n    colSortedCurrencies,\n    Sort(\n        colCurrencies,\n        If(\n            IsBlank('Sort Order') Or 'Sort Order' = 0, \n            999999, \n            'Sort Order'\n        ),\n        SortOrder.Ascending\n    )\n);\n\n// 환율 정보 조회\nClearCollect(colExchangeRates, 'Currency table (mserp)');\n\nIf(\n    !varIsAddingReceipt, // 첨부 파일 추가 후 복귀한 상태가 아닐 때만 필드 초기화 실행\n\n    // 3-level category selection variables\n    UpdateContext({\n        varSelectedExpenseType: \n        If(\n            varIsCreate, \n            // 신규 생성 시 varAppMode에 따라 기본값 설정\n            Switch(\n                varAppMode,\n                \"ExpenseReport\", \"Expense Reimbursement\",\n                \"AirfareAllowance\", \"Allowance\",\n                \"BillingTripSettlement\", \"Billing Trip Settlement\",\n                \"EmployeeBenefit\", \"Employee Benefit\",\n                Blank()\n            ),\n            // 수정/조회 모드일 때는 저장된 기존 값 매핑됨\n            Coalesce(varSelectedExpenseDoc.'Expense Type', Blank())\n        )\n    });\n\n    // \U0001F680 [수정됨] 에러를 유발하던 locMatchedMapping 및 varForceLock 자동 주입 검증 로직 전체 삭제 완료\n\n    // 1. \U0001F680 [수정됨] 저장된 Item or Service 단순 할당 (View Only 최적화)\n    UpdateContext({\n        varSelectedItemOrService: Coalesce(varSelectedExpenseDoc.'Item or Service', Blank())\n    });\n\n    // 2. \U0001F680 [수정됨] 저장된 Purchase Category 단순 할당 (View Only 최적화)\n    UpdateContext({\n        varSelectedPurchaseCategory: Coalesce(varSelectedExpenseDoc.'Purchase Category', Blank())\n    });\n    \n    UpdateContext({varSelectedPurchaseCategoryValue: \"\"});\n    \n    // 3. Expense category 설정\n    UpdateContext({\n        curCategory: If(\n            !varIsCreate && !IsBlank(varSelectedExpenseDoc.'Expense category (mserp_costtype)'),\n            varSelectedExpenseDoc.'Expense category (mserp_costtype)',\n            // 신규 생성 시: 매핑 엔티티에서 3가지 조건으로 올바른 카테고리 실시간 조회\n            If(\n                varIsCreate && !IsBlank(varSelectedExpenseType) && !IsBlank(varSelectedItemOrService),\n                Coalesce(\n                    LookUp(\n                        'DCSL Expense Category Mapping Setup Entity (mserp)',\n                        'Expense Type' = varSelectedExpenseType &&\n                        'Purchase Category' = varSelectedPurchaseCategory &&\n                        'Item or Service' = varSelectedItemOrService,\n                        'Expense category'\n                    ),\n                    Blank()\n                ),\n                Blank()\n            )\n        )\n    });\n    \n    // Purchase Category가 세팅되었으므로, 하위 4단계인 Expense Category 컬렉션(colExpenseCategories) 미리 로드\n    If(\n        varIsCreate && !IsBlank(varSelectedExpenseType) && !IsBlank(varSelectedPurchaseCategory),\n        ClearCollect(\n            colExpenseCategories,\n            SortByColumns(\n                Filter(\n                    ForAll(\n                        Filter(\n                            'DCSL Expense Category Mapping Setup Entity (mserp)',\n                            !IsBlank('Expense category') &&\n                            'Expense Type' = varSelectedExpenseType &&\n                            'Purchase Category' = varSelectedPurchaseCategory &&\n                            (\n                                (varAppMode = \"AirfareAllowance\" && Airfare = 'NoYes (mserp)'.Yes) ||\n                                (varAppMode <> \"AirfareAllowance\" && Airfare = 'NoYes (mserp)'.No)\n                            )\n                        ) As MappingRecord,\n                        LookUp(\n                            'Expense category (mserp)',\n                            'Expense category' = MappingRecord.'Expense category' &&\n                            Inactive = 'NoYes (mserp)'.No\n                        )\n                    ),\n                    !IsBlank('Expense category') // 빈 레코드 제거\n                ),\n                \"mserp_expensecategory\",\n                SortOrder.Ascending\n            )\n        );\n        \n        // 4. 추가로 환율 및 고정금액 처리를 위한 현재 셋업(locCurrentSetup) 데이터 메모리 로드\n        UpdateContext({\n            locCurrentSetup: LookUp(\n                'DCSL Expense Category Mapping Setup Entity (mserp)',\n                'Expense Type' = varSelectedExpenseType && \n                'Purchase Category' = varSelectedPurchaseCategory && \n                'Item or Service' = varSelectedItemOrService\n            )\n        })\n    );\n    // Cost Center context\n    UpdateContext({varSelectedCostCenter: Blank()});\n    // TargetText context\n    UpdateContext({TargetText: \"\"});\n    If(\n        !varIsCreate && !IsBlank(varSelectedExpenseDoc.CostCenter),\n        UpdateContext({\n            varSelectedCostCenter: LookUp(\n                'DCSL HPRCostShareApproval Entity (mserp)',\n                'Dimension value' = varSelectedExpenseDoc.CostCenter\n            )\n        })\n    );\n    // Project context\n    UpdateContext({varSelectedProject: Blank()});\n    // Project type context\n    UpdateContext({varSelectedProjectType: Blank()});\n    If(\n        !varIsCreate && !IsBlank(varSelectedExpenseDoc.Project),\n        UpdateContext({\n            varSelectedProject: LookUp(\n                Filter(\n                    'DCSL Financial Dimension Master (mserp)',\n                    'Dimension name' = \"Project\"\n                ),\n                'Dimension value' = varSelectedExpenseDoc.Project\n            )\n        })\n    );\n);\n\n// Load existing Department and Benefit Type from Expense Category (reverse lookup)\nIf(\n    !varIsCreate && \n    !IsBlank(varSelectedExpenseDoc.'Expense Type') &&\n    (IsBlank(varSelectedExpenseType) || IsBlank(varSelectedPurchaseCategory) || IsBlank(varSelectedItemOrService)),\n    \n    With(\n        {\n            mappingRecord: LookUp(\n                'DCSL Expense Category Mapping Setup Entity (mserp)',\n                'Expense Type' = varSelectedExpenseDoc.'Expense Type' &&\n                'Purchase Category' = varSelectedExpenseDoc.'Purchase Category' &&\n                'Item or Service' = varSelectedExpenseDoc.'Item or Service'\n            )\n        },\n        If(\n            !IsBlank(mappingRecord),\n            UpdateContext({\n                varSelectedExpenseType: mappingRecord.'Expense Type'\n            });\n            UpdateContext({\n                varSelectedPurchaseCategory: mappingRecord.'Purchase Category'\n            });\n            UpdateContext({\n                varSelectedItemOrService: mappingRecord.'Item or Service'\n            })\n        )\n    )\n);\n\nUpdateContext({curIntercompanyLE: Coalesce(scr030_DataCardValue39_1.Selected.Value, varSelectedExpenseDoc.'Legal entity')});\nUpdateContext({curInterCompanyProjectCategory: varSelectedExpenseDoc.'Intercompany project category'});\nUpdateContext({curProjIdSelected: varSelectedExpenseDoc.'Project ID'});\nUpdateContext({curCountrySelected: varSelectedExpenseDoc.'Country/region (mserp_countryregion)'});\nUpdateContext({curStateSelected: varSelectedExpenseDoc.'State/province'});\nUpdateContext({curBillIssuedToSelected: varSelectedExpenseDoc.'Hotel bill issued to'});\nUpdateContext({taxModifiedByUser: false});\nUpdateContext({varLoadingSpinner : true});\n\nIf(\n    !varIsCreate && \n    !IsBlank(varSelectedExpenseDoc.'Expense category (mserp_costtype)') &&\n    varSelectedExpenseDoc.'Expense category (mserp_costtype)' <> \"\",\n    UpdateContext(\n        {\n            locItemizeButtonVisibilityFlag : 'Expense mobile master data (mserp)'.mserp_trvexpmobilemasterdataentity_isexpenseitemizable(LookUp('Expense mobile master data (mserp)',Email = User().Email).'Expense mobile master data (mserp)', \n            {\n                CostType: varSelectedExpenseDoc.'Expense category (mserp_costtype)',\n                SplitLineType:\"Default\",\n                LineType: If(varSelectedExpenseDoc.'Expense line type' = 'Expense line type (mserp)'.'Itemized header',\"ItemizedHeader\",\"Default\")\n            }).return\n\n        }\n    ),\n    UpdateContext({locItemizeButtonVisibilityFlag: false})\n);\n\nIf(\n    !varIsCreate && gblIsProjectValidationFlag,\n    Clear(colGetProjectsBasedOnResourceCategory);\n    UpdateContext({\n        varGetProjectsJson :\n        IfError(\n            Text(\n                'Projects (mserp)'.mserp_trvexpmobileprojentity_getprojectsbasedonresourcecategory(LookUp('Expense mobile master data (mserp)',Email = User().Email).'Expense mobile master data (mserp)',\n                    {\n                        employeeLegalEntity: varSelectedLegalEntity,\n                        interCompanyLegalEntity: curIntercompanyLE,\n                        categoryId: \n                        If(\n                            IsBlank(If(Upper(varSelectedLegalEntity) <> Upper(curIntercompanyLE), varSelectedExpenseDoc.'Intercompany project category', curCategory)),\n                            \"\",\n                            If(Upper(varSelectedLegalEntity) <> Upper(curIntercompanyLE), varSelectedExpenseDoc.'Intercompany project category', curCategory)\n                        )\n                    }).return\n            ),\n            \"\"\n        )\n    });\n    If(\n        !IsBlank(varGetProjectsJson),\n        ClearCollect(\n            colGetProjectsBasedOnResourceCategory,\n            ForAll(\n                MatchAll(varGetProjectsJson, \"\\{\"\"projId\"\":\"\"(?<projId>[^\"\"]*)\"\",\"\"projName\"\":\"\"(?<projName>[^\"\"]*)\"\"\\}\") As ProjectListFromCol,\n                {\n                    projectId: ProjectListFromCol.projId, \n                    projectName: ProjectListFromCol.projName\n                }\n            )\n        ),\n        Clear(colGetProjectsBasedOnResourceCategory)\n    );\n    \n    If(\n        !IsBlankOrError(curProjIdSelected),\n        UpdateContext({\n            varProjectHierarchyId:\n                LookUp(\n                    'Projects (mserp)',\n                    'Project ID' = curProjIdSelected,\n                    HierarchyId\n                )\n        })\n    );\n);\n\nUpdateContext({locItemizationCheck : locItemizeButtonVisibilityFlag});\nUpdateContext(\n    {\n        timerCostType: false,\n        timerProj: false,\n        timerHBIT: false,\n        timerCountry: false,\n        timerState: false,\n        locAllowNavigationBack: true\n    }\n);\n\n// populate the current expense type of the selected document\nUpdateContext(\n    {\n        currExpenseType: Coalesce(\n            varSelectedExpenseDoc.'Expense type',\n            If(\n                !IsBlank(varSelectedExpenseDoc.'Expense category (mserp_costtype)'),\n                LookUp(\n                    'Expense category (mserp)',\n                    'Expense category' = varSelectedExpenseDoc.'Expense category (mserp_costtype)',\n                    'Expense type'\n                ),\n                Blank()\n            )\n        )\n    }\n);\n\nIf(\n    !varIsCreate,\n    UpdateContext({msCallStartedForSalestaxCalculation: true});\n    UpdateContext({varOnShowFields: false});\n    UpdateContext({varOnSelectTriggered: false});\n    UpdateContext({varOnChangeTriggered: false});\n    \n);\n\nUpdateContext(\n    {\n        featureEnabled: If(\n            userRecord.IsReimaginedUIEnabled = 'NoYes (mserp)'.Yes,\n            \"True\",\n            \"False\"\n        ),\n        perdiemFeatureEnabled: If(\n            userRecord.IsReImaginedPerDiemEnabled = 'NoYes (mserp)'.Yes,\n            \"True\",\n            \"False\"\n        )\n    }\n);\n\n//Check if the itemization is over or under distributed\nIf(\n    !varIsCreate,\n    If(\n        varRemainingAmount < 0,\n        Notify(\n            GlobalLabels.Labels.'15062:LocalizedName,msdyn_ThisExpenseIsOverItemizedLabel',\n            NotificationType.Error,\n            gblParams.notificationTime\n        ),\n        varRemainingAmount > 0,\n        Notify(GlobalLabels.Labels.'15062:LocalizedName,msdyn_ThisExpenseIsNotCompletelyItemizedLabel',\n            NotificationType.Warning,\n            gblParams.notificationTime\n        )\n    )\n);\n\nIf(\n    currExpenseType = 'TrvExpType (mserp)'.'Per diem' && (featureEnabled = \"False\" || perdiemFeatureEnabled = \"False\"),\n    Notify(\n        GlobalLabels.Labels.'15062:LocalizedName,msdyn_PerdiemFeatureDisabledWarning',\n        NotificationType.Warning,\n        gblParams.notificationTime\n    )\n);\n\n//if labelTableLookUp not empty\nIf(\n    CountRows(labelTableLookUp) <= 0,\n    Collect(\n        labelTableLookUp,\n        { fieldName: \"CostType\", labelName: \"Expense category\", localisedLabelName: GlobalLabels.Labels.'15062:LocalizedName,msdyn_ExpenseCategoryLabel', visible: true, required: true },\n        { fieldName: \"TransDate\", labelName: \"Transaction date\", localisedLabelName: GlobalLabels.Labels.'15062:LocalizedName,msdyn_TransactionDateLabel', visible: true, required: true },\n        { fieldName: \"AmountCurr\", labelName: \"Transaction amount\", localisedLabelName: GlobalLabels.Labels.'15062:LocalizedName,msdyn_TransactionAmountLabel', visible: true, required: true },\n        { fieldName: \"ExchangeCode\", labelName: \"Currency\", localisedLabelName: GlobalLabels.Labels.'15062:LocalizedName,msdyn_CurrencyLabel', visible: true, required: true },\n        { fieldName: \"PayMethod\", labelName: \"Payment method\", localisedLabelName: GlobalLabels.Labels.'15062:LocalizedName,msdyn_PaymentMethodLabel', visible: true, required: true },\n        { fieldName: \"SubmitterJustification\", labelName: \"Employee justification\", localisedLabelName: GlobalLabels.Labels.'15062:LocalizedName,msdyn_EmployeeJustificationLabel', visible: false, required: false }\n    );\n    ForAll(\n        Filter(\n            '@ExpenseManagement:ExpenseMobileFieldVisibilityEntity (mserp)',\n            LegalEntityId = varSelectedLegalEntity\n        ) As VisibilityTable,\n        Collect(\n            labelTableLookUp,\n            {\n                fieldName: VisibilityTable.FieldName,\n                labelName: VisibilityTable.Labels,\n                localisedLabelName: VisibilityTable.LocalisedLabelName\n            }\n        )\n    );\n    If(\n        featureEnabled = \"True\",\n        ForAll(\n            Filter(\n                '@ExpenseManagement:ExpenseMobileFieldVisibilityEntity (mserp)',\n                LegalEntityId = varSelectedLegalEntity\n            ) As VisibilityTable,\n            Patch(\n                labelTableLookUp,\n                LookUp(\n                    labelTableLookUp,\n                    fieldName = VisibilityTable.FieldName\n                ),\n                {\n                    visible: VisibilityTable.VisibilityType <> 'ExpenseFieldVisibilityType (mserp)'.'Do not display',\n                    required: VisibilityTable.VisibilityType = 'ExpenseFieldVisibilityType (mserp)'.Required\n                }\n            )\n        ),\n        ForAll(\n            Filter(\n                'Display fields (mserp)',\n                'Company Code' = varSelectedLegalEntity\n            ) As VisibilityTable,\n            Patch(\n                labelTableLookUp,\n                LookUp(\n                    labelTableLookUp,\n                    fieldName = VisibilityTable.FieldName\n                ),\n                {\n                    visible: VisibilityTable.Visibility <> 'Visibility (mserp)'.'Do not display',\n                    required: false\n                }\n            )\n        )\n    )\n);\n\nUpdateContext({varLoadingSpinner : false});\nSet(varDefaultSalesTaxGroupCode, varSelectedExpenseDoc.'Sales tax group');\nSet(varItemSalesTaxDefaultValueCode, varSelectedExpenseDoc.'Item sales tax group');\nUpdateContext({varSalesTaxAmount: Coalesce(varSalesTaxAmount, varSelectedExpenseDoc.'Actual sales tax amount')});\nUpdateContext({msCallStartedForSalestaxCalculation: false});\nSet(IsreceiptALreadyCreated, false);\nSet(isProjIdCalledFromAttach, false);\n\nSet(\n    gblParams,\n    {\n        dropDownHeight: 60,\n        dorpDownBorderThickness: 2,\n        dropDownBorderColor: RGBA(34, 102, 227, 1),\n        dropDownLabelColor: Color.Black,\n        dropDownHoverFill: RGBA(204, 222, 255, 1),\n        errorMessageSize: 18,\n        dropDownFontSize: 24,\n        expenseDataCardViewOnly: RGBA(110, 110, 110, 1),\n        notificationTime: 4000\n    }\n);\n\nUpdateContext({isDirty: false});\nUpdateContext({categoryModified: false});\nUpdateContext({varDefaultItemSalesTaxError: \"\"});\nUpdateContext({varDefaultSalesTaxError: \"\"});\nUpdateContext({leModified: false});\nUpdateContext({varRatePerMile: \"\"});\nUpdateContext({varMileageTotal: \"\"});\nUpdateContext({locPerdiemAmountCurr: If(currExpenseType = 'TrvExpType (mserp)'.'Per diem', Text(varSelectedExpenseDoc.'Transaction amount'), Blank())});\nUpdateContext({varCurrentSelectedDate: If(varIsCreate, If(IsBlank(OCRresponse), Today(), OCRresponse.transDate), varSelectedExpenseDoc.'Transaction date')});\n\nSet(varDefaultSalesTaxGroupCode, varSelectedExpenseDoc.'Sales tax group');\nSet(varItemSalesTaxDefaultValueCode, varSelectedExpenseDoc.'Item sales tax group');\nUpdateContext({varSalesTaxAmount: Coalesce(varSalesTaxAmount, varSelectedExpenseDoc.'Actual sales tax amount')});\nSet(varCurMileage, varSelectedExpenseDoc.Mileage);\n\nUpdateContext({varCurVehicleType: varSelectedExpenseDoc.'Vehicle type'});\nUpdateContext({varCurNoOfPass: varSelectedExpenseDoc.'Number of passengers'});\nUpdateContext({varDefaultProjLineStatus: varSelectedExpenseDoc.Billable});\nUpdateContext({varZipCodeChanged: false});\nUpdateContext({varCityChanged: false});\nUpdateContext({varStateChanged: false});\nUpdateContext({varCountryChanged: false});\nUpdateContext({varProjectChanged: false});\nUpdateContext({varShowDeleteReceiptDialog: false});\nUpdateContext({varDeleteReceiptId: Blank()});\n\nUpdateContext({ locShowCopyPopup: false });\n\nSet(varCurrentD365User, LookUp('Expense mobile master data (mserp)', Email = User().Email));\n\nClearCollect(\n    colActiveDelegations,\n    Filter(\n        '@DEEX:DEEX_20316 (mserp)',\n        Delegate = varCurrentD365User.ID && \n        'Start date' <= Today() &&\n        'End date' >= Today()\n    )\n);\n\nClearCollect(\n    colCreatingWorkerOptions,\n    {\n        WorkerID: userRecord.CreatingWorker,\n        WorkerName: varCurrentD365User.ID & \" (MySelf)\" \n    }\n);\n\nForAll(\n    colActiveDelegations,\n    Collect(\n        colCreatingWorkerOptions,\n        {\n            WorkerID: ThisRecord.Employee, \n            WorkerName: ThisRecord.ID & \" (Delegate)\"\n        }\n    )\n);"
    Children:
      - scr030_ico_Back_4:
          Control: Classic/Icon@2.5.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =icongconfig_backbutton.Color
            Fill: =icongconfig_backbutton.Fill
            Height: =icongconfig_backbutton.Height
            Icon: =Icon.ChevronLeft
            OnSelect: |-
              =
              Switch(
                  varNavigatedFrom,
                  "scr17",
                  Navigate('Reports - Edit Screen'),
                  "scr17_Create",                         // [신규 추가]
                  Navigate('Reports - Edit Screen'),      // [신규 추가]
                  "scr20",
                  Navigate('Reports - View Only Screen'),
                  "scr18",
                  Navigate('Reports - Attach Expenses Screen'),
                  "scr19",
                  Navigate('Reports - View Attached Expenses Screen'),
                  Blank(),
                  Navigate('Expenses - List Screen')
              );
              UpdateContext({
                  varNavigatedFrom: Blank(),
                  ctxTargetPurpose: Blank() // 👇 [신규 추가] 화면을 벗어날 때 초기화
              });
              UpdateContext(
                  {
                      dirtyTransAmount : Blank(),
                      dirtyTransDate : Blank(),
                      dirtyMerchant : Blank(),    
                      varOnSelectTriggered: false,
                      varOnShowFields:false,
                      varOnChangeTriggered:false,
                      varSalesTaxAmount: Blank()
                  }
              );
            Visible: =false
            Width: =icongconfig_backbutton.Width
            X: =303
            Y: =19
      - scr030_img_NoReceiptOuter_1:
          Control: Image@2.2.3
          Properties:
            BorderColor: =RGBA(255, 0, 37, 0.2)
            BorderStyle: =BorderStyle.Dashed
            Fill: =RGBA(255, 255, 255, 1)
            Height: =Parent.Height / 4
            Image: |-
              =If(
                  varFileFormat in ["jpg", "bmp", "jpeg", "png", "heic", "tif", "tiff", "raw"] && !IsBlank(varReceiptImage),
                  varReceiptImage,
                  varFileFormat in ["xlsx", "xls"],
                  IconExcel,
                  varFileFormat in ["docx", "doc"],
                  IconWord,
                  varFileFormat = "pdf",
                  IconPDF,
                  varFileFormat = "txt",
                  IconTxt,
                  IconMail
              )
            ImagePosition: |-
              =If(
                  varFileFormat in ["jpg", "bmp", "jpeg", "png", "heic", "tif", "tiff", "raw"] && !IsBlank(varReceiptImage),
                  ImagePosition.Stretch,
                  ImagePosition.Center
              )
            RadiusBottomLeft: =18
            RadiusBottomRight: =18
            RadiusTopLeft: =18
            RadiusTopRight: =18
            Visible: =IsEmpty(colAttachedReceipts) && IsEmpty(colPendingReceipts) && !IsBlank(varReceiptImage)
            Width: |
              =Parent.Width -  Self.X*2
            X: =24
            Y: |-
              =If(
                  scr030_lbl_PolicyViolationWarning_1.Visible,
                  scr030_lbl_PolicyViolationWarning_1.Y + scr030_lbl_PolicyViolationWarning_1.Height + 27,
                  scr030_lbl_ValidationWarning_1.Y + scr030_lbl_ValidationWarning_1.Height + 27
              )
      - scr030_img_NoReceiptInner_1:
          Control: Image@2.2.3
          Properties:
            BorderColor: =RGBA(166, 166, 166, 1)
            BorderStyle: =BorderStyle.Dashed
            BorderThickness: =5
            Fill: =RGBA(255, 255, 255, 1)
            Height: =Parent.Height/5
            Image: =ImgWhite
            ImagePosition: =ImagePosition.Fill
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Visible: '=IsEmpty(colAttachedReceipts) && IsEmpty(colPendingReceipts) && IsBlank(varReceiptImage) '
            Width: |
              =Parent.Width -  Self.X*2
            X: =44
            Y: =scr030_img_NoReceiptOuter_1.Y +(scr030_img_NoReceiptOuter_1.Height-scr030_img_NoReceiptInner_1.Height)/2
      - scr030_lbl_AddReceipt_1:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(34, 102, 227, 1)
            DisplayMode: =If(varLoadingSpinner, DisplayMode.Disabled, DisplayMode.Edit)
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Semibold
            Height: =Parent.Height / 4
            OnSelect: |-
              =false
              /*
              Set(varSelectedReceiptNumber, Blank()); // [추가] 초기화
              // 기존 Navigate 코드에 컨텍스트 변수 추가
              UpdateContext({ varIsAddingReceipt: true });
              Navigate('Expenses - Capture Receipt Screen', ScreenTransition.None);
              UpdateContext(
                  {
                      varOnSelectTriggered: false,
                      varOnShowFields:false,
                      varOnChangeTriggered:false
                  }
              )
              */
            TabIndex: =0
            Text: |-
              =//GlobalLabels.Labels.'15062:LocalizedName,msdyn_AddReceiptLabel'
              If(
                  varAppMode = "AirfareAllowance",
                  "No Boarding pass, Itinerary, Receipt",
                  "No Receipt"
              )
            Visible: '=IsEmpty(colAttachedReceipts) && IsEmpty(colPendingReceipts) && IsBlank(varReceiptImage) '
            Width: |
