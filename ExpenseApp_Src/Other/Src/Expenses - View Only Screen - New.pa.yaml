                  - scr030_Project_DataCard:
                      Control: TypedDataCard@1.0.7
                      Variant: ClassicAllowedValuesStringEdit
                      Properties:
                        AllowedValues: |-
                          =If(
                              !IsBlank(varSelectedProjectType) && !IsBlank(varSelectedLegalEntity),
                              Filter(
                                  'DCSL ProjectTypeProjectValue Entity (mserp)',
                                  'Project Type' = varSelectedProjectType &&
                                  'Company Code' = Lower(varSelectedLegalEntity)
                              ),
                              []
                          )
                        BorderColor: =gblParams.dropDownBorderColor
                        DataField: ="mserp_deexproject"
                        Default: =varSelectedExpenseDoc.Project
                        DisplayName: ="Project code (required for billing trip)"
                        Required: "=If(\n    // HR 경비 3가지 유형 중 하나라도 해당되면\n    varAppMode in [\"AirfareAllowance\", \"EmployeeBenefit\", \"SalaryAdvance\"] || \n    varSelectedExpenseType in [\n        \"Airfare & Shipping Allowance Claim\", \n        \"Employee Benefits Claim\", \n        \"Employee Benefit\", \n        \"Salary Advance\", \n        \"Airfare Allowance\"\n    ],\n    false, // 숨김 처리\n    \n    // 그 외 일반 경비 유형은 표시\n    true\n)"
                        Update: |-
                          =If(
                              Self.Visible, 
                              scr030_ComboBox_Project.Selected.mserp_projectvalue, // 보일 때는 콤보박스의 선택된 값 전송
                              Blank()                                       // 숨겨졌을 때는 무조건 빈 값(Null) 전송
                          )
                        Visible: "=If(\n    // HR 경비 3가지 유형 중 하나라도 해당되면\n    varAppMode in [\"AirfareAllowance\", \"EmployeeBenefit\", \"SalaryAdvance\"] || \n    varSelectedExpenseType in [\n        \"Airfare & Shipping Allowance Claim\", \n        \"Employee Benefits Claim\", \n        \"Employee Benefit\", \n        \"Salary Advance\", \n        \"Airfare Allowance\"\n    ],\n    false, // 숨김 처리\n    \n    // 그 외 일반 경비 유형은 표시\n    true\n)"
                        Width: =Parent.Width
                        X: =0
                        Y: =projectFieldOrder_Y
                      Children:
                        - scr030_Project_DataCardKey:
                            Control: Label@2.5.1
                            Properties:
                              AutoHeight: =true
                              BorderColor: =RGBA(0, 0, 0, 1)
                              Color: =gblParams.dropDownLabelColor
                              Font: =Font.'Segoe UI'
                              Height: =48
                              Text: =Parent.DisplayName
                              Width: =Parent.Width - 60
                              Wrap: =false
                              X: =30
                              Y: =10
                        - scr030_ComboBox_Project:
                            Control: Classic/ComboBox@2.4.0
                            Properties:
                              AccessibleLabel: =Concatenate("Select ", Parent.DisplayName)
                              BorderColor: |-
                                =If(
                                    !IsBlank(Parent.Error), 
                                    Color.Red,  // 조건 1: 저장 시도 후 시스템/유효성 검사 에러가 발생한 경우

                                    Parent.Visible && Parent.Required && IsBlank(Parent.Update), 
                                    Color.Red,  // 조건 2: 화면에 보이고 필수 항목인데 아직 값을 입력하지 않은 경우

                                    RGBA(166, 166, 166, 1) // 기본값: 위 두 조건에 모두 해당하지 않는 경우 (정상 상태)
                                )
                              BorderThickness: |-
                                =If(
                                    !IsBlank(Parent.Error) || (Parent.Visible && Parent.Required && IsBlank(Parent.Update)), 
                                    2,  // 에러가 있거나( || ) 필수 항목이 비어있으면 두께를 2로 설정
                                    0   // 정상 상태에서는 두께를 1로 설정
                                )
                              ChevronBackground: =RGBA(56, 96, 178, 1)
                              ChevronFill: =RGBA(255, 255, 255, 1)
                              ChevronHoverBackground: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                              ChevronHoverFill: =RGBA(255, 255, 255, 1)
                              DefaultSelectedItems: "=If(\n    // 1. 복사 모드이면서 원본 데이터에 Project 정보가 있는 경우 (※ 필드명은 실제 원본 데이터에 맞게 조정: 예: 'Project code')\n    !IsBlank(varSelectedExpenseDoc.Project),\n    \n    // 2. With 함수로 Items와 동일한 원본 가상 엔터티에서 해당 프로젝트 레코드를 1건 찾음\n    With(\n        {\n            matchedProj: LookUp(\n                'DCSL ProjectTypeProjectValue Entity (mserp)',\n                mserp_projectvalue = varSelectedExpenseDoc.Project && // 원본 식별자와 매핑\n                'Company Code' = Lower(varSelectedLegalEntity)\n            )\n        },\n        If(\n            !IsBlank(matchedProj),\n            // 3. \U0001F680 핵심: Items 속성의 AddColumns 결과와 완벽하게 동일한 구조의 테이블 생성\n            Table(\n                {\n                    mserp_projectvalue: matchedProj.mserp_projectvalue,\n                    mserp_projectname: matchedProj.mserp_projectname,\n                    DisplayName: matchedProj.mserp_projectvalue & \" - \" & matchedProj.mserp_projectname\n                }\n            ),\n            Blank()\n        )\n    ),\n    \n    // 4. 복사 모드가 아닐 경우의 기존 로직\n    Blank()\n)"
                              DisplayFields: =["DisplayName"]
                              DisplayMode: |-
                                =If(
                                    varIsCopyMode, 
                                    DisplayMode.Edit,       // 복사 모드일 때는 강제로 활성화(편집 가능)
