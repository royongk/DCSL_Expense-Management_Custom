      - scr030_btn_ExecutePostSubmit:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =RGBA(56, 96, 178, 1)
            Font: =Font.'Open Sans'
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            OnSelect: "=// ==========================================\n// [공통 후속 처리 및 화면 이동 전용 숨김 버튼]\n// ==========================================\n\n// 6. 첨부 파일 목록 갱신 (서버 조회를 생략하여 무한 로딩 및 에러 원천 차단)\nIf(\n    !IsBlank(varTargetExpTransNumber),\n\n    // [단계 1] Attached 파일들 먼저 담기\n    ClearCollect(\n        colAttachedReceipts,\n        ForAll(\n            Filter(\n                'Expense Mobile Attached Document Entity (mserp)',\n                'Reference record ID' = Value(varSubmittedExpRecId)\n            ),\n            {\n                mserp_entrecid: EntRecId,\n                mserp_captureddocument: CapturedDocument,\n                mserp_fileextension: FileExtension,\n                mserp_filename: Description,\n                mserp_createddatetime: CreatingDateTime \n            }\n        )\n    );\n    \n    // [단계 2] Unattached 파일(방금 추가한 것) 메모리에서 바로 추가\n    Collect(\n        colAttachedReceipts,\n        ForAll(\n            colPendingReceipts As CurrentReceipt,\n            {\n                mserp_entrecid: CurrentReceipt.mserp_entrecid,\n                mserp_captureddocument: CurrentReceipt.mserp_captureddocument,\n                mserp_fileextension: CurrentReceipt.mserp_fileextension,\n                mserp_filename: Coalesce(\n                    CurrentReceipt.mserp_filename, \n                    Concatenate(\"Receipt-\", Text(CurrentReceipt.mserp_entrecid))\n                ),\n                mserp_createddatetime: Now()\n            }\n        )\n    );\n    \n    // [단계 3] 최종 결과 정렬 (내림차순)\n    ClearCollect(\n        colAttachedReceipts,\n        SortByColumns(\n            colAttachedReceipts,\n            \"mserp_createddatetime\", \n            SortOrder.Descending\n        )\n    )\n);\n\n// 7. 상태 변수 초기화 (⚠️ Self.LastSubmit 대신 scr030_EditExpenseForm.LastSubmit 으로 명시적 변경)\nSet(varIsCreate, false);\nSet(varSelectedExpenseDoc, scr030_EditExpenseForm.LastSubmit);\nUpdateContext({varSubmittedExpTransNumber: \"\"});\nUpdateContext({varSubmittedExpRecId: Blank()});\nSet(isExpenseReceiptAttached, false);\nSet(OCRresponse, Blank());\nSet(gblNavigationDrawerVisibility, false);\nUpdateContext({ctxTargetPurpose: Blank()});\nUpdateContext({ctxTargetReqLineRecId: Blank()});\n\n// 8. 컬렉션 정리 (이제 안전한 시점에 비워집니다)\nClear(colPendingReceipts);\n\n// 로딩 표시 종료\nUpdateContext({varLoadingSpinner: false});\n\n// --- 10. 성공 메시지 및 화면 이동 파트 ---\nIf(\n    locWasCreate, \n    Notify(GlobalLabels.Labels.'15062:LocalizedName,msdyn_ExpenseCreateMessageLabel', NotificationType.Success, gblParams.notificationTime),\n    If(isDirty || isExpenseReceiptAttached, Notify(GlobalLabels.Labels.'15062:LocalizedName,msdyn_ExpenseUpdateMessageLabel', NotificationType.Success, gblParams.notificationTime))\n);\n\n// Report에서 직접 Create를 타고 들어와 생성에 성공한 경우 리포트에 자동 Attach 처리\nIf(\n    locWasCreate && varNavigatedFrom = \"scr17_Create\" && !IsBlank(varSelectedReport),\n    Collect(colAttachedExpenses, scr030_EditExpenseForm.LastSubmit);\n    Patch(\n        'DCSL Expense Moblie Report (mserp)',\n        LookUp('DCSL Expense Moblie Report (mserp)', 'Expense report number' = varSelectedReport.'Expense report number'),\n        { ExpTransNumber: Concat(colAttachedExpenses, 'Expense transaction number (mserp_exptransnumber)', \",\") }\n    );\n    UpdateContext({varExpenseReportNumber: varSelectedReport.'Expense report number'});\n    Set(varSelectedReport, LookUp('DCSL Expense Moblie Report (mserp)', 'Expense report number' = varExpenseReportNumber));\n    Refresh('DCSL Expense Line Expense Moblie Entity (mserp)');\n    ClearCollect(\n        colAttachedExpensesForReport, \n        Filter('DCSL Expense Line Expense Moblie Entity (mserp)', 'Expense report number (mserp_expnumber)' = varSelectedReport.'Expense report number' && 'Expense line type' <> 'Expense line type (mserp)'.'Itemized line')\n    );\n    ClearCollect(colAttachedExpenses, colAttachedExpensesForReport)\n);\n\nIf(\n    gblItemizeExpenseButtonClick,\n    Set(IsCreditcardTransactionInLocalCurrency, LookUp('DCSL Expense Line Expense Moblie Entity (mserp)', 'Expense transaction number (mserp_exptransnumber)' = varSelectedExpenseDoc.'Expense transaction number (mserp_exptransnumber)', IsCreditcardTransactionInLocalCurrency));\n    ClearCollect(dsItemizations, AddColumns(GroupBy(Filter('DCSL Expense Line Expense Moblie Entity (mserp)', 'Expense line type' = 'Expense line type (mserp)'.'Itemized line' && 'Expense transaction number (mserp_itemizedline_exptransnumber)' = varSelectedExpenseDoc.'Expense transaction number (mserp_exptransnumber)'), 'Itemization group', Itemization), StartDate, Text(Last(SortByColumns(Itemization, \"mserp_transdate\", SortOrder.Descending)).'Transaction date', \"yyyy-mm-dd hh:mm:ssZ\"), DailyRate, If(IsCreditcardTransactionInLocalCurrency = 'NoYes (mserp)'.No, First(Itemization).'Transaction amount', First(Itemization).'Local amount'), Quantity, CountRows(Itemization), SubCategoryName, First(Itemization).'Expense subcategory name', SubCategoryRecId, First(Itemization).'Expense subcategory', ItemizationGroupId, mserp_expenseitemizationgroupid))\n);\n\n// --- 화면 네비게이션 처리 ---\nIf(\n    locAllowNavigationBack,\n    If(\n        locWasCreate, \n        If(\n            varNavigatedFrom = \"scr17_Create\",\n            Navigate('Reports - Edit Screen'), \n            Navigate('Expenses - List Screen')\n        ),\n        If(\n            !IsBlank(varNavigatedFrom),\n            UpdateContext({varExpenseReportNumber: varSelectedReport.'Expense report number'});\n            Set(varSelectedReport, LookUp('DCSL Expense Moblie Report (mserp)', 'Expense report number' = varExpenseReportNumber));\n            ClearCollect(colAttachedExpensesForReport, Filter('DCSL Expense Line Expense Moblie Entity (mserp)', 'Expense report number (mserp_expnumber)' = varSelectedReport.'Expense report number' && 'Expense line type' <> 'Expense line type (mserp)'.'Itemized line'));\n            ClearCollect(colAttachedExpenses, colAttachedExpensesForReport);\n            If(\n                gblItemizeExpenseButtonClick,\n                Navigate('Itemization - Detail Screen', Transition.None, {varNavigatedFrom: varNavigatedFrom, varItemizationScreen: \"itemizationDetailScreen\"}),\n                Switch(varNavigatedFrom, \n                    \"scr17\", Navigate('Reports - Edit Screen'), \n                    \"scr17_Create\", Navigate('Reports - Edit Screen'),\n                    \"scr20\", Navigate('Reports - View Only Screen'), \n                    \"scr18\", Navigate('Reports - Attach Expenses Screen'), \n                    \"scr19\", Navigate('Reports - View Attached Expenses Screen'), \n                    Navigate('Expenses - List Screen')\n                )\n            );\n            UpdateContext({varNavigatedFrom: Blank()}),\n            Navigate('Expenses - List Screen')\n        )\n    ),\n    Navigate('Expenses - List Screen', ScreenTransition.None)\n);\n\nUpdateContext({dirtyTransAmount: Blank(), dirtyTransDate: Blank(), dirtyMerchant: \"\", varOnSelectTriggered: false, varOnShowFields: false, varOnChangeTriggered: false, varSalesTaxAmount: Blank(), msCallStartedForSalestaxCalculation: false});\nSet(gblItemizeExpenseButtonClick, false)"
