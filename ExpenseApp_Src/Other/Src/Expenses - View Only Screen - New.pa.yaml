                  - scr030_Expense Beneficiary_DataCard1:
                      Control: TypedDataCard@1.0.7
                      Variant: ClassicTextualMultilineEdit
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        DataField: ="mserp_deexbeneficiary"
                        Default: "=If(\n    // 1순위: 복사 모드일 경우 원본 레코드의 JSON 문자열 데이터를 그대로 가져옴\n    varIsCopyMode && !IsBlank(varSelectedExpenseDoc.'Expense Beneficiary'),\n    varSelectedExpenseDoc.'Expense Beneficiary', \n    \n    // 2순위: 일반 수정(Edit) 모드이거나 순수 신규(Create) 작성인 경우\n    ThisItem.'Expense Beneficiary'\n)"
                        DisplayName: =DataSourceInfo([@'DCSL Expense Line Expense Moblie Entity (mserp)'],DataSourceInfo.DisplayName,'Expense Beneficiary')
                        Height: =scr030_ErrorMessage24.Y + scr030_ErrorMessage24.Height + 5
                        Required: =false
                        Update: "=With(\n    {\n        // 1. 본인 포함 여부 (true면 1, false면 0)\n        valMySelf: If(scr030_Toggle_MySelf.Value, 1, 0),\n        \n        // 2. 다른 직원 선택 수 (선택 항목이 없거나 오류 발생 시 0)\n        valOtherStaffCount: IfError(CountRows(scr030_cmb_OtherStaff.SelectedItems), 0),\n\n        // 3. 다른 직원 숫자 선택 (숫자 변환 실패 시 0)\n        valNoOfOtherStaff: IfError(Value(scr030_txt_NoOfOtherStaff.Text), 0),\n        \n        // 4. 학생(Primary) 수 (숫자 변환 실패 시 0)\n        valStudentPrimary: IfError(Value(scr030_txt_StudentPrimary.Text), 0),\n        \n        // 5. 학생(Senior) 수 (숫자 변환 실패 시 0)\n        valStudentSenior: IfError(Value(scr030_txt_StudentSenior.Text), 0)\n    },\n    JSON(\n        {\n            TotalBeneficiaries: valMySelf + valOtherStaffCount + valStudentPrimary + valStudentSenior,\n            MySelf: scr030_Toggle_MySelf.Value,\n            OtherStaff: Concat(scr030_cmb_OtherStaff.SelectedItems, Name, \",\"), \n            NumberOfOtherStaff: valNoOfOtherStaff,\n            StudentPrimary: valStudentPrimary,\n            StudentSenior: valStudentSenior\n        },\n        JSONFormat.Compact\n    )\n)"
                        Visible: |-
                          =If(
                              varAppMode in ["EmployeeBenefit", "AirfareAllowance"],
                              false,
                              true
                          )
                        Width: =Parent.Width
                        X: =0
                        Y: =62
                      Children:
                        - scr030_con_Beneficiary_Layout:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =RGBA(248, 248, 248, 1)
                              Height: "=With({\n    _gap: 15,\n    _padding: 10, // scr030_con_Beneficiary_Layout 자체의 위아래 패딩(5 + 5)\n    c1: If(scr030_DataCardKey_MySelf.Visible, scr030_DataCardKey_MySelf.Height, 0),\n    c2: If(scr030_Toggle_MySelf.Visible, scr030_Toggle_MySelf.Height, 0),\n    c3: If(scr030_DataCardKey_OtherStaff.Visible, scr030_DataCardKey_OtherStaff.Height, 0),\n    c4: If(scr030_cmb_OtherStaff.Visible, scr030_cmb_OtherStaff.Height, 0),\n    c5: If(scr030_DataCardKey_NoOfOtherStaff.Visible, scr030_DataCardKey_NoOfOtherStaff.Height, 0),\n    c6: If(scr030_txt_NoOfOtherStaff.Visible, scr030_txt_NoOfOtherStaff.Height, 0),\n    \n    // 핵심 수정: 하위 컨테이너의 Height 속성을 믿지 않고, 실제 컨트롤(Label, TextInput) 높이를 직접 계산\n    c7: If(scr030_con_Student_Row.Visible, \n           Max(\n               scr030_DataCardKey_StudentPrimary.Height + scr030_txt_StudentPrimary.Height + 16, // 16은 Primary 컨테이너 자체 패딩\n               scr030_DataCardKey_StudentSenior.Height + scr030_txt_StudentSenior.Height + 16    // 16은 Senior 컨테이너 자체 패딩\n           ) + 16, // 16은 scr030_con_Student_Row 자체의 상하 패딩 (8 + 8)\n           0)\n},\n    // 모든 컨트롤의 높이 합산\n    c1 + c2 + c3 + c4 + c5 + c6 + c7 + \n    // 보여지는 컨트롤 개수에 따른 Gap 정확히 계산\n    (Max(0, (If(c1>0, 1, 0) + If(c2>0, 1, 0) + If(c3>0, 1, 0) + If(c4>0, 1, 0) + If(c5>0, 1, 0) + If(c6>0, 1, 0) + If(c7>0, 1, 0)) - 1) * _gap) + \n    // 메인 컨테이너 위아래 여백\n    _padding\n)"
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =15
                              PaddingBottom: =5
                              PaddingLeft: =25
                              PaddingRight: =5
                              PaddingTop: =5
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Visible: =Parent.Visible
                              Width: =Parent.Width
                              Y: =scr030_lbl_ExpenseBeneficiaries_title.Y + scr030_lbl_ExpenseBeneficiaries_title.Height + 10
                            Children:
                              - scr030_DataCardKey_MySelf:
                                  Control: Label@2.5.1
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Stretch
                                    AutoHeight: =true
                                    BorderColor: =RGBA(0, 0, 0, 1)
                                    Color: =gblParams.dropDownLabelColor
                                    Font: =Font.'Open Sans'
                                    Height: =48
