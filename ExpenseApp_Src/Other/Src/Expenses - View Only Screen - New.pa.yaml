                        DisplayMode: |
                          =DisplayMode.Edit
                        Icon: =Icon.Sync
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        OnSelect: "=// if it is of meal type per trip, then invoke odata action to get amountCurr values\nUpdateContext({msCallStartedForSalestaxCalculation : true});\nIf(\n    userRecord.IsReImaginedPerDiemEnabled  = 'NoYes (mserp)'.Yes,\n    Clear(dsPerdiemActionResponse);\n    UpdateContext({onReloadButtonClick : true});\n    \n    UpdateContext(\n    {\n        locPerdiemActionResponse : 'Expense mobile master data (mserp)'.mserp_trvexpmobilemasterdataentity_calcmealpertripreduction(LookUp('Expense mobile master data (mserp)',Email = User().Email,'Expense mobile master data (mserp)'),\n        {\n            DateFrom: Text('scr030_Per diem from date_DataCard1'.Update, \"yyyy-mm-dd HH:mm:ss\"),\n            DateTo: Text('scr030_Per diem to date_DataCard1'.Update, \"yyyy-mm-dd HH:mm:ss\"),\n            CostType: \"Perdiem\",\n            Location: scr030_cmbPerdiemLocation.Selected.EntRecId,\n            DedBreakfast: scr030_DataCardValue1.Text,\n            DedLunch: scr030_DataCardValue2.Text,\n            DedDinner: scr030_DataCardValue3.Text\n        }).return\n    }\n    );\n    UpdateContext({locPerdiemActionResponse : Concatenate(\"[\", locPerdiemActionResponse, \"]\")});\n    ForAll(\n    Table(\n        ParseJSON(\n            locPerdiemActionResponse\n        )\n    ),\n    Collect(\n        dsPerdiemActionResponse,\n        {\n            amountCurr: Text(ThisRecord.Value.AmountCurr),       \n            amountMST : Text(ThisRecord.Value.AmountMST),\n            exchangeCode : Text(ThisRecord.Value.ExchangeCode),\n            warnings : Text(ThisRecord.Value.Warnings)\n        }\n    )\n    );\n    If(\n    !IsBlank(First(dsPerdiemActionResponse).warnings),\n    // there are errors in odata action show them\n    Notify(\n        Text(First(dsPerdiemActionResponse).warnings),\n        NotificationType.Warning,\n        gblParams.notificationTime\n    ),\n    // no errors, proceed to calculate tax based on the latest fetched transaction amount from odata action\n    UpdateContext({locPerdiemAmountCurr : First(dsPerdiemActionResponse).amountCurr});\n    If(\n        !IsBlank(scr030_ComboBox1_15.Selected) && !IsBlank(scr030_ComboBox1_16.Selected),\n        //if sales tax group and item sales tax group are not blank issue a call to get the sales tax amount \n        UpdateContext({taxModifiedByUser:false});\n        /*\n        UpdateContext\n        (\n            {\n                varSalesTaxAmount : \n                IfError(\n                    Value(\n                        'Expense mobile master data (mserp)'.getactualsalestaxamount(\n                        LookUp('Expense mobile master data (mserp)',Email = User().Email,'Expense mobile master data (mserp)'),\n                        {\n                            TaxGroup : If(IsBlank(scr030_ComboBox1_15.Selected.'Sales tax group'), \"\", scr030_ComboBox1_15.Selected.'Sales tax group'),\n                            TaxItemGroup : If(IsBlank(scr030_ComboBox1_16.Selected.'Item sales tax group'), \"\", scr030_ComboBox1_16.Selected.'Item sales tax group'),\n                            ExchangeCode : If(IsBlank(scr030_ComboBox1_12.Selected.mserp_currencycode), \"\", scr030_ComboBox1_12.Selected.mserp_currencycode),\n                            TransDate : If(IsBlank(Text(scr030_DateValue1_18.SelectedDate, \"yyyy-mm-dd HH:mm:ssZ\")), \"\", Text(scr030_DateValue1_18.SelectedDate, \"yyyy-mm-dd HH:mm:ssZ\")),\n                            AmountCurr : If(IsBlank(First(dsPerdiemActionResponse).amountCurr), \"0\", First(dsPerdiemActionResponse).amountCurr),\n                            LegalEntity : If(IsBlank(scr030_DataCardValue39_1.Selected.Value),\"\",Text(scr030_DataCardValue39_1.Selected.Value)),\n                            TaxIncluded : If('scr030_Tax included_DataCard1_3'.Visible,If(scr030_Toggle1_1.Value, \"Yes\", \"No\"),If(LookUp('Expense management parameters (mserp)','Company Code'=varDefaultLegalEntity,'Tax included')='NoYes (mserp)'.Yes,\"Yes\", \"No\"))\n                        }).return,\"en-US\"\n                    ),\n                    UpdateContext(\n                        {\n                            varErrorActualTaxCal : \n                            Substitute(\n                                Match(\n                                    FirstError.Details.HttpResponse,\n                                    \"\"\"message\"\":\"\"([^\"\"]*)\"\"\"\n                                ).FullMatch,\n                                \"\"\"message\"\":\"\"\",\n                                \"\"\n                            )      \n                        }\n                    )\n                )\n            }\n        );\n        */\n        // show errors if any\n        If(\n            !IsBlank(varErrorActualTaxCal),\n            Notify(\n                Left(varErrorActualTaxCal,Len(varErrorActualTaxCal)-1),\n                NotificationType.Error,\n                gblParams.notificationTime\n            )\n        )\n    );\n    );\n    \n    ,\n    Notify(\n        GlobalLabels.Labels.'15062:LocalizedName,msdyn_PerdiemFeatureDisabledWarningOnCreate',\n        NotificationType.Error,\n        gblParams.notificationTime\n    )\n);\nUpdateContext({msCallStartedForSalestaxCalculation : false})"
                        PaddingBottom: =15
