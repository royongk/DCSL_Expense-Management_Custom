                        DisplayMode: "=If(\n    // 1. 기존 조건: 일당(Per diem) 경비인 경우\n    currExpenseType = 'TrvExpType (mserp)'.'Per diem' || \n    \n    // 2. \U0001F680 [신규 추가] 고정 금액이 설정된 카테고리인 경우\n    !IsBlank(locCurrentSetup.Amount) && \n    locCurrentSetup.'Fixed Amount' = 'NoYes (mserp)'.Yes,\n    \n    // 위 조건 중 하나라도 맞으면 읽기 전용(수정 불가)\n    DisplayMode.View,\n    \n    // 일반적인 상황에서는 편집 가능\n    DisplayMode.Edit\n)"
                        DisplayName: ="Expense amount"
                        Required: =currExpenseType <> 'TrvExpType (mserp)'.'Per diem'
                        Update: "=// 천단위 구분 기호 해제 로직 포함\n/*\nValue(\n    // 일반 경비인 경우 입력된 텍스트 사용\n    If(IsBlank(scr030_DataCardValue4_1.Text) || Value(scr030_DataCardValue4_1.Text) = 0,\n        Blank(),\n        // [중요] 텍스트 입력값(\"1,000\")을 숫자(1000)로 변환\n        Substitute(scr030_DataCardValue4_1.Text, \",\", \"\") // 입력된 텍스트에서 쉼표(,)를 모두 빈값으로 치환\n    ),\n    varDefaultLanguage\n)\n*/\nValue(\n    If(\n        // 계산된 LCY 값(locCalculatedLCY)이 존재하면 해당 환산 금액을 우선 저장\n        !IsBlank(locCalculatedLCY),\n        locCalculatedLCY,\n        \n        // 계산된 값이 없다면 기존처럼 텍스트 박스에 입력된 값을 숫자로 변환하여 저장\n        If(IsBlank(scr030_DataCardValue4_1.Text) || Value(scr030_DataCardValue4_1.Text) = 0,\n            Blank(),\n            Substitute(scr030_DataCardValue4_1.Text, \",\", \"\")\n        )\n    ),\n    varDefaultLanguage\n)"
                        Visible: =true && currExpenseType <> 'TrvExpType (mserp)'.Mileage && !(scr030_Breakfast_DataCard1.Visible)
                        Width: =Parent.Width/2 - 10
                        X: =0
                        Y: =transactionAmountFieldOrder_Y
                      Children:
                        - scr030_DataCardKey4_1:
                            Control: Label@2.5.1
                            Properties:
                              AutoHeight: =true
                              BorderColor: =RGBA(0, 0, 0, 1)
                              Color: =gblParams.dropDownLabelColor
                              FocusedBorderThickness: =
                              Font: =Font.'Segoe UI'
