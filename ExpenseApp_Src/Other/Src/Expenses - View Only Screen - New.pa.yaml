                              - scr030_Toggle_MySelf:
                                  Control: Classic/Toggle@2.1.0
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Start
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    Default: |-
                                      =If(
                                          !IsBlank('scr030_Expense Beneficiary_DataCard1'.Default),
                                          IfError(Boolean(ParseJSON('scr030_Expense Beneficiary_DataCard1'.Default).MySelf), false),
                                          true
                                      )
                                    FalseText: ="No"
                                    Font: =Font.'Open Sans'
                                    LabelPaddingLeft: =10
                                    TrueFill: =RGBA(56, 96, 178, 1)
                                    TrueText: ="Yes"
                                    X: =30
