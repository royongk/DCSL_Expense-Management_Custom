                                        //parse for 12 hour time 
                                        First(Split(First(LastN(Split(varSelectedExpenseDoc.'Per diem to date', " "), 2)).Value, ":")).Value,
                                        // parse for 24 hour time
                                        If(
                                            Mod(Value(First(Split(Last(Split(varSelectedExpenseDoc.'Per diem to date', " ")).Value, ":")).Value), 12) = 0,
                                            "12",
                                            Text(Mod(Value(First(Split(Last(Split(varSelectedExpenseDoc.'Per diem to date', " ")).Value, ":")).Value), 12))
