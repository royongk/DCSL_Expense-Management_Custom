                  - Category description_DataCard1_2:
                      Control: TypedDataCard@1.0.7
                      Variant: ClassicTextualEdit
                      Properties:
                        BorderColor: =gblParams.dropDownBorderColor
                        DataField: ="mserp_description"
                        Default: =varExpenseAgainstWorkItem.'Category description'
