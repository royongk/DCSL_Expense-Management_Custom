Screens:
  Expenses - View Only Screen:
    Properties:
      Fill: =RGBA(248, 248, 248, 1)
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: "=UpdateContext(\n    {\n        locItemizeButtonVisibilityFlagViewOnly : \n        'Expense mobile master data (mserp)'.mserp_trvexpmobilemasterdataentity_isexpenseitemizable(\n            LookUp('Expense mobile master data (mserp)',Email = User().Email).'Expense mobile master data (mserp)', \n            {\n                CostType: Coalesce(varExpenseAgainstWorkItem.'Expense category (mserp_costtype)',varSelectedExpenseDoc.'Expense category (mserp_costtype)'),\n                SplitLineType:\"Default\",\n                LineType: If(Coalesce(varExpenseAgainstWorkItem.'Expense line type',varSelectedExpenseDoc.'Expense line type') = 'Expense line type (mserp)'.'Itemized header',\"ItemizedHeader\",\"Default\")\n            }\n        ).return\n    }\n);\nUpdateContext(\n    {\n        featureEnabled: If(\n            userRecord.IsReimaginedUIEnabled = 'NoYes (mserp)'.Yes,\n            \"True\",\n            \"False\"\n        ),\n        perdiemFeatureEnabled: If(\n            userRecord.IsReimaginedUIEnabled = 'NoYes (mserp)'.Yes,  //this needs to be changed to the perdiem feature enabled\n            \"True\",\n            \"False\"\n        )\n    }\n);\n// 3-level category selection variables\nUpdateContext({varSelectedDepartment: Blank()});\nUpdateContext({varSelectedBenefitType: Blank()});\n// Load existing Department and Benefit Type from Expense Category (reverse lookup)\nWith(\n    {\n        expenseCategory: Coalesce(\n            varExpenseAgainstWorkItem.'Expense category (mserp_costtype)',\n            varSelectedExpenseDoc.'Expense category (mserp_costtype)'\n        )\n    },\n    If(\n        !IsBlank(expenseCategory),\n        With(\n            {\n                mappingRecord: LookUp(\n                    'DCSL Expense Category Mapping Setup Entity (mserp)',\n                    'Expense category' = expenseCategory\n                )\n            },\n            If(\n                !IsBlank(mappingRecord),\n                UpdateContext({\n                    varSelectedDepartment: mappingRecord.Department\n                });\n                UpdateContext({\n                    varSelectedBenefitType: mappingRecord.'Benefit Type'\n                })\n            )\n        )\n    )\n);\n// Cost Center context\nUpdateContext({varSelectedCostCenter: Blank()});\nWith(\n    {\n        expenseDoc: Coalesce(\n            varExpenseAgainstWorkItem,\n            varSelectedExpenseDoc\n        )\n    },\n    If(\n        !IsBlank(expenseDoc.mserp_deexcostcenter),\n        UpdateContext({\n            varSelectedCostCenter: LookUp(\n                'DCSL Financial Dimension CostCenter (mserp)',\n                'Combination display' = expenseDoc.mserp_deexcostcenter\n            )\n        })\n    )\n);\n//if labelTableLookUp not empty\nIf(\n    CountRows(labelTableLookUp) <= 0,\n    Collect(\n        labelTableLookUp,\n        {\n            fieldName : \"CostType\",\n            labelName : \"Expense category\",\n            localisedLabelName : GlobalLabels.Labels.'15062:LocalizedName,msdyn_ExpenseCategoryLabel',\n            visible : true,\n            required : true\n        },\n        {\n            fieldName : \"TransDate\",\n            labelName : \"Transaction date\",\n            localisedLabelName : GlobalLabels.Labels.'15062:LocalizedName,msdyn_TransactionDateLabel',\n            visible : true,\n            required : true\n        },\n        {\n            fieldName : \"AmountCurr\",\n            labelName : \"Transaction amount\",\n            localisedLabelName : GlobalLabels.Labels.'15062:LocalizedName,msdyn_TransactionAmountLabel',\n            visible : true,\n            required : true\n        },\n        {\n            fieldName : \"ExchangeCode\",\n            labelName : \"Currency\",\n            localisedLabelName : GlobalLabels.Labels.'15062:LocalizedName,msdyn_CurrencyLabel',\n            visible : true,\n            required : true\n        },\n        {\n            fieldName : \"PayMethod\",\n            labelName : \"Payment method\",\n            localisedLabelName : GlobalLabels.Labels.'15062:LocalizedName,msdyn_PaymentMethodLabel',\n            visible : true,\n            required : true\n        },\n        {\n            fieldName : \"SubmitterJustification\",\n            labelName : \"Employee justification\",\n            localisedLabelName : GlobalLabels.Labels.'15062:LocalizedName,msdyn_EmployeeJustificationLabel',\n            visible : false,\n            required : false\n        }\n    );\n    ForAll(\n            Filter('@ExpenseManagement:ExpenseMobileFieldVisibilityEntity (mserp)',LegalEntityId = varSelectedLegalEntity) As VisibilityTable,\n            Collect(\n                labelTableLookUp,\n                {\n                    fieldName : VisibilityTable.FieldName,\n                    labelName : VisibilityTable.Labels,\n                    localisedLabelName : VisibilityTable.LocalisedLabelName\n                }\n            )\n        );\n    If(\n        featureEnabled = \"True\",\n        ForAll(\n            Filter('@ExpenseManagement:ExpenseMobileFieldVisibilityEntity (mserp)',LegalEntityId = varSelectedLegalEntity) As VisibilityTable,\n            Patch(\n                labelTableLookUp,\n                LookUp(labelTableLookUp,fieldName = VisibilityTable.FieldName),\n                {\n                    visible : VisibilityTable.VisibilityType <> 'ExpenseFieldVisibilityType (mserp)'.'Do not display',\n                    required : VisibilityTable.VisibilityType = 'ExpenseFieldVisibilityType (mserp)'.Required\n                }\n            )\n        ),\n        ForAll(\n            Filter('Display fields (mserp)', 'Company Code' = varSelectedLegalEntity) As VisibilityTable,\n            Patch(\n                labelTableLookUp,\n                LookUp(labelTableLookUp,fieldName = VisibilityTable.FieldName),\n                {\n                    visible : VisibilityTable.Visibility <> 'Visibility (mserp)'.'Do not display',\n                    required : false\n                }\n            )\n        )\n   \n    )\n);\nSet(\n    gblParams,\n    {\n        dropDownHeight : 60,\n        dorpDownBorderThickness : 2,\n        dropDownBorderColor : RGBA(34, 102, 227, 1),\n        dropDownLabelColor : Color.Black,\n        dropDownHoverFill : RGBA(204, 222, 255, 1),\n        errorMessageSize : 18,\n        dropDownFontSize : 24,\n        expenseDataCardViewOnly: RGBA(110, 110, 110, 1),\n        notificationTime : 4000\n    }\n);\n\nUpdateContext(\n    {\n        currExpenseType:\n        If(\n            ViewExpenseDetail_approvals.Visible,\n            varExpenseAgainstWorkItem.'Expense type',\n            varSelectedExpenseDoc.'Expense type'\n        )\n    }\n);"
    Children:
      - scr03_img_NoReceiptOuter_3:
          Control: Image@2.2.3
          Properties:
            BorderColor: =RGBA(255, 0, 37, 0.2)
            BorderStyle: =BorderStyle.Dashed
            DisplayMode: =DisplayMode.View
            Fill: =RGBA(255, 255, 255, 1)
            Height: =Parent.Height/4
            Image: |-
              =If(
                  varFileFormat in ["jpg", "bmp", "jpeg", "png", "heic", "tif", "tiff", "raw"] && !IsBlank(varReceiptImage),
                  varReceiptImage,
                  varFileFormat in ["xlsx", "xls"],
                  IconExcel,
                  varFileFormat in ["docx", "doc"],
                  IconWord,
                  varFileFormat = "pdf",
                  IconPDF,
                  varFileFormat = "txt",
                  IconTxt,
                  IconMail
              )
            ImagePosition: |-
              =If(
                  varFileFormat in ["jpg", "bmp", "jpeg", "png", "heic", "tif", "tiff", "raw"] && !IsBlank(varReceiptImage),
                  ImagePosition.Stretch,
                  ImagePosition.Center
              )
            RadiusBottomLeft: =18
            RadiusBottomRight: =18
            RadiusTopLeft: =18
            RadiusTopRight: =18
            Visible: =!IsBlank(varReceiptImage)
            Width: =Parent.Width -  Self.X*2
            X: =26
            Y: |-
              =If(
                  scr03_lbl_PolicyViolationWarning_4.Visible,
                  scr03_lbl_PolicyViolationWarning_4.Y + scr03_lbl_PolicyViolationWarning_4.Height + 27,
                  scr03_lbl_ValidationWarning_4.Y + scr03_lbl_ValidationWarning_4.Height + 27
              )
      - scr03_img_NoReceiptInner_3:
          Control: Image@2.2.3
          Properties:
            BorderColor: =RGBA(166, 166, 166, 1)
            BorderStyle: =BorderStyle.Dashed
            BorderThickness: =5
            DisplayMode: =DisplayMode.View
            Fill: =RGBA(255, 255, 255, 1)
            Height: =Parent.Height/5
            Image: =ImgWhite
            ImagePosition: =ImagePosition.Fill
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Visible: '=IsBlank(varReceiptImage) '
            Width: =Parent.Width - Self.X*2
            X: =44
            Y: =scr03_img_NoReceiptOuter_3.Y +(scr03_img_NoReceiptOuter_3.Height-scr03_img_NoReceiptInner_3.Height)/2
      - scr03_lbl_ChangeReceipt_4:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =scr03_lbl_AddReceipt_3.Color
            Fill: =Color.White
            Font: =Font.'Open Sans'
            OnSelect: |-
              =Navigate('Expenses - View Receipt Screen', ScreenTransition.None, {varViewOnly : true})
            PaddingLeft: =35 + scr03_ico_ViewReceipt_1.Width
            Size: =17
            TabIndex: =0
            Text: =GlobalLabels.Labels.'15062:LocalizedName,msdyn_ViewReceiptLabel'
            Visible: =!(IsBlank(varReceiptImage))
            Width: =scr03_img_NoReceiptOuter_3.Width+1
            X: =scr03_img_NoReceiptOuter_3.X
            Y: =scr03_img_NoReceiptOuter_3.Y + (scr03_img_NoReceiptOuter_3.Height -Self.Height)+1
      - scr03_ico_ViewReceipt_4:
          Control: Image@2.2.3
          Properties:
            AccessibleLabel: ="View receipt"
            BorderColor: =RGBA(0, 18, 107, 1)
            Height: =33
            Image: =imageicon
            OnSelect: |-
              =Navigate('Expenses - View Receipt Screen', ScreenTransition.None, {varViewOnly : true})
            Visible: =!(IsBlank(varReceiptImage))
            Width: =18
            X: =scr03_lbl_ChangeReceipt_4.X + 25
            Y: =scr03_lbl_ChangeReceipt_4.Y + (scr03_lbl_ChangeReceipt_4.Height-scr03_ico_ViewReceipt_4.Height)/2
      - scr03_lbl_ValidationWarning_4:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(165, 33, 33, 1)
            Fill: =RGBA(249, 217, 217, 1)
            Font: =Font.'Segoe UI'
            Height: |-
              =If(
                  Self.Visible,
                  88,
                  0
              )
            Size: =15
            Text: |-
              =//If(ctVarIsRequiredFieldEmpty,GlobalLabels.Labels.ValidationMsgExpenseNeedMoreDetails)
              //not having receipt in expense is part of policy violation
            Visible: =//ctVarIsRequiredFieldEmpty //Or ((varSelectedExpenseDoc.receiptsAttached = "No" Or IsBlank(varSelectedExpenseDoc)) And IsBlank(varReceiptImage))
            Width: =Parent.Width
            Y: =scr03_hdr_TopHeader_4.Height
      - scr03_hdr_TopHeader_4:
          Control: CanvasComponent
          ComponentName: hdr02_Header
          Properties:
            Fill: =scr03_hdr_TopHeader_4.paramFill
            Height: =82
            Width: =Max(App.Width, App.MinScreenWidth)
            paramColor: =RGBA(0, 0, 0, 1)
            paramFill: =RGBA(255, 255, 255, 1)
            paramTitle: =GlobalLabels.Labels.'15062:LocalizedName,msdyn_ViewExpenseLabel'
      - scr03_ico_Back_7:
          Control: Classic/Icon@2.5.0
          Properties:
            AccessibleLabel: ="Press to go back"
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =icongconfig_backbutton.Color
            Fill: =icongconfig_backbutton.Fill
            Height: =icongconfig_backbutton.Height
            Icon: =Icon.ChevronLeft
            OnSelect: |-
              =Switch(
                  varNavigatedFrom,
                  "scr22",
                  Navigate('Approvals - Details Screen'),
                  "scr20",
                  Navigate('Reports - View Only Screen'),
                  "scr19",
                  Navigate('Reports - View Attached Expenses Screen')
              )
            Width: =icongconfig_backbutton.Width
            X: =22.5
            Y: =(scr03_hdr_TopHeader_4.Height-Self.Height)/2
      - scr03_lbl_PolicyViolationWarning_4:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: |-
              =/*If(
                  !IsBlank(varMaxViolationLevel),
                  If(
                      Value(varMaxViolationLevel) > 0 && Value(varMaxViolationLevel) <= 2,
                      RGBA(152, 111, 11, 1), //yellow
                      RGBA(217, 44, 44, 1)     //red
                  )
              )*/
            Fill: |-
              =If(
                  !IsBlank(varMaxViolationLevel),
                  If(
                      Value(varMaxViolationLevel) > 0 && Value(varMaxViolationLevel) <= 2,
                      RGBA(255, 242, 195, 1), //yellow  
                      RGBA(249, 217, 217, 1)   //red
                  )
              )
            Font: =Font.'Segoe UI'
            Height: |+
              =//If(ctVarIsRequiredFieldEmpty,GlobalLabels.Labels.ValidationMsgExpenseNeedMoreDetails,"Please add a receipt to this expense")
              If(
                  CountRows(colPolViolations) > 0,
                  88, 0
              )

            OnSelect: |-
              =Navigate(
                  'Expenses - Policy Violations Screen', 
                  ScreenTransition.None, {
                      varCntExpenseTransactionNumber :
                      If(
                          varNavigatedFrom = "scr22",
                          varExpenseAgainstWorkItem.'Expense transaction number (mserp_exptransnumber)', 
                          varSelectedExpenseDoc.'Expense transaction number (mserp_exptransnumber)'
                      )
                  })
            PaddingBottom: =18
            PaddingLeft: =54
            PaddingTop: =18
            Size: =15
            TabIndex: =0
            Text: |
              =Substitute(GlobalLabels.Labels.'15062:LocalizedName,msdyn_PolicyViolationExistsLabel', "$", Text(varNumViolation))
            Visible: =varNumViolation > 0
            Width: =Parent.Width
            Y: =scr03_hdr_TopHeader_4.Height
      - Expense View Container:
