Screens:
  Expenses - View Receipt Screen:
    Properties:
      Fill: =RGBA(229, 229, 229, 1)
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: "=/*UpdateContext({varCntShowConfirmationDialog: false});\nUpdateContext({varChangeCalled : false});*/\nSet(varChangeCalled,false);\nSet(varCntShowConfirmationDialog,false);\nUpdateContext({varRotateImage: ImageRotation.None});\n\n// Initialize varCurrentReceiptIndex if not set\nIf(\n    IsBlank(varCurrentReceiptIndex),\n    Set(varCurrentReceiptIndex, 1)\n);\n\n// Load all attached receipts for this expense line\n// [1. 최상위 If 시작] 문서 정보가 있을 때만 실행\nIf(\n    !varViewOnly && !IsBlank(varSelectedExpenseDoc) && !IsBlank(varSelectedExpenseDoc.'Expense transaction number (mserp_exptransnumber)'),\n    \n    ClearCollect(\n        colAttachedReceipts,\n        SortByColumns(\n            Filter(\n                'Expense Mobile Unattached Document Entity (mserp)',\n                ExpTransNumber = varSelectedExpenseDoc.'Expense transaction number (mserp_exptransnumber)'\n            ),\n            \"mserp_creatingdatetime\",\n            SortOrder.Descending\n        )\n    );\n    \n    // Find current receipt index\n    // [2. 내부 If 시작] 컬렉션 비어있는지 확인\n    If(\n        !IsEmpty(colAttachedReceipts),\n        // Receipts collection is available\n        If(\n            !IsBlank(varSelectedReceiptForView),\n            // Find index of selected receipt\n            With(\n                {\n                    receiptRecord: LookUp(colAttachedReceipts, mserp_entrecid = varSelectedReceiptForView)\n                },\n                If(\n                    !IsBlank(receiptRecord),\n                    // Receipt found in collection\n                    With(\n                        {\n                            receiptIndex: CountRows(\n                                Filter(\n                                    colAttachedReceipts,\n                                    mserp_entrecid <= receiptRecord.mserp_entrecid\n                                )\n                            )\n                        },\n                        Set(\n                            varCurrentReceiptIndex,\n                            receiptIndex\n                        );\n                        Set(\n                            varReceiptImage,\n                            receiptRecord.mserp_captureddocument\n                        );\n                        Set(\n                            varFileFormat,\n                            receiptRecord.mserp_fileextension\n                        )\n                    ),\n                    // Receipt not found, use first receipt\n                    Set(\n                        varCurrentReceiptIndex,\n                        1\n                    );\n                    Set(\n                        varSelectedReceiptForView,\n                        First(colAttachedReceipts).mserp_entrecid\n                    );\n                    Set(\n                        varReceiptImage,\n                        First(colAttachedReceipts).mserp_captureddocument\n                    );\n                    Set(\n                        varFileFormat,\n                        First(colAttachedReceipts).mserp_fileextension\n                    )\n                )\n            ),\n            // varSelectedReceiptForView is blank, use first receipt\n            Set(\n                varCurrentReceiptIndex,\n                1\n            );\n            Set(\n                varSelectedReceiptForView,\n                First(colAttachedReceipts).mserp_entrecid\n            );\n            Set(\n                varReceiptImage,\n                First(colAttachedReceipts).mserp_captureddocument\n            );\n            Set(\n                varFileFormat,\n                First(colAttachedReceipts).mserp_fileextension\n            )\n        ),\n        // No receipts in collection - use AttachedReceiptId if available (backward compatibility)\n        If(\n            !IsBlank(varSelectedExpenseDoc.AttachedReceiptId),\n            Set(\n                varReceiptImage,\n                LookUp('Expense Mobile Attached Document Entity (mserp)', mserp_entrecid = Value(varSelectedExpenseDoc.AttachedReceiptId), mserp_captureddocument)\n            );\n            Set(\n                varFileFormat,\n                LookUp('Expense Mobile Attached Document Entity (mserp)', mserp_entrecid = Value(varSelectedExpenseDoc.AttachedReceiptId), mserp_fileextension)\n            );\n            Set(\n                varSelectedReceiptForView,\n                Value(varSelectedExpenseDoc.AttachedReceiptId)\n            );\n            Set(\n                varCurrentReceiptIndex,\n                1\n            )\n        )\n    ) // [2. 내부 If 종료]\n); // [1. 최상위 If 종료] <--- 여기에 괄호 ')'가 필요합니다."
    Children:
      - imageView_footer_rectangle_1:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =RGBA(37, 36, 35, 1)
            Height: |-
              =If(
                  varViewOnly,
                  278 - scr06_btn_ChangeReceipt.Height,
                  278
              )
            OnSelect: =
            Width: =Max(App.Width, App.MinScreenWidth)
            Y: =Parent.Height - Self.Height
      - scr06_btn_ChangeReceipt:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(255, 255, 255, 1)
            BorderThickness: =3
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            DisplayMode: |-
              =If(
                  varViewOnly,
                  DisplayMode.View,
                  DisplayMode.Edit
              )
            Fill: =RGBA(33, 33, 33, 1)
            Font: =Font.'Open Sans'
            Height: =88
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =Self.Color
            HoverFill: =Self.Fill
            OnSelect: |
              =Set(varChangeCalled,true);
              If(
                  varChangeReceiptItemizedExpense,
                  Set(
                      varCntShowConfirmationDialogItemize,
                      true
                  ),
                  Set(
                      varCntShowConfirmationDialog,
                      true
                  )
              );


              Set(
                  varSelectedReceiptNumber, 
                  Blank()
              );
            PressedBorderColor: =Self.BorderColor
            PressedFill: =Self.Fill
            Size: =22
            Text: =GlobalLabels.Labels.'15062:LocalizedName,msdyn_ChangeReceiptLabel'
            Visible: =!varViewOnly
            Width: |
              =Parent.Width -  Self.X*2
            X: =40
            Y: =scr06_btn_Done_1.Y + scr06_btn_Done_1.Height + 30
      - scr06_btn_Done_1:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =RGBA(34, 102, 227, 1)
            Font: =Font.'Open Sans'
            Height: =87
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            OnSelect: |-
              =If(
                  varItemizedViewOnly,
                  Navigate('Itemization - Itemized Expense View Only Screen'),
                  locNavigateItemizedExpense,
                  Navigate('Itemization - Itemized Expense Edit Screen'),
                  If(
                      varViewOnly,
                      Navigate('Expenses - View Only Screen - New', ScreenTransition.None),
                      Navigate('Expenses - Edit Screen', ScreenTransition.None)
                  )
              );
              UpdateContext({varItemizedViewOnly : false})
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Text: =GlobalLabels.Labels.'15062:LocalizedName,msdyn_DoneButtonLabel'
            Width: |
              =Parent.Width -  Self.X*2
            X: =40
            Y: =imageView_footer_rectangle_1.Y + 25
      - scr06_img_Receipt:
          Control: Image@2.2.3
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Height: =imageView_footer_rectangle_1.Y - Self.Y
            Image: =varReceiptImage
            ImageRotation: =varRotateImage
            Visible: ="data:image" in varReceiptImage
            Width: =Parent.Width
            Y: =scr06_hdr_TopHeader.Height
      - scr06_pdfViewer:
          Control: PDFViewer@2.5.0
          Properties:
            Document: =varReceiptImage
            Height: =scr06_img_Receipt.Height
            Visible: ="data:application/pdf" in varReceiptImage
            Width: =scr06_img_Receipt.Width
            X: =scr06_img_Receipt.X
            Y: =scr06_img_Receipt.Y
      - scr06_lbl_NoPreview:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Font: =Font.'Segoe UI'
            Height: =64
            Size: =18
            Text: =GlobalLabels.Labels.'15062:LocalizedName,msdyn_FilePreviewNotSupportedLabel'
            Visible: =!(scr06_pdfViewer.Visible || scr06_img_Receipt.Visible)
            Width: '=406     '
            X: |
              =(Parent.Width - Self.Width)/2
            Y: '=scr06_img_NoPreview.Y + scr06_img_NoPreview.Height + 10 '
      - scr06_img_NoPreview:
          Control: Image@2.2.3
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Height: =85
            Image: |-
              =If(
                  varFileFormat in ["xlsx", "xls"],
                  IconExcel,
                  varFileFormat in ["docx", "doc"],
                  IconWord,
                  varFileFormat = "txt",
                  IconTxt,
                  IconMail
              )
            Visible: =scr06_lbl_NoPreview.Visible
            Width: =85
            X: |
              =(Parent.Width - Self.Width)/2
            Y: =scr06_img_Receipt.Y + (scr06_img_Receipt.Height - Self.Height)/2
      - scr06_hdr_TopHeader:
          Control: CanvasComponent
          ComponentName: hdr02_Header
          Properties:
            Fill: =scr06_hdr_TopHeader.paramFill
            Height: =82
            Width: =Max(App.Width, App.MinScreenWidth)
            paramColor: =RGBA(255, 255, 255, 1)
            paramFill: |
              =RGBA(33, 33, 33, 1)
            paramTitle: |-
              =If(
                  !IsEmpty(colAttachedReceipts) && CountRows(colAttachedReceipts) > 1,
                  Concatenate(
                      GlobalLabels.Labels.'15062:LocalizedName,msdyn_ViewReceiptLabel',
                      " (",
                      Text(varCurrentReceiptIndex),
                      " / ",
                      Text(CountRows(colAttachedReceipts)),
                      ")"
                  ),
                  GlobalLabels.Labels.'15062:LocalizedName,msdyn_ViewReceiptLabel'
              )
      - scr06_lbl_Detach:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(255, 255, 255, 1)
            DisplayMode: |-
              =If(
                  varViewOnly,
                  DisplayMode.View,
                  DisplayMode.Edit
              )
            Font: =Font.'Segoe UI'
            Height: =82
            OnSelect: |-
              =If(
                  varChangeReceiptItemizedExpense,
                  Set(
                      varCntShowConfirmationDialogItemize,
                      true
                  ),
                  Set(
                      varCntShowConfirmationDialog,
                      true
                  )
              )
            TabIndex: =0
            Text: =GlobalLabels.Labels.'15062:LocalizedName,msdyn_DetachLabel'
            Visible: =!varViewOnly
            Width: =193
            X: =Parent.Width - Self.Width
      - scr06_ico_Back_1:
          Control: Classic/Icon@2.5.0
          Properties:
            AccessibleLabel: ="Press to go back"
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =Color.White
            Fill: =icongconfig_backbutton.Fill
            Height: =icongconfig_backbutton.Height
            Icon: =Icon.ChevronLeft
            OnSelect: =Back()
            TabIndex: =0
            Width: =icongconfig_backbutton.Width
            X: =10.5*Value(lbconfig_resolution_factor.Text)
            Y: =(scr02_hdr_TopHeader.Height-Self.Height)/2
      - cmp02_ConfirmationDialog_HeaderExpense:
          Control: CanvasComponent
          ComponentName: cmp02_ConfirmationDialog
          Properties:
            Height: =App.Height
            LegalEntity: =Text(varSelectedLegalEntity)
            OnLeftButtonClick: |-
              =//UpdateContext({varCntShowConfirmationDialog:false})
              Set(varCntShowConfirmationDialog,false);
              Set(varChangeCalled,false);
            OnRightButtonClick: "=//UpdateContext({varCntShowConfirmationDialog: false});\nSet(varCntShowConfirmationDialog,false);\nIf(\n    !IsBlank(SelectedExpense) && SelectedReceiptNumber <> \"0\" && !IsBlank(SelectedReceiptNumber),\n    IfError(\n        // Detach receipt by setting ExpTransNumber to Blank\n        Patch(\n            'Expense Mobile Unattached Document Entity (mserp)',\n            LookUp(\n                'Expense Mobile Unattached Document Entity (mserp)',\n                EntRecId = Value(SelectedReceiptNumber)\n            ),\n            {\n                ExpTransNumber: Blank()\n            }\n        ),\n        First(\n            ClearCollect(\n                varError,\n                Substitute(\n                    Match(\n                        FirstError.Details.HttpResponse,\n                        \"\"\"message\"\":\"\"([^\"\"]*)\"\"\"\n                    ).FullMatch,\n                    \"\"\"message\"\":\",\n                    \"\"\n                )\n            )\n        )\n    )\n);\nIf(\n    (IsBlank(First(varError).Value) || First(varError).Value = \"\"),\n    // Refresh receipts collection\n    ClearCollect(\n        colAttachedReceipts,\n        SortByColumns(\n            Filter(\n                'Expense Mobile Unattached Document Entity (mserp)',\n                ExpTransNumber = varSelectedExpenseDoc.'Expense transaction number (mserp_exptransnumber)'\n            ),\n            \"mserp_creatingdatetime\",\n            SortOrder.Descending\n        )\n    );\n    // Update AttachedReceiptId (first receipt or blank)\n    If(\n        !IsEmpty(colAttachedReceipts),\n        Patch(\n            'DCSL Expense Line Expense Moblie Entity (mserp)',\n            varSelectedExpenseDoc,\n            {\n                AttachedReceiptId: First(colAttachedReceipts).EntRecId\n            }\n        ),\n        Patch(\n            'DCSL Expense Line Expense Moblie Entity (mserp)',\n            varSelectedExpenseDoc,\n            {\n                AttachedReceiptId: Blank()\n            }\n        )\n    );\n    Notify(\n        GlobalLabels.Labels.'15062:LocalizedName,msdyn_ReceiptDetachedSuccessfullyLabel',\n        NotificationType.Success,\n        gblParams.notificationTime\n    );\n    // Update current receipt display\n    If(\n        !IsEmpty(colAttachedReceipts),\n        Set(\n            varCurrentReceiptIndex,\n            1\n        );\n        Set(\n            varSelectedReceiptForView,\n            First(colAttachedReceipts).EntRecId\n        );\n        Set(\n            varReceiptImage,\n            First(colAttachedReceipts).CapturedDocument\n        );\n        Set(\n            varFileFormat,\n            First(colAttachedReceipts).FileExtension\n        ),\n        Set(\n            varReceiptImage,\n            Blank()\n        );\n        Set(\n            varSelectedReceiptForView,\n            Blank()\n        )\n    ),\n    Notify(\n        Substitute(First(varError).Value, \"\"\"\", \"\"),\n        NotificationType.Error,\n        gblParams.notificationTime\n    ) \n    \n);\nIf(\n    varChangeCalled,\n    Navigate('Expenses - Capture Receipt Screen'),\n    Navigate('Expenses - Edit Screen')\n)"
            SelectedExpense: |
              =varSelectedExpenseDoc.'Expense transaction number (mserp_exptransnumber)'
            SelectedList: ="Text"
            SelectedReceiptNumber: |-
              =If(
                  !IsBlank(varSelectedReceiptForView),
                  Text(varSelectedReceiptForView),
                  Text(varSelectedExpenseDoc.AttachedReceiptId)
              )
            Visible: =varCntShowConfirmationDialog
            Width: =Max(App.Width, App.MinScreenWidth)
            controlName: ="cmp02_ConfirmationDialog_1"
            parmInDescriptionText: |-
              =If(
                  varChangeCalled,
                  GlobalLabels.Labels.'15062:LocalizedName,msdyn_ConfirmReceiptChangeLabel',
                  GlobalLabels.Labels.'15062:LocalizedName,msdyn_DetachReceiptConfirmationTextLabel'
              )
            parmInHeaderText: |-
              =If(
                  varChangeCalled,
                  Concatenate(GlobalLabels.Labels.'15062:LocalizedName,msdyn_ReceiptChangeLabel',"?"),
                  GlobalLabels.Labels.'15062:LocalizedName,msdyn_DetachSelectedReceiptHeaderLabel'
              )
            parmInLeftButtonColor: =RGBA(34, 102, 227, 1)
            parmInLeftButtonText: =GlobalLabels.Labels.'15062:LocalizedName,msdyn_CancelLabel'
            parmInRightButtonColor: =RGBA(195, 39, 39, 1)
            parmInRightButtonText: =GlobalLabels.Labels.'15062:LocalizedName,msdyn_DetachLabel'
            returnFocus: ="scr06_lbl_Detach"
      - cmp02_ConfirmationDialog_Itemized:
          Control: CanvasComponent
          ComponentName: cmp02_ConfirmationDialog
          Properties:
            Height: =App.Height
            LegalEntity: =Text(varSelectedLegalEntity)
            OnLeftButtonClick: |-
              =Set(varCntShowConfirmationDialogItemize,false);
              Set(varChangeCalled,false)
            OnRightButtonClick: "=//UpdateContext({varCntShowConfirmationDialog: false});\nSet(varCntShowConfirmationDialogItemize,false);\nIf(\n    !IsBlank(SelectedExpense) && Text(SelectedReceiptNumber) <> \"0\" && !IsBlank(Text(SelectedReceiptNumber)),\n    IfError(\n        Patch(\n            'DCSL Expense Line Expense Moblie Entity (mserp)',\n            LookUp(\n                'DCSL Expense Line Expense Moblie Entity (mserp)',\n                'Expense transaction number (mserp_exptransnumber)' = SelectedExpense\n            ),\n            {Detach: 1}\n        ),\n        First(\n            ClearCollect(\n                varError,\n                Substitute(\n                    Match(\n                        FirstError.Details.HttpResponse,\n                        \"\"\"message\"\":\"\"([^\"\"]*)\"\"\"\n                    ).FullMatch,\n                    \"\"\"message\"\":\",\n                    \"\"\n                )\n            )\n        )\n    )\n);\nIf(\n    (IsBlank(First(varError).Value) || First(varError).Value = \"\"),\n    Notify(\n        GlobalLabels.Labels.'15062:LocalizedName,msdyn_ReceiptDetachedSuccessfullyLabel',\n        NotificationType.Success,\n        gblParams.notificationTime\n    );\n    Set(\n        varReceiptImage,\n        Blank()\n    );\n    Set(\n        varSelectedReceiptNumber,\n        Blank()\n    ),\n    Notify(\n        Substitute(First(varError).Value, \"\"\"\", \"\"),\n        NotificationType.Error,\n        gblParams.notificationTime\n    ) \n    \n);\nIf(\n    varChangeCalled,\n    Navigate('Expenses - Capture Receipt Screen'),\n    Navigate('Itemization - Itemized Expense Edit Screen')\n)"
            SelectedExpense: |
              =varSelectedItemizedExpenseDoc.'Expense transaction number (mserp_exptransnumber)'
            SelectedList: ="Text"
            SelectedReceiptNumber: =Text(varSelectedItemizedExpenseDoc.AttachedReceiptId)
            Visible: =varCntShowConfirmationDialogItemize
            Width: =Max(App.Width, App.MinScreenWidth)
            controlName: ="cmp02_ConfirmationDialog_1"
            parmInDescriptionText: |-
              =If(
                  varChangeCalled,
                  GlobalLabels.Labels.'15062:LocalizedName,msdyn_ConfirmReceiptChangeLabel',
                  GlobalLabels.Labels.'15062:LocalizedName,msdyn_DetachReceiptConfirmationTextLabel'
              )
            parmInHeaderText: |-
              =If(
                  varChangeCalled,
                  Concatenate(GlobalLabels.Labels.'15062:LocalizedName,msdyn_ReceiptChangeLabel',"?"),
                  GlobalLabels.Labels.'15062:LocalizedName,msdyn_DetachSelectedReceiptHeaderLabel'
              )
            parmInLeftButtonColor: =RGBA(34, 102, 227, 1)
            parmInLeftButtonText: =GlobalLabels.Labels.'15062:LocalizedName,msdyn_CancelLabel'
            parmInRightButtonColor: =RGBA(195, 39, 39, 1)
            parmInRightButtonText: =GlobalLabels.Labels.'15062:LocalizedName,msdyn_DetachLabel'
            returnFocus: ="scr06_lbl_Detach"
      - RotateImageButton_Expenses:
          Control: Image@2.2.3
          Properties:
            AccessibleLabel: ="Image rotated clockwise 90 degree"
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: |
              =RGBA(37, 36, 35, 0.5)
            Height: =App.Height * 0.055
            Image: =RotateReceiptIcon
            OnSelect: |-
              =Switch(varRotateImage,
                     ImageRotation.None, UpdateContext({varRotateImage:ImageRotation.Rotate90}),
                     ImageRotation.Rotate90, UpdateContext({varRotateImage:ImageRotation.Rotate180}),
                     ImageRotation.Rotate180, UpdateContext({varRotateImage:ImageRotation.Rotate270}),
                     ImageRotation.Rotate270, UpdateContext({varRotateImage:ImageRotation.None}),
                     UpdateContext({varRotateImage:ImageRotation.None})
              )
            RadiusBottomLeft: |-
              =If(
                  App.Width > App.Height,
                  App.Width * 0.05,
                  App.Height * 0.0274
              )
            RadiusBottomRight: =Self.RadiusBottomLeft
            RadiusTopLeft: =Self.RadiusBottomLeft
            RadiusTopRight: =Self.RadiusBottomLeft
            TabIndex: =0
            Width: |
              =If(App.Width > App.Height,
              App.Width * 0.12,
              App.Width * 0.37
              )
            X: =40
            Y: =scr06_img_Receipt.Y + scr06_img_Receipt.Height * 5/6
      - scr06_btn_PreviousReceipt:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(255, 255, 255, 1)
            Color: =Color.White
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =RGBA(33, 33, 33, 1)
            Font: =Font.'Open Sans'
            Height: =50
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(50, 50, 50, 1)
            OnSelect: "=If(\n    varCurrentReceiptIndex > 1,\n    With(\n        { \n            // 1단계: 새로운 인덱스 번호를 먼저 계산하여 정의합니다.\n            newIndex: varCurrentReceiptIndex - 1 \n        },\n        With(\n            { \n                // 2단계: 위에서 정의한 newIndex를 사용하여 레코드를 찾습니다.\n                receiptRecord: Index(colAttachedReceipts, newIndex) \n            },\n            \n            // 3단계: 실제 동작을 수행합니다.\n            Set(\n                varCurrentReceiptIndex,\n                newIndex\n            );\n            Set(\n                varSelectedReceiptForView,\n                receiptRecord.mserp_entrecid\n            );\n            Set(\n                varReceiptImage,\n                receiptRecord.mserp_captureddocument\n            );\n            Set(\n                varFileFormat,\n                receiptRecord.mserp_fileextension\n            );\n            UpdateContext({varRotateImage: ImageRotation.None})\n        )\n    )\n)"
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =RGBA(50, 50, 50, 1)
            Size: =18
            Text: ="Previous"
            Visible: =!IsEmpty(colAttachedReceipts) && CountRows(colAttachedReceipts) > 1 && varCurrentReceiptIndex > 1
            Width: =100
            X: =40
            Y: =imageView_footer_rectangle_1.Y - Self.Height - 15
      - scr06_btn_NextReceipt:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(255, 255, 255, 1)
            Color: =Color.White
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =RGBA(33, 33, 33, 1)
            Font: =Font.'Open Sans'
            Height: =50
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(50, 50, 50, 1)
            OnSelect: "=If(\n    varCurrentReceiptIndex < CountRows(colAttachedReceipts),\n    With(\n        { \n            // 1단계: 다음 인덱스 번호 먼저 계산\n            newIndex: varCurrentReceiptIndex + 1 \n        },\n        With(\n            { \n                // 2단계: 위에서 만든 newIndex를 사용하여 레코드 찾기\n                receiptRecord: Index(colAttachedReceipts, newIndex) \n            },\n            \n            // 3단계: 실제 동작 수행\n            Set(\n                varCurrentReceiptIndex,\n                newIndex\n            );\n            Set(\n                varSelectedReceiptForView,\n                receiptRecord.mserp_entrecid\n            );\n            Set(\n                varReceiptImage,\n                receiptRecord.mserp_captureddocument\n            );\n            Set(\n                varFileFormat,\n                receiptRecord.mserp_fileextension\n            );\n            UpdateContext({varRotateImage: ImageRotation.None})\n        )\n    )\n)"
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =RGBA(50, 50, 50, 1)
            Size: =18
            Text: ="Next"
            Visible: =!IsEmpty(colAttachedReceipts) && CountRows(colAttachedReceipts) > 1 && varCurrentReceiptIndex < CountRows(colAttachedReceipts)
            Width: =100
            X: =Parent.Width - Self.Width - 40
            Y: =imageView_footer_rectangle_1.Y - Self.Height - 15
