            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Visible: '=IsBlank(varReceiptImage) '
            Width: |
              =Parent.Width -  Self.X*2
            X: =44
            Y: =scr03_img_NoReceiptOuter_2.Y +(scr03_img_NoReceiptOuter_2.Height-scr03_img_NoReceiptInner_2.Height)/2
      - scr03_lbl_AddReceipt_2:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(34, 102, 227, 1)
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Semibold
            Height: =Parent.Height / 4
            OnSelect: |-
              =Navigate('Expenses - Capture Receipt Screen', ScreenTransition.None);
              UpdateContext(
                  {
                      varOnSelectTriggered: false,
                      varOnShowFields:false,
                      varOnChangeTriggered:false
                  }
              );
              Set(varNavigateFromExpense , "NavigatedFromItemizedEditExpense");
            TabIndex: =0
            Text: =GlobalLabels.Labels.'15062:LocalizedName,msdyn_AddReceiptLabel'
            Visible: '=IsBlank(varReceiptImage) '
            Width: |
              =Parent.Width -  Self.X*2
            X: =26
            Y: =scr03_img_NoReceiptOuter_2.Y
      - scr03_lbl_ChangeReceipt_2:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =scr03_lbl_AddReceipt_2.Color
            Fill: =Color.White
            Font: =Font.'Open Sans'
            OnSelect: |-
              =Navigate('Expenses - View Receipt Screen', ScreenTransition.None, {varViewOnly : false});
              UpdateContext(
                  {
                      varOnSelectTriggered: false,
                      varOnShowFields:false,
                      varOnChangeTriggered:false
                  }
              );
              Set(varNavigateFromExpense , "NavigatedFromItemizedEditExpense");
            PaddingLeft: =35 + scr03_ico_ViewReceipt_2.Width
            Size: =17
            TabIndex: =0
            Text: =GlobalLabels.Labels.'15062:LocalizedName,msdyn_ViewReceiptLabel'
            Visible: =!(IsBlank(varReceiptImage))
            Width: =scr03_img_NoReceiptOuter_2.Width+1
            X: =scr03_img_NoReceiptOuter_2.X
            Y: =scr03_img_NoReceiptOuter_2.Y + (scr03_img_NoReceiptOuter_2.Height -Self.Height)+1
      - scr03_ico_ViewReceipt_2:
          Control: Image@2.2.3
          Properties:
            AccessibleLabel: ="View receipt"
            BorderColor: =RGBA(0, 18, 107, 1)
            Height: =33
            Image: =imageicon
            OnSelect: |-
              =Navigate('Expenses - View Receipt Screen', ScreenTransition.None, {varViewOnly : false, locNavigateItemizedExpense : true});
              UpdateContext(
                  {
                      varOnSelectTriggered: false,
                      varOnShowFields:false,
                      varOnChangeTriggered:false
                  }
              );
              Set(varNavigateFromExpense , "NavigatedFromItemizedEditExpense");
            TabIndex: =0
            Visible: =!(IsBlank(varReceiptImage))
            Width: =18
            X: =scr03_lbl_ChangeReceipt_2.X + 25
            Y: =scr03_lbl_ChangeReceipt_2.Y + (scr03_lbl_ChangeReceipt_2.Height-scr03_ico_ViewReceipt_2.Height)/2
      - scr03_lbl_ValidationWarning_2:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(165, 33, 33, 1)
            Fill: =RGBA(249, 217, 217, 1)
            Font: =Font.'Segoe UI'
            Height: |-
              =If(
                  Self.Visible,
                  88,
                  0
              )
            Size: =15
            Text: |-
              =//If(ctVarIsRequiredFieldEmpty,GlobalLabels.Labels.ValidationMsgExpenseNeedMoreDetails)
              //not having receipt in expense is part of policy violation
            Visible: =//ctVarIsRequiredFieldEmpty //Or ((varSelectedItemizedExpenseDoc.receiptsAttached = "No" Or IsBlank(varSelectedItemizedExpenseDoc)) And IsBlank(varReceiptImage))
            Width: =Parent.Width
            Y: =scr03_hdr_TopHeader_2.Height
      - scr03_hdr_TopHeader_2:
          Control: CanvasComponent
          ComponentName: hdr02_Header_5
          Properties:
            Fill: =scr03_hdr_TopHeader_2.paramFill
            Height: =82
            Width: =Max(App.Width, App.MinScreenWidth)
            paramColor: =RGBA(0, 0, 0, 1)
            paramFill: =RGBA(255, 255, 255, 1)
            paramTitle: =GlobalLabels.Labels.'15062:LocalizedName,msdyn_EditItemizedExpenseLabel'
      - scr03_ico_Back_2:
          Control: Classic/Icon@2.5.0
          Properties:
            AccessibleLabel: ="Press to go back"
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =icongconfig_backbutton.Color
            Fill: =icongconfig_backbutton.Fill
            Height: =27
            Icon: =Icon.ChevronLeft
            OnSelect: |-
              =Set(varSelectedReceiptNumber, Blank());
              Set(varReceiptImage,Blank());
              Set(
                      varChangeReceiptItemizedExpense,
                      false
                  );
              Navigate('Itemization - View All Itemize Expense Screen')
            TabIndex: =0
            Width: =19
            X: =24
            Y: =31
      - scr03_lbl_PolicyViolationWarning_2:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: |-
              =/*If(
                  !IsBlank(varMaxViolationLevel),
                  If(
                      Value(varMaxViolationLevel) > 0 && Value(varMaxViolationLevel) <= 2,
                      RGBA(152, 111, 11, 1), //yellow
                      RGBA(217, 44, 44, 1)     //red
                  )
              )*/
            Fill: |-
              =If(
                  !IsBlank(varMaxViolationLevel),
                  If(
                      Value(varMaxViolationLevel) > 0 && Value(varMaxViolationLevel) <= 2,
                      RGBA(255, 242, 195, 1), //yellow  
                      RGBA(249, 217, 217, 1)   //red
                  )
              )
            Font: =Font.'Segoe UI'
            Height: |+
              =//If(ctVarIsRequiredFieldEmpty,GlobalLabels.Labels.ValidationMsgExpenseNeedMoreDetails,"Please add a receipt to this expense")
              If(
                  CountRows(colPolViolations) > 0,
                  88, 0
              )

            OnSelect: |-
              =Navigate('Expenses - Policy Violations Screen', ScreenTransition.None, {varCntExpenseTransactionNumber : varSelectedItemizedExpenseDoc.'Expense transaction number (mserp_exptransnumber)'})
            PaddingBottom: =18
            PaddingLeft: =54
            PaddingTop: =18
            Size: =15
            TabIndex: =0
            Text: |
              =Substitute(GlobalLabels.Labels.'15062:LocalizedName,msdyn_PolicyViolationExistsLabel', "$", Text(varNumViolation))
            Visible: =varNumViolation > 0
            Width: |
              =Parent.Width
            Y: =scr03_hdr_TopHeader_2.Height
      - Expense Entr Container_1:
          Control: GroupContainer@1.4.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: |-
              =If(
                  currExpenseType <> 'TrvExpType (mserp)'.Mileage,
                      Value(ButtonBackgroundExpense_1.Y - Self.Y - 10),
                      Value(Parent.Height - Self.Y - 10 - ExpenseInfo_3.Height)
              )
            LayoutDirection: =LayoutDirection.Vertical
            LayoutOverflowY: =LayoutOverflow.Scroll
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: |
              =Parent.Width
            Y: =scr03_img_NoReceiptOuter_2.Y + scr03_img_NoReceiptOuter_2.Height + 30
          Children:
            - EditItemizedExpenseForm:
                Control: Form@2.4.4
                Variant: Classic
                Layout: Vertical
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  BorderColor: =RGBA(0, 18, 107, 1)
                  DataSource: ='Expense lines (mserp)'
                  DefaultMode: |-
                    =If(
                        varIsCreate,
                        FormMode.New,
                        FormMode.Edit
                    )
                  Height: |-
                    =If(
                        currExpenseType <> 'TrvExpType (mserp)'.Mileage,
                            Value(scr03_btn_Done_2.Y - Self.Y - 10),
                        If(
                            currExpenseType = 'TrvExpType (mserp)'.Mileage,
                            Value(Parent.Height - Self.Y - 10 - ExpenseInfo_3.Height)
                        )
                    )
                  Item: =varSelectedItemizedExpenseDoc
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  OnFailure: |-
                    =Notify(
                        Last(Split(Text(Self.Error), ":")).Value, 
                        NotificationType.Error, 
                        gblParams.notificationTime
                    )
                  OnSuccess: "=UpdateContext({varSubmittedExpTransNumber : varSelectedItemizedExpenseDoc.'Expense transaction number (mserp_exptransnumber)'});\n//attach receipt if any\nUpdateContext({varAttachReceiptError : Blank()});\nIf(\n    IsBlank(varSelectedItemizedExpenseDoc),\n        If(\n            !IsBlank(varSubmittedExpTransNumber) && !IsBlank(varSelectedReceiptNumber),\n            IfError(\n                Patch(\n                    'Expense Mobile Unattached Document Entity (mserp)',\n                    LookUp('Expense Mobile Unattached Document Entity (mserp)', EntRecId = varSelectedReceiptNumber),\n                    {\n                        ExpTransNumber:varSubmittedExpTransNumber\n                    }\n                ),\n                UpdateContext({varAttachReceiptError : FirstError.Details})\n            );\n            If(\n            !IsBlank(varAttachReceiptError) && !(Text(varAttachReceiptError.HttpStatusCode) = NotFoundStatusCode),\n            Notify(\n                Substitute(\n                    Substitute( Match(varAttachReceiptError.HttpResponse, \"\"\"message\"\":\"\"([^\"\"]*)\"\"\").FullMatch, \n                        \"\"\"message\"\":\", \n                        \"\"), \"\"\"\", \"\"),\n                NotificationType.Error,\n                gblParams.notificationTime\n            ),\n            Notify(\n                GlobalLabels.Labels.'15062:LocalizedName,msdyn_ReceiptAttachedSuccessfullyLabel',\n                NotificationType.Success,\n                gblParams.notificationTime\n            )\n            )       \n        ),\n\n        If(!IsBlank(varSelectedReceiptNumber) && (IsBlank(varSelectedItemizedExpenseDoc.AttachedReceiptId) || Value(varSelectedItemizedExpenseDoc.AttachedReceiptId) <> varSelectedReceiptNumber)              ,\n            IfError(\n                Patch(\n            'Expense Mobile Unattached Document Entity (mserp)',\n           LookUp('Expense Mobile Unattached Document Entity (mserp)', EntRecId = varSelectedReceiptNumber),\n            {\n                ExpTransNumber: varSelectedItemizedExpenseDoc.'Expense transaction number (mserp_exptransnumber)'\n            }\n            ),\n                 UpdateContext({varAttachReceiptError : FirstError.Details})\n            );\n            If(\n                !IsBlank(varAttachReceiptError) && !(Text(varAttachReceiptError.HttpStatusCode) = NotFoundStatusCode),\n                Notify(\n                    Substitute(\n                        Substitute( \n                            Match(varAttachReceiptError.HttpResponse, \"\"\"message\"\":\"\"([^\"\"]*)\"\"\").FullMatch, \n                            \"\"\"message\"\":\", \n                            \"\"\n                        ), \"\"\"\", \"\"\n                    ),\n                    NotificationType.Error,\n                    gblParams.notificationTime\n                ),\n               Notify(\n                GlobalLabels.Labels.'15062:LocalizedName,msdyn_ReceiptAttachedSuccessfullyLabel',\n                NotificationType.Success,\n                gblParams.notificationTime\n            )\n        )\n)\n);\n//create or update expense\nIf(\n    varIsCreate,\n    Notify(\n        GlobalLabels.Labels.'15062:LocalizedName,msdyn_ExpenseCreateMessageLabel',\n        NotificationType.Success,\n        gblParams.notificationTime\n    ),\n    If(\n        isDirty || isExpenseReceiptAttached,\n        Notify(\n            GlobalLabels.Labels.'15062:LocalizedName,msdyn_ExpenseUpdateMessageLabel', \n            NotificationType.Success,\n            gblParams.notificationTime)   \n    )\n);\n\nIf(!IsBlank(EditItemizedExpenseForm.LastSubmit),\nSet(\n    varSelectedItemizedExpenseDoc,\n    EditItemizedExpenseForm.LastSubmit\n)\n);\n\nUpdateContext({varSubmittedExpTransNumber :Blank()});\nSet(\n    varChangeReceiptItemizedExpense,\n    false\n    );\nSet(\n    varIsCreate,\n    false\n);\nSet(\n    isExpenseReceiptAttached,\n    false\n);\nSet(\n    OCRresponse,\n    Blank()\n);\nSet(\n    gblNavigationDrawerVisibility,\n    false\n);\nIf(\n    varIsCreate,\n    Navigate('Expenses - List Screen'),\n    If(\n        !IsBlank(varNavigatedFrom),\n        UpdateContext({varExpenseReportNumber : varSelectedReport.'Expense report number'});\n        Set(\n            varSelectedReport,\n            LookUp('Expense reports (mserp)','Expense report number' = varExpenseReportNumber)\n        );\n        Clear(colAttachedExpensesForReport);\n        ForAll(\n            Split(varSelectedReport.ExpTransNumber, \",\") As attachedExpenses,\n            Collect(\n                colAttachedExpensesForReport,\n                LookUp('Expense lines (mserp)','Expense transaction number (mserp_exptransnumber)' = attachedExpenses[@Value] && 'Expense line type' <> 'Expense line type (mserp)'.'Itemized line')\n            )\n        );\n        ClearCollect(\n            colAttachedExpenses,\n            colAttachedExpensesForReport\n        )\n    );\n    Navigate('Itemization - View All Itemize Expense Screen',Transition.None,{varNavigatedFrom:varNavigatedFrom})    \n);\nSet(varReceiptImage, Blank());\nSet(varSelectedReceiptNumber, Blank());\nUpdateContext(\n    {\n        dirtyTransAmount:Blank(),\n        dirtyTransDate : Blank(),\n        dirtyMerchant : Blank(),\n        varOnSelectTriggered: false,\n        varOnShowFields:false,\n        varOnChangeTriggered:false,\n        varSalesTaxAmount: Blank(),\n        locItemizeButtonVisibilityFlag: false\n    }\n)\n        "
                  SnapToColumns: =false
                  Width: =Parent.Width
                  Y: =scr03_img_NoReceiptOuter_2.Y + scr03_img_NoReceiptOuter_2.Height + 30
                Children:
                  - Expense category_DataCard3_4:
                      Control: TypedDataCard@1.0.7
                      Variant: ClassicAllowedValuesStringEdit
                      Properties:
                        AllowedValues: |-
                          =Filter(
                              'Expense category (mserp)',
                              'Company Code' = varSelectedLegalEntity && Inactive = 'NoYes (mserp)'.No
                          )
                        BorderColor: =gblParams.dropDownBorderColor
                        DataField: ="mserp_costtype"
                        Default: =varSelectedItemizedExpenseDoc.'Expense category (mserp_costtype)'
                        DisplayName: =DataSourceInfo([@'Expense lines (mserp)'],DataSourceInfo.DisplayName,mserp_costtype)
                        Required: =true
                        Update: =ComboBox1_9.Selected.'Expense category'
                        Visible: =false
                        Width: =Parent.Width
                        X: =1
                        Y: =expenseCategoryFieldOrder_Y
                      Children:
                        - DataCardKey3_4:
                            Control: Label@2.5.1
                            MetadataKey: FieldName
                            Properties:
                              AutoHeight: =true
                              BorderColor: =RGBA(0, 0, 0, 1)
                              Color: =gblParams.dropDownLabelColor
                              FocusedBorderThickness: =
                              Font: =Font.'Segoe UI'
                              Height: =48
                              Text: '=LookUp(labelTableLookUp, labelName = Parent.DisplayName, localisedLabelName) '
                              Width: =Parent.Width - 60
