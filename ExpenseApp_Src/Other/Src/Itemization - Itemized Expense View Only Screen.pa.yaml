Screens:
  Itemization - Itemized Expense View Only Screen:
    Properties:
      Fill: =RGBA(244, 244, 244, 1)
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: "=UpdateContext(\n    {\n        featureEnabled :\n        If(userRecord.IsReimaginedUIEnabled = 'NoYes (mserp)'.Yes, \"True\", \"False\")\n    }\n); \n//if labelTableLookUp not empty\nIf(\n    CountRows(labelTableLookUp) <= 0,\n    Collect(\n        labelTableLookUp,\n        {\n            fieldName : \"CostType\",\n            labelName : \"Expense category\",\n            localisedLabelName : GlobalLabels.Labels.'15062:LocalizedName,msdyn_ExpenseCategoryLabel',\n            visible : true,\n            required : true\n        },\n        {\n            fieldName : \"TransDate\",\n            labelName : \"Transaction date\",\n            localisedLabelName : GlobalLabels.Labels.'15062:LocalizedName,msdyn_TransactionDateLabel',\n            visible : true,\n            required : true\n        },\n        {\n            fieldName : \"AmountCurr\",\n            labelName : \"Transaction amount\",\n            localisedLabelName : GlobalLabels.Labels.'15062:LocalizedName,msdyn_TransactionAmountLabel',\n            visible : true,\n            required : true\n        },\n        {\n            fieldName : \"ExchangeCode\",\n            labelName : \"Currency\",\n            localisedLabelName : GlobalLabels.Labels.'15062:LocalizedName,msdyn_CurrencyLabel',\n            visible : true,\n            required : true\n        },\n        {\n            fieldName : \"PayMethod\",\n            labelName : \"Payment method\",\n            localisedLabelName : GlobalLabels.Labels.'15062:LocalizedName,msdyn_PaymentMethodLabel',\n            visible : true,\n            required : true\n        },\n        {\n            fieldName : \"SubmitterJustification\",\n            labelName : \"Employee justification\",\n            localisedLabelName : GlobalLabels.Labels.'15062:LocalizedName,msdyn_EmployeeJustificationLabel',\n            visible : false,\n            required : false\n        }\n    );\n    ForAll(\n            Filter('@ExpenseManagement:ExpenseMobileFieldVisibilityEntity (mserp)',LegalEntityId = varSelectedLegalEntity) As VisibilityTable,\n            Collect(\n                labelTableLookUp,\n                {\n                    fieldName : VisibilityTable.FieldName,\n                    labelName : VisibilityTable.Labels,\n                    localisedLabelName : VisibilityTable.LocalisedLabelName\n                }\n            )\n        );\n    If(\n        featureEnabled = \"True\",\n        ForAll(\n            Filter('@ExpenseManagement:ExpenseMobileFieldVisibilityEntity (mserp)',LegalEntityId = varSelectedLegalEntity) As VisibilityTable,\n            Patch(\n                labelTableLookUp,\n                LookUp(labelTableLookUp,fieldName = VisibilityTable.FieldName),\n                {\n                    visible : VisibilityTable.VisibilityType <> 'ExpenseFieldVisibilityType (mserp)'.'Do not display',\n                    required : VisibilityTable.VisibilityType = 'ExpenseFieldVisibilityType (mserp)'.Required\n                }\n            )\n        ),\n        ForAll(\n            Filter('Display fields (mserp)', 'Company Code' = varSelectedLegalEntity) As VisibilityTable,\n            Patch(\n                labelTableLookUp,\n                LookUp(labelTableLookUp,fieldName = VisibilityTable.FieldName),\n                {\n                    visible : VisibilityTable.Visibility <> 'Visibility (mserp)'.'Do not display',\n                    required : false\n                }\n            )\n        )\n   \n    )\n);"
    Children:
      - ItemizedExpenseBackground_1:
          Control: Rectangle@2.3.0
          Group: ItemizedExpenseGroup_1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =Color.White
            Height: =App.Height * 0.123
            Width: =App.Width
            Y: =84
      - ShadowElementFooter_2:
          Control: GroupContainer@1.4.0
          Variant: AutoLayout
          Group: FooterButtons_2
          Properties:
            DropShadow: =DropShadow.ExtraBold
            Height: =2
            LayoutDirection: =LayoutDirection.Vertical
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =App.Width - 4
            X: =4
            Y: =ButtonBackgroundExpense_2.Y
      - ButtonBackgroundExpense_2:
          Control: Rectangle@2.3.0
          Group: FooterButtons_2
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =Color.White
            Height: |-
              =If(ItemizeExpenseButton_2.Visible,
              (scr03_btn_Done_3.Height +ItemizeExpenseButton_2.Height) * 1.344,
              scr03_btn_Done_3.Height * 1.5
              )
            Width: =App.Width
            Y: =App.Height - ButtonBackgroundExpense_2.Height
      - scr03_ico_Back_6:
          Control: Classic/Icon@2.5.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =icongconfig_backbutton.Color
            Fill: =icongconfig_backbutton.Fill
            Height: =icongconfig_backbutton.Height
            Icon: =Icon.ChevronLeft
            OnSelect: |-
              =
              Switch(
                  varNavigatedFrom,
                  "scr17",
                  Navigate('Reports - Edit Screen'),
                  "scr20",
                  Navigate('Reports - View Only Screen'),
                  "scr18",
                  Navigate('Reports - Attach Expenses Screen'),
                  "scr19",
                  Navigate('Reports - View Attached Expenses Screen'),
                  Blank(),
                  Navigate('Expenses - List Screen')
              );
              UpdateContext({
                  varNavigatedFrom:
                  Blank()
              });
              UpdateContext(
                  {
                      dirtyTransAmount : Blank(),
                      dirtyTransDate : Blank(),
                      dirtyMerchant : Blank(),    
                      varOnSelectTriggered: false,
                      varOnShowFields:false,
                      varOnChangeTriggered:false,
                      varSalesTaxAmount: Blank()
                  }
              );
            Visible: =false
            Width: =icongconfig_backbutton.Width
            X: =383
            Y: =99
      - scr03_img_NoReceiptOuter_4:
          Control: Image@2.2.3
          Properties:
            BorderColor: =RGBA(255, 0, 37, 0.2)
            BorderStyle: =BorderStyle.Dashed
            DisplayMode: =DisplayMode.View
            Fill: =RGBA(255, 255, 255, 1)
            Height: =Parent.Height / 4
            Image: =varReceiptImage
            ImagePosition: =ImagePosition.Stretch
            RadiusBottomLeft: =18
            RadiusBottomRight: =18
            RadiusTopLeft: =18
            RadiusTopRight: =18
            Visible: =!IsBlank(varReceiptImage)
            Width: |
              =Parent.Width -  Self.X*2
            X: =24
            Y: |-
              =If(
                  scr03_lbl_PolicyViolationWarning_3.Visible,
                  scr03_lbl_PolicyViolationWarning_3.Y + scr03_lbl_PolicyViolationWarning_3.Height + 27 + ItemizedExpenseBackground_1.Height ,
                  scr03_lbl_ValidationWarning_3.Y + scr03_lbl_ValidationWarning_3.Height + 27 + ItemizedExpenseBackground_1.Height
              )
      - scr03_img_NoReceiptInner_4:
          Control: Image@2.2.3
          Properties:
            BorderColor: =RGBA(166, 166, 166, 1)
            BorderStyle: =BorderStyle.Dashed
            BorderThickness: =5
            DisplayMode: =DisplayMode.View
            Fill: =RGBA(255, 255, 255, 1)
            Height: =Parent.Height/5
            Image: =ImgWhite
            ImagePosition: =ImagePosition.Fill
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Visible: '=IsBlank(varReceiptImage) '
            Width: |
              =Parent.Width -  Self.X*2
            X: =44
            Y: =scr03_img_NoReceiptOuter_4.Y +(scr03_img_NoReceiptOuter_4.Height-scr03_img_NoReceiptInner_4.Height)/2
      - scr03_lbl_AddReceipt_4:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(34, 102, 227, 1)
            DisplayMode: =DisplayMode.View
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Semibold
            Height: =Parent.Height / 4
            OnSelect: |-
              =Navigate('Expenses - Capture Receipt Screen', ScreenTransition.None);
              UpdateContext(
                  {
                      varOnSelectTriggered: false,
                      varOnShowFields:false,
                      varOnChangeTriggered:false
                  }
              )
            TabIndex: =0
            Text: |-
              =If(
                  IsBlank(varReceiptImage),
                  GlobalLabels.Labels.'15062:LocalizedName,msdyn_NoReceiptAttachedLabel',
                  GlobalLabels.Labels.'15062:LocalizedName,msdyn_AddReceiptLabel'
              )
            Visible: '=IsBlank(varReceiptImage) '
            Width: |
              =Parent.Width -  Self.X*2
            X: =26
            Y: =scr03_img_NoReceiptOuter_4.Y
      - scr03_lbl_ChangeReceipt_3:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =scr03_lbl_AddReceipt_4.Color
            Fill: =Color.White
            Font: =Font.'Open Sans'
            OnSelect: |-
              =Navigate('Expenses - View Receipt Screen', ScreenTransition.None, {varViewOnly : true,varItemizedViewOnly: true});
              UpdateContext(
                  {
                      varOnSelectTriggered: false,
                      varOnShowFields:false,
                      varOnChangeTriggered:false
                  }
              )
            PaddingLeft: =35 + scr03_ico_ViewReceipt_3.Width
            Size: =17
            TabIndex: =0
            Text: =GlobalLabels.Labels.'15062:LocalizedName,msdyn_ViewReceiptLabel'
            Visible: =!(IsBlank(varReceiptImage))
            Width: =scr03_img_NoReceiptOuter_4.Width+1
            X: =scr03_img_NoReceiptOuter_4.X
            Y: =scr03_img_NoReceiptOuter_4.Y + (scr03_img_NoReceiptOuter_4.Height -Self.Height)+1
      - scr03_ico_ViewReceipt_3:
          Control: Image@2.2.3
          Properties:
            AccessibleLabel: ="View receipt"
            BorderColor: =RGBA(0, 18, 107, 1)
            Height: =33
            Image: =imageicon
            OnSelect: |-
              =Navigate('Expenses - View Receipt Screen', ScreenTransition.None, {varViewOnly : true});
              UpdateContext(
                  {
                      varOnSelectTriggered: false,
                      varOnShowFields:false,
                      varOnChangeTriggered:false
                  }
              )
            TabIndex: =0
            Visible: =!(IsBlank(varReceiptImage))
            Width: =18
            X: =scr03_lbl_ChangeReceipt_3.X + 25
            Y: =scr03_lbl_ChangeReceipt_3.Y + (scr03_lbl_ChangeReceipt_3.Height-scr03_ico_ViewReceipt_3.Height)/2
      - scr03_lbl_ValidationWarning_3:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(165, 33, 33, 1)
            Fill: =RGBA(249, 217, 217, 1)
            Font: =Font.'Segoe UI'
            Height: |-
              =If(
                  Self.Visible,
                  88,
                  0
              )
            Size: =15
            Text: |-
              =//If(ctVarIsRequiredFieldEmpty,GlobalLabels.Labels.ValidationMsgExpenseNeedMoreDetails)
              //not having receipt in expense is part of policy violation
            Visible: =//ctVarIsRequiredFieldEmpty //Or ((varSelectedItemizedExpenseDoc.receiptsAttached = "No" Or IsBlank(varSelectedItemizedExpenseDoc)) And IsBlank(varReceiptImage))
            Width: =Parent.Width
            Y: =scr03_hdr_TopHeader_3.Height
      - scr03_hdr_TopHeader_3:
          Control: CanvasComponent
          ComponentName: hdr02_Header_6
          Properties:
            Fill: =scr03_hdr_TopHeader_3.paramFill
            Height: =82
            Width: =Max(App.Width, App.MinScreenWidth)
            paramColor: =RGBA(0, 0, 0, 1)
            paramFill: =RGBA(255, 255, 255, 1)
            paramTitle: =GlobalLabels.Labels.'15062:LocalizedName,msdyn_ViewItemizedExpenseLabel'
      - scr03_ico_Back_3:
          Control: Classic/Icon@2.5.0
          Properties:
            AccessibleLabel: ="Press to go back"
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =icongconfig_backbutton.Color
            Fill: =icongconfig_backbutton.Fill
            Height: =icongconfig_backbutton.Height
            Icon: =Icon.ChevronLeft
            OnSelect: |-
              =Navigate('Itemization - View All Itemize Expense Screen',ScreenTransition.Fade,{varNavigatedFrom : varNavigatedFrom})
            TabIndex: =0
            Width: =icongconfig_backbutton.Width
            X: =18
            Y: =(scr03_hdr_TopHeader_3.Height-Self.Height)/2
      - scr03_lbl_PolicyViolationWarning_3:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: |-
              =/*If(
                  !IsBlank(varMaxViolationLevel),
                  If(
                      Value(varMaxViolationLevel) > 0 && Value(varMaxViolationLevel) <= 2,
                      RGBA(152, 111, 11, 1), //yellow
                      RGBA(217, 44, 44, 1)     //red
                  )
              )*/
            Fill: |-
              =If(
                  !IsBlank(varMaxViolationLevel),
                  If(
                      Value(varMaxViolationLevel) > 0 && Value(varMaxViolationLevel) <= 2,
                      RGBA(255, 242, 195, 1), //yellow  
                      RGBA(249, 217, 217, 1)   //red
                  )
              )
            Font: =Font.'Segoe UI'
            Height: |+
              =//If(ctVarIsRequiredFieldEmpty,GlobalLabels.Labels.ValidationMsgExpenseNeedMoreDetails,"Please add a receipt to this expense")
              If(
                  CountRows(colPolViolations) > 0,
                  88, 0
              )

            OnSelect: |-
              =Navigate('Expenses - Policy Violations Screen', ScreenTransition.None, {varCntExpenseTransactionNumber : varSelectedItemizedExpenseDoc.'Expense transaction number (mserp_exptransnumber)'})
            PaddingBottom: =18
            PaddingLeft: =54
            PaddingTop: =18
            Size: =15
            TabIndex: =0
            Text: |
              =Substitute(GlobalLabels.Labels.'15062:LocalizedName,msdyn_PolicyViolationExistsLabel', "$", Text(varNumViolation))
            Visible: =varNumViolation > 0
            Width: |
              =Parent.Width
            Y: =scr03_hdr_TopHeader_3.Height
      - Expense Entr Container_2:
          Control: GroupContainer@1.4.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: |-
              =If(
                  currExpenseType <> 'TrvExpType (mserp)'.Mileage,
                      Value(ButtonBackgroundExpense_2.Y - Self.Y - 10),
                      Value(Parent.Height - Self.Y - 10 - ExpenseInfo_5.Height)  
              )
            LayoutDirection: =LayoutDirection.Vertical
            LayoutOverflowY: =LayoutOverflow.Scroll
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: |
              =Parent.Width
            Y: =scr03_img_NoReceiptOuter_4.Y + scr03_img_NoReceiptOuter_4.Height + 30
          Children:
            - ViewOnlyItemizeExpenseForm:
                Control: Form@2.4.4
                Variant: Classic
                Layout: Vertical
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  BorderColor: =RGBA(0, 18, 107, 1)
                  DataSource: ='Expense lines (mserp)'
                  DefaultMode: =FormMode.View
                  Height: |-
                    =If(
                        currExpenseType <> 'TrvExpType (mserp)'.Mileage,
                            Value(scr03_btn_Done_3.Y - Self.Y - 10),
                        If(
                            currExpenseType = 'TrvExpType (mserp)'.Mileage,
                            Value(Parent.Height - Self.Y - 10 - ExpenseInfo_5.Height)
                        )
                    )
                  Item: =varSelectedItemizedExpenseDoc
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  OnFailure: |-
                    =Notify(
                        Last(Split(Text(Self.Error), ":")).Value, 
                        NotificationType.Error, 
                        gblParams.notificationTime
                    )
                  OnSuccess: "=UpdateContext({varSubmittedExpTransNumber : ViewOnlyItemizeExpenseForm.LastSubmit.'Expense transaction number (mserp_exptransnumber)'});\n//attach receipt if any\nUpdateContext({varAttachReceiptError : Blank()});\nIf(\n    IsBlank(varSelectedItemizedExpenseDoc),\n        If(\n            !IsBlank(varSubmittedExpTransNumber) && !IsBlank(varSelectedReceiptNumber),\n            IfError(\n                Patch(\n                    'Expense Mobile Unattached Document Entity (mserp)',\n                    LookUp('Expense Mobile Unattached Document Entity (mserp)', EntRecId = varSelectedReceiptNumber),\n                    {\n                        ExpTransNumber:varSubmittedExpTransNumber\n                    }\n                ),\n                UpdateContext({varAttachReceiptError : FirstError.Details})\n            );\n            If(\n            !IsBlank(varAttachReceiptError) && !(Text(varAttachReceiptError.HttpStatusCode) = NotFoundStatusCode),\n            Notify(\n                Substitute(\n                    Substitute( Match(varAttachReceiptError.HttpResponse, \"\"\"message\"\":\"\"([^\"\"]*)\"\"\").FullMatch, \n                        \"\"\"message\"\":\", \n                        \"\"), \"\"\"\", \"\"),\n                NotificationType.Error,\n                gblParams.notificationTime\n            ),\n            Notify(\n                GlobalLabels.Labels.'15062:LocalizedName,msdyn_ReceiptAttachedSuccessfullyLabel',\n                NotificationType.Success,\n                gblParams.notificationTime\n            )\n            )       \n        ),\n\n        If(!IsBlank(varSelectedReceiptNumber) && (IsBlank(varSelectedItemizedExpenseDoc.AttachedReceiptId) || Value(varSelectedItemizedExpenseDoc.AttachedReceiptId) <> varSelectedReceiptNumber)              ,\n            IfError(\n                Patch(\n            'Expense Mobile Unattached Document Entity (mserp)',\n           LookUp('Expense Mobile Unattached Document Entity (mserp)', EntRecId = varSelectedReceiptNumber),\n            {\n                ExpTransNumber: varSelectedItemizedExpenseDoc.'Expense transaction number (mserp_exptransnumber)'\n            }\n            ),\n                 UpdateContext({varAttachReceiptError : FirstError.Details})\n            );\n            If(\n                !IsBlank(varAttachReceiptError) && !(Text(varAttachReceiptError.HttpStatusCode) = NotFoundStatusCode),\n                Notify(\n                    Substitute(\n                        Substitute( \n                            Match(varAttachReceiptError.HttpResponse, \"\"\"message\"\":\"\"([^\"\"]*)\"\"\").FullMatch, \n                            \"\"\"message\"\":\", \n                            \"\"\n                        ), \"\"\"\", \"\"\n                    ),\n                    NotificationType.Error,\n                    gblParams.notificationTime\n                ),\n               Notify(\n                GlobalLabels.Labels.'15062:LocalizedName,msdyn_ReceiptAttachedSuccessfullyLabel',\n                NotificationType.Success,\n                gblParams.notificationTime\n            )\n        )\n)\n);\n//create or update expense\nIf(\n    varIsCreate,\n    Notify(\n        GlobalLabels.Labels.'15062:LocalizedName,msdyn_ExpenseCreateMessageLabel',\n        NotificationType.Success,\n        gblParams.notificationTime\n    ),\n    If(\n        isDirty || isExpenseReceiptAttached,\n        Notify(\n            GlobalLabels.Labels.'15062:LocalizedName,msdyn_ExpenseUpdateMessageLabel', \n            NotificationType.Success,\n            gblParams.notificationTime)   \n    )\n);\n\nIf(!IsBlank(ViewOnlyItemizeExpenseForm.LastSubmit),\nSet(\n    varSelectedItemizedExpenseDoc,\n    ViewOnlyItemizeExpenseForm.LastSubmit\n)\n);\n\nUpdateContext({varSubmittedExpTransNumber :Blank()});\nSet(\n    varIsCreate,\n    false\n);\nSet(\n    isExpenseReceiptAttached,\n    false\n);\nSet(\n    OCRresponse,\n    Blank()\n);\nSet(\n    gblNavigationDrawerVisibility,\n    false\n);\nIf(\n    varIsCreate,\n    Navigate('Expenses - List Screen'),\n    If(\n        !IsBlank(varNavigatedFrom),\n        UpdateContext({varExpenseReportNumber : varSelectedReport.'Expense report number'});\n        Set(\n            varSelectedReport,\n            LookUp('Expense reports (mserp)_1','Expense report number' = varExpenseReportNumber)\n        );\n        ClearCollect(\n            colAttachedExpensesForReport,\n            Filter(\n                'Expense lines (mserp)',\n                'Expense report number (mserp_expnumber)' = varSelectedReport.'Expense report number' \n                && 'Expense line type' <> 'Expense line type (mserp)'.'Itemized line'\n            )\n        );\n        ClearCollect(\n            colAttachedExpenses,\n            colAttachedExpensesForReport\n        )\n    );\n    Switch(\n        varNavigatedFrom,\n        \"scr17\",\n        Navigate('Reports - Edit Screen'),\n        \"scr20\",\n        Navigate('Reports - View Only Screen'),\n        \"scr18\",\n        Navigate('Reports - Attach Expenses Screen'),\n        \"scr19\",\n        Navigate('Reports - View Attached Expenses Screen'),\n        \"ItemizationDetailScreen\",\n        Navigate('Itemization - View All Itemize Expense Screen'),\n        Blank(),\n        Navigate('Expenses - List Screen')\n    );\n    UpdateContext({varNavigatedFrom : Blank()});\n);\nUpdateContext(\n    {\n        dirtyTransAmount:Blank(),\n        dirtyTransDate : Blank(),\n        dirtyMerchant : Blank(),\n        varOnSelectTriggered: false,\n        varOnShowFields:false,\n        varOnChangeTriggered:false,\n        varSalesTaxAmount: Blank(),\n        locItemizeButtonVisibilityFlag: false\n    }\n)\n        "
                  SnapToColumns: =false
                  Width: =Parent.Width
                  Y: =scr03_img_NoReceiptOuter_4.Y + scr03_img_NoReceiptOuter_4.Height + 30
                Children:
                  - Expense category_DataCard3_6:
                      Control: TypedDataCard@1.0.7
                      Variant: ClassicAllowedValuesStringEdit
                      Properties:
                        AllowedValues: |-
                          =Filter(
                              'Expense category (mserp)',
                              'Company Code' = varSelectedLegalEntity && Inactive = 'NoYes (mserp)'.No
                          )
                        BorderColor: =gblParams.dropDownBorderColor
                        DataField: ="mserp_costtype"
                        Default: =varSelectedItemizedExpenseDoc.'Expense category (mserp_costtype)'
                        DisplayName: =DataSourceInfo([@'Expense lines (mserp)'],DataSourceInfo.DisplayName,'Expense category (mserp_costtype)')
                        Required: =true
                        Update: =ComboBox1_10.Selected.'Expense category'
                        Visible: =false
                        Width: =Parent.Width
                        X: =1
                        Y: =expenseCategoryFieldOrder_Y
                      Children:
                        - DataCardKey3_6:
                            Control: Label@2.5.1
                            MetadataKey: FieldName
                            Properties:
                              AutoHeight: =true
                              BorderColor: =RGBA(0, 0, 0, 1)
                              Color: =gblParams.dropDownLabelColor
                              FocusedBorderThickness: =
                              Font: =Font.'Segoe UI'
                              Height: =48
                              Text: '=LookUp(labelTableLookUp, labelName = Parent.DisplayName, localisedLabelName) '
                              Width: =Parent.Width - 60
                              Wrap: =false
                              X: =30
                              Y: =10
                        - DataCardValue3_6:
                            Control: Classic/DropDown@2.3.1
                            MetadataKey: FieldValue
                            Properties:
                              BorderColor: =If(IsBlank(Parent.Error), Parent.BorderColor, Color.Red)
                              ChevronBackground: =RGBA(56, 96, 178, 1)
                              ChevronFill: =RGBA(255, 255, 255, 1)
                              ChevronHoverBackground: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                              ChevronHoverFill: =RGBA(255, 255, 255, 1)
                              Default: =Parent.Default
                              DisplayMode: =Parent.DisplayMode
                              Font: =Font.'Open Sans'
                              Height: =gblParams.dropDownHeight
                              HoverFill: =gblParams.dropDownHoverFill
                              Items: =Parent.AllowedValues
                              Items.Value: =mserp_dataareaid
                              PressedColor: =RGBA(255, 255, 255, 1)
                              PressedFill: =RGBA(0, 18, 107, 1)
                              SelectionColor: =RGBA(255, 255, 255, 1)
                              SelectionFill: =RGBA(56, 96, 178, 1)
                              Size: =24
                              Tooltip: =varSelectedItemizedExpenseDoc.'Expense category (mserp_costtype)'
                              Visible: =false
                              Width: =Parent.Width - 60
                              X: =30
                              Y: =DataCardKey3_6.Y + DataCardKey3_6.Height + 5
                        - ErrorMessage3_6:
                            Control: Label@2.5.1
                            MetadataKey: ErrorMessage
                            Properties:
                              AutoHeight: =true
                              BorderColor: =RGBA(0, 0, 0, 1)
                              Color: =RGBA(168, 0, 0, 1)
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =10
                              Live: =Live.Assertive
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =gblParams.errorMessageSize
                              Text: =Parent.Error
                              Visible: =Parent.DisplayMode=DisplayMode.Edit
                              Width: =Parent.Width - 60
                              X: =30
                              Y: =DataCardValue3_6.Y + DataCardValue3_6.Height
                        - StarVisible3_6:
                            Control: Label@2.5.1
                            MetadataKey: FieldRequired
                            Properties:
                              Align: =Align.Center
                              BorderColor: =RGBA(0, 0, 0, 1)
                              Color: =RGBA(0, 18, 107, 1)
                              Font: =Font.'Open Sans'
                              Height: =DataCardKey3_6.Height
                              Text: ="*"
                              Visible: =And(Parent.Required, Parent.DisplayMode=DisplayMode.Edit)
                              Width: =30
                              Wrap: =false
                              Y: =DataCardKey3_6.Y
                        - ComboBox1_10:
                            Control: Classic/ComboBox@2.4.0
                            Properties:
                              AccessibleLabel: =Concatenate("Select ", Parent.DisplayName)
                              BorderColor: =If(IsBlank(Parent.Error), Parent.BorderColor, Color.Red)
                              BorderThickness: =If(Parent.Error, gblParams.dorpDownBorderThickness, 0)
                              ChevronBackground: =RGBA(56, 96, 178, 1)
                              ChevronFill: =RGBA(255, 255, 255, 1)
                              ChevronHoverBackground: =ColorFade(RGBA(56, 96, 178, 1), -20%)
