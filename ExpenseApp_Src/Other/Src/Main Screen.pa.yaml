Screens:
  Main Screen:
    Properties:
      Fill: =RGBA(245, 246, 248, 1)
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
    Children:
      - MainScreen_Logo:
          Control: Image@2.2.3
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Height: =If(App.Width >= 1024, 150, 100)
            Image: =DCSL_Logo
            Width: =If(App.Width >= 1024, 450, Parent.Width - 80)
            X: =(Parent.Width - Self.Width) / 2
            Y: =If(App.Width >= 1024, Parent.Height * 0.15, Parent.Height * 0.2)
      - MainScreen_TitleLabel:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(30, 30, 30, 1)
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Bold
            Height: =If(App.Width >= 1024, 60, 50)
            Size: =If(App.Width >= 1024, 36, 28)
            Text: ="Expense Management"
            Width: =Parent.Width - 40
            X: =(Parent.Width - Self.Width) / 2
            Y: =MainScreen_Logo.Y + MainScreen_Logo.Height + 40
      - MainScreen_WelcomeLabel:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(80, 80, 80, 1)
            Font: =Font.'Segoe UI'
            Height: =35
            Size: =If(App.Width >= 1024, 22, 16)
            Text: |-
              ="Welcome back, " & First(Split(User().FullName, " ")).Value & " 👋"
            Width: =Parent.Width - 40
            X: =(Parent.Width - Self.Width) / 2
            Y: =MainScreen_TitleLabel.Y + MainScreen_TitleLabel.Height + 10
      - conMainLayout:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =conFinanceSection.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
            PaddingBottom: =8
            PaddingLeft: =8
            PaddingRight: =8
            PaddingTop: =8
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width - 40
            X: =20
            Y: =MainScreen_WelcomeLabel.Y + MainScreen_WelcomeLabel.Height + 100
          Children:
            - conFinanceSection:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.Start
                  BorderColor: =RGBA(0,0,0,0.05)
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(255, 255, 255, 1)
                  Height: =conFinanceHeader.Height + galFinanceMenu.Height + 40
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =8
                  PaddingLeft: =8
                  PaddingRight: =8
                  PaddingTop: =8
                  RadiusBottomLeft: =16
                  RadiusBottomRight: =16
                  RadiusTopLeft: =16
                  RadiusTopRight: =16
                  Width: =Parent.Width/2
                Children:
                  - conFinanceHeader:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =40
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =10
                        LayoutJustifyContent: =LayoutJustifyContent.Center
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingBottom: =8
                        PaddingLeft: =8
                        PaddingRight: =8
                        PaddingTop: =8
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =Parent.Width
                        X: =40
                        Y: =40
                      Children:
                        - imgFinanceHeader:
                            Control: Image@2.2.3
                            Properties:
                              BorderColor: =RGBA(0, 18, 107, 1)
                              Height: =24
                              Image: ='Receipt--Streamline-Core'
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              Width: =24
                        - lblFinance:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0, 18, 107, 1)
                              Color: =RGBA(30, 30, 30, 1)
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Bold
                              Height: =Parent.Height
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              Size: =If(App.Width >= 1024, 18, 14)
                              Text: ="Finance Review"
                              Width: =180
                  - galFinanceMenu:
                      Control: Gallery@2.15.0
                      Variant: Vertical
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        FillPortions: =0
                        Height: =CountRows(Self.AllItems) * Self.TemplateHeight
                        Items: =Filter(colLandingMenu, Category = "Finance")
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        TemplatePadding: =0
                        TemplateSize: =btnFinance.Height + If(App.Width >= 1024, 24, 16)
                      Children:
                        - btnFinance:
                            Control: Classic/Button@2.2.0
                            Properties:
                              Align: =Align.Left
                              BorderColor: =RGBA(163, 32, 53, 0.3)
                              BorderThickness: =1.5
                              Color: =RGBA(163, 32, 53, 1)
                              DisabledBorderColor: =RGBA(166, 166, 166, 1)
                              Fill: =RGBA(255, 255, 255, 1)
                              Font: =Font.'Open Sans'
                              Height: =If(App.Width >= 1024, 80, 60)
                              HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                              HoverColor: =RGBA(163, 32, 53, 1)
                              HoverFill: =RGBA(163, 32, 53, 0.08)
                              OnSelect: |-
                                =Set(varAppMode, ThisItem.AppMode);
                                Set(varSelectedTab, 2);
                                Navigate('Expenses - List Screen', ScreenTransition.Fade)
                              PaddingLeft: =20
                              PressedBorderColor: =Self.Fill
                              PressedColor: =RGBA(255, 255, 255, 1)
                              PressedFill: =RGBA(163, 32, 53, 1)
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                              Size: =If(App.Width >= 1024, 18, 14)
                              Text: =ThisItem.DisplayName
                              Width: =If(App.Width >= 1024, Parent.TemplateWidth * 0.7, Parent.TemplateWidth - 40)
                              X: =(Parent.TemplateWidth - Self.Width) / 2
                              Y: =(Parent.TemplateHeight - Self.Height) / 2
            - conHRSection:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.Start
                  BorderColor: =RGBA(0,0,0,0.05)
                  BorderThickness: =1
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(255, 255, 255, 1)
                  Height: =conHRHeader.Height + galHRMenu.Height + 40
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =8
                  PaddingLeft: =8
                  PaddingRight: =8
                  PaddingTop: =8
                  RadiusBottomLeft: =16
                  RadiusBottomRight: =16
                  RadiusTopLeft: =16
                  RadiusTopRight: =16
                  Width: =Parent.Width/2
                Children:
                  - conHRHeader:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =40
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =10
                        LayoutJustifyContent: =LayoutJustifyContent.Center
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingBottom: =8
                        PaddingLeft: =8
                        PaddingRight: =8
                        PaddingTop: =8
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =Parent.Width
                        X: =40
                        Y: =40
                      Children:
                        - imgHRHeader:
                            Control: Image@2.2.3
                            Properties:
                              BorderColor: =RGBA(0, 18, 107, 1)
                              Height: =24
                              Image: ='User-Multiple-Group--Streamline-Core'
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              Width: =24
                        - lblHR:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0, 18, 107, 1)
                              Color: =RGBA(30, 30, 30, 1)
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Bold
                              Height: =Parent.Height
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              Size: =If(App.Width >= 1024, 18, 14)
                              Text: ="HR Review"
                              Width: =140
                  - galHRMenu:
                      Control: Gallery@2.15.0
                      Variant: Vertical
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        FillPortions: =0
                        Height: =CountRows(Self.AllItems) * Self.TemplateHeight
                        Items: =Filter(colLandingMenu, Category = "HR")
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        TemplatePadding: =0
                        TemplateSize: =btnHR.Height + If(App.Width >= 1024, 24, 16)
                      Children:
                        - btnHR:
                            Control: Classic/Button@2.2.0
                            Properties:
                              Align: =Align.Left
                              BorderColor: =RGBA(163, 32, 53, 0.3)
                              BorderThickness: =1.5
                              Color: =RGBA(163, 32, 53, 1)
                              DisabledBorderColor: =RGBA(166, 166, 166, 1)
                              Fill: =RGBA(255, 255, 255, 1)
                              Font: =Font.'Open Sans'
                              Height: =If(App.Width >= 1024, 80, 60)
                              HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                              HoverColor: =RGBA(163, 32, 53, 1)
                              HoverFill: =RGBA(163, 32, 53, 0.08)
                              OnSelect: |-
                                =Set(varAppMode, ThisItem.AppMode);
                                Set(varSelectedTab, 2);
                                Navigate('Expenses - List Screen', ScreenTransition.Fade)
                              PaddingLeft: =20
                              PressedBorderColor: =Self.Fill
                              PressedColor: =RGBA(255, 255, 255, 1)
                              PressedFill: =RGBA(163, 32, 53, 1)
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                              Size: =If(App.Width >= 1024, 18, 14)
                              Text: =ThisItem.DisplayName
                              Width: =If(App.Width >= 1024, Parent.TemplateWidth * 0.7, Parent.TemplateWidth - 40)
                              X: =(Parent.TemplateWidth - Self.Width) / 2
                              Y: =(Parent.TemplateHeight - Self.Height) / 2
