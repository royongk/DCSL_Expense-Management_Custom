Screens:
  Main Screen:
    Properties:
      Fill: =RGBA(248, 248, 248, 1)
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
    Children:
      - MainScreen_Logo:
          Control: Image@2.2.3
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Height: =120
            Image: =DCSL_Logo
            Width: =Parent.Width - 80
            X: =(Parent.Width - Self.Width) / 2
            Y: =Parent.Height / 3
      - MainScreen_TitleLabel:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(30, 30, 30, 1)
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Bold
            Height: =50
            Size: =28
            Text: ="Expense Management"
            Width: =Parent.Width - 40
            X: =(Parent.Width - Self.Width) / 2
            Y: =MainScreen_Logo.Y + MainScreen_Logo.Height + 40
      - MainScreen_WelcomeLabel:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(80, 80, 80, 1)
            Font: =Font.'Segoe UI'
            Height: =35
            Size: =18
            Text: ="Welcome, " & Coalesce(User().FullName, "User")
            Width: =Parent.Width - 40
            X: =(Parent.Width - Self.Width) / 2
            Y: =MainScreen_TitleLabel.Y + MainScreen_TitleLabel.Height + 10
      - MainScreen_ExpenseReportBtn:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(163, 32, 53, 1)
            Color: =Color.White
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =RGBA(163, 32, 53, 1)
            Font: =Font.'Segoe UI'
            Height: =60
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(123, 12, 33, 1)
            OnSelect: |-
              =Set(varAppMode, "ExpenseReport");
              Set(varSelectedTab, 2);
              Navigate('Expenses - List Screen', ScreenTransition.Fade)
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =RGBA(123, 12, 33, 1)
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Size: =18
            Text: ="Expense Report"
            Width: =Parent.Width - 240
            X: =(Parent.Width - Self.Width) / 2
            Y: =MainScreen_WelcomeLabel.Y + MainScreen_WelcomeLabel.Height + 50
      - MainScreen_AirfareAllowanceBtn:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(163, 32, 53, 1)
            Color: =RGBA(163, 32, 53, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =Color.White
            Font: =Font.'Segoe UI'
            Height: =60
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(184, 0, 0, 1)
            OnSelect: |-
              =Set(varAppMode, "AirfareAllowance");
              Set(varSelectedTab, 2);
              Navigate('Expenses - List Screen', ScreenTransition.Fade)
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =RGBA(240, 230, 230, 1)
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Size: =18
            Text: ="Airfare Allowance"
            Width: =Parent.Width - 240
            X: =(Parent.Width - Self.Width) / 2
            Y: =MainScreen_ExpenseReportBtn.Y + MainScreen_ExpenseReportBtn.Height + 20
