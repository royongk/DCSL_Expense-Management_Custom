Screens:
  Profile - About Screen:
    Properties:
      Fill: =RGBA(248, 248, 248, 1)
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
    Children:
      - About Screen Top header:
          Control: CanvasComponent
          ComponentName: header-navigation-PolicyViolation
          Properties:
            BackButtonClicked: |-
              =If(IsBlank(gblScreenName),
              Navigate('Expenses - List Screen'),
              Navigate(gblScreenName)
              )
            Fill: =Color.White
            HeaderText: =GlobalLabels.Labels.'15062:LocalizedName,msdyn_AboutLabel'
            Height: =82
            Width: =Max(App.Width, App.MinScreenWidth)
      - MobileAppLogo:
          Control: Image@2.2.3
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            DisplayMode: =DisplayMode.View
            Height: ='Profile - About Screen'.Height * 0.15
            Image: =ExpenseManagementLogo
            Width: ='Profile - About Screen'.Width * 0.23
            X: =App.Width/2 - MobileAppLogo.Width/2
            Y: ='About Screen Top header'.Height + MobileAppNameLabel.Height * 0.4
      - MobileAppNameLabel:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            DisplayMode: =DisplayMode.View
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Height: ='Profile - About Screen'.Height * 0.053
            Text: =GlobalLabels.Labels.'15062:LocalizedName,msdyn_ExpenseManagementLabel'
            Width: =320
            X: ='Profile - About Screen'.Width/2 - MobileAppNameLabel.Width/2
            Y: =MobileAppLogo.Y + MobileAppLogo.Height + 4
      - BackgroundRectangle:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            DisplayMode: =DisplayMode.View
            Fill: =Color.White
            Height: =SessionIdValue.Height + AppVersionValue.Height * 1.8
            Width: =App.Width
            Y: =MobileAppNameLabel.Y + MobileAppNameLabel.Height + 55
      - AppVersionLabel:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Font: =Font.'Open Sans'
            Height: =58
            Text: =GlobalLabels.Labels.'15062:LocalizedName,msdyn_AppVersionLabel'
            Width: =236
            X: =24
            Y: =BackgroundRectangle.Y + 13
      - Session_Id_label:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Font: =Font.'Open Sans'
            Height: =72
            Text: =GlobalLabels.Labels.'15062:LocalizedName,msdyn_SessionIdLabel'
            Width: =148
            X: =24
            Y: =AppVersionValue.Y + AppVersionValue.Height
      - AppVersionValue:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Right
            BorderColor: =RGBA(0, 18, 107, 1)
            DisplayMode: =DisplayMode.View
            Font: =Font.'Open Sans'
            Text: =LookUp(Solutions, Name = "msdyn_ExpenseMobileApp", Version)
            Width: =App.Width * 0.54
            X: |-
              =//AppVersionLabel.X + AppVersionLabel.Width + AppVersionLabel.Height * 0.6
              App.Width - AppVersionValue.Width - 2
            Y: =BackgroundRectangle.Y + 13
      - SessionIdValue:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Right
            BorderColor: =RGBA(0, 18, 107, 1)
            Font: =Font.'Open Sans'
            Height: =58
            Text: =Host.SessionID
            Width: =App.Width * 0.54
            X: |-
              =//AppVersionLabel.X + AppVersionLabel.Width + AppVersionLabel.Height * 0.6
              App.Width - SessionIdValue.Width - 2
            Y: =AppVersionValue.Y + AppVersionValue.Height
      - AboutScreenDoneButton:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            DisplayMode: |
              =DisplayMode.Edit
            Fill: =RGBA(34, 102, 227, 1)
            Font: =Font.'Segoe UI'
            Height: =87
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            OnSelect: |-
              =If(IsBlank(gblScreenName),
              Navigate('Expenses - List Screen'),
              Navigate(gblScreenName)
              )
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Text: =GlobalLabels.Labels.'15062:LocalizedName,msdyn_DoneButtonLabel'
            Width: =Parent.Width -  Self.X*2
            X: =40
            Y: =Parent.Height - Self.Height - 25
      - CopySessionIdIcon:
          Control: Classic/Icon@2.5.0
          Properties:
            AccessibleLabel: ="Copy session id"
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(0, 18, 107, 1)
            Height: =32
            Icon: =Icon.Copy
            OnSelect: =Copy(Host.SessionID)
            TabIndex: =0
            Width: =38
            X: =172
            Y: '=AppVersionValue.Y + AppVersionValue.Height + 13 '
