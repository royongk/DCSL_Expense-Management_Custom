Screens:
  Profile - Change Legal Entity Screen:
    Properties:
      Fill: =RGBA(248, 248, 248, 1)
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |+
        =//Setting Confirmation Dialog Box Visibility to false 
        UpdateContext({locChangeLEDialogVisilibilty :false});

        Reset(legalEntityDropdown);

        //Using collection as we have to apply filter on the employee field which is virtual
        ClearCollect(
            colLegalEntity,
            'Legal entities (mserp)'
        );
        UpdateContext({currentCompany : LookUp('Legal entities (mserp)', Company = varSelectedLegalEntity).Name});


    Children:
      - Change Legal Entity Top Header:
          Control: CanvasComponent
          ComponentName: header-navigation-PolicyViolation
          Properties:
            BackButtonClicked: |-
              =If(IsBlank(gblScreenName),
              Navigate('Expenses - List Screen'),
              Navigate(gblScreenName)
              );
              Reset(legalEntityDropdown);
            Fill: =Color.White
            HeaderText: =GlobalLabels.Labels.'15062:LocalizedName,msdyn_ChangeLegalEntityLabel'
            Height: =82
            Width: =App.Width
      - Rectangle8:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =Color.White
            Height: =changeLEDoneButton.Height * 1.6
            Width: =App.Width
            Y: =App.Height - Rectangle8.Height
      - changeLEDoneButton:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            DisplayMode: |
              =If(
                  IsBlank(legalEntityDropdown.Selected),
                  DisplayMode.Disabled,
                  DisplayMode.Edit
              )
            Fill: =RGBA(34, 102, 227, 1)
            Font: =Font.'Segoe UI'
            Height: =87
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            OnSelect: |+
              =UpdateContext({locChangeLEDialogVisilibilty : true})
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Text: =GlobalLabels.Labels.'15062:LocalizedName,msdyn_DoneButtonLabel'
            Width: =Parent.Width -  Self.X * 2
            X: =40
            Y: =Parent.Height - Self.Height - 25
      - ChangeLegalEntitySection:
          Control: GroupContainer@1.3.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =App.Height * 0.284
            LayoutDirection: =LayoutDirection.Vertical
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =App.Width
            Y: ='Change Legal Entity Top Header'.Height + 6
          Children:
            - currectLegalEntityLabel:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  DisplayMode: =DisplayMode.View
                  Font: =Font.'Open Sans'
                  Height: =ChangeLegalEntitySection.Height * 0.109
                  Size: =18
                  Text: =GlobalLabels.Labels.'15062:LocalizedName,msdyn_CurrentLegalEntityLabel'
                  Width: =ChangeLegalEntitySection.Width
            - currentLegalEntityValue:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Font: =Font.'Open Sans'
                  Height: =ChangeLegalEntitySection.Height * 0.218
                  Text: =currentCompany
                  Width: =ChangeLegalEntitySection.Width
            - selectedLegalEntityLabel:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  DisplayMode: =DisplayMode.View
                  Font: =Font.'Open Sans'
                  Height: =ChangeLegalEntitySection.Height * 0.109
                  Size: =18
                  Text: =GlobalLabels.Labels.'15062:LocalizedName,msdyn_SelectedLegalEntityLabel'
                  Width: =ChangeLegalEntitySection.Width
            - selectedLegalEntityValue:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: |-
                    =If(
                        IsBlank(legalEntityDropdown.Selected.Name),
                        RGBA(145, 145, 145, 1),
                        RGBA(0, 0, 0, 1)
                    )
                  Font: =Font.'Open Sans'
                  Height: =ChangeLegalEntitySection.Height * 0.218
                  Text: |-
                    =If(
                        IsBlank(legalEntityDropdown.Selected.Name),
                        GlobalLabels.Labels.'15062:LocalizedName,msdyn_NoEnititySelectedLabel',
                        legalEntityDropdown.Selected.Name
                    )
                  Width: =ChangeLegalEntitySection.Width
            - legalEntityDropdown:
                Control: Classic/ComboBox@2.4.0
                Properties:
                  AccessibleLabel: ="Select legal entity"
                  BorderColor: =RGBA(0, 18, 107, 1)
                  BorderStyle: =BorderStyle.None
                  ChevronBackground: =RGBA(56, 96, 178, 1)
                  ChevronFill: =RGBA(255, 255, 255, 1)
                  ChevronHoverBackground: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                  ChevronHoverFill: =RGBA(255, 255, 255, 1)
                  DisplayFields: =["mserp_company"]
                  FocusedBorderThickness: =0
                  Font: =Font.'Open Sans'
                  Height: =ChangeLegalEntitySection.Height * 0.186
                  HoverFill: =RGBA(186, 202, 226, 1)
                  InputTextPlaceholder: =GlobalLabels.Labels.'15062:LocalizedName,msdyn_SearchPlaceholderLabel'
                  Items: =Filter(colLegalEntity,IsEmployed = 'NoYes (mserp)'.Yes && Upper(Company)<> Upper(varSelectedLegalEntity))
                  NoSelectionText: =GlobalLabels.Labels.'15062:LocalizedName,msdyn_SearchPlaceholderLabel'
                  PressedColor: =RGBA(255, 255, 255, 1)
                  PressedFill: =RGBA(0, 18, 107, 1)
                  SearchFields: =["mserp_company"]
                  SelectMultiple: =false
                  SelectionColor: =RGBA(255, 255, 255, 1)
                  SelectionFill: =gblParams.dropDownBorderColor
                  Width: =ChangeLegalEntitySection.Width
      - confirmationDialogToChangeLE:
          Control: CanvasComponent
          ComponentName: cmp02_ConfirmationDialog
          Properties:
            Height: =App.Height
            LegalEntity: ="Text"
            OnLeftButtonClick: |-
              =UpdateContext({locChangeLEDialogVisilibilty : false})
            OnRightButtonClick: |+
              =Set(
                  varSelectedLegalEntity,
                  Upper(legalEntityDropdown.Selected.Company)
              );
              Clear(colGetProjectsBasedOnResourceCategory);
              ClearCollect(
                  collectionICLE,
                  ForAll(
                  Split(LookUp('Legal entities (mserp)', Upper(Company) = varSelectedLegalEntity,IntercompanyLEs), ",") As legalEntityAlias,
                  {
                      Value: Upper(legalEntityAlias.Value)
                  }
                  )
              );
              //setting default currency for the given legal entity
              If(
                  !IsBlank(varSelectedLegalEntity),
                  Set(
                      varDefaultCurrency,
                      LookUp(
                          'Legal entities (mserp)',
                          Company = varSelectedLegalEntity,
                          Currency
                      )
                  )
              );
              //Changing the preferred legal entity to current selected legal entity
              Patch(
                  'Expense mobile master data (mserp)',
                  LookUp(
                      'Expense mobile master data (mserp)',
                      Email = User().Email
                  ),
                  {UserPreferredLegalEntity: varSelectedLegalEntity}
              );
              Reset(legalEntityDropdown);
              Set(
                  gblNavigationDrawerVisibility,
                  false
              );
              ClearCollect(
                  labelTableLookUp,
                  {
                      fieldName : "",
                      labelName : "",
                      localisedLabelName : "",
                      visible : true,
                      required : false
                  }
              );
              Clear(labelTableLookUp);
              Clear(gblExpenseReportFieldVisibilityReImaginedLookup);
              Clear(gblExpenseReportFieldVisibilityLookup);
              Navigate('Expenses - List Screen');
            SelectedExpense: =
            SelectedList: ="Text"
            SelectedReceiptNumber: =
            Visible: =locChangeLEDialogVisilibilty
            Width: =Max(App.Width, App.MinScreenWidth)
            controlName: ="confirmationDialogToChangeLE"
            parmInDescriptionText: |+
              =Substitute(Substitute(GlobalLabels.Labels.'15062:LocalizedName,msdyn_YourPreferredEntityWillBeChangedFrom', "$", currentCompany), "#", selectedLegalEntityValue.Text)
              //Concatenate("Your preferred entity will be changed from ",currentCompany," to ",selectedLegalEntityValue.Text)
            parmInHeaderText: ="Change legal entity?"
            parmInLeftButtonColor: =RGBA(34, 102, 227, 1)
            parmInLeftButtonText: =GlobalLabels.Labels.'15062:LocalizedName,msdyn_CancelLabel'
            parmInRightButtonColor: =RGBA(34, 102, 227, 1)
            parmInRightButtonText: ="Confirm"
            returnFocus: ="legalEntityDropdown"
