                  Width: =Button1.Width * 0.898
                  X: =49
                  Y: =53
            - Separator4:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 0, 255, 1)
                  Fill: =RGBA(248, 248, 248, 1)
                  Height: =8
                  OnSelect: =Select(Parent)
                  TabIndex: =0
                  Width: =Parent.TemplateWidth
                  Y: =Parent.TemplateHeight - Self.Height
            - AgoLabel:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =RGBA(110, 110, 110, 1)
                  Font: =Font.'Open Sans'
                  Height: =documentTypeLabel.Height
                  OnSelect: =Select(Parent)
                  Size: =14
                  TabIndex: =0
                  Text: |-
                    =If(
                        DateDiff(
                            DateAdd(
                                ThisItem.EventTimeStamp,
                                -TimeZoneOffset(),
                                TimeUnit.Minutes
                            ),
                            Now(),
                            TimeUnit.Seconds
                        ) < 60,
                        Substitute(
                            GlobalLabels.Labels.'15062:LocalizedName,msdyn_SecondAgoLabel',
                            "$",
                            DateDiff(
                                DateAdd(
                                    ThisItem.EventTimeStamp,
                                    -TimeZoneOffset(),
                                    TimeUnit.Minutes
                                ),
                                Now(),
                                TimeUnit.Seconds
                            )
                        ),
                        DateDiff(
                            DateAdd(
                                ThisItem.EventTimeStamp,
                                -TimeZoneOffset(),
                                TimeUnit.Minutes
                            ),
                            Now(),
                            TimeUnit.Minutes
                        ) < 60,
                        Substitute(
                            GlobalLabels.Labels.'15062:LocalizedName,msdyn_MinuteAgoLabel',
                            "$",
                            DateDiff(
                                DateAdd(
                                    ThisItem.EventTimeStamp,
                                    -TimeZoneOffset(),
                                    TimeUnit.Minutes
                                ),
                                Now(),
                                TimeUnit.Minutes
                            )
                        ),
                        DateDiff(
                            DateAdd(
                                ThisItem.EventTimeStamp,
                                -TimeZoneOffset(),
                                TimeUnit.Minutes
                            ),
                            Now(),
                            TimeUnit.Hours
                        ) < 24,
                        Substitute(
                            GlobalLabels.Labels.'15062:LocalizedName,msdyn_HourAgoLabel',
                            "$",
                            DateDiff(
                                DateAdd(
                                    ThisItem.EventTimeStamp,
                                    -TimeZoneOffset(),
                                    TimeUnit.Minutes
