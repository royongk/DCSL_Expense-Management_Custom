Screens:
  Profile - Notification Screen:
    Properties:
      Fill: =RGBA(244, 244, 244, 1)
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |+
        =Refresh('Expense mobile notifications (mserp)');
        /* The purpose of adding a collection is that even if the entity is refreshed while being on the List Notification Screen, but as the user has still not seen the notification, it should not be deleted. Bottom line is whatever list of notification user is currently seeing on screen will only be deleted or marked as read*/
        ClearCollect(
            colExpenseNoticationInfo,
            ForAll(
                Filter('Expense mobile notifications (mserp)',NotifiedEmailId = User().Email) As ExpenseNotification,
                {
                    RecId: ExpenseNotification.EntRecId,
                    ReadMessage: ExpenseNotification.Read
                }
            )
        );
        Refresh('Submitted Reports for Approvals (mserp)');
        ClearCollect(
            workItemsAssignedToMe,
            Filter(
                'Submitted Reports for Approvals (mserp)',
                User = userRecord.ID && 'Document status' = 'Document status (mserp)'.'In review'
            )
        );
    Children:
      - emptyStateComponentNotification:
          Control: CanvasComponent
          ComponentName: emptyStateComponent
          Properties:
            Height: =(App.Height - 'Notification Screen Header'.Height - 'Buttons - Notification Screen Buttons'.Height)  * 0.422
            Visible: =!NotificationGallery.Visible
            Width: =Self.Height
            X: =App.Width / 2 - emptyStateComponentNotification.Width / 2
            Y: =(App.Height - 'Notification Screen Header'.Height - 'Buttons - Notification Screen Buttons'.Height) / 2 - emptyStateComponentNotification.Height / 2
            subTitle: =GlobalLabels.Labels.'15062:LocalizedName,msdyn_NoNotificationLabel'
            title: =GlobalLabels.Labels.'15062:LocalizedName,msdyn_NothingHereYetLabel'
      - Buttons - Notification Screen Buttons:
          Control: GroupContainer@1.3.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =Color.White
            Height: =App.Height * 0.198
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
            Y: =App.Height - 'Buttons - Notification Screen Buttons'.Height
          Children:
            - MarkAllAsReadButton:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =RGBA(34, 102, 227, 1)
                  Color: |
                    =RGBA(34, 102, 227, 1)
                  DisabledBorderColor: =RGBA(166, 166, 166, 1)
                  Fill: =RGBA(255, 255, 255, 1)
                  Font: =Font.'Segoe UI'
                  Height: =DoneButton.Height
                  HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                  OnSelect: |
                    =ForAll(
                        colExpenseNoticationInfo,
                        If( (LookUp(
                                'Expense mobile notifications (mserp)',
                                EntRecId = colExpenseNoticationInfo[@RecId]
                            ).Read) = 'NoYes (mserp)'.No,
                        Patch(
                            'Expense mobile notifications (mserp)',
                            LookUp(
                                'Expense mobile notifications (mserp)',
                                EntRecId = colExpenseNoticationInfo[@RecId]
                            ),
                            {
                                Read: 'NoYes (mserp)'.Yes
                            }
                        )
                        )
                    );
                  PressedBorderColor: =Self.Fill
                  PressedColor: =Self.Fill
                  PressedFill: =Self.Color
                  Size: =19.15
                  Text: =GlobalLabels.Labels.'15062:LocalizedName,msdyn_MarkAllAsReadLabel'
                  Width: |+
                    =Parent.Width -  Self.X*2
                  X: =DoneButton.X
                  Y: "=DoneButton.Y + DoneButton.Height + 'Buttons - Notification Screen Buttons'.Height * 0.0889 "
            - DoneButton:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =ColorFade(Self.Fill, -15%)
                  Color: =RGBA(255, 255, 255, 1)
                  DisabledBorderColor: =RGBA(166, 166, 166, 1)
                  Fill: =RGBA(34, 102, 227, 1)
                  Font: =Font.'Segoe UI'
                  Height: ='Buttons - Notification Screen Buttons'.Height * 0.338
                  HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                  OnSelect: |-
                    =If(IsBlank(gblScreenName),
                    Navigate('Expenses - List Screen'),
                    Navigate(gblScreenName)
                    );

                    Refresh('Expense mobile notifications (mserp)');
                    /* The purpose of adding a collection is that even if the entity is refreshed while being on the List Notification Screen, but as the user has still not seen the notification, it should not be deleted. Bottom line is whatever list of notification user is currently seeing on screen will only be deleted or marked as read*/
                    ClearCollect(
                        colExpenseNoticationInfo,
                        ForAll(
                            Filter('Expense mobile notifications (mserp)',NotifiedEmailId = User().Email) As ExpenseNotification,
                            {
                                RecId: ExpenseNotification.EntRecId,
                                ReadMessage: ExpenseNotification.Read
                            }
                        )
                    );
                  PressedBorderColor: =Self.Fill
                  PressedColor: =Self.Fill
                  PressedFill: =Self.Color
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  Size: =19.15
                  Text: =GlobalLabels.Labels.'15062:LocalizedName,msdyn_DoneButtonLabel'
                  Width: |+
                    =Parent.Width -  Self.X*2
                  X: =App.Width * 0.0625
                  Y: ='Buttons - Notification Screen Buttons'.Height * 0.0889
      - Notification Screen Header:
          Control: CanvasComponent
          ComponentName: header-navigation-PolicyViolation
          Properties:
            BackButtonClicked: |+
              =If(IsBlank(gblScreenName),
              Navigate('Expenses - List Screen'),
              Navigate(gblScreenName)
              );

              Refresh('Expense mobile notifications (mserp)');
              /* The purpose of adding a collection is that even if the entity is refreshed while being on the List Notification Screen, but as the user has still not seen the notification, it should not be deleted. Bottom line is whatever list of notification user is currently seeing on screen will only be deleted or marked as read*/
              ClearCollect(
                  colExpenseNoticationInfo,
                  ForAll(
                      Filter('Expense mobile notifications (mserp)',NotifiedEmailId = User().Email) As ExpenseNotification,
                      {
                          RecId: ExpenseNotification.EntRecId,
                          ReadMessage: ExpenseNotification.Read
                      }
                  )
              );
            Fill: =Color.White
            HeaderText: =GlobalLabels.Labels.'15062:LocalizedName,msdyn_NotificationsLabel'
            Height: =82
            Width: =App.Width
      - clearAllLabel:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(34, 102, 227, 1)
            DisplayMode: |-
              =If(
                  NotificationGallery.Visible,
                  DisplayMode.Edit,
                  DisplayMode.Disabled
              )
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =48
            OnSelect: =RemoveIf('Expense mobile notifications (mserp)', EntRecId in colExpenseNoticationInfo[@RecId])
            Size: =18
            TabIndex: =0
            Text: =GlobalLabels.Labels.'15062:LocalizedName,msdyn_ClearAllLabel'
            Width: =126
            X: =App.Width - clearAllLabel.Width
            Y: =17
      - NotificationGallery:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =RGBA(0,0,0,0)
            Height: =App.Height - 'Notification Screen Header'.Height - 'Buttons - Notification Screen Buttons'.Height - App.Height * 0.0282
            Items: |-
              =Filter(
                  SortByColumns('Expense mobile notifications (mserp)',"mserp_eventtimestamp",SortOrder.Descending),
                  NotifiedEmailId = User().Email
              )
            OnSelect: "=If(\r\n    ThisItem.'Notification type' = 'Expense mobile notification types (mserp)'.Reports,\r\nSet(\r\n    varSelectedReport,\r\n    LookUp('Expense reports (mserp)','Expense report number' = ThisItem.'Expense report number' && LegalEntity_DataArea = varSelectedLegalEntity)\r\n);\r\nIf(\r\n    IsBlank(varSelectedReport),\r\n    UpdateContext({locSelectedReportDiffLE : LookUp('Expense reports (mserp)', 'Expense report number' = ThisItem.'Expense report number')});\r\n    If(!IsBlank(locSelectedReportDiffLE),\r\n        Notify(\r\n        Substitute(GlobalLabels.Labels.'15062:LocalizedName,msdyn_ExpenseReportNotExistPleaseNavigateLabel',\"$\",locSelectedReportDiffLE.LegalEntity_DataArea),\r\n        NotificationType.Warning\r\n    ),\r\n    Notify(\r\n        GlobalLabels.Labels.'15062:LocalizedName,msdyn_ExpenseReportDoesNotExistLabel',\r\n        NotificationType.Error\r\n    )\r\n    )\r\n,\r\nSet(\r\n    varSelectedReportStatusItem,\r\n    varSelectedReport.'Document status'\r\n);\r\nClear(colAttachedExpensesForReport);\r\nForAll(\r\n    Split(varSelectedReport.ExpTransNumber, \",\") As attachedExpenses,\r\n    Collect(\r\n        colAttachedExpensesForReport,\r\n        LookUp('Expense lines (mserp)','Expense transaction number (mserp_exptransnumber)' = attachedExpenses[@Value] && 'Expense line type' <> 'Expense line type (mserp)'.'Itemized line')\r\n    )\r\n);\r\nClearCollect(\r\n    colAttachedExpenses,\r\n    colAttachedExpensesForReport\r\n);\r\n\r\nIf(\r\n    varSelectedReportStatusItem in dsDrafts,\r\n    Navigate('Reports - Edit Screen'),\r\n    Navigate('Reports - View Only Screen');\r\n)),\r\nThisItem.'Notification type' = 'Expense mobile notification types (mserp)'.Approvals && ThisItem.'Document type' = 'Expense document types (mserp)'.'Expense report',\r\n//hold the details of the selected work item in a record to be referenced\r\nSet(\r\n    varSelectedWorkItem,\r\n    LookUp(workItemsAssignedToMe,'Expense report number' = ThisItem.'Expense report number')\r\n);\r\nIf(IsBlank(varSelectedWorkItem),\r\n    Notify(GlobalLabels.Labels.'15062:LocalizedName,msdyn_NoActionRequiredForApprovalLabel',\r\n    NotificationType.Warning\r\n    ),\r\n\r\nClearCollect(\r\n    colExpensesAgainstWorkItem,\r\n    Filter(\r\n        'Expense Lines Attached to a Report for Approvals (mserp)',\r\n        'Expense report number (mserp_expnumber)' = varSelectedWorkItem.'Expense report number' &&\r\n        ReferenceDataAreaId = varSelectedWorkItem.ReferenceDataAreaId &&\r\n        User = userRecord.ID\r\n    )\r\n);\r\nClearCollect(\r\n    colSelectedWorkItemIds,\r\n    {\r\n        expenseReportNumber : varSelectedWorkItem.'Expense report number',\r\n        workItemRecId : varSelectedWorkItem.WorkItemRecId\r\n    }\r\n);\r\nClear(reviewedByForReport);\r\nUpdateContext({\r\n    flowResponse:\r\n    'Submitted Reports for Approvals (mserp)'.mserp_trvexpmobilereportapprovalentity_getworkflowtimeline(varSelectedWorkItem.'Submitted Reports for Approvals (mserp)').return\r\n});\r\nClearCollect(recordIndex, {idx : 1});\r\nForAll(\r\n    Table(\r\n        ParseJSON(\r\n            flowResponse\r\n        )\r\n    ),\r\n    Collect(\r\n        reviewedByForReport,\r\n        {\r\n            message: Text(ThisRecord.Value.Message),       \r\n            comment : Text(ThisRecord.Value.Comment),\r\n            createdDateTime : Text(ThisRecord.Value.CreatedDateTime),\r\n            assignedTo : Text(ThisRecord.Value.User),\r\n            index: First(recordIndex).idx\r\n        }\r\n    );\r\n    Patch(\r\n        recordIndex,\r\n        First(recordIndex),\r\n        {\r\n            idx : First(recordIndex).idx + 1\r\n        }\r\n    )     \r\n);\r\nClearCollect(recordIndex, {idx : 1});\r\n//navigate to the report details screen\r\nNavigate('Approvals - Details Screen', ScreenTransition.Fade, {varSelectedTab : 1})\r\n);,\r\n\r\nThisItem.'Notification type' = 'Expense mobile notification types (mserp)'.Approvals && ThisItem.'Document type' = 'Expense document types (mserp)'.'Expense line',\r\n//Navigate to line for approvals\r\n\r\nSet(\r\n    varSelectedLineItem,\r\n    LookUp('View/Approve/Reject Expense Lines for Approvals (mserp)', 'Expense transaction number (mserp_exptransnumber)' = ThisItem.'Expense transaction number')\r\n);\r\nIf(\r\n    IsBlank(varSelectedLineItem),\r\n    Notify(\r\n        GlobalLabels.Labels.'15062:LocalizedName,msdyn_NoActionRequiredForApprovalLabel',\r\n        NotificationType.Warning\r\n    ),\r\n    Concurrent(\r\n        Set(\r\n            varIsCreate,\r\n            false\r\n        ),\r\n        Set(\r\n            varReceiptImage,  //set as receiptUrl of attached expense\r\n            Blank()\r\n        )\r\n    );\r\n    Set(\r\n        varReceiptImage,\r\n        LookUp('View privilege for Receipts attached to Expense Lines for Approvals (mserp)', EntRecId = Value(varSelectedLineItem.AttachedReceiptId),CapturedDocument)\r\n    );\r\n    Set(\r\n        varFileFormat,\r\n        LookUp('View privilege for Receipts attached to Expense Lines for Approvals (mserp)', EntRecId = Value(varSelectedLineItem.AttachedReceiptId),FileExtension)\r\n    );\r\n    Set(\r\n        varSelectedReceiptNumber,\r\n        Blank()\r\n    );\r\n    ClearCollect(\r\n        colSelectedLineItemIds,\r\n        {\r\n            transactionId : ThisItem.'Expense transaction number'\r\n        }\r\n    );\r\n    Clear(reviewedBy);\r\n    UpdateContext({\r\n        flowResponse:\r\n        'View/Approve/Reject Expense Lines for Approvals (mserp)'.mserp_trvexpmobilelineapprovalentity_getworkflowtimeline(varSelectedLineItem.'View/Approve/Reject Expense Lines for Approvals (mserp)').return\r\n    });\r\n    ClearCollect(recordIndex, {idx : 1});\r\n    ForAll(\r\n        Table(\r\n            ParseJSON(\r\n                flowResponse\r\n            )\r\n        ),\r\n        Collect(\r\n            reviewedBy,\r\n            {\r\n                message: Text(ThisRecord.Value.Message),       \r\n                comment : Text(ThisRecord.Value.Comment),\r\n                createdDateTime : Text(ThisRecord.Value.CreatedDateTime),\r\n                assignedTo : Text(ThisRecord.Value.User),\r\n                index : First(recordIndex).idx\r\n            }\r\n        );\r\n        Patch(\r\n            recordIndex,\r\n            First(recordIndex),\r\n            {\r\n                idx : First(recordIndex).idx + 1\r\n            }\r\n        )\r\n    );\r\n    ClearCollect(recordIndex, {idx : 1});\r\n    Navigate('Approvals - Line Details Screen', ScreenTransition.Fade, {varSelectedTab : 1})\r\n)\r\n,\r\nThisItem.'Notification type' = 'Expense mobile notification types (mserp)'.Expenses,\r\n\r\n//set details for the next screen \r\nConcurrent(\r\n    Set(\r\n        varIsCreate,\r\n        false\r\n    ),\r\n    Set(\r\n        varReceiptImage,\r\n        Blank()\r\n    )\r\n);\r\n// assign the expense to a varSelectedExpenseDoc\r\nSet(\r\n    varSelectedExpenseDoc,\r\n    LookUp('Expense lines (mserp)','Expense transaction number (mserp_exptransnumber)' = ThisItem.'Expense transaction number' && 'Company Code' = varSelectedLegalEntity)\r\n);\r\nIf(\r\n    IsBlank(varSelectedExpenseDoc),\r\n    UpdateContext({locSelectedExpenseDiffLE : LookUp('Expense lines (mserp)','Expense transaction number (mserp_exptransnumber)' = ThisItem.'Expense transaction number')});\r\n    If(\r\n        !IsBlank(locSelectedExpenseDiffLE),\r\n        Notify(\r\n        Substitute(GlobalLabels.Labels.'15062:LocalizedName,msdyn_ExpenseNotExistPleaseNavigateLabel',\"$\",locSelectedExpenseDiffLE.'Company Code'),\r\n        NotificationType.Warning\r\n    ),\r\n    Notify(\r\n        GlobalLabels.Labels.'15062:LocalizedName,msdyn_ExpenseDoesNotExistLabel',\r\n        NotificationType.Warning\r\n    )\r\n    ),\r\n    !IsBlank(varSelectedExpenseDoc.'Expense report number (mserp_expnumber)'),\r\n    Notify(\r\n    Substitute(GlobalLabels.Labels.'15062:LocalizedName,msdyn_ExpenseLineAlreadyAttachedToAReportLabel',\"$\",varSelectedExpenseDoc.'Expense report number (mserp_expnumber)'),\r\n    NotificationType.Warning),\r\n    \r\n// populating base64 to show image on selection of expense\r\nSet(\r\n    varReceiptImage,\r\n    LookUp('Expense Mobile Attached Document Entity (mserp)', EntRecId = Value(varSelectedExpenseDoc.AttachedReceiptId),CapturedDocument) \r\n);\r\nSet(\r\n    varFileFormat,\r\n    LookUp('Expense Mobile Attached Document Entity (mserp)', EntRecId = Value(varSelectedExpenseDoc.AttachedReceiptId),FileExtension)\r\n);\r\n// collect policy violations\r\nIf(\r\n    varSelectedExpenseDoc.PolicyViolationCount,\r\n    ClearCollect(\r\n        colPolViolations,\r\n        Split(varSelectedExpenseDoc.PolicyViolationErrorMessage, \"~|~\")\r\n    );\r\n    UpdateContext({varMaxViolationLevel : varSelectedExpenseDoc.PolicyViolationsLevel});\r\n    UpdateContext({varNumViolation : varSelectedExpenseDoc.PolicyViolationCount}),\r\n    Clear(colPolViolations);\r\n    UpdateContext({varMaxViolationLevel : 0});\r\n    UpdateContext({varNumViolation : 0})\r\n);\r\n\r\nNavigate('Expenses - Edit Screen', ScreenTransition.None, {varNavigatedFrom : Blank(), varMaxViolationLevel : varMaxViolationLevel, varNumViolation: varNumViolation})\r\n\r\n)\r\n);\r\nPatch(\r\n    'Expense mobile notifications (mserp)',\r\n    LookUp(\r\n        'Expense mobile notifications (mserp)',\r\n        EntRecId = ThisItem.EntRecId\r\n    ),\r\n    {Read: 'NoYes (mserp)'.Yes}\r\n)\r\n"
            TemplateSize: =Button1.Height + Separator4.Height + Container4.Height
            Visible: =Self.AllItemsCount > 0
            Width: =App.Width - App.Width * 0.03125
            X: =App.Width * 0.01875
            Y: ='Notification Screen Header'.Height + App.Height * 0.0140
          Children:
            - Container4:
                Control: GroupContainer@1.3.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.Regular
                  Height: =7
                  LayoutDirection: =LayoutDirection.Vertical
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Button1.Width - (NotificationGallery.Width - Button1.Width + 1) * 2
                  X: =11
                  Y: =Button1.Y + Button1.Height - Self.Height
            - Button1:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =ColorFade(Self.Fill, -15%)
                  Color: =RGBA(255, 255, 255, 1)
                  DisabledBorderColor: =RGBA(166, 166, 166, 1)
                  DisplayMode: =DisplayMode.View
                  Fill: "=If(ThisItem.Read = 'NoYes (mserp)'.No,\r\n    Color.White,\r\n    RGBA(250, 249, 248, 1)\r\n)    "
                  Font: =Font.'Open Sans'
                  Height: =notificationMessageLabel.Height + documentTypeLabel.Height * 3 - 15
                  HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: =Color.White
                  OnSelect: =Select(Parent)
                  PressedBorderColor: =Self.Fill
                  PressedColor: =Self.Fill
                  PressedFill: =Self.Color
                  Text: =
                  Width: =NotificationGallery.Width - 11
            - documentTypeImage:
                Control: Image@2.2.3
                Properties:
                  AccessibleLabel: ="Select notification"
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Height: =30
                  Image: |+
                    =If(ThisItem.Read = 'NoYes (mserp)'.No,
                    If(ThisItem.'Notification type' = 'Expense mobile notification types (mserp)'.Reports && (ThisItem.'Event type'='Expense mobile notification event types (mserp)'.'Work item assigned to queue' || ThisItem.'Event type'='Expense mobile notification event types (mserp)'.'Workflow completed'),
                    SelectedReport,
                    ThisItem.'Notification type' = 'Expense mobile notification types (mserp)'.Reports && (ThisItem.'Event type'='Expense mobile notification event types (mserp)'.'Work item returned'),
                    WarningReports,
                    ThisItem.'Notification type' = 'Expense mobile notification types (mserp)'.Reports && (ThisItem.'Event type'='Expense mobile notification event types (mserp)'.'Work item rejected'),
                    RejectedReports,
                    ThisItem.'Notification type' = 'Expense mobile notification types (mserp)'.Expenses && (ThisItem.'Event type'='Expense mobile notification event types (mserp)'.'Work item assigned to queue' || ThisItem.'Event type'='Expense mobile notification event types (mserp)'.'Workflow completed'),
                    IcnFooterExpenseSelected,
                    ThisItem.'Notification type' = 'Expense mobile notification types (mserp)'.Expenses && (ThisItem.'Event type'='Expense mobile notification event types (mserp)'.'Work item returned'),
                    ReturnedExpenseIcon,
                    ThisItem.'Notification type' = 'Expense mobile notification types (mserp)'.Expenses && (ThisItem.'Event type'='Expense mobile notification event types (mserp)'.'Work item rejected'),
                    RejectedExpenseIcon,
                    ThisItem.'Notification type' = 'Expense mobile notification types (mserp)'.Expenses,
                    IcnFooterExpenseSelected,
                    ThisItem.'Notification type' = 'Expense mobile notification types (mserp)'.Approvals ,
                    approvalSelected
                    ),
                    ThisItem.'Notification type' = 'Expense mobile notification types (mserp)'.Reports,
                    IcnFooterReportsUnSelected,
                    ThisItem.'Notification type' = 'Expense mobile notification types (mserp)'.Expenses,
                    ExpensesUnselected,
                    ThisItem.'Notification type' = 'Expense mobile notification types (mserp)'.Approvals ,
                    approvalsIcon
                    )
                  OnSelect: =Select(Parent)
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  TabIndex: =0
                  Width: =20
                  X: =Button1.Width *  0.0411
                  Y: =Button1.Y + 17
            - documentTypeLabel:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 1)
                  Color: =RGBA(110, 110, 110, 1)
