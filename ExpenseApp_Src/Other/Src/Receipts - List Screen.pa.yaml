      - scr09_hdr_TopHeader:
          Control: CanvasComponent
          ComponentName: main-app-header
          Properties:
            Fill: =Color.White
            Height: =85
            OnSelectButton: |-
              =Set(
                  gblNavigationDrawerVisibility,
                  true
              );
              Set(
                  gblScreenName,
                  'Receipts - List Screen'
              );
              Refresh('Expense mobile notifications (mserp)');
              ClearCollect(
                  colExpenseNoticationInfo,
                  ForAll(
                      Filter('Expense mobile notifications (mserp)',NotifiedEmailId = User().Email) As ExpenseNotification,
                      {
                          RecId: ExpenseNotification.EntRecId,
                          ReadMessage: ExpenseNotification.Read
                      }
                  )
              );
            Width: =Parent.Width
            Y: =1
            firstIcon: =If(varCntReceiptGridView, icnTileselected, icnListSelected)
            firstIconAccessibleLabel: |
              =If(varCntReceiptGridView, "Select to open Receipt grid view", "Select to open Receipt list view")
            firstIconAction: |+
              =If(
                  varCntReceiptGridView, 
                  UpdateContext({varCntReceiptGridView:false});
                  UpdateContext({varCntReceiptListView:true}),
                  UpdateContext({varCntReceiptGridView:true});
                  UpdateContext({varCntReceiptListView:false})
              )

            homeIcon: =homeIcon
            homeIconAccessibleLabel: ="Navigate Home"
            homeIconAction: =Navigate('Main Screen', ScreenTransition.Fade)
            paramAvatar: =Coalesce(userImage, blankImage)
            paramTitle: =GlobalLabels.Labels.'15062:LocalizedName,msdyn_ReceiptsLabel'
            refreshIconAction: |+
              =Set(
                  varSelectedTab,
                  1
              );

              Refresh('Expense Mobile Unattached Document Entity (mserp)');
              Concurrent(
                  Set(
                      varFileFormat,
                      Blank()
                  ),
                  Set(
                      varSelectedReceiptNumber,
                      Blank()
                  )
              )

            secondIcon: =If(CountRows(collSelectedReceiptIds)=0, DeleteIconDisabled,DeleteIconEnabled)
            secondIconAccessibleLabel: =If(Self.secondIcon = DeleteIconEnabled, "Delete receipts", "Disabled delete")
            secondIconAction: |-
              =UpdateContext({varCntDelete: false});
              If(
                  CountRows(collSelectedReceiptIds) > 0,
                  UpdateContext({varCntDelete: true}),
                  UpdateContext({varCntDelete: false})
              )
            thirdIcon: =If(varCntSelect,SelectorCloseIcon,SelectorIcon)
            thirdIconAccessibleLabel: =If(Self.thirdIcon = SelectorIcon, "Multiselect receipts", "Cancel")
            thirdIconAction: |-
              =If(
                  varCntSelect,
                  UpdateContext({varCntSelect: false});
                  Clear(collSelectedReceiptIds),
                  UpdateContext({varCntSelect: true})
              )
      - scr09_DeleteConfirmationDialog_1:
          Control: CanvasComponent
          ComponentName: cmp02_ConfirmationDialog
          Properties:
            Height: =App.Height
            LegalEntity: ="Text"
            OnLeftButtonClick: |-
              = UpdateContext({varCntDelete: false});
            OnRightButtonClick: |
              =
              Set(varDeletionStarted,true);
              RemoveIf('Expense Mobile Unattached Document Entity (mserp)',EntRecId in collSelectedReceiptIds); 
              If(
                  !IsEmpty(Errors('Expense Mobile Unattached Document Entity (mserp)')),
                  Notify(
                      Concat(Errors('Expense Mobile Unattached Document Entity (mserp)'), Column&": "&Message),
                      NotificationType.Error, 
                      gblParams.notificationTime
                      ),
                  Notify(
                      GlobalLabels.Labels.'15062:LocalizedName,msdyn_ReceiptsDeletedSuccessfullyLabel',
                      NotificationType.Success , 
                      gblParams.notificationTime
                  );
              );

              UpdateContext({varCntDelete: false});
              UpdateContext({varCntSelect: false});
              UpdateContext({varCntReceiptListView: true});
              UpdateContext({varCntReceiptGridView: false});
              Clear(collSelectedReceiptIds);

              Concurrent(
                  Set(
                      varFileFormat,
                      Blank()
                  ),
                  Set(
