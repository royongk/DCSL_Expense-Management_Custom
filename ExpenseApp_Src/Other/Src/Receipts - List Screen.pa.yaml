Screens:
  Receipts - List Screen:
    Properties:
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |
        =If(varCntSelect <> true,
        UpdateContext({varCntSelect: false})
        );
        UpdateContext({varAtctioButtonReceiptVisible: false});
        Set(
            varSelectedTab,
            1
        );
        UpdateContext({varCntReceiptListView: true});
        UpdateContext({varCntReceiptGridView: false});
        Set(varDeletionStarted, false);
        Concurrent(
            Set(
                varFileFormat,
                Blank()
            ),
            Set(
                varSelectedReceiptNumber,
                Blank()
            ),
            Set(
                varReceiptImage,
                Blank()
            )
        );
        Reset(scr09_glr_ReceiptList);
        Reset(scr09_glr_ReceiptGrid);
    Children:
      - emptyStateComponent_2:
          Control: CanvasComponent
          ComponentName: emptyStateComponent
          Properties:
            Height: |
              =350
            Visible: =!scr09_glr_ReceiptGrid.Visible && !scr09_glr_ReceiptList.Visible
            Width: =Self.Height
            X: |
              =(Parent.Width - Self.Width)/2
            Y: =scr09_glr_ReceiptGrid.Y + (Parent.Height - scr09_hdr_TopHeader.Height - scr09_cmp_Footer_1.Height - Self.Height)/2
            subTitle: =GlobalLabels.Labels.'15062:LocalizedName,msdyn_AddaReceiptToAttachToAnExpenseLabel'
            title: =GlobalLabels.Labels.'15062:LocalizedName,msdyn_NothingHereYetLabel'
      - scr09_cmp_Footer_1:
          Control: CanvasComponent
          ComponentName: cmp_Footer_3
          Properties:
            ApprovalsAccessibleLabel: ="Text"
            ApprovalsText: |-
              =If(
                  varAppMode = "AirfareAllowance",
                  "Travel",
                  GlobalLabels.Labels.'15062:LocalizedName,msdyn_ApprovalsLabel'
              )
            DisplayMode: =!IsBlank(varSelectedLegalEntity)
            ExpenseAccessibleLabel: ="Text"
            ExpensesText: =GlobalLabels.Labels.'15062:LocalizedName,msdyn_ExpensesLabel'
            Fill: =RGBA(248, 248, 248, 0.94)
            Height: =84
            OnApprovalsButtonClick: |-
              =If(
                  varAppMode = "AirfareAllowance",
                  Navigate('Travel - List Screen', ScreenTransition.Fade),
                  Set(varSelectedTab, 4); Navigate('Approvals - List Screen', ScreenTransition.Fade, {varFiltersApplied:false, varSelectedProjects:Blank(), varSelectedUsers: Blank(), varcntSelectedStatus:1});
                  Reset(scr25_cmb_Project);
                  Reset(scr25_cmb_User)
              )
            OnExpensesButtonClick: =Set(varSelectedTab, 2); Navigate('Expenses - List Screen',ScreenTransition.Fade)
            OnReceiptsButtonClick: =Set(varSelectedTab, 1); Navigate('Receipts - List Screen',ScreenTransition.Fade)
            OnReportsButtonClick: =Set(varSelectedTab, 3); Navigate('Reports - List Screen', ScreenTransition.Fade ,{varcntSelectedStatus:1})
            ReceiptAccessibleLabel: =
            ReceiptText: =GlobalLabels.Labels.'15062:LocalizedName,msdyn_ReceiptsLabel'
            ReportAccessibleLabel: ="Text"
            ReportText: =GlobalLabels.Labels.'15062:LocalizedName,msdyn_ExpenseReportsLabel'
            SelectedTab: =1
            Visible: =!varCntSelect
            Width: =Max(App.Width, App.MinScreenWidth)
            Y: =App.Height - Self.Height
            paramInDefaultAppMode: =varAppMode
            paramInDefaultSelectedTab: |
              =1
