Screens:
  Receipts - Receipt Preview Screen:
    Properties:
      Fill: =RGBA(229, 229, 229, 1)
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |-
        =UpdateContext({
            varReceiptSizeOk:true
            }
            )
    Children:
      - imageView_footer_rectangle_2:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =RGBA(37, 36, 35, 1)
            Height: =278
            Width: =Max(App.Width, App.MinScreenWidth)
            Y: =Parent.Height - Self.Height
      - scr12_btn_AttachToAnExpense:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(255, 255, 255, 1)
            BorderThickness: =3
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =RGBA(33, 33, 33, 1)
            Font: =Font.'Open Sans'
            Height: =88
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =Self.Color
            HoverFill: =Self.Fill
            OnSelect: "=\n\nUpdateContext({varText : JSON(scr12_img_PreviewReceipt.Image,JSONFormat.IncludeBinaryData)});\nIf(\n    !IsBlank(varText) || !IsMatch(varText, \"\"),\n    UpdateContext({varB64 : Mid(varText, Find(\",\", varText) + 1, Len(varText) - Find(\",\", varText) - 1)});\n    UpdateContext({varType : Mid(varText, Find(\":\", varText) + 1, (Find(\";\", varText) - 1) - (Find(\":\", varText) + 1) + 1)});\n    UpdateContext({varExtension : Mid(varType, Find(\"/\", varType) + 1)}); \n);\nIfError(\n    Set(\n        gblCreatedReceiptResponse,\n        'Expense mobile master data (mserp)'.mserp_trvexpmobilemasterdataentity_uploadlargeimage(\n            LookUp('Expense mobile master data (mserp)',Email = User().Email).'Expense mobile master data (mserp)', \n            {\n                imageBase64: varB64,\n                ContentType: varType,\n                FileExtension: varExtension,\n                FileName: If(IsMatch( varReceiptFileName, \"\\.\",MatchOptions.Contains),varReceiptFileName, Concatenate(varReceiptFileName,\".\",varExtension))\n            }\n        )\n    ),\n    UpdateContext({varCreateReceiptError : FirstError})\n);\nIf(\n    IsBlank(varCreateReceiptError),\n    Notify(\n        Concatenate(GlobalLabels.Labels.'15062:LocalizedName,msdyn_ReceiptCreatedSuccessfullyLabel'),\n        NotificationType.Success , \n        gblParams.notificationTime\n    );\n    Set(\n        varSelectedReceiptNumber,\n        Value(ParseJSON(gblCreatedReceiptResponse.return).DocuRefRecId)\n    ),\n    \n    Notify(\n        Substitute(\n            Match(varCreateReceiptError.Details.HttpResponse, \"\"\"message\"\":\"\"([^\"\"]*)\"\"\").FullMatch, \n            \"\"\"message\"\":\", \n            Blank()\n        ),\n        NotificationType.Error, \n        gblParams.notificationTime\n    )  \n);\nUpdateContext({varCreateReceiptError:Blank()});\nClear(colFileSplit);\nClear(colDeviceAttachedFile);\nNavigate('Receipts - Select Expense Screen')\n"
            PressedBorderColor: =Self.BorderColor
            PressedFill: =Self.Fill
            Size: =22
            Text: =GlobalLabels.Labels.'15062:LocalizedName,msdyn_AttachToAnExpenseLabel'
            Width: =Parent.Width -  Self.X*2
            X: =40
            Y: =scr012_btn_Done.Y + scr012_btn_Done.Height + 30
      - scr012_btn_Done:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =RGBA(34, 102, 227, 1)
            Font: =Font.'Open Sans'
            Height: =87
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            OnSelect: "=/*\nif varSelectedReceiptNumber is not blank do not save the receipt just navigate back to receipt list screen\n*/\n\nIf(\n    IsBlank(varSelectedReceiptNumber),\n    UpdateContext({varText : JSON(scr12_img_PreviewReceipt.Image,JSONFormat.IncludeBinaryData)});\n    If(\n        !IsBlank(varText) || !IsMatch(varText, \"\"),\n        UpdateContext({varB64 : Mid(varText, Find(\",\", varText) + 1, Len(varText) - Find(\",\", varText) - 1)});\n        UpdateContext({varType : Mid(varText, Find(\":\", varText) + 1, (Find(\";\", varText) - 1) - (Find(\":\", varText) + 1) + 1)});\n        UpdateContext({varExtension : Mid(varType, Find(\"/\", varType) + 1)});\n        \n    );\n    IfError(\n    'Expense mobile master data (mserp)'.mserp_trvexpmobilemasterdataentity_uploadlargeimage(\n    LookUp('Expense mobile master data (mserp)',Email = User().Email).'Expense mobile master data (mserp)', \n    {\n        imageBase64: varB64,\n        ContentType: varType,\n        FileExtension: varExtension,\n        FileName: If(IsMatch( varReceiptFileName, \"\\.\",MatchOptions.Contains),varReceiptFileName, Concatenate(varReceiptFileName,\".\",varExtension))\n    }\n),\n        UpdateContext(\n            {\n                varOnSaveReceiptError : FirstError\n            }\n        );\n    );\n    If(\n        IsBlank(varOnSaveReceiptError),\n        Notify(\n            GlobalLabels.Labels.'15062:LocalizedName,msdyn_ReceiptCreatedSuccessfullyLabel',\n            NotificationType.Success,\n            gblParams.notificationTime\n        ),\n        Notify(\n            Substitute(\n                Match(varOnSaveReceiptError.Details.HttpResponse, \"\"\"message\"\":\"\"([^\"\"]*)\"\"\").FullMatch, \n                \"\"\"message\"\":\", \n                Blank()\n            ),\n            NotificationType.Error, \n            gblParams.notificationTime\n        )   \n    );\n);\nUpdateContext({varOnSaveReceiptError:Blank()});\nClear(colFileSplit);\nClear(colDeviceAttachedFile);\nNavigate('Receipts - List Screen', Transition.Push);\nRefresh('Expense Mobile Unattached Document Entity (mserp)');\n\n"
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Text: =GlobalLabels.Labels.'15062:LocalizedName,msdyn_SaveReceiptLabel'
            Width: =Parent.Width -  Self.X*2
            X: =40
            Y: =imageView_footer_rectangle_2.Y + 35
      - scr12_lbl_NoPreview:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Font: =Font.'Segoe UI'
            Height: =64
            Size: =18
            Text: |-
              =GlobalLabels.Labels.'15062:LocalizedName,msdyn_FilePreviewNotSupportedLabel'
              //GlobalLabels.Labels.PreviewNotSupported
            Visible: =!(scr12_pdfViewer.Visible || scr12_img_PreviewReceipt.Visible)
            Width: '=406     '
            X: |+
              =(Parent.Width - Self.Width)/2
            Y: '=scr12_img_NoPreview.Y + scr12_img_NoPreview.Height + 10 '
      - scr12_img_NoPreview:
          Control: Image@2.2.3
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Height: =85
            Image: |-
              =If(
                  varFileFormat in ["xlsx", "xls"],
                  IconExcel,
                  varFileFormat in ["docx", "doc"],
                  IconWord,
                  varFileFormat = "txt",
                  IconTxt,
                  IconMail
              )
            Visible: =scr12_lbl_NoPreview.Visible
            Width: =85
            X: |+
              =(Parent.Width - Self.Width)/2
            Y: =scr12_img_PreviewReceipt.Y + (scr12_img_PreviewReceipt.Height - Self.Height)/2
      - scr12_img_PreviewReceipt:
          Control: Image@2.2.3
          Properties:
            ApplyEXIFOrientation: =false
            BorderColor: =RGBA(0, 18, 107, 1)
            Height: =imageView_footer_rectangle_2.Y - Self.Y
            Image: =varReceiptImage
            Visible: =varFileFormat in ["jpeg","png","jpg","bmp","tiff"] && !IsBlank(varReceiptImage)
            Width: =Parent.Width
            Y: =82
      - scr12_pdfViewer:
          Control: PDFViewer@2.5.0
          Properties:
            Document: =varReceiptImage
            Height: =scr12_img_PreviewReceipt.Height
            Visible: =varFileFormat = "pdf"  && !IsBlank(varReceiptImage)
            Width: '=scr12_img_PreviewReceipt.Width      '
            X: =scr12_img_PreviewReceipt.X
            Y: =scr12_img_PreviewReceipt.Y
      - scr05_hdr_TopHeader_1:
          Control: CanvasComponent
          ComponentName: hdr02_Header
          Properties:
            Fill: =scr05_hdr_TopHeader_1.paramFill
            Height: =82
            Width: =Max(App.Width, App.MinScreenWidth)
            paramColor: =RGBA(255, 255, 255, 1)
            paramFill: |
              =RGBA(33, 33, 33, 1)
            paramTitle: |
              =GlobalLabels.Labels.'15062:LocalizedName,msdyn_CaptureReceiptLabel'
      - scr12_lbl_Retake:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Semibold
            Height: =33
            OnSelect: |-
              =Set(
                  varReceiptImage, 
                  Blank()
              );
              Set(
                  varFileFormat, 
                  Blank()
              );
              Clear(colFileSplit);
              Clear(colDeviceAttachedFile);
              Back()
            Size: =17
            TabIndex: =0
            Text: =GlobalLabels.Labels.'15062:LocalizedName,msdyn_RetakeLabel'
            Width: =110
            X: =(Parent.Width - Self.Width)
            Y: =24
      - scr12_ico_Back_2:
          Control: Classic/Icon@2.5.0
          Properties:
            AccessibleLabel: ="Press to go back"
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =Color.White
            Fill: =icongconfig_backbutton.Fill
            Height: =icongconfig_backbutton.Height
            Icon: =Icon.ChevronLeft
            OnSelect: |-
              =Set(
                  varReceiptImage, 
                  Blank()
              );
              Set(
                  varFileFormat, 
                  Blank()
              );
              Clear(colFileSplit);
              Clear(colDeviceAttachedFile);
              Navigate('Receipts - Capture Receipt Screen');
            TabIndex: =0
            Width: =icongconfig_backbutton.Width
            X: =22.5
            Y: =(scr02_hdr_TopHeader.Height-Self.Height)/2
