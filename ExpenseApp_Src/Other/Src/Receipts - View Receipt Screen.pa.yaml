Screens:
  Receipts - View Receipt Screen:
    Properties:
      Fill: =RGBA(229, 229, 229, 1)
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |-
        =//UpdateContext({varCntShowConfirmationDialog:false})
        Set(varCntShowConfirmationDialog,false)
    Children:
      - imageView_footer_rectangle_3:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =RGBA(37, 36, 35, 1)
            Height: =278
            Width: =Max(App.Width, App.MinScreenWidth)
            Y: =Parent.Height - Self.Height
      - scr14_btn_Done:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(255, 255, 255, 1)
            BorderThickness: =3
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =RGBA(33, 33, 33, 1)
            Font: =Font.'Open Sans'
            Height: =88
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =Self.Color
            HoverFill: =Self.Fill
            OnSelect: =Navigate('Receipts - List Screen',ScreenTransition.Fade,{varCntSelect:varCntSelect})
            PressedBorderColor: =Self.BorderColor
            PressedFill: =Self.Fill
            Size: =22
            Text: =GlobalLabels.Labels.'15062:LocalizedName,msdyn_DoneButtonLabel'
            Width: =Parent.Width - Self.X*2
            X: =30
            Y: =scr14_btn_AttachToExpense.Y + scr14_btn_AttachToExpense.Height + 30
      - scr14_btn_AttachToExpense:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =RGBA(34, 102, 227, 1)
            Font: =Font.'Open Sans'
            Height: =87
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            OnSelect: |-
              =If(
                  !IsBlank(varReceiptImage),
                  Navigate(
                      'Receipts - Select Expense Screen',
                      ScreenTransition.None
                  ),
                  Notify(
                      GlobalLabels.Labels.'15062:LocalizedName,msdyn_InvalidReceiptLabel',
                      NotificationType.Error,
                      gblParams.notificationTime
                  )
              )
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Text: =GlobalLabels.Labels.'15062:LocalizedName,msdyn_AttachToAnExpenseLabel'
            Width: =Parent.Width - Self.X*2
            X: =30
            Y: =imageView_footer_rectangle_3.Y + 25
      - scr14_lbl_NoPreview:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Font: =Font.'Segoe UI'
            Height: =64
            Size: =18
            Text: =GlobalLabels.Labels.'15062:LocalizedName,msdyn_FilePreviewNotSupportedLabel'
            Visible: =!(scr14_pdfViewer.Visible || scr14_img_Receipt.Visible)
            Width: '=406     '
            X: =(Parent.Width - Self.Width)/2
            Y: =scr14_img_NoPreview.Y + scr14_img_NoPreview.Height + 10
      - scr14_img_NoPreview:
          Control: Image@2.2.3
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Height: =85
            Image: |-
              =If(
                  varFileFormat in ["xlsx", "xls"],
                  IconExcel,
                  varFileFormat in ["docx", "doc"],
                  IconWord,
                  varFileFormat = "txt",
                  IconTxt,
                  IconMail
              )
            Visible: =scr14_lbl_NoPreview.Visible
            Width: =85
            X: =(Parent.Width - Self.Width)/2
            Y: =scr14_img_Receipt.Y + (scr14_img_Receipt.Height - Self.Height)/2
      - scr14_img_Receipt:
          Control: Image@2.2.3
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Height: =imageView_footer_rectangle_3.Y - Self.Y
            Image: =varReceiptImage
            Visible: =varFileFormat in ["jpeg","png","jpg","bmp","tiff"] && !IsBlank(varReceiptImage)
            Width: =Parent.Width
            Y: =scr14_hdr_TopHeader.Height
      - scr14_pdfViewer:
          Control: PDFViewer@2.5.0
          Properties:
            Document: =varReceiptImage
            Height: =scr14_img_Receipt.Height
            Visible: =varFileFormat = "pdf" && !IsBlank(varReceiptImage)
            Width: =Parent.Width
            X: =scr14_img_Receipt.X
            Y: =scr14_img_Receipt.Y
      - scr14_hdr_TopHeader:
          Control: CanvasComponent
          ComponentName: hdr02_Header
          Properties:
            Fill: =scr14_hdr_TopHeader.paramFill
            Height: =82
            Width: =Max(App.Width, App.MinScreenWidth)
            paramColor: =RGBA(255, 255, 255, 1)
            paramFill: |
              =RGBA(33, 33, 33, 1)
            paramTitle: =GlobalLabels.Labels.'15062:LocalizedName,msdyn_ViewReceiptLabel'
      - scr14_lbl_Discard:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.'Segoe UI'
            Height: =82
            OnSelect: |-
              =//UpdateContext({varCntShowConfirmationDialog:true})
              Set(varCntShowConfirmationDialog,true)
            TabIndex: =0
            Text: =GlobalLabels.Labels.'15062:LocalizedName,msdyn_DiscardLabel'
            Width: =193
            X: =Parent.Width - Self.Width
      - scr14_ico_Back:
          Control: Classic/Icon@2.5.0
          Properties:
            AccessibleLabel: ="Press to go back"
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =Color.White
            Fill: =icongconfig_backbutton.Fill
            Height: =icongconfig_backbutton.Height
            Icon: =Icon.ChevronLeft
            OnSelect: =Navigate('Receipts - List Screen',ScreenTransition.Fade,{varCntSelect:varCntSelect})
            TabIndex: =0
            Width: =icongconfig_backbutton.Width
            X: =8.5*Value(lbconfig_resolution_factor.Text)
            Y: =(scr02_hdr_TopHeader.Height-Self.Height)/2
      - cmp02_ConfirmationDialog_2:
          Control: CanvasComponent
          ComponentName: cmp02_ConfirmationDialog
          Properties:
            Height: =App.Height
            LegalEntity: ="Text"
            OnLeftButtonClick: |-
              =//UpdateContext({varCntShowConfirmationDialog:false});
              Set(varCntShowConfirmationDialog,false)
            OnRightButtonClick: |-
              =Set(varCntShowConfirmationDialog,false);


              IfError(
                  Remove(
                      'Expense Mobile Unattached Document Entity (mserp)',
                      LookUp(
                          'Expense Mobile Unattached Document Entity (mserp)',
                          EntRecId = Value(varSelectedReceiptNumber)
                                      )
                  ),
                  Collect(
                      deleteReceiptError,
                      {
                          message : Last(Split(FirstError.Message, ":")).Value
                      }
                  )   
              );       

              If(
                  CountRows(deleteReceiptError) = 0,
                  Notify(
                      GlobalLabels.Labels.'15062:LocalizedName,msdyn_ReceiptDiscardedSuccessfullyLabel',
                      NotificationType.Success, 
                      gblParams.notificationTime
                  ),
                  ForAll(
                      Distinct(deleteReceiptError,message),
                      Notify(
                          ThisRecord.Value,
                          NotificationType.Error , 
                          gblParams.notificationTime
                      )
                  )
              );

              Concurrent(
                  Set(
                      varSelectedReceiptNumber, 
                      Blank()
                      ),
                  Set(varFileFormat, Blank())
              );
              Navigate('Receipts - List Screen')
            SelectedExpense: =
            SelectedList: ="Text"
            SelectedReceiptNumber: =
            Visible: =varCntShowConfirmationDialog
            Width: =Max(App.Width, App.MinScreenWidth)
            controlName: ="cmp02_ConfirmationDialog_2"
            parmInDescriptionText: ="Are you sure you want to parmanently delete this receipt?"
            parmInHeaderText: =GlobalLabels.Labels.'15062:LocalizedName,msdyn_DeleteSelectedReceiptsHeaderLabel'
            parmInLeftButtonColor: =RGBA(34, 102, 227, 1)
            parmInLeftButtonText: =GlobalLabels.Labels.'15062:LocalizedName,msdyn_CancelLabel'
            parmInRightButtonColor: =RGBA(195, 39, 39, 1)
            parmInRightButtonText: =GlobalLabels.Labels.'15062:LocalizedName,msdyn_DeleteLabel'
            returnFocus: ="scr14_lbl_Discard"
