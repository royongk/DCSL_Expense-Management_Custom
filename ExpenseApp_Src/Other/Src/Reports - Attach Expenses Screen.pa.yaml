            LegalEntity: ="Text"
            OnLeftButtonClick: =true
            OnRightButtonClick: ="텍스트"
            SelectedExpense: =
            SelectedList: ="Text"
            SelectedReceiptNumber: =
            Visible: |
              =varCntBack
            Width: =Max(App.Width, App.MinScreenWidth)
            controlName: ="scr18_cmp02_CancelDialog"
            parmInDescriptionText: ="All unsaved changes will be lost."
            parmInHeaderText: ="Do you want to go back?"
            parmInLeftButtonColor: =RGBA(34, 102, 227, 1)
            parmInLeftButtonText: ="No"
            parmInRightButtonColor: =RGBA(195, 39, 39, 1)
            parmInRightButtonText: ="Yes"
            returnFocus: ="scr18_ico_Back"
