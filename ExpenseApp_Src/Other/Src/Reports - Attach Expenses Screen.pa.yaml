Screens:
  Reports - Attach Expenses Screen:
    Properties:
      Fill: =RGBA(229, 229, 229, 1)
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: "=Clear(colExpensesToBeAttached);\n\n// 변수 초기화\nUpdateContext({varCntBack:false});\n\n// ctxTargetPurpose 값의 존재 여부 및 varAppMode에 따라 쿼리 분기 처리 (위임 문제 해결)\nIf(\n    IsBlank(ctxTargetPurpose),\n    \n    // 1. ctxTargetPurpose가 비어있을 때 (전체 표시)\n    ClearCollect(\n        dsExpenses,\n        SortByColumns(\n            Filter(\n                'DCSL Expense Line Expense Moblie Entity (mserp)',\n                'Company Code' = varSelectedLegalEntity && \n                'Approval status' = 'Document status (mserp)'.Draft && \n                IsBlank('Expense report number (mserp_expnumber)') && \n                // [핵심 추가] 전달받은 사용자 ID로 필터링\n                'Employee (mserp_creatingworker)' = ctxSelectedWorkerID &&\n                ('Expense line type' = 'Expense line type (mserp)'.Default || 'Expense line type' = 'Expense line type (mserp)'.'Itemized header')\n            ),\n            \"mserp_transdate\", \n            SortOrder.Descending\n        )\n    ),\n\n    // 2. ctxTargetPurpose가 값이 있을 때\n    If(\n        varAppMode = \"AirfareAllowance\",\n        \n        // 2-A. varAppMode가 \"AirfareAllowance\"인 경우\n        ClearCollect(\n            dsExpenses,\n            SortByColumns(\n                Filter(\n                    'DCSL Expense Line Expense Moblie Entity (mserp)',\n                    'Company Code' = varSelectedLegalEntity && \n                    'Approval status' = 'Document status (mserp)'.Draft && \n                    IsBlank('Expense report number (mserp_expnumber)') && \n                    'Employee (mserp_creatingworker)' = ctxSelectedWorkerID &&\n                    ('Expense line type' = 'Expense line type (mserp)'.Default || 'Expense line type' = 'Expense line type (mserp)'.'Itemized header') &&\n                    'Expense category (mserp_costtype)' = ctxTargetPurpose // *주의: 선택(Choice) 열이라면 'Item or Service'.Value = ctxTargetPurpose 로 수정 필요\n                ),\n                \"mserp_transdate\", \n                SortOrder.Descending\n            )\n        ),\n        \n        // 2-B. varAppMode가 \"AirfareAllowance\"가 아닌 경우\n        ClearCollect(\n            dsExpenses,\n            SortByColumns(\n                Filter(\n                    'DCSL Expense Line Expense Moblie Entity (mserp)',\n                    'Company Code' = varSelectedLegalEntity && \n                    'Approval status' = 'Document status (mserp)'.Draft && \n                    IsBlank('Expense report number (mserp_expnumber)') && \n                    'Employee (mserp_creatingworker)' = ctxSelectedWorkerID &&\n                    ('Expense line type' = 'Expense line type (mserp)'.Default || 'Expense line type' = 'Expense line type (mserp)'.'Itemized header') &&\n                    'Expense Type' = ctxTargetPurpose // *주의: 선택(Choice) 열이라면 'Expense Type'.Value 로 수정 필요\n                ),\n                \"mserp_transdate\", \n                SortOrder.Descending\n            )\n        )\n    )\n);\n\n// 나머지 컬렉션 초기화 로직 유지\nClearCollect(colExpensesToBeAttached, colAttachedExpenses);\nClearCollect(colAttachedExpensesForReport, colAttachedExpenses);"
    Children:
      - scr18_btn_Done:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =RGBA(34, 102, 227, 1)
            Font: =Font.'Open Sans'
            Height: =88
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            OnSelect: "=// 1. 사용자가 눈으로 보고 체크한 항목을 첨부 컬렉션에 임시 확정\nClearCollect(colAttachedExpenses, colExpensesToBeAttached);\n\n// 2. ✨ [핵심 방어막] 보고서 번호를 고정 변수에 저장 (LookUp 실패 시 Blank가 되는 현상 방지)\nUpdateContext({locCurrentReportNum: varSelectedReport.'Expense report number'});\n\nIf(\n    IsBlank(locCurrentReportNum),\n    Notify(\"Error: Expense Report Number is missing.\", NotificationType.Error, gblParams.notificationTime),\n    \n    // 3. F&O 백엔드로 쉼표로 연결된 문자열(DEEXExpTransNumber) 전송\n    Clear(varError);\n    IfError(\n        Patch(\n            'DCSL Expense Moblie Report (mserp)',\n            LookUp('DCSL Expense Moblie Report (mserp)','Expense report number' = locCurrentReportNum),\n            {\n                ExpTransNumber: Concat(colAttachedExpenses, 'Expense transaction number (mserp_exptransnumber)', \",\"),\n                Purpose: Coalesce(ctxTargetPurpose, varSelectedReport.Purpose),\n                Location: varSelectedReport.Location\n            }\n        ),\n        First(ClearCollect(varError, Substitute(Match(FirstError.Details.HttpResponse, \"\"\"message\"\":\"\"([^\"\"]*)\"\"\").FullMatch, \"\"\"message\"\":\", \"\")))\n    );\n\n    // 4. 에러 확인 후 데이터 동기화 및 네비게이션 실행\n    If(\n        !(IsBlank(First(varError).Value) || First(varError).Value = \"\"),\n        // 에러 발생 시 알림 표시\n        Notify(Substitute(First(varError).Value, \"\"\"\", \"\"), NotificationType.Error, gblParams.notificationTime),\n        \n        // --- 에러 없이 정상 처리되었을 때의 후속 작업 ---\n        \n        // (A) 백엔드 데이터 갱신\n        Refresh('DCSL Expense Line Expense Moblie Entity (mserp)');\n        Set(varSelectedReport, LookUp('DCSL Expense Moblie Report (mserp)', 'Expense report number' = locCurrentReportNum));\n        \n        // (B) ✨ [199개 버그 차단] Blank가 아닐 때만 서버에서 필터링해서 가져오기\n        If(\n            !IsBlank(locCurrentReportNum),\n            ClearCollect(\n                colAttachedExpensesForReport,\n                Filter(\n                    'DCSL Expense Line Expense Moblie Entity (mserp)',\n                    'Expense report number (mserp_expnumber)' = locCurrentReportNum \n                    && 'Expense line type' <> 'Expense line type (mserp)'.'Itemized line'\n                )\n            );\n            \n            // \U0001F4A1 F&O 백엔드의 비동기 처리 지연으로 인해 서버에서 아직 0건이 오더라도,\n            // 로컬에서 이미 선택해둔 데이터(colAttachedExpenses)를 유지하여 UI가 깜빡이는 것을 방지합니다.\n            If(\n                CountRows(colAttachedExpensesForReport) > 0,\n                ClearCollect(colAttachedExpenses, colAttachedExpensesForReport)\n            )\n        );\n        \n        Clear(varError);\n        \n        // (C) ✨ [가장 중요한 순서 변경] 모든 데이터 처리가 끝난 뒤에 화면을 이동합니다.\n        If(\n            varCntBack_scr17,\n            Navigate('Reports - Edit Screen', ScreenTransition.None),\n            Navigate('Reports - View Attached Expenses Screen', ScreenTransition.None)\n        )\n    )\n);"
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Text: =GlobalLabels.Labels.'15062:LocalizedName,msdyn_DoneButtonLabel'
            Width: =Parent.Width -  Self.X*2
            X: =40
            Y: =Parent.Height - Self.Height- 25
      - scr18_glr_SelectExpenses_1:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =Color.White
            Height: =scr18_btn_Done.Y - Self.Y - 25
            Items: =dsExpenses
            OnSelect: |
              =
              //set details for the next screen 
              Concurrent(
                  Set(
                      varIsCreate,
                      false
                  ),
                  Set(
                      varReceiptImage,
                      Blank()
                  )
              );
              //assign the expense to a varSelectedExpenseDoc
              Set(
                  varSelectedExpenseDoc,
                  LookUp('DCSL Expense Line Expense Moblie Entity (mserp)','Expense transaction number (mserp_exptransnumber)' = ThisItem.'Expense transaction number (mserp_exptransnumber)')
              );

              //collect policy violations
              If(
                  varSelectedExpenseDoc.PolicyViolationCount,
                  ClearCollect(
                      colPolViolations,
                      Split(varSelectedExpenseDoc.PolicyViolationErrorMessage, "~|~")
                  );
                  UpdateContext({varMaxViolationLevel : varSelectedExpenseDoc.PolicyViolationsLevel});
                  UpdateContext({varNumViolation : varSelectedExpenseDoc.PolicyViolationCount}),
                  Clear(colPolViolations);
                  UpdateContext({varMaxViolationLevel : 0});
                  UpdateContext({varNumViolation : 0})
              );
              //set receipt image if attachedDocuRefRecId is not 0
              If(
                  varSelectedExpenseDoc.AttachedReceiptId <> "0",
                  Set(
                      varReceiptImage,
                      LookUp('Expense Mobile Attached Document Entity (mserp)', EntRecId = Value(varSelectedExpenseDoc.AttachedReceiptId),CapturedDocument)
                  );
                  Set(
                      varFileFormat,
                      LookUp('Expense Mobile Attached Document Entity (mserp)', EntRecId = Value(varSelectedExpenseDoc.AttachedReceiptId), FileExtension)
                  );
                  Set(
                      varSelectedReceiptNumber,
                      Blank()
                  )
              );

              Navigate('Expenses - Edit Screen', ScreenTransition.None, {varNavigatedFrom : "scr18", varMaxViolationLevel : varMaxViolationLevel, varNumViolation: varNumViolation})
            TemplateSize: =150
            Width: =Parent.Width
            Y: =scr18_shp_Rectangle.Y + scr18_shp_Rectangle.Height
          Children:
            - Container11_4:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Height: =150
                  LayoutDirection: =LayoutDirection.Vertical
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width
                Children:
                  - Container6_5:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Height: =Parent.Height - scr18_shp_GalleryBaseSeparator_4.Height
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =Parent.Width
                      Children:
                        - shpBorder_13:
                            Control: Rectangle@2.3.0
                            Properties:
                              BorderColor: =RGBA(0, 18, 107, 1)
                              Fill: =Color.Transparent
                              Height: =Parent.Height
                              LayoutMaxHeight: =
                              LayoutMaxWidth: =
                              Width: =10
                        - scr18_chk_Select_2:
                            Control: Classic/CheckBox@2.1.0
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              BorderColor: =RGBA(0, 18, 107, 1)
                              BorderStyle: =BorderStyle.None
                              CheckboxBackgroundFill: =If(Self.Value, RGBA(34, 102, 227, 1),Color.White)
                              CheckboxBorderColor: =RGBA(34, 102, 227, 1)
                              CheckboxSize: =42
                              CheckmarkFill: =Color.White
                              Color: =RGBA(34, 102, 227, 1)
                              Default: =!IsBlank(LookUp(colExpensesToBeAttached, 'Expense transaction number (mserp_exptransnumber)' = ThisItem.'Expense transaction number (mserp_exptransnumber)'))
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Lighter
                              Height: =42
                              HoverColor: =RGBA(0, 18, 107, 1)
                              LayoutMaxHeight: =
                              LayoutMaxWidth: =
                              OnCheck: |-
                                =Collect(
                                    colExpensesToBeAttached,
                                    ThisItem
                                )
                              OnSelect: =
                              OnUncheck: =RemoveIf(colExpensesToBeAttached,'Expense transaction number (mserp_exptransnumber)'=ThisItem.'Expense transaction number (mserp_exptransnumber)')
                              Reset: =scr18_chk_SelectAll.Value
                              Text: |-
                                =If(
                                    ThisItem.Merchant <> "" || !IsBlank(ThisItem.Merchant),
                                    Concatenate("Expense against merchant ", ThisItem.Merchant, If(Self.Value, " selected", " unselected")),
                                    Concatenate("Expense bearing amount ", Concatenate(Text(Value(ThisItem.'Transaction amount'), "#,#0.00", varDefaultLanguage), " ", ThisItem.'Currency (mserp_exchangecode)'), If(Self.Value, " selected", " unselected"))
                                )
                              VerticalAlign: =VerticalAlign.Bottom
                              Width: =43
                              X: =22
                              Y: =33.5
                        - Container7_5:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutJustifyContent: =LayoutJustifyContent.Center
                              LayoutMaxHeight: =
                              LayoutMaxWidth: =
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                            Children:
                              - Label5_8:
                                  Control: Label@2.5.1
                                  Properties:
                                    AutoHeight: =true
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    Font: =Font.'Segoe UI'
                                    LayoutMaxHeight: =
                                    LayoutMaxWidth: =
                                    OnSelect: =Select(scr18_shp_SelectRegion)
                                    PaddingLeft: =15
                                    PaddingRight: =0
                                    TabIndex: =If(IsBlank(Self.Text), -1, 0)
                                    Text: =Coalesce(ThisItem.'Item or Service', "")
                                    Width: =Parent.Width
                              - Label6_8:
                                  Control: Label@2.5.1
                                  Properties:
                                    AutoHeight: =true
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    Color: |-
                                      =If(
                                          Value(ThisItem.PolicyViolationCount) > 0,
                                          If(
                                              Value(ThisItem.PolicyViolationsLevel) <= 2,
                                              RGBA(152, 111, 11, 1),
                                              RGBA(217, 44, 44, 1)
                                          ),
                                          RGBA(0, 0, 0, 1)
                                      )
                                    Font: =Font.'Segoe UI'
                                    LayoutMaxHeight: =
                                    LayoutMaxWidth: =
                                    OnSelect: =Select(scr18_shp_SelectRegion)
                                    PaddingLeft: =15
                                    PaddingRight: =0
                                    TabIndex: =If(IsBlank(Self.Text), -1, 0)
                                    Text: =ThisItem.'Additional information'
                                    Width: =Parent.Width
                        - Container9_5:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutJustifyContent: =LayoutJustifyContent.Center
                              LayoutMaxHeight: =
                              LayoutMaxWidth: =
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Width: =200
                            Children:
                              - Label5_9:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =Align.Center
                                    AutoHeight: =true
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Bold
                                    LayoutMaxHeight: =
                                    LayoutMaxWidth: =
                                    OnSelect: =Select(scr18_shp_SelectRegion_RightIcon)
                                    TabIndex: =If(IsBlank(Self.Text), -1, 0)
                                    Text: |+
                                      =Concatenate(Text(Value(ThisItem.'Transaction amount'), "#,#0.00", varDefaultLanguage), " ", ThisItem.'Currency (mserp_exchangecode)')

                                    Width: =Parent.Width
                              - Label6_9:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =Align.Center
                                    AutoHeight: =true
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    Font: =Font.'Segoe UI'
                                    LayoutMaxHeight: =
                                    LayoutMaxWidth: =
                                    OnSelect: =Select(scr18_shp_SelectRegion_RightIcon)
                                    TabIndex: =If(IsBlank(Self.Text), -1, 0)
                                    Text: |-
                                      =Text(
                                          DateTimeValue(ThisItem.'Transaction date'),
                                          "mmm dd, yyyy"
                                      )
                                    Width: =Parent.Width
                        - Icon3_2:
                            Control: Classic/Icon@2.5.0
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              BorderColor: =RGBA(0, 18, 107, 1)
                              Color: =RGBA(110, 110, 110, 1)
                              Icon: =Icon.ChevronRight
                              LayoutMaxHeight: =
                              LayoutMaxWidth: =
                              OnSelect: =Select(scr18_shp_SelectRegion_RightIcon)
                              PaddingBottom: =15
                              PaddingTop: =15
                  - scr18_shp_GalleryBaseSeparator_4:
                      Control: Rectangle@2.3.0
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Fill: =RGBA(225, 225, 225, 1)
                        Height: =1
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        LayoutMinHeight: =1
                        Width: =Parent.Width - 10
            - scr18_shp_SelectRegion_RightIcon:
                Control: Rectangle@2.3.0
                Properties:
                  AccessibleLabel: ="Select expense"
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Fill: =RGBA(0, 0, 0, 0)
                  FocusedBorderThickness: =0
                  Height: =Parent.TemplateHeight
                  OnSelect: =Select(Parent);
                  TabIndex: =0
                  Width: =Parent.Width - Self.X
                  X: =scr18_shp_SelectRegion.Width
            - scr18_shp_SelectRegion:
                Control: Rectangle@2.3.0
                Properties:
                  AccessibleLabel: ="Select expense"
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Fill: =RGBA(0, 0, 0, 0)
                  FocusedBorderThickness: =0
                  Height: =Parent.TemplateHeight
                  OnSelect: |-
                    =If(
                        IsBlank(
                            LookUp(
                                colExpensesToBeAttached,
                                'Expense transaction number (mserp_exptransnumber)' = ThisItem.'Expense transaction number (mserp_exptransnumber)'
                            )
                        ),
                        Collect(
                            colExpensesToBeAttached,
                            ThisItem
                        ),
                        RemoveIf(
                            colExpensesToBeAttached,
                            'Expense transaction number (mserp_exptransnumber)' = ThisItem.'Expense transaction number (mserp_exptransnumber)'
                        )
                    )
                  TabIndex: =0
