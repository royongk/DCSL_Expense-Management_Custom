Screens:
  Reports - Edit Screen:
    Properties:
      Fill: =RGBA(229, 229, 229, 1)
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |-
        =UpdateContext({ctLabel1 : false});
                UpdateContext({ctLabel2 : false});
                UpdateContext({ctLabel3 : false});
                UpdateContext({ctLabel4 : false});
                UpdateContext({ctLabel5 : false});
                UpdateContext({ctVarReportDetailsBack:false});
                UpdateContext({isExpReportDirty : false});
                If(
                    IsBlank(
                        LookUp(
                            colReportPostDetails,
                            fieldName = "Description"
                        )
                    ),
                    Reset(scr17_txt_Description_1)
                );
                If(
                    varIsCreateReport,
                    Reset(ComboBox_Location);
                    Reset(ComboBox_Purpose);
                    Reset(scr17_txt_Description_1);
                    Reset(ComboBox_LegalEntity_ExpReport);
                    //If( 
                    //    gblIsProjectValidationFlag,
                    //    Reset(ComboBox_ProjectId_ExpReport_odata),
                    //    Reset(ComboBox_ProjectId_ExpReport_entity)
                    //);
                );
                UpdateContext(
                    {
                        locReimaginedfeatureEnabled: (userRecord.IsReimaginedUIEnabled = 'NoYes (mserp)'.Yes)
                    }
                );
                If(
                    locReimaginedfeatureEnabled, 
                    If(
                        CountRows(gblExpenseReportFieldVisibilityReImaginedLookup) <= 0,
                        ClearCollect(
                            gblExpenseReportFieldVisibilityReImaginedLookup, 
                            Filter(
                                'Expense mobile report field visibility (mserp)', 
                                LegalEntityId = varSelectedLegalEntity && 
                                VisibilityType <> 'ExpenseFieldVisibilityType (mserp)'.'Do not display'
                            )
                        )
                    ),
                    If(
                        CountRows(gblExpenseReportFieldVisibilityLookup) <= 0,
                        ClearCollect(
                            gblExpenseReportFieldVisibilityLookup, 
                            Filter(
                                '@ExpenseManagement:TrvExpMobileReportAdminCustomFieldsEntity (mserp)',
                                LegalEntityId = varSelectedLegalEntity && 
                                Visibility <> 'Visibility (mserp)'.'Do not display'
                            )
                        )
                    )
                );
    Children:
      - Totals Buttons - Draft:
          Control: GroupContainer@1.4.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(250, 249, 248, 1)
            Height: =300
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =20
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
            Y: =Parent.Height - Self.Height
          Children:
            - Totals - Draft:
                Control: GroupContainer@1.4.0
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =60
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  PaddingLeft: =15
                  PaddingRight: =15
                  PaddingTop: =10
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width
                Children:
                  - shpBorder_15:
                      Control: Rectangle@2.3.0
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Fill: =Color.Transparent
                        Height: =Parent.Height
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        Width: =10
                  - scr17_img_Totals_1:
                      Control: Image@2.2.3
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Height: =21
                        Image: =ShapeTotal
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        Width: =28
                        X: =39
                        Y: =
                  - scr17_lbl_Totals_1:
                      Control: Label@2.5.1
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =35
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        Size: =19.15
                        Text: =GlobalLabels.Labels.'15062:LocalizedName,msdyn_TotalLabel'
                        Width: =120
                        X: =scr17_img_Totals_1.X + scr17_img_Totals_1.Width + 9
                        Y: =
                  - scr17_lbl_TotalAmount_1:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Right
                        BorderColor: =RGBA(0, 0, 0, 1)
                        FillPortions: =1
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =40
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        LayoutMinWidth: =300
                        OnSelect: =
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Text: |-
                          =Concatenate(
                              If(
                                  !IsBlank(varSelectedReport),
                                  Text(
                                      Value(varSelectedReport.AmountTotal),
                                      "#,#0.00",
                                      varDefaultLanguage
                                  ),
                                  Text(
                                      Value("0"),
                                      "#,#0.00",
                                      varDefaultLanguage
                                  )
                              ),
                              " ",
                              LookUp(
                                  'Currencies (mserp)',
                                  'Currency code' = varDefaultCurrency,
                                  'Currency code'
                              )
                          )
                        VerticalAlign: =VerticalAlign.Top
                        Width: =250
                        X: =scr17_btn_SaveDraft_1.X + scr17_btn_SaveDraft_1.Width - Self.Width
                        Y: =871
            - Buttons - Draft:
                Control: GroupContainer@1.4.0
                Variant: ManualLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  DropShadow: =DropShadow.None
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width
                Children:
                  - scr17_btn_Submit_1:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =RGBA(34, 102, 227, 1)
                        Color: |
                          =RGBA(34, 102, 227, 1)
                        DisabledBorderColor: =RGBA(166, 166, 166, 1)
                        DisplayMode: |-
                          =If(
                              CountRows(
                                  Filter(
                                      'Expense lines (mserp)',
                                      'Expense report number (mserp_expnumber)' = varSelectedReport.'Expense report number'
                                  )
                              ) > 0,
                              DisplayMode.Edit,
                              DisplayMode.Disabled
                          )
                        Fill: =RGBA(255, 255, 255, 1)
                        Font: =Font.'Segoe UI'
                        Height: =76
                        HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                        HoverColor: =RGBA(255, 255, 255, 1)
                        HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                        OnSelect: |-
                          =Set(
                              gblNavigationDrawerVisibility,
                              false
                          );
                          // ✅ Purpose 필수 필드 유효성 검사
                          UpdateContext({varPurposeValidationFailed: false});
                          If(
                              IsBlank(ComboBox_Purpose.Selected.'Purpose (mserp_value)') && 
                              IsBlank(ComboBox_Purpose.SearchText) && 
                              IsBlank(varSelectedReport.Purpose),
                              UpdateContext({varPurposeValidationFailed: true});
                              Notify(
                                  Coalesce(
                                      GlobalLabels.Labels.'15062:LocalizedName,msdyn_EnterPurposeLabel',
                                      "Purpose field is required."
                                  ),
                                  NotificationType.Error,
                                  gblParams.notificationTime
                              )
                          );
                          // 기존 유효성 검사 및 제출 로직 (Purpose 유효성 검사 통과 시에만 실행)
                          If(
                              !varPurposeValidationFailed,
                              If(
                                  !IsBlank(varSelectedTravelReq) &&
                                  (CountRows(colAttachedExpenses) > 0 || 
                                   CountRows(
                                       Filter(
                                           'Expense lines (mserp)',
                                           'Expense report number (mserp_expnumber)' = varSelectedReport.'Expense report number'
                                       )
                                   ) > 0) &&
                                  Value(varSelectedReport.'Amount (mserp_deextrvrequisitiontotalestimate)') > Value(varSelectedTravelReq.'Amount to reconcile'),
                                  Notify(
                                      "The Expense Total Amount exceeds the Remaining Amount of the Travel Requisition. Please submit a claim within the remaining balance.",
                                      NotificationType.Error,
                                      gblParams.notificationTime
                                  ),
                                  IfError(
                                      Set(
                                          varSelectedReport,
                                          Patch(
                                              'Expense reports (mserp)',
                                              LookUp('Expense reports (mserp)', 'Expense report number' = varSelectedReport.'Expense report number'),
                                              {
                                                  Purpose: If(IsBlank(ComboBox_Purpose.Selected.'Purpose (mserp_value)'),If(IsBlank(ComboBox_Purpose.SearchText),varSelectedReport.Purpose,ComboBox_Purpose.SearchText),ComboBox_Purpose.Selected.'Purpose (mserp_value)'),
                                                  Location : If(IsBlank(ComboBox_Location.Selected.Location),If(IsBlank(ComboBox_Location.SearchText),varSelectedReport.Location,ComboBox_Location.SearchText),ComboBox_Location.Selected.Location),
                                                  Description: scr17_txt_Description_1.Text,
                                                  'Legal entity for expenses': If(IsBlank(ComboBox_LegalEntity_ExpReport.Selected.Value), varSelectedLegalEntity, ComboBox_LegalEntity_ExpReport.Selected.Value),
                                                  'Document Status': 'Document Status (mserp)'.Submitted,
                                                  'Created in Apps': 'NoYes (mserp)'.Yes
                                                  // ⚠️ COMMENTED: 'Project ID' field does not exist in new data source (mserp_trvexptablemobileentity)
                                                  // 'Project ID': If(IsBlank(If(gblIsProjectValidationFlag, ComboBox_ProjectId_ExpReport_odata.Selected.projectId,ComboBox_ProjectId_ExpReport_entity.Selected.'Project ID')), "", If(gblIsProjectValidationFlag, ComboBox_ProjectId_ExpReport_odata.Selected.projectId,ComboBox_ProjectId_ExpReport_entity.Selected.'Project ID'))
                                              }
                                          )
                                      ),
                                      First( ClearCollect( varError, Substitute( Match(FirstError.Details.HttpResponse, """message"":""([^""]*)""").FullMatch, """message"":", "" ) ) )
                                  );
                                  If(
                                      !IsBlank(varSelectedTravelReq) && IsBlank(First(varError).Value),
                                      With(
                                          {
                                              expenseReport1: LookUp(
                                                  'Expense reports (mserp)_1',
                                                  'Expense report number' = varSelectedReport.'Expense report number'
                                              )
                                          },
                                          If(
                                              !IsBlank(expenseReport1.DEEXReferenceId),
                                              Patch(
                                                  'Expense Header to Travel Requisition Entity (mserp)',
                                                  Defaults('Expense Header to Travel Requisition Entity (mserp)'),
                                                  {
                                                      'Reference (mserp_trvexptable)': expenseReport1.DEEXReferenceId,
                                                      'Travel requisition number': varSelectedTravelReq.'Travel requisition number'
                                                  }
                                              )
                                          )
                                      )
                                  );
                                  If(
                                      !(IsBlank(First(varError).Value) || First(varError).Value = ""),
                                      Notify(
                                          Substitute(First(varError).Value, """", ""),
                                          NotificationType.Error,
                                          gblParams.notificationTime
                                      ),
                                      //IfError(
                                      //    Patch(
                                      //        'Expense reports (mserp)_1',
                                      //        LookUp('Expense reports (mserp)_1', 'Expense report number' = varSelectedReport.'Expense report number'),
                                      //        {
                                      //            WorkflowAction: "Submit"
                                      //        }
                                      //    ),
                                      //    First( ClearCollect( varError, Substitute( Match(FirstError.Details.HttpResponse, """message"":""([^""]*)""").FullMatch, """message"":", "" ) ) )
                                      //);
                                      If(
                                          !(IsBlank(First(varError).Value) || First(varError).Value = ""),
                                          Notify(
                                              Substitute(First(varError).Value, """", ""),
                                              NotificationType.Error,
                                              gblParams.notificationTime
                                          ),
                                          Notify(
                                              GlobalLabels.Labels.'15062:LocalizedName,msdyn_ExpenseReportSubmittedSuccessfullyLabel', 
                                              NotificationType.Success, 
                                              gblParams.notificationTime
                                              );
                                          Navigate('Reports - List Screen')
                                      )
                                  );
                                  Clear(varError)
                              )
                          )
                        PressedBorderColor: =Self.Fill
                        PressedColor: =Self.Fill
                        PressedFill: =Self.Color
                        Size: =19.15
                        Text: =GlobalLabels.Labels.'15062:LocalizedName,msdyn_SubmitLabel'
                        Width: |
                          =Parent.Width -  Self.X*2
                        X: |
                          =40
                        Y: '=scr17_btn_SaveDraft_1.Y + scr17_btn_SaveDraft_1.Height + 20 '
                  - scr17_btn_SaveDraft_1:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =ColorFade(Self.Fill, -15%)
                        Color: =RGBA(255, 255, 255, 1)
                        DisabledBorderColor: =RGBA(166, 166, 166, 1)
                        Fill: =RGBA(34, 102, 227, 1)
                        Font: =Font.'Segoe UI'
                        Height: =76
                        HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                        HoverColor: =RGBA(255, 255, 255, 1)
                        HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                        OnSelect: "=Set(\n    gblNavigationDrawerVisibility,\n    false\n);\n// ✅ Purpose 필수 필드 유효성 검사\nUpdateContext({varPurposeValidationFailed: false});\nIf(\n    IsBlank(ComboBox_Purpose.Selected.'Purpose (mserp_value)') && \n    IsBlank(ComboBox_Purpose.SearchText) && \n    IsBlank(varSelectedReport.Purpose),\n    UpdateContext({varPurposeValidationFailed: true});\n    Notify(\n        Coalesce(\n            GlobalLabels.Labels.'15062:LocalizedName,msdyn_EnterPurposeLabel',\n            \"Purpose field is required.\"\n        ),\n        NotificationType.Error,\n        gblParams.notificationTime\n    )\n);\n// 기존 유효성 검사 및 저장 로직 (Purpose 유효성 검사 통과 시에만 실행)\nIf(\n    !varPurposeValidationFailed,\n    // 기존 유효성 검사 및 저장 로직\n    If(\n        // 1. 유효성 검사 (Validation Check)\n        !IsBlank(varSelectedTravelReq) &&\n        (CountRows(colAttachedExpenses) > 0 || \n         CountRows(\n             Filter(\n                 'Expense lines (mserp)',\n                 'Expense report number (mserp_expnumber)' = varSelectedReport.'Expense report number'\n             )\n         ) > 0) &&\n        Value(varSelectedReport.AmountTotal) > Value(varSelectedTravelReq.'Amount to reconcile'),\n        \n        // 2. 유효성 검사 실패 시 (Validation Failed)\n        Notify(\n            \"The Expense Total Amount exceeds the Remaining Amount of the Travel Requisition. Please submit a claim within the remaining balance.\",\n            NotificationType.Error,\n            gblParams.notificationTime\n        ),\n    \n        // 3. 유효성 검사 통과 시 (Validation Passed - Create or Update)\n        If(\n            varIsCreateReport,\n            \n            // 3-1. 신규 생성 로직 (Create Logic)\n            Clear(varError);\n            With(\n                {\n                    patchedReport: IfError(\n                        Patch(\n                            'Expense reports (mserp)',\n                            Defaults('Expense reports (mserp)'),\n                            {\n                                Purpose: If(IsBlank(ComboBox_Purpose.Selected.'Purpose (mserp_value)'),ComboBox_Purpose.SearchText, ComboBox_Purpose.Selected.'Purpose (mserp_value)'),\n                                Location : If(IsBlank(ComboBox_Location.Selected.Location),ComboBox_Location.SearchText,ComboBox_Location.Selected.Location),\n                                Description: scr17_txt_Description_1.Text,\n                                'Legal entity for expenses': If(IsBlank(ComboBox_LegalEntity_ExpReport.Selected.Value), varSelectedLegalEntity, ComboBox_LegalEntity_ExpReport.Selected.Value),\n                                'Created in Apps': 'NoYes (mserp)'.Yes\n                            }\n                        ),\n                        First(\n                            ClearCollect(\n                                varError, \n                                Substitute(\n                                    Match(FirstError.Details.HttpResponse, \"\"\"message\"\":\"\"([^\"\"]*)\"\"\").FullMatch, \n                                    \"\"\"message\"\":\", \n                                    \"\"\n                                )\n                            )\n                        );\n                        Blank()\n                    )\n                },\n                If(\n                    !IsBlank(patchedReport),\n                    Set(varSelectedReport, patchedReport)\n                )\n            ), // ✅ FIXED: 여기 있던 닫는 괄호 ')'를 콤마 ','로 변경하여 Else 구문으로 연결합니다.\n    \n            // 3-2. 기존 수정 로직 (Update Logic - Else Block)\n            Clear(varError);\n            With(\n                {\n                    patchedReport: IfError(\n                        Patch(\n                            'Expense reports (mserp)',\n                            LookUp('Expense reports (mserp)', 'Expense report number' = varSelectedReport.'Expense report number'),\n                            {\n                                Purpose: If(IsBlank(ComboBox_Purpose.Selected.'Purpose (mserp_value)'),If(IsBlank(ComboBox_Purpose.SearchText),varSelectedReport.Purpose, ComboBox_Purpose.SearchText),ComboBox_Purpose.Selected.'Purpose (mserp_value)'),\n                                Location : If(IsBlank(ComboBox_Location.Selected.Location),If(IsBlank(ComboBox_Location.SearchText),varSelectedReport.Location, ComboBox_Location.SearchText),ComboBox_Location.Selected.Location),\n                                Description: scr17_txt_Description_1.Text,\n                                'Legal entity for expenses': If(IsBlank(ComboBox_LegalEntity_ExpReport.Selected.Value), varSelectedLegalEntity, ComboBox_LegalEntity_ExpReport.Selected.Value),\n                                'Created in Apps': 'NoYes (mserp)'.Yes\n                            }\n                        ),\n                        First(\n                            ClearCollect(\n                                varError, \n                                Substitute(\n                                    Match(FirstError.Details.HttpResponse, \"\"\"message\"\":\"\"([^\"\"]*)\"\"\").FullMatch, \n                                    \"\"\"message\"\":\", \n                                    \"\"\n                                )\n                            )\n                        );\n                        Blank()\n                    )\n                },\n                If(\n                    !IsBlank(patchedReport),\n                    Set(varSelectedReport, patchedReport)\n                )\n            )\n        ); // ✅ FIXED: 내부 If(varIsCreateReport...)를 여기서 닫습니다.\n    \n    // 4. 출장 요청 헤더 연결 (Link Header)\n    If(\n        varIsCreateReport && !IsBlank(varSelectedTravelReq) && IsBlank(First(varError).Value) && !IsBlank(varSelectedReport),\n        With(\n            {\n                expenseReport1: LookUp(\n                    'Expense reports (mserp)_1',\n                    'Expense report number' = varSelectedReport.'Expense report number'\n                )\n            },\n            If(\n                !IsBlank(expenseReport1.DEEXReferenceId),\n                Patch(\n                    'Expense Header to Travel Requisition Entity (mserp)',\n                    Defaults('Expense Header to Travel Requisition Entity (mserp)'),\n                    {\n                        'Reference (mserp_trvexptable)': expenseReport1.DEEXReferenceId,\n                        'Travel requisition number': varSelectedTravelReq.'Travel requisition number'\n                    }\n                )\n            )\n        )\n    );\n    \n    // 5. 결과 알림 및 이동 (Result Notify & Navigate)\n    If(\n        !(IsBlank(First(varError).Value) || First(varError).Value = \"\"),\n        Notify(\n            Substitute(First(varError).Value, \"\"\"\", \"\"),\n            NotificationType.Error,\n            gblParams.notificationTime\n        ),\n        If(\n            varIsCreateReport,\n            Notify(\n                GlobalLabels.Labels.'15062:LocalizedName,msdyn_ReportCreateMessageLabel',\n                NotificationType.Success, \n                gblParams.notificationTime\n            ),\n            Notify(\n                GlobalLabels.Labels.'15062:LocalizedName,msdyn_ExpenseReportUpdatedSuccessfullyLabel', \n                NotificationType.Success, \n                gblParams.notificationTime\n            )\n        );\n        Navigate('Reports - List Screen', ScreenTransition.None, {varcntSelectedStatus:1})\n    );\n    Clear(varError)\n    )\n)"
                        PressedBorderColor: =Self.Fill
                        PressedColor: =Self.Fill
                        PressedFill: =Self.Color
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Size: =19.15
                        Text: =GlobalLabels.Labels.'15062:LocalizedName,msdyn_SaveDraftLabel'
                        Width: |
                          =Parent.Width -  Self.X*2
                        X: |
                          =40
                        Y: =20
      - Report Detals -  Draft:
          Control: GroupContainer@1.4.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: ='Totals Buttons - Draft'.Y - Self.Y
            LayoutDirection: =LayoutDirection.Vertical
            LayoutOverflowY: =LayoutOverflow.Scroll
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
            Y: =82
          Children:
            - Description - Draft:
                Control: GroupContainer@1.4.0
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  Height: =175
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =10
                  LayoutJustifyContent: =LayoutJustifyContent.Center
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  PaddingLeft: =25
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Visible: |-
                    =/*
                    If ( locReimaginedfeatureEnabled,
                        !IsBlank(LookUp(gblExpenseReportFieldVisibilityReImaginedLookup, FieldName = "Txt1")),
                        !IsBlank(LookUp(gblExpenseReportFieldVisibilityLookup, FieldName = "Txt1"))
                    )
                    */
                    true
                  Width: =Parent.Width
                Children:
                  - DescriptionContainer_1:
                      Control: GroupContainer@1.4.0
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =50
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        LayoutMinWidth: =Parent.Width
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =scr17_txt_Description_1.Width
                      Children:
                        - scr17_img_DescriptionSelected_1:
                            Control: Image@2.2.3
                            Properties:
                              BorderColor: =RGBA(0, 18, 107, 1)
                              Height: =22
                              Image: =ShapeDescriptionSelected
                              LayoutMaxHeight: =
                              LayoutMaxWidth: =
                              Visible: =ctLabel3
                              Width: =22
                              X: =scr17_txt_Description_1.X
                              Y: =scr17_txt_Description_1.Y - (15 + scr17_img_DescriptionSelected_1.Height)
                        - scr17_img_Description_1:
                            Control: Image@2.2.3
                            Properties:
                              BorderColor: =RGBA(0, 18, 107, 1)
                              Height: =22
                              Image: =ShapeDescription
                              LayoutMaxHeight: =
                              LayoutMaxWidth: =
                              Visible: =!scr17_img_DescriptionSelected_1.Visible
                              Width: =22
                              X: =scr17_txt_Description_1.X
                              Y: =scr17_txt_Description_1.Y - (15 + scr17_img_Description_1.Height)
                        - scr17_lbl_Description_1:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0, 18, 107, 1)
                              FillPortions: =1
                              Font: =Font.'Segoe UI'
                              Height: =32
                              LayoutMaxHeight: =
                              LayoutMaxWidth: =
                              PaddingBottom: =0
                              PaddingTop: =0
                              Size: =18
                              Text: |-
                                =//GlobalLabels.Labels.'15062:LocalizedName,msdyn_DescriptionLabel'
                                "Name of the report"
                              VerticalAlign: =VerticalAlign.Top
                              Width: =126
                              X: |-
                                =scr17_img_Description_1.X + scr17_img_Description_1.Width + 
                                8
                              Y: =scr17_img_Description_1.Y - 5
                  - scr17_txt_Description_1:
                      Control: Classic/TextInput@2.3.2
                      Properties:
                        AccessibleLabel: ="Enter Name of report"
                        BorderColor: =RGBA(255, 255, 255, 1)
                        BorderThickness: =0
                        Default: |-
                          =If(
                              !(IsBlank(varSelectedReport) || IsBlank(varSelectedReport.Description)),
                              varSelectedReport.Description
                          )
                        FocusedBorderThickness: =0
                        Font: =Font.'Segoe UI'
                        Height: ='Reports - Edit Screen'.Height*Value(0.0616,"en-US")
                        HintText: |-
                          =//GlobalLabels.Labels.'15062:LocalizedName,msdyn_ExpenseReportDescriptionPlaceholderLabel'
                          "Enter Name of report"
                        HoverBorderColor: =RGBA(0, 18, 107, 1)
                        HoverFill: =
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        OnChange: |-
                          =If(
                              scr17_txt_Description_1.Text <> varSelectedReport.Description,
                              UpdateContext({isExpReportDirty : true})
                          );
                          RemoveIf(colReportPostDetails, fieldName = "Description");
                          Collect(
                              colReportPostDetails,
                              {
                                  fieldName: "Description",
                                  fieldValue: scr17_txt_Description_1.Text,
                                  fieldType: "String"
                              }
                          )
                        OnSelect: |
                          =UpdateContext({ctLabel1 : false});
                          UpdateContext({ctLabel2 : false});
                          UpdateContext({ctLabel3 : true});
