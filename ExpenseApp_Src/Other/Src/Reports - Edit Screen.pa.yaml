                              HoverFill: =
                              OnSelect: "=Set(gblNavigationDrawerVisibility, false);\n\n// 1. 화면 이동 전 현재 UI에서 선택/입력된 목적(Purpose) 값을 미리 변수에 확정하여 저장 (타이밍 버그 방지)\n// Coalesce 함수는 나열된 값 중 가장 먼저 '비어 있지 않은(Non-blank)' 값을 찾아 반환합니다.\nUpdateContext({\n    locTargetPurpose: Coalesce(\n        ComboBox_Purpose.Selected.'Purpose (mserp_value)',\n        ComboBox_Purpose.SearchText,\n        varSelectedReport.'Purpose (mserp_purpose)'\n    ),\n    varCreateError: Blank(), \n    varPurposeValidationFailed: false\n});\n\n// 2. 필수 값 유효성 검사 (콤보박스 대신 locTargetPurpose 변수 사용)\nIf(\n    IsBlank(locTargetPurpose),\n    UpdateContext({\n        varPurposeValidationFailed: true, \n        varCreateError: Coalesce(GlobalLabels.Labels.'15062:LocalizedName,msdyn_EnterPurposeLabel', \"Purpose field is required.\")\n    })\n);\nIf(\n    !IsEmpty(colActiveDelegations) && IsBlank(ComboBox_Employee.Selected.WorkerID), \n    UpdateContext({\n        varPurposeValidationFailed: true, \n        varCreateError: \"Delegate Employee field is required.\"\n    })\n);\n\n// 3. 신규 생성 OR 기존 수정사항 저장\nIf(\n    !varPurposeValidationFailed,\n    Clear(varError);\n    UpdateContext({varCreateError: Blank()});\n    \n    With(\n        {\n            patchedReport: IfError(\n                If(\n                    varIsCreateReport,\n                    // [신규 생성 로직]\n                    Patch(\n                        'Expense reports (mserp)_1',\n                        Defaults('Expense reports (mserp)_1'),\n                        {\n                            'Company Code': Lower(varSelectedLegalEntity), \n                            \n                            // \U0001F4A1 [핵심 수정 1] 생성(Patch) 시점에는 반드시 \"현재 로그인한 접속자\"를 전송합니다.\n                            // D365 서버의 무조건적인 본인 인증 검증(400 에러)을 통과하기 위함입니다.\n                            Employee: Value(userRecord.CreatingWorker),\n\n                            'Purpose (mserp_purpose)': locTargetPurpose,\n                            Description: Coalesce(scr17_txt_Description_1.Text, \"New Expense Report\"),\n                            Location : If(IsBlank(ComboBox_Location.Selected.Location), If(IsBlank(ComboBox_Location.SearchText), varSelectedReport.Location, ComboBox_Location.SearchText), ComboBox_Location.Selected.Location),\n                            \n                            // 혹시 모를 대문자 에러를 방지하기 위해 여기도 Lower() 처리\n                            'Legal entity for expenses': If(IsBlank(ComboBox_LegalEntity_ExpReport.Selected.Value), Lower(varSelectedLegalEntity), Lower(ComboBox_LegalEntity_ExpReport.Selected.Value)),\n                            \n                            // \U0001F4A1 [핵심 수정 2] 타겟 대리인의 ID는 오직 이곳(Delegated Worker)에만 담아 보냅니다.\n                            'Delegated Worker': If(!IsEmpty(colActiveDelegations), Value(ComboBox_Employee.Selected.WorkerID), Blank()),\n                            'Created in Apps': 'NoYes (mserp)'.Yes\n                        }\n                    ),\n                    // [기존 수정 로직]\n                    Patch(\n                        'Expense reports (mserp)_1',\n                        LookUp('Expense reports (mserp)_1', 'Expense report number' = varSelectedReport.'Expense report number'),\n                        {\n                            'Purpose (mserp_purpose)': locTargetPurpose,\n                            Location : If(IsBlank(ComboBox_Location.Selected.Location), If(IsBlank(ComboBox_Location.SearchText), varSelectedReport.Location, ComboBox_Location.SearchText), ComboBox_Location.Selected.Location),\n                            Description: scr17_txt_Description_1.Text,\n                            'Legal entity for expenses': If(IsBlank(ComboBox_LegalEntity_ExpReport.Selected.Value), Lower(varSelectedLegalEntity), Lower(ComboBox_LegalEntity_ExpReport.Selected.Value)),\n                            'Delegated Worker': If(!IsEmpty(colActiveDelegations), Value(ComboBox_Employee.Selected.WorkerID), Blank())\n                        }\n                    )\n                ),\n                // \U0001F4A1 [개선] 빈 에러 메시지에도 대응하는 강력한 에러 핸들러\n                UpdateContext({\n                    varCreateError: Coalesce(\n                        If(\n                            !IsBlank(FirstError.Details.HttpResponse) && IsMatch(FirstError.Details.HttpResponse, \".*\"\"message\"\":\"\"[^\"\"]+\"\".*\"), \n                            Substitute(Match(FirstError.Details.HttpResponse, \"\"\"message\"\":\"\"([^\"\"]+)\"\"\").FullMatch, \"\"\"message\"\":\", \"\")\n                        ),\n                        If(!IsBlank(FirstError.Message) && FirstError.Message <> \"Expense reports (mserp)_1 실패: \", FirstError.Message),\n                        \"D365 F&O 서버 내부 검증(Validation) 에러로 인해 생성이 거부되었습니다.\"\n                    )\n                });\n                Blank() // 에러 시 Blank 반환\n            )\n        },\n        \n        // \U0001F4A1 [핵심 해결 로직] Patch 성공 시 F&O에서 번호를 안 줬을 경우를 대비한 최신 데이터 재조회\n        If(\n            IsBlank(varCreateError) && !IsBlank(patchedReport),\n            If(\n                // 신규 생성인데 보고서 번호가 빈 값(Blank)으로 응답된 경우\n                varIsCreateReport && IsBlank(patchedReport.'Expense report number'),\n                Set(\n                    varSelectedReport,\n                    First(\n                        SortByColumns(\n                            Filter(\n                                'Expense reports (mserp)_1', \n                                'Company Code' = Lower(varSelectedLegalEntity), \n                                \n                                // \U0001F4A1 [핵심 수정 3] 다시 찾을 때(Re-fetch)는 F&O가 치환해 둔 '대리인(UI 선택자)'으로 검색해야 합니다!\n                                Employee = Value(ComboBox_Employee.Selected.WorkerID),\n                                \n                                'Purpose (mserp_purpose)' = locTargetPurpose\n                            ),\n                            \"mserp_createddate\",\n                            SortOrder.Descending\n                        )\n                    )\n                ),\n                // 정상적으로 번호가 왔거나(드문 경우) 기존 보고서 수정 모드일 때는 그대로 덮어씁니다.\n                Set(varSelectedReport, patchedReport)\n            )\n        )\n    )\n);\n\n// 4. 에러 확인 후 네비게이션\nIf(\n    IsBlank(varCreateError),\n    // 화면 이동 전 상태 변수를 변경하더라도 locTargetPurpose는 이미 고정되어 있으므로 안전합니다.\n    Set(varIsCreateReport, false);\n    Navigate(\n        'Reports - Attach Expenses Screen', \n        ScreenTransition.None, \n        {\n            varCntBack_scr17: true,\n            ctxSelectedWorkerID: ComboBox_Employee.Selected.WorkerID, \n            ctxTargetPurpose: locTargetPurpose // \U0001F4A1 더 이상 빈 값이 넘어가지 않습니다!\n        }\n    ),\n    Notify(Substitute(varCreateError, \"\"\"\", \"\"), NotificationType.Error, gblParams.notificationTime)\n);"
                              PressedBorderColor: =
                              PressedFill: =
                              RadiusBottomLeft: =6
                              RadiusBottomRight: =6
