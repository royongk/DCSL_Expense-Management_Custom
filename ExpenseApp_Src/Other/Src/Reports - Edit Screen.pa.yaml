                Children:
                  - scr17_btn_Submit_1:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =RGBA(34, 102, 227, 1)
                        Color: |
                          =RGBA(34, 102, 227, 1)
                        DisabledBorderColor: =RGBA(166, 166, 166, 1)
                        DisplayMode: |-
                          =If(
                              CountRows(
                                  Filter(
                                      'DCSL Expense Line Expense Moblie Entity (mserp)',
                                      'Expense report number (mserp_expnumber)' = varSelectedReport.'Expense report number'
                                  )
                              ) > 0,
                              DisplayMode.Edit,
                              DisplayMode.Disabled
                          )
                        Fill: =RGBA(255, 255, 255, 1)
                        Font: =Font.'Segoe UI'
                        Height: =76
                        HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                        HoverColor: =RGBA(255, 255, 255, 1)
                        HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                        OnSelect: |-
                          =Set(
                              gblNavigationDrawerVisibility,
                              false
                          );
                          // ✅ Purpose 필수 필드 유효성 검사
                          UpdateContext({varPurposeValidationFailed: false});
                          If(
                              IsBlank(ComboBox_Purpose.Selected.'Purpose (mserp_value)') && 
                              IsBlank(ComboBox_Purpose.SearchText) && 
                              IsBlank(varSelectedReport.'Purpose (mserp_purpose)'),
                              UpdateContext({varPurposeValidationFailed: true});
                              Notify(
                                  Coalesce(
                                      GlobalLabels.Labels.'15062:LocalizedName,msdyn_EnterPurposeLabel',
                                      "Purpose field is required."
                                  ),
                                  NotificationType.Error,
                                  gblParams.notificationTime
                              )
                          );
                          // ✅ Delegate Employee 필수 필드 유효성 검사
                          If(
                              !IsEmpty(colActiveDelegations) &&
                              IsBlank(ComboBox_Employee.Selected.WorkerID), 
                              Notify(
                                  "Delegate Employee field is required.",
                                  NotificationType.Error,
                                  gblParams.notificationTime
                              )
                          );
                          // 기존 유효성 검사 및 제출 로직 (Purpose 유효성 검사 통과 시에만 실행)
                          If(
                              !varPurposeValidationFailed,
                              If(
                                  !IsBlank(varSelectedTravelReq) &&
                                  (CountRows(colAttachedExpenses) > 0 || 
                                   CountRows(
                                       Filter(
                                           'DCSL Expense Line Expense Moblie Entity (mserp)',
                                           'Expense report number (mserp_expnumber)' = varSelectedReport.'Expense report number'
                                       )
                                   ) > 0) &&
                                  Value(varSelectedReport.'Amount (mserp_deextrvrequisitiontotalestimate)') > Value(varSelectedTravelReq.'Amount to reconcile'),
                                  Notify(
                                      "The Expense Total Amount exceeds the Remaining Amount of the Travel Requisition. Please submit a claim within the remaining balance.",
                                      NotificationType.Error,
                                      gblParams.notificationTime
                                  ),
                                  IfError(
                                      Set(
                                          varSelectedReport,
                                          Patch(
                                              'Expense reports (mserp)_1',
                                              LookUp('Expense reports (mserp)_1', 'Expense report number' = varSelectedReport.'Expense report number'),
                                              {
                                                  'Purpose (mserp_purpose)': If(IsBlank(ComboBox_Purpose.Selected.'Purpose (mserp_value)'),If(IsBlank(ComboBox_Purpose.SearchText),varSelectedReport.'Purpose (mserp_purpose)',ComboBox_Purpose.SearchText),ComboBox_Purpose.Selected.'Purpose (mserp_value)'),
                                                  Location : If(IsBlank(ComboBox_Location.Selected.Location),If(IsBlank(ComboBox_Location.SearchText),varSelectedReport.Location,ComboBox_Location.SearchText),ComboBox_Location.Selected.Location),
                                                  Description: scr17_txt_Description_1.Text,
                                                  'Legal entity for expenses': If(IsBlank(ComboBox_LegalEntity_ExpReport.Selected.Value), varSelectedLegalEntity, ComboBox_LegalEntity_ExpReport.Selected.Value),
                                                  'Document Status': 'Document Status (mserp)'.Submitted,
                                                  'Created in Apps': 'NoYes (mserp)'.Yes,
                                                  'Delegated Worker': If(!IsEmpty(colActiveDelegations), Value(ComboBox_Employee.Selected.WorkerID), Blank())
                                                  // ⚠️ COMMENTED: 'Project ID' field does not exist in new data source (mserp_trvexptablemobileentity)
                                                  // 'Project ID': If(IsBlank(If(gblIsProjectValidationFlag, ComboBox_ProjectId_ExpReport_odata.Selected.projectId,ComboBox_ProjectId_ExpReport_entity.Selected.'Project ID')), "", If(gblIsProjectValidationFlag, ComboBox_ProjectId_ExpReport_odata.Selected.projectId,ComboBox_ProjectId_ExpReport_entity.Selected.'Project ID'))
                                              }
                                          )
                                      ),
                                      First( ClearCollect( varError, Substitute( Match(FirstError.Details.HttpResponse, """message"":""([^""]*)""").FullMatch, """message"":", "" ) ) )
                                  );
                                  If(
                                      !IsBlank(varSelectedTravelReq) && IsBlank(First(varError).Value),
                                      With(
                                          {
                                              expenseReport1: LookUp(
                                                  'Expense reports (mserp)_1',
                                                  'Expense report number' = varSelectedReport.'Expense report number'
                                              )
                                          },
                                          If(
                                              !IsBlank(expenseReport1.DEEXReferenceId),
                                              Patch(
                                                  'Expense Header to Travel Requisition Entity (mserp)',
                                                  Defaults('Expense Header to Travel Requisition Entity (mserp)'),
                                                  {
                                                      'Reference (mserp_trvexptable)': expenseReport1.DEEXReferenceId,
                                                      'Travel requisition number': varSelectedTravelReq.'Travel requisition number'
                                                  }
                                              )
                                          )
                                      )
                                  );
                                  If(
                                      !(IsBlank(First(varError).Value) || First(varError).Value = ""),
                                      Notify(
                                          Substitute(First(varError).Value, """", ""),
                                          NotificationType.Error,
                                          gblParams.notificationTime
                                      ),
                                      //IfError(
                                      //    Patch(
                                      //        'Expense reports (mserp)_1',
                                      //        LookUp('Expense reports (mserp)_1', 'Expense report number' = varSelectedReport.'Expense report number'),
                                      //        {
                                      //            WorkflowAction: "Submit"
                                      //        }
                                      //    ),
                                      //    First( ClearCollect( varError, Substitute( Match(FirstError.Details.HttpResponse, """message"":""([^""]*)""").FullMatch, """message"":", "" ) ) )
                                      //);
                                      If(
                                          !(IsBlank(First(varError).Value) || First(varError).Value = ""),
                                          Notify(
                                              Substitute(First(varError).Value, """", ""),
                                              NotificationType.Error,
                                              gblParams.notificationTime
                                          ),
                                          Notify(
                                              GlobalLabels.Labels.'15062:LocalizedName,msdyn_ExpenseReportSubmittedSuccessfullyLabel', 
                                              NotificationType.Success, 
                                              gblParams.notificationTime
                                              );
                                          Navigate('Reports - List Screen')
                                      )
                                  );
                                  Clear(varError)
                              )
                          )
                        PressedBorderColor: =Self.Fill
                        PressedColor: =Self.Fill
                        PressedFill: =Self.Color
                        Size: =19.15
                        Text: =GlobalLabels.Labels.'15062:LocalizedName,msdyn_SubmitLabel'
                        Width: |
                          =Parent.Width -  Self.X*2
                        X: |
                          =40
                        Y: '=scr17_btn_SaveDraft_1.Y + scr17_btn_SaveDraft_1.Height + 20 '
                  - scr17_btn_SaveDraft_1:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =ColorFade(Self.Fill, -15%)
                        Color: =RGBA(255, 255, 255, 1)
                        DisabledBorderColor: =RGBA(166, 166, 166, 1)
                        Fill: =RGBA(34, 102, 227, 1)
                        Font: =Font.'Segoe UI'
                        Height: =76
                        HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                        HoverColor: =RGBA(255, 255, 255, 1)
                        HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                        OnSelect: "=Set(\n    gblNavigationDrawerVisibility,\n    false\n);\n// ✅ Purpose 필수 필드 유효성 검사\nUpdateContext({varPurposeValidationFailed: false});\nIf(\n    IsBlank(ComboBox_Purpose.Selected.'Purpose (mserp_value)') && \n    IsBlank(ComboBox_Purpose.SearchText) && \n    IsBlank(varSelectedReport.'Purpose (mserp_purpose)'),\n    UpdateContext({varPurposeValidationFailed: true});\n    Notify(\n        Coalesce(\n            GlobalLabels.Labels.'15062:LocalizedName,msdyn_EnterPurposeLabel',\n            \"Purpose field is required.\"\n        ),\n        NotificationType.Error,\n        gblParams.notificationTime\n    )\n);\n// ✅ Delegate Employee 필수 필드 유효성 검사\nIf(\n    !IsEmpty(colActiveDelegations) &&\n    IsBlank(ComboBox_Employee.Selected.WorkerID), \n    Notify(\n        \"Delegate Employee field is required.\",\n        NotificationType.Error,\n        gblParams.notificationTime\n    )\n);\n// 기존 유효성 검사 및 저장 로직 (Purpose 유효성 검사 통과 시에만 실행)\nIf(\n    !varPurposeValidationFailed,\n    // 기존 유효성 검사 및 저장 로직\n    If(\n        // 1. 유효성 검사 (Validation Check)\n        !IsBlank(varSelectedTravelReq) &&\n        (CountRows(colAttachedExpenses) > 0 || \n         CountRows(\n             Filter(\n                 'DCSL Expense Line Expense Moblie Entity (mserp)',\n                 'Expense report number (mserp_expnumber)' = varSelectedReport.'Expense report number'\n             )\n         ) > 0) &&\n        Value(varSelectedReport.'Amount (mserp_amounttotal)') > Value(varSelectedTravelReq.'Amount to reconcile'),\n        \n        // 2. 유효성 검사 실패 시 (Validation Failed)\n        Notify(\n            \"The Expense Total Amount exceeds the Remaining Amount of the Travel Requisition. Please submit a claim within the remaining balance.\",\n            NotificationType.Error,\n            gblParams.notificationTime\n        ),\n    \n        // 3. 유효성 검사 통과 시 (Validation Passed - Create or Update)\n        If(\n            varIsCreateReport,\n            \n            // 3-1. 신규 생성 로직 (Create Logic)\n            Clear(varError);\n            With(\n                {\n                    patchedReport: IfError(\n                        Patch(\n                            'Expense reports (mserp)_1',\n                            Defaults('Expense reports (mserp)_1'),\n                            {\n                                'Purpose (mserp_purpose)': If(IsBlank(ComboBox_Purpose.Selected.'Purpose (mserp_value)'),ComboBox_Purpose.SearchText, ComboBox_Purpose.Selected.'Purpose (mserp_value)'),\n                                Location : If(IsBlank(ComboBox_Location.Selected.Location),ComboBox_Location.SearchText,ComboBox_Location.Selected.Location),\n                                Description: scr17_txt_Description_1.Text,\n                                'Legal entity for expenses': If(IsBlank(ComboBox_LegalEntity_ExpReport.Selected.Value), varSelectedLegalEntity, ComboBox_LegalEntity_ExpReport.Selected.Value),\n                                'Created in Apps': 'NoYes (mserp)'.Yes,\n                                'Delegated Worker': If(!IsEmpty(colActiveDelegations), Value(ComboBox_Employee.Selected.WorkerID), Blank())\n                            }\n                        ),\n                        First(\n                            ClearCollect(\n                                varError, \n                                Substitute(\n                                    Match(FirstError.Details.HttpResponse, \"\"\"message\"\":\"\"([^\"\"]*)\"\"\").FullMatch, \n                                    \"\"\"message\"\":\", \n                                    \"\"\n                                )\n                            )\n                        );\n                        Blank()\n                    )\n                },\n                If(\n                    !IsBlank(patchedReport),\n                    Set(varSelectedReport, patchedReport)\n                )\n            ), // ✅ FIXED: 여기 있던 닫는 괄호 ')'를 콤마 ','로 변경하여 Else 구문으로 연결합니다.\n    \n            // 3-2. 기존 수정 로직 (Update Logic - Else Block)\n            Clear(varError);\n            With(\n                {\n                    patchedReport: IfError(\n                        Patch(\n                            'Expense reports (mserp)_1',\n                            LookUp('Expense reports (mserp)_1', 'Expense report number' = varSelectedReport.'Expense report number'),\n                            {\n                                'Purpose (mserp_purpose)': If(IsBlank(ComboBox_Purpose.Selected.'Purpose (mserp_value)'),If(IsBlank(ComboBox_Purpose.SearchText),varSelectedReport.'Purpose (mserp_purpose)', ComboBox_Purpose.SearchText),ComboBox_Purpose.Selected.'Purpose (mserp_value)'),\n                                Location : If(IsBlank(ComboBox_Location.Selected.Location),If(IsBlank(ComboBox_Location.SearchText),varSelectedReport.Location, ComboBox_Location.SearchText),ComboBox_Location.Selected.Location),\n                                Description: scr17_txt_Description_1.Text,\n                                'Legal entity for expenses': If(IsBlank(ComboBox_LegalEntity_ExpReport.Selected.Value), varSelectedLegalEntity, ComboBox_LegalEntity_ExpReport.Selected.Value),\n                                'Created in Apps': 'NoYes (mserp)'.Yes,\n                                'Delegated Worker': If(!IsEmpty(colActiveDelegations), Value(ComboBox_Employee.Selected.WorkerID), Blank())\n                            }\n                        ),\n                        First(\n                            ClearCollect(\n                                varError, \n                                Substitute(\n                                    Match(FirstError.Details.HttpResponse, \"\"\"message\"\":\"\"([^\"\"]*)\"\"\").FullMatch, \n                                    \"\"\"message\"\":\", \n                                    \"\"\n                                )\n                            )\n                        );\n                        Blank()\n                    )\n                },\n                If(\n                    !IsBlank(patchedReport),\n                    Set(varSelectedReport, patchedReport)\n                )\n            )\n        ); // ✅ FIXED: 내부 If(varIsCreateReport...)를 여기서 닫습니다.\n    \n    // 4. 출장 요청 헤더 연결 (Link Header)\n    If(\n        varIsCreateReport && !IsBlank(varSelectedTravelReq) && IsBlank(First(varError).Value) && !IsBlank(varSelectedReport),\n        With(\n            {\n                expenseReport1: LookUp(\n                    'Expense reports (mserp)_1',\n                    'Expense report number' = varSelectedReport.'Expense report number'\n                )\n            },\n            If(\n                !IsBlank(expenseReport1.DEEXReferenceId),\n                Patch(\n                    'Expense Header to Travel Requisition Entity (mserp)',\n                    Defaults('Expense Header to Travel Requisition Entity (mserp)'),\n                    {\n                        'Reference (mserp_trvexptable)': expenseReport1.DEEXReferenceId,\n                        'Travel requisition number': varSelectedTravelReq.'Travel requisition number'\n                    }\n                )\n            )\n        )\n    );\n    \n    // 5. ReferenceId 및 ReferenceDataAreaId 조회 후 교차 테이블에 Insert\n    If(\n        !IsBlank(ComboBox_MaptoCashAdvance.Selected.'Cash advance number') && (Toggle_Settlment_1.Value = true),\n        Patch(\n            'Expense reports (mserp)_1',\n            LookUp('Expense reports (mserp)_1', 'Expense report number' = varSelectedReport.'Expense report number'),\n            {\n                'Settlement from Cash Advance': 'NoYes (mserp)'.Yes\n            }\n        );\n        With(\n            {\n                // 조회 조건은 화면 내 갤러리(Gallery)나 콤보박스(ComboBox)의 선택 항목 등에 맞게 수정해주세요.\n                varCashAdvance: LookUp(\n                    'DCSL TrvCash Advance Entity  (mserp)',\n                    'Cash advance number' = ComboBox_MaptoCashAdvance.Selected.'Cash advance number' // 예시 조건\n                ),\n                varExpenseReport: LookUp(\n                    'Expense reports (mserp)_1',\n                    'Expense report number' = varSelectedReport.'Expense report number' // (생성된 경비보고서 번호)\n                )\n            },\n            \n            // 3. 두 테이블에서 필수 키 값을 정상적으로 찾았는지 검증\n            If(\n                !IsBlank(varCashAdvance.ReferenceId) && !IsBlank(varExpenseReport.DEEXReferenceId),\n                \n                // [해결 방법] 위임 경고를 없애기 위해 LookUp 외부에서 단순 변수로 값을 먼저 추출합니다.\n                // 만약 TrvExpTable이 텍스트(Text)형 컬럼이라면 Text()로, 숫자(Number)형이라면 Value()로 감싸주세요.\n                // (보통 F&O ReferenceId는 숫자형이므로 Value()를 사용하는 것이 안전합니다.)\n                With(\n                    {\n                        // 위임 경고를 피하기 위한 단일 값 추출 및 형변환\n                        valExpId: Value(varExpenseReport.DEEXReferenceId),\n                        valCompanyCode: Text(varSelectedLegalEntity),\n                        valCashAdvanceId: Value(varCashAdvance.ReferenceId)\n                    },\n                    \n                    // With로 생성한 단일 변수(valExpId, valCompanyCode)를 사용하여 위임 경고 없이 조회합니다.\n                    With(\n                        {\n                            varExistingMapping: LookUp(\n                                'DCSL TrvExpTableTrvCashAdvanceTable Entity (mserp)',\n                                TrvExpTable = valExpId && \n                                'Company Code' = valCompanyCode\n                            )\n                        },\n                        \n                        // 데이터 존재 여부 및 변경 여부에 따른 분기 처리 (Insert / Update / Skip)\n                        If(\n                            // 상황 1: 기존 매핑 없음 -> 신규 생성 (Insert)\n                            IsBlank(varExistingMapping),\n                            Patch(\n                                'DCSL TrvExpTableTrvCashAdvanceTable Entity (mserp)',\n                                Defaults('DCSL TrvExpTableTrvCashAdvanceTable Entity (mserp)'),\n                                {\n                                    TrvCashAdvance: valCashAdvanceId,\n                                    'Company Code': valCompanyCode,\n                                    TrvExpTable: valExpId\n                                }\n                            );                \n                            Notify(\"현금 선지급 매핑이 성공적으로 추가되었습니다.\", NotificationType.Success);\n                            \n                            // 상황 2: 매핑이 존재하지만 현금 선지급 ID가 다른 경우 -> 덮어쓰기 (Update)\n                            , varExistingMapping.TrvCashAdvance <> valCashAdvanceId,\n                            Patch(\n                                'DCSL TrvExpTableTrvCashAdvanceTable Entity (mserp)',\n                                varExistingMapping, \n                                {\n                                    TrvCashAdvance: valCashAdvanceId\n                                }\n                            );\n                            Notify(\"현금 선지급 매핑이 새로운 값으로 수정되었습니다.\", NotificationType.Success);\n                            \n                            // 상황 3: 매핑이 존재하고 값도 같은 경우 -> 무시 (Skip)\n                            ,\n                            Notify(\"현금 선지급 정보가 동일하여 변경되지 않았습니다.\", NotificationType.Information)\n                        )\n                    )\n                ),\n                \n                // 필수 데이터 누락 시 예외 처리\n                Notify(\"현금 선지급 또는 경비 보고서의 식별자(ID)를 찾을 수 없습니다.\", NotificationType.Error)\n            )\n        )\n    );\n\n    // 5. 결과 알림 및 이동 (Result Notify & Navigate)\n    If(\n        !(IsBlank(First(varError).Value) || First(varError).Value = \"\"),\n        Notify(\n            Substitute(First(varError).Value, \"\"\"\", \"\"),\n            NotificationType.Error,\n            gblParams.notificationTime\n        ),\n        If(\n            varIsCreateReport,\n            Notify(\n                GlobalLabels.Labels.'15062:LocalizedName,msdyn_ReportCreateMessageLabel',\n                NotificationType.Success, \n                gblParams.notificationTime\n            ),\n            Notify(\n                GlobalLabels.Labels.'15062:LocalizedName,msdyn_ExpenseReportUpdatedSuccessfullyLabel', \n                NotificationType.Success, \n                gblParams.notificationTime\n            )\n        );\n        Navigate('Reports - List Screen', ScreenTransition.None, {varcntSelectedStatus:1})\n    );\n    Clear(varError)\n    )\n)"
                        PressedBorderColor: =Self.Fill
                        PressedColor: =Self.Fill
                        PressedFill: =Self.Color
