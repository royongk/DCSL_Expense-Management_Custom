Screens:
  Reports - Edit Screen:
    Properties:
      Fill: =RGBA(229, 229, 229, 1)
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: "=UpdateContext({ctLabel1 : false});\nUpdateContext({ctLabel2 : false});\nUpdateContext({ctLabel3 : false});\nUpdateContext({ctLabel4 : false});\nUpdateContext({ctLabel5 : false});\nUpdateContext({ctLabel6 : false});\nUpdateContext({ctLabel7 : false});\nUpdateContext({ctLabel8 : false});\n\nUpdateContext({ctVarReportDetailsBack:false});\nUpdateContext({isExpReportDirty : false});\nIf(\n    IsBlank(\n        LookUp(\n            colReportPostDetails,\n            fieldName = \"Description\"\n        )\n    ),\n    Reset(scr17_txt_Description_1)\n);\nIf(\n    varIsCreateReport,\n    Reset(ComboBox_Location);\n    Reset(ComboBox_Purpose);\n    Reset(scr17_txt_Description_1);\n    Reset(ComboBox_LegalEntity_ExpReport);\n    //If( \n    //    gblIsProjectValidationFlag,\n    //    Reset(ComboBox_ProjectId_ExpReport_odata),\n    //    Reset(ComboBox_ProjectId_ExpReport_entity)\n    //);\n);\nUpdateContext(\n    {\n        locReimaginedfeatureEnabled: (userRecord.IsReimaginedUIEnabled = 'NoYes (mserp)'.Yes)\n    }\n);\n\n// 1. 접속한 사용자의 마스터 정보 가져오기 (화면에 '본인' 이름을 표시하기 위함)\nSet(\n    varCurrentD365User,\n    LookUp('Expense mobile master data (mserp)', Email = User().Email)\n);\n\n// 2. [변경됨] 가상 필드 대신, 물리적 텍스트 필드(mserp_delegateduser)로 서버에서 직접 필터링합니다.\nClearCollect(\n    colActiveDelegations,\n    Filter(\n        '@DEEX:DEEX_20316 (mserp)',\n        // 텍스트 ID 끼리 비교합니다. (varCurrentD365User.mserp_userid 가 \"DEEX1.ERP\" 형태)\n        Delegate = varCurrentD365User.ID && \n        'Start date' <= Today() &&\n        'End date' >= Today()\n    )\n);\n\n// 3. 콤보박스 선택지 생성 (첫 번째: 접속자 본인)\nClearCollect(\n    colCreatingWorkerOptions,\n    {\n        WorkerID: userRecord.CreatingWorker, // 저장용 내 숫자 ID\n        WorkerName: varCurrentD365User.ID & \" (MySelf)\" // 화면 표시용 내 이름\n    }\n);\n\n// 4. 콤보박스 선택지 추가 (대리 신청 대상자)\nForAll(\n    colActiveDelegations,\n    Collect(\n        colCreatingWorkerOptions,\n        {\n            // [저장용] Expense Line 테이블에 넘겨줄 위임자의 고유 숫자 ID\n            WorkerID: ThisRecord.Employee, \n            \n            // [표시용] 새로 추가된 텍스트 'ID' 필드를 이용해 마스터 테이블에서 이름을 찾아옴!\n            WorkerName: ThisRecord.ID & \" (Delegate)\"\n        }\n    )\n);\n\nIf(\n    locReimaginedfeatureEnabled, \n    If(\n        CountRows(gblExpenseReportFieldVisibilityReImaginedLookup) <= 0,\n        ClearCollect(\n            gblExpenseReportFieldVisibilityReImaginedLookup, \n            Filter(\n                'Expense mobile report field visibility (mserp)', \n                LegalEntityId = varSelectedLegalEntity && \n                VisibilityType <> 'ExpenseFieldVisibilityType (mserp)'.'Do not display'\n            )\n        )\n    ),\n    If(\n        CountRows(gblExpenseReportFieldVisibilityLookup) <= 0,\n        ClearCollect(\n            gblExpenseReportFieldVisibilityLookup, \n            Filter(\n                '@ExpenseManagement:TrvExpMobileReportAdminCustomFieldsEntity (mserp)',\n                LegalEntityId = varSelectedLegalEntity && \n                Visibility <> 'Visibility (mserp)'.'Do not display'\n            )\n        )\n    )\n);"
