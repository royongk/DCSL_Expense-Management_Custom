Screens:
  Reports - List Screen:
    Properties:
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |+
        =UpdateContext({varCntSelect: false});
        UpdateContext({varIsDelegateSelected: false});
        UpdateContext({isExpReportDirty : false});
        Concurrent(
        Set(
            varIsCreateReport,
            false
        ),
        Set(
            varSelectedTab,
            3
        ),
        Set(
            varSelectedReport,
            Blank()
        )
        );
        Concurrent(
        Refresh('Expense reports (mserp)_1'),
        Refresh('DimAttributeTrvTravelTxtEntity (mserp)'),
        Refresh('Travel locations (mserp)'),
        Refresh('@DEEX:DEEX_20316 (mserp)')
        );
        If(
            IsEmpty(collApprovedFilterOptions),
            ClearCollect(
                collApprovedFilterOptions,
                {
                    number: 1,
                    title: GlobalLabels.Labels.'15062:LocalizedName,msdyn_FilterOneWeekLabel'  
                },
                {
                    number: 2,
                    title: GlobalLabels.Labels.'15062:LocalizedName,msdyn_FilterOneMonthLabel'  
                },
                {
                    number: 3,
                    title: GlobalLabels.Labels.'15062:LocalizedName,msdyn_FilterSixMonthsLabel'
                },
                {
                    number: 4,
                    title: GlobalLabels.Labels.'15062:LocalizedName,msdyn_FilterOneYearLabel'
                }
            )
        );
        Clear(colAttachedExpensesForReport);
        Clear(colAttachedExpenses);
        Reset(scr16_Reports_1);
        Reset(scr16_txt_SearchBox);

    Children:
      - scr16_btn_Delegate:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            BorderStyle: =BorderStyle.None
            Color: =If(varIsDelegateSelected, RGBA(255, 255, 255, 1),RGBA(64, 64, 64, 1))
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =If(varIsDelegateSelected, RGBA(34, 102, 227, 1),scr16_btn_FakeButton.Fill)
            Font: =Font.'Open Sans'
            Height: =44
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =Self.Color
            HoverFill: =Self.Fill
            OnSelect: |-
              =UpdateContext({varIsDelegateSelected: !varIsDelegateSelected});
              UpdateContext({varcntShowFilter: false})
            PressedBorderColor: =Self.Fill
            PressedFill: =Self.Fill
            RadiusBottomLeft: =50
            RadiusBottomRight: =50
            RadiusTopLeft: =50
            RadiusTopRight: =50
            Size: =13.5
            Text: ="Delegate"
            Visible: |-
              =CountRows(
                  Filter(
                      '@DEEX:DEEX_20316 (mserp)',
                      DelegatedUserInfoRecId = userRecord.CreatingWorker &&
                      'Start date' <= Today() &&
                      'End date' >= Today() 
                  )
              ) > 0
            Width: =103
            X: =40
            Y: =scr16_btn_FakeButton.Y
      - emptyStateComponent_4:
          Control: CanvasComponent
          ComponentName: emptyStateComponent
          Properties:
            Height: |
              =350
            Visible: =scr16_Reports_1.AllItemsCount <= 0
            Width: =Self.Height
            X: |
              =(Parent.Width - Self.Width)/2
            Y: |
              =scr16_Reports_1.Y + (Parent.Height - scr16_hdr_TopHeader.Height - scr16_cmp_Footer_1.Height - Self.Height)/2 - scr16_lbl_DummyLabel.Height
            subTitle: |-
              =Switch(
                  varcntSelectedStatus,
                  1,
                  GlobalLabels.Labels.'15062:LocalizedName,msdyn_CreateReportToGetPaidLabel',
                  2,
                  GlobalLabels.Labels.'15062:LocalizedName,msdyn_SubmitReportToGetPaidLabel',
                  3,
                  GlobalLabels.Labels.'15062:LocalizedName,msdyn_CreateAndSubmitReportToGetPaidLabel',
                  4,
                  "No rejected reports"
              )
            title: =GlobalLabels.Labels.'15062:LocalizedName,msdyn_NothingHereYetLabel'
      - scr16_Reports_1:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
          Properties:
            AccessibleLabel: |-
              =Switch(
                  varcntSelectedStatus,
                  1,
                  "List of draft reports",
                  2,
                  "List of submitted reports",
                  3,
                  "List of approved reports",
                  4,
                  "List of rejected reports"
              )
            BorderColor: =RGBA(0, 18, 107, 1)
            Default: ={}
            Height: |-
              =Min(
                  scr16_cmp_Footer_1.Y - Self.Y,
                  Self.TemplateHeight * CountRows(Self.AllItems)
              )
            Items: |-
              =SortByColumns(
                  Filter(
                      Switch(
                          varcntSelectedStatus,
                          1,
                          Filter(
                              'Expense reports (mserp)_1',
                              'Document Status' = 'Document Status (mserp)'.Draft
                          ),
                          2,
                          Filter(
                              'Expense reports (mserp)_1',
                              'Document Status' = 'Document Status (mserp)'.Submitted
                          ),
                          3,
                          Search(
                              Switch(
                                  scr16_btn_DateFilter.Selected.number,
                                  1,
                                  Filter(
                                      'Expense reports (mserp)_1',
                                      'Document Status' = 'Document Status (mserp)'.Approved && DateAdd(DateValue(CreatedDate), 7, TimeUnit.Days) >= Today()
                                  ),
                                  2,
                                  Filter(
                                      'Expense reports (mserp)_1',
                                      'Document Status' = 'Document Status (mserp)'.Approved && DateAdd(DateValue(CreatedDate), 30, TimeUnit.Days) >= Today()
                                  ),
                                  3,
                                  Filter(
                                      'Expense reports (mserp)_1',
                                      'Document Status' = 'Document Status (mserp)'.Approved && DateAdd(DateValue(CreatedDate), 180, TimeUnit.Days) >= Today()
                                  ),
                                  4,
                                  Filter(
                                      'Expense reports (mserp)_1',
                                      'Document Status' = 'Document Status (mserp)'.Approved && DateAdd(DateValue(CreatedDate), 365, TimeUnit.Days) >= Today()
                                  ),
                                  Filter(
                                      'Expense reports (mserp)_1',
                                      'Document Status' = 'Document Status (mserp)'.Approved
                                  )
                              ),
                              scr16_txt_SearchBox.Text,
                              'Purpose (mserp_purpose)'
                          ),
                          4,
                          Filter(
                              'Expense reports (mserp)_1',
                              'Document Status' = 'Document Status (mserp)'.Rejected
                          )
                      ),
                      Upper(DEEXLegalEntity_DataArea) = Upper(varSelectedLegalEntity),
                      If(
                          varIsDelegateSelected,
                          'Employee (mserp_creatingworker)' in 
                              Distinct(
                                  Filter(
                                      '@DEEX:DEEX_20316 (mserp)',
                                      DelegatedUserInfoRecId = userRecord.CreatingWorker &&
                                      'Start date' <= Today() &&
                                      'End date' >= Today() 
                                  ),
                                  Employee
                              ),
                          'Employee (mserp_creatingworker)' = userRecord.CreatingWorker
                      )
                  ), 
                  "mserp_createddate", SortOrder.Descending
              )
            OnSelect: |-
              =UpdateContext({varcntShowFilter:false});
              // ⚠️ LookUp from original data source FIRST to ensure field name compatibility
              Set(
                  varSelectedReport,
                  LookUp('Expense reports (mserp)','Expense report number' = ThisItem.'Expense report number' && LegalEntity_DataArea = varSelectedLegalEntity)
              );
              // ✅ Use varSelectedReport.'Document Status' from original data source for type consistency
              Set(
                  varSelectedReportStatusItem,
                  varSelectedReport.'Document Status'
              );
              // ✅ Reset varSelectedTravelReq when selecting a report from list (not from Travel Requisition)
              Set(varSelectedTravelReq, Blank());
              Clear(colAttachedExpensesForReport);
              ForAll(
                  Split(varSelectedReport.ExpTransNumber, ",") As attachedExpenses,
                  Collect(
                      colAttachedExpensesForReport,
                      LookUp('Expense lines (mserp)','Expense transaction number (mserp_exptransnumber)' = attachedExpenses[@Value] && 'Expense line type' <> 'Expense line type (mserp)'.'Itemized line')
                  )
              );
              ClearCollect(
                  colAttachedExpenses,
                  colAttachedExpensesForReport
              );

              If(
                  varSelectedReportStatusItem in dsDrafts,
                  Navigate('Reports - Edit Screen'),
                  Navigate('Reports - View Only Screen');
              )
            TemplateSize: =150
            Width: =Parent.Width
            Y: |-
              =Switch(
                  varcntSelectedStatus,
                  1,
                  If(
                      varCntSelect,
                      scr16_hdr_TopHeader.Height + scr16_shp_Rectangle_1.Height + scr16_shp_Rectangle_1.Height,
                      scr16_hdr_TopHeader.Height + scr16_shp_Rectangle_1.Height
                  ),
                  3,
                  scr16_hdr_TopHeader.Height + scr16_shp_Rectangle_1.Height + scr16_txt_SearchBox.Height + 3,
                  scr16_hdr_TopHeader.Height + scr16_shp_Rectangle_1.Height
              )
          Children:
            - Container11_1:
                Control: GroupContainer@1.4.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Height: =150
                  LayoutDirection: =LayoutDirection.Vertical
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width
                Children:
                  - Container6_1:
                      Control: GroupContainer@1.4.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Height: =Parent.Height - scr01_shp_GalleryBaseSeparator_1.Height
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =Parent.Width
                      Children:
                        - shpBorder_4:
                            Control: Rectangle@2.3.0
                            Properties:
                              BorderColor: =RGBA(0, 18, 107, 1)
                              Fill: =Color.Transparent
                              Height: =Parent.Height
                              LayoutMaxHeight: =
                              LayoutMaxWidth: =
                              Width: =10
                        - scr16_chk_Select_2:
                            Control: Classic/CheckBox@2.1.0
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              BorderColor: =RGBA(0, 18, 107, 1)
                              BorderStyle: =BorderStyle.None
                              CheckboxBackgroundFill: =If(Self.Value, RGBA(34, 102, 227, 1),Color.White)
                              CheckboxBorderColor: =RGBA(34, 102, 227, 1)
                              CheckboxSize: =42
                              CheckmarkFill: =Color.White
                              Color: =RGBA(34, 102, 227, 1)
                              Default: |
                                =!IsEmpty(Filter(colSelectedReportIds,reportNumber = ThisItem.'Expense report number'))
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Lighter
                              Height: =35
                              HoverColor: =RGBA(0, 18, 107, 1)
                              LayoutMaxHeight: =
                              LayoutMaxWidth: =
                              OnCheck: |-
                                =Collect(colSelectedReportIds, {reportNumber : ThisItem.'Expense report number'})
                              OnSelect: =Select(scr16_shp_SelectRegion_4)
                              OnUncheck: =RemoveIf(colSelectedReportIds, reportNumber = ThisItem.'Expense report number')
                              Reset: =varCntSelect Or scr01_chk_SelectAll.Value
                              Text: |-
                                =If(
                                    ThisItem.'Purpose (mserp_purpose)' <> "" || !IsBlank(ThisItem.'Purpose (mserp_purpose)'),
                                    Concatenate("Report bearing title ", ThisItem.'Purpose (mserp_purpose)', If(Self.Value, " selected", " unselected")),
                                    Concatenate("Report bearing amount ", Concatenate(Text(Value(ThisItem.Amount),"#,#0.00", varDefaultLanguage), " ", varDefaultCurrency), If(Self.Value, " selected", " unselected"))
                                )
                              VerticalAlign: =VerticalAlign.Bottom
                              Visible: =varCntSelect
                              Width: =43
                              X: =18
                              Y: =40
                        - Container7_1:
                            Control: GroupContainer@1.4.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutJustifyContent: =LayoutJustifyContent.Center
                              LayoutMaxHeight: =
                              LayoutMaxWidth: =
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                            Children:
                              - Label5_2:
                                  Control: Label@2.5.1
                                  Properties:
                                    AutoHeight: =true
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    Font: =Font.'Segoe UI'
                                    LayoutMaxHeight: =
                                    LayoutMaxWidth: =
                                    OnSelect: =Select(scr16_shp_SelectRegion_4)
                                    PaddingLeft: =15
                                    PaddingRight: =0
                                    TabIndex: =If(IsBlank(Self.Text), -1, 0)
                                    Text: =ThisItem.'Purpose (mserp_purpose)'
                                    Width: =Parent.Width
                              - Label6_2:
                                  Control: Label@2.5.1
                                  Properties:
                                    AutoHeight: =true
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    Color: |
                                      =If(
                                          ThisItem.'Document Status' = 'Document Status (mserp)'.Rejected,
                                          RGBA(165, 33, 33, 1),
                                          RGBA(102, 102, 102, 1)
                                      )
                                    Font: =Font.'Segoe UI'
                                    LayoutMaxHeight: =
                                    LayoutMaxWidth: =
                                    OnSelect: =Select(scr16_shp_SelectRegion_4)
                                    PaddingLeft: =15
                                    PaddingRight: =0
                                    TabIndex: =If(IsBlank(Self.Text), -1, 0)
                                    Text: |-
                                      =If(
                                          ThisItem.'Document Status' = 'Document Status (mserp)'.Rejected,
                                          GlobalLabels.Labels.'15062:LocalizedName,msdyn_ReportRejectedLabel',
                                          ThisItem.Description
                                      )
                                    Width: =Parent.Width
                        - Container9_1:
                            Control: GroupContainer@1.4.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutJustifyContent: =LayoutJustifyContent.Center
                              LayoutMaxHeight: =
                              LayoutMaxWidth: =
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Width: =200
                            Children:
                              - Label5_3:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =Align.Center
                                    AutoHeight: =true
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Bold
                                    LayoutMaxHeight: =
                                    LayoutMaxWidth: =
                                    OnSelect: =Select(scr16_shp_SelectRegion_4)
                                    TabIndex: =If(IsBlank(Self.Text), -1, 0)
                                    Text: =Concatenate(Text(Value(ThisItem.'Amount (mserp_amounttotal)'),"#,#0.00", varDefaultLanguage), " ", varDefaultCurrency)
                                    Width: =Parent.Width
                              - Label6_3:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =Align.Center
                                    AutoHeight: =true
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    Font: =Font.'Segoe UI'
                                    LayoutMaxHeight: =
                                    LayoutMaxWidth: =
                                    OnSelect: =Select(scr16_shp_SelectRegion_4)
                                    TabIndex: =If(IsBlank(Self.Text), -1, 0)
                                    Text: |-
                                      =Text(
                                          DateValue(ThisItem.CreatedDate),
                                          "mmm dd, yyyy"
                                      )
                                    Width: =Parent.Width
                        - Icon3_1:
                            Control: Classic/Icon@2.5.0
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              BorderColor: =RGBA(0, 18, 107, 1)
                              Color: =RGBA(110, 110, 110, 1)
                              Icon: =Icon.ChevronRight
                              LayoutMaxHeight: =
                              LayoutMaxWidth: =
                              OnSelect: =Select(scr16_shp_SelectRegion_RightIcon_1);
                              PaddingBottom: =15
                              PaddingTop: =15
                              Visible: =varCntSelect
                  - scr01_shp_GalleryBaseSeparator_1:
                      Control: Rectangle@2.3.0
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Fill: =RGBA(225, 225, 225, 1)
                        Height: =1
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        LayoutMinHeight: =1
                        Width: =Parent.Width - 10
            - scr16_shp_SelectRegion_RightIcon_1:
                Control: Rectangle@2.3.0
                Properties:
                  AccessibleLabel: ="Select expense"
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Fill: =RGBA(0, 0, 0, 0)
                  FocusedBorderThickness: =0
                  Height: =Parent.TemplateHeight
                  OnSelect: =Select(Parent)
                  TabIndex: =0
                  Visible: =varCntSelect
                  Width: =Parent.Width - Self.X
                  X: =scr16_shp_SelectRegion_4.Width
            - scr16_shp_SelectRegion_4:
                Control: Rectangle@2.3.0
                Properties:
                  AccessibleLabel: ="Select expense"
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Fill: =RGBA(0, 0, 0, 0)
                  FocusedBorderThickness: =0
                  Height: =Parent.TemplateHeight
                  OnSelect: |-
                    =If(
                        varCntSelect,
                        If(
                            IsBlank(LookUp(colSelectedReportIds, reportNumber = ThisItem.'Expense report number')) && Text(ThisItem.'Document Status') <> "Rejected",
                            Collect(colSelectedReportIds, {reportNumber : ThisItem.'Expense report number'}),
                            RemoveIf(colSelectedReportIds, reportNumber = ThisItem.'Expense report number')
                        ),
                        Select(Parent)
                    )
                  TabIndex: =0
                  Width: =Container9_1.X + Container9_1.Width
      - scr16_lbl_DummyLabel:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =scr16_txt_SearchBox.Fill
            Font: =Font.'Open Sans'
            Height: =scr16_txt_SearchBox.Height
            Text: =""
            Visible: =varcntSelectedStatus = 3
            Width: =Parent.Width
            Y: =scr16_txt_SearchBox.Y
      - scr16_cmp_Footer_1:
          Control: CanvasComponent
          ComponentName: cmp_Footer_5
          Properties:
            ApprovalsAccessibleLabel: ="Text"
            ApprovalsText: |-
              =If(
                  varAppMode = "CashAdvance",
                  "Cash Request",
                  If(
                      varAppMode = "AirfareAllowance",
                      "Submit Reports",
                      GlobalLabels.Labels.'15062:LocalizedName,msdyn_ApprovalsLabel'
                  )
              )
            DisplayMode: =!IsBlank(varSelectedLegalEntity)
            ExpenseAccessibleLabel: ="Text"
            ExpensesText: |-
              =//GlobalLabels.Labels.'15062:LocalizedName,msdyn_ExpensesLabel'
              "Add Expenses"
            Fill: =RGBA(248, 248, 248, 0.94)
            Height: =84
            OnApprovalsButtonClick: |-
              =If(
                  varAppMode = "CashAdvance",
                  Set(varSelectedTab, 4);
                  Navigate('Cash Advance - List Screen', ScreenTransition.Fade),
                  If(
                      varAppMode = "AirfareAllowance",
                      Set(varSelectedTab, 4);
                      Navigate('Travel - List Screen', ScreenTransition.Fade),
                      UpdateContext({varcntShowFilter : false});
                      Set(varSelectedTab, 4); Navigate('Approvals - List Screen', ScreenTransition.Fade, {varFiltersApplied:false, varSelectedProjects:Blank(), varSelectedUsers: Blank(), varcntSelectedStatus:1});
                      Reset(scr25_cmb_Project);
                      Reset(scr25_cmb_User)
                  )
              )
            OnExpensesButtonClick: |-
              =UpdateContext({varcntShowFilter : false});
              Set(varSelectedTab, 2); Navigate('Expenses - List Screen',ScreenTransition.Fade)
            OnReceiptsButtonClick: ="Text"
            OnReportsButtonClick: |
              =UpdateContext({varcntShowFilter : false});
              Set(varSelectedTab, 3); 
              Navigate('Reports - List Screen', ScreenTransition.Fade ,{varcntSelectedStatus:1})
            ReceiptAccessibleLabel: =
            ReceiptText: ="Text"
            ReportAccessibleLabel: ="Text"
            ReportText: |
              =//GlobalLabels.Labels.'15062:LocalizedName,msdyn_ExpenseReportsLabel'
              If(
                  varAppMode = "AirfareAllowance",
                  "View Reports",
                  "Submit Reports"
              )
            SelectedTab: =3
            Visible: =!varCntSelect
            Width: =Max(App.Width, App.MinScreenWidth)
            Y: =App.Height - Self.Height
            paramInDefaultAppMode: =varAppMode
            paramInDefaultSelectedTab: =3
      - scr16_shp_Rectangle:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =Color.White
            Height: =105
            OnSelect: =UpdateContext({varcntShowFilter:false});
            Width: =Parent.Width
            Y: =scr16_hdr_TopHeader.Height-2
      - scr16_btn_FakeButton:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            DisplayMode: =DisplayMode.View
            Fill: =RGBA(241, 241, 241, 1)
            Font: =Font.'Open Sans'
            Height: =44
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            RadiusBottomLeft: =50
            RadiusBottomRight: =50
            RadiusTopLeft: =50
            RadiusTopRight: =50
            TabIndex: =-1
            Text: =""
            Visible: =false
            Width: =478
            X: =(Parent.Width - Self.Width)/2
            Y: =scr16_rct_seprator.Y - scr16_shp_Rectangle.Y
      - scr16_btn_Draft:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            BorderStyle: =BorderStyle.None
            Color: =If(varcntSelectedStatus=1, RGBA(255, 255, 255, 1),RGBA(64, 64, 64, 1))
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =If(varcntSelectedStatus=1, RGBA(34, 102, 227, 1),scr16_btn_FakeButton.Fill)
            Font: =Font.'Open Sans'
            Height: =44
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =Self.Color
            HoverFill: =Self.Fill
            OnSelect: =UpdateContext({varcntSelectedStatus:1});UpdateContext({varcntShowFilter:false});
            PressedBorderColor: =Self.Fill
            PressedFill: =Self.Fill
            RadiusBottomLeft: =50
            RadiusBottomRight: =50
            RadiusTopLeft: =50
            RadiusTopRight: =50
            Size: =13.5
            Text: =GlobalLabels.Labels.'15062:LocalizedName,msdyn_DraftStatusLabel'
            Width: =103
            X: =scr16_btn_FakeButton.X
            Y: =scr16_btn_FakeButton.Y
      - scr16_btn_Submitted:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            BorderStyle: =BorderStyle.None
            Color: =If(varcntSelectedStatus=2, RGBA(255, 255, 255, 1),RGBA(64, 64, 64, 1))
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =If(varcntSelectedStatus=2, RGBA(34, 102, 227, 1),scr16_btn_FakeButton.Fill)
            Font: =Font.'Open Sans'
            Height: =44
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =Self.Color
            HoverFill: =Self.Fill
            OnSelect: |-
              =UpdateContext({varcntSelectedStatus:2});
              UpdateContext({varCntSelect:false});
              UpdateContext({varcntShowFilter:false});
              Clear(colSelectedReportIds);
            PressedBorderColor: =Self.Fill
            PressedFill: =Self.Fill
            RadiusBottomLeft: =50
            RadiusBottomRight: =50
            RadiusTopLeft: =50
            RadiusTopRight: =50
            Size: =13.5
            Text: ="Submitted"
            Width: =103
            X: =scr16_btn_Draft.X + scr16_btn_Draft.Width + 22
            Y: =scr16_btn_FakeButton.Y
      - scr16_btn_Approve:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            BorderStyle: =BorderStyle.None
            Color: =If(varcntSelectedStatus=3, RGBA(255, 255, 255, 1),RGBA(64, 64, 64, 1))
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =If(varcntSelectedStatus=3, RGBA(34, 102, 227, 1),scr16_btn_FakeButton.Fill)
            Font: =Font.'Open Sans'
            Height: =44
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =Self.Color
            HoverFill: =Self.Fill
            OnSelect: |-
              =UpdateContext({varcntSelectedStatus:3});
              UpdateContext({varCntSelect:false});
              Clear(colSelectedReportIds);
              Reset(scr16_btn_DateFilter);
              Reset(scr16_txt_SearchBox);
