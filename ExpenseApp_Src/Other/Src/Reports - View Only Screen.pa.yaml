                  - scr20_glr_AttachedExpenses_1:
                      Control: Gallery@2.15.0
                      Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver4.0
                      Properties:
                        AccessibleLabel: ="List of attached expenses"
                        AlignInContainer: =AlignInContainer.SetByContainer
                        BorderColor: =RGBA(0, 18, 107, 1)
                        DelayItemLoading: =false
                        Fill: =Color.White
                        Height: =Min((Self.TemplateHeight) * CountRows(Self.AllItems), 'Totals Buttons - In Review'.Y - Self.Y)
                        Items: =colAttachedExpensesForReport
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        LoadingSpinner: =LoadingSpinner.None
                        OnSelect: |
                          =
                          Concurrent(
                              Set(
                                  varIsCreate,
                                  false
                              ),
                              Set(
                                  varReceiptImage,  //set as receiptUrl of attached expense
                                  Blank()
                              )
                          );
                          Set(
                              varSelectedExpenseDoc,
                              LookUp('DCSL Expense Line Expense Moblie Entity (mserp)', 'Expense transaction number (mserp_exptransnumber)' = ThisItem.'Expense transaction number (mserp_exptransnumber)')
                          );
                          Set(
                              varReceiptImage,
                              LookUp('Expense Mobile Attached Document Entity (mserp)', EntRecId = Value(varSelectedExpenseDoc.AttachedReceiptId),CapturedDocument)
                          );
                          Set(
                              varFileFormat,
                              LookUp('Expense Mobile Attached Document Entity (mserp)', EntRecId = Value(varSelectedExpenseDoc.AttachedReceiptId), FileExtension)
                          );
                          Set(varExpenseAgainstWorkItem, Blank());
                          Set(
                              varSelectedReceiptNumber,
                              Blank()
                          );
                          Set(
                              varExpenseAgainstWorkItem,
                              Blank()
                          );
                          If(
                              varSelectedExpenseDoc.PolicyViolationCount,
                              ClearCollect(
                                  colPolViolations,
                                  Split(varSelectedExpenseDoc.PolicyViolationErrorMessage, "~|~")
                              );
                              UpdateContext({varMaxViolationLevel : varSelectedExpenseDoc.PolicyViolationsLevel});
                              UpdateContext({varNumViolation : varSelectedExpenseDoc.PolicyViolationCount}),
                              Clear(colPolViolations);
                              UpdateContext({varMaxViolationLevel : 0});
                              UpdateContext({varNumViolation : 0})
                          );
                          Navigate('Expenses - View Only Screen', ScreenTransition.None, {varNavigatedFrom : "scr20", varMaxViolationLevel : varMaxViolationLevel, varNumViolation : varNumViolation})
                        TemplateSize: =112
