                        PressedFill: =Self.Color
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Size: =19.15
                        Text: =GlobalLabels.Labels.'15062:LocalizedName,msdyn_DoneButtonLabel'
                        Width: |
                          =Parent.Width -  Self.X*2
                        X: |
                          =40
                        Y: =scr20_btn_WithdrawReport_1.Y + scr20_btn_WithdrawReport_1.Height + 20
                  - scr20_btn_WithdrawReport_1:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =RGBA(195, 39, 39, 1)
                        Color: |
                          =RGBA(195, 39, 39, 1)
                        DisabledBorderColor: =RGBA(166, 166, 166, 1)
                        Fill: =RGBA(255, 255, 255, 1)
                        Font: =Font.'Segoe UI'
                        Height: =76
                        HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                        HoverColor: =RGBA(255, 255, 255, 1)
                        HoverFill: =ColorFade(Self.Color, 20%)
                        OnSelect: |
                          =Set(
                              gblNavigationDrawerVisibility,
                              false
                          );
                          IfError(
                              Patch(
                                  'DCSL Expense Moblie Report (mserp)',
                                  LookUp('DCSL Expense Moblie Report (mserp)', 'Expense report number' = varSelectedReport.'Expense report number'),
                                  {
                                      //WorkflowAction: "Recall",
                                      'Document Status': 'Document Status (mserp)'.Draft
                                  }
                              ),
                              First( ClearCollect( varError, Substitute( Match(FirstError.Details.HttpResponse, """message"":""([^""]*)""").FullMatch, """message"":", "" ) ) )
                          );
                          If(
                              CountRows(varError) > 0,
                              Notify(
                                  Substitute(First(varError).Value, """", ""),
                                  NotificationType.Error,
                                  gblParams.notificationTime
                              ),
                              Notify(
                                  GlobalLabels.Labels.'15062:LocalizedName,msdyn_ExpenseReportRecalledSuccessfullyLabel', 
                                  NotificationType.Success, 
                                  gblParams.notificationTime
                              );
                              Navigate('Reports - List Screen')
                          );
                          Clear(varError)
                        PressedBorderColor: =Self.Fill
                        PressedColor: =Self.Fill
                        PressedFill: =Self.Color
                        Size: =19.15
                        Text: =GlobalLabels.Labels.'15062:LocalizedName,msdyn_WithdrawLabel'
                        Visible: |-
                          =//!(varSelectedReport.'Document Status' in dsApproved)

                          //!(varSelectedReport.'Document Status' in dsApproved) && !(varSelectedReport.'Document Status' in dsInReview)
                          (varSelectedReport.'Document Status' = 'Document Status (mserp)'.Rejected && varSelectedReport.'Document status' = 'Document status (mserp)'.Draft) ||
                          (varSelectedReport.'Document Status' = 'Document Status (mserp)'.Approved && varSelectedReport.'Document status' = 'Document status (mserp)'.Rejected)
                        Width: |
                          =Parent.Width -  Self.X*2
                        X: =scr20_btn_Done_1.X
                        Y: =20
