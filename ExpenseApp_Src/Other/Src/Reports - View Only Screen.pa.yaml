Screens:
  Reports - View Only Screen:
    Properties:
      Fill: =RGBA(229, 229, 229, 1)
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |-
        =UpdateContext(
                    {
                        locReimaginedfeatureEnabled: (userRecord.IsReimaginedUIEnabled = 'NoYes (mserp)'.Yes)
                    }
                );
                If(
                    locReimaginedfeatureEnabled, 
                    If(
                        CountRows(gblExpenseReportFieldVisibilityReImaginedLookup) <= 0,
                        ClearCollect(
                            gblExpenseReportFieldVisibilityReImaginedLookup, 
                            Filter(
                                'Expense mobile report field visibility (mserp)', 
                                LegalEntityId = varSelectedLegalEntity && 
                                VisibilityType <> 'ExpenseFieldVisibilityType (mserp)'.'Do not display'
                            )
                        )
                    ),
                    If(
                        CountRows(gblExpenseReportFieldVisibilityLookup) <= 0,
                        ClearCollect(
                            gblExpenseReportFieldVisibilityLookup, 
                            Filter(
                                '@ExpenseManagement:TrvExpMobileReportAdminCustomFieldsEntity (mserp)',
                                LegalEntityId = varSelectedLegalEntity && 
                                Visibility <> 'Visibility (mserp)'.'Do not display'
                            )
                        )
                    )
                );
    Children:
      - Totals Buttons - In Review:
