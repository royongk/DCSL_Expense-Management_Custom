Screens:
  Travel - List Screen:
    Properties:
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |-
        =// 1. AppMode에 따른 Expense Type 정의 및 매핑
        Set(
            varTargetExpenseType,
            Switch(
                varAppMode,
                "AirfareAllowance", "Allowance",
                "BillingTripSettlement", "Billing Trip Settlement",
                "CashAdvance", "Cash Advance",
                "EmployeeBenefit", "Employee Benefit",
                "SalaryAdvance", "Salary Advance",
                "ExpenseReport", "Expense Reimbursement", 
                Blank()
            )
        );

        ClearCollect(
            colMappedCategories,
            Filter(
                'DCSL Expense Category Mapping Setup Entity (mserp)',
                'Expense Type' = varTargetExpenseType
            )
        );

        // 2. 글로벌 파라미터 세팅 (Expenses 화면과 동일)
        Set(
            gblParams,
            {
                dropDownHeight : 60,
                dorpDownBorderThickness : 2,
                dropDownBorderColor : RGBA(34, 102, 227, 1),
                dropDownLabelColor : Color.Black,
                dropDownHoverFill : RGBA(204, 222, 255, 1),
                errorMessageSize : 18,
                dropDownFontSize : 24,
                expenseDataCardViewOnly: RGBA(110, 110, 110, 1),
                notificationTime : 4000
            }
        );

        // 3. User 및 대리인 권한 조회 로직 동기화
        Set(varDefaultSalesTaxGroup, Blank());
        Set(varItemSalesTaxDefaultValue, Blank());
        Set(varSelectedExpenseDoc, Blank());

        Set(
            varDefaultSalesTaxGroupUserContext,
            userRecord.WorkerDefaultTaxGroup
        );

        Refresh('Expense management parameters (mserp)');

        Set(
            varCurrentD365User,
            LookUp('Expense mobile master data (mserp)', Email = User().Email)
        );

        ClearCollect(
            colActiveDelegations,
            Filter(
                '@DEEX:DEEX_20316 (mserp)',
                Delegate = varCurrentD365User.ID && 
                'Start date' <= Today() &&
                'End date' >= Today()
            )
        );

        // 4. 기존 Travel - List Screen 전용 로직
        UpdateContext({varCntSelect: false});
        UpdateContext({varcntSelectedStatus: 1});
        Refresh('Travel requisition (mserp)');
        Set(varSelectedTravelReq, Blank());
        Reset(scrTravel_Gallery);
    Children:
      - emptyStateComponent_Travel:
          Control: CanvasComponent
          ComponentName: emptyStateComponent
          Properties:
            Height: |
              =350
            Visible: =scrTravel_Gallery.AllItemsCount <= 0
            Width: =Self.Height
            X: |
              =(Parent.Width - Self.Width)/2
            Y: |
              =scrTravel_Gallery.Y + (Parent.Height - scrTravel_hdr_TopHeader.Height - scrTravel_cmp_Footer_1.Height - Self.Height)/2
            subTitle: ="No approved travel requisitions available"
            title: =GlobalLabels.Labels.'15062:LocalizedName,msdyn_NothingHereYetLabel'
      - scrTravel_Gallery:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
          Properties:
            AccessibleLabel: ="List of approved travel requisitions"
            BorderColor: =RGBA(0, 18, 107, 1)
            Default: ={}
            Height: |-
              =Min(
                  scrTravel_cmp_Footer_1.Y - Self.Y,
                  Self.TemplateHeight * CountRows(Self.AllItems)
              )
            Items: "=SortByColumns(\n    Switch(\n        varcntSelectedStatus,\n        \n        // Case 1: Open 상태만 조회\n        1, \n        Filter(\n            'Travel requisition (mserp)',\n            'Approval status' = 'Approval status (mserp)'.Approved,\n            ReferenceDataAreaId = Upper(varSelectedLegalEntity),\n            Employee = userRecord.CreatingWorker,\n            'Reconciliation status' = 'Reconciliation status (mserp)'.Open\n        ),\n\n        // Case 2: Closed 상태만 조회\n        2,\n        Filter(\n            'Travel requisition (mserp)',\n            'Approval status' = 'Approval status (mserp)'.Approved,\n            ReferenceDataAreaId = Upper(varSelectedLegalEntity),\n            Employee = userRecord.CreatingWorker,\n            'Reconciliation status' = 'Reconciliation status (mserp)'.Closed\n        ),\n        \n        // Case 3: 대리인(위임자)의 문서 조회 (신규 추가)\n        3,\n        Filter(\n            'Travel requisition (mserp)',\n            ReferenceDataAreaId = Upper(varSelectedLegalEntity),\n            // 본인이 아닌, 대리 위임 컬렉션에 포함된 사용자의 문서를 조회\n            Employee in colActiveDelegations.Employee\n        ),\n\n        // Default: 전체 조회\n        Filter(\n            'Travel requisition (mserp)',\n            'Approval status' = 'Approval status (mserp)'.Approved,\n            ReferenceDataAreaId = Upper(varSelectedLegalEntity),\n            Employee = userRecord.CreatingWorker\n        )\n    ),\n    \"mserp_requisitiondate\",\n    SortOrder.Descending\n)"
            OnSelect: |-
              =Set(
                  varSelectedTravelReq,
                  ThisItem
              );
              If(
                  Value(ThisItem.'Amount to reconcile') = 0,
                  Notify(
                      "This Travel requirement number cannot register an Expense Report because the Remaining Amount is 0 KRW.",
                      NotificationType.Error,
                      gblParams.notificationTime
                  ),
                  Set(
                      varSelectedReportStatusItem,
                      'Document Status (mserp)'.Draft
                  );
                  Set(
                      varSelectedReport,
                      Blank()
                  );
                  Set(
                      varIsCreateReport, 
                      true
                  );
                  Concurrent(
                      Clear(colAttachedExpenses),
                      Clear(colAttachedExpensesForReport),
                      ClearCollect(
                          colReportPost,
                          {
                              fieldName: "DataArea",
                              fieldValue: Text(varSelectedLegalEntity),
                              fieldType: "String"     
                          },
                          {
                              fieldName: "Company",
                              fieldValue: Lower(Text(varSelectedLegalEntity)),
                              fieldType: "String"
                          },
                          {
                              fieldName: "LegalEntityForExpenses",
                              fieldValue: Lower(Text(varSelectedLegalEntity)),
                              fieldType: "String"
                          }
                      )
                  );
                  Navigate('Reports - Edit Screen', ScreenTransition.Fade)
              )
            TemplateSize: =150
            Width: =Parent.Width
            Y: =scr16_rct_seprator_1.Y + scr16_rct_seprator_1.Height
          Children:
            - Container11_Travel:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Height: =150
                  LayoutDirection: =LayoutDirection.Vertical
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width
                Children:
                  - Container6_Travel:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Height: =Parent.Height - scrTravel_shp_GalleryBaseSeparator_1.Height
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =Parent.Width
                      Children:
                        - shpBorder_Travel:
                            Control: Rectangle@2.3.0
                            Properties:
                              BorderColor: =RGBA(0, 18, 107, 1)
                              Fill: =Color.Transparent
                              Height: =Parent.Height
                              LayoutMaxHeight: =
                              LayoutMaxWidth: =
                              Width: =10
                        - Container7_Travel:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutJustifyContent: =LayoutJustifyContent.Center
                              LayoutMaxHeight: =
                              LayoutMaxWidth: =
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                            Children:
                              - Label5_TravelReqNumber:
                                  Control: Label@2.5.1
                                  Properties:
                                    AutoHeight: =true
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    Font: =Font.'Segoe UI'
                                    LayoutMaxHeight: =
                                    LayoutMaxWidth: =
                                    OnSelect: =Select(scrTravel_shp_SelectRegion)
                                    PaddingLeft: =15
                                    PaddingRight: =0
                                    TabIndex: =If(IsBlank(Self.Text), -1, 0)
                                    Text: =ThisItem.'Travel requisition number'
                                    Width: =Parent.Width
                              - Label6_BusinessPurpose:
                                  Control: Label@2.5.1
                                  Properties:
                                    AutoHeight: =true
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    Color: =RGBA(102, 102, 102, 1)
                                    Font: =Font.'Segoe UI'
                                    LayoutMaxHeight: =
                                    LayoutMaxWidth: =
                                    OnSelect: =Select(scrTravel_shp_SelectRegion)
                                    PaddingLeft: =15
                                    PaddingRight: =0
                                    TabIndex: =If(IsBlank(Self.Text), -1, 0)
                                    Text: =ThisItem.'Business purpose'
                                    Width: =Parent.Width
                        - Container9_Travel:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutJustifyContent: =LayoutJustifyContent.Center
                              LayoutMaxHeight: =
                              LayoutMaxWidth: =
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Width: =250
                            Children:
                              - lbl_TotalAmount_Title:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =Align.Center
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    Color: =RGBA(102, 102, 102, 1)
                                    Font: =Font.'Open Sans'
                                    Height: =30
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    Size: =13
                                    Text: ="Total Amount"
                                    Width: =Parent.Width
                              - Label5_Amount:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =Align.Center
                                    AutoHeight: =true
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Bold
                                    Height: =40
                                    LayoutMaxHeight: =
                                    LayoutMaxWidth: =
                                    OnSelect: =Select(scrTravel_shp_SelectRegion)
                                    Size: =18
                                    TabIndex: =If(IsBlank(Self.Text), -1, 0)
                                    Text: |-
                                      =Concatenate(
                                          Text(
                                              Value(
                                                  Substitute(Substitute(ThisItem.Amount, "KRW", ""), ",", "")
                                              ),
                                              "#,##0", 
                                              varDefaultLanguage
                                          ),
                                          " ",
                                          varDefaultCurrency
                                      )
                                    Width: =Parent.Width
                              - lbl_RemainingAmount_Title:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =Align.Center
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    Color: =RGBA(102, 102, 102, 1)
                                    Font: =Font.'Open Sans'
                                    Height: =30
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    Size: =13
                                    Text: ="Remaining Amount"
                                    Width: =Parent.Width
                              - Label6_RemainingAmount:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =Align.Center
                                    AutoHeight: =true
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    Font: =Font.'Segoe UI'
                                    Height: =40
                                    LayoutMaxHeight: =
                                    LayoutMaxWidth: =
                                    OnSelect: =Select(scrTravel_shp_SelectRegion)
                                    Size: =18
                                    TabIndex: =If(IsBlank(Self.Text), -1, 0)
                                    Text: =Concatenate(Text(Value(ThisItem.'Amount to reconcile'),"#,#0", varDefaultLanguage), " ", varDefaultCurrency)
                                    Width: =Parent.Width
                        - Icon3_Travel:
                            Control: Classic/Icon@2.5.0
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              BorderColor: =RGBA(0, 18, 107, 1)
                              Color: =RGBA(110, 110, 110, 1)
                              Icon: =Icon.ChevronRight
                              LayoutMaxHeight: =
                              LayoutMaxWidth: =
                              OnSelect: =Select(scrTravel_shp_SelectRegion);
                              PaddingBottom: =15
                              PaddingTop: =15
                              Visible: =false
                  - scrTravel_shp_GalleryBaseSeparator_1:
                      Control: Rectangle@2.3.0
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Fill: =RGBA(225, 225, 225, 1)
                        Height: =1
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        LayoutMinHeight: =1
                        Width: =Parent.Width - 10
            - scrTravel_shp_SelectRegion:
                Control: Rectangle@2.3.0
                Properties:
                  AccessibleLabel: ="Select travel requisition"
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Fill: =RGBA(0, 0, 0, 0)
                  FocusedBorderThickness: =0
                  Height: =Parent.TemplateHeight
                  OnSelect: =Select(Parent)
                  TabIndex: =0
                  Width: =Parent.Width
      - scrTravel_cmp_Footer_1:
          Control: CanvasComponent
          ComponentName: cmp_Footer_5
          Properties:
            ApprovalsAccessibleLabel: ="Text"
            ApprovalsText: |-
              =If(
                  varAppMode = "CashAdvance",
                  "Submit Cash",
                  If(
                      varAppMode = "AirfareAllowance",
                      "Submit Reports",
                      GlobalLabels.Labels.'15062:LocalizedName,msdyn_ApprovalsLabel'
                  )
              )
            DisplayMode: =!IsBlank(varSelectedLegalEntity)
            ExpenseAccessibleLabel: ="Text"
            ExpensesText: |-
              =//GlobalLabels.Labels.'15062:LocalizedName,msdyn_ExpensesLabel'
              "Add Expenses"
            Fill: =RGBA(248, 248, 248, 0.94)
            Height: =If(App.Width >= 1024, 120, 84)
            OnApprovalsButtonClick: |-
              =If(
                  varAppMode = "CashAdvance",
                  Set(varSelectedTab, 4);
                  Navigate('Cash Advance - List Screen', ScreenTransition.Fade),
                  If(
                      varAppMode = "AirfareAllowance",
                      Set(varSelectedTab, 4);
                      Navigate('Travel - List Screen', ScreenTransition.Fade),
                      Set(varSelectedTab, 4); Navigate('Approvals - List Screen', ScreenTransition.Fade, {varFiltersApplied:false, varSelectedProjects:Blank(), varSelectedUsers: Blank(), varcntSelectedStatus:1});
                      Reset(scr25_cmb_Project);
                      Reset(scr25_cmb_User)
                  )
              )
            OnExpensesButtonClick: =Set(varSelectedTab, 2); Navigate('Expenses - List Screen',ScreenTransition.Fade)
            OnReceiptsButtonClick: ="Text"
            OnReportsButtonClick: |-
              =Set(varSelectedTab, 3); 
              Navigate('Reports - List Screen', ScreenTransition.Fade ,{varcntSelectedStatus:0})
            ReceiptAccessibleLabel: =
            ReceiptText: ="Text"
            ReportAccessibleLabel: ="Text"
            ReportText: |-
              =//GlobalLabels.Labels.'15062:LocalizedName,msdyn_ExpenseReportsLabel'
              If(
                  varAppMode = "AirfareAllowance",
                  "View Reports",
                  "Submit Reports"
              )
            SelectedTab: =4
            Visible: =!varCntSelect
            Width: =Max(App.Width, App.MinScreenWidth)
            Y: =App.Height - Self.Height
            paramInDefaultAppMode: =varAppMode
            paramInDefaultSelectedTab: =4
      - scrTravel_hdr_TopHeader:
          Control: CanvasComponent
          ComponentName: main-app-header
          Properties:
            Fill: =Color.White
            Height: =85
            OnSelectButton: |-
              =Set(
                  gblNavigationDrawerVisibility,
                  true
              );
              Set(
                  gblScreenName,
                  'Travel - List Screen'
              );
              Refresh('Expense mobile notifications (mserp)');
              ClearCollect(
                  colExpenseNoticationInfo,
                  ForAll(
                      Filter('Expense mobile notifications (mserp)',NotifiedEmailId = User().Email) As ExpenseNotification,
                      {
                          RecId: ExpenseNotification.EntRecId,
                          ReadMessage: ExpenseNotification.Read
                      }
                  )
              );
            Width: =Max(App.Width, App.MinScreenWidth)
            firstIcon: =
            firstIconAccessibleLabel: =
            firstIconAction: =
            homeIcon: ="텍스트"
            homeIconAccessibleLabel: ="텍스트"
            homeIconAction: =Navigate('Main Screen', ScreenTransition.None);
            paramAvatar: =Coalesce(userImage, blankImage)
            paramTitle: ="Airfare Allowance"
            refreshIconAction: |-
              =Refresh('Travel requisition (mserp)');
              Reset(scrTravel_Gallery)
            secondIcon: =
            secondIconAccessibleLabel: =
            secondIconAction: =
            thirdIcon: =
            thirdIconAccessibleLabel: =
            thirdIconAction: =
      - scr16_shp_Rectangle_2:
