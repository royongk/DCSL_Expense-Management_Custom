          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =Color.White
            Height: =105 + lbl_InstructionMessage.Height
            OnSelect: =UpdateContext({varcntShowFilter:false});
            Width: =Parent.Width
