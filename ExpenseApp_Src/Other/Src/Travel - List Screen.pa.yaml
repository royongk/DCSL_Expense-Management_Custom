            Y: =lbl_InstructionMessage.Y + lbl_InstructionMessage.Height
      - scr16_rct_seprator_2:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =RGBA(200, 200, 200, 1)
            Height: =0.85
