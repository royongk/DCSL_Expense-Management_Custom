"'AddGuest - View Guest Attached to Expense Approvals' As screen":
    Fill: =RGBA(244, 244, 244, 1)
    OnVisible: |-
        =UpdateContext({locPreviousGuestView: true});
        ForAll(
            Table(
            ParseJSON(
                Coalesce(varExpenseAgainstWorkItem.AttachedGuestDetails,varSelectedLineItem.AttachedGuestDetails)
                )
            ),
            Collect(
                guestListExpense,
            {
                Name: Text(ThisRecord.Value.GuestId),
                'Organization/Country': Text(ThisRecord.Value.Company),
                Title: Text(ThisRecord.Value.Title),
                'The gift amount': Value(ThisRecord.Value.AmountCurr,"en-us")
            }
            )
        )
        
            

    "AddGuestToExpenseHeader_2 As 'header-navigation-PolicyViolation_3'":
        BackButtonClicked: |-
            =
            If(
                varItemizationScreen = "viewOnlyApprovalExpenseScreen",
                Concurrent(
                Set(
                    varIsCreate,
                    false
                ),
                Set(
                    varReceiptImage,  //set as receiptUrl of attached expense
                    Blank()
                )
            );
            
            Set(
                varReceiptImage,
                LookUp(receiptsAgainstWorkItems,ExpenseLineAttachedTo = varExpenseAgainstWorkItem.'Expense transaction number (mserp_exptransnumber)',CapturedDocument)
            );
            Set(
                varSelectedReceiptNumber,
                Blank()
            );
            If(
                varExpenseAgainstWorkItem.PolicyViolationCount,
                ClearCollect(
                    colPolViolations,
                    Split(varExpenseAgainstWorkItem.PolicyViolationMessage, "~|~")
                );
                UpdateContext({varMaxViolationLevel : varExpenseAgainstWorkItem.PolicyViolationsLevel});
                UpdateContext({varNumViolation : varExpenseAgainstWorkItem.PolicyViolationCount}),
                Clear(colPolViolations);
                UpdateContext({varMaxViolationLevel : 0});
                UpdateContext({varNumViolation : 0})
            );
            UpdateContext({testVar : varExpenseAgainstWorkItem});
            Navigate('Expenses - View Only Screen', ScreenTransition.None, {varNavigatedFrom : varNavigatedFrom, varMaxViolationLevel : varMaxViolationLevel, varNumViolation : varNumViolation}),
            Concurrent(
                Set(
                    varIsCreate,
                    false
                ),
                Set(
                    varReceiptImage,  //set as receiptUrl of attached expense
                    Blank()
                )
            );
            Set(
                varReceiptImage,
                LookUp('View privilege for Receipts attached to Expense Lines for Approvals (mserp)', EntRecId = Value(varSelectedLineItem.AttachedReceiptId),CapturedDocument)
            );
            Set(
                varSelectedReceiptNumber,
                Blank()
            );
            Navigate('Approvals - Line Details Screen', ScreenTransition.None, {varSelectedTab : 1, locItemizationLineFlag: varSelectedLineItem.'Expense line type' = 'Expense line type (mserp)'.'Itemized line'})
            );
            Clear(guestListExpense);
        Fill: =RGBA(255, 255, 255, 1)
        HeaderText: ="View guests attached to expense"
        Width: =App.Width
        ZIndex: =4

