"'Approvals - Delegate Screen' As screen":
    Fill: |
        =RGBA(244, 244, 244, 1)
    OnVisible: |-
        =Reset(scr24_txt_Comments_1);
        Reset(scr24_cmb_AssignedTo_1);
        If(
            IsEmpty(collectionUsers),
            UpdateContext({
                flowResponse:
                'Submitted Reports for Approvals (mserp)'.mserp_trvexpmobilereportapprovalentity_getdelegatelist(First('Submitted Reports for Approvals (mserp)').'Submitted Reports for Approvals (mserp)').return
            });
            ForAll(
                Table(
                    ParseJSON(
                        flowResponse
                    )
                ),
                Collect(
                    collectionUsers,
                    {
                        id: Text(ThisRecord.Value.Id),       
                        name : Text(ThisRecord.Value.Name),
                        email : Text(ThisRecord.Value.Email)
                    }
                )
            )
        );

    scr24_shp_ButtonCard As rectangle:
        Fill: =RGBA(248, 248, 248, 1)
        Height: =250
        Width: =Parent.Width
        Y: =Parent.Height-scr24_shp_ButtonCard.Height
        ZIndex: =1

    scr24_btn_Cancel As button:
        BorderColor: =RGBA(34, 102, 227, 1)
        Color: |
            =RGBA(34, 102, 227, 1)
        Fill: =Color.White
        Font: =Font.'Segoe UI'
        Height: =76
        OnSelect: |-
            =//navigate to previous screen
            If(
                varNavigatedFrom = "scr21",
                Navigate('Approvals - List Screen'),
                Navigate('Approvals - Details Screen');
            )
        RadiusBottomLeft: =8
        RadiusBottomRight: =8
        RadiusTopLeft: =8
        RadiusTopRight: =8
        Size: =19.15
        Text: |-
            =GlobalLabels.Labels.'15062:LocalizedName,msdyn_CancelLabel'
        Width: |
            =Parent.Width -  Self.X*2
        X: |
            =40
        Y: =scr24_shp_ButtonCard.Y + 140
        ZIndex: =2

    scr24_btn_DelegateAction As button:
        BorderColor: =RGBA(34, 102, 227, 1)
        Fill: |
            =RGBA(34, 102, 227, 1)
        Font: =Font.'Segoe UI'
        Height: =76
        OnSelect: |-
            =Clear(actionErrors);
            Set(
                gblNavigationDrawerVisibility,
                false
            );
            ForAll(
                colSelectedWorkItemIds,
                With(
                    {
                        varSelectedRecord: LookUp(
                            'Submitted Reports for Approvals (mserp)',
                            WorkItemRecId = colSelectedWorkItemIds[@workItemRecId]
                        )
                    },
                    IfError(
                        Patch(
                            'Submitted Reports for Approvals (mserp)',
                            varSelectedRecord,
                            {
                                Action: "Delegate",
                                WorkflowComment: scr24_txt_Comments_1.Text,
                                DelegateUserId: scr24_cmb_AssignedTo_1.Selected.id
                            }
                        ),
                        First(
                            Collect(
                                actionErrors,
                                {
                                    statusCode: FirstError.Details.HttpStatusCode,
                                    response: FirstError.Details.HttpResponse
                                }
                            )
                        )
                    )
                )
            );
            RemoveIf(
                actionErrors,
                Text(statusCode) = NotFoundStatusCode
            );
            If(
                CountRows(
                    Distinct(
                        actionErrors,
                        statusCode
                    )
                ) >= 1,
                ForAll(
                    actionErrors,
                    If(
                        Text(ThisRecord.statusCode) <> NotFoundStatusCode,
                        Notify(
                            Substitute(
                                Match(
                                    ThisRecord.response,
                                    """message"":""([^""]*)"""
                                ).FullMatch,
                                """message"":",
                                ""
                            ),
                            NotificationType.Error
                        )
                    )
                ),
                Notify(
                    Substitute(GlobalLabels.Labels.'15062:LocalizedName,msdyn_DelegateSuccessfulLabel', "$", scr24_cmb_AssignedTo_1.Selected.name),
                    NotificationType.Success
                );
                Navigate('Approvals - List Screen')
            )
        Size: =19.15
        Text: |-
            =GlobalLabels.Labels.'15062:LocalizedName,msdyn_DelegateLabel'
        Width: |
            =Parent.Width -  Self.X*2
        X: |
            =40
        Y: |-
            =
            scr24_shp_ButtonCard.Y + 35
        ZIndex: =3

    DelegateDetails As groupContainer.verticalAutoLayoutContainer:
        Height: =scr24_shp_ButtonCard.Y - Self.Y
        LayoutDirection: =LayoutDirection.Vertical
        LayoutGridColumns: =6
        LayoutGridRows: =6
        LayoutMode: =LayoutMode.Auto
        LayoutOverflowY: =LayoutOverflow.Scroll
        Width: =Parent.Width
