                // Load all receipts linked to any expense line in this work item
                ClearCollect(
                    colReceiptAttachToExpenseApprovals,
                    ForAll(
                        Sequence(
                            CountRows(
                                Filter(
                                    'Expense Mobile Unattached Document Entity (mserp)',
