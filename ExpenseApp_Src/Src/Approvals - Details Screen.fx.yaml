                                        ExpTransNumber in colExpensesAgainstWorkItem[@'Expense transaction number (mserp_exptransnumber)']
                                    ),
                                    "CreatingDateTime",
                                    SortOrder.Descending
                                )
                            },
                            Patch(
                                Last(FirstN(receiptsForWorkItem, Value)),
                                {RowNumber: Value}
                            )
                        )
                    )
                );
            TabIndex: =0
            Width: =scr22_lbl_Attachments.Width
            X: =scr22_lbl_Attachments.X
