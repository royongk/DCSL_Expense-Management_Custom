    scr25_btn_ApplyFilter As button:
        BorderColor: =RGBA(34, 102, 227, 1)
        Fill: |
            =RGBA(34, 102, 227, 1)
        Font: =Font.'Segoe UI'
        Height: =76
        OnSelect: |
            =//Store the values context variables
            //Navigate(scr21_ApprovalsList)
            UpdateContext({varSelectedUsers : scr25_cmb_User.SelectedItems});
            UpdateContext({varSelectedProjects : scr25_cmb_Project.SelectedItems});
            UpdateContext({
                varMinMaxAmounts : {
                        minAmount : Coalesce(Value(scr25_txt_MinAmount.Text), 0), 
                        maxAmount : Coalesce(Value(scr25_txt_MaxAmount.Text), 1000000)
                }
            });
            UpdateContext({varDateFilter : First(SortByColumns(colSelectedFilterOptions, "number")).number}); 
            Navigate('Approvals - List Screen', ScreenTransition.None, 
                {
                    varSelectedUsers : varSelectedUsers, 
                    varSelectedProjects : varSelectedProjects,
                    varMinMaxAmounts : varMinMaxAmounts,
                    varDateFilter : varDateFilter,
                    varFiltersApplied : ((!IsBlank(varSelectedUsers) && !IsEmpty(varSelectedUsers)) ||
                                         (!IsBlank(varSelectedProjects) && !IsEmpty(varSelectedProjects)) ||
                                         (varMinMaxAmounts.minAmount <> 0 || varMinMaxAmounts.maxAmount <> 1000000) ||
                                         (!IsBlank(varSelectedProjects) && !IsEmpty(varSelectedProjects)))
                }
            )
        Size: =19.15
        Text: |-
            =GlobalLabels.Labels.'15062:LocalizedName,msdyn_ApplyLabel'
        Width: =Parent.Width -  Self.X*2
        X: =40
        Y: |-
            =
            scr25_shp_ButtonCard.Y + 35
        ZIndex: =4

