    scr23_btn_RejectAction_1 As button:
        BorderColor: =RGBA(195, 39, 39, 1)
        Color: |
            =RGBA(195, 39, 39, 1)
        Fill: =RGBA(255, 255, 255, 1)
        Font: =Font.'Segoe UI'
        Height: =76
        HoverFill: =ColorFade(Self.Color, 20%)
        OnSelect: |
            =Clear(actionErrors);
            ForAll(
                colSelectedLineItemIds,
                With(
                    {
                        varSelectedRecord : LookUp(
                            'View/Approve/Reject Expense Lines for Approvals (mserp)',
                            'Expense transaction number (mserp_exptransnumber)' = colSelectedLineItemIds[@transactionId]
                        )
                    },
                    IfError(
                        Patch(
                            'View/Approve/Reject Expense Lines for Approvals (mserp)',
                            varSelectedRecord,
                            {
                                Action: "Reject",
                                WorkflowComment:scr23_txt_Justification_1.Text    
                            }
                        ),
                        First(
                            Collect( 
                                actionErrors,
                                {
                                    statusCode : FirstError.Details.HttpStatusCode,
                                    response : FirstError.Details.HttpResponse
                                }
                            ) 
                        )
                    )
                )
            );
            RemoveIf(
                actionErrors,
                Text(statusCode) = NotFoundStatusCode
            );
            If(
                CountRows(Distinct(actionErrors, statusCode)) >= 1,
                ForAll(
                    actionErrors,
                    If(
                        Text(ThisRecord.statusCode) <> NotFoundStatusCode,
                        Notify(
                            Substitute( 
                                Match(ThisRecord.response, """message"":""([^""]*)""").FullMatch, 
                                """message"":", "" 
                            ),
                            NotificationType.Error
                        )
                    )
                ),
                Notify(GlobalLabels.Labels.'15062:LocalizedName,msdyn_ExpenseRejectSuccessfulLabel', NotificationType.Success);
                Navigate('Approvals - List Screen')
            );
        Size: =19.15
        Text: |-
            =GlobalLabels.Labels.'15062:LocalizedName,msdyn_RejectLabel'
        Visible: =varAction = 2
        Width: |
            =Parent.Width -  Self.X*2
        X: =40
        Y: |-
            =
            scr23_shp_ButtonsCard_1.Y + 35
        ZIndex: =3

