            =RGBA(34, 102, 227, 1)
        Fill: =Color.White
        Font: =Font.'Segoe UI'
        Height: =76
        OnSelect: |-
            =//navigate to previous screen
            If(
                varNavigatedFrom = "scr21",
                Navigate('Approvals - List Screen'),
                Navigate('Approvals - Line Details Screen');
            )
        RadiusBottomLeft: =8
        RadiusBottomRight: =8
        RadiusTopLeft: =8
        RadiusTopRight: =8
        Size: =19.15
        Text: |-
            =GlobalLabels.Labels.'15062:LocalizedName,msdyn_CancelLabel'
        Width: |
            =Parent.Width -  Self.X*2
        X: =40
        Y: =scr23_shp_ButtonsCard_1.Y + 140
