            Text: ="View meal exclusions"
            Visible: =currExpenseType = 'TrvExpType (mserp)'.'Per diem' && LookUp('Expense management parameters (mserp)','Company Code'= varSelectedLegalEntity,'Calculate meal reduction by') <> 'Meal reductions (mserp)'.'Meal type per trip'
