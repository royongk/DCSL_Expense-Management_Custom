"'Approvals - Line Details Screen' As screen":
    Fill: =RGBA(244, 244, 244, 1)
    OnVisible: |-
        =UpdateContext(
            {
                featureEnabled :
                If(userRecord.IsReimaginedUIEnabled = 'NoYes (mserp)'.Yes, "True", "False")
            }
        );
        If(
            CountRows(labelTableLookUp) <= 0,
            Collect(
                labelTableLookUp,
                {
                    fieldName : "CostType",
                    labelName : "Expense category",
                    localisedLabelName : GlobalLabels.Labels.'15062:LocalizedName,msdyn_ExpenseCategoryLabel',
                    visible : true,
                    required : true
                },
                {
                    fieldName : "TransDate",
                    labelName : "Transaction date",
                    localisedLabelName : GlobalLabels.Labels.'15062:LocalizedName,msdyn_TransactionDateLabel',
                    visible : true,
                    required : true
                },
                {
                    fieldName : "AmountCurr",
                    labelName : "Transaction amount",
                    localisedLabelName : GlobalLabels.Labels.'15062:LocalizedName,msdyn_TransactionAmountLabel',
                    visible : true,
                    required : true
                },
                {
                    fieldName : "ExchangeCode",
                    labelName : "Currency",
                    localisedLabelName : GlobalLabels.Labels.'15062:LocalizedName,msdyn_CurrencyLabel',
                    visible : true,
                    required : true
                },
                {
                    fieldName : "PayMethod",
                    labelName : "Payment method",
                    localisedLabelName : GlobalLabels.Labels.'15062:LocalizedName,msdyn_PaymentMethodLabel',
                    visible : true,
                    required : true
                },
                {
                    fieldName : "SubmitterJustification",
                    labelName : "Employee justification",
                    localisedLabelName : GlobalLabels.Labels.'15062:LocalizedName,msdyn_EmployeeJustificationLabel',
                    visible : false,
                    required : false
                }
            );
            ForAll(
                    Filter('@ExpenseManagement:ExpenseMobileFieldVisibilityEntity (mserp)',LegalEntityId = varSelectedLegalEntity) As VisibilityTable,
                    Collect(
                        labelTableLookUp,
                        {
                            fieldName : VisibilityTable.FieldName,
                            labelName : VisibilityTable.Labels,
                            localisedLabelName : VisibilityTable.LocalisedLabelName
                        }
                    )
                );
            If(
                featureEnabled = "True",
                ForAll(
                    Filter('@ExpenseManagement:ExpenseMobileFieldVisibilityEntity (mserp)',LegalEntityId = varSelectedLegalEntity) As VisibilityTable,
                    Patch(
                        labelTableLookUp,
                        LookUp(labelTableLookUp,fieldName = VisibilityTable.FieldName),
                        {
                            visible : VisibilityTable.VisibilityType <> 'ExpenseFieldVisibilityType (mserp)'.'Do not display',
                            required : VisibilityTable.VisibilityType = 'ExpenseFieldVisibilityType (mserp)'.Required
                        }
                    )
                ),
                ForAll(
                    Filter('Display fields (mserp)', 'Company Code' = varSelectedLegalEntity) As VisibilityTable,
                    Patch(
                        labelTableLookUp,
                        LookUp(labelTableLookUp,fieldName = VisibilityTable.FieldName),
                        {
                            visible : VisibilityTable.Visibility <> 'Visibility (mserp)'.'Do not display',
                            required : false
                        }
                    )
                )
           
            )
        );
        UpdateContext(
            {
                currExpenseType : Coalesce(varSelectedLineItem.'Expense type', LookUp([@'Expense category (mserp)'],'Expense category' = ComboBox1_52.Selected.'Expense category','Expense type'))
            }
        )

    scr22_shp_Rectangle_1 As rectangle:
        Fill: =Color.White
        Height: =115
        Visible: =false
        Width: |
            =Parent.Width
        Y: =scr22_hdr_TopHeader_1.Height + scr22_btn_TabView_1.Height - 2
        ZIndex: =1

    scr22_cmp_ApprovalsFooter_1 As cmp_ApprovalsFooter_1:
        ApprovalText: |-
            =Upper(GlobalLabels.Labels.'15062:LocalizedName,msdyn_ApproveLabel')
        DelegateText: |-
            =Upper(GlobalLabels.Labels.'15062:LocalizedName,msdyn_DelegateLabel')
        Height: =135
        OnApprovalsButtonClick: |-
            =Navigate('Approvals - Line Action Screen', ScreenTransition.None, {varAction : 1, varNavigatedFrom: "scr22"});
        OnDelegateButtonClick: |-
            =Navigate('Approvals - Line Delegate Screen', ScreenTransition.None, {varNavigatedFrom : "scr22"})
        OnRejectButtonClick: |-
            =Navigate('Approvals - Line Action Screen', ScreenTransition.None, {varAction : 2, varNavigatedFrom: "scr22"});
        RejectText: |-
            =Upper(GlobalLabels.Labels.'15062:LocalizedName,msdyn_RejectLabel')
        Y: =Parent.Height - Self.Height
        ZIndex: =2

