    "scr21_hdr_TopHeader_1 As 'main-app-header'":
        firstIcon: =
        firstIconAccessibleLabel: =
        firstIconAction: =true
        OnSelectButton: |-
            =Set(
                gblNavigationDrawerVisibility,
                true
            );
            Set(
                gblScreenName,
                'Approvals - List Screen'
            );
            Refresh('Expense mobile notifications (mserp)');
            ClearCollect(
                colExpenseNoticationInfo,
                ForAll(
                    Filter('Expense mobile notifications (mserp)',NotifiedEmailId = User().Email) As ExpenseNotification,
                    {
                        RecId: ExpenseNotification.EntRecId,
                        ReadMessage: ExpenseNotification.Read
                    }
                )
            );
        paramAvatar: =Coalesce(userImage, blankImage)
        paramTitle: |-
            =GlobalLabels.Labels.'15062:LocalizedName,msdyn_ApprovalsLabel'
        refreshIconAction: |-
            =Refresh('Submitted Reports for Approvals (mserp)');
            Refresh('View/Approve/Reject Expense Lines for Approvals (mserp)');
            Concurrent(
                UpdateContext({varCntSelect: false}),
                Clear(colSelectedWorkItemIds);
                Clear(colSelectedLineItemIds);
                ClearCollect(
                    workItemsAssignedToMe,
                    Filter(
                        'Submitted Reports for Approvals (mserp)',
                        User = userRecord.ID && 'Document status' = 'Document status (mserp)'.'In review'
                    )
                );
                ClearCollect(
                    lineItemsAssignedToMe,
                    Filter(
                        'View/Approve/Reject Expense Lines for Approvals (mserp)',User = userRecord.ID
                    )
                );
                ClearCollect(
                    receiptsAgainstWorkItems,
                    'View Attached Receipts to Expense Lines (mserp)'
                );
                If(
                    IsEmpty(collApprovedFilterOptions),
                    ClearCollect(
                    collApprovedFilterOptions,
                    {
                        number: 1,
                        title: GlobalLabels.Labels.'15062:LocalizedName,msdyn_FilterOneWeekLabel'  
                    },
                    {
                        number: 2,
                        title: GlobalLabels.Labels.'15062:LocalizedName,msdyn_FilterOneMonthLabel'  
                    },
                    {
                        number: 3,
                        title: GlobalLabels.Labels.'15062:LocalizedName,msdyn_FilterSixMonthsLabel'
                    },
                    {
                        number: 4,
                        title: GlobalLabels.Labels.'15062:LocalizedName,msdyn_FilterOneYearLabel'
                    }
                )
                );
                
            )
        secondIcon: =icnFilter
        secondIconAccessibleLabel: ="Filter"
        secondIconAction: |-
            =UpdateContext({varcntShowFilter:true});
            Clear(usersList);
            Clear(projectsList);
            ForAll(
                workItemsAssignedToMe,
                Collect(
                    usersList,
                    {
                        userName : ThisRecord.CreatingUser
                    }
                );
                Collect(
                    projectsList,
                    {
                        projectName : ThisRecord.'Project name'
                    }
                )
            );
            ForAll(
                lineItemsAssignedToMe,
                Collect(
                    usersList,
                    {
                        userName : ThisRecord.CreatingUser
                    }
                );
                Collect(
                    projectsList,
                    {
                        projectName : ThisRecord.ProjectName
                    }
                )
            );
            Navigate('Approvals - Filters Screen', ScreenTransition.None);
        thirdIcon: =If(varCntSelect,SelectorCloseIcon,SelectorIcon)
        thirdIconAccessibleLabel: =If(Self.thirdIcon = SelectorIcon, If(varcntSelectedStatus = 1, "Multiselect reports", "Multiselect expenses"), "Cancel")
        thirdIconAction: |-
            =If(
                varCntSelect,
                UpdateContext({varCntSelect: false});
                Clear(colSelectedWorkItemIds);
                Clear(colSelectedLineItemIds),
                UpdateContext({varCntSelect: true})
            )
        ZIndex: =5

