            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =10
            LayoutGridColumnMinWidth: =0
            LayoutGridRowMinHeight: =0
            LayoutMaxHeight: =0
            LayoutMaxWidth: =0
            LayoutMode: =LayoutMode.Auto
            PaddingLeft: =25
            Width: =Parent.Width
            ZIndex: =7

            LblContainer_RequestedAmount As groupContainer.horizontalAutoLayoutContainer:
