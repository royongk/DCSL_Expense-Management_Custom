    CashAdvanceEdit_ButtonsContainer As groupContainer.manualLayoutContainer:
        Fill: =RGBA(250, 249, 248, 1)
        Height: =225
        LayoutGridColumns: =6
        LayoutGridRows: =6
        Width: =Parent.Width
        Y: =Parent.Height - Self.Height
        ZIndex: =4

        CashAdvanceEdit_SaveDraftButton As button:
            Fill: =RGBA(34, 102, 227, 1)
            Font: =Font.'Segoe UI'
            Height: =76
            OnSelect: |-
                =If(
                    // 1. 필수 값 체크 수정 (속성 불일치 해결)
                    IsBlank(DatePicker_CashAdvance_RequestedDate.SelectedDate) ||
                    IsBlank(ComboBox_CashAdvance_Location.Selected.Value) || 
                    IsBlank(ComboBox_CashAdvance_Purpose.Selected.Value) || 
                    IsBlank(DataCardValue_CashAdvance_RequestedAmount.Text) ||
                    IsBlank(ComboBox_CashAdvance_Currency.Selected.Value), 
                
                    // 2. 값이 하나라도 비어있으면 알림 표시
                    Notify("Please fill in all required fields", NotificationType.Error, gblParams.notificationTime),
                
                    // 3. 모든 값이 채워져 있으면 폼 제출
                    SubmitForm(EditCashAdvanceForm)
                )
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Size: =19.15
            Text: ="Save Draft"
            Width: =Parent.Width - Self.X*2
            X: =40
            Y: =20
            ZIndex: =1

        CashAdvanceEdit_SubmitButton As button:
            BorderColor: =RGBA(34, 102, 227, 1)
            Color: =RGBA(34, 102, 227, 1)
            Fill: =Color.White
            Font: =Font.'Segoe UI'
            Height: =76
            OnSelect: |-
                =If(
                    // 1. 필수 값 체크 (신규 필드 기준)
                    IsBlank(DatePicker_CashAdvance_RequestedDate.SelectedDate) ||
                    IsBlank(ComboBox_CashAdvance_Location.Selected.Location) ||  // Location이 텍스트 필드인 경우 .Value 또는 .Text 확인 필요
                    IsBlank(ComboBox_CashAdvance_Purpose.Selected.'Purpose (mserp_value)') ||   // Purpose가 텍스트 필드인 경우 .Value, Lookup인 경우 해당 ID 참조
                    IsBlank(DataCardValue_CashAdvance_RequestedAmount.Text) ||
                    IsBlank(ComboBox_CashAdvance_Currency.Selected.mserp_currencycode),    // mserp_currency가 Lookup이 아닌 단순 코드값일 경우 .Value
                
                    // 2. 누락 시 알림
                    Notify("Please fill in all required fields", NotificationType.Error, gblParams.notificationTime),
                
                    // 1. 방금 저장된 레코드(LastSubmit)를 찾아 WorkflowAction을 "Submit"으로 업데이트
                    Patch(
                        'DCSL TrvCash Advance Entity  (mserp)',
                        EditCashAdvanceForm.LastSubmit, 
                        {
                            WorkflowAction: "Submit"
                        }
                    );
                
                    // 2. (선택 사항) 업데이트 중 에러가 발생했는지 확인하는 로직 (사용자가 제공한 예시 기반)
                    If(
                        !IsEmpty(Errors('DCSL TrvCash Advance Entity  (mserp)')),
                        Notify(First(Errors('DCSL TrvCash Advance Entity  (mserp)')).Message, NotificationType.Error),
                        
                        // 3. 에러가 없으면 성공 알림 및 화면 이동
                        Notify("Cash Advance has been submitted successfully.", NotificationType.Success);
                        Navigate('Cash Advance - List Screen', ScreenTransition.None);
                        ResetForm(EditCashAdvanceForm)
                    );
                
                    // 3. 폼 제출
                    SubmitForm(EditCashAdvanceForm)
                )
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Size: =19.15
            Text: ="Submit"
            Width: =Parent.Width - Self.X*2
            X: =40
            Y: =CashAdvanceEdit_SaveDraftButton.Y + CashAdvanceEdit_SaveDraftButton.Height + 20
            ZIndex: =2

