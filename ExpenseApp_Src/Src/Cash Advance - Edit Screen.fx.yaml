"'Cash Advance - Edit Screen' As screen.'phoneDetailEditLayout_ver3.0'":
    Fill: =RGBA(248, 248, 248, 1)
    OnVisible: |-
        =UpdateContext({varIsCreateCashAdvance: IsBlank(varSelectedCashAdvance)});
        // [추가] 변수 상태에 따라 폼 모드 강제 설정
        If(
            varIsCreateCashAdvance, 
            NewForm(EditCashAdvanceForm), 
            EditForm(EditCashAdvanceForm)
        );

    CashAdvanceEdit_Header As hdr02_Header:
        Fill: =CashAdvanceEdit_Header.paramFill
        paramFill: =RGBA(255, 255, 255, 1)
        paramTitle: |-
            =If(
                varIsCreateCashAdvance,
                "New Cash Advance",
                "Edit Cash Advance"
            )

    CashAdvanceEdit_BackIcon As icon.ChevronLeft:
        AccessibleLabel: ="Press to go back"
        Color: =icongconfig_backbutton.Color
        Fill: =icongconfig_backbutton.Fill
        Height: =icongconfig_backbutton.Height
        Icon: =Icon.ChevronLeft
        OnSelect: =Navigate('Cash Advance - List Screen', ScreenTransition.None)
        TabIndex: =0
        Width: =icongconfig_backbutton.Width
        X: =22.5
        Y: =(CashAdvanceEdit_Header.Height-Self.Height)/2
        ZIndex: =2

    CashAdvanceEdit_Container As groupContainer.verticalAutoLayoutContainer:
        Height: =Parent.Height - CashAdvanceEdit_Header.Height - CashAdvanceEdit_ButtonsContainer.Height
        LayoutDirection: =LayoutDirection.Vertical
        LayoutMode: =LayoutMode.Auto
        LayoutOverflowY: =LayoutOverflow.Scroll
        Width: =Parent.Width
        Y: =CashAdvanceEdit_Header.Height
        ZIndex: =3

        EditCashAdvanceForm As form:
            AlignInContainer: =AlignInContainer.SetByContainer
            DataSource: ='Cash advances (mserp)'
            DefaultMode: |-
                =If(
                    varIsCreateCashAdvance,
                    FormMode.New,
                    FormMode.Edit
                )
            Item: =varSelectedCashAdvance
            LayoutMaxHeight: =0
            LayoutMaxWidth: =0
            LayoutMinHeight: =250
            LayoutMinWidth: =320
            NumberOfColumns: =1
            OnFailure: |-
                =If(
                    CountRows(Split(Text(Self.Error), ":")) > 2,
                    Notify(
                        Mid(Mid(EditCashAdvanceForm.Error, Find(":", EditCashAdvanceForm.Error) + 2), Find(":", Mid(EditCashAdvanceForm.Error, Find(":", EditCashAdvanceForm.Error) + 2)) + 2),
                        NotificationType.Error,
                        gblParams.notificationTime
                    ),
                    Notify(
                        Last(Split(Text(Self.Error), ":")).Value,
                        NotificationType.Error,
                        gblParams.notificationTime
                    )
                )
            OnSuccess: |-
                =Set(varSelectedCashAdvance, EditCashAdvanceForm.LastSubmit);
                Notify("Cash advance saved successfully", NotificationType.Success, gblParams.notificationTime);
                Navigate('Cash Advance - List Screen', ScreenTransition.None)
            Width: =Parent.Width

            "'Requested date_DataCard' As typedDataCard.dateTimeEditCard":
                BorderStyle: =BorderStyle.Solid
                DataField: ="mserp_requesteddate"
                Default: =ThisItem.'Requested date'
                DisplayMode: =Parent.DisplayMode
                DisplayName: ="Requested date"
                Fill: =RGBA(0, 0, 0, 0)
                Height: =80
                Required: =true
                Update: =DatePicker_CashAdvance_RequestedDate.SelectedDate
                Width: =640
                X: =0
                Y: =0
                ZIndex: =1

                DatePicker_CashAdvance_RequestedDate As datepicker:
                    DisplayMode: =Parent.DisplayMode
                    Height: =gblParams.dropDownHeight
                    SelectedDate: =If(varIsCreateCashAdvance, Today(), ThisItem.'Requested date')
                    Width: =Parent.Width - 80
                    X: =40
                    Y: =32
                    ZIndex: =2

            Location_DataCard As typedDataCard.textualEditCard:
                BorderStyle: =BorderStyle.Solid
                DataField: ="mserp_location"
                Default: =ThisItem.Location
                DisplayMode: =Parent.DisplayMode
                DisplayName: ="Location"
                Fill: =RGBA(0, 0, 0, 0)
                Height: =80
                Required: =true
                Update: =If(IsBlank(ComboBox_CashAdvance_Location.Selected.Location), ComboBox_CashAdvance_Location.SearchText, ComboBox_CashAdvance_Location.Selected.Location)
                Width: =640
                X: =0
                Y: =1
                ZIndex: =2

                ComboBox_CashAdvance_Location As combobox:
                    DefaultSelectedItems: =If(IsBlank(ThisItem.Location), Blank(), LookUp('Travel locations (mserp)', Location = ThisItem.Location))
                    DisplayFields: =["mserp_destination"]
                    DisplayMode: =Parent.DisplayMode
                    Height: =gblParams.dropDownHeight
                    Items: =Filter('Travel locations (mserp)', 'Company Code' = varSelectedLegalEntity)
                    SearchFields: =["mserp_destination"]
                    SearchItems: =Search(Filter('Travel locations (mserp)', 'Company Code' = varSelectedLegalEntity), ComboBox_CashAdvance_Location.SearchText, mserp_destination)
                    SelectMultiple: =false
                    Width: =Parent.Width - 80
                    X: =40
                    Y: =32
                    ZIndex: =2

            Purpose_DataCard As typedDataCard.textualEditCard:
                BorderStyle: =BorderStyle.Solid
                DataField: ="mserp_purpose"
                Default: =ThisItem.Purpose
                DisplayMode: =Parent.DisplayMode
                DisplayName: ="Purpose"
                Fill: =RGBA(0, 0, 0, 0)
                Height: =80
                Required: =true
                Update: =If(IsBlank(ComboBox_CashAdvance_Purpose.Selected.'Purpose (mserp_value)'), ComboBox_CashAdvance_Purpose.SearchText, ComboBox_CashAdvance_Purpose.Selected.'Purpose (mserp_value)')
                Width: =640
                X: =0
                Y: =2
                ZIndex: =3

                ComboBox_CashAdvance_Purpose As combobox:
                    DefaultSelectedItems: =If(IsBlank(ThisItem.Purpose), Blank(), LookUp('DimAttributeTrvTravelTxtEntity (mserp)', 'Purpose (mserp_value)' = ThisItem.Purpose))
                    DisplayFields: =["mserp_value"]
                    DisplayMode: =Parent.DisplayMode
                    Height: =gblParams.dropDownHeight
                    Items: =Filter('DimAttributeTrvTravelTxtEntity (mserp)', 'Company Code' = varSelectedLegalEntity)
                    SearchFields: =["mserp_value"]
                    SearchItems: =Search(Filter('DimAttributeTrvTravelTxtEntity (mserp)', 'Company Code' = varSelectedLegalEntity), ComboBox_CashAdvance_Purpose.SearchText, mserp_value)
                    SelectMultiple: =false
                    Width: =Parent.Width - 80
                    X: =40
                    Y: =32
                    ZIndex: =2

            "'Requested amount_DataCard' As typedDataCard.numberEditCard":
                BorderStyle: =BorderStyle.Solid
                DataField: ="mserp_requestedamount"
                Default: =ThisItem.'Requested amount'
                DisplayMode: =Parent.DisplayMode
                DisplayName: ="Requested amount"
                Fill: =RGBA(0, 0, 0, 0)
                Height: =80
                Required: =true
                Update: =Value(DataCardValue_CashAdvance_RequestedAmount.Text)
                Width: =640
                X: =0
                Y: =3
                ZIndex: =4

                DataCardValue_CashAdvance_RequestedAmount As text:
                    Default: =If(IsBlank(ThisItem.'Requested amount'), "", Text(ThisItem.'Requested amount'))
                    DisplayMode: =Parent.DisplayMode
                    Format: =TextFormat.Number
                    Height: =gblParams.dropDownHeight
                    Width: =Parent.Width - 80
                    X: =40
                    Y: =32
                    ZIndex: =2

            Currency_DataCard As typedDataCard.textualEditCard:
                BorderStyle: =BorderStyle.Solid
                DataField: ="mserp_currency"
                Default: =ThisItem.Currency
                DisplayMode: =Parent.DisplayMode
                DisplayName: ="Currency"
                Fill: =RGBA(0, 0, 0, 0)
                Height: =80
                Required: =true
                Update: =ComboBox_CashAdvance_Currency.Selected.mserp_currencycode
                Width: =640
                X: =0
                Y: =4
                ZIndex: =5

                ComboBox_CashAdvance_Currency As combobox:
                    DefaultSelectedItems: =If(IsBlank(ThisItem.Currency), Blank(), LookUp('Currencies (mserp)', 'Currency code' = ThisItem.Currency))
                    DisplayFields: =["mserp_currencycode"]
                    DisplayMode: =Parent.DisplayMode
                    Height: =gblParams.dropDownHeight
                    Items: =ShowColumns('Currencies (mserp)', 'Currency code', Name)
                    SearchFields: =["mserp_currencycode"]
                    SearchItems: =Search(ShowColumns('Currencies (mserp)', 'Currency code', Name), ComboBox_CashAdvance_Currency.SearchText, mserp_currencycode)
                    SelectMultiple: =false
                    Width: =Parent.Width - 80
                    X: =40
                    Y: =32
                    ZIndex: =2

            Note_DataCard As typedDataCard.textualEditCard:
                BorderStyle: =BorderStyle.Solid
                DataField: ="mserp_note"
                Default: =ThisItem.Note
                DisplayMode: =Parent.DisplayMode
                DisplayName: ="Note"
                Fill: =RGBA(0, 0, 0, 0)
                Height: =120
                Required: =false
                Update: =DataCardValue_CashAdvance_Note.Text
                Width: =640
                X: =0
                Y: =5
                ZIndex: =6

                DataCardValue_CashAdvance_Note As text:
                    Default: =ThisItem.Note
                    DisplayMode: =Parent.DisplayMode
                    Height: =80
                    Mode: =TextMode.MultiLine
                    Width: =Parent.Width - 80
                    X: =40
                    Y: =32
                    ZIndex: =2

            CompanyCode_DataCard As typedDataCard.textualEditCard:
                BorderStyle: =BorderStyle.Solid
                DataField: ="mserp_dataareaid"
                Default: =varSelectedLegalEntity
                DisplayMode: =Parent.DisplayMode
                DisplayName: ="Company Code"
                Fill: =RGBA(0, 0, 0, 0)
                Height: =0
                Required: =true
                Update: =varSelectedLegalEntity
                Visible: =false
                Width: =640
                X: =0
                Y: =6
                ZIndex: =7

    CashAdvanceEdit_ButtonsContainer As groupContainer.verticalAutoLayoutContainer:
        Fill: =RGBA(250, 249, 248, 1)
        Height: =160
        LayoutDirection: =LayoutDirection.Vertical
        LayoutMode: =LayoutMode.Auto
        Width: =Parent.Width
        Y: =Parent.Height - Self.Height
        ZIndex: =4

        CashAdvanceEdit_SaveDraftButton As button:
            Fill: =RGBA(34, 102, 227, 1)
            Font: =Font.'Segoe UI'
            Height: =60
            LayoutMaxHeight: =0
            LayoutMaxWidth: =0
            OnSelect: |-
                =If(
                    IsBlank(DatePicker_CashAdvance_RequestedDate.SelectedDate) ||
                    IsBlank(ComboBox_CashAdvance_Location.Selected.Location) ||
                    IsBlank(ComboBox_CashAdvance_Purpose.Selected.'Purpose (mserp_value)') && IsBlank(ComboBox_CashAdvance_Purpose.SearchText) ||
                    IsBlank(DataCardValue_CashAdvance_RequestedAmount.Text) ||
                    IsBlank(ComboBox_CashAdvance_Currency.Selected.mserp_currencycode),
                    Notify("Please fill in all required fields", NotificationType.Error, gblParams.notificationTime),
                    SubmitForm(EditCashAdvanceForm)
                )
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Size: =18
            Text: ="Save Draft"
            Width: =Parent.Width - 80
            X: =40
            Y: =20
            ZIndex: =1

        CashAdvanceEdit_SubmitButton As button:
            BorderColor: =RGBA(34, 102, 227, 1)
            Color: =RGBA(34, 102, 227, 1)
            Fill: =Color.White
            Font: =Font.'Segoe UI'
            Height: =60
            LayoutMaxHeight: =0
            LayoutMaxWidth: =0
            OnSelect: |-
                =If(
                    IsBlank(DatePicker_CashAdvance_RequestedDate.SelectedDate) ||
                    IsBlank(ComboBox_CashAdvance_Location.Selected.Location) ||
                    IsBlank(ComboBox_CashAdvance_Purpose.Selected.'Purpose (mserp_value)') && IsBlank(ComboBox_CashAdvance_Purpose.SearchText) ||
                    IsBlank(DataCardValue_CashAdvance_RequestedAmount.Text) ||
                    IsBlank(ComboBox_CashAdvance_Currency.Selected.mserp_currencycode),
                    Notify("Please fill in all required fields", NotificationType.Error, gblParams.notificationTime),
                    SubmitForm(EditCashAdvanceForm)
                )
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Size: =18
            Text: ="Submit(추후 적용)"
            Width: =Parent.Width - 80
            X: =40
            Y: =CashAdvanceEdit_SaveDraftButton.Y + CashAdvanceEdit_SaveDraftButton.Height + 10
            ZIndex: =2

