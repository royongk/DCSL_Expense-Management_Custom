                    Height: =32
                    LayoutMaxHeight: =0
                    LayoutMaxWidth: =0
                    Size: =18
                    Text: ="Project Code"
                    VerticalAlign: =VerticalAlign.Top
                    Width: =Parent.Width
                    ZIndex: =1

            cb_ProjectCode As combobox:
                DefaultSelectedItems: |-
                    =If(
                        !IsBlank(varSelectedCashAdvance.Project) && !IsBlank(varSelectedLegalEntity),
                        LookUp(
                            'DCSL ProjectTypeProjectValue Entity (mserp)',
                            Project = varSelectedCashAdvance.Project &&
                            'Company Code' = Lower(varSelectedLegalEntity)
                        ),
                        Blank()
                    )
                DisplayFields: =["mserp_projectvalue","mserp_projectname"]
                FillPortions: =1
                Height: =Min('Cash Advance - Edit Screen'.Height * 0.0616, 50)
                InputTextPlaceholder: ="Select Project Code"
                Items: |-
                    =SortByColumns(
                        GroupBy(
                            Filter(
                                'DCSL ProjectTypeProjectValue Entity (mserp)',
                                'Company Code' = Lower(varSelectedLegalEntity)
                            ),
                            Project,  // 첫 번째 그룹 기준 (프로젝트 ID)
                            Description   // 두 번째 그룹 기준 (프로젝트 이름)
                        ),
                        "mserp_projectvalue",      // 정렬 기준
                        SortOrder.Ascending
                    )
                LayoutMaxHeight: =0
                LayoutMaxWidth: =0
                SearchFields: =["mserp_projectvalue"]
