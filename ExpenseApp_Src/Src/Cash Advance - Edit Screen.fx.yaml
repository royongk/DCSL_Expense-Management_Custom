"'Cash Advance - Edit Screen' As screen.'phoneDetailEditLayout_ver3.0'":
    Fill: =RGBA(248, 248, 248, 1)
    OnVisible: |-
        =UpdateContext({varIsCreateCashAdvance: IsBlank(varSelectedCashAdvance)});

    CashAdvanceEdit_Header As hdr02_Header:
        Fill: =CashAdvanceEdit_Header.paramFill
        paramFill: =RGBA(255, 255, 255, 1)
        paramTitle: |-
            =If(
                varIsCreateCashAdvance,
                "New Cash Advance",
                "Edit Cash Advance"
            )

    CashAdvanceEdit_BackIcon As icon.ChevronLeft:
        AccessibleLabel: ="Press to go back"
        Color: =icongconfig_backbutton.Color
        Fill: =icongconfig_backbutton.Fill
        Height: =icongconfig_backbutton.Height
        Icon: =Icon.ChevronLeft
        OnSelect: =Navigate('Cash Advance - List Screen', ScreenTransition.None)
        TabIndex: =0
        Width: =icongconfig_backbutton.Width
        X: =22.5
        Y: =(CashAdvanceEdit_Header.Height-Self.Height)/2
        ZIndex: =2

    CashAdvanceEdit_Container As groupContainer.verticalAutoLayoutContainer:
        Height: =Parent.Height - CashAdvanceEdit_Header.Height - CashAdvanceEdit_ButtonsContainer.Height
        LayoutDirection: =LayoutDirection.Vertical
        LayoutMode: =LayoutMode.Auto
        LayoutOverflowY: =LayoutOverflow.Scroll
        Width: =Parent.Width
        Y: =CashAdvanceEdit_Header.Height
        ZIndex: =3

        EditCashAdvanceForm As form:
            AlignInContainer: =AlignInContainer.SetByContainer
            DataSource: ='Cash advances (mserp)'
            DefaultMode: |-
                =If(
                    varIsCreateCashAdvance,
                    FormMode.New,
                    FormMode.Edit
                )
            Item: =varSelectedCashAdvance
            LayoutMaxHeight: =0
            LayoutMaxWidth: =0
            LayoutMinHeight: =250
            LayoutMinWidth: =320
            NumberOfColumns: =1
            OnFailure: |-
                =If(
                    CountRows(Split(Text(Self.Error), ":")) > 2,
                    Notify(
                        Mid(Mid(EditCashAdvanceForm.Error, Find(":", EditCashAdvanceForm.Error) + 2), Find(":", Mid(EditCashAdvanceForm.Error, Find(":", EditCashAdvanceForm.Error) + 2)) + 2),
                        NotificationType.Error,
                        gblParams.notificationTime
                    ),
                    Notify(
                        Last(Split(Text(Self.Error), ":")).Value,
                        NotificationType.Error,
                        gblParams.notificationTime
                    )
                )
            OnSuccess: |-
                =Set(varSelectedCashAdvance, EditCashAdvanceForm.LastSubmit);
                Notify("Cash advance saved successfully", NotificationType.Success, gblParams.notificationTime);
                Navigate('Cash Advance - List Screen', ScreenTransition.None)
            Width: =Parent.Width
            ZIndex: =8

            Employee_DataCard1 As typedDataCard.numberEditCard:
                BorderStyle: =BorderStyle.Solid
                DataField: ="mserp_deexrequestingworker"
                Default: =ThisItem.Employee
                DisplayMode: =Parent.DisplayMode
                DisplayName: =DataSourceInfo([@'Cash advances (mserp)'],DataSourceInfo.DisplayName,'mserp_deexrequestingworker')
                Fill: =RGBA(0, 0, 0, 0)
                Height: =50
                Required: =true
                Update: |-
                    =//Value(DataCardValue18.Text)
                    userRecord.CreatingWorker
                Visible: =false
                Width: =640
                X: =0
                Y: =6
                ZIndex: =1

                DataCardKey25 As label:
                    AutoHeight: =true
                    Height: =48
                    Size: =21
                    Text: =Parent.DisplayName
                    Width: =(Parent.Width - 60) * 0.4
                    Wrap: =false
                    X: =30
                    Y: =10 + (DataCardValue18.Height / 2) - (Self.Height / 2)
                    ZIndex: =1

                DataCardValue18 As text:
                    BorderColor: =If(IsBlank(Parent.Error), Parent.BorderColor, Color.Red)
                    Default: =Parent.Default
                    DelayOutput: =true
                    DisplayMode: =Parent.DisplayMode
                    Format: =TextFormat.Number
                    Height: =70
                    PaddingLeft: =5
                    RadiusBottomLeft: =0
                    RadiusBottomRight: =0
                    RadiusTopLeft: =0
                    RadiusTopRight: =0
                    Size: =21
                    Tooltip: =Parent.DisplayName
                    Width: =(Parent.Width - 60) * 0.6
                    X: =DataCardKey25.X + DataCardKey25.Width
                    Y: =10
                    ZIndex: =2

                ErrorMessage25 As label:
                    AutoHeight: =true
                    Height: =10
                    Live: =Live.Assertive
                    PaddingBottom: =0
                    PaddingLeft: =0
                    PaddingRight: =0
                    PaddingTop: =0
                    Size: =24
                    Text: =Parent.Error
                    Visible: =Parent.DisplayMode=DisplayMode.Edit
                    Width: =Parent.Width - 60
                    X: =30
                    Y: =DataCardValue18.Y + DataCardValue18.Height
                    ZIndex: =3

                StarVisible25 As label:
                    Align: =Align.Center
                    Height: =DataCardKey25.Height
                    Size: =21
                    Text: ="*"
                    Visible: =And(Parent.Required, Parent.DisplayMode=DisplayMode.Edit)
                    Width: =30
                    Wrap: =false
                    Y: =DataCardKey25.Y
                    ZIndex: =4

            "'Requested date_DataCard' As typedDataCard.dateTimeEditCard":
                BorderStyle: =BorderStyle.Solid
                DataField: ="mserp_requesteddate"
                Default: =ThisItem.'Requested date'
                DisplayMode: =Parent.DisplayMode
                DisplayName: ="Requested date"
                Fill: =RGBA(0, 0, 0, 0)
                Height: =80
                Required: =true
                Update: =DatePicker_CashAdvance_RequestedDate.SelectedDate
                Width: =Parent.Width
                X: =0
                Y: =0
                ZIndex: =1

                CashAdvance_RequestedDate_Label As label:
                    AutoHeight: =true
                    BorderColor: =RGBA(0, 0, 0, 0)
                    Color: =gblParams.dropDownLabelColor
                    Font: =Font.'Segoe UI'
                    Height: =24
                    Size: =21
                    Text: ="Requested date"
                    Width: =Parent.Width - 60
                    Wrap: =false
                    X: =30
                    Y: =5
                    ZIndex: =1

                DatePicker_CashAdvance_RequestedDate As datepicker:
                    DisplayMode: =Parent.DisplayMode
                    Height: =gblParams.dropDownHeight
                    SelectedDate: =If(varIsCreateCashAdvance, Today(), ThisItem.'Requested date')
                    Width: =Parent.Width - 80
                    X: =40
                    Y: =CashAdvance_RequestedDate_Label.Y + CashAdvance_RequestedDate_Label.Height + 8
                    ZIndex: =3

                CashAdvance_RequestedDate_Star As label:
                    Align: =Align.Center
                    BorderColor: =RGBA(0, 0, 0, 0)
                    Color: =RGBA(0, 18, 107, 1)
                    Height: =CashAdvance_RequestedDate_Label.Height
                    Size: =21
                    Text: ="*"
                    Visible: =And(Parent.Required, Parent.DisplayMode = DisplayMode.Edit)
                    Width: =30
                    Wrap: =false
                    Y: =CashAdvance_RequestedDate_Label.Y
                    ZIndex: =4

            Location_DataCard As typedDataCard.textualEditCard:
                BorderStyle: =BorderStyle.Solid
                DataField: ="mserp_location"
                Default: =ThisItem.Location
                DisplayMode: =Parent.DisplayMode
                DisplayName: ="Location"
                Fill: =RGBA(0, 0, 0, 0)
                Height: =80
                Required: =true
                Update: =If(IsBlank(ComboBox_CashAdvance_Location.Selected.Location), ComboBox_CashAdvance_Location.SearchText, ComboBox_CashAdvance_Location.Selected.Location)
                Width: =Parent.Width
                X: =0
                Y: =1
                ZIndex: =2

                CashAdvance_Location_Label As label:
                    AutoHeight: =true
                    BorderColor: =RGBA(0, 0, 0, 0)
                    Color: =gblParams.dropDownLabelColor
                    DisabledColor: =RGBA(166, 166, 166, 1)
                    Font: =Font.'Segoe UI'
                    Height: =24
                    Size: =21
                    Text: ="Location"
                    Width: =Parent.Width - 60
                    Wrap: =false
                    X: =30
                    Y: =5
                    ZIndex: =1

                ComboBox_CashAdvance_Location As combobox:
                    DefaultSelectedItems: =If(IsBlank(ThisItem.Location), Blank(), LookUp('Travel locations (mserp)', Location = ThisItem.Location))
                    DisplayFields: =["mserp_destination"]
                    DisplayMode: =Parent.DisplayMode
                    Height: =gblParams.dropDownHeight
                    InputTextPlaceholder: ="Select Location."
                    Items: =Filter('Travel locations (mserp)', 'Company Code' = varSelectedLegalEntity)
                    SearchFields: =["mserp_destination"]
                    SearchItems: =Search(Filter('Travel locations (mserp)', 'Company Code' = varSelectedLegalEntity), ComboBox_CashAdvance_Location.SearchText, Location)
                    SelectMultiple: =false
                    Width: =Parent.Width - 80
                    X: =40
                    Y: =CashAdvance_Location_Label.Y + CashAdvance_Location_Label.Height + 8
                    ZIndex: =3

                CashAdvance_Location_Star As label:
                    Align: =Align.Center
                    BorderColor: =RGBA(0, 0, 0, 0)
                    Color: =RGBA(0, 0, 0, 1)
                    DisabledColor: =RGBA(166, 166, 166, 1)
                    Height: =CashAdvance_Location_Label.Height
                    Size: =21
                    Text: ="*"
                    Visible: =And(Parent.Required, Parent.DisplayMode = DisplayMode.Edit)
                    Width: =30
                    Wrap: =false
                    Y: =CashAdvance_Location_Label.Y
                    ZIndex: =4

            Purpose_DataCard As typedDataCard.textualEditCard:
                BorderStyle: =BorderStyle.Solid
                DataField: ="mserp_purpose"
                Default: =ThisItem.Purpose
                DisplayMode: =Parent.DisplayMode
                DisplayName: ="Purpose"
                Fill: =RGBA(0, 0, 0, 0)
                Height: =80
                Required: =true
                Update: =If(IsBlank(ComboBox_CashAdvance_Purpose.Selected.'Purpose (mserp_value)'), ComboBox_CashAdvance_Purpose.SearchText, ComboBox_CashAdvance_Purpose.Selected.'Purpose (mserp_value)')
                Width: =Parent.Width
                X: =0
                Y: =2
                ZIndex: =3

                CashAdvance_Purpose_Label As label:
                    AutoHeight: =true
                    BorderColor: =RGBA(0, 0, 0, 0)
                    Color: =gblParams.dropDownLabelColor
                    Font: =Font.'Segoe UI'
                    Height: =24
                    Size: =21
                    Text: ="Purpose"
                    Width: =Parent.Width - 60
                    Wrap: =false
                    X: =30
                    Y: =5
                    ZIndex: =1

                ComboBox_CashAdvance_Purpose As combobox:
                    DefaultSelectedItems: =If(IsBlank(ThisItem.Purpose), Blank(), LookUp('DimAttributeTrvTravelTxtEntity (mserp)', 'Purpose (mserp_value)' = ThisItem.Purpose))
                    DisplayFields: =["mserp_value"]
                    DisplayMode: =Parent.DisplayMode
                    Height: =gblParams.dropDownHeight
                    InputTextPlaceholder: ="Select Purpose."
                    Items: =Filter('DimAttributeTrvTravelTxtEntity (mserp)', 'Company Code' = varSelectedLegalEntity)
                    SearchFields: =["mserp_value"]
                    SearchItems: =Search(Filter('DimAttributeTrvTravelTxtEntity (mserp)', 'Company Code' = varSelectedLegalEntity), ComboBox_CashAdvance_Purpose.SearchText, 'Purpose (mserp_value)')
                    SelectMultiple: =false
                    Width: =Parent.Width - 80
                    X: =40
                    Y: =CashAdvance_Purpose_Label.Y + CashAdvance_Purpose_Label.Height + 8
                    ZIndex: =3

                CashAdvance_Purpose_Star As label:
                    Align: =Align.Center
                    BorderColor: =RGBA(0, 0, 0, 0)
                    Height: =CashAdvance_Purpose_Label.Height
                    Size: =21
                    Text: ="*"
                    Visible: =And(Parent.Required, Parent.DisplayMode = DisplayMode.Edit)
                    Width: =30
                    Wrap: =false
                    Y: =CashAdvance_Purpose_Label.Y
                    ZIndex: =4

            "'Requested amount_DataCard' As typedDataCard.numberEditCard":
                BorderStyle: =BorderStyle.Solid
                DataField: ="mserp_requestedamount"
                Default: =ThisItem.'Requested amount'
                DisplayMode: =Parent.DisplayMode
                DisplayName: ="Requested amount"
                Fill: =RGBA(0, 0, 0, 0)
                Height: =80
                Required: =true
                Update: =Value(DataCardValue_CashAdvance_RequestedAmount.Text)
                Width: =Parent.Width/2 - 10
                X: =0
                Y: =3
                ZIndex: =4

                CashAdvance_RequestedAmount_Label As label:
                    AutoHeight: =true
                    BorderColor: =RGBA(0, 0, 0, 0)
                    Color: =gblParams.dropDownLabelColor
                    Font: =Font.'Segoe UI'
                    Height: =24
                    Size: =21
                    Text: ="Requested amount"
                    Width: =Parent.Width - 60
                    Wrap: =false
                    X: =30
                    Y: =5
                    ZIndex: =1

                DataCardValue_CashAdvance_RequestedAmount As text:
                    Default: =If(IsBlank(ThisItem.'Requested amount'), "", Text(ThisItem.'Requested amount'))
                    DisplayMode: =Parent.DisplayMode
                    Format: =TextFormat.Number
                    Height: =gblParams.dropDownHeight
                    Width: =Parent.Width - 80
                    X: =40
                    Y: =CashAdvance_RequestedAmount_Label.Y + CashAdvance_RequestedAmount_Label.Height + 8
                    ZIndex: =3

                CashAdvance_RequestedAmount_Star As label:
                    Align: =Align.Center
                    BorderColor: =RGBA(0, 0, 0, 0)
                    Height: =CashAdvance_RequestedAmount_Label.Height
                    Size: =21
                    Text: ="*"
                    Visible: =And(Parent.Required, Parent.DisplayMode = DisplayMode.Edit)
                    Width: =30
                    Wrap: =false
                    Y: =CashAdvance_RequestedAmount_Label.Y
                    ZIndex: =4

            Currency_DataCard As typedDataCard.textualEditCard:
                BorderStyle: =BorderStyle.Solid
                DataField: ="mserp_currency"
                Default: =ThisItem.Currency
                DisplayMode: =Parent.DisplayMode
                DisplayName: ="Currency"
                Fill: =RGBA(0, 0, 0, 0)
                Height: =80
                Required: =true
                Update: =ComboBox_CashAdvance_Currency.Selected.mserp_currencycode
                Width: =Parent.Width/2
                X: =0
                Y: =3
                ZIndex: =5

                CashAdvance_Currency_Label As label:
                    AutoHeight: =true
                    BorderColor: =RGBA(0, 0, 0, 0)
                    Color: =gblParams.dropDownLabelColor
                    Font: =Font.'Segoe UI'
                    Height: =24
                    Size: =21
                    Text: ="Currency"
                    Width: =Parent.Width - 60
                    Wrap: =false
                    X: =30
                    Y: =5
                    ZIndex: =1

                ComboBox_CashAdvance_Currency As combobox:
                    DefaultSelectedItems: =If(IsBlank(ThisItem.Currency), Blank(), LookUp('Currencies (mserp)', 'Currency code' = ThisItem.Currency))
                    DisplayFields: =["mserp_currencycode"]
                    DisplayMode: =Parent.DisplayMode
                    Height: =gblParams.dropDownHeight
                    InputTextPlaceholder: ="Select Currency."
                    Items: =ShowColumns('Currencies (mserp)', 'Currency code', Name)
                    SearchFields: =["mserp_currencycode"]
                    SearchItems: =Search(ShowColumns('Currencies (mserp)', 'Currency code', Name), ComboBox_CashAdvance_Currency.SearchText, mserp_currencycode)
                    SelectMultiple: =false
                    Width: =Parent.Width - 80
                    X: =40
                    Y: =CashAdvance_Currency_Label.Y + CashAdvance_Currency_Label.Height + 8
                    ZIndex: =3

                CashAdvance_Currency_Star As label:
                    Align: =Align.Center
                    BorderColor: =RGBA(0, 0, 0, 0)
                    Height: =CashAdvance_Currency_Label.Height
                    Size: =21
                    Text: ="*"
                    Visible: =And(Parent.Required, Parent.DisplayMode = DisplayMode.Edit)
                    Width: =30
                    Wrap: =false
                    Y: =CashAdvance_Currency_Label.Y
                    ZIndex: =4

            Note_DataCard As typedDataCard.textualEditCard:
                BorderStyle: =BorderStyle.Solid
                DataField: ="mserp_note"
                Default: =ThisItem.Note
                DisplayMode: =Parent.DisplayMode
                DisplayName: ="Note"
                Fill: =RGBA(0, 0, 0, 0)
                Height: =120
                Required: =false
                Update: =DataCardValue_CashAdvance_Note.Text
                Width: =Parent.Width
                X: =0
                Y: =4
                ZIndex: =6

                CashAdvance_Note_Label As label:
                    AutoHeight: =true
                    BorderColor: =RGBA(0, 0, 0, 0)
                    Color: =gblParams.dropDownLabelColor
                    Font: =Font.'Segoe UI'
                    Height: =24
                    Size: =21
                    Text: ="Note"
                    Width: =Parent.Width - 60
                    Wrap: =false
                    X: =30
                    Y: =5
                    ZIndex: =1

                DataCardValue_CashAdvance_Note As text:
                    Default: =ThisItem.Note
                    DisplayMode: =Parent.DisplayMode
                    Height: =80
                    Mode: =TextMode.MultiLine
                    Width: =Parent.Width - 80
                    X: =40
                    Y: =CashAdvance_Note_Label.Y + CashAdvance_Note_Label.Height + 8
                    ZIndex: =2

            CompanyCode_DataCard As typedDataCard.textualEditCard:
                BorderStyle: =BorderStyle.Solid
                DataField: ="mserp_dataareaid"
                Default: =varSelectedLegalEntity
                DisplayMode: =Parent.DisplayMode
                DisplayName: ="Company Code"
                Fill: =RGBA(0, 0, 0, 0)
                Height: =0
                Required: =true
                Update: =varSelectedLegalEntity
                Visible: =false
                Width: =Parent.Width
                X: =0
                Y: =5
                ZIndex: =7

    CashAdvanceEdit_ButtonsContainer As groupContainer.manualLayoutContainer:
        Fill: =RGBA(250, 249, 248, 1)
        Height: =225
        LayoutGridColumns: =6
        LayoutGridRows: =6
        Width: =Parent.Width
        Y: =Parent.Height - Self.Height
        ZIndex: =4

        CashAdvanceEdit_SaveDraftButton As button:
            Fill: =RGBA(34, 102, 227, 1)
            Font: =Font.'Segoe UI'
            Height: =76
            OnSelect: |-
                =If(
                    IsBlank(DatePicker_CashAdvance_RequestedDate.SelectedDate) ||
                    IsBlank(ComboBox_CashAdvance_Location.Selected.Location) ||
                    IsBlank(ComboBox_CashAdvance_Purpose.Selected.'Purpose (mserp_value)') && IsBlank(ComboBox_CashAdvance_Purpose.SearchText) ||
                    IsBlank(DataCardValue_CashAdvance_RequestedAmount.Text) ||
                    IsBlank(ComboBox_CashAdvance_Currency.Selected.mserp_currencycode),
                    Notify("Please fill in all required fields", NotificationType.Error, gblParams.notificationTime),
                    SubmitForm(EditCashAdvanceForm)
                )
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Size: =19.15
            Text: ="Save Draft"
            Width: =Parent.Width - Self.X*2
            X: =40
            Y: =20
            ZIndex: =1

        CashAdvanceEdit_SubmitButton As button:
            BorderColor: =RGBA(34, 102, 227, 1)
            Color: =RGBA(34, 102, 227, 1)
            Fill: =Color.White
            Font: =Font.'Segoe UI'
            Height: =76
            OnSelect: |-
                =If(
                    IsBlank(DatePicker_CashAdvance_RequestedDate.SelectedDate) ||
                    IsBlank(ComboBox_CashAdvance_Location.Selected.Location) ||
                    IsBlank(ComboBox_CashAdvance_Purpose.Selected.'Purpose (mserp_value)') && IsBlank(ComboBox_CashAdvance_Purpose.SearchText) ||
                    IsBlank(DataCardValue_CashAdvance_RequestedAmount.Text) ||
                    IsBlank(ComboBox_CashAdvance_Currency.Selected.mserp_currencycode),
                    Notify("Please fill in all required fields", NotificationType.Error, gblParams.notificationTime),
                    SubmitForm(EditCashAdvanceForm)
                )
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Size: =19.15
            Text: ="Submit(추후 적용)"
            Width: =Parent.Width - Self.X*2
            X: =40
            Y: =CashAdvanceEdit_SaveDraftButton.Y + CashAdvanceEdit_SaveDraftButton.Height + 20
            ZIndex: =2

