                LayoutMaxHeight: =0
                LayoutMaxWidth: =0
                maximumHeight: =1136
                maximumWidth: =640
                SelectedDateFill: =App.Theme.Colors.Primary
                Size: =21
                Width: =Parent.Width - Self.X*2
                X: =40
                ZIndex: =2

        SalaryDeductionPeriod_Container As groupContainer.horizontalAutoLayoutContainer:
