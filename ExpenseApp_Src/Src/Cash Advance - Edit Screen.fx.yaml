"'Cash Advance - Edit Screen' As screen.'phoneDetailEditLayout_ver3.0'":
    Fill: =RGBA(248, 248, 248, 1)
    OnVisible: |-
        =UpdateContext({varIsCreateCashAdvance: IsBlank(varSelectedCashAdvance)});

    CashAdvanceEdit_Header As hdr02_Header:
        Fill: =CashAdvanceEdit_Header.paramFill
        paramFill: =RGBA(255, 255, 255, 1)
        paramTitle: |-
            =If(
                varIsCreateCashAdvance,
                "New Cash Advance",
                "Edit Cash Advance"
            )

    CashAdvanceEdit_BackIcon As icon.ChevronLeft:
        AccessibleLabel: ="Press to go back"
        Color: =icongconfig_backbutton.Color
        Fill: =icongconfig_backbutton.Fill
        Height: =icongconfig_backbutton.Height
        Icon: =Icon.ChevronLeft
        OnSelect: =Navigate('Cash Advance - List Screen', ScreenTransition.None)
        TabIndex: =0
        Width: =icongconfig_backbutton.Width
        X: =22.5
        Y: =(CashAdvanceEdit_Header.Height-Self.Height)/2
        ZIndex: =2

    CashAdvanceEdit_Container As groupContainer.verticalAutoLayoutContainer:
        Height: =Parent.Height - CashAdvanceEdit_Header.Height - CashAdvanceEdit_ButtonsButtonsContainer.Height
        LayoutDirection: =LayoutDirection.Vertical
        LayoutMode: =LayoutMode.Auto
        LayoutOverflowY: =LayoutOverflow.Scroll
        Width: =Parent.Width
        Y: =CashAdvanceEdit_Header.Height
        ZIndex: =3

        RequestedDate_Container As groupContainer.verticalAutoLayoutContainer:
            AlignInContainer: =AlignInContainer.SetByContainer
            Height: =100
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =5
            LayoutMode: =LayoutMode.Auto
            PaddingLeft: =30
            PaddingRight: =30
            PaddingTop: =10
            Width: =Parent.Width
            ZIndex: =1

            lbl_RequestedDate As label:
                Font: =Font.'Segoe UI'
                Height: =30
                Size: =14
                Text: ="Requested Date *"
                Width: =Parent.Width - 60
                ZIndex: =1

            dtp_RequestedDate As datepicker:
                DefaultDate: =If(varIsCreateCashAdvance, Today(), varSelectedCashAdvance.'Requested date')
                Height: =50
                Width: =Parent.Width - 60
                ZIndex: =2

        Location_Container As groupContainer.verticalAutoLayoutContainer:
            AlignInContainer: =AlignInContainer.SetByContainer
            Height: =100
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =5
            LayoutMode: =LayoutMode.Auto
            PaddingLeft: =30
            PaddingRight: =30
            PaddingTop: =10
            Width: =Parent.Width
            ZIndex: =2

            lbl_Location As label:
                Font: =Font.'Segoe UI'
                Height: =30
                Size: =14
                Text: ="Location"
                Width: =Parent.Width - 60
                ZIndex: =1

            cb_Location As combobox:
                DefaultSelectedItems: =If(!varIsCreateCashAdvance, LookUp('Travel locations (mserp)', Location = varSelectedCashAdvance.Location), Blank())
                DisplayFields: =["mserp_destination"]
                Height: =50
                InputTextPlaceholder: ="Select Location"
                Items: =Filter('Travel locations (mserp)','Company Code' = varSelectedLegalEntity)
                SearchFields: =["mserp_destination"]
                SearchItems: =Search(Filter('Travel locations (mserp)','Company Code'=varSelectedLegalEntity),cb_Location.SearchText,mserp_destination)
                SelectMultiple: =false
                Width: =Parent.Width - 60
                ZIndex: =2

        Purpose_Container As groupContainer.verticalAutoLayoutContainer:
            AlignInContainer: =AlignInContainer.SetByContainer
            Height: =100
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =5
            LayoutMode: =LayoutMode.Auto
            PaddingLeft: =30
            PaddingRight: =30
            PaddingTop: =10
            Width: =Parent.Width
            ZIndex: =3

            lbl_Purpose As label:
                Font: =Font.'Segoe UI'
                Height: =30
                Size: =14
                Text: ="Purpose"
                Width: =Parent.Width - 60
                ZIndex: =1

            cb_Purpose As combobox:
                DefaultSelectedItems: =If(!varIsCreateCashAdvance, LookUp('DimAttributeTrvTravelTxtEntity (mserp)', 'Purpose (mserp_value)' = varSelectedCashAdvance.Purpose), Blank())
                DisplayFields: =["mserp_value"]
                Height: =50
                InputTextPlaceholder: ="Select Purpose"
                Items: =Filter('DimAttributeTrvTravelTxtEntity (mserp)', 'Company Code' = varSelectedLegalEntity)
                SearchFields: =["mserp_value"]
                SearchItems: =Search(Filter('DimAttributeTrvTravelTxtEntity (mserp)','Company Code'=varSelectedLegalEntity),cb_Purpose.SearchText,mserp_value)
                SelectMultiple: =false
                Width: =Parent.Width - 60
                ZIndex: =2

        RequestedAmount_Container As groupContainer.verticalAutoLayoutContainer:
            AlignInContainer: =AlignInContainer.SetByContainer
            Height: =100
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =5
            LayoutMode: =LayoutMode.Auto
            PaddingLeft: =30
            PaddingRight: =30
            PaddingTop: =10
            Width: =Parent.Width
            ZIndex: =4

            lbl_RequestedAmount As label:
                Font: =Font.'Segoe UI'
                Height: =30
                Size: =14
                Text: ="Requested Amount *"
                Width: =Parent.Width - 60
                ZIndex: =1

            txt_RequestedAmount As text:
                Default: =If(varIsCreateCashAdvance, "", Text(varSelectedCashAdvance.'Requested amount'))
                Format: =TextFormat.Number
                Height: =50
                HintText: ="0.00"
                Width: =Parent.Width - 60
                ZIndex: =2

        Currency_Container As groupContainer.verticalAutoLayoutContainer:
            AlignInContainer: =AlignInContainer.SetByContainer
            Height: =100
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =5
            LayoutMode: =LayoutMode.Auto
            PaddingLeft: =30
            PaddingRight: =30
            PaddingTop: =10
            Width: =Parent.Width
            ZIndex: =5

            lbl_Currency As label:
                Font: =Font.'Segoe UI'
                Height: =30
                Size: =14
                Text: ="Currency"
                Width: =Parent.Width - 60
                ZIndex: =1

            cb_Currency As combobox:
                DefaultSelectedItems: =LookUp('Currencies (mserp)', 'Currency code' = Coalesce(varSelectedCashAdvance.Currency, varDefaultCurrency))
                DisplayFields: =["mserp_currencycode"]
                Height: =50
                InputTextPlaceholder: ="Find items"
                Items: =ShowColumns('Currencies (mserp)','Currency code',Name)
                SearchFields: =["mserp_currencycode"]
                SearchItems: =Search(ShowColumns('Currencies (mserp)','Currency code',Name),cb_Currency.SearchText,mserp_currencycode)
                SelectMultiple: =false
                Width: =Parent.Width - 60
                ZIndex: =2

    CashAdvanceEdit_ButtonsButtonsContainer As groupContainer.manualLayoutContainer:
        Fill: =RGBA(250, 249, 248, 1)
        Height: =225
        LayoutGridColumns: =6
        LayoutGridRows: =6
        Width: =Parent.Width
        Y: =Parent.Height - Self.Height
        ZIndex: =4

        CashAdvanceEdit_SaveDraftButton As button:
            Fill: =RGBA(34, 102, 227, 1)
            Font: =Font.'Segoe UI'
            Height: =76
            OnSelect: |-
                =If(
                    IsBlank(dtp_RequestedDate.SelectedDate) || IsBlank(txt_RequestedAmount.Text),
                    Notify("Please fill in all required fields (Requested Date, Amount)", NotificationType.Error, gblParams.notificationTime),
                    
                    If(varIsCreateCashAdvance,
                        Patch(
                            'DCSL TrvCash Advance Entity  (mserp)',
                            Defaults('DCSL TrvCash Advance Entity  (mserp)'),
                            {
                                mserp_requesteddate: DateTime(Year(dtp_RequestedDate.SelectedDate), Month(dtp_RequestedDate.SelectedDate), Day(dtp_RequestedDate.SelectedDate), 0, 0, 0),
                                mserp_location: If(IsBlank(cb_Location.Selected.Location), cb_Location.SearchText, cb_Location.Selected.Location),
                                mserp_purpose: If(IsBlank(cb_Purpose.Selected.'Purpose (mserp_value)'), cb_Purpose.SearchText, cb_Purpose.Selected.'Purpose (mserp_value)'),
                                mserp_requestedamount: Value(txt_RequestedAmount.Text),
                                mserp_currency: If(IsBlank(cb_Currency.Selected.mserp_currencycode), varDefaultCurrency, cb_Currency.Selected.mserp_currencycode),
                                mserp_cashadvancestatus: 'Cash advance status (mserp)'.Created
                            }
                        ),
                        Patch(
                            'DCSL TrvCash Advance Entity  (mserp)',
                            varSelectedCashAdvance,
                            {
                                mserp_requesteddate: DateTime(Year(dtp_RequestedDate.SelectedDate), Month(dtp_RequestedDate.SelectedDate), Day(dtp_RequestedDate.SelectedDate), 0, 0, 0),
                                mserp_location: If(IsBlank(cb_Location.Selected.Location), cb_Location.SearchText, cb_Location.Selected.Location),
                                mserp_purpose: If(IsBlank(cb_Purpose.Selected.'Purpose (mserp_value)'), cb_Purpose.SearchText, cb_Purpose.Selected.'Purpose (mserp_value)'),
                                mserp_requestedamount: Value(txt_RequestedAmount.Text),
                                mserp_currency: If(IsBlank(cb_Currency.Selected.mserp_currencycode), varSelectedCashAdvance.Currency, cb_Currency.Selected.mserp_currencycode)
                            }
                        )
                    );
                    Notify("Cash Advance saved successfully", NotificationType.Success, gblParams.notificationTime);
                    Navigate('Cash Advance - List Screen', ScreenTransition.None)
                )
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Size: =19.15
            Text: ="Save Draft"
            Width: =Parent.Width - Self.X*2
            X: =40
            Y: =20
            ZIndex: =1

        CashAdvanceEdit_SubmitButton As button:
            BorderColor: =RGBA(34, 102, 227, 1)
            Color: =RGBA(34, 102, 227, 1)
            Fill: =Color.White
            Font: =Font.'Segoe UI'
            Height: =76
            OnSelect: |-
                =If(
                    IsBlank(dtp_RequestedDate.SelectedDate) || IsBlank(txt_RequestedAmount.Text),
                    Notify("Please fill in all required fields (Requested Date, Amount)", NotificationType.Error, gblParams.notificationTime),
                    
                    If(varIsCreateCashAdvance,
                         Set(varLastSubmittedCashAdvance, 
                             Patch(
                                'DCSL TrvCash Advance Entity  (mserp)',
                                Defaults('DCSL TrvCash Advance Entity  (mserp)'),
                                {
                                    mserp_requesteddate: DateTime(Year(dtp_RequestedDate.SelectedDate), Month(dtp_RequestedDate.SelectedDate), Day(dtp_RequestedDate.SelectedDate), 0, 0, 0),
                                    mserp_location: If(IsBlank(cb_Location.Selected.Location), cb_Location.SearchText, cb_Location.Selected.Location),
                                    mserp_purpose: If(IsBlank(cb_Purpose.Selected.'Purpose (mserp_value)'), cb_Purpose.SearchText, cb_Purpose.Selected.'Purpose (mserp_value)'),
                                    mserp_requestedamount: Value(txt_RequestedAmount.Text),
                                    mserp_currency: If(IsBlank(cb_Currency.Selected.mserp_currencycode), varDefaultCurrency, cb_Currency.Selected.mserp_currencycode),
                                    mserp_cashadvancestatus: 'Cash advance status (mserp)'.Created,
                                    mserp_workflowaction: "Submit"
                                }
                            )
                        ),
                        Patch(
                            'DCSL TrvCash Advance Entity  (mserp)',
                            varSelectedCashAdvance,
                            {
                                mserp_requesteddate: DateTime(Year(dtp_RequestedDate.SelectedDate), Month(dtp_RequestedDate.SelectedDate), Day(dtp_RequestedDate.SelectedDate), 0, 0, 0),
                                mserp_location: If(IsBlank(cb_Location.Selected.Location), cb_Location.SearchText, cb_Location.Selected.Location),
                                mserp_purpose: If(IsBlank(cb_Purpose.Selected.'Purpose (mserp_value)'), cb_Purpose.SearchText, cb_Purpose.Selected.'Purpose (mserp_value)'),
                                mserp_requestedamount: Value(txt_RequestedAmount.Text),
                                mserp_currency: If(IsBlank(cb_Currency.Selected.mserp_currencycode), varSelectedCashAdvance.Currency, cb_Currency.Selected.mserp_currencycode),
                                mserp_workflowaction: "Submit"
                            }
                        )
                    );
                    
                    Notify("Cash Advance submitted successfully", NotificationType.Success, gblParams.notificationTime);
                    Navigate('Cash Advance - List Screen', ScreenTransition.None)
                )
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Size: =19.15
            Text: ="Submit"
            Width: =Parent.Width - Self.X*2
            X: =40
            Y: =CashAdvanceEdit_SaveDraftButton.Y + CashAdvanceEdit_SaveDraftButton.Height + 20
            ZIndex: =2

