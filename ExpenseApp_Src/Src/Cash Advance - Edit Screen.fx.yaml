    CashAdvanceEdit_ButtonsButtonsContainer As groupContainer.manualLayoutContainer:
        Fill: =RGBA(250, 249, 248, 1)
        Height: =225
        LayoutGridColumnMinWidth: =0
        LayoutGridColumns: =6
        LayoutGridRowMinHeight: =0
        LayoutGridRows: =6
        Width: =Parent.Width
        Y: =Parent.Height - Self.Height
        ZIndex: =4

        CashAdvanceEdit_SaveDraftButton As button:
            Fill: =RGBA(34, 102, 227, 1)
            Font: =Font.'Segoe UI'
            Height: =76
            OnSelect: |-
                =If(
                    IsBlank(dtp_RequestedDate.SelectedDate) || IsBlank(txt_RequestedAmount.Text) || IsEmpty(cb_CostCenter.SelectedItems),
                    Notify("Please fill in all required fields (Requested Date, Amount)", NotificationType.Error, gblParams.notificationTime),
                    
                    Patch(
                        'DCSL TrvCash Advance Entity  (mserp)',
                        If(varIsCreateCashAdvance, Defaults('DCSL TrvCash Advance Entity  (mserp)'), varSelectedCashAdvance),
                        {
                            'Requested date': DateTime(Year(dtp_RequestedDate.SelectedDate), Month(dtp_RequestedDate.SelectedDate), Day(dtp_RequestedDate.SelectedDate), 0, 0, 0),
                            Location: If(IsBlank(cb_Location.Selected.Location), cb_Location.SearchText, cb_Location.Selected.Location),
                            Purpose: If(IsBlank(cb_Purpose.Selected.'Purpose (mserp_value)'), cb_Purpose.SearchText, cb_Purpose.Selected.'Purpose (mserp_value)'),
                            'Requested amount': Value(txt_RequestedAmount.Text),
                            Currency: If(IsBlank(cb_Currency.Selected.mserp_currencycode), If(varIsCreateCashAdvance, varDefaultCurrency, varSelectedCashAdvance.Currency), cb_Currency.Selected.mserp_currencycode),
                            'Collection method': cb_CollectionMethod.Selected.Value,
                            'Collection/Transfer Date (mserp_deexcollectiontransferdate)': DateTime(Year(dtp_CollectionTrasferDate.SelectedDate), Month(dtp_CollectionTrasferDate.SelectedDate), Day(dtp_CollectionTrasferDate.SelectedDate), 0, 0, 0),
                            'Collection/Transfer Date (mserp_deexsalarydeductionperiod)': cb_SalaryDeductionPeriod.Selected.Value,
                            CostCenter: cb_CostCenter.Selected.mserp_dimensionvalue,
                            Project: cb_ProjectCode.Selected.mserp_projectvalue
                        }
                    );
                    Notify("Cash Advance saved successfully", NotificationType.Success, gblParams.notificationTime);
                    Navigate('Cash Advance - List Screen', ScreenTransition.None)
                )
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Size: =19.15
            Text: ="Save Draft"
            Width: =Parent.Width - Self.X*2
            X: =40
            Y: =20
            ZIndex: =1

        CashAdvanceEdit_SubmitButton As button:
            BorderColor: =RGBA(34, 102, 227, 1)
            Color: =RGBA(34, 102, 227, 1)
            Fill: =Color.White
            Font: =Font.'Segoe UI'
            Height: =76
            OnSelect: |-
                =If(
                    IsBlank(dtp_RequestedDate.SelectedDate) || IsBlank(txt_RequestedAmount.Text) || IsEmpty(cb_CostCenter.SelectedItems),
                    Notify("Please fill in all required fields (Requested Date, Amount)", NotificationType.Error, gblParams.notificationTime),
                    
                    // 1단계: 기존 데이터를 생성하거나 수정하고, 그 결과를 'ctxSavedRecord' 변수에 저장합니다.
                    // (이때 mserp_workflowaction 필드는 업데이트하지 않습니다.)
                    UpdateContext({
                        ctxSavedRecord: Patch(
                            'DCSL TrvCash Advance Entity  (mserp)',
                            If(varIsCreateCashAdvance, Defaults('DCSL TrvCash Advance Entity  (mserp)'), varSelectedCashAdvance),
                            {
                                'Requested date': DateTime(Year(dtp_RequestedDate.SelectedDate), Month(dtp_RequestedDate.SelectedDate), Day(dtp_RequestedDate.SelectedDate), 0, 0, 0),
                                Location: If(IsBlank(cb_Location.Selected.Location), cb_Location.SearchText, cb_Location.Selected.Location),
                                Purpose: If(IsBlank(cb_Purpose.Selected.'Purpose (mserp_value)'), cb_Purpose.SearchText, cb_Purpose.Selected.'Purpose (mserp_value)'),
                                'Requested amount': Value(txt_RequestedAmount.Text),
                                Currency: If(IsBlank(cb_Currency.Selected.mserp_currencycode), If(varIsCreateCashAdvance, varDefaultCurrency, varSelectedCashAdvance.Currency), cb_Currency.Selected.mserp_currencycode),
                                'Collection method': cb_CollectionMethod.Selected.Value,
                                'Collection/Transfer Date (mserp_deexcollectiontransferdate)': DateTime(Year(dtp_CollectionTrasferDate.SelectedDate), Month(dtp_CollectionTrasferDate.SelectedDate), Day(dtp_CollectionTrasferDate.SelectedDate), 0, 0, 0),
                                'Collection/Transfer Date (mserp_deexsalarydeductionperiod)': cb_SalaryDeductionPeriod.Selected.Value,
                                CostCenter: cb_CostCenter.Selected.mserp_dimensionvalue,
                                Project: cb_ProjectCode.Selected.mserp_projectvalue
                            }
                        )
                    });
                    
                    // 2단계: 위에서 저장된 레코드(ctxSavedRecord)를 타겟으로 WorkflowAction을 "Submit"으로 업데이트합니다.
                    Patch(
                        'DCSL TrvCash Advance Entity  (mserp)',
                        ctxSavedRecord,
                        {
                            WorkflowAction: "Submit"
                        }
                    );
                    
                    // 3단계: 성공 알림 및 화면 이동
                    Notify("Cash Advance submitted successfully", NotificationType.Success, gblParams.notificationTime);
                    Navigate('Cash Advance - List Screen', ScreenTransition.None)
                )
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Size: =19.15
            Text: ="Submit"
            Width: =Parent.Width - Self.X*2
            X: =40
            Y: =CashAdvanceEdit_SaveDraftButton.Y + CashAdvanceEdit_SaveDraftButton.Height + 20
            ZIndex: =2

    scr17_cmp02_CancelDialog_2 As cmp02_ConfirmationDialog:
        ContentLanguage: =""
        controlName: ="scr17_cmp02_CancelDialog_1"
        EnableChildFocus: =true
        OnLeftButtonClick: |-
            =UpdateContext({ctVarExpenseDetailsBack: false});
        OnRightButtonClick: |-
            =UpdateContext({ctVarExpenseDetailsBack: false});
            Navigate('Cash Advance - List Screen', ScreenTransition.None)
        parmInDescriptionText: ="All unsaved changes will be lost."
        parmInHeaderText: ="Do you want to go back?"
        parmInLeftButtonColor: =RGBA(34, 102, 227, 1)
        parmInLeftButtonText: ="No"
        parmInRightButtonColor: =RGBA(195, 39, 39, 1)
        parmInRightButtonText: ="Yes"
        returnFocus: ="scr17_ico_Back_1"
        Visible: =ctVarCashDetailsBack
        Y: =0
        ZIndex: =5

