"'Cash Advance - Edit Screen' As screen.'phoneDetailEditLayout_ver3.0'":
    Fill: =RGBA(248, 248, 248, 1)
    OnVisible: |-
        =UpdateContext({ctVarCashDetailsBack:false});
        UpdateContext({varIsCreateCashAdvance: IsBlank(varSelectedCashAdvance)});
        Reset(dtp_RequestedDate);
        Reset(cb_Location);
        Reset(cb_Purpose);
        Reset(txt_RequestedAmount);
        Reset(cb_Currency);

    CashAdvanceEdit_Header As hdr02_Header:
        Fill: =CashAdvanceEdit_Header.paramFill
        paramFill: =RGBA(255, 255, 255, 1)
        paramTitle: |-
            =If(
                varIsCreateCashAdvance,
                "New Cash Advance Request",
                "Edit Cash Advance Request"
            )

    CashAdvanceEdit_BackIcon As icon.ChevronLeft:
        AccessibleLabel: ="Press to go back"
        Color: =icongconfig_backbutton.Color
        Fill: =icongconfig_backbutton.Fill
        Height: =icongconfig_backbutton.Height
        Icon: =Icon.ChevronLeft
        OnSelect: |-
            =If(
                varIsCreateCashAdvance, 
                UpdateContext({ctVarCashDetailsBack: true}),          // 신규 모드면: 다이얼로그 변수 True
                Navigate('Cash Advance - List Screen', ScreenTransition.None) // 수정 모드면: 즉시 이동
            )
        TabIndex: =0
        Width: =icongconfig_backbutton.Width
        X: =22.5
        Y: =(CashAdvanceEdit_Header.Height-Self.Height)/2
        ZIndex: =2

    CashAdvanceEdit_Container As groupContainer.verticalAutoLayoutContainer:
        Height: =Parent.Height - CashAdvanceEdit_Header.Height - CashAdvanceEdit_ButtonsButtonsContainer.Height
        LayoutDirection: =LayoutDirection.Vertical
        LayoutGridColumnMinWidth: =0
        LayoutGridRowMinHeight: =0
        LayoutMode: =LayoutMode.Auto
        LayoutOverflowY: =LayoutOverflow.Scroll
        Width: =Parent.Width
        Y: =CashAdvanceEdit_Header.Height
        ZIndex: =3

        CollectionMethod_Container As groupContainer.horizontalAutoLayoutContainer:
            AlignInContainer: =AlignInContainer.SetByContainer
            Height: =LblContainer_CollectionMethod.Height + cb_CollectionMethod.Height + 20
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =10
            LayoutGridColumnMinWidth: =0
            LayoutGridColumns: =6
            LayoutGridRowMinHeight: =0
            LayoutGridRows: =6
            LayoutMaxHeight: =0
            LayoutMaxWidth: =0
            LayoutMode: =LayoutMode.Auto
            maximumHeight: =11360
            maximumWidth: =640
            PaddingLeft: =25
            Width: =Parent.Width
            ZIndex: =1

            LblContainer_CollectionMethod As groupContainer.horizontalAutoLayoutContainer:
                AlignInContainer: =AlignInContainer.SetByContainer
                Height: =35
                LayoutAlignItems: =LayoutAlignItems.Center
                LayoutGridColumnMinWidth: =0
                LayoutGridColumns: =6
                LayoutGridRowMinHeight: =0
                LayoutGridRows: =6
                LayoutMaxHeight: =0
                LayoutMaxWidth: =0
                LayoutMode: =LayoutMode.Auto
                maximumHeight: =11360
                maximumWidth: =640
                Width: =Parent.Width
                ZIndex: =1

                lbl_CollectionMethod As label:
                    Font: =Font.'Segoe UI'
                    Height: =32
                    LayoutMaxHeight: =0
                    LayoutMaxWidth: =0
                    Size: =18
                    Text: ="Collection Method"
                    VerticalAlign: =VerticalAlign.Top
                    Width: =Parent.Width
                    ZIndex: =1

            cb_CollectionMethod As combobox:
                DefaultSelectedItems: =If(!varIsCreateCashAdvance, [varSelectedCashAdvance.'Collection method'])
                DisplayFields: =["Value"]
                FillPortions: =1
                Height: =Min('Cash Advance - Edit Screen'.Height * 0.0616, 50)
                InputTextPlaceholder: ="Select method"
                Items: =Choices('DCSL TrvCash Advance Entity  (mserp)'.'Collection method')
                LayoutMaxHeight: =0
                LayoutMaxWidth: =0
                SearchFields: =["Value"]
                SearchItems: =Choices('DCSL TrvCash Advance Entity  (mserp)'.'Collection method',cb_CollectionMethod.SearchText)
                SelectMultiple: =false
                Size: =21
                Width: =Parent.Width - Self.X*2
                X: =40
                ZIndex: =2

        CollectionTransferDate_Container As groupContainer.horizontalAutoLayoutContainer:
            AlignInContainer: =AlignInContainer.SetByContainer
            Height: =LblContainer_CollectionTrasferDate.Height + dtp_CollectionTrasferDate.Height + 20
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =10
            LayoutGridColumnMinWidth: =0
            LayoutGridColumns: =6
            LayoutGridRowMinHeight: =0
            LayoutGridRows: =6
            LayoutMaxHeight: =0
            LayoutMaxWidth: =0
            LayoutMode: =LayoutMode.Auto
            maximumHeight: =11360
            maximumWidth: =640
            PaddingLeft: =25
            Width: =Parent.Width
            ZIndex: =2

            LblContainer_CollectionTrasferDate As groupContainer.horizontalAutoLayoutContainer:
                AlignInContainer: =AlignInContainer.SetByContainer
                Height: =50
                LayoutAlignItems: =LayoutAlignItems.Center
                LayoutGridColumnMinWidth: =0
                LayoutGridColumns: =6
                LayoutGridRowMinHeight: =0
                LayoutGridRows: =6
                LayoutMaxHeight: =0
                LayoutMaxWidth: =0
                LayoutMode: =LayoutMode.Auto
                maximumHeight: =11360
                maximumWidth: =640
                Width: =Parent.Width
                ZIndex: =1

                lbl_CollectionTrasferDate As label:
