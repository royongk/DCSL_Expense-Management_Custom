        AccessibleLabel: ="Filter by cash advance status"
        Default: =Blank()
        DisplayFields: =["DisplayName"]
        Font: =Font.'Segoe UI'
        Height: =44
        InputTextPlaceholder: ="Filter by Status"
        Items: |-
            =//Table(
            //    {Value: Blank(), DisplayName: "All"},
            //    {Value: 'Cash advance status (mserp)'.Draft, DisplayName: "Draft"},
            //    {Value: 'Cash advance status (mserp)'.Submitted, DisplayName: "Submitted"},
            //    {Value: 'Cash advance status (mserp)'.'In review', DisplayName: "In review"},
            //    {Value: 'Cash advance status (mserp)'.Approved, DisplayName: "Approved"},
            //    {Value: 'Cash advance status (mserp)'.Returned, DisplayName: "Returned"},
            //    {Value: 'Cash advance status (mserp)'.Ordered, DisplayName: "Ordered"},
            //    {Value: 'Cash advance status (mserp)'.'Ready to pay', DisplayName: "Ready to pay"},
            //    {Value: 'Cash advance status (mserp)'.Paid, DisplayName: "Paid"}
            //)
            
            colCashAdvanceStatusOptions
        OnChange: |-
            =//UpdateContext({varCashAdvanceStatusFilter: Self.Selected.Value});
            UpdateContext({varCntSelect: false});
            Clear(colSelectedCashAdvanceIds)
        SearchFields: =["DisplayName"]
