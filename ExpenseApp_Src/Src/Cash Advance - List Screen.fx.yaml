                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        LayoutMinHeight: =70
                        LayoutMinWidth: =560
                        OnSelect: =Select(scrCashAdvance_shp_SelectRegion)
                        PaddingLeft: =15
                        PaddingRight: =0
                        Size: =21
                        TabIndex: =If(IsBlank(Self.Text), -1, 0)
                        Text: =ThisItem.'Cash advance number'
                        Width: =Parent.Width
