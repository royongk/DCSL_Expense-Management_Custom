                    OnSelect: =Select(scrCashAdvance_shp_SelectRegion);
                    PaddingBottom: =15
                    PaddingTop: =15
                    Visible: =!varCntSelect
                    ZIndex: =6

            scrCashAdvance_shp_GalleryBaseSeparator_1 As rectangle:
                AlignInContainer: =AlignInContainer.Center
                Fill: =RGBA(225, 225, 225, 1)
                Height: =1
                LayoutMaxHeight: =
                LayoutMaxWidth: =
                LayoutMinHeight: =1
                Width: =Parent.Width - 10
                ZIndex: =2

        scrCashAdvance_shp_SelectRegion As rectangle:
