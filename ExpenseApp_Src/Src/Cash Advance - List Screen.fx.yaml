    scrCashAdvance_chk_SelectAll As checkbox:
        BorderStyle: =BorderStyle.None
        CheckboxBackgroundFill: =If(Self.Value, RGBA(34, 102, 227, 1), Color.White)
        CheckboxBorderColor: =RGBA(34, 102, 227, 1)
        CheckboxSize: =42
        CheckmarkFill: =Color.White
        Height: =35
        OnCheck: |-
            =Clear(colSelectedCashAdvanceIds);
            ForAll(
                Filter(
                    scrCashAdvance_Gallery.AllItems,
                    'Cash advance status' = 'Cash advance status (mserp)'.Draft
                ),
