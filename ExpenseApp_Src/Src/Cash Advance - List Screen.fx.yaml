            If(
                App.Width > 640,
                // PC: 콤보박스와 같은 높이 (윗줄)
                scrCashAdvance_shp_Rectangle.Y + 10,
                // Mobile: 콤보박스 아래로 내려감 (아랫줄)
                ComboBox_CashAdvanceStatusFilter.Y + ComboBox_CashAdvanceStatusFilter.Height + 10
            )
        ZIndex: =13

