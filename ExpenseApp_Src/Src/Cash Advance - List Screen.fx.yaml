"'Cash Advance - List Screen' As screen.'phoneBrowseLayout_ver3.0'":
    Fill: =Color.White
    OnVisible: |-
        =// =========================================================================
        // 1. 공통 앱 파라미터 및 전역 변수 초기화 (Expenses Screen과 동일 로직)
        // =========================================================================
        
        // 현재 선택된 메뉴(AppMode)에 맞는 D365 Expense Type 텍스트 결정
        Set(
            varTargetExpenseType,
            Switch(
                varAppMode,
                "AirfareAllowance", "Allowance",
                "BillingTripSettlement", "Billing Trip Settlement",
                "CashAdvance", "Cash Advance",
                "EmployeeBenefit", "Employee Benefit",
                "SalaryAdvance", "Salary Advance",
                "ExpenseReport", "Expense Reimbursement", 
                Blank()
            )
        );
        
        // 해당 Type에 매핑된 카테고리(Expense category) 목록을 로컬 컬렉션에 저장
        ClearCollect(
            colMappedCategories,
            Filter(
                'DCSL Expense Category Mapping Setup Entity (mserp)',
                'Expense Type' = varTargetExpenseType
            )
        );
        
        // 공통 UI 테마 및 동작 파라미터 설정
        Set(
            gblParams,
            {
                dropDownHeight : 60,
                dorpDownBorderThickness : 2,
                dropDownBorderColor : RGBA(34, 102, 227, 1),
                dropDownLabelColor : Color.Black,
                dropDownHoverFill : RGBA(204, 222, 255, 1),
                errorMessageSize : 18,
                dropDownFontSize : 24,
                expenseDataCardViewOnly: RGBA(110, 110, 110, 1),
                notificationTime : 4000
            }
        );
        
        // 화면 동작 제어용 컨텍스트 변수 초기화
        UpdateContext({varOnShowFields : false});
        UpdateContext({varOnSelectTriggered : false});
        UpdateContext({varOnChangeTriggered : false});
        Set(varExpenseButtonClicked, false);
        Set(varDefaultSalesTaxGroup, Blank());
        Set(varItemSalesTaxDefaultValue, Blank());
        Set(varSelectedExpenseDoc, Blank());
        
        Set(
            varDefaultSalesTaxGroupUserContext,
            userRecord.WorkerDefaultTaxGroup
        );
        
        // 관리 매개변수 데이터 리프레시
        Refresh('Expense management parameters (mserp)');
        
        
        // =========================================================================
        // 2. Cash Advance - List Screen 고유 초기화 및 데이터 로드
        // =========================================================================
        
        // 선택 및 필터 상태 초기화
        UpdateContext({varCntSelect: false});
        UpdateContext({varCashAdvanceStatusFilter: ""});
        UpdateContext({varCashAdvanceDateFilterStart: Blank()});
        UpdateContext({varCashAdvanceDateFilterEnd: Blank()});
        UpdateContext({varCashAdvanceShowDateFilter: false});
        Set(varSelectedCashAdvance, Blank());
        UpdateContext({varCntDelete: false});
        
        // Cash Advance 데이터 로드
        Refresh('Cash advances (mserp)');
        Clear(colSelectedCashAdvanceIds);
        Reset(scrCashAdvance_Gallery);
        Reset(ComboBox_CashAdvanceStatusFilter);
        
        // ★ 하단 네비게이션 Footer 탭 번호를 Cash Advance 목적에 맞게 4로 강제 지정
        Set(varSelectedTab, 4);
        
        // 상태 필터용 콤보박스 옵션 컬렉션 생성 (All + 선택 항목)
        ClearCollect(
            colCashAdvanceStatusOptions,
            {
                Value: Coalesce(Blank(), LookUp(Choices('Cash advances (mserp)'.'Cash advance status'), true, Value)), 
                DisplayName: "All"
            }
        );
        
        Collect(
            colCashAdvanceStatusOptions,
            ForAll(
                Choices('Cash advances (mserp)'.'Cash advance status'),
                {
                    Value: Value,
                    DisplayName: Text(Value)
                }
            )
        );

    emptyStateComponent_CashAdvance As emptyStateComponent:
        subTitle: |-
            =If(
                varAppMode = "SalaryAdvance",
                "No Salary Advance Purpose available",
                "No cash advances Purpose available"
            )
        title: |-
            =GlobalLabels.Labels.'15062:LocalizedName,msdyn_NothingHereYetLabel'
        Visible: =scrCashAdvance_Gallery.AllItemsCount <= 0
        X: |
            =(Parent.Width - Self.Width)/2
        Y: |
            =scrCashAdvance_Gallery.Y + (Parent.Height - scrCashAdvance_hdr_TopHeader.Height - scrCashAdvance_cmp_Footer_1.Height - Self.Height)/2

    "scrCashAdvance_Gallery As gallery.'BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0'":
        '#CopilotOverlayLabel': ="Filtered"
        AccessibleLabel: ="List of cash advances"
        Default: ={}
        DelayItemLoading: =true
        Height: |-
            =Min(
                scrCashAdvance_cmp_Footer_1.Y - Self.Y,
                Self.TemplateHeight * CountRows(Self.AllItems)
            )
        Items: |-
            =SortByColumns(
                Filter(
                    'DCSL TrvCash Advance Entity  (mserp)',
                    // 1. 법인 필터
                    'Company (mserp_company)' = Upper(varSelectedLegalEntity),
                    
                    // 2. 상태 필터 (다중 선택 지원 로직으로 변경)
                    (
                        // A. 아무것도 선택하지 않았으면 전체 표시
                        IsEmpty(ComboBox_CashAdvanceStatusFilter.SelectedItems) ||
                        
                        // B. "All" (Value가 Blank인 항목)이 선택 목록에 포함되어 있으면 전체 표시
                        CountRows(Filter(ComboBox_CashAdvanceStatusFilter.SelectedItems, IsBlank(Value))) > 0 ||
                        
                        // C. 그 외: 현재 행의 상태가 선택된 목록 안에 있는지 확인 (in 연산자)
                        'Cash advance status' in ComboBox_CashAdvanceStatusFilter.SelectedItems.Value
                    ),
                    
                    // 3. 날짜 범위 필터 (이전에 수정한 로직 유지)
                    (
                        IsBlank(varCashAdvanceDateFilterStart) || 
                        'Requested date' >= varCashAdvanceDateFilterStart
                    ) &&
                    (
                        IsBlank(varCashAdvanceDateFilterEnd) || 
                        'Requested date' < DateAdd(varCashAdvanceDateFilterEnd, 1, TimeUnit.Days)
                    ),
            
                    // 4. 로그인한 사용자 필터
                    Employee = userRecord.CreatingWorker,
            
                    // 5. ★ AppMode에 따른 Purpose 필터 추가
                    Purpose = If(varAppMode = "SalaryAdvance", "Salary Advance", "Cash Advance")
                ),
                "mserp_requesteddate", 
                SortOrder.Descending
            )
        Layout: =Layout.Vertical
        LoadingSpinner: =LoadingSpinner.Data
        OnSelect: |-
            =If(
                varCntSelect,
                If(
                    IsBlank(LookUp(colSelectedCashAdvanceIds, cashAdvanceNumber = ThisItem.'Cash advance number')),
                    Collect(colSelectedCashAdvanceIds, {cashAdvanceNumber: ThisItem.'Cash advance number'}),
                    RemoveIf(colSelectedCashAdvanceIds, cashAdvanceNumber = ThisItem.'Cash advance number')
                ),
                Set(varSelectedCashAdvance, ThisItem);
                If(
                    ThisItem.'Cash advance status' = 'Cash advance status (mserp)'.Draft,
                    Set(varIsCreateCashAdvance, false);
                    Navigate('Cash Advance - Edit Screen', ScreenTransition.Fade),
            
                    // Draft가 아니면 (Submitted, In Review 등) 무조건 View Only Screen으로 이동
                    Navigate('Cash Advance - View Only Screen', ScreenTransition.Fade)
                )
            )
        TemplatePadding: =0
        TemplateSize: =150
        Width: =Parent.Width
        Y: =scr16_rct_seprator_3.Y
        ZIndex: =2

        Container11_CashAdvance As groupContainer.verticalAutoLayoutContainer:
            Height: =150
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGridColumnMinWidth: =0
            LayoutGridColumns: =6
            LayoutGridRowMinHeight: =0
            LayoutGridRows: =6
            LayoutMode: =LayoutMode.Auto
            Width: =Parent.Width
            ZIndex: =2

            Container6_CashAdvance As groupContainer.horizontalAutoLayoutContainer:
                Height: =Parent.Height - scrCashAdvance_shp_GalleryBaseSeparator_1.Height
                LayoutGridColumnMinWidth: =0
                LayoutGridColumns: =6
                LayoutGridRowMinHeight: =0
                LayoutGridRows: =6
                LayoutMaxHeight: =
                LayoutMaxWidth: =
                LayoutMinHeight: =112
                LayoutMinWidth: =250
                LayoutMode: =LayoutMode.Auto
                Width: =Parent.Width
                ZIndex: =1

                shpBorder_CashAdvance As rectangle:
                    Fill: =Color.Transparent
                    Height: =Parent.Height
                    LayoutMaxHeight: =
                    LayoutMaxWidth: =
                    Width: =10
                    ZIndex: =1

                scrCashAdvance_chk_Select As checkbox:
                    AlignInContainer: =AlignInContainer.Center
                    BorderStyle: =BorderStyle.None
                    CheckboxBackgroundFill: =If(Self.Value, RGBA(34, 102, 227, 1), Color.White)
                    CheckboxBorderColor: =RGBA(34, 102, 227, 1)
                    CheckboxSize: =42
                    CheckmarkFill: =Color.White
                    Color: =RGBA(34, 102, 227, 1)
                    Default: =!IsEmpty(Filter(colSelectedCashAdvanceIds, cashAdvanceNumber = ThisItem.'Cash advance number'))
