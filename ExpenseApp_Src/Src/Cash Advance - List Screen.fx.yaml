                    VerticalAlign: =VerticalAlign.Bottom
                    Visible: =varCntSelect
                    Width: =43
                    X: =18
                    Y: =40
                    ZIndex: =2

                Container7_CashAdvance As groupContainer.verticalAutoLayoutContainer:
                    Height: =225
                    LayoutDirection: =LayoutDirection.Vertical
                    LayoutGridColumnMinWidth: =0
                    LayoutGridColumns: =6
                    LayoutGridRowMinHeight: =0
                    LayoutGridRows: =6
                    LayoutJustifyContent: =LayoutJustifyContent.Center
                    LayoutMaxHeight: =
                    LayoutMaxWidth: =
                    LayoutMinHeight: =112
                    LayoutMinWidth: =250
                    LayoutMode: =LayoutMode.Auto
                    ZIndex: =4

                    Label_CashAdvanceNumber As label:
                        AutoHeight: =true
                        Font: =Font.'Segoe UI'
