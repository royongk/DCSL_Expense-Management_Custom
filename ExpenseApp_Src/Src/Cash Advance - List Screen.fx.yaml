                Container9_CashAdvance As groupContainer.verticalAutoLayoutContainer:
                    FillPortions: =0
                    Height: =225
                    LayoutAlignItems: =LayoutAlignItems.Center
                    LayoutDirection: =LayoutDirection.Vertical
                    LayoutGridColumns: =6
                    LayoutGridRows: =6
                    LayoutJustifyContent: =LayoutJustifyContent.Center
                    LayoutMaxHeight: =
                    LayoutMaxWidth: =
                    LayoutMinHeight: =112
                    LayoutMinWidth: =250
                    LayoutMode: =LayoutMode.Auto
                    Width: =200
                    ZIndex: =5

                    Label_RequestedAmount As label:
                        Align: =Align.Center
                        AutoHeight: =true
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =70
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        LayoutMinHeight: =70
                        LayoutMinWidth: =560
                        OnSelect: =Select(scrCashAdvance_shp_SelectRegion)
                        Size: =21
                        TabIndex: =If(IsBlank(Self.Text), -1, 0)
                        Text: |-
                            =Concatenate(
                                Text(Value(ThisItem.'Requested amount'), "#,#0.00", varDefaultLanguage),
                                " ",
