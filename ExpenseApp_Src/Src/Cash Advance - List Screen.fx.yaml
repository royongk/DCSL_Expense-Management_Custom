                    'Cash advance status' = 'Cash advance status (mserp)'.Draft
                ),
                Collect(colSelectedCashAdvanceIds, {cashAdvanceNumber: ThisRecord.'Cash advance number'})
            )
        OnUncheck: =Clear(colSelectedCashAdvanceIds)
