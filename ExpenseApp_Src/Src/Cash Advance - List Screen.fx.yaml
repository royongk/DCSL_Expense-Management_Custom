        Height: =45
        Image: =icnFilter
        OnSelect: |-
            =//UpdateContext({varCashAdvanceShowDateFilter: true});
            //SetFocus(scrCashAdvance_lbl_DateFilterFocus)
            UpdateContext({varCashAdvanceShowDateFilter: !varCashAdvanceShowDateFilter});
