"'Cash Advance - View Only Screen' As screen.'phoneDetailEditLayout_ver3.0'":
    Fill: =RGBA(248, 248, 248, 1)
    OnVisible: |-
        =UpdateContext({ctVarCashDetailsBack: false})

    CashAdvanceEdit_Header_1 As hdr02_Header:
        Fill: =CashAdvanceEdit_Header_1.paramFill
        paramFill: =RGBA(255, 255, 255, 1)
        paramTitle: =If(varAppMode = "SalaryAdvance", "View Salary Advance Request", "View Cash Advance Request")

    CashAdvanceEdit_ButtonsButtonsContainer_1 As groupContainer.manualLayoutContainer:
        Fill: =RGBA(250, 249, 248, 1)
        Height: =225
        LayoutGridColumnMinWidth: =0
        LayoutGridColumns: =6
        LayoutGridRowMinHeight: =0
        LayoutGridRows: =6
        Width: =Parent.Width
        Y: =Parent.Height - Self.Height
        ZIndex: =2

        CashAdvanceEdit_WithdrawButton_1 As button:
            BorderColor: =RGBA(195, 39, 39, 1)
            Color: =RGBA(195, 39, 39, 1)
            Fill: =RGBA(255, 255, 255, 1)
            Font: =Font.'Segoe UI'
            Height: =76
            OnSelect: |-
                =IfError(
                    Patch(
                        'DCSL TrvCash Advance Entity  (mserp)',
                        varSelectedCashAdvance,
                        {
                            WorkflowAction: "Recall"
                        }
                    ),
                    Notify("Failed to withdraw the request.", NotificationType.Error, gblParams.notificationTime)
                );
                If(
                    IsEmpty(Errors('DCSL TrvCash Advance Entity  (mserp)')),
                    Notify("Cash Advance recalled successfully", NotificationType.Success, gblParams.notificationTime);
                    Navigate('Cash Advance - List Screen', ScreenTransition.None)
                )
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Size: =19.15
            Text: ="Withdraw"
            Visible: =varSelectedCashAdvance.'Cash advance status' = 'Cash advance status (mserp)'.'In review'
            Width: =Parent.Width - Self.X*2
            X: =40
            Y: =20
            ZIndex: =1

        CashAdvanceEdit_SubmitButton_1 As button:
            BorderColor: =RGBA(34, 102, 227, 1)
            Color: =Color.White
            Fill: =RGBA(34, 102, 227, 1)
            Font: =Font.'Segoe UI'
            Height: =76
            OnSelect: =Navigate('Cash Advance - List Screen', ScreenTransition.None)
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Size: =19.15
            Text: ="Done"
            Width: =Parent.Width - Self.X*2
            X: =40
            Y: =CashAdvanceEdit_WithdrawButton_1.Y + CashAdvanceEdit_WithdrawButton_1.Height + 20
            ZIndex: =2

    CashAdvanceEdit_BackIcon_1 As icon.ChevronLeft:
        AccessibleLabel: ="Press to go back"
        Color: =icongconfig_backbutton.Color
        Fill: =icongconfig_backbutton.Fill
        Height: =icongconfig_backbutton.Height
        Icon: =Icon.ChevronLeft
        OnSelect: =Navigate('Cash Advance - List Screen', ScreenTransition.None)
        TabIndex: =0
        Width: =icongconfig_backbutton.Width
        X: =22.5
        Y: =(CashAdvanceEdit_Header_1.Height-Self.Height)/2
        ZIndex: =3

