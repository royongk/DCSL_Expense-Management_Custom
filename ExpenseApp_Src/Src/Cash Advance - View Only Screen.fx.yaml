                    =If(
                        varIsCreateCashAdvance && IsBlank(dirtyTransAmount),
                        "",
                        With(
                            { 
                                baseAmount: Value(Coalesce(dirtyTransAmount, Text(varSelectedCashAdvance.'Requested amount'))) 
                            },
                            If(
                                locIsEditingAmount, 
                                Text(baseAmount, "#"),                   
                                Text(baseAmount, "#,##0.00", "en-US") // 소수점이 필요없다면 "#,##0" 으로 변경 가능
