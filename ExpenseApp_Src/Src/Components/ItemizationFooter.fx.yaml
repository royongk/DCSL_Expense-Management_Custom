ItemizationFooter As CanvasComponent:
    OnButtonClick():
        ThisProperty:
            Default: ="Text"
    ButtonName: ="Text"
    ChildTabPriority: =true
    Fill: =Color.White
    Height: =App.Height * 0.2377
    ItemizedAmountLabel: ="Text"
    itemizedAmountValue: ="Text"
    RemainingAmountLabel: ="Text"
    RemainingAmountValue: ="Text"
    subCategoryRecid: ="Text"
    Width: =Max(App.Width, App.MinScreenWidth)
    X: =0
    Y: =0
    ZIndex: =1

    Container8_1 As groupContainer.verticalAutoLayoutContainer:
        DropShadow: =DropShadow.ExtraBold
        Height: =1
        LayoutDirection: =LayoutDirection.Vertical
        LayoutGridColumns: =6
        LayoutGridRows: =6
        LayoutMode: =LayoutMode.Auto
        Width: =App.Width - 4
        X: =2
        ZIndex: =1

    FooterVerticalAlignment As groupContainer.verticalAutoLayoutContainer:
        Height: =itemizedAmountContainer.Height + RemainingAmountContainer.Height + ButtonContainer.Height
        LayoutDirection: =LayoutDirection.Vertical
        LayoutGridColumns: =6
        LayoutGridRows: =6
        LayoutMode: =LayoutMode.Auto
        Width: =ItemizationFooter.Width
        ZIndex: =2

        itemizedAmountContainer As groupContainer.horizontalAutoLayoutContainer:
            AlignInContainer: =AlignInContainer.SetByContainer
            FillPortions: =0
            Height: =itemizedAmountLabel.Height
            LayoutGridColumns: =6
            LayoutGridRows: =6
            LayoutMaxHeight: =
            LayoutMaxWidth: =
            LayoutMinHeight: =itemizedAmountLabel.Height
            LayoutMinWidth: =250
            LayoutMode: =LayoutMode.Auto
            Width: =ItemizationFooter.Width
            ZIndex: =1

            itemizedAmountLabel As label:
                FontWeight: =FontWeight.Bold
                Height: =ItemizationFooter.Height * 0.2963
                LayoutMaxHeight: =
                LayoutMaxWidth: =
                LayoutMinHeight: =70
                LayoutMinWidth: =560
                PaddingLeft: =10
                Size: =ItemizationFooter.Height * 0.0778
                Text: =ItemizationFooter.ItemizedAmountLabel
                Width: =itemizedAmountContainer.Width / 2
                ZIndex: =1

            ItemizedAmountValue As label:
                Align: =Align.Right
                FontWeight: =FontWeight.Bold
                Height: =ItemizationFooter.Height * 0.2963
                LayoutMaxHeight: =
                LayoutMaxWidth: =
                LayoutMinHeight: =70
                LayoutMinWidth: =560
                PaddingRight: =10
                Size: =ItemizationFooter.Height * 0.0778
                Text: =ItemizationFooter.itemizedAmountValue
                Width: =itemizedAmountContainer.Width / 2
                ZIndex: =2

        RemainingAmountContainer As groupContainer.horizontalAutoLayoutContainer:
            FillPortions: =0
            Height: =RemainingAmountLabel.Height
            LayoutGridColumns: =6
            LayoutGridRows: =6
            LayoutMaxHeight: =
            LayoutMaxWidth: =
            LayoutMinHeight: =112
            LayoutMinWidth: =250
            LayoutMode: =LayoutMode.Auto
            ZIndex: =2

            RemainingAmountLabel As label:
                FontWeight: =FontWeight.Bold
                Height: =ItemizationFooter.Height * 0.2963
                LayoutMaxHeight: =
                LayoutMaxWidth: =
                LayoutMinHeight: =70
                LayoutMinWidth: =560
                PaddingLeft: =10
                Size: =ItemizationFooter.Height * 0.0778
                Text: =ItemizationFooter.RemainingAmountLabel
                Width: =itemizedAmountContainer.Width / 2
                ZIndex: =1

            RemainingAmountValue As label:
                Align: =Align.Right
                FontWeight: =FontWeight.Bold
                Height: =ItemizationFooter.Height * 0.2963
                LayoutMaxHeight: =
                LayoutMaxWidth: =
                LayoutMinHeight: =70
                LayoutMinWidth: =560
                PaddingRight: =10
                Size: =ItemizationFooter.Height * 0.0778
                Text: =ItemizationFooter.RemainingAmountValue
                Width: =itemizedAmountContainer.Width / 2
                ZIndex: =2

        ButtonContainer As groupContainer.horizontalAutoLayoutContainer:
            FillPortions: =0
            Height: =ActionButton.Height * 3 / 2
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutGridColumns: =6
            LayoutGridRows: =6
            LayoutJustifyContent: =LayoutJustifyContent.Center
            LayoutMaxHeight: =
            LayoutMaxWidth: =
            LayoutMinHeight: =112
            LayoutMinWidth: =250
            LayoutMode: =LayoutMode.Auto
            Width: =FooterVerticalAlignment.Width
            ZIndex: =3

            ActionButton As button:
                Fill: =RGBA(34, 102, 227, 1)
                Height: =ItemizationFooter.Height * 0.2593
                LayoutMaxHeight: =
                LayoutMaxWidth: =
                LayoutMinHeight: =70
                LayoutMinWidth: =280
                OnSelect: =ItemizationFooter.OnButtonClick()
                Size: =ItemizationFooter.Height * 0.0889
                Text: =ItemizationFooter.ButtonName
                Width: =App.Width * 0.891
                ZIndex: =1

