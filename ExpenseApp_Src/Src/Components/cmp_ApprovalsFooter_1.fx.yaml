cmp_ApprovalsFooter_1 As CanvasComponent:
    OnApprovalsButtonClick():
        ThisProperty:
            Default: ="Text"
    OnDelegateButtonClick():
        ThisProperty:
            Default: ="Text"
    OnRejectButtonClick():
