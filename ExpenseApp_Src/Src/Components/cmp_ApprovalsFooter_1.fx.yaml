        Height: =40.96
        Image: =RejectIcon
        OnSelect: =cmp_ApprovalsFooter_1.OnRejectButtonClick()
        Width: =40.96
        X: =(rejectRegion_3.X + Parent.Width)/2 - 20
        Y: =14.88
        ZIndex: =3

    cmp_footer_lbl_Approve_1 As label:
