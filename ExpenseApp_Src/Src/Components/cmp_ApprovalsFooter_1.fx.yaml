        Y: =60
        ZIndex: =4

    cmp_footer_lbl_Delegate_1 As label:
        Align: =Align.Center
        Color: =RGBA(34, 102, 227, 1)
        DisplayMode: |-
            =If(
                cmp_ApprovalsFooter_1.DisplayMode,
                DisplayMode.Edit,
                DisplayMode.View
            )
        Font: =Font.'Segoe UI'
