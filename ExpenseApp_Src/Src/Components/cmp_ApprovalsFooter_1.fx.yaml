    cmp_footer_img_Approve_1 As image:
        DisplayMode: |-
            =If(
                cmp_ApprovalsFooter_1.DisplayMode,
                DisplayMode.Edit,
                DisplayMode.View
            )
        Height: =40.96
        Image: =ApprovalIcon
        OnSelect: =cmp_ApprovalsFooter_1.OnApprovalsButtonClick()
        Width: =40.96
        X: =(delegateRegion_3.X + approveRegion_3.X)/2 - 20
        Y: =14.88
        ZIndex: =1

    cmp_footer_img_Delegate_1 As image:
        DisplayMode: |-
            =If(
                cmp_ApprovalsFooter_1.DisplayMode,
                DisplayMode.Edit,
                DisplayMode.View
            )
        Height: =40.96
        Image: =DelegateIcon
        OnSelect: =cmp_ApprovalsFooter_1.OnDelegateButtonClick()
        Visible: =cmp_ApprovalsFooter_1.IsDelegateVisible
        Width: =40.96
        X: =(rejectRegion_3.X + delegateRegion_3.X)/2 - 20
        Y: =16.59
