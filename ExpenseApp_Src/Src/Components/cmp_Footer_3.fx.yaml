cmp_Footer_3 As CanvasComponent:
    OnApprovalsButtonClick():
        ThisProperty:
            Default: =true
    ApprovalsAccessibleLabel: ="Text"
    ApprovalsText: ="Text"
    DisplayMode: =true
    ExpenseAccessibleLabel: ="Text"
    ExpensesText: ="Text"
    Fill: =RGBA(248, 248, 248, 0.94)
    Height: =84
    OnExpensesButtonClick: ="Text"
    OnReceiptsButtonClick: ="Text"
    OnReportsButtonClick: =true
    OnReset: =Set(varSelectedTab,cmp_Footer_3.paramInDefaultSelectedTab)
    paramInDefaultAppMode: ="텍스트"
    paramInDefaultSelectedTab: =2
    paramOutSelectedTabIndex: =
    ReceiptAccessibleLabel: =
    ReceiptText: ="Text"
    ReportAccessibleLabel: ="Text"
    ReportText: ="Text"
    SelectedTab: =100
    Width: =Max(App.Width, App.MinScreenWidth)
    X: =0
    Y: =0
    ZIndex: =1

    cmp_footer_img_Approvals As image:
        Height: =28.16
        Image: |-
            =If(
                cmp_Footer_3.paramInDefaultAppMode = "CashAdvance",
                If(
                    Value(cmp_Footer_3.paramInDefaultSelectedTab=4),
                    cashSelectedIcon,
                    cashDeselectedIcon
                ),
                If(
                    cmp_Footer_3.paramInDefaultAppMode = "AirfareAllowance",
                    If(
                        Value(cmp_Footer_3.paramInDefaultSelectedTab=4),
                        travelSelected,
                        travelDeselectedIcon
                    ),
                    If(
                        Value(cmp_Footer_3.paramInDefaultSelectedTab=4),
                        approvalsSelectedIcon,
                        approvalsIcon
                    )
                )
            )
        OnSelect: =cmp_Footer_3.OnApprovalsButtonClick()
        Width: =28.16
        X: =approvalsRegion_1.X + (approvalsRegion_1.Width - Self.Width)/2
        Y: =14.88
        ZIndex: =1

    cmp_footer_img_Receipts_6 As image:
        DisplayMode: |-
            =If(
                cmp_Footer_3.DisplayMode,
                DisplayMode.Edit,
                DisplayMode.View
            )
        Height: =28.16
        Image: =If( cmp_Footer_3.paramInDefaultSelectedTab=1 ,IcnFooterReceiptSelected,IcnFooterReceiptUnSelected)
        OnSelect: =cmp_Footer_3.OnReceiptsButtonClick()
        Width: =28.16
        X: =receiptRegion_1.X + (receiptRegion_1.Width - Self.Width)/2
        Y: =14.88
        ZIndex: =2

    cmp_footer_img_Expenses_6 As image:
