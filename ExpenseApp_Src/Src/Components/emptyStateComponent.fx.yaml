emptyStateComponent As CanvasComponent:
    Fill: =RGBA(0, 0, 0, 0)
    Height: |
        =350
    subTitle: ="Text"
    title: ="Text"
    Width: =Self.Height
    X: =0
    Y: =0
    ZIndex: =1

    "'Image Text' As groupContainer.verticalAutoLayoutContainer":
        Height: =Parent.Height
        LayoutAlignItems: =LayoutAlignItems.Center
        LayoutDirection: =LayoutDirection.Vertical
        LayoutGap: =10
        LayoutGridColumnMinWidth: =0
        LayoutGridColumns: =6
        LayoutGridRowMinHeight: =0
        LayoutGridRows: =6
        LayoutMode: =LayoutMode.Auto
        Width: =Parent.Width
        ZIndex: =1

        icnEmptyState As image:
            FillPortions: =1
            Height: =Parent.Height - Title.Height - SubTitle.Height
            Image: |
                =IcnEmptyState
            ImagePosition: =ImagePosition.Center
            LayoutMaxHeight: =
            LayoutMaxWidth: =
            LayoutMinHeight: =200
            LayoutMinWidth: =320
            Width: =Parent.Width
            ZIndex: =1

        Title As label:
            Align: =Align.Center
            FontWeight: =FontWeight.Semibold
            Height: |
                =35
            LayoutMaxHeight: =
            LayoutMaxWidth: =
            LayoutMinHeight: =70
            LayoutMinWidth: =560
            Size: =18
            Text: =emptyStateComponent.title
            Width: =Parent.Width
            ZIndex: =2

        SubTitle As label:
            Align: =Align.Center
            AutoHeight: =true
            Height: |
                =50
            LayoutMaxHeight: =
            LayoutMaxWidth: =
            LayoutMinHeight: =70
            LayoutMinWidth: =560
            Size: =14
            Text: =emptyStateComponent.subTitle
            Width: =Parent.Width
            ZIndex: =3

