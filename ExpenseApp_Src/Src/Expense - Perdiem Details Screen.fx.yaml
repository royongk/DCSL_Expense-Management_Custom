                FontWeight: =FontWeight.Semibold
                Height: =70
                LayoutMaxHeight: =
                LayoutMaxWidth: =
                LayoutMinHeight: =70
                LayoutMinWidth: =560
                Size: =21
                Text: |+
                    =Concatenate(Text(varSelectedExpenseDoc.'Amount (mserp_amountmst)', "#,#0.00", varDefaultLanguage), " ", varDefaultCurrency)
                    
                    
                Width: =250
                ZIndex: =2

        footerButtonsContainer As groupContainer.manualLayoutContainer:
            Height: =225
            LayoutGridColumnMinWidth: =0
            LayoutGridColumns: =6
            LayoutGridRowMinHeight: =0
            LayoutGridRows: =6
            LayoutMaxHeight: =
            LayoutMaxWidth: =
            LayoutMinHeight: =112
            LayoutMinWidth: =250
            ZIndex: =5

            btnSavePerdiems As button:
                BorderColor: =RGBA(34, 102, 227, 1)
                Color: |
                    =RGBA(34, 102, 227, 1)
                DisplayMode: |-
                    =If(
                        locDisableSaveButton,
                        DisplayMode.Disabled,
                        DisplayMode.Edit
                    )
                Fill: =Color.White
                Font: =Font.'Segoe UI'
                Height: =76
                OnSelect: |
                    =//navigate to previous screen
                    Clear(perDiemCalcErrors);
                    // if any fields have been altered update the perdiems entity
                    // collect errors if any in perDiemCalcErrors
                    If(
                        isDirty,
                        ForAll(
                            Filter(dsPerdiemDetails,isDirty) As dirtyPerdiemLines,
                            IfError(
                                Patch(
                                    [@'PerDiem Data Lines for Expense Lines (mserp)'],
                                    LookUp(
                                        [@'PerDiem Data Lines for Expense Lines (mserp)'],
                                        EntRecId = dirtyPerdiemLines.EntRecId
                                    ),
                                    {
                                        Breakfast: dirtyPerdiemLines.Breakfast,
                                        Lunch: dirtyPerdiemLines.Lunch,
                                        Dinner: dirtyPerdiemLines.Dinner
                                    }
                                ),
                                First(
                                    Collect( 
                                        perDiemCalcErrors,
                                        {
                                            statusCode : FirstError.Details.HttpStatusCode,
                                            response : FirstError.Details.HttpResponse
                                        }
                                    ) 
                                )
                            )
                        );
                        UpdateContext({isDirty : false});
                    );
                    If(
                        // if there are errors present
                        CountRows(
                            Distinct(
                                perDiemCalcErrors,
                                statusCode
                            )
                        ) >= 1,
                        // show distinct errors
                        ForAll(
                            perDiemCalcErrors,
                            If(
                                Text(ThisRecord.statusCode) <> NotFoundStatusCode,
                                Notify(
                                    Substitute(
                                        Match(
                                            ThisRecord.response,
                                            """message"":""([^""]*)"""
                                        ).FullMatch,
                                        """message"":",
                                        ""
                                    ),
                                    NotificationType.Error
                                )
                            )
                        ),
                        // since no errors are present navigate back to previous screen
                        // update dsPerDiemDetails and varSelectedExpenseDoc
                        UpdateContext({isDirty: false});
                        ClearCollect(
                            dsPerdiemDetails,
                            AddColumns(
                                Filter(
                                    [@'PerDiem Data Lines for Expense Lines (mserp)'],
                                    'Expense transaction number' = varSelectedExpenseDoc.'Expense transaction number (mserp_exptransnumber)'
                                ),
                                isGalleryVisible,
                                false,
                                isDirty,
                                false
                            )
                        );
                        Set(
                            varSelectedExpenseDoc,
                            LookUp([@'Expense Line Expense Mobile Entity (mserp)'],'Expense transaction number (mserp_exptransnumber)'=varSelectedExpenseDoc.'Expense transaction number (mserp_exptransnumber)')
                        );
                        Navigate('Expenses - Edit Screen', ScreenTransition.None, {varSalesTaxAmount : varSelectedExpenseDoc.'Actual sales tax amount'})
                        // add navigation logic based on where we have navigated from -> simply Back() might do
                    );
                RadiusBottomLeft: =8
                RadiusBottomRight: =8
                RadiusTopLeft: =8
                RadiusTopRight: =8
                Size: =19.15
                Text: |-
                    =GlobalLabels.Labels.'15062:LocalizedName,SaveLabel'
                Width: =Parent.Width -  Self.X*2
                X: =40*1
                Y: |-
                    =If(
                        isDirty,
                        btnCalculatePerdiems_1.Y + btnCalculatePerdiems_1.Height + 25,
                        10
                    )
                ZIndex: =1

            btnCalculatePerdiems As button:
                BorderColor: =RGBA(34, 102, 227, 1)
                Fill: |
                    =RGBA(34, 102, 227, 1)
                Font: =Font.'Segoe UI'
                Height: =76
                OnSelect: |-
                    =//context variable to disable save button as long as there are network calls ongoing
                    UpdateContext({locDisableSaveButton : true});
                    // clear error list
                    Clear(perDiemCalcErrors);
                    // for all dirty perdiem lines
                    // patch the breakfast, lunch and dinner values
                    // if error collect them in perDiemCalcErrors
                    ForAll(
                        Filter(dsPerdiemDetails,isDirty) As dirtyPerdiemLines,
                        IfError(
                            Patch(
                                [@'PerDiem Data Lines for Expense Lines (mserp)'],
                                LookUp(
                                    [@'PerDiem Data Lines for Expense Lines (mserp)'],
                                    EntRecId = dirtyPerdiemLines.EntRecId
                                ),
                                {
                                    Breakfast: dirtyPerdiemLines.Breakfast,
                                    Lunch: dirtyPerdiemLines.Lunch,
                                    Dinner: dirtyPerdiemLines.Dinner
                                }
                            ),
                            First(
                                Collect(
                                    perDiemCalcErrors,
                                    {
                                        statusCode: FirstError.Details.HttpStatusCode,
                                        response: FirstError.Details.HttpResponse
                                    }
                                )
                            )
                        )
                    );
                    If(
                        // if there are errors present
                        CountRows(
                            Distinct(
                                perDiemCalcErrors,
                                statusCode
                            )
                        ) >= 1,
                        // show distinct errors
                        ForAll(
                            perDiemCalcErrors,
                            If(
                                Text(ThisRecord.statusCode) <> NotFoundStatusCode,
                                Notify(
                                    Substitute(
                                        Match(
                                            ThisRecord.response,
                                            """message"":""([^""]*)"""
                                        ).FullMatch,
                                        """message"":",
                                        ""
                                    ),
                                    NotificationType.Error
                                )
                            )
                        ),
                        // since no errors are present update dsPerDiemDetails and varSelectedExpenseDoc
                        UpdateContext({isDirty: false});
                        ClearCollect(
                            dsPerdiemDetails,
                            AddColumns(
                                Filter(
                                    [@'PerDiem Data Lines for Expense Lines (mserp)'],
                                    'Expense transaction number' = varSelectedExpenseDoc.'Expense transaction number (mserp_exptransnumber)'
                                ),
                                isGalleryVisible,
                                false,
                                isDirty,
                                false
                            )
                        );
                        Set(
                            varSelectedExpenseDoc,
                            LookUp([@'Expense Line Expense Mobile Entity (mserp)'],'Expense transaction number (mserp_exptransnumber)'=varSelectedExpenseDoc.'Expense transaction number (mserp_exptransnumber)')
                        )
                    );
                    UpdateContext({locDisableSaveButton : false});
                Size: =19.15
                Text: |-
                    =GlobalLabels.Labels.'15062:LocalizedName,CalculateMealsAndIncidentalsLabel'
                Visible: =isDirty
                Width: |
                    =Parent.Width -  Self.X*2
                X: =40*1
                Y: =36
                ZIndex: =2

