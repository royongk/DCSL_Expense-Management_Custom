"'Expense - Perdiem Details Screen' As screen":
    Fill: =RGBA(244, 244, 244, 1)
    OnVisible: |
        =/*ClearCollect(
            dsPerdiemDetails,
            AddColumns(
                'PerDiem Data Lines for Expense Lines (mserp)',
                "isGalleryVisible",
                false,
                "isDirty",
                false
            )
        );*/
        UpdateContext(
            {
                isDirty : false,
                locNavigateBack: false
            }
        )

    buttonDetailsContainer As groupContainer.verticalAutoLayoutContainer:
        Fill: =RGBA(248, 248, 248, 1)
        Height: =250
        LayoutDirection: =LayoutDirection.Vertical
        LayoutGap: =5
        LayoutGridColumnMinWidth: =0
        LayoutGridColumns: =6
        LayoutGridRowMinHeight: =0
        LayoutGridRows: =6
        LayoutMode: =LayoutMode.Auto
        Width: =Parent.Width
        Y: =Parent.Height - Self.Height
        ZIndex: =1

        mealsAndIncidentalsContainer As groupContainer.horizontalAutoLayoutContainer:
            FillPortions: =0
            Height: =70
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutGridColumnMinWidth: =0
            LayoutGridColumns: =6
            LayoutGridRowMinHeight: =0
            LayoutGridRows: =6
            LayoutMaxHeight: =
            LayoutMaxWidth: =
            LayoutMinHeight: =112
            LayoutMinWidth: =250
            LayoutMode: =LayoutMode.Auto
            PaddingLeft: =15
            PaddingRight: =15
            Visible: =!isDirty
            ZIndex: =1

            lblMealsIncidentals As label:
                FillPortions: =1
                Font: =Font.'Segoe UI'
                FontWeight: =FontWeight.Semibold
                Height: =70
                LayoutMaxHeight: =
                LayoutMaxWidth: =
                LayoutMinHeight: =70
                LayoutMinWidth: =250
                Size: =21
                Text: |-
                    =GlobalLabels.Labels.'15062:LocalizedName,MealsAndIncidentalsLabel'
                Width: =560
                ZIndex: =1

            lblMealsIncidentalsAmount As label:
                Align: =Align.Right
                Font: =Font.'Segoe UI'
                FontWeight: =FontWeight.Semibold
                Height: =70
                LayoutMaxHeight: =
                LayoutMaxWidth: =
                LayoutMinHeight: =70
                LayoutMinWidth: =560
                Size: =21
                Text: |+
                    =Concatenate(Text(Sum(dsPerdiemDetails,'Meals and incidentals'), "#,#0.00", varDefaultLanguage), " ", varDefaultCurrency)
                    
                    
                Width: =250
                ZIndex: =2

        totalsContainer As groupContainer.horizontalAutoLayoutContainer:
            FillPortions: =0
            Height: =70
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutGridColumnMinWidth: =0
            LayoutGridColumns: =6
            LayoutGridRowMinHeight: =0
            LayoutGridRows: =6
            LayoutMaxHeight: =
            LayoutMaxWidth: =
            LayoutMinHeight: =112
            LayoutMinWidth: =250
            LayoutMode: =LayoutMode.Auto
            PaddingLeft: =15
            PaddingRight: =15
            Visible: =!isDirty
            ZIndex: =2

