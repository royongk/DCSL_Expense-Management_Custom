                FillPortions: =1
                Font: =Font.'Segoe UI'
                FontWeight: =FontWeight.Semibold
                Height: =70
                LayoutMaxHeight: =
                LayoutMaxWidth: =
                LayoutMinHeight: =70
                LayoutMinWidth: =250
                Size: =21
