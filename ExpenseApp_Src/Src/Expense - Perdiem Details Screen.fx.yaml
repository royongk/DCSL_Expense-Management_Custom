        img_ShowHideAll As image:
            Height: =Parent.Height
            Image: |-
                =If(
                    lbl_ShowHideAll.Text = GlobalLabels.Labels.'15062:LocalizedName,ShowAllLabel',
                    icnShowAll,
                    icnHideAll
                )
            ImagePosition: =ImagePosition.Center
            LayoutMaxHeight: =
            LayoutMaxWidth: =
            LayoutMinHeight: =320
            LayoutMinWidth: =320
            Width: =Self.Height
            ZIndex: =1

        lbl_ShowHideAll As label:
            Color: |
                =RGBA(34, 102, 227, 1)
            FillPortions: =1
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Semibold
            Height: =Parent.Height
            LayoutMaxHeight: =
            LayoutMaxWidth: =
            LayoutMinHeight: =70
            LayoutMinWidth: =250
            OnSelect: |-
                =If(
                    Self.Text = GlobalLabels.Labels.'15062:LocalizedName,ShowAllLabel',
                    UpdateIf(
                        dsPerdiemDetails,
                        true,
                        {
                            isGalleryVisible: true
                        }
                    ),
                    Self.Text = GlobalLabels.Labels.'15062:LocalizedName,HideAllLabel',
                    UpdateIf(
                        dsPerdiemDetails,
                        true,
                        {
                            isGalleryVisible: false
                        }
                    )
                )
                    
            Size: =16
            Text: |-
                =If(
                    CountRows(Filter(dsPerdiemDetails, isGalleryVisible = false)) > 0,
                    GlobalLabels.Labels.'15062:LocalizedName,ShowAllLabel',
                    CountRows(Filter(dsPerdiemDetails, isGalleryVisible = false)) = 0,
