                            Color.Red,  // 조건 1: 저장 시도 후 시스템/유효성 검사 에러가 발생한 경우
                        
                            Parent.Visible && Parent.Required && IsBlank(Parent.Update), 
                            Color.Red,  // 조건 2: 화면에 보이고 필수 항목인데 아직 값을 입력하지 않은 경우
                        
                            RGBA(166, 166, 166, 1) // 기본값: 위 두 조건에 모두 해당하지 않는 경우 (정상 상태)
                        )
                    BorderThickness: |-
                        =If(
                            !IsBlank(Parent.Error) || (Parent.Visible && Parent.Required && IsBlank(Parent.Update)), 
                            2,  // 에러가 있거나( || ) 필수 항목이 비어있으면 두께를 2로 설정
                            0   // 정상 상태에서는 두께를 1로 설정
                        )
                    DefaultSelectedItems: |-
                        =If(
                            // 1. 신규 모드(Create)이면서 넘겨받은 데이터가 매핑 테이블에 존재하여 '강제 주입(varForceLock)' 상태인 경우
                            varIsCreate && varForceLock,
                            
                            // 2. 이전 화면에서 넘어온 텍스트(ctxTargetPurpose)를 콤보박스가 인식할 수 있는 테이블 형태로 변환하여 강제 할당
                            Table({Value: ctxTargetPurpose}),
                            
                            // 3. 매핑 테이블에 없거나("Shipping" 등), 기존 편집 모드(Edit)일 경우의 기본 동작
                            If(
                                !IsBlank(varSelectedExpenseDoc.'Item or Service'), 
                                Table({Value: varSelectedExpenseDoc.'Item or Service'})
                                // 💡 핵심: 신규 생성이면서 varForceLock이 false("Shipping")인 경우,
                                // varSelectedExpenseDoc도 비어있으므로 결과적으로 아무 값도 세팅되지 않음(Blank).
                                // 따라서 사용자가 콤보박스를 눌러 직접 선택할 수 있는 빈칸 상태가 됩니다!
                            )
                        )
                    DisplayFields: =["Value"]
                    DisplayMode: |-
                        =If(
                            // 1순위: 매핑 테이블에 데이터가 완벽히 존재하여 강제 주입된 경우 -> 무조건 비활성화(View)
                            varIsCreate && varForceLock, 
                            DisplayMode.View,
                            
                            // 2순위: 최상위 항목(Expense Type)이 비어있어 아직 선택할 단계가 아닌 경우 -> 비활성화(Disabled)
                            // 💡 [전문가 수정]: Purchase Category는 Item or Service 선택 후 채워져야 하므로, 
                            // IsBlank(ComboBox_PurchaseCategory.Selected) 조건은 여기서 삭제하는 것이 안전합니다.
                            IsBlank(ComboBox_ExpenseType.Selected), 
                            DisplayMode.Disabled,
                            
                            // 3순위: 위 조건에 해당하지 않는 경우 (예: "Shipping" 매핑 실패 또는 일반 편집 모드) -> 활성화
                            Parent.DisplayMode
                        )
                    FocusedBorderThickness: =2
                    Height: =gblParams.dropDownHeight
                    HoverFill: =gblParams.dropDownHoverFill
                    InputTextPlaceholder: ="Select details, e.g. subscription, transportation"
                    IsSearchable: =false
                    Items: |-
                        =SortByColumns(
                            Distinct(
                                Filter(
                                    'DCSL Expense Category Mapping Setup Entity (mserp)',
                                    !IsBlank('Expense category') &&
                                    !IsBlank(varSelectedExpenseType) &&
                                    'Expense Type' = varSelectedExpenseType &&
                                    !IsBlank(varSelectedPurchaseCategory) &&
                                    'Purchase Category' = varSelectedPurchaseCategory
                                ),
                                'Item or Service'
                            ),
                            "Value",
                            SortOrder.Ascending
                        )
                    NoSelectionText: ="Select details, e.g. subscription, transportation"
                    OnChange: |-
                        =UpdateContext({varSelectedItemOrService: Parent.Update});
                        // Derive project type from 3-level category selection
                        UpdateContext(
                            {
                                varSelectedProjectType: 
                                    LookUp(
                                        'DCSL Expense Category Mapping Setup Entity (mserp)',
                                        'Expense Type' = varSelectedExpenseType &&
                                        'Purchase Category' = varSelectedPurchaseCategory &&
                                        'Item or Service' = Parent.Update,
                                        'Project Type'
                                    )
                            }
                        );
                        // cmbItemOrService 컨트롤의 OnChange 속성
                        UpdateContext({
                            locCurrentSetup: LookUp(
                                'DCSL Expense Category Mapping Setup Entity (mserp)',
                                'Expense Type' = ComboBox_ExpenseType.Selected.Value && 
                                'Purchase Category' = ComboBox_PurchaseCategory.Selected.Value && 
                                'Item or Service' = Self.Selected.Value
                            )
                        });
                        
                        // 금액 필드 초기화 (선택 사항)
                        Reset(DataCardValue4_1);
                        
                        // Fixed Amount가 Yes(true)로 바뀌었을 때만 통화 콤보박스를 초기화
                        If(
                            locCurrentSetup.'Fixed Amount' = 'NoYes (mserp)'.Yes,
                            Reset(ComboBox1_12);
                            
                            // --- [수정] 환율 조회 및 LCY(KRW) 계산 로직 (캐싱된 컬렉션 활용) ---
                            If(
                                !IsBlank(ComboBox1_12.Selected.mserp_currencycode) && !IsBlank(varSelectedLegalEntity) && !IsBlank(locCurrentSetup.Amount),
                                
                                With(
                                    {
                                        // 1. 메모리에 캐싱된 컬렉션(colExchangeRates)에서 환율 즉시 조회
                                        fetchedRate: LookUp(
                                            colExchangeRates,
                                            Currency = ComboBox1_12.Selected.mserp_currencycode
                                        ).'Exchange rate',
                                        
                                        // 2. locCurrentSetup(설정 정보)의 Amount 값을 숫자로 변환
                                        currentAmount: Value(locCurrentSetup.Amount)
                                    },
                                    
                                    // 3. KRW 환산 금액 계산 및 로컬 변수(locCalculatedLCY) 저장
                                    // [안전장치] Coalesce를 사용하여 환율 누락 시 계산식 오류 방지 및 반올림(Round) 적용
                                    UpdateContext({ 
                                        locCalculatedLCY: Text(
                                            Round((currentAmount * Value(Coalesce(fetchedRate, 100))) / 100, 0)
                                        )
                                    })
                                )
                            )
                        );
                    SearchFields: =["Value"]
                    SearchItems: =Search(SortByColumns(Distinct(Filter('DCSL Expense Category Mapping Setup Entity (mserp)',!IsBlank('Expense category')&&!IsBlank(varSelectedExpenseType)&&'Expense Type'=varSelectedExpenseType&&!IsBlank(varSelectedPurchaseCategory)&&'Purchase Category'=varSelectedPurchaseCategory),'Item or Service'),"Value",SortOrder.Ascending),ComboBox_ItemOrService.SearchText,Value)
