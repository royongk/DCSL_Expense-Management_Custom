"'Expenses - Edit Screen' As screen.'phoneDetailEditLayout_ver3.0'":
    Fill: =RGBA(248, 248, 248, 1)
    OnVisible: |
        =UpdateContext({varStateSelected: Blank()});
        UpdateContext({varZipCodeSelectedRecId: -1 });
        UpdateContext({varProjectHierarchyId: Blank()});
        UpdateContext({onReloadButtonClick: false});
        // 3-level category selection variables
        UpdateContext({varSelectedDepartment: Blank()});
        UpdateContext({varSelectedBenefitType: Blank()});
        UpdateContext({varSelectedBenefitTypeValue: ""});
        UpdateContext({curCategory: If(!varIsCreate && !IsBlank(varSelectedExpenseDoc.'Expense category (mserp_costtype)'), varSelectedExpenseDoc.'Expense category (mserp_costtype)', Blank())});
        // Cost Center context
        UpdateContext({varSelectedCostCenter: Blank()});
        If(
            !varIsCreate && !IsBlank(varSelectedExpenseDoc.CostCenter),
            UpdateContext({
                varSelectedCostCenter: LookUp(
                    'DCSL Financial Dimension CostCenter (mserp)',
                    'Combination display' = varSelectedExpenseDoc.CostCenter
                )
            })
        );
        // Project context
        UpdateContext({varSelectedProject: Blank()});
        If(
            !varIsCreate && !IsBlank(varSelectedExpenseDoc.Project),
            UpdateContext({
                varSelectedProject: LookUp(
                    Filter(
                        'DCSL Financial Dimension Master (mserp)',
                        'Dimension name' = "Project"
                    ),
                    'Dimension value' = varSelectedExpenseDoc.Project
                )
            })
        );
        // Load existing Department and Benefit Type from Expense Category (reverse lookup)
        If(
            !varIsCreate && !IsBlank(varSelectedExpenseDoc.'Expense category (mserp_costtype)'),
            With(
                {
                    mappingRecord: LookUp(
                        'DCSL Expense Category Mapping Setup Entity (mserp)',
                        'Expense category' = varSelectedExpenseDoc.'Expense category (mserp_costtype)'
                    )
                },
                If(
                    !IsBlank(mappingRecord),
                    UpdateContext({
                        varSelectedDepartment: mappingRecord.Department
                    });
                    UpdateContext({
                        varSelectedBenefitType: mappingRecord.'Benefit Type'
                    })
                )
            )
        );
        // Initialize colExpenseCategories for edit mode (fix for Form Submit error)
        If(
            !varIsCreate && !IsBlank(varSelectedExpenseDoc.'Expense category (mserp_costtype)'),
            // Case 1: Department와 Benefit Type이 역 조회로 복원된 경우
            If(
                !IsBlank(varSelectedDepartment) && !IsBlank(varSelectedBenefitType),
                ClearCollect(
                    colExpenseCategories,
                    SortByColumns(
                        Filter(
                            'DCSL Expense Category Mapping Setup Entity (mserp)',
                            !IsBlank('Expense category') &&
                            Department = varSelectedDepartment &&
                            'Benefit Type' = varSelectedBenefitType
                        ),
                        "mserp_expensecategory",
                        SortOrder.Ascending
                    )
                ),
                // Case 2: 역 조회가 실패했지만 기존 Expense Category가 있는 경우
                // 기존 Expense Category를 포함한 매핑 레코드를 찾아서 colExpenseCategories 초기화
                With(
                    {
                        existingCategoryMapping: LookUp(
                            'DCSL Expense Category Mapping Setup Entity (mserp)',
                            'Expense category' = varSelectedExpenseDoc.'Expense category (mserp_costtype)'
                        )
                    },
                    If(
                        !IsBlank(existingCategoryMapping),
                        // 매핑 레코드가 있으면 해당 Department와 Benefit Type으로 필터링
                        ClearCollect(
                            colExpenseCategories,
                            SortByColumns(
                                Filter(
                                    'DCSL Expense Category Mapping Setup Entity (mserp)',
                                    !IsBlank('Expense category') &&
                                    Department = existingCategoryMapping.Department &&
                                    'Benefit Type' = existingCategoryMapping.'Benefit Type'
                                ),
                                "mserp_expensecategory",
                                SortOrder.Ascending
                            )
                        ),
                        // 매핑 레코드가 없으면 기존 Expense Category만 포함
                        ClearCollect(
                            colExpenseCategories,
                            Filter(
                                'DCSL Expense Category Mapping Setup Entity (mserp)',
                                'Expense category' = varSelectedExpenseDoc.'Expense category (mserp_costtype)'
                            )
                        )
                    )
                )
            )
        );
        UpdateContext({curIntercompanyLE: Coalesce(DataCardValue39_1.Selected.Value, varSelectedExpenseDoc.'Legal entity')});
        UpdateContext({curInterCompanyProjectCategory: varSelectedExpenseDoc.'Intercompany project category'});
        UpdateContext({curProjIdSelected: varSelectedExpenseDoc.'Project ID'});
        UpdateContext({curCountrySelected: varSelectedExpenseDoc.'Country/region (mserp_countryregion)'});
        UpdateContext({curStateSelected: varSelectedExpenseDoc.'State/province'});
        UpdateContext({curBillIssuedToSelected: varSelectedExpenseDoc.'Hotel bill issued to'});
        UpdateContext({taxModifiedByUser: false});
        UpdateContext({varLoadingSpinner : true});
        If(
            !varIsCreate && !IsBlank(varSelectedExpenseDoc.'Expense category (mserp_costtype)'),
            UpdateContext(
                {
                    locItemizeButtonVisibilityFlag : 'Expense mobile master data (mserp)'.mserp_trvexpmobilemasterdataentity_isexpenseitemizable(LookUp('Expense mobile master data (mserp)',Email = User().Email).'Expense mobile master data (mserp)', 
                    {
                        CostType: varSelectedExpenseDoc.'Expense category (mserp_costtype)',
                        SplitLineType:"Default",
                        LineType: If(varSelectedExpenseDoc.'Expense line type' = 'Expense line type (mserp)'.'Itemized header',"ItemizedHeader","Default")
                    }).return
        
                }
            )
        );
        If(
            !varIsCreate && gblIsProjectValidationFlag,
            Clear(colGetProjectsBasedOnResourceCategory);
            UpdateContext({
                varGetProjectsJson :
                IfError(
                    Text(
                        'Projects (mserp)'.mserp_trvexpmobileprojentity_getprojectsbasedonresourcecategory(LookUp('Expense mobile master data (mserp)',Email = User().Email).'Expense mobile master data (mserp)',
                            {
                                employeeLegalEntity: varSelectedLegalEntity,
                                interCompanyLegalEntity: curIntercompanyLE,
                                categoryId: 
                                If(
                                    IsBlank(If(Upper(varSelectedLegalEntity) <> Upper(curIntercompanyLE), varSelectedExpenseDoc.'Intercompany project category', curCategory)),
                                    "",
                                    If(Upper(varSelectedLegalEntity) <> Upper(curIntercompanyLE), varSelectedExpenseDoc.'Intercompany project category', curCategory)
                                )
                            }).return
                    ),
                    ""
                )
            });
            If(
                !IsBlank(varGetProjectsJson),
                ClearCollect(
                    colGetProjectsBasedOnResourceCategory,
                    ForAll(
                        MatchAll(varGetProjectsJson, "\{""projId"":""(?<projId>[^""]*)"",""projName"":""(?<projName>[^""]*)""\}") As ProjectListFromCol,
                        {
                            projectId: ProjectListFromCol.projId, 
                            projectName: ProjectListFromCol.projName
                        }
                    )
                ),
                Clear(colGetProjectsBasedOnResourceCategory)
            );
            
            If(
                !IsBlankOrError(curProjIdSelected),
                UpdateContext({
                    varProjectHierarchyId:
                        LookUp(
                            'Projects (mserp)',
                            'Project ID' = curProjIdSelected,
                            HierarchyId
                        )
                })
            );
        );
        UpdateContext({locItemizationCheck : locItemizeButtonVisibilityFlag});
        UpdateContext(
            {
                timerCostType: false,
                timerProj: false,
                timerHBIT: false,
                timerCountry: false,
                timerState: false,
                locAllowNavigationBack: true
            }
        );
        // populate the current expense type of the selected document
        UpdateContext(
            {
                currExpenseType: Coalesce(
                    varSelectedExpenseDoc.'Expense type',
                    If(
                        !IsBlank(varSelectedExpenseDoc.'Expense category (mserp_costtype)'),
                        LookUp(
                            'Expense category (mserp)',
                            'Expense category' = varSelectedExpenseDoc.'Expense category (mserp_costtype)',
                            'Expense type'
                        ),
                        Blank()
                    )
                )
            }
        );
        If(
            !varIsCreate,
            UpdateContext({msCallStartedForSalestaxCalculation: true});
            UpdateContext({varOnShowFields: false});
            UpdateContext({varOnSelectTriggered: false});
            UpdateContext({varOnChangeTriggered: false});
            
        );
        UpdateContext(
            {
                featureEnabled: If(
                    userRecord.IsReimaginedUIEnabled = 'NoYes (mserp)'.Yes,
                    "True",
                    "False"
                ),
                perdiemFeatureEnabled: If(
                    userRecord.IsReImaginedPerDiemEnabled = 'NoYes (mserp)'.Yes,  //this needs to be changed to the perdiem feature enabled
                    "True",
                    "False"
                )
            }
        );
        //Check if the itemization is over or under distributed
        If(
            !varIsCreate,
            If(
                varRemainingAmount < 0,
                Notify(
                    GlobalLabels.Labels.'15062:LocalizedName,msdyn_ThisExpenseIsOverItemizedLabel',
                    NotificationType.Error,
                    gblParams.notificationTime
                ),
                varRemainingAmount > 0,
                Notify(GlobalLabels.Labels.'15062:LocalizedName,msdyn_ThisExpenseIsNotCompletelyItemizedLabel',
                    NotificationType.Warning,
                    gblParams.notificationTime
                )
            )
        );
        If(
            currExpenseType = 'TrvExpType (mserp)'.'Per diem' && (featureEnabled = "False" || perdiemFeatureEnabled = "False"),
            Notify(
                GlobalLabels.Labels.'15062:LocalizedName,msdyn_PerdiemFeatureDisabledWarning',
                //"Enable both re-imagined features to be able to edit this expense",
                NotificationType.Warning,
                gblParams.notificationTime
            )
        );
        //if labelTableLookUp not empty
        If(
            CountRows(labelTableLookUp) <= 0,
            Collect(
                labelTableLookUp,
                {
                    fieldName: "CostType",
                    labelName: "Expense category",
                    localisedLabelName: GlobalLabels.Labels.'15062:LocalizedName,msdyn_ExpenseCategoryLabel',
                    visible: true,
                    required: true
                },
                {
                    fieldName: "TransDate",
                    labelName: "Transaction date",
                    localisedLabelName: GlobalLabels.Labels.'15062:LocalizedName,msdyn_TransactionDateLabel',
                    visible: true,
                    required: true
                },
                {
                    fieldName: "AmountCurr",
                    labelName: "Transaction amount",
                    localisedLabelName: GlobalLabels.Labels.'15062:LocalizedName,msdyn_TransactionAmountLabel',
                    visible: true,
                    required: true
                },
                {
                    fieldName: "ExchangeCode",
                    labelName: "Currency",
                    localisedLabelName: GlobalLabels.Labels.'15062:LocalizedName,msdyn_CurrencyLabel',
                    visible: true,
                    required: true
                },
                {
                    fieldName: "PayMethod",
                    labelName: "Payment method",
                    localisedLabelName: GlobalLabels.Labels.'15062:LocalizedName,msdyn_PaymentMethodLabel',
                    visible: true,
                    required: true
                },
                {
                    fieldName: "SubmitterJustification",
                    labelName: "Employee justification",
                    localisedLabelName: GlobalLabels.Labels.'15062:LocalizedName,msdyn_EmployeeJustificationLabel',
                    visible: false,
                    required: false
                }
            );
            ForAll(
                Filter(
                    '@ExpenseManagement:ExpenseMobileFieldVisibilityEntity (mserp)',
                    LegalEntityId = varSelectedLegalEntity
                ) As VisibilityTable,
                Collect(
                    labelTableLookUp,
                    {
                        fieldName: VisibilityTable.FieldName,
                        labelName: VisibilityTable.Labels,
                        localisedLabelName: VisibilityTable.LocalisedLabelName
                    }
                )
            );
            If(
                featureEnabled = "True",
                ForAll(
                    Filter(
                        '@ExpenseManagement:ExpenseMobileFieldVisibilityEntity (mserp)',
                        LegalEntityId = varSelectedLegalEntity
                    ) As VisibilityTable,
                    Patch(
                        labelTableLookUp,
                        LookUp(
                            labelTableLookUp,
                            fieldName = VisibilityTable.FieldName
                        ),
                        {
                            visible: VisibilityTable.VisibilityType <> 'ExpenseFieldVisibilityType (mserp)'.'Do not display',
                            required: VisibilityTable.VisibilityType = 'ExpenseFieldVisibilityType (mserp)'.Required
                        }
                    )
                ),
                ForAll(
                    Filter(
                        'Display fields (mserp)',
                        'Company Code' = varSelectedLegalEntity
                    ) As VisibilityTable,
                    Patch(
                        labelTableLookUp,
                        LookUp(
                            labelTableLookUp,
                            fieldName = VisibilityTable.FieldName
                        ),
                        {
                            visible: VisibilityTable.Visibility <> 'Visibility (mserp)'.'Do not display',
                            required: false
                        }
                    )
                )
            )
        );
        UpdateContext({varLoadingSpinner : false});
        Set(
            varDefaultSalesTaxGroupCode,
            varSelectedExpenseDoc.'Sales tax group'
        );
        Set(
            varItemSalesTaxDefaultValueCode,
            varSelectedExpenseDoc.'Item sales tax group'
        );
        UpdateContext(
            {
                varSalesTaxAmount: Coalesce(
                    varSalesTaxAmount,
                    varSelectedExpenseDoc.'Actual sales tax amount'
                )
            }
        );
        UpdateContext({msCallStartedForSalestaxCalculation: false});
        Set(
            IsreceiptALreadyCreated,
            false
        );
        Set(
            isProjIdCalledFromAttach,
            false
        );
        Set(
            gblParams,
            {
                dropDownHeight: 60,
                dorpDownBorderThickness: 2,
                dropDownBorderColor: RGBA(
                    34,
                    102,
                    227,
                    1
                ),
                dropDownLabelColor: Color.Black,
                dropDownHoverFill: RGBA(
                    204,
                    222,
                    255,
                    1
                ),
                errorMessageSize: 18,
                dropDownFontSize: 24,
                expenseDataCardViewOnly: RGBA(
                    110,
                    110,
                    110,
                    1
                ),
                notificationTime: 4000
            }
        );
        //varibale determines whether any fields were changed
        UpdateContext({isDirty: false});
        
        UpdateContext({categoryModified: false});
        UpdateContext({varDefaultItemSalesTaxError: Blank()});
        UpdateContext({varDefaultSalesTaxError: Blank()});
        UpdateContext({leModified: false});
        UpdateContext({varRatePerMile: Blank()});
        UpdateContext({varMileageTotal: Blank()});
        UpdateContext(
            {
                locPerdiemAmountCurr: If(
                    currExpenseType = 'TrvExpType (mserp)'.'Per diem',
                    Text(varSelectedExpenseDoc.'Transaction amount'),
                    Blank()
                )
            }
        );
        UpdateContext(
            {
                varCurrentSelectedDate: If(
                    varIsCreate,
                    If(
                        IsBlank(OCRresponse),
                        Today(),
                        OCRresponse.transDate
                    ),
                    varSelectedExpenseDoc.'Transaction date'
                )
            }
        );
        Set(
            varDefaultSalesTaxGroupCode,
            varSelectedExpenseDoc.'Sales tax group'
        );
        Set(
            varItemSalesTaxDefaultValueCode,
            varSelectedExpenseDoc.'Item sales tax group'
        );
        UpdateContext(
            {
                varSalesTaxAmount: Coalesce(
                    varSalesTaxAmount,
                    varSelectedExpenseDoc.'Actual sales tax amount'
                )
            }
        );
        Set(
            varCurMileage,
            varSelectedExpenseDoc.Mileage
        );
        
        UpdateContext({varCurVehicleType: varSelectedExpenseDoc.'Vehicle type'});
        UpdateContext({varCurNoOfPass: varSelectedExpenseDoc.'Number of passengers'});
        UpdateContext({varDefaultProjLineStatus: varSelectedExpenseDoc.Billable});
        UpdateContext({varZipCodeChanged: false});
        UpdateContext({varCityChanged: false});
        UpdateContext({varStateChanged: false});
        UpdateContext({varCountryChanged: false});
        UpdateContext({varProjectChanged: false});

    scr03_ico_Back_4 As icon.ChevronLeft:
        Color: =icongconfig_backbutton.Color
        Fill: =icongconfig_backbutton.Fill
        Height: =icongconfig_backbutton.Height
        Icon: =Icon.ChevronLeft
        OnSelect: |-
            =
            Switch(
                varNavigatedFrom,
                "scr17",
                Navigate('Reports - Edit Screen'),
                "scr20",
                Navigate('Reports - View Only Screen'),
                "scr18",
                Navigate('Reports - Attach Expenses Screen'),
                "scr19",
                Navigate('Reports - View Attached Expenses Screen'),
                Blank(),
                Navigate('Expenses - List Screen')
            );
            UpdateContext({
                varNavigatedFrom:
                Blank()
            });
            UpdateContext(
                {
                    dirtyTransAmount : Blank(),
                    dirtyTransDate : Blank(),
                    dirtyMerchant : Blank(),    
                    varOnSelectTriggered: false,
                    varOnShowFields:false,
                    varOnChangeTriggered:false,
                    varSalesTaxAmount: Blank()
                }
            );
        Visible: =false
        Width: =icongconfig_backbutton.Width
        X: =303
        Y: =19
        ZIndex: =1

    scr03_img_NoReceiptOuter_1 As image:
        BorderColor: =RGBA(255, 0, 37, 0.2)
        BorderStyle: =BorderStyle.Dashed
        Fill: =RGBA(255, 255, 255, 1)
        Height: =Parent.Height / 4
        Image: |-
            =If(
                varFileFormat in ["jpg", "bmp", "jpeg", "png", "heic", "tif", "tiff", "raw"] && !IsBlank(varReceiptImage),
                varReceiptImage,
                varFileFormat in ["xlsx", "xls"],
                IconExcel,
                varFileFormat in ["docx", "doc"],
                IconWord,
                varFileFormat = "pdf",
                IconPDF,
                varFileFormat = "txt",
                IconTxt,
                IconMail
            )
        ImagePosition: |-
            =If(
                varFileFormat in ["jpg", "bmp", "jpeg", "png", "heic", "tif", "tiff", "raw"] && !IsBlank(varReceiptImage),
                ImagePosition.Stretch,
                ImagePosition.Center
            )
        RadiusBottomLeft: =18
        RadiusBottomRight: =18
        RadiusTopLeft: =18
        RadiusTopRight: =18
        Visible: =!IsBlank(varReceiptImage)
        Width: |
            =Parent.Width -  Self.X*2
        X: =24
        Y: |-
            =If(
                scr03_lbl_PolicyViolationWarning_1.Visible,
                scr03_lbl_PolicyViolationWarning_1.Y + scr03_lbl_PolicyViolationWarning_1.Height + 27,
                scr03_lbl_ValidationWarning_1.Y + scr03_lbl_ValidationWarning_1.Height + 27
            )
        ZIndex: =2

    scr03_img_NoReceiptInner_1 As image:
        BorderColor: =RGBA(166, 166, 166, 1)
        BorderStyle: =BorderStyle.Dashed
        BorderThickness: =5
        Fill: =RGBA(255, 255, 255, 1)
        Height: =Parent.Height/5
        Image: =ImgWhite
        ImagePosition: =ImagePosition.Fill
        RadiusBottomLeft: =8
        RadiusBottomRight: =8
        RadiusTopLeft: =8
        RadiusTopRight: =8
        Visible: =IsBlank(varReceiptImage) 
        Width: |
            =Parent.Width -  Self.X*2
        X: =44
        Y: =scr03_img_NoReceiptOuter_1.Y +(scr03_img_NoReceiptOuter_1.Height-scr03_img_NoReceiptInner_1.Height)/2
        ZIndex: =3

    scr03_lbl_AddReceipt_1 As label:
        Align: =Align.Center
        Color: =RGBA(34, 102, 227, 1)
        Font: =Font.'Segoe UI'
        FontWeight: =FontWeight.Semibold
        Height: =Parent.Height / 4
        OnSelect: |-
            =Navigate('Expenses - Capture Receipt Screen', ScreenTransition.None);
            UpdateContext(
                {
                    varOnSelectTriggered: false,
                    varOnShowFields:false,
                    varOnChangeTriggered:false
                }
            )
        Size: =21
        TabIndex: =0
        Text: |-
            =GlobalLabels.Labels.'15062:LocalizedName,msdyn_AddReceiptLabel'
        Visible: =IsBlank(varReceiptImage) 
        Width: |
            =Parent.Width -  Self.X*2
        X: =26
        Y: =scr03_img_NoReceiptOuter_1.Y
        ZIndex: =4

    scr03_lbl_ChangeReceipt_1 As label:
        Color: =scr03_lbl_AddReceipt_1.Color
        Fill: =Color.White
        Height: =70
        OnSelect: |-
            =Navigate('Expenses - View Receipt Screen', ScreenTransition.None, {varViewOnly : false});
            UpdateContext(
                {
                    varOnSelectTriggered: false,
                    varOnShowFields:false,
                    varOnChangeTriggered:false
                }
            )
        PaddingLeft: =35 + scr03_ico_ViewReceipt_1.Width
        Size: =17
        TabIndex: =0
        Text: |-
            =GlobalLabels.Labels.'15062:LocalizedName,msdyn_ViewReceiptLabel'
        Visible: =!(IsBlank(varReceiptImage))
        Width: =scr03_img_NoReceiptOuter_1.Width+1
        X: =scr03_img_NoReceiptOuter_1.X
        Y: =scr03_img_NoReceiptOuter_1.Y + (scr03_img_NoReceiptOuter_1.Height -Self.Height)+1
        ZIndex: =5

    scr03_ico_ViewReceipt_1 As image:
        AccessibleLabel: ="View receipt"
        Height: =33
        Image: =imageicon
        OnSelect: |-
            =Navigate('Expenses - View Receipt Screen', ScreenTransition.None, {varViewOnly : false});
            UpdateContext(
                {
                    varOnSelectTriggered: false,
                    varOnShowFields:false,
                    varOnChangeTriggered:false
                }
            )
        TabIndex: =0
        Visible: =!(IsBlank(varReceiptImage))
        Width: =18
        X: =scr03_lbl_ChangeReceipt_1.X + 25
        Y: =scr03_lbl_ChangeReceipt_1.Y + (scr03_lbl_ChangeReceipt_1.Height-scr03_ico_ViewReceipt_1.Height)/2
        ZIndex: =6

    scr03_lbl_ValidationWarning_1 As label:
        Align: =Align.Center
        Color: =RGBA(165, 33, 33, 1)
        Fill: =RGBA(249, 217, 217, 1)
        Font: =Font.'Segoe UI'
        Height: |-
            =If(
                Self.Visible,
                88,
                0
            )
        Size: =15
        Text: |-
            =//If(ctVarIsRequiredFieldEmpty,GlobalLabels.Labels.ValidationMsgExpenseNeedMoreDetails)
            //not having receipt in expense is part of policy violation
        Visible: =//ctVarIsRequiredFieldEmpty //Or ((varSelectedExpenseDoc.receiptsAttached = "No" Or IsBlank(varSelectedExpenseDoc)) And IsBlank(varReceiptImage))
        Width: =Parent.Width
        Y: =scr03_hdr_TopHeader_1.Height
        ZIndex: =7

    scr03_hdr_TopHeader_1 As hdr02_Header:
        Fill: =scr03_hdr_TopHeader_1.paramFill
        paramFill: =RGBA(255, 255, 255, 1)
        paramTitle: |-
            =If(
                varIsCreate,
                GlobalLabels.Labels.'15062:LocalizedName,msdyn_NewExpenseLabel',
                GlobalLabels.Labels.'15062:LocalizedName,msdyn_EditExpenseLabel'
            )
        ZIndex: =8

    scr03_ico_Back_1 As icon.ChevronLeft:
        AccessibleLabel: ="Press to go back"
        Color: =icongconfig_backbutton.Color
        Fill: =icongconfig_backbutton.Fill
        Height: =icongconfig_backbutton.Height
        Icon: =Icon.ChevronLeft
        OnSelect: |-
            =If(
                varExpenseButtonClicked,
                UpdateContext({varCntSelect: false});
                Navigate('Expenses - List Screen'),
                If(
                    varIsCreate || isDirty,
                    UpdateContext({ctVarExpenseDetailsBack: true}),
                    Select(scr03_ico_Back_4)
                );
                
            );
            UpdateContext({dirtyTransAmount: Blank()});
            UpdateContext({varSalesTaxAmount: Blank()});
            Set(
                gblNavigationDrawerVisibility,
                false
            );
        TabIndex: =0
        Width: =icongconfig_backbutton.Width
        X: =22.5
        Y: =(scr03_hdr_TopHeader_1.Height-Self.Height)/2
        ZIndex: =9

    scr03_lbl_PolicyViolationWarning_1 As label:
        Color: |-
            =/*If(
                !IsBlank(varMaxViolationLevel),
                If(
                    Value(varMaxViolationLevel) > 0 && Value(varMaxViolationLevel) <= 2,
                    RGBA(152, 111, 11, 1), //yellow
                    RGBA(217, 44, 44, 1)     //red
                )
            )*/
        Fill: |-
            =If(
                !IsBlank(varMaxViolationLevel),
                If(
                    Value(varMaxViolationLevel) > 0 && Value(varMaxViolationLevel) <= 2,
                    RGBA(255, 242, 195, 1), //yellow  
                    RGBA(249, 217, 217, 1)   //red
                )
            )
        Font: =Font.'Segoe UI'
        Height: |+
            =//If(ctVarIsRequiredFieldEmpty,GlobalLabels.Labels.ValidationMsgExpenseNeedMoreDetails,"Please add a receipt to this expense")
            If(
                CountRows(colPolViolations) > 0,
                88, 0
            )
            
        OnSelect: |-
            =Navigate('Expenses - Policy Violations Screen', ScreenTransition.None, {varCntExpenseTransactionNumber : varSelectedExpenseDoc.'Expense transaction number (mserp_exptransnumber)'})
        PaddingBottom: =18
        PaddingLeft: =54
        PaddingTop: =18
        Size: =15
        TabIndex: =0
        Text: |
            =Substitute(GlobalLabels.Labels.'15062:LocalizedName,msdyn_PolicyViolationExistsLabel', "$", Text(varNumViolation))
        Visible: =varNumViolation > 0
        Width: |
            =Parent.Width
        Y: =scr03_hdr_TopHeader_1.Height
        ZIndex: =10

    "'Expense Entr Container' As groupContainer.verticalAutoLayoutContainer":
        Height: |-
            =If(
                currExpenseType <> 'TrvExpType (mserp)'.Mileage,
                    Value('footerButtonsContainer - ExpenseEditScreen'.Y - Self.Y - 10),
                    Value(Parent.Height - Self.Y - 5 - ExpenseInfo_1.Height)
            )
        LayoutDirection: =LayoutDirection.Vertical
        LayoutGridColumns: =6
        LayoutGridRows: =6
        LayoutMode: =LayoutMode.Auto
        LayoutOverflowY: =LayoutOverflow.Scroll
        Width: |
            =Parent.Width
