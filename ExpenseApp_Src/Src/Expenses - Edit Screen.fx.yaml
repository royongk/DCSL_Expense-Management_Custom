    "'Expense Entr Container' As groupContainer.verticalAutoLayoutContainer":
        Height: |-
            =If(
                currExpenseType <> 'TrvExpType (mserp)'.Mileage,
                    Value('footerButtonsContainer - ExpenseEditScreen'.Y - Self.Y - 10),
                    Value(Parent.Height - Self.Y - 5 - ExpenseInfo_1.Height)
            )
        LayoutDirection: =LayoutDirection.Vertical
        LayoutGridColumnMinWidth: =0
        LayoutGridColumns: =6
        LayoutGridRowMinHeight: =0
        LayoutGridRows: =6
        LayoutMode: =LayoutMode.Auto
        LayoutOverflowY: =LayoutOverflow.Scroll
        Width: |
            =Parent.Width
        Y: |-
            =If(
                !IsEmpty(colAttachedReceipts) || !IsEmpty(colPendingReceipts), // 수정됨: 임시 영수증(colPendingReceipts) 조건 추가
                scr03_btn_AddReceipt_Always.Y + scr03_btn_AddReceipt_Always.Height + 15, // 15는 버튼과 폼 사이의 적절한 여백(Margin)
                scr03_img_NoReceiptOuter_1.Y + scr03_img_NoReceiptOuter_1.Height + 30
            )
        ZIndex: =13

        EditExpenseForm As form:
            AlignInContainer: =AlignInContainer.SetByContainer
            DataSource: ='DCSL Expense Line Expense Moblie Entity (mserp)'
            DefaultMode: |-
                =If(
                    varIsCreate,
                    FormMode.New,
                    If(
                        btnEditRefreshExpense.Visible && (featureEnabled = "False" || perdiemFeatureEnabled = "False"),
                        FormMode.View,
                        FormMode.Edit
                    )
                )
            Height: |-
                =If(
                    currExpenseType <> 'TrvExpType (mserp)'.Mileage,
                        500,
                        Value(Parent.Height - Self.Y - 10 - ExpenseInfo_1.Height)    
                )
            Item: =varSelectedExpenseDoc
            LayoutMaxHeight: =
            LayoutMaxWidth: =
            LayoutMinHeight: =250
            LayoutMinWidth: =320
            OnFailure: |-
                =If(
                    CountRows(Split(Text(Self.Error), ":")) > 2,
                    Notify(
                        Mid(
                            Mid(
                                EditExpenseForm.Error,
                                Find(":", EditExpenseForm.Error) + 2
                            ),
                            Find(
                                ":",
                                Mid(
                                    EditExpenseForm.Error,
                                    Find(":", EditExpenseForm.Error) + 2
                                )
                            ) + 2
                        ), 
                        NotificationType.Error, 
                        gblParams.notificationTime
                    ),
                    Notify(
                        Last(Split(Text(Self.Error), ":")).Value, 
                        NotificationType.Error, 
                        gblParams.notificationTime
                    )
                );
                UpdateContext({msCallStartedForSalestaxCalculation: false});
            OnSuccess: |-
                =// [신규 추가] 폼 제출 완료 직후의 생성 상태를 보존 (중간에 varIsCreate가 false로 바뀌는 버그 방지)
                UpdateContext({locWasCreate: varIsCreate});
                
                // 1. 새로 생성된 경비 번호(ExpTransNumber) 확보
                Set(
                    varTargetExpTransNumber,
                    Self.LastSubmit.'Expense transaction number (mserp_exptransnumber)'
                );
                
                // 2. RecId 확보
                UpdateContext({varSubmittedExpRecId: Self.LastSubmit.ExpenseRecId});
                
                // [수정됨] F&O 엔터티에 대한 무거운 Refresh() 호출 제거
                If(
                    IsBlank(varSubmittedExpRecId) || varSubmittedExpRecId = 0,
                    UpdateContext({
                        varSubmittedExpRecId: LookUp(
                            'DCSL Expense Line Expense Moblie Entity (mserp)', 
                            'Expense transaction number (mserp_exptransnumber)' = varTargetExpTransNumber
                        ).ExpenseRecId
                    })
                );
                
                // 3. 진행 표시 시작
                UpdateContext({varLoadingSpinner: true});
                
                // 4. 첨부 파일 업로드 처리
                If(
                    !IsEmpty(colPendingReceipts) && !IsBlank(varTargetExpTransNumber),
                    
                    // [4-1] JSON 페이로드 생성
                    UpdateContext({
                        locNewJsonPayload: JSON(
                            ForAll(
                                colPendingReceipts,
                                {
                                    FileName: Coalesce(mserp_filename, "Receipt"),
                                    FileExtension: Coalesce(mserp_fileextension, "jpg"), 
                                    
                                    FileContent: With(
                                        {
                                            varBase64String: Substitute(JSON(mserp_captureddocument, JSONFormat.IncludeBinaryData), """", "")
                                        },
                                        If(
                                            Find("base64,", varBase64String) > 0,
                                            Mid(varBase64String, Find("base64,", varBase64String) + 7),
                                            varBase64String
                                        )
                                    )
                                }
                            ), 
                            JSONFormat.IgnoreUnsupportedTypes
                        )
                    });
                    
                    // [4-2] D365 Action 호출 (업로드만 실행)
                    UpdateContext({
                        locNewReturnedIds: 'DCSL Apps Action Entity (mserp)'.mserp_uploadmultipleattachment({
                            _jsonPayload: locNewJsonPayload
                        })
                    });
                    
                    // [4-3] 반환된 ID가 있을 경우 D365 트랜잭션 커밋을 기다리기 위해 타이머 시작
                    If(
                        !IsBlank(locNewReturnedIds),
                        UpdateContext({ varStartAttachTimer: true }), // 타이머 시작
                        
                        // 업로드 자체가 실패한 경우 에러 알림 및 스피너 닫기
                        UpdateContext({varLoadingSpinner: false});
                        Notify("Uploading the attachment failed. Please try again.", NotificationType.Error, 5000)
                    )
                );
                
                // 💡 [핵심 수정 분기점]
                // 케이스 A: 처리할 첨부 파일이 없다면 곧바로 공통 마무리 로직 버튼(btn_ExecutePostSubmit)을 호출하여 화면을 이동시킵니다.
                // 케이스 B: 첨부 파일이 있다면 여기서 식을 끝내고, 화면 이동 없이 타이머(tmrAttachReceiptDelay)가 끝나기를 차분히 기다립니다.
                If(
                    IsEmpty(colPendingReceipts),
                    Select(btn_ExecutePostSubmit)
                )
            SnapToColumns: =false
            Width: =Parent.Width
            Y: =scr03_img_NoReceiptOuter_1.Y + scr03_img_NoReceiptOuter_1.Height + 30
            ZIndex: =1

            ExpenseType_DataCard As typedDataCard.allowedValuesStringEditCard:
                AllowedValues: |-
                    =Distinct(
                        'DCSL Expense Category Mapping Setup Entity (mserp)',
                        'Expense Type'
                    )
                BorderColor: =gblParams.dropDownBorderColor
                BorderStyle: =BorderStyle.Solid
                DataField: ="mserp_deexexpensetype"
                Default: =varSelectedExpenseType
                DisplayMode: =Parent.DisplayMode
                DisplayName: ="Expense Type (pre-selected)"
                Fill: =RGBA(0, 0, 0, 0)
                Height: =50
                Required: =false
                Update: =ComboBox_ExpenseType.Selected.Value
                Visible: =true
                Width: =Parent.Width
                X: =1
                Y: =expenseCategoryFieldOrder_Y - 120
                ZIndex: =1

