    cmp_DeleteReceiptDialog As cmp02_ConfirmationDialog:
        controlName: ="cmp02_ConfirmationDialog_DeleteReceipt"
        LegalEntity: =Text(varSelectedLegalEntity)
        OnLeftButtonClick: |-
            =UpdateContext({varShowDeleteReceiptDialog: false});
            UpdateContext({varDeleteReceiptId: Blank()})
        OnRightButtonClick: |-
            =UpdateContext({varShowDeleteReceiptDialog: false});
            If(
                !IsBlank(varDeleteReceiptId),
                // Pending receipt (new expense): just remove from pending list and stop
                If(
                    !IsBlank(LookUp(colPendingReceipts, mserp_entrecid = varDeleteReceiptId)),
                    RemoveIf(colPendingReceipts, mserp_entrecid = varDeleteReceiptId);
                    Notify(
                        GlobalLabels.Labels.'15062:LocalizedName,msdyn_ReceiptDetachedSuccessfullyLabel',
                        NotificationType.Success,
                        gblParams.notificationTime
                    );
                    UpdateContext({varDeleteReceiptId: Blank()}),
                IfError(
                    Patch(
                        'Expense Mobile Unattached Document Entity (mserp)',
                        LookUp('Expense Mobile Unattached Document Entity (mserp)', EntRecId = varDeleteReceiptId),
                        {
                            ExpTransNumber: Blank()
                        }
                    ),
                    Notify(
                        Substitute(
                            Match(FirstError.Details.HttpResponse, """message"":""([^""]*)""").FullMatch,
                            """message"":",
                            ""
                        ),
                        NotificationType.Error,
                        gblParams.notificationTime
                    )
                );
                // Refresh receipts collection from Expense Mobile Attached Document Entity (mserp)
                Refresh('Expense Mobile Attached Document Entity (mserp)');
                ClearCollect(
                    colAttachedReceipts,
                    SortByColumns(
                        Filter(
                            'Expense Mobile Attached Document Entity (mserp)',
                            'Reference record ID' = Value(varSelectedExpenseDoc.ExpenseRecId)
                        ),
                        "mserp_documentcreateddatetime",
                        SortOrder.Descending
                    )
                );
                // Update AttachedReceiptId (first receipt or blank)
                If(
                    !IsEmpty(colAttachedReceipts),
                    Patch(
                        'DCSL Expense Line Expense Moblie Entity (mserp)',
                        varSelectedExpenseDoc,
                        {
                            AttachedReceiptId: First(colAttachedReceipts).mserp_entrecid
                        }
                    ),
                    Patch(
                        'DCSL Expense Line Expense Moblie Entity (mserp)',
                        varSelectedExpenseDoc,
                        {
                            AttachedReceiptId: Blank()
                        }
                    )
                );
                // Update varReceiptImage for backward compatibility
                Set(
                    varReceiptImage,
                    If(
                        !IsEmpty(colAttachedReceipts),
                        First(colAttachedReceipts).mserp_captureddocument,
                        Blank()
                    )
                );
                Set(
                    varFileFormat,
                    If(
                        !IsEmpty(colAttachedReceipts),
                        First(colAttachedReceipts).mserp_fileextension,
                        Blank()
                    )
                );
                Notify(
                    GlobalLabels.Labels.'15062:LocalizedName,msdyn_ReceiptDetachedSuccessfullyLabel',
                    NotificationType.Success,
                    gblParams.notificationTime
                );
                UpdateContext({varDeleteReceiptId: Blank()})
                )
            )
        parmInDescriptionText: |-
            =GlobalLabels.Labels.'15062:LocalizedName,msdyn_DetachReceiptConfirmationTextLabel'
        parmInHeaderText: |-
            =GlobalLabels.Labels.'15062:LocalizedName,msdyn_DetachSelectedReceiptHeaderLabel'
