                =UpdateContext({varSubmittedExpTransNumber : EditExpenseForm.LastSubmit.'Expense transaction number (mserp_exptransnumber)'});
                //attach receipt if any
                UpdateContext({varAttachReceiptError : Blank()});
                If(
