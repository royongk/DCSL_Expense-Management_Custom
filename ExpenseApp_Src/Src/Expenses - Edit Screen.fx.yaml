    ExpenseInfo_1 As ExpenseInfo:
        Amount1: |-
            =Concatenate(
            If(IsBlank(
            If(
                IsBlank(varRatePerMile),
                Text(Value(varSelectedExpenseDoc.'Rate per mile'), "#,#0.000", varDefaultLanguage),
                Text(Value(varRatePerMile,"en-US"), "#,#0.000", varDefaultLanguage)
            )),
            Text(Value(0.00), "#,#0.000", varDefaultLanguage),
            If(
                IsBlank(varRatePerMile),
                Text(Value(varSelectedExpenseDoc.'Rate per mile'), "#,#0.000", varDefaultLanguage),
                Text(Value(varRatePerMile,"en-US"), "#,#0.000", varDefaultLanguage)
            )
            ), " ", varDefaultCurrency
            )
        Amount2: |-
            =Concatenate(
                If(
                    IsBlank(
                        If(
                            IsBlank(varMileageTotal),
                            Text(
                                Value(varSelectedExpenseDoc.'Transaction amount'),
                                "#,#0.00",
                                varDefaultLanguage
                            ),
                            Text(
                                Value(varMileageTotal,"en-US"),
                                "#,#0.00",
                                varDefaultLanguage
                            )
                        )
                    ),
                    Text(
                        Value(0.00),
                        "#,#0.00",
                        varDefaultLanguage
                    ),
                    If(
                        IsBlank(varMileageTotal),
                        Text(
                            Value(varSelectedExpenseDoc.'Transaction amount'),
                            "#,#0.00",
                            varDefaultLanguage
