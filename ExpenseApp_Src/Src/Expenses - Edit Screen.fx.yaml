"'Expenses - Edit Screen' As screen.'phoneDetailEditLayout_ver3.0'":
    Fill: =RGBA(248, 248, 248, 1)
    OnVisible: |-
        =// OnVisible 최상단에 조건문 추가
        If(
            !varIsAddingReceipt, // 첨부 파일 추가 중이 아닐 때만(즉, 처음 진입 시에만) 초기화
            UpdateContext({ 
                locCurrentSetup: Blank(),
                dirtyTransAmount: Blank(),
                locIsEditingAmount: false,
                locCategoryChange: false,
                // 👇 [신규 추가] AirfareAllowance 모드가 아닐때만 무조건 이전 Purpose 메모리를 날려버림
                ctxTargetPurpose: If(varAppMode <> "AirfareAllowance", Blank(), ctxTargetPurpose),
                varViewOnly: false,
                varStateSelected: Blank(),
                varZipCodeSelectedRecId: -1,
                varProjectHierarchyId: Blank(),
                onReloadButtonClick: false,
                // LCY 계산 결과 저장 변수 초기화 (기존 값이 있으면 사용, 없으면 빈 값)
                // 1. 기존 LCY에 문자열로 저장된 값("100.00 USD")에서 공백(" ")을 기준으로 금액과 통화를 분리
                locOriginalAmount: If(
                    !varIsCreate && !IsBlank(varSelectedExpenseDoc.LCY) && Find(" ", varSelectedExpenseDoc.LCY) > 0, 
                    Left(varSelectedExpenseDoc.LCY, Find(" ", varSelectedExpenseDoc.LCY) - 1),
                    Blank()
                ),
                locOriginalCurrency: If(
                    !varIsCreate && !IsBlank(varSelectedExpenseDoc.LCY) && Find(" ", varSelectedExpenseDoc.LCY) > 0, 
                    Right(varSelectedExpenseDoc.LCY, Len(varSelectedExpenseDoc.LCY) - Find(" ", varSelectedExpenseDoc.LCY)),
                    Blank()
                ),
                // 2. locCalculatedLCY에는 Value() 오류 방지를 위해, 실제로 환산된 '숫자'인 Transaction amount(예: 137601)를 저장
                locCalculatedLCY: If(
                    !varIsCreate, 
                    Text(varSelectedExpenseDoc.'Transaction amount'), 
                    Blank()
                )
            })
        );
        // 신규 경비 작성 모드 진입 시(영수증 추가를 위한 리프레시 상태가 아닐 때) 임시 영수증 비우기
        If(
            varIsCreate && !varIsAddingReceipt,
            Clear(colPendingReceipts);
            Clear(colAttachedReceipts)
        );
        
        
        // 통화 데이터를 가져와서 미리 정렬한 뒤 'colSortedCurrencies'라는 컬렉션에 저장합니다.
        ClearCollect(
            colCurrencies,
            'Currencies (mserp)'
        );
        
        ClearCollect(
            colSortedCurrencies,
            Sort(
                colCurrencies,
                If(
                    IsBlank('Sort Order') Or 'Sort Order' = 0, 
                    999999, 
                    'Sort Order'
                ),
                SortOrder.Ascending
            )
        );
        
        // 환율 정보 조회
        ClearCollect(colExchangeRates, 'Currency table (mserp)');
        
        If(
            !varIsAddingReceipt, // 첨부 파일 추가 후 복귀한 상태가 아닐 때만 필드 초기화 실행
        
            // 3-level category selection variables
            UpdateContext({
                varSelectedExpenseType: 
                If(
                    varIsCreate, 
                    // 신규 생성 시 varAppMode에 따라 기본값 설정
                    Switch(
                        varAppMode,
                        "ExpenseReport", "Expense Reimbursement",
                        "AirfareAllowance", "Allowance",
                        "BillingTripSettlement", "Billing Trip Settlement",
                        "EmployeeBenefit", "Employee Benefit",
                        Blank()
                    ),
                    // 수정 모드일 때는 초기화 (이후 로직에서 기존 값 매핑됨)
                    Coalesce(varSelectedExpenseDoc.'Expense Type', Blank())
                )
            });
        
            // =========================================================================
            // 🚀 [여기에 Step 1 추가] : Purpose가 매핑 테이블에 존재하는지 실제 검증
            // =========================================================================
            UpdateContext({
                locMatchedMapping: If(
                    varIsCreate && !IsBlank(ctxTargetPurpose),
                    LookUp('DCSL Expense Category Mapping Setup Entity (mserp)', 'Item or Service' = ctxTargetPurpose),
                    Blank()
                )
            });
        
            UpdateContext({
                // ctxTargetPurpose 값이 존재하고, 테이블 조회 결과도 빈 값이 아닐 때만 true (잠금 및 자동 주입)
                varForceLock: varIsCreate && !IsBlank(ctxTargetPurpose) && !IsBlank(locMatchedMapping)
            });
            // =========================================================================
        
            // 1. Reports에서 넘겨받은 Purpose(ctxTargetPurpose)를 Item or Service에 자동 할당
            UpdateContext({
                varSelectedItemOrService: If(
                    // 👇 [전문가 팁: 여기도 수정 필요] 기존 조건에 varForceLock을 추가합니다.
                    varForceLock, 
                    ctxTargetPurpose,
                    Coalesce(varSelectedExpenseDoc.'Item or Service', Blank())
                )
            });
        
            // 2. 자동 할당된 Item or Service와 Expense Type을 기반으로 Purchase Category 역추적 및 매핑
            UpdateContext({
                varSelectedPurchaseCategory: If(
                    // 👇 [전문가 팁: 여기도 수정 필요] 기존 조건에 varForceLock을 추가합니다.
                    varForceLock,
                    Coalesce(
                        LookUp(
                            'DCSL Expense Category Mapping Setup Entity (mserp)',
                            'Expense Type' = varSelectedExpenseType && 'Item or Service' = ctxTargetPurpose,
                            'Purchase Category'
                        ),
                        Blank()
                    ),
                    Coalesce(varSelectedExpenseDoc.'Purchase Category', Blank())
                )
            });
            UpdateContext({varSelectedPurchaseCategoryValue: ""});
            UpdateContext({
                curCategory: If(
                    !varIsCreate && !IsBlank(varSelectedExpenseDoc.'Expense category (mserp_costtype)'),
                    varSelectedExpenseDoc.'Expense category (mserp_costtype)',
                    // 신규 생성 시: 매핑 엔티티에서 3가지 조건으로 올바른 카테고리 실시간 조회
                    If(
                        varIsCreate && !IsBlank(varSelectedExpenseType) && !IsBlank(varSelectedItemOrService),
                        Coalesce(
                            LookUp(
                                'DCSL Expense Category Mapping Setup Entity (mserp)',
                                'Expense Type' = varSelectedExpenseType &&
                                'Purchase Category' = varSelectedPurchaseCategory &&
                                'Item or Service' = varSelectedItemOrService,
                                'Expense category'
                            ),
                            Blank()
                        ),
                        Blank()
                    )
                )
            });
            // 3. Purchase Category가 자동 세팅되었으므로, 하위 4단계인 Expense Category 컬렉션(colExpenseCategories) 미리 로드
            If(
                varIsCreate && !IsBlank(varSelectedExpenseType) && !IsBlank(varSelectedPurchaseCategory),
                ClearCollect(
                    colExpenseCategories,
                    SortByColumns(
                        Filter(
                            ForAll(
                                Filter(
                                    'DCSL Expense Category Mapping Setup Entity (mserp)',
                                    !IsBlank('Expense category') &&
                                    'Expense Type' = varSelectedExpenseType &&
                                    'Purchase Category' = varSelectedPurchaseCategory &&
                                    (
                                        (varAppMode = "AirfareAllowance" && Airfare = 'NoYes (mserp)'.Yes) ||
                                        (varAppMode <> "AirfareAllowance" && Airfare = 'NoYes (mserp)'.No)
                                    )
                                ) As MappingRecord,
                                LookUp(
                                    'Expense category (mserp)',
                                    'Expense category' = MappingRecord.'Expense category' &&
                                    Inactive = 'NoYes (mserp)'.No
                                )
                            ),
                            !IsBlank('Expense category') // 빈 레코드 제거
                        ),
                        "mserp_expensecategory",
                        SortOrder.Ascending
                    )
                );
                
                // 4. 추가로 환율 및 고정금액 처리를 위한 현재 셋업(locCurrentSetup) 데이터 메모리 로드
                UpdateContext({
                    locCurrentSetup: LookUp(
                        'DCSL Expense Category Mapping Setup Entity (mserp)',
                        'Expense Type' = varSelectedExpenseType && 
                        'Purchase Category' = varSelectedPurchaseCategory && 
                        'Item or Service' = varSelectedItemOrService
                    )
                })
            );
            // Cost Center context
            UpdateContext({varSelectedCostCenter: Blank()});
            // TargetText context
            UpdateContext({TargetText: ""});
            If(
                !varIsCreate && !IsBlank(varSelectedExpenseDoc.CostCenter),
                UpdateContext({
                    varSelectedCostCenter: LookUp(
                        'DCSL HPRCostShareApproval Entity (mserp)',
                        'Dimension value' = varSelectedExpenseDoc.CostCenter
                    )
                })
            );
            // Project context
            UpdateContext({varSelectedProject: Blank()});
            // Project type context (will be derived from Expense Type / Purchase Category / Item or Service)
            UpdateContext({varSelectedProjectType: Blank()});
            If(
                !varIsCreate && !IsBlank(varSelectedExpenseDoc.Project),
                UpdateContext({
                    varSelectedProject: LookUp(
                        Filter(
                            'DCSL Financial Dimension Master (mserp)',
                            'Dimension name' = "Project"
                        ),
                        'Dimension value' = varSelectedExpenseDoc.Project
                    )
                })
            );
        );
        // Load existing Department and Benefit Type from Expense Category (reverse lookup)
        // [수정됨] 이미 Dataverse에서 올바른 3단계 카테고리 값(Expense Type, Purchase Category 등)을
        // 성공적으로 불러왔다면, 부정확한 Reverse Lookup으로 덮어쓰지 않도록 방어 로직 추가
        If(
            !varIsCreate && 
            !IsBlank(varSelectedExpenseDoc.'Expense Type') &&
            (IsBlank(varSelectedExpenseType) || IsBlank(varSelectedPurchaseCategory) || IsBlank(varSelectedItemOrService)),
            
            With(
                {
                    mappingRecord: LookUp(
                        'DCSL Expense Category Mapping Setup Entity (mserp)',
                        'Expense Type' = varSelectedExpenseDoc.'Expense Type' &&
                        'Purchase Category' = varSelectedExpenseDoc.'Purchase Category' &&
                        'Item or Service' = varSelectedExpenseDoc.'Item or Service'
                    )
                },
                If(
                    !IsBlank(mappingRecord),
                    UpdateContext({
                        varSelectedExpenseType: mappingRecord.'Expense Type'
                    });
                    UpdateContext({
                        varSelectedPurchaseCategory: mappingRecord.'Purchase Category'
                    });
                    UpdateContext({
                        varSelectedItemOrService: mappingRecord.'Item or Service'
                    })
                )
            )
        );
        
        UpdateContext({curIntercompanyLE: Coalesce(DataCardValue39_1.Selected.Value, varSelectedExpenseDoc.'Legal entity')});
        UpdateContext({curInterCompanyProjectCategory: varSelectedExpenseDoc.'Intercompany project category'});
        UpdateContext({curProjIdSelected: varSelectedExpenseDoc.'Project ID'});
        UpdateContext({curCountrySelected: varSelectedExpenseDoc.'Country/region (mserp_countryregion)'});
        UpdateContext({curStateSelected: varSelectedExpenseDoc.'State/province'});
        UpdateContext({curBillIssuedToSelected: varSelectedExpenseDoc.'Hotel bill issued to'});
        UpdateContext({taxModifiedByUser: false});
        UpdateContext({varLoadingSpinner : true});
        If(
            !varIsCreate && 
            !IsBlank(varSelectedExpenseDoc.'Expense category (mserp_costtype)') &&
            varSelectedExpenseDoc.'Expense category (mserp_costtype)' <> "",
            UpdateContext(
                {
                    locItemizeButtonVisibilityFlag : 'Expense mobile master data (mserp)'.mserp_trvexpmobilemasterdataentity_isexpenseitemizable(LookUp('Expense mobile master data (mserp)',Email = User().Email).'Expense mobile master data (mserp)', 
                    {
                        CostType: varSelectedExpenseDoc.'Expense category (mserp_costtype)',
                        SplitLineType:"Default",
                        LineType: If(varSelectedExpenseDoc.'Expense line type' = 'Expense line type (mserp)'.'Itemized header',"ItemizedHeader","Default")
                    }).return
        
                }
            ),
            UpdateContext({locItemizeButtonVisibilityFlag: false})
        );
        If(
            !varIsCreate && gblIsProjectValidationFlag,
            Clear(colGetProjectsBasedOnResourceCategory);
            UpdateContext({
                varGetProjectsJson :
                IfError(
                    Text(
                        'Projects (mserp)'.mserp_trvexpmobileprojentity_getprojectsbasedonresourcecategory(LookUp('Expense mobile master data (mserp)',Email = User().Email).'Expense mobile master data (mserp)',
                            {
                                employeeLegalEntity: varSelectedLegalEntity,
                                interCompanyLegalEntity: curIntercompanyLE,
                                categoryId: 
                                If(
                                    IsBlank(If(Upper(varSelectedLegalEntity) <> Upper(curIntercompanyLE), varSelectedExpenseDoc.'Intercompany project category', curCategory)),
                                    "",
                                    If(Upper(varSelectedLegalEntity) <> Upper(curIntercompanyLE), varSelectedExpenseDoc.'Intercompany project category', curCategory)
                                )
                            }).return
                    ),
                    ""
                )
            });
            If(
                !IsBlank(varGetProjectsJson),
                ClearCollect(
                    colGetProjectsBasedOnResourceCategory,
                    ForAll(
                        MatchAll(varGetProjectsJson, "\{""projId"":""(?<projId>[^""]*)"",""projName"":""(?<projName>[^""]*)""\}") As ProjectListFromCol,
                        {
                            projectId: ProjectListFromCol.projId, 
                            projectName: ProjectListFromCol.projName
                        }
                    )
                ),
                Clear(colGetProjectsBasedOnResourceCategory)
            );
            
            If(
                !IsBlankOrError(curProjIdSelected),
                UpdateContext({
                    varProjectHierarchyId:
                        LookUp(
                            'Projects (mserp)',
                            'Project ID' = curProjIdSelected,
                            HierarchyId
                        )
                })
            );
        );
        UpdateContext({locItemizationCheck : locItemizeButtonVisibilityFlag});
        UpdateContext(
            {
                timerCostType: false,
                timerProj: false,
                timerHBIT: false,
                timerCountry: false,
                timerState: false,
                locAllowNavigationBack: true
            }
        );
        // populate the current expense type of the selected document
        UpdateContext(
            {
                currExpenseType: Coalesce(
                    varSelectedExpenseDoc.'Expense type',
                    If(
                        !IsBlank(varSelectedExpenseDoc.'Expense category (mserp_costtype)'),
                        LookUp(
                            'Expense category (mserp)',
                            'Expense category' = varSelectedExpenseDoc.'Expense category (mserp_costtype)',
                            'Expense type'
                        ),
                        Blank()
                    )
                )
            }
        );
        If(
            !varIsCreate,
            UpdateContext({msCallStartedForSalestaxCalculation: true});
            UpdateContext({varOnShowFields: false});
            UpdateContext({varOnSelectTriggered: false});
            UpdateContext({varOnChangeTriggered: false});
            
        );
        UpdateContext(
            {
                featureEnabled: If(
                    userRecord.IsReimaginedUIEnabled = 'NoYes (mserp)'.Yes,
                    "True",
                    "False"
                ),
                perdiemFeatureEnabled: If(
                    userRecord.IsReImaginedPerDiemEnabled = 'NoYes (mserp)'.Yes,  //this needs to be changed to the perdiem feature enabled
                    "True",
                    "False"
                )
            }
        );
        //Check if the itemization is over or under distributed
        If(
            !varIsCreate,
            If(
                varRemainingAmount < 0,
                Notify(
                    GlobalLabels.Labels.'15062:LocalizedName,msdyn_ThisExpenseIsOverItemizedLabel',
                    NotificationType.Error,
                    gblParams.notificationTime
                ),
                varRemainingAmount > 0,
                Notify(GlobalLabels.Labels.'15062:LocalizedName,msdyn_ThisExpenseIsNotCompletelyItemizedLabel',
                    NotificationType.Warning,
                    gblParams.notificationTime
                )
            )
        );
        If(
            currExpenseType = 'TrvExpType (mserp)'.'Per diem' && (featureEnabled = "False" || perdiemFeatureEnabled = "False"),
            Notify(
                GlobalLabels.Labels.'15062:LocalizedName,msdyn_PerdiemFeatureDisabledWarning',
                //"Enable both re-imagined features to be able to edit this expense",
                NotificationType.Warning,
                gblParams.notificationTime
            )
        );
        //if labelTableLookUp not empty
        If(
            CountRows(labelTableLookUp) <= 0,
            Collect(
                labelTableLookUp,
                {
                    fieldName: "CostType",
                    labelName: "Expense category",
                    localisedLabelName: GlobalLabels.Labels.'15062:LocalizedName,msdyn_ExpenseCategoryLabel',
                    visible: true,
                    required: true
                },
                {
                    fieldName: "TransDate",
                    labelName: "Transaction date",
                    localisedLabelName: GlobalLabels.Labels.'15062:LocalizedName,msdyn_TransactionDateLabel',
                    visible: true,
                    required: true
                },
                {
                    fieldName: "AmountCurr",
                    labelName: "Transaction amount",
                    localisedLabelName: GlobalLabels.Labels.'15062:LocalizedName,msdyn_TransactionAmountLabel',
                    visible: true,
                    required: true
                },
                {
                    fieldName: "ExchangeCode",
                    labelName: "Currency",
                    localisedLabelName: GlobalLabels.Labels.'15062:LocalizedName,msdyn_CurrencyLabel',
                    visible: true,
                    required: true
                },
                {
                    fieldName: "PayMethod",
                    labelName: "Payment method",
                    localisedLabelName: GlobalLabels.Labels.'15062:LocalizedName,msdyn_PaymentMethodLabel',
                    visible: true,
                    required: true
                },
                {
                    fieldName: "SubmitterJustification",
                    labelName: "Employee justification",
                    localisedLabelName: GlobalLabels.Labels.'15062:LocalizedName,msdyn_EmployeeJustificationLabel',
                    visible: false,
                    required: false
                }
            );
            ForAll(
                Filter(
                    '@ExpenseManagement:ExpenseMobileFieldVisibilityEntity (mserp)',
                    LegalEntityId = varSelectedLegalEntity
                ) As VisibilityTable,
                Collect(
                    labelTableLookUp,
                    {
                        fieldName: VisibilityTable.FieldName,
                        labelName: VisibilityTable.Labels,
                        localisedLabelName: VisibilityTable.LocalisedLabelName
                    }
                )
            );
            If(
                featureEnabled = "True",
                ForAll(
                    Filter(
                        '@ExpenseManagement:ExpenseMobileFieldVisibilityEntity (mserp)',
                        LegalEntityId = varSelectedLegalEntity
                    ) As VisibilityTable,
                    Patch(
                        labelTableLookUp,
                        LookUp(
                            labelTableLookUp,
                            fieldName = VisibilityTable.FieldName
                        ),
                        {
                            visible: VisibilityTable.VisibilityType <> 'ExpenseFieldVisibilityType (mserp)'.'Do not display',
                            required: VisibilityTable.VisibilityType = 'ExpenseFieldVisibilityType (mserp)'.Required
                        }
                    )
                ),
                ForAll(
                    Filter(
                        'Display fields (mserp)',
                        'Company Code' = varSelectedLegalEntity
                    ) As VisibilityTable,
                    Patch(
                        labelTableLookUp,
                        LookUp(
                            labelTableLookUp,
                            fieldName = VisibilityTable.FieldName
                        ),
                        {
                            visible: VisibilityTable.Visibility <> 'Visibility (mserp)'.'Do not display',
                            required: false
                        }
                    )
                )
            )
        );
        UpdateContext({varLoadingSpinner : false});
        Set(
            varDefaultSalesTaxGroupCode,
            varSelectedExpenseDoc.'Sales tax group'
        );
        Set(
            varItemSalesTaxDefaultValueCode,
            varSelectedExpenseDoc.'Item sales tax group'
        );
        UpdateContext(
            {
                varSalesTaxAmount: Coalesce(
                    varSalesTaxAmount,
                    varSelectedExpenseDoc.'Actual sales tax amount'
                )
            }
        );
        UpdateContext({msCallStartedForSalestaxCalculation: false});
        Set(
            IsreceiptALreadyCreated,
            false
        );
        Set(
            isProjIdCalledFromAttach,
            false
        );
        Set(
            gblParams,
            {
                dropDownHeight: 60,
                dorpDownBorderThickness: 2,
                dropDownBorderColor: RGBA(
                    34,
                    102,
                    227,
                    1
                ),
                dropDownLabelColor: Color.Black,
                dropDownHoverFill: RGBA(
                    204,
                    222,
                    255,
                    1
                ),
                errorMessageSize: 18,
                dropDownFontSize: 24,
                expenseDataCardViewOnly: RGBA(
                    110,
                    110,
                    110,
                    1
                ),
                notificationTime: 4000
            }
        );
        //varibale determines whether any fields were changed
        UpdateContext({isDirty: false});
        
        UpdateContext({categoryModified: false});
        UpdateContext({varDefaultItemSalesTaxError: ""});
        UpdateContext({varDefaultSalesTaxError: ""});
        UpdateContext({leModified: false});
        UpdateContext({varRatePerMile: ""});
        UpdateContext({varMileageTotal: ""});
        UpdateContext(
            {
                locPerdiemAmountCurr: If(
                    currExpenseType = 'TrvExpType (mserp)'.'Per diem',
                    Text(varSelectedExpenseDoc.'Transaction amount'),
                    Blank()
                )
            }
        );
        UpdateContext(
            {
                varCurrentSelectedDate: If(
                    varIsCreate,
                    If(
                        IsBlank(OCRresponse),
                        Today(),
                        OCRresponse.transDate
                    ),
                    varSelectedExpenseDoc.'Transaction date'
                )
            }
        );
        Set(
            varDefaultSalesTaxGroupCode,
            varSelectedExpenseDoc.'Sales tax group'
        );
        Set(
            varItemSalesTaxDefaultValueCode,
            varSelectedExpenseDoc.'Item sales tax group'
        );
        UpdateContext(
            {
                varSalesTaxAmount: Coalesce(
                    varSalesTaxAmount,
                    varSelectedExpenseDoc.'Actual sales tax amount'
                )
            }
        );
        Set(
            varCurMileage,
            varSelectedExpenseDoc.Mileage
        );
        
        UpdateContext({varCurVehicleType: varSelectedExpenseDoc.'Vehicle type'});
        UpdateContext({varCurNoOfPass: varSelectedExpenseDoc.'Number of passengers'});
        UpdateContext({varDefaultProjLineStatus: varSelectedExpenseDoc.Billable});
        UpdateContext({varZipCodeChanged: false});
        UpdateContext({varCityChanged: false});
        UpdateContext({varStateChanged: false});
        UpdateContext({varCountryChanged: false});
        UpdateContext({varProjectChanged: false});
        UpdateContext({varShowDeleteReceiptDialog: false});
        UpdateContext({varDeleteReceiptId: Blank()});
        // Pending receipts are used only during new expense creation (before ExpTransNumber exists).
        // When entering edit mode for an existing expense, clear pending to avoid mixing states.
        /*
        If(
            !IsBlank(varSelectedExpenseDoc) &&
            !IsBlank(varSelectedExpenseDoc.'Expense transaction number (mserp_exptransnumber)'),
            // Attached receipts are always loaded from Expense Mobile Attached Document Entity (mserp)
            Refresh('Expense Mobile Attached Document Entity (mserp)');
            ClearCollect(
                colAttachedReceipts,
                SortByColumns(
                    Filter(
                        'Expense Mobile Attached Document Entity (mserp)',
                        'Reference record ID' = Value(varSelectedExpenseDoc.ExpenseRecId)
                    ),
                    "mserp_documentcreateddatetime",
                    SortOrder.Descending
                )
            );
            // 미리보기용 변수 세팅
            Set(
                varReceiptImage,
                If(
                    !IsEmpty(colAttachedReceipts),
                    First(colAttachedReceipts).mserp_captureddocument,
                    Blank()
                )
            );
            Set(
                varFileFormat,
                If(
                    !IsEmpty(colAttachedReceipts),
                    First(colAttachedReceipts).mserp_fileextension,
                    Blank()
                )
            )
        );
        */
        
        // 복사 팝업창 가시성 제어 변수
        UpdateContext({ locShowCopyPopup: false });
        
        // 1. 접속한 사용자의 마스터 정보 가져오기 (화면에 '본인' 이름을 표시하기 위함)
        Set(
            varCurrentD365User,
            LookUp('Expense mobile master data (mserp)', Email = User().Email)
        );
        
        // 2. [변경됨] 가상 필드 대신, 물리적 텍스트 필드(mserp_delegateduser)로 서버에서 직접 필터링합니다.
        ClearCollect(
            colActiveDelegations,
            Filter(
                '@DEEX:DEEX_20316 (mserp)',
                // 텍스트 ID 끼리 비교합니다. (varCurrentD365User.mserp_userid 가 "DEEX1.ERP" 형태)
                Delegate = varCurrentD365User.ID && 
                'Start date' <= Today() &&
                'End date' >= Today()
            )
        );
        
        // 3. 콤보박스 선택지 생성 (첫 번째: 접속자 본인)
        ClearCollect(
            colCreatingWorkerOptions,
            {
