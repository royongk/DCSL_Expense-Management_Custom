    tmr_ProcessReceipts As timer:
        Duration: =2000
        Height: =70
        OnTimerEnd: |-
            =// 1. 방어 로직: 경비 번호가 없으면 루프 중단 (첫 번째 실패 방지)
            If(
                IsBlank(varTargetExpTransNumber),
                Notify(
                    "오류: 경비 번호를 찾을 수 없습니다. 잠시 후 다시 시도하세요.",
                    NotificationType.Error
                );
                UpdateContext({varStartReceiptProcessing: false});
            ,
                // 2. [핵심] 데이터 소스 강제 새로고침
                // 루프가 돌 때마다 F&O 서버의 최신 상태(업로드된 파일 목록)를 가져옵니다.
                Refresh('Expense Mobile Unattached Document Entity (mserp)');
            
                // 3. 현재 처리할 영수증 가져오기
                UpdateContext(
                    {
                        _currentReceipt: First(colPendingReceipts)
                    }
                );
            
                // 4. [추가] _currentReceipt 및 LookUp 결과 방어 코드
                If(
                    !IsBlank(_currentReceipt) && !IsBlank(_currentReceipt.mserp_entrecid),
                    With(
                        {
                            receiptRecord: LookUp(
                                'Expense Mobile Unattached Document Entity (mserp)',
                                EntRecId = _currentReceipt.mserp_entrecid
                            )
                        },
                        If(
                            !IsBlank(receiptRecord),
                            // 4-1. Patch 실행 (단일 영수증 기준 로직 확장)
                            IfError(
                                Patch(
                                    'Expense Mobile Unattached Document Entity (mserp)',
                                    receiptRecord,
                                    { ExpTransNumber: varTargetExpTransNumber }
                                ),
                                // 실패 시: 원본 로직처럼 404(NotFoundStatusCode)는 무시, 그 외만 로그 수집
                                With(
                                    {
                                        errorDetails: FirstError.Details
                                    },
                                    If(
                                        !IsBlank(errorDetails) &&
                                        Text(errorDetails.HttpStatusCode) = NotFoundStatusCode,
                                        // 404인 경우 무시 (원본과 동일한 동작)
                                        Blank(),
                                        Collect(
                                            colErrorLog,
                                            {
                                                FailedRecordId: _currentReceipt.mserp_entrecid,
                                                ErrorMessage: FirstError.Message
                                            }
                                        )
                                    )
                                )
                            ),
                            // LookUp 실패 시: 데이터 동기화 지연 등으로 레코드를 찾지 못한 경우
                            Collect(
                                colErrorLog,
                                {
                                    FailedRecordId: _currentReceipt.mserp_entrecid,
                                    ErrorMessage: "Receipt record not found after refresh"
                                }
                            )
                        )
                    ),
                    // _currentReceipt 자체가 Blank인 경우 (이론적으로는 거의 발생하지 않지만 방어)
                    If(
                        !IsEmpty(colPendingReceipts),
                        Collect(
                            colErrorLog,
                            {
                                FailedRecordId: Blank(),
                                ErrorMessage: "Current receipt is blank"
                            }
                        )
                    )
                );
            
                // 5. 처리된 영수증 제거 (에러 발생 여부와 관계없이, 컬렉션에 존재하는 경우만)
                If(
                    !IsBlank(_currentReceipt) &&
                    !IsEmpty(colPendingReceipts) &&
                    !IsBlank(
                        LookUp(
                            colPendingReceipts,
                            mserp_entrecid = _currentReceipt.mserp_entrecid
                        )
                    ),
                    Remove(colPendingReceipts, _currentReceipt)
                );
            
                // 6. 모든 처리가 끝났는지 확인
                If(
                    IsEmpty(colPendingReceipts),
                    // (1) 타이머 정지
                    UpdateContext({varStartReceiptProcessing: false});
                    
                    // (2) 데이터 동기화 후 연결된 영수증 최종 확인
                    Refresh('View Attached Receipts to Expense Lines (mserp)');
                    Refresh('Expense Mobile Unattached Document Entity (mserp)');
                    
                    If(
                        !IsBlank(varTargetExpTransNumber),
                        ClearCollect(
                            colAttachedReceipts,
                            SortByColumns(
                                Filter(
                                    'View Attached Receipts to Expense Lines (mserp)',
                                    'Reference record ID' = Coalesce(
                                        Value(varSelectedExpenseDoc.ExpenseRecId),
                                        Value(EditExpenseForm.LastSubmit.ExpenseRecId)
                                    )
                                ),
                                "mserp_createddatetime1",
                                SortOrder.Descending
                            )
                        )
                    );
                    
                    // (3) 에러 확인 - 일부 실패한 경우만 사용자에게 알림
                    If(
                        !IsEmpty(colErrorLog),
                        Notify(
                            Concatenate(
                                "일부 파일 연결 실패 (",
                                Text(CountRows(colErrorLog)),
                                "개). 나중에 다시 추가해주세요."
                            ),
                            NotificationType.Error,
                            gblParams.notificationTime
                        )
                    );
            
                    // (4) 후처리 액션 (저장 완료)
                    Select(btn_PostSaveAction)
                )
            );
        Repeat: =!IsEmpty(colPendingReceipts)
        Start: =varStartReceiptProcessing
        Visible: =false
        Width: =280
        X: =337
        Y: =931
        ZIndex: =24

    btn_PostSaveAction As button:
        Height: =70
        OnSelect: |-
            =// [btn_PostSaveAction.OnSelect]
            // 저장 후 알림, 변수 정리, 화면 이동을 담당하는 공통 로직입니다.
            
            // [추가] 영수증 처리 완료 확인
            If(
                varStartReceiptProcessing = true,
                // 타이머가 아직 실행 중이면 대기 (이론적으로는 발생하지 않아야 함)
                Notify("영수증 처리 중입니다. 잠시만 기다려주세요.", NotificationType.Warning, 2000),
                // 타이머 완료 또는 영수증이 없는 경우
                
                // 1. 결과 알림
                If(
                    varIsCreate,
                    Notify(GlobalLabels.Labels.'15062:LocalizedName,msdyn_ExpenseCreateMessageLabel', NotificationType.Success, gblParams.notificationTime),
                    If(isDirty || isExpenseReceiptAttached, Notify(GlobalLabels.Labels.'15062:LocalizedName,msdyn_ExpenseUpdateMessageLabel', NotificationType.Success, gblParams.notificationTime))
                );
                
                // 2. 상태 변수 초기화
                Set(varIsCreate, false);
                Set(varSelectedExpenseDoc, EditExpenseForm.LastSubmit);
                UpdateContext({varSubmittedExpTransNumber :Blank()});
                Set(isExpenseReceiptAttached, false);
                Set(OCRresponse, Blank());
                Set(gblNavigationDrawerVisibility, false);
                
                // 3. [추가] Pending 영수증 정리 (타이머 완료 후)
                Clear(colPendingReceipts);
                Clear(colRetryReceipts);
                Clear(colErrorLog);
                
                // 4. 첨부 파일 뷰 갱신
                If(
                    !IsBlank(varSelectedExpenseDoc) && !IsBlank(varSelectedExpenseDoc.'Expense transaction number (mserp_exptransnumber)'),
                    Refresh('View Attached Receipts to Expense Lines (mserp)');
                    ClearCollect(
                        colAttachedReceipts,
                        SortByColumns(
                            Filter(
                                'View Attached Receipts to Expense Lines (mserp)',
                                'Reference record ID' = Value(varSelectedExpenseDoc.ExpenseRecId)
                            ),
                            "mserp_createddatetime1",
                            SortOrder.Descending
                        )
                    );
                    Set(varReceiptImage, If(!IsEmpty(colAttachedReceipts), First(colAttachedReceipts).mserp_captureddocument, Blank()));
                    Set(varFileFormat, If(!IsEmpty(colAttachedReceipts), First(colAttachedReceipts).mserp_fileextension, Blank()))
                )
            );
            
            // [추가] 영수증 처리 완료 확인 후 나머지 로직 실행
            If(
                varStartReceiptProcessing = false,
                // 4. Itemization(항목별 상세) 로직 처리
                If(gblItemizeExpenseButtonClick,
                    Set(IsCreditcardTransactionInLocalCurrency, LookUp('Expense lines (mserp)', 'Expense transaction number (mserp_exptransnumber)' = varSelectedExpenseDoc.'Expense transaction number (mserp_exptransnumber)', IsCreditcardTransactionInLocalCurrency));
                    ClearCollect(dsItemizations, AddColumns(GroupBy(Filter('Expense lines (mserp)', 'Expense line type' = 'Expense line type (mserp)'.'Itemized line' && 'Expense transaction number (mserp_itemizedline_exptransnumber)' = varSelectedExpenseDoc.'Expense transaction number (mserp_exptransnumber)'), 'Itemization group', Itemization), StartDate, Text(Last(SortByColumns(Itemization,"mserp_transdate",SortOrder.Descending)).'Transaction date',"yyyy-mm-dd hh:mm:ssZ"), DailyRate, If(IsCreditcardTransactionInLocalCurrency = 'NoYes (mserp)'.No, First(Itemization).'Transaction amount', First(Itemization).'Local amount'), Quantity, CountRows(Itemization), SubCategoryName, First(Itemization).'Expense subcategory name', SubCategoryRecId, First(Itemization).'Expense subcategory', ItemizationGroupId , mserp_expenseitemizationgroupid));
                );
                
                // 5. 화면 이동 (Navigation)
                If(
                    locAllowNavigationBack,
                    If(
                        varIsCreate,
                        Navigate('Expenses - List Screen'),
                        If(
                            !IsBlank(varNavigatedFrom),
                            UpdateContext({varExpenseReportNumber : varSelectedReport.'Expense report number'});
                            Set(varSelectedReport, LookUp('Expense reports (mserp)','Expense report number' = varExpenseReportNumber));
                            ClearCollect(colAttachedExpensesForReport, Filter('Expense lines (mserp)', 'Expense report number (mserp_expnumber)' = varSelectedReport.'Expense report number' && 'Expense line type' <> 'Expense line type (mserp)'.'Itemized line'));
                            ClearCollect(colAttachedExpenses, colAttachedExpensesForReport)
                        );
                
                        If(
                            gblItemizeExpenseButtonClick,
                            Navigate('Itemization - Detail Screen',Transition.None,{varNavigatedFrom : varNavigatedFrom, varItemizationScreen: "itemizationDetailScreen"}),
                            Switch(
                                varNavigatedFrom,
                                "scr17", Navigate('Reports - Edit Screen'),
                                "scr20", Navigate('Reports - View Only Screen'),
                                "scr18", Navigate('Reports - Attach Expenses Screen'),
                                "scr19", Navigate('Reports - View Attached Expenses Screen'),
                                Blank(), Navigate('Expenses - List Screen')
                            );
                            UpdateContext({varNavigatedFrom : Blank()});
                        )
                    );
                    UpdateContext({
                        dirtyTransAmount:Blank(),
                        dirtyTransDate : Blank(),
                        dirtyMerchant : "",
                        varOnSelectTriggered: false,
                        varOnShowFields:false,
                        varOnChangeTriggered:false,
                        varSalesTaxAmount: Blank()
                    })
                );
                
                Set(gblItemizeExpenseButtonClick, false);
                UpdateContext({msCallStartedForSalestaxCalculation: false});
                // 혹시 위 조건에 걸리지 않아 이동하지 않았을 경우를 대비한 기본 이동
                Navigate('Expenses - List Screen', ScreenTransition.None)
            )
        Size: =24
        Text: ="버튼"
        Visible: =false
        Width: =280
        X: =331
        Y: =931
        ZIndex: =25

