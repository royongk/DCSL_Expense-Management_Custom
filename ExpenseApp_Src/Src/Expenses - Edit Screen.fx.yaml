    "'Expense Entr Container' As groupContainer.verticalAutoLayoutContainer":
        Height: |-
            =If(
                currExpenseType <> 'TrvExpType (mserp)'.Mileage,
                    Value('footerButtonsContainer - ExpenseEditScreen'.Y - Self.Y - 10),
                    Value(Parent.Height - Self.Y - 5 - ExpenseInfo_1.Height)
            )
        LayoutDirection: =LayoutDirection.Vertical
        LayoutGridColumns: =6
        LayoutGridRows: =6
        LayoutMode: =LayoutMode.Auto
        LayoutOverflowY: =LayoutOverflow.Scroll
        Width: |
            =Parent.Width
        Y: |-
            =If(
                !IsEmpty(colAttachedReceipts),
                scr03_btn_AddReceipt_Always.Y + scr03_btn_AddReceipt_Always.Height,
                If(
                    IsEmpty(colAttachedReceipts) && !IsBlank(varReceiptImage),
                    scr03_img_NoReceiptOuter_1.Y + scr03_img_NoReceiptOuter_1.Height + 30,
                    scr03_img_NoReceiptOuter_1.Y + scr03_img_NoReceiptOuter_1.Height + 30
                )
            )
        ZIndex: =13

        EditExpenseForm As form:
            AlignInContainer: =AlignInContainer.SetByContainer
            DataSource: ='Expense lines (mserp)'
            DefaultMode: |-
                =If(
                    varIsCreate,
                    FormMode.New,
                    If(
                        btnEditRefreshExpense.Visible && (featureEnabled = "False" || perdiemFeatureEnabled = "False"),
                        FormMode.View,
                        FormMode.Edit
                    )
                )
            Height: |-
                =If(
                    currExpenseType <> 'TrvExpType (mserp)'.Mileage,
                        500,
                        Value(Parent.Height - Self.Y - 10 - ExpenseInfo_1.Height)    
                )
            Item: =varSelectedExpenseDoc
            LayoutMaxHeight: =
            LayoutMaxWidth: =
            LayoutMinHeight: =250
            LayoutMinWidth: =320
            OnFailure: |-
                =If(
                    CountRows(Split(Text(Self.Error), ":")) > 2,
                    Notify(
                        Mid(Mid(EditExpenseForm.Error, Find(":", EditExpenseForm.Error) + 2), Find(":", Mid(EditExpenseForm.Error, Find(":", EditExpenseForm.Error) + 2)) + 2), 
                        NotificationType.Error, 
                        gblParams.notificationTime
                    ),
                    Notify(
                        Last(Split(Text(Self.Error), ":")).Value, 
                        NotificationType.Error, 
                        gblParams.notificationTime
                    )
                );
                UpdateContext({msCallStartedForSalestaxCalculation: false});
            OnSuccess: |-
                =// 1. 제출된 ID 확보 (Coalesce로 방어)
                UpdateContext({
                    varSubmittedExpTransNumber: EditExpenseForm.LastSubmit.'Expense transaction number (mserp_exptransnumber)'
                });
                
                // 2. 연결 대상 식별 (기존 로직 유지하되, 우선순위 명확화)
                UpdateContext({
                    varTargetExpTransNumber: Coalesce(
                        varSubmittedExpTransNumber, // 신규 생성 시 이게 우선
                        varSelectedExpenseDoc.'Expense transaction number (mserp_exptransnumber)' // 수정 모드 시 이게 우선
                    )
                });
                
                // [디버깅용] 만약 ID가 비어있으면 사용자에게 알림 (이게 뜨면 LastSubmit 문제임)
                If(IsBlank(varTargetExpTransNumber), 
                   Notify("경비 ID 생성 지연 발생. 다시 저장을 눌러주세요.", NotificationType.Warning)
                );
                
                // 3. 에러 로그 초기화 및 데이터 갱신
                Clear(colErrorLog);
                
                // [중요] 루프 시작 전에도 한번 Refresh
                Refresh('Expense Mobile Unattached Document Entity (mserp)');
                
                // 4. 분기 처리
                If(
                    !IsEmpty(colPendingReceipts) && !IsBlank(varTargetExpTransNumber),
                    // 영수증이 있으면 타이머 시작 (btn_PostSaveAction은 타이머 완료 후 호출)
                    UpdateContext({varStartReceiptProcessing: true}),
                    // 영수증이 없으면 즉시 후처리 실행
                    Select(btn_PostSaveAction)
                )
                
                /* 백업용
                // 1. 제출된 경비 번호 및 RecId 확보
                UpdateContext({varSubmittedExpTransNumber : EditExpenseForm.LastSubmit.'Expense transaction number (mserp_exptransnumber)'});
                UpdateContext({varSubmittedExpRecId : EditExpenseForm.LastSubmit.ExpenseRecId}); 
                
                // 2. 연결 대상 식별 (기존 경비 or 신규 생성 경비)
                UpdateContext({
                    varTargetExpTransNumber: Coalesce(
                        varSelectedExpenseDoc.'Expense transaction number (mserp_exptransnumber)', 
                        varSubmittedExpTransNumber
                    )
                });
                
                UpdateContext({varAttachReceiptError : ""});
                Clear(colErrorLog);
                
                // 3. 연결 대상 테이블 갱신
                Refresh('Expense Mobile Unattached Document Entity (mserp)');
                
                // 4. [1차 시도] 첨부 파일 연결 실행
                If(
                    !IsBlank(varTargetExpTransNumber),
                    ForAll(
                        colPendingReceipts As CurrentReceipt,
                        IfError(
                            Patch(
                                'Expense Mobile Unattached Document Entity (mserp)',
                                // 정확한 레코드 지정을 위한 LookUp
                                LookUp('Expense Mobile Unattached Document Entity (mserp)', EntRecId = CurrentReceipt.mserp_entrecid),
                                {
                                    ExpTransNumber: varTargetExpTransNumber
                                }
                            ),
                            // 실패 시 에러 로그 수집
                            Collect(
                                colErrorLog,
                                {
                                    FailedRecordId: CurrentReceipt.mserp_entrecid,
                                    ErrorMessage: FirstError.Details.HttpResponse
                                }
                            ); Blank()
                        )
                    )
                );
                
                // 5. [재시도 로직] 실패한 항목이 있다면 1회 재시도 (동시성 Lock 회피)
                If(
                    !IsEmpty(colErrorLog),
                    
                    // 잠시 대기 효과 및 데이터 동기화를 위한 Refresh
                    Refresh('Expense Mobile Unattached Document Entity (mserp)');
                    
                    // 실패한 영수증만 추출하여 재시도 컬렉션 생성
                    ClearCollect(
                        colRetryReceipts, 
                        Filter(colPendingReceipts, mserp_entrecid in colErrorLog.FailedRecordId)
                    );
                    Clear(colErrorLog); // 에러 로그 초기화 후 재시도
                    
                    // 재시도 실행
                    ForAll(
                        colRetryReceipts As RetryReceipt,
                        IfError(
                            Patch(
                                'Expense Mobile Unattached Document Entity (mserp)',
                                LookUp('Expense Mobile Unattached Document Entity (mserp)', EntRecId = RetryReceipt.mserp_entrecid),
                                {
                                    ExpTransNumber: varTargetExpTransNumber
                                }
                            ),
                            // 재시도도 실패하면 최종 에러로 기록
                            Collect(
                                colErrorLog,
                                {
                                    FailedRecordId: RetryReceipt.mserp_entrecid,
                                    ErrorMessage: FirstError.Details.HttpResponse
                                }
                            ); Blank()
                        )
                    )
                );
                
                // 6. 최종 결과 확인 및 사용자 알림
                If(
                    !IsEmpty(colErrorLog),
                    Notify(
                        "시스템 혼잡으로 일부 영수증 연결에 실패했습니다. 나중에 다시 추가해주세요.", 
                        NotificationType.Error, 
                        gblParams.notificationTime
                    )
                );
                
                // 7. 결과 뷰 갱신 및 로컬 컬렉션 업데이트
                If(
                    !IsBlank(varTargetExpTransNumber),
                    
                    // View 갱신
                    Refresh('View Attached Receipts to Expense Lines (mserp)');
                    
                    ClearCollect(
                        colAttachedReceipts,
                        SortByColumns(
                            Filter(
                                'View Attached Receipts to Expense Lines (mserp)',
                                // 가상 필드 대신 물리적 키(RecId) 사용
                                'Reference record ID' = Coalesce(Value(varSelectedExpenseDoc.ExpenseRecId), Value(varSubmittedExpRecId))
                            ),
                            "mserp_createddatetime1",
                            SortOrder.Descending
                        )
                    );
                    
                    // 검증: 보낸 개수보다 조회된 개수가 적고, 에러 로그도 없다면 (단순 반영 지연)
                    If(
                        varIsCreate && CountRows(colPendingReceipts) > CountRows(colAttachedReceipts) && IsEmpty(colErrorLog),
                        Notify("영수증이 처리 중입니다. 잠시 후 목록이 갱신됩니다.", NotificationType.Warning, 3000)
                    );
                
                    // 대표 영수증 ID 업데이트 (AttachedReceiptId)
                    If(
                        !IsEmpty(colAttachedReceipts),
                        Patch(
                            'Expense lines (mserp)',
                            Coalesce(varSelectedExpenseDoc, EditExpenseForm.LastSubmit),
                            {
                                AttachedReceiptId: First(colAttachedReceipts).mserp_entrecid
                            }
                        )
                    );
                    
                    // 성공 후 Pending 초기화
                    Clear(colPendingReceipts);
                    Clear(colRetryReceipts)
                );
                
                //create or update expense
                If(
                    varIsCreate,
                    Notify(
                        GlobalLabels.Labels.'15062:LocalizedName,msdyn_ExpenseCreateMessageLabel',
                        NotificationType.Success,
                        gblParams.notificationTime
                    ),
                    If(
                        isDirty || isExpenseReceiptAttached,
                        Notify(
                            GlobalLabels.Labels.'15062:LocalizedName,msdyn_ExpenseUpdateMessageLabel', 
                            NotificationType.Success,
                            gblParams.notificationTime)   
                    )
                );
                
                // no longer new expense creation
                Set(
                    varIsCreate,
                    false
                );
                
                Set(
                    varSelectedExpenseDoc,
                    EditExpenseForm.LastSubmit
                );
                // Refresh receipts collection after expense save
                If(
                    !IsBlank(varSelectedExpenseDoc) && !IsBlank(varSelectedExpenseDoc.'Expense transaction number (mserp_exptransnumber)'),
                    // [수정] View Attached Receipts to Expense Lines 사용 (이미 첨부된 영수증 조회)
                    Refresh('View Attached Receipts to Expense Lines (mserp)');
                    ClearCollect(
                        colAttachedReceipts,
                        SortByColumns(
                            Filter(
                                'View Attached Receipts to Expense Lines (mserp)',
                                // [수정 2] 가상 필드(ExpenseLineAttachedTo) 대신 Reference record ID 사용
                                'Reference record ID' = Value(varSelectedExpenseDoc.ExpenseRecId)
                            ),
                            "mserp_createddatetime1",
                            SortOrder.Descending
                        )
                    );
                    // Update AttachedReceiptId with first receipt (for backward compatibility)
                    If(
                        !IsEmpty(colAttachedReceipts),
                        If(
                            IsBlank(varSelectedExpenseDoc.AttachedReceiptId) || 
                            Value(varSelectedExpenseDoc.AttachedReceiptId) <> First(colAttachedReceipts).mserp_entrecid,
                            Patch(
                                'Expense lines (mserp)',
                                varSelectedExpenseDoc,
                                {
                                    AttachedReceiptId: First(colAttachedReceipts).mserp_entrecid
                                }
                            )
                        )
                    );
                    // Update varReceiptImage for backward compatibility
                    Set(
                        varReceiptImage,
                        If(
                            !IsEmpty(colAttachedReceipts),
                            First(colAttachedReceipts).mserp_captureddocument,
                            Blank()
                        )
                    );
                    Set(
                        varFileFormat,
                        If(
                            !IsEmpty(colAttachedReceipts),
                            First(colAttachedReceipts).mserp_fileextension,
                            Blank()
                        )
                    )
                );
                UpdateContext({varSubmittedExpTransNumber :Blank()});
                Set(
                    varIsCreate,
                    false
                );
                Set(
                    isExpenseReceiptAttached,
                    false
                );
                Set(
                    OCRresponse,
                    Blank()
                );
                Set(
                    gblNavigationDrawerVisibility,
                    false
                );
                If(gblItemizeExpenseButtonClick,
                
                Set(
                    IsCreditcardTransactionInLocalCurrency,
                    LookUp('Expense lines (mserp)', 'Expense transaction number (mserp_exptransnumber)' = varSelectedExpenseDoc.'Expense transaction number (mserp_exptransnumber)', IsCreditcardTransactionInLocalCurrency
                    )
                        );
                        ClearCollect(
                            dsItemizations,
                            AddColumns(
                                GroupBy(
                                    Filter(
                                        'Expense lines (mserp)',
                                        'Expense line type' = 'Expense line type (mserp)'.'Itemized line' && 'Expense transaction number (mserp_itemizedline_exptransnumber)' = varSelectedExpenseDoc.'Expense transaction number (mserp_exptransnumber)'
                                    ),
                                    'Itemization group',
                                    Itemization
                                ),
                                StartDate, Text(Last(SortByColumns(Itemization,"mserp_transdate",SortOrder.Descending)).'Transaction date',"yyyy-mm-dd hh:mm:ssZ"),
                                DailyRate,
                                If(
                                    IsCreditcardTransactionInLocalCurrency = 'NoYes (mserp)'.No,
                                    First(Itemization).'Transaction amount',
                                    First(Itemization).'Local amount'
                                ),
                                Quantity, CountRows(Itemization),
                                SubCategoryName, First(Itemization).'Expense subcategory name',
                                SubCategoryRecId, First(Itemization).'Expense subcategory',
                                ItemizationGroupId , mserp_expenseitemizationgroupid
                            )
                        );
                        
                );
                
                //locAllowNavigationBack is set to false in cases when the user clicks on the perdiems or the itemization button
                If(
                    locAllowNavigationBack,
                    If(
                        varIsCreate,
                        Navigate('Expenses - List Screen'),
                        If(
                            !IsBlank(varNavigatedFrom),
                            UpdateContext({varExpenseReportNumber : varSelectedReport.'Expense report number'});
                            Set(
                                varSelectedReport,
                                LookUp('Expense reports (mserp)','Expense report number' = varExpenseReportNumber)
                            );
                            ClearCollect(
                                colAttachedExpensesForReport,
                                Filter(
                                    'Expense lines (mserp)',
                                    'Expense report number (mserp_expnumber)' = varSelectedReport.'Expense report number' 
                                    && 'Expense line type' <> 'Expense line type (mserp)'.'Itemized line'
                                )
                            );
                            ClearCollect(
                                colAttachedExpenses,
                                colAttachedExpensesForReport
                            )
                        );
                
                        If(
                            gblItemizeExpenseButtonClick,
                            Navigate('Itemization - Detail Screen',Transition.None,{varNavigatedFrom : varNavigatedFrom, varItemizationScreen: "itemizationDetailScreen"}),
                        Switch(
                            varNavigatedFrom,
                            "scr17",
                            Navigate('Reports - Edit Screen'),
                            "scr20",
                            Navigate('Reports - View Only Screen'),
                            "scr18",
                            Navigate('Reports - Attach Expenses Screen'),
                            "scr19",
                            Navigate('Reports - View Attached Expenses Screen'),
                            Blank(),
                            Navigate('Expenses - List Screen')
                        );
                        UpdateContext({varNavigatedFrom : Blank()});
                        )
                    );
                    UpdateContext(
                        {
                            dirtyTransAmount:Blank(),
                            dirtyTransDate : Blank(),
                            dirtyMerchant : "",
                            varOnSelectTriggered: false,
                            varOnShowFields:false,
                            varOnChangeTriggered:false,
                            varSalesTaxAmount: Blank()
                        }
                    )
                );
                Set(gblItemizeExpenseButtonClick, false);
                UpdateContext({msCallStartedForSalestaxCalculation: false});
                Navigate('Expenses - List Screen', ScreenTransition.None);
                */
            SnapToColumns: =false
            Width: =Parent.Width
            Y: =scr03_img_NoReceiptOuter_1.Y + scr03_img_NoReceiptOuter_1.Height + 30
            ZIndex: =1

            ExpenseType_DataCard As typedDataCard.allowedValuesStringEditCard:
                AllowedValues: |-
                    =Distinct(
                        'DCSL Expense Category Mapping Setup Entity (mserp)',
                        'Expense Type'
                    )
                BorderColor: =gblParams.dropDownBorderColor
                BorderStyle: =BorderStyle.Solid
                DataField: ="mserp_deexexpensetype"
                Default: =varSelectedExpenseType
                DisplayMode: =Parent.DisplayMode
                DisplayName: ="Expense Type"
                Fill: =RGBA(0, 0, 0, 0)
                Height: =50
                Required: =false
                Update: =ComboBox_ExpenseType.Selected.Value
                Visible: =true
                Width: =Parent.Width
                X: =1
                Y: =expenseCategoryFieldOrder_Y - 120
                ZIndex: =1

                ExpenseType_DataCardKey As label:
                    AutoHeight: =true
                    BorderColor: =RGBA(0, 0, 0, 1)
                    Color: =gblParams.dropDownLabelColor
                    FocusedBorderThickness: =
                    Font: =Font.'Segoe UI'
                    Height: =48
                    Size: =21
                    Text: =Parent.DisplayName
                    Width: =Parent.Width - 60
                    Wrap: =false
                    X: =30
                    Y: =10
                    ZIndex: =1

                ComboBox_ExpenseType As combobox:
                    AccessibleLabel: =Concatenate("Select ", Parent.DisplayName)
                    BorderColor: =If(IsBlank(Parent.Error), Parent.BorderColor, Color.Red)
                    BorderThickness: =If(Parent.Error, gblParams.dorpDownBorderThickness, 0)
                    DefaultSelectedItems: |-
                        =With(
                            {
                                // 1. varAppMode에 따라 선택해야 할 텍스트를 먼저 결정
                                TargetText: Switch(
                                    varAppMode,
                                    "ExpenseReport", "Expense Reimbursement",
                                    "AirfareAllowance", "Allowance",
                                    "BillingTripSettlement", "Billing Trip Settlement",
                                    "EmployeeBenefit", "Employee Benefit",
                                    Blank()
                                )
                            },
                            // 2. Distinct 결과와 형식을 맞추기 위해 { Value: ... } 형태의 테이블 생성
                            If(
                                !IsBlank(TargetText),
                                Table( { Value: TargetText } ), 
                                Blank()
                            )
                        )
