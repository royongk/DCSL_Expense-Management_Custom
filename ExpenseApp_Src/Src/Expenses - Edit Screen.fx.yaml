        scr03_btn_Done_1 As button:
            DisplayMode: |-
                =If(
                    (msCallStartedForSalestaxCalculation  || timerProj || timerCostType || timerHBIT || timerCountry || timerState) ||
                    (btnEditRefreshExpense.Visible && (featureEnabled = "False" || perdiemFeatureEnabled = "False")),
                    DisplayMode.Disabled,
                    DisplayMode.Edit
                )
            Fill: =RGBA(34, 102, 227, 1)
            Font: =Font.'Segoe UI'
            Height: =87
            LayoutMaxHeight: =
            LayoutMaxWidth: =
            LayoutMinHeight: =70
            LayoutMinWidth: =280
            OnSelect: |-
                =If(
                    currExpenseType = 'TrvExpType (mserp)'.'Per diem' && userRecord.IsReImaginedPerDiemEnabled  <> 'NoYes (mserp)'.Yes,
                    Notify(
                            GlobalLabels.Labels.'15062:LocalizedName,msdyn_PerdiemFeatureDisabledWarningOnCreate',
                            NotificationType.Error,
                            gblParams.notificationTime
                        ),
                    UpdateContext({msCallStartedForSalestaxCalculation: true});
                    If( 
                        locItemizationCheck && varSelectedExpenseDoc.'Expense category (mserp_costtype)' <> ComboBox1_8.Selected.'Expense category' && !varIsCreate,
                        UpdateContext({locCategoryChange : true}),
                        UpdateContext({locAllowNavigationBack:true});    
                        SubmitForm(EditExpenseForm)
                    )
                    
                )
            Size: =24
            Text: |-
                =GlobalLabels.Labels.'15062:LocalizedName,msdyn_DoneButtonLabel'
            Width: =App.Width * 0.875
            X: =(App.Width - scr03_btn_Done_1.Width)/2
            Y: =Parent.Height - Self.Height - 25
