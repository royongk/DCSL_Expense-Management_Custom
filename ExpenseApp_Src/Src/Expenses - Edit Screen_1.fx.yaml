                                    DateTo: Text('Per diem to date_DataCard1_1'.Update, "yyyy-mm-dd HH:mm:ss"),
                                    CostType: "Perdiem",
                                    Location: cmbPerdiemLocation_1.Selected.EntRecId,
                                    DedBreakfast: DataCardValue1_8.Text,
                                    DedLunch: DataCardValue2_8.Text,
                                    DedDinner: DataCardValue3_9.Text
                                }).return
                            }
                        );
                        UpdateContext({locPerdiemActionResponse : Concatenate("[", locPerdiemActionResponse, "]")});
                        ForAll(
                            Table(
                                ParseJSON(
                                    locPerdiemActionResponse
                                )
                            ),
                            Collect(
                                dsPerdiemActionResponse,
                                {
                                    amountCurr: Text(ThisRecord.Value.AmountCurr),       
                                    amountMST : Text(ThisRecord.Value.AmountMST),
                                    exchangeCode : Text(ThisRecord.Value.ExchangeCode),
                                    warnings : Text(ThisRecord.Value.Warnings)
                                }
                            )
                        );
                        If(
                            !IsBlank(First(dsPerdiemActionResponse).warnings),
                            // there are errors in odata action show them
                            Notify(
                                Text(First(dsPerdiemActionResponse).warnings),
                                NotificationType.Warning,
                                gblParams.notificationTime
                            ),
                            // no errors, proceed to calculate tax based on the latest fetched transaction amount from odata action
                            UpdateContext({locPerdiemAmountCurr : First(dsPerdiemActionResponse).amountCurr});
                            If(
                                !IsBlank(ComboBox1_86.Selected) && !IsBlank(ComboBox1_87.Selected),
                                //if sales tax group and item sales tax group are not blank issue a call to get the sales tax amount 
                                UpdateContext({taxModifiedByUser:false});
                                UpdateContext
                                (
                                    {
                                        varSalesTaxAmount : 
                                        IfError(
                                            Value(
                                                'Expense mobile master data (mserp)'.mserp_getactualsalestaxamount(
                                                LookUp('Expense mobile master data (mserp)',Email = User().Email,'Expense mobile master data (mserp)'),
                                                {
                                                    TaxGroup : If(IsBlank(ComboBox1_86.Selected.'Sales tax group'), "", ComboBox1_86.Selected.'Sales tax group'),
                                                    TaxItemGroup : If(IsBlank(ComboBox1_87.Selected.'Item sales tax group'), "", ComboBox1_87.Selected.'Item sales tax group'),
                                                    ExchangeCode : If(IsBlank(ComboBox1_20.Selected.mserp_currencycode), "", ComboBox1_20.Selected.mserp_currencycode),
                                                    TransDate : If(IsBlank(Text(DateValue1_25.SelectedDate, "yyyy-mm-dd HH:mm:ssZ")), "", Text(DateValue1_25.SelectedDate, "yyyy-mm-dd HH:mm:ssZ")),
                                                    AmountCurr : If(IsBlank(First(dsPerdiemActionResponse).amountCurr), "0", First(dsPerdiemActionResponse).amountCurr),
                                                    LegalEntity : If(IsBlank(DataCardValue39_8.Selected.Value),"",Text(DataCardValue39_8.Selected.Value)),
                                                    TaxIncluded : If('Tax included_DataCard1_8'.Visible,If(Toggle1_8.Value, "Yes", "No"),If(LookUp('Expense management parameters (mserp)','Company Code'=varDefaultLegalEntity,'Tax included')='NoYes (mserp)'.Yes,"Yes", "No"))
                                                }).return,"en-US"
                                            ),
                                            UpdateContext(
                                                {
                                                    varErrorActualTaxCal : 
                                                    Substitute(
                                                        Match(
                                                            FirstError.Details.HttpResponse,
                                                            """message"":""([^""]*)"""
                                                        ).FullMatch,
                                                        """message"":""",
                                                        ""
                                                    )      
                                                }
                                            )
                                        )
                                    }
                                );
                                // show errors if any
                                If(
                                    !IsBlank(varErrorActualTaxCal),
                                    Notify(
                                        Left(varErrorActualTaxCal,Len(varErrorActualTaxCal)-1),
                                        NotificationType.Error,
                                        gblParams.notificationTime
                                    )
                                )
                            );
                        );
                        UpdateContext({msCallStartedForSalestaxCalculation : false}),
                
                        // if it is of meal type per day or number of meals per day then collect details and navigate to meal reduction screen
                        
                        If(
                            varIsCreate || isDirty,
                            // if it is a newly created expense or if an existing expense had its perdiem dates changed
                            // then submit the form and pick the updated expense and perdiem details
                            UpdateContext({locAllowNavigationBack : false});
                            SubmitForm(EditExpenseForm_1);
                            If(
                                // there are no errors, then proceed with picking the updated/created expense
                                // no need to notify as the OnFailure and OnSuccess of the form should take care of it
                                IsBlank(Last(Split(Text(EditExpenseForm_1.Error), ":")).Value) || 
                                Last(Split(Text(EditExpenseForm_1.Error), ":")).Value = "",
                                // update the expense record
                                Set(
                                    varSelectedExpenseDoc,
                                    EditExpenseForm_1.LastSubmit
                                );
                                
                                // update perdiem details and navigate
                                ClearCollect(
                                    dsPerdiemDetails,
                                    AddColumns(
                                        Filter([@'PerDiem Data Lines for Expense Lines (mserp)'],'Expense transaction number' = varSelectedExpenseDoc.'Expense transaction number (mserp_exptransnumber)'),
                                        isGalleryVisible,
                                        false,
                                        isDirty,
                                        false
                                    )
                                );
                                Navigate('Expense - Perdiem Details Screen', ScreenTransition.None, {locNavigatedFrom : "Expense"})
                            ),
                            ClearCollect(
                                dsPerdiemDetails,
                                AddColumns(
                                    Filter([@'PerDiem Data Lines for Expense Lines (mserp)'],'Expense transaction number' = varSelectedExpenseDoc.'Expense transaction number (mserp_exptransnumber)'),
                                    isGalleryVisible,
                                    false,
                                    isDirty,
                                    false
                                )
                            );
                            Navigate('Expense - Perdiem Details Screen', ScreenTransition.None, {locNavigatedFrom : "Expense"})
                
                        )
                    ),
                    Notify(
                        GlobalLabels.Labels.'15062:LocalizedName,msdyn_PerdiemFeatureDisabledWarningOnCreate',
                        NotificationType.Error,
                        gblParams.notificationTime
                    )
                )
            Size: =24
            Text: |-
                =If(
                    LookUp('Expense management parameters (mserp)','Company Code'= varSelectedLegalEntity,'Calculate meal reduction by') = 'Meal reductions (mserp)'.'Meal type per trip',
                    GlobalLabels.Labels.'15062:LocalizedName,CalculateAmountsLabel',
                    GlobalLabels.Labels.'15062:LocalizedName,EditMealExclusionsLabel'
                )
            Visible: =currExpenseType = 'TrvExpType (mserp)'.'Per diem' && LookUp('Expense management parameters (mserp)','Company Code'= varSelectedLegalEntity,'Calculate meal reduction by') <> 'Meal reductions (mserp)'.'Meal type per trip'
            Width: =App.Width * 0.875
            X: =(App.Width - btnEditRefreshExpense_2.Width) / 2
            Y: =Parent.Height - Self.Height - 25
            ZIndex: =5

        scr03_btn_Done_9 As button:
            DisplayMode: |-
                =If(
                    (msCallStartedForSalestaxCalculation  || timerProj || timerCostType || timerHBIT || timerCountry || timerState) ||
                    (btnEditRefreshExpense_2.Visible && (featureEnabled = "False" || perdiemFeatureEnabled = "False")),
                    DisplayMode.Disabled,
                    DisplayMode.Edit
                )
            Fill: =RGBA(34, 102, 227, 1)
            Font: =Font.'Segoe UI'
            Height: =87
            LayoutMaxHeight: =
            LayoutMaxWidth: =
            LayoutMinHeight: =70
            LayoutMinWidth: =280
            OnSelect: |+
                =If(
                    currExpenseType = 'TrvExpType (mserp)'.'Per diem' && userRecord.IsReImaginedPerDiemEnabled  <> 'NoYes (mserp)'.Yes,
                    Notify(
                            GlobalLabels.Labels.'15062:LocalizedName,msdyn_PerdiemFeatureDisabledWarningOnCreate',
                            NotificationType.Error,
                            gblParams.notificationTime
                        ),
                    UpdateContext({msCallStartedForSalestaxCalculation: true});
                    If( 
                        locItemizationCheck && varSelectedExpenseDoc.'Expense category (mserp_costtype)' <> ComboBox1_13.Selected.'Expense category' && !varIsCreate,
                        UpdateContext({locCategoryChange : true}),
                        UpdateContext({locAllowNavigationBack:true});    
                        IfError(
                            SubmitForm(EditExpenseForm_1),
                            UpdateContext({varError : FirstError.Message});
                            UpdateContext({varError2 : FirstError.Kind});
                        )
                    )
                    
                )
                
                
            Size: =24
            Text: |-
                =GlobalLabels.Labels.'15062:LocalizedName,msdyn_DoneButtonLabel'
            Width: =App.Width * 0.875
            X: =(App.Width - scr03_btn_Done_9.Width)/2
            Y: =Parent.Height - Self.Height - 25
            ZIndex: =6

