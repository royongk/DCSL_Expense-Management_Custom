    "scr01_glr_ListExpense As gallery.'BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0'":
        '#CopilotOverlayLabel': ="Filtered"
        AccessibleLabel: ="List of draft expenses"
        Default: ={}
        DelayItemLoading: =true
        Height: |-
            =If(
                varCntSelect,
                Min(Parent.Height - scr01_hdr_TopHeader.Height - scr01_shp_BaseRectangle.Height-scr01_shp_Rectangle.Height, Self.TemplateHeight * CountRows(Self.AllItems)),
                Min(Parent.Height - scr01_hdr_TopHeader.Height - scr01_cmp_Footer.Height,Self.TemplateHeight * CountRows(Self.AllItems)) 
                
            )
        Items: |+
            =Filter(
                SortByColumns('Expense lines (mserp)', "mserp_transdate", SortOrder.Descending),
                'Company (mserp_company)' = varSelectedLegalEntity && 
                'Approval status' = 'Document status (mserp)'.Draft && 
                IsBlank('Expense report number (mserp_expnumber)') && 
                ('Expense line type' = 'Expense line type (mserp)'.Default 
                || 'Expense line type' = 'Expense line type (mserp)'.'Itemized header')
            )
            
        Layout: =Layout.Vertical
        LoadingSpinner: =LoadingSpinner.Data
        OnSelect: |-
            =
            //set details for the next screen 
            Concurrent(
                Set(
                    varIsCreate,
                    false
                ),
                Set(
                    varReceiptImage,
                    Blank()
                ),
                Set(
                    varChangeReceiptItemizedExpense,
                    false
                )
            );
            // assign the expense to a varSelectedExpenseDoc
            Set(
                varSelectedExpenseDoc,
                LookUp('Expense lines (mserp)','Expense transaction number (mserp_exptransnumber)' = ThisItem.'Expense transaction number (mserp_exptransnumber)')
            );
            // populating base64 to show image on selection of expense
            Set(
                varReceiptImage,
                LookUp('Expense Mobile Attached Document Entity (mserp)', EntRecId = Value(varSelectedExpenseDoc.AttachedReceiptId),CapturedDocument) 
            );
            Set(
                varFileFormat,
                LookUp('Expense Mobile Attached Document Entity (mserp)', EntRecId = Value(varSelectedExpenseDoc.AttachedReceiptId), FileExtension)
            );
            Set(
                varExpenseAgainstWorkItem,
                Blank()
            );
            // collect policy violations
            If(
                varSelectedExpenseDoc.PolicyViolationCount,
                ClearCollect(
                    colPolViolations,
                    Split(varSelectedExpenseDoc.PolicyViolationErrorMessage, "~|~")
                );
                UpdateContext({varMaxViolationLevel : varSelectedExpenseDoc.PolicyViolationsLevel});
                UpdateContext({varNumViolation : varSelectedExpenseDoc.PolicyViolationCount}),
                Clear(colPolViolations);
                UpdateContext({varMaxViolationLevel : 0});
                UpdateContext({varNumViolation : 0})
            );
            
            Navigate('Expenses - Edit Screen', ScreenTransition.None, {varNavigatedFrom : Blank(),varMaxViolationLevel : varMaxViolationLevel, varNumViolation: varNumViolation, varRemainingAmount: 0, locCategoryChange: false, locItemizeButtonVisibilityFlag: false});
            
            // Adding a warning if FnO default user language is not equal to the user's device language
            If(
                Lower(varDefaultLanguage) <> Lower(Language()) && gblWarningOnEdit,
                Notify(
                  Substitute(Substitute(GlobalLabels.Labels.'15062:LocalizedName,msdyn_FnOAndMobileLanguageDifferentLabel',"$", varDefaultLanguage), "#", Language()),
                NotificationType.Warning,
                15000
                )
            );
            Set(
                gblWarningOnEdit,
                false
            );
        TemplatePadding: =0
        TemplateSize: =150
        Visible: =Self.AllItemsCount > 0
        Width: =Parent.Width
        Y: =If(varCntSelect,scr01_hdr_TopHeader.Height+scr01_shp_Rectangle.Height,scr01_hdr_TopHeader.Height)
