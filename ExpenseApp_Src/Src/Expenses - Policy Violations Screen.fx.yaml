"'Expenses - Policy Violations Screen' As screen":
    Fill: =RGBA(244,244,244,1)
    OnVisible: |-
        =ClearCollect(
            colPolViolations,
            Split(varSelectedExpenseDoc.PolicyViolationErrorMessage, "~|~")
        );

    GlobalLabels As Localization:
        DisplayMode: =DisplayMode.Edit
        Height: =350
        Width: =350
        X: =60
        Y: =60
        ZIndex: =1

    scr15_btn_Done_1 As button:
        BorderColor: =RGBA(30, 144, 255, 1)
        Fill: =RGBA(34, 102, 227, 1)
        Height: =88
        OnSelect: =Back()
        PaddingBottom: =0
        PaddingLeft: =0
        PaddingRight: =0
        PaddingTop: =0
        RadiusBottomLeft: =8
        RadiusBottomRight: =8
        RadiusTopLeft: =8
        RadiusTopRight: =8
        Size: =18
        Text: |-
            =GlobalLabels.Labels.'15062:LocalizedName,msdyn_DoneButtonLabel'
        Width: |
            =Parent.Width -  Self.X*2
        X: =40
        Y: =Parent.Height - Self.Height - 25
        ZIndex: =1

    "scr15_PolicyViolation As gallery.'BrowseLayout_Flexible_SocialFeed_ver5.0'":
        '#CopilotOverlayLabel': ="Filtered"
        DelayItemLoading: =true
        DisplayMode: =DisplayMode.View
        Height: =scr15_btn_Done_1.Y - Self.Y - 25
        Items: =colPolViolations
        Layout: =Layout.Vertical
        LoadingSpinner: =LoadingSpinner.Data
        TemplateFill: =Color.White
        TemplatePadding: =4
        TemplateSize: =Min(870, Self.Height - 60)
        Width: =Parent.Width
        Y: =scr15_lbl_Instruction_1.Y + scr15_lbl_Instruction_1.Height
        ZIndex: =2

        scr15_PolicyMessage As label:
            AutoHeight: =true
            DisplayMode: =DisplayMode.View
            Height: =70
            OnSelect: =Select(Parent)
            Size: =21
            Text: =ThisItem.Value
            Width: =App.Width - 60
            X: =27
            Y: =12
            ZIndex: =5

    scr15_lbl_Instruction_1 As label:
        Color: =RGBA(110, 110, 110, 1)
        Font: =Font.'Segoe UI'
        Height: =64
        Size: =18
        TabIndex: =0
        Text: |
            =GlobalLabels.Labels.'15062:LocalizedName,msdyn_PolicyViolationRibbonLabel'
        Width: =Parent.Width -  Self.X*2
        X: =22
        Y: =scr15_hdr_PolicyViolation_1.Y + scr15_hdr_PolicyViolation_1.Height + 21.5
        ZIndex: =3

    scr15_hdr_PolicyViolation_1 As hdr02_Header:
        Fill: =scr15_hdr_PolicyViolation_1.paramFill
        paramFill: =RGBA(255, 255, 255, 1)
        paramTitle: |-
            =GlobalLabels.Labels.'15062:LocalizedName,msdyn_PolicyViolationLabel'
        ZIndex: =4

    scr15_ico_Back_1 As icon.ChevronLeft:
        AccessibleLabel: ="Press to go back"
        Color: =icongconfig_backbutton.Color
        Fill: =icongconfig_backbutton.Fill
        Height: =icongconfig_backbutton.Height
        Icon: =Icon.ChevronLeft
        OnSelect: =Back();
        TabIndex: =0
        Width: =icongconfig_backbutton.Width
        X: =18
        Y: =(scr03_hdr_TopHeader_1.Height-Self.Height)/2
        ZIndex: =5

