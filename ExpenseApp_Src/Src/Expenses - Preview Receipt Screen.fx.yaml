"'Expenses - Preview Receipt Screen' As screen":
    Fill: =RGBA(229, 229, 229, 1)
    OnVisible: |-
        =UpdateContext(
            {
                defaultOCRDate: "1900-01-01T12:00:00",
                varReceiptSizeOk: true
            }
        )

    imageView_footer_rectangle As rectangle:
        Fill: =RGBA(37, 36, 35, 1)
        Height: =168
        Width: =Max(App.Width, App.MinScreenWidth)
        Y: =Parent.Height - Self.Height
        ZIndex: =1

    scr05_btn_Done As button:
        Fill: =RGBA(34, 102, 227, 1)
        Height: =88
        OnSelect: |-
            =// [scr05_btn_Done OnSelect 수정 코드]
            
            // 1. 이미지 업로드 로직 (기존 코드 유지)
            If(
                !IsreceiptALreadyCreated,
                If(
                    IsBlank(varSelectedReceiptNumber),
                    UpdateContext({varText : JSON(scr05_img_Receipt.Image,JSONFormat.IncludeBinaryData)});
                    If(
                        !IsBlank(varText) || !IsMatch(varText, ""),
                        UpdateContext({varB64 : Mid(varText, Find(",", varText) + 1, Len(varText) - Find(",", varText) - 1)});
                        UpdateContext({varType : Mid(varText, Find(":", varText) + 1, (Find(";", varText) - 1) - (Find(":", varText) + 1) + 1)});
                        UpdateContext({varExtension : Mid(varType, Find("/", varType) + 1)});
                    );
                    IfError(
                        Set(
                            gblCreatedReceiptResponse,
                            'Expense mobile master data (mserp)'.mserp_trvexpmobilemasterdataentity_uploadlargeimage(
                                LookUp('Expense mobile master data (mserp)',Email = User().Email).'Expense mobile master data (mserp)', 
                                {
                                    imageBase64: varB64,
                                    ContentType: varType,
                                    FileExtension: varExtension,
                                    FileName: If(IsMatch( varReceiptFileName, "\.",MatchOptions.Contains),varReceiptFileName, Concatenate(varReceiptFileName,".",varExtension))
                                }
                            )
                        ),
                        UpdateContext({varCreateReceiptError : FirstError}) 
                    );
                    If(
                        IsBlank(varCreateReceiptError),
                        Notify(
                            GlobalLabels.Labels.'15062:LocalizedName,msdyn_ReceiptCreatedSuccessfullyLabel',
                            NotificationType.Success, 
                            gblParams.notificationTime
                        );
                        Set(
                            varReceiptImage,
                            Substitute(varText,"""",""));
                        Set(
                            varSelectedReceiptNumber,
                            Value(ParseJSON(gblCreatedReceiptResponse.return).DocuRefRecId)
                        ),
                        Notify(
                            Substitute(
                                Match(varCreateReceiptError.Details.HttpResponse, """message"":""([^""]*)""").FullMatch, 
                                """message"":", 
                                Blank()
                            ),
                            NotificationType.Error, 
                            gblParams.notificationTime
                        )
                    )
                ),
                Set(
                    varReceiptImage,
                    Substitute(JSON(scr05_img_Receipt.Image,JSONFormat.IncludeBinaryData),"""","")
                )
            );
            
            // 2. [핵심 수정 구간] 컬렉션 처리 로직
            If(
                !IsBlank(varSelectedReceiptNumber),
                Refresh('Expense Mobile Unattached Document Entity (mserp)');
                With(
                    {
                        selectedReceipt: LookUp(
                            'Expense Mobile Unattached Document Entity (mserp)',
                            EntRecId = varSelectedReceiptNumber
                        )
                    },
                    If(
                        !IsBlank(selectedReceipt),
                        // [조건 강화] 신규 생성 모드이거나, 경비 번호가 없는 경우 -> 무조건 Pending에 추가
                        If(
                            varIsCreate || IsBlank(varSelectedExpenseDoc.'Expense transaction number (mserp_exptransnumber)'),
                            
                            // CASE 1: 신규 생성 (Pending 컬렉션에 추가)
                            If(
                                IsBlank(LookUp(colPendingReceipts, mserp_entrecid = selectedReceipt.EntRecId)),
                                Collect(
                                    colPendingReceipts,
                                    {
                                        mserp_entrecid: selectedReceipt.EntRecId,
                                        mserp_captureddocument: selectedReceipt.CapturedDocument,
                                        mserp_fileextension: selectedReceipt.FileExtension,
                                        mserp_filename: Coalesce(
                                            selectedReceipt.Description,
                                            Concatenate("Receipt-", Text(selectedReceipt.EntRecId))
                                        )
                                    }
                                )
                            ),
            
                            // CASE 2: 기존 경비 수정 (즉시 DB 연결 및 Attached 컬렉션 갱신)
                            // 4. 첨부 파일 연결 처리 (일괄 패치 방식으로 우회)
                            If(
                                !IsEmpty(colPendingReceipts) && !IsBlank(varTargetExpTransNumber),
                                
                                // 1단계: Dataverse에서 원본 레코드들을 순차적으로 조회하여 로컬 컬렉션에 담기
                                ClearCollect(
                                    colRecordsToUpdate,
                                    ForAll(
                                        colPendingReceipts As CurrentReceiptItem,
                                        
                                        // [수정된 부분] With 함수를 사용하여 Value() 형변환을 LookUp 외부에서 먼저 수행합니다.
                                        With(
                                            {
                                                // 현재 루프의 아이디를 순수 숫자형(Scalar) 변수로 미리 치환
                                                numReceiptId: Value(CurrentReceiptItem.mserp_entrecid)
                                            },
                                            
                                            // LookUp 조건에는 어떠한 함수도 없이 [필드 = 순수 변수] 형태만 남깁니다.
                                            LookUp(
                                                'Expense Mobile Unattached Document Entity (mserp)',
                                                EntRecId = numReceiptId
                                            )
                                        )
                                    )
                                );
                                
                                // 조회가 실패한(Blank) 데이터가 있다면 안전을 위해 제거
                                RemoveIf(colRecordsToUpdate, IsBlank(EntRecId));
            
                                // 2단계: 로컬 컬렉션 데이터의 경비 번호를 메모리 상에서 일괄 변경
                                UpdateIf(
                                    colRecordsToUpdate,
                                    true, // 컬렉션 내의 모든 레코드에 적용
                                    {
                                        ExpTransNumber: varTargetExpTransNumber
                                    }
                                );
                                
                                // 3단계: 단 한 번의 Patch 호출로 Dataverse에 일괄(Batch) 저장
                                IfError(
                                    Patch(
                                        'Expense Mobile Unattached Document Entity (mserp)',
                                        colRecordsToUpdate
                                    ),
                                    // 일괄 업데이트 실패 시 에러 로깅
                                    Collect(
                                        colErrorLog,
                                        {
                                            FailedRecordId: "BulkPatchError",
                                            ErrorMessage: FirstError.Message
                                        }
                                    )
                                )
                            )
                        )
                    )
                )
            );
            
            // 3. OCR 및 화면 이동 로직 (기존 유지)
            If(
                varIsCreate && varOCREnabled && !IsBlank(varSelectedReceiptNumber),
                UpdateContext({
                    flowResponse :
                    'Expense Mobile Unattached Document Entity (mserp)'.mserp_trvexpmobileunattacheddocumententity_populatereceiptdetails(LookUp('Expense Mobile Unattached Document Entity (mserp)',EntRecId = varSelectedReceiptNumber).'Expense Mobile Unattached Document Entity (mserp)').return
                });
                Clear(OCRresponse_Receipt);
                ForAll(
                    Table(
                        ParseJSON(
                            Concatenate("[", flowResponse, "]")
                        )
                    ),
                    Collect(
                        OCRresponse_Receipt,
                        {
                            merchantId: Text(ThisRecord.Value.Merchant),
                            amountCurr: Text(ThisRecord.Value.TotalAmount),
                            transDate : If(
                                            Text(DateValue(ThisRecord.Value.TransDate, "en-US")) <> Text(DateValue(defaultOCRDate, "en-US")),
                                            Text(DateValue(ThisRecord.Value.TransDate, "en-US")),
                                            Text(Today())
                                        )
                        }
                    )
                );
                Set(
                    OCRresponse, 
                    First(OCRresponse_Receipt)
                )
            ); 
            UpdateContext({varCreateReceiptError : Blank()});
            If(
                !IsBlank(varReceiptImage),
                If(
                    varNavigateFromExpense = "NavigatedFromItemizedEditExpense",
                    Navigate('Itemization - Itemized Expense Edit Screen',ScreenTransition.None),
                    Navigate('Expenses - Edit Screen',ScreenTransition.None, {varRemainingAmount: 0, locItemizeButtonVisibilityFlag: false})
                ),
                Notify(
                    GlobalLabels.Labels.'15062:LocalizedName,msdyn_InvalidReceiptLabel',
                    NotificationType.Error,
                    gblParams.notificationTime
                )
            );
            Clear(colFileSplit);
            Clear(colDeviceAttachedFile);
        Size: =24
        Text: |-
            =GlobalLabels.Labels.'15062:LocalizedName,msdyn_DoneButtonLabel'
        Width: =Parent.Width -  Self.X*2
        X: =40
        Y: =imageView_footer_rectangle.Y + 30
        ZIndex: =2

    scr05_lbl_NoPreview As label:
        Align: =Align.Center
        Font: =Font.'Segoe UI'
        Height: =64
        Size: =18
        Text: |
            =//GlobalLabels.Labels.PreviewNotAvailable
            GlobalLabels.Labels.'15062:LocalizedName,msdyn_FilePreviewNotSupportedLabel'
        Visible: =!(scr05_pdfViewer.Visible || scr05_img_Receipt.Visible)
        Width: =406     
        X: =(Parent.Width - Self.Width)/2
        Y: =scr05_img_NoPreview.Y + scr05_img_NoPreview.Height + 10 
        ZIndex: =3

    scr05_img_NoPreview As image:
        Height: =85
        Image: |-
            =If(
                varFileFormat in ["xlsx", "xls"],
                IconExcel,
                varFileFormat in ["docx", "doc"],
                IconWord,
                varFileFormat = "txt",
                IconTxt,
                IconMail
            )
        Visible: =scr05_lbl_NoPreview.Visible
        Width: =85
        X: =(Parent.Width - Self.Width)/2
        Y: =scr05_img_Receipt.Y + (scr05_img_Receipt.Height - Self.Height)/2
        ZIndex: =4

    scr05_img_Receipt As image:
        ApplyEXIFOrientation: =false
        Height: =imageView_footer_rectangle.Y - Self.Y
        Image: =varReceiptImage
        Visible: =varFileFormat in ["jpeg","png","jpg","bmp","tiff"] && !IsBlank(varReceiptImage)
        Width: |
            =Parent.Width
        Y: =scr05_hdr_TopHeader.Height
        ZIndex: =5

    scr05_pdfViewer As pdfViewer:
        BorderColor: =RGBA(0, 0, 0, 1)
        Document: =varReceiptImage
        Fill: =RGBA(0, 0, 0, 0.5)
        Height: =scr05_img_Receipt.Height
        Visible: =varFileFormat = "pdf" && !IsBlank(varReceiptImage)
        Width: =scr05_img_Receipt.Width
        X: =scr05_img_Receipt.X
        Y: =scr05_img_Receipt.Y
        ZIndex: =6

    scr05_hdr_TopHeader As hdr02_Header:
        Fill: =scr05_hdr_TopHeader.paramFill
        paramColor: =RGBA(255, 255, 255, 1)
        paramFill: |
            =RGBA(33, 33, 33, 1)
        paramTitle: |-
            =GlobalLabels.Labels.'15062:LocalizedName,msdyn_AddReceiptLabel'
        ZIndex: =7

    scr05_lbl_Retake As label:
        Align: =Align.Center
        Color: =RGBA(255, 255, 255, 1)
        Font: =Font.'Segoe UI'
        FontWeight: =FontWeight.Semibold
        Height: =33
        OnSelect: |-
            =Set(
                varReceiptImage, 
                Blank()
            );
            Set(
                varFileFormat, 
                Blank()
            );
            Clear(colFileSplit);
            Clear(colDeviceAttachedFile);
            Back()
        Size: =17
        TabIndex: =0
        Text: |-
            =GlobalLabels.Labels.'15062:LocalizedName,msdyn_RetakeLabel'
        Width: =110
        X: =(Parent.Width - Self.Width - 15)
        Y: =24
        ZIndex: =8

    scr05_ico_Back As icon.ChevronLeft:
        AccessibleLabel: ="Press to go back"
        Color: =Color.White
        Fill: =icongconfig_backbutton.Fill
        Height: =icongconfig_backbutton.Height
        Icon: =Icon.ChevronLeft
        OnSelect: |-
            =Set(
                varReceiptImage, 
                Blank()
            );
            Set(
                varFileFormat, 
                Blank()
            );
            Clear(colFileSplit);
            Clear(colDeviceAttachedFile);
            Back()
        TabIndex: =0
        Width: =icongconfig_backbutton.Width
        X: =22.5
        Y: =(scr02_hdr_TopHeader.Height-Self.Height)/2
        ZIndex: =9

