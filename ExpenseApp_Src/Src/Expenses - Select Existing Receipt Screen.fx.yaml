"'Expenses - Select Existing Receipt Screen' As screen":
    Fill: =RGBA(255, 255, 255, 1)
    OnVisible: =

    "'attachmentControl - Expense_1' As attachments":
        AccessibleLabel: ="Select receipt from device"
        AddAttachmentColor: =Color.Red
        AddAttachmentText: |-
            =GlobalLabels.Labels.'15062:LocalizedName,msdyn_SelectDromDeviceLabel'
        AddedItemColor: =
        AddedItemFill: =
        BorderColor: =
        BorderStyle: =
        BorderThickness: =0
        Color: =RGBA(255, 255, 255, 1)
        DropTargetBorderThickness: =0
        Fill: =RGBA(37, 36, 35, 1)
        FocusedBorderThickness: =0
        Height: =160
        HoverBorderColor: =
        HoverColor: =
        HoverFill: =
        IsInDataCard: =true
        ItemFill: =
        ItemHoverFill: =
        Items: =colDeviceAttachedFile
        MaxAttachments: =1
        MaxAttachmentSize: =15
        MaxAttachmentsText: =
        NoAttachmentsText: =
        OnAddFile: |
            =Set(
                varReceiptFileName,
                First(Self.Attachments).Name
            );
            Set(
                varReceiptImage,
                First(Self.Attachments).Value
            );
            ClearCollect(
                colDeviceAttachedFile,
                Self.Attachments
            );
            ClearCollect(
                colFileSplit,
                ForAll(
                    Lower(
                        ForAll(
                            Split(
                                varReceiptFileName,
                                "."
                            ),
                            {Result: ThisRecord.Value}
                        )
                    ),
                    {Result: ThisRecord.Value}
                )
            );
            Set(
                varFileFormat,
                Last(colFileSplit).Result
            );
            Navigate('Expenses - Preview Receipt Screen')
        OnRemoveFile: |-
            =ClearCollect(colDeviceAttachedFile, Self.Attachments);
            Clear(colFileSplit);
            Set(
                varFileFormat,
                Blank()
            );
            Set(
                varReceiptImage,
                Blank()
            )
        PaddingBottom: =5
        PaddingLeft: =25
        PaddingRight: =5
        PressedFill: =
        Size: =20
        Tooltip: =
        Width: =Parent.Width
        Y: =Parent.Height - Self.Height
        ZIndex: =1

    "'Select Existing receipt' As groupContainer.verticalAutoLayoutContainer":
        Fill: =RGBA(37, 36, 35, 1)
        Height: =425
        LayoutDirection: =LayoutDirection.Vertical
        LayoutGridColumns: =6
        LayoutGridRows: =6
        LayoutMode: =LayoutMode.Auto
        PaddingLeft: =20
        PaddingTop: =15
        Width: =Parent.Width
        Y: =Parent.Height - Self.Height - 'attachmentControl - Expense_1'.Height/2
        ZIndex: =2

        scr10_lbl_SelectAReceipt_2 As label:
            Color: =RGBA(243, 242, 241, 1)
            Font: =Font.'Segoe UI'
            Height: =35
            LayoutMaxHeight: =
            LayoutMaxWidth: =
            LayoutMinHeight: =70
            LayoutMinWidth: =560
            Size: =15
            Text: |-
                =GlobalLabels.Labels.'15062:LocalizedName,msdyn_SelectExistingReceiptLabel'
            Width: =380
            X: =25
            Y: =710
            ZIndex: =1

        "scr10_glr_Receipts_2 As gallery.'BrowseLayout_Horizontal_TwoTextOneImageVariant_ver4.0'":
            '#CopilotOverlayLabel': ="Filtered"
            AccessibleLabel: ="List of unattached receipts"
            AlignInContainer: =AlignInContainer.SetByContainer
            BorderColor: =RGBA(255, 255, 255, 1)
            FocusedBorderThickness: =0
            Height: =300
            Items: |
                =Filter('Expense Mobile Unattached Document Entity (mserp)', IsReceiptValid = 'NoYes (mserp)'.Yes)
            LayoutMaxHeight: =
            LayoutMaxWidth: =
            LayoutMinHeight: =250
            LayoutMinWidth: =320
            NavigationStep: =2
            ShowScrollbar: =false
            TemplatePadding: =10
            TemplateSize: =300
            Width: =Parent.Width -  Self.X*2
            X: =10
            Y: =745
            ZIndex: =2

            Container3_7 As groupContainer.verticalAutoLayoutContainer:
                DropShadow: =DropShadow.Regular
                Height: =Parent.Height
                LayoutDirection: =LayoutDirection.Vertical
                LayoutGridColumns: =6
                LayoutGridRows: =6
                LayoutMode: =LayoutMode.Auto
                LayoutOverflowY: =LayoutOverflow.Scroll
                RadiusBottomLeft: =10
                RadiusBottomRight: =10
                RadiusTopLeft: =10
                RadiusTopRight: =10
                Width: =Parent.TemplateWidth
                ZIndex: =5

                scr10_img_ReceiptImage_2 As image:
                    AccessibleLabel: =ThisItem.Description
                    BorderColor: =RGBA(0, 0, 0, 1)
                    BorderThickness: =1
                    Fill: |-
                        =If(
                            ThisItem.FileExtension in ["jpg", "bmp", "jpeg", "png", "heic", "tif", "tiff", "raw"],
                            RGBA(0, 0, 0, 0),
                            RGBA(229, 229, 229, 1)
                        )
                    Height: =250
                    Image: |-
                        =If(
                            ThisItem.FileExtension in ["jpg", "bmp", "jpeg", "png", "heic", "tif", "tiff", "raw"] && !IsBlank(ThisItem.CapturedDocument),
                            ThisItem.CapturedDocument,
                            ThisItem.FileExtension in ["xlsx", "xls"],
                            IconExcel,
                            ThisItem.FileExtension in ["docx", "doc"],
                            IconWord,
                            ThisItem.FileExtension = "pdf",
                            IconPDF,
                            ThisItem.FileExtension = "txt",
                            IconTxt,
                            IconMail
                        )
                    ImagePosition: |-
                        =/*If(
                            scr09_img_ReceiptList.Image = ThisItem.receiptUrl,
                            ImagePosition.Fill,
                            ImagePosition.Center
                        )*/
                        ImagePosition.Center
                    LayoutMaxHeight: =
                    LayoutMaxWidth: =
                    LayoutMinHeight: =320
                    LayoutMinWidth: =320
                    OnSelect: |-
                        =Set(
                            varSelectedReceiptNumber,
                            ThisItem.EntRecId
                        );
                        Set(
                            IsreceiptALreadyCreated,
                            true
                        );
                        Set(
                            varFileFormat,
                            ThisItem.FileExtension
                        );
                        Set(
                            varReceiptImage,
                            ThisItem.CapturedDocument
                        );
                        Navigate('Expenses - Preview Receipt Screen')
                    Width: =Parent.Width
                    X: =15
                    Y: =18
                    ZIndex: =1

                Container4_7 As groupContainer.horizontalAutoLayoutContainer:
                    Fill: =Color.DimGrey
                    FillPortions: =0
                    Height: =80
                    LayoutAlignItems: =LayoutAlignItems.Center
                    LayoutGridColumns: =6
                    LayoutGridRows: =6
                    LayoutMaxHeight: =
                    LayoutMaxWidth: =
                    LayoutMinHeight: =70
                    LayoutMinWidth: =250
                    LayoutMode: =LayoutMode.Auto
                    ZIndex: =2

                    shpBorder_19 As rectangle:
                        Fill: =Color.Transparent
                        Height: =Parent.Height
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        Width: |
                            =25
                        ZIndex: =1

                    scr10_icn_AttachIcn_2 As image:
                        AccessibleLabel: ="Attach this receipt"
                        Height: =24
                        Image: =AttachIcnWhite
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        LayoutMinHeight: =320
                        LayoutMinWidth: =320
                        OnSelect: |-
                            =Set(
                                varSelectedReceiptNumber,
                                ThisItem.EntRecId
                            );
                            Set(
                                varFileFormat,
                                ThisItem.FileExtension
                            );
                            Set(
                                IsreceiptALreadyCreated, 
                                true
                            );
                            Set(
                                varReceiptImage,
                               ThisItem.CapturedDocument
                            );
                            Navigate('Expenses - Preview Receipt Screen')
                        Width: =24
                        X: =33
                        Y: =201
                        ZIndex: =5

                    scr10_lbl_Attach_2 As label:
                        Color: =Color.White
                        FontWeight: =FontWeight.Lighter
                        Height: =48
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        LayoutMinHeight: =70
                        LayoutMinWidth: =560
                        OnSelect: |-
                            =Set(
                                varSelectedReceiptNumber,
                                ThisItem.EntRecId
                            );
                            Set(
                                varFileFormat,
                                ThisItem.FileExtension
                            );
                            Set(
                                IsreceiptALreadyCreated, 
                                true
                            );
                            Set(
                                varReceiptImage,
                                ThisItem.CapturedDocument
                            );
                            Navigate('Expenses - Preview Receipt Screen')
                        Size: =21
                        TabIndex: =0
                        Text: |-
                            =GlobalLabels.Labels.'15062:LocalizedName,msdyn_AttachLabel'
                        VerticalAlign: =VerticalAlign.Top
                        Width: =101
                        X: =scr10_icn_AttachIcn_2.X + scr10_icn_AttachIcn_2.Width + 8
                        Y: =scr10_icn_AttachIcn_2.Y - 10
                        ZIndex: =6

    scr10_img_SelectedReceipt As image:
        Fill: =RGBA(0, 0, 0, 1)
        Height: ='Select Existing receipt'.Y - Self.Y
        HoverFill: =Self.Fill
        Image: =
        ImagePosition: =ImagePosition.Center
        Width: =Parent.Width
        Y: =scr10_hdr_TopHeader.Height
        ZIndex: =5

    scr10_hdr_TopHeader As hdr02_Header:
        Fill: =scr10_hdr_TopHeader.paramFill
        paramColor: =RGBA(255, 255, 255, 1)
        paramFill: |
            =RGBA(33, 33, 33, 1)
        paramTitle: |-
            =
            GlobalLabels.Labels.'15062:LocalizedName,msdyn_AddReceiptLabel'
        ZIndex: =6

    scr10_ico_Back As icon.ChevronLeft:
        AccessibleLabel: ="Press to go back"
        Color: =Color.White
        Fill: =icongconfig_backbutton.Fill
        Height: =icongconfig_backbutton.Height
        Icon: =Icon.ChevronLeft
        OnSelect: =Back();
        TabIndex: =0
        Width: =icongconfig_backbutton.Width
        X: =22.5
        Y: =(scr10_hdr_TopHeader.Height-Self.Height)/2
        ZIndex: =7

    scr10_lbl_Skip As label:
        Align: =Align.Center
        Color: =RGBA(255, 255, 255, 1)
        Font: =Font.'Segoe UI'
        FontWeight: =FontWeight.Semibold
        Height: =33
        OnSelect: |-
            =Navigate('Expenses - Edit Screen',ScreenTransition.Fade,{locItemizeButtonVisibilityFlag: false})
        Size: =17
        TabIndex: =0
        Text: |-
            =GlobalLabels.Labels.'15062:LocalizedName,msdyn_SkipLabel'
        Width: =scr10_hdr_TopHeader.Width * 0.235
        Wrap: =false
        X: =(Parent.Width - Self.Width) - 15
        Y: =24
        ZIndex: =8

