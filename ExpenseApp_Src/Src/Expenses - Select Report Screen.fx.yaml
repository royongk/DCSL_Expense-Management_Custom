"'Expenses - Select Report Screen' As screen.'phoneBrowseLayout_ver3.0'":
    Fill: =RGBA(248, 248, 248, 0.94)
    OnVisible: |-
        =UpdateContext({varCntSelect:false});
        //Clear(collSelectedExpenses)
        Refresh('Expense reports (mserp)_1')

    emptyStateComponent_6 As emptyStateComponent:
        subTitle: =
        title: |-
            =GlobalLabels.Labels.'15062:LocalizedName,msdyn_NothingHereYetLabel'
        Visible: =CountRows(scr07_DraftReports.AllItems)=0
        X: |
            =(Parent.Width - Self.Width)/2
        Y: |
            =(Parent.Height - Self.Height)/2

    "scr07_DraftReports As gallery.'BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0'":
        '#CopilotOverlayLabel': ="Filtered"
        DelayItemLoading: =true
        Height: =Min(Self.TemplateHeight * CountRows(Self.AllItems), Parent.Height - Self.Y)
        Items: |-
            =SortByColumns(
                Filter(
                    'Expense reports (mserp)_1',
                    'Document Status' in dsDrafts[@Value] && DEEXLegalEntity_DataArea = varSelectedLegalEntity
                ),
                "mserp_createddate",
                SortOrder.Descending
            )
        Layout: =Layout.Vertical
        LoadingSpinner: =LoadingSpinner.Data
        OnSelect: |-
            =UpdateContext({varCntSelect : true})
        TemplatePadding: =0
        TemplateSize: =150
        Width: =Parent.Width
        Y: |
            =scr07_lbl_SelectReports.Y + scr07_lbl_SelectReports.Height
        ZIndex: =4

        Container11_3 As groupContainer.verticalAutoLayoutContainer:
            Height: =150
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGridColumns: =6
            LayoutGridRows: =6
            LayoutMode: =LayoutMode.Auto
            Width: =Parent.Width
            ZIndex: =2

            Container6_3 As groupContainer.horizontalAutoLayoutContainer:
                Height: =Parent.Height - scr07_shp_GalleryBaseSeparator_3.Height
                LayoutGridColumns: =6
                LayoutGridRows: =6
                LayoutMaxHeight: =
                LayoutMaxWidth: =
                LayoutMinHeight: =112
                LayoutMinWidth: =250
                LayoutMode: =LayoutMode.Auto
                Width: =Parent.Width
                ZIndex: =1

                shpBorder_10 As rectangle:
                    Fill: =Color.Transparent
                    Height: =Parent.Height
                    LayoutMaxHeight: =
                    LayoutMaxWidth: =
                    Width: =10
                    ZIndex: =1

                Container7_3 As groupContainer.verticalAutoLayoutContainer:
                    Height: =225
                    LayoutDirection: =LayoutDirection.Vertical
                    LayoutGridColumns: =6
                    LayoutGridRows: =6
                    LayoutJustifyContent: =LayoutJustifyContent.Center
                    LayoutMaxHeight: =
                    LayoutMaxWidth: =
                    LayoutMinHeight: =112
                    LayoutMinWidth: =250
                    LayoutMode: =LayoutMode.Auto
                    ZIndex: =4

                    Label5_6 As label:
                        AutoHeight: =true
                        Font: =Font.'Segoe UI'
                        Height: =70
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        LayoutMinHeight: =70
                        LayoutMinWidth: =560
                        OnSelect: =Select(scr07_shp_SelectRegion)
                        PaddingLeft: =15
                        PaddingRight: =0
                        Size: =21
                        TabIndex: =If(IsBlank(Self.Text), -1, 0)
                        Text: =ThisItem.Purpose
                        Width: =Parent.Width
                        ZIndex: =1

                    Label6_6 As label:
                        AutoHeight: =true
                        Color: |
                            =If(
                                ThisItem.'Document Status' = 'Document Status (mserp)'.Rejected,
                                RGBA(165, 33, 33, 1),
                                RGBA(102, 102, 102, 1)
                            )
                        Font: =Font.'Segoe UI'
                        Height: =70
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        LayoutMinHeight: =70
                        LayoutMinWidth: =560
                        OnSelect: =Select(scr07_shp_SelectRegion)
                        PaddingLeft: =15
                        PaddingRight: =0
                        Size: =21
                        TabIndex: =If(IsBlank(Self.Text), -1, 0)
                        Text: |-
                            =If(
                                ThisItem.'Document Status' = 'Document Status (mserp)'.Rejected,
                                GlobalLabels.Labels.'15062:LocalizedName,msdyn_ReportRejectedLabel',
                                ThisItem.Description
                            )
                        Width: =Parent.Width
                        ZIndex: =2

                Container9_3 As groupContainer.verticalAutoLayoutContainer:
                    FillPortions: =0
                    Height: =225
                    LayoutAlignItems: =LayoutAlignItems.Center
                    LayoutDirection: =LayoutDirection.Vertical
                    LayoutGridColumns: =6
                    LayoutGridRows: =6
                    LayoutJustifyContent: =LayoutJustifyContent.Center
                    LayoutMaxHeight: =
                    LayoutMaxWidth: =
                    LayoutMinHeight: =112
                    LayoutMinWidth: =250
                    LayoutMode: =LayoutMode.Auto
                    Width: =200
                    ZIndex: =5

                    Label5_7 As label:
                        Align: =Align.Center
                        AutoHeight: =true
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =70
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        LayoutMinHeight: =70
                        LayoutMinWidth: =560
                        OnSelect: =Select(scr07_shp_SelectRegion)
                        Size: =21
                        TabIndex: =If(IsBlank(Self.Text), -1, 0)
                        Text: |-
                            =Concatenate(Text(Value(ThisItem.'Amount (mserp_amounttotal)'),"#,#0.00", varDefaultLanguage), " ", varDefaultCurrency)
                        Width: =Parent.Width
                        ZIndex: =1

                    Label6_7 As label:
                        Align: =Align.Center
                        AutoHeight: =true
                        Font: =Font.'Segoe UI'
                        Height: =70
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        LayoutMinHeight: =70
                        LayoutMinWidth: =560
                        OnSelect: =Select(scr07_shp_SelectRegion)
                        Size: =21
                        TabIndex: =If(IsBlank(Self.Text), -1, 0)
                        Text: |-
                            =Text(
                                DateValue(ThisItem.CreatedDate),
                                "mmm dd, yyyy"
                            )
                        Width: =Parent.Width
                        ZIndex: =2

            scr07_shp_GalleryBaseSeparator_3 As rectangle:
                AlignInContainer: =AlignInContainer.Center
                Fill: =RGBA(225, 225, 225, 1)
                Height: =1
                LayoutMaxHeight: =
                LayoutMaxWidth: =
                LayoutMinHeight: =1
                Width: =Parent.Width - 10
                ZIndex: =2

        scr07_shp_SelectRegion As rectangle:
            AccessibleLabel: ="Select expense"
            Fill: =RGBA(0, 0, 0, 0)
            FocusedBorderThickness: =0
            Height: =Parent.TemplateHeight
            OnSelect: =Select(Parent)
            TabIndex: =0
            Width: =Container9_3.X + Container9_3.Width
            ZIndex: =4

    scr07_shp_Rectangle As rectangle:
        Fill: =Color.White
        Height: =67
        Visible: =varCntSelect
        Width: =Parent.Width
        Y: =85
        ZIndex: =5

    scr07_lbl_SelectReports As label:
        Fill: =Color.White
        Font: =Font.'Segoe UI'
        Height: =70
        PaddingLeft: =22
        Size: =18
        Text: |
            =GlobalLabels.Labels.'15062:LocalizedName,msdyn_SelectReportToAttachExpensesLabel'
        Width: =Parent.Width
        Y: =82
        ZIndex: =6

    scr07_dialog_AttachExpenses As cmp02_ConfirmationDialog:
        OnLeftButtonClick: |-
            =UpdateContext({varCntSelect : false})
        OnRightButtonClick: |-
            =            ForAll(
                collSelectedExpenseIds,
                Collect(
                    colToAttach,
                    {expenseTransactionNumber : ThisRecord.transactionId}
                )
            );
            ForAll(
                Filter(
                    'Expense lines (mserp)',
                    'Expense report number (mserp_expnumber)' = scr07_DraftReports.Selected.'Expense report number'
                ),
                If(
                    !IsBlank(ThisRecord.'Expense transaction number (mserp_exptransnumber)'),
                    Collect(
                        colToAttach,
                        {
                            expenseTransactionNumber : ThisRecord.'Expense transaction number (mserp_exptransnumber)'
                        }
                    )
                )
            );
            UpdateContext({varExpenseReportNumber : scr07_DraftReports.Selected.'Expense report number'});
            IfError(
                Patch(
                    'Expense reports (mserp)',
                    LookUp('Expense reports (mserp)','Expense report number' = varExpenseReportNumber),
                    {
                        ExpTransNumber: Concat(colToAttach, expenseTransactionNumber, ",")
                    }
                ),
                First( ClearCollect( varError, Substitute( Match(FirstError.Details.HttpResponse, """message"":""([^""]*)""").FullMatch, """message"":", "" ) ) )
            );
            If(
                IsBlank(First(varError).Value) || First(varError).Value <> "",
                Set(
                    varSelectedReport,
                    LookUp('Expense reports (mserp)','Expense report number' = varExpenseReportNumber)
                );
                Clear(colAttachedExpensesForReport);
                ForAll(
                    Split(varSelectedReport.ExpTransNumber, ",") As attachedExpenses,
                    Collect(
                        colAttachedExpensesForReport,
                        LookUp('Expense lines (mserp)','Expense transaction number (mserp_exptransnumber)' = attachedExpenses[@Value] && 'Expense line type' <> 'Expense line type (mserp)'.'Itemized line')
                    )
                );
                ClearCollect(
                    colAttachedExpenses,
                    colAttachedExpensesForReport
                );
                Set(
                    varIsCreateReport, false
                );
                Set(
                    varSelectedReportStatusItem,
                    varSelectedReport.'Document Status'
                );
                Refresh('Expense lines (mserp)');
                Navigate('Reports - Edit Screen'),
                Notify(
                    Substitute(First(varError).Value, """", ""),
                    NotificationType.Error,
                    gblParams.notificationTime
                )
            );
            Clear(varError);
            Clear(colToAttach);
        parmInDescriptionText: |-
            =GlobalLabels.Labels.'15062:LocalizedName,msdyn_ConfirmExpenseAttachToReportLabel'
        parmInHeaderText: |-
            =GlobalLabels.Labels.'15062:LocalizedName,msdyn_AttachSelectedExpenseLabel'
        parmInLeftButtonColor: =RGBA(39, 113, 194, 1)
        parmInLeftButtonText: |-
            =GlobalLabels.Labels.'15062:LocalizedName,msdyn_NoOptionLabel'
        parmInRightButtonColor: =RGBA(39, 113, 194, 1)
        parmInRightButtonText: |-
            =GlobalLabels.Labels.'15062:LocalizedName,msdyn_YesOptionLabel'
        Visible: =varCntSelect
        Y: =0
        ZIndex: =7

    scr07_hdr_Header As hdr02_Header:
        Fill: =scr07_hdr_Header.paramFill
        paramFill: =Color.White
        paramTitle: |
            =GlobalLabels.Labels.'15062:LocalizedName,msdyn_SelectReportLabel'
        ZIndex: =8

    scr07_ico_Back As icon.ChevronLeft:
        AccessibleLabel: ="Press to go back"
        Color: =RGBA(110, 110, 110, 1)
        Fill: =icongconfig_backbutton.Fill
        Height: =icongconfig_backbutton.Height
        Icon: =Icon.ChevronLeft
        OnSelect: |-
            =Navigate(
                'Expenses - List Screen',
                ScreenTransition.None
            )
        TabIndex: =0
        Width: =icongconfig_backbutton.Width
        X: =22
        Y: =(scr02_hdr_TopHeader.Height-Self.Height)/2
        ZIndex: =9

