"'Expenses - View Only Screen' As screen":
    Fill: =RGBA(248, 248, 248, 1)
    OnVisible: |-
        =UpdateContext(
            {
                locItemizeButtonVisibilityFlagViewOnly : 
                'Expense mobile master data (mserp)'.mserp_trvexpmobilemasterdataentity_isexpenseitemizable(
                    LookUp('Expense mobile master data (mserp)',Email = User().Email).'Expense mobile master data (mserp)', 
                    {
                        CostType: Coalesce(varExpenseAgainstWorkItem.'Expense category (mserp_costtype)',varSelectedExpenseDoc.'Expense category (mserp_costtype)'),
                        SplitLineType:"Default",
                        LineType: If(Coalesce(varExpenseAgainstWorkItem.'Expense line type',varSelectedExpenseDoc.'Expense line type') = 'Expense line type (mserp)'.'Itemized header',"ItemizedHeader","Default")
                    }
                ).return
            }
        );
        UpdateContext(
            {
                featureEnabled: If(
                    userRecord.IsReimaginedUIEnabled = 'NoYes (mserp)'.Yes,
                    "True",
                    "False"
                ),
                perdiemFeatureEnabled: If(
                    userRecord.IsReimaginedUIEnabled = 'NoYes (mserp)'.Yes,  //this needs to be changed to the perdiem feature enabled
                    "True",
                    "False"
                )
            }
        );
        //if labelTableLookUp not empty
        If(
            CountRows(labelTableLookUp) <= 0,
            Collect(
                labelTableLookUp,
                {
                    fieldName : "CostType",
                    labelName : "Expense category",
                    localisedLabelName : GlobalLabels.Labels.'15062:LocalizedName,msdyn_ExpenseCategoryLabel',
                    visible : true,
                    required : true
                },
                {
                    fieldName : "TransDate",
                    labelName : "Transaction date",
                    localisedLabelName : GlobalLabels.Labels.'15062:LocalizedName,msdyn_TransactionDateLabel',
                    visible : true,
                    required : true
                },
                {
                    fieldName : "AmountCurr",
                    labelName : "Transaction amount",
                    localisedLabelName : GlobalLabels.Labels.'15062:LocalizedName,msdyn_TransactionAmountLabel',
                    visible : true,
                    required : true
                },
                {
                    fieldName : "ExchangeCode",
                    labelName : "Currency",
                    localisedLabelName : GlobalLabels.Labels.'15062:LocalizedName,msdyn_CurrencyLabel',
                    visible : true,
                    required : true
                },
                {
                    fieldName : "PayMethod",
                    labelName : "Payment method",
                    localisedLabelName : GlobalLabels.Labels.'15062:LocalizedName,msdyn_PaymentMethodLabel',
                    visible : true,
                    required : true
                },
                {
                    fieldName : "SubmitterJustification",
                    labelName : "Employee justification",
                    localisedLabelName : GlobalLabels.Labels.'15062:LocalizedName,msdyn_EmployeeJustificationLabel',
                    visible : false,
                    required : false
                }
            );
            ForAll(
                    Filter('@ExpenseManagement:ExpenseMobileFieldVisibilityEntity (mserp)',LegalEntityId = varSelectedLegalEntity) As VisibilityTable,
                    Collect(
                        labelTableLookUp,
                        {
                            fieldName : VisibilityTable.FieldName,
                            labelName : VisibilityTable.Labels,
                            localisedLabelName : VisibilityTable.LocalisedLabelName
                        }
                    )
                );
            If(
                featureEnabled = "True",
                ForAll(
                    Filter('@ExpenseManagement:ExpenseMobileFieldVisibilityEntity (mserp)',LegalEntityId = varSelectedLegalEntity) As VisibilityTable,
                    Patch(
                        labelTableLookUp,
                        LookUp(labelTableLookUp,fieldName = VisibilityTable.FieldName),
                        {
                            visible : VisibilityTable.VisibilityType <> 'ExpenseFieldVisibilityType (mserp)'.'Do not display',
                            required : VisibilityTable.VisibilityType = 'ExpenseFieldVisibilityType (mserp)'.Required
                        }
                    )
                ),
                ForAll(
                    Filter('Display fields (mserp)', 'Company Code' = varSelectedLegalEntity) As VisibilityTable,
                    Patch(
                        labelTableLookUp,
                        LookUp(labelTableLookUp,fieldName = VisibilityTable.FieldName),
                        {
                            visible : VisibilityTable.Visibility <> 'Visibility (mserp)'.'Do not display',
                            required : false
                        }
                    )
                )
           
            )
        );
        Set(
            gblParams,
            {
                dropDownHeight : 60,
                dorpDownBorderThickness : 2,
                dropDownBorderColor : RGBA(34, 102, 227, 1),
                dropDownLabelColor : Color.Black,
                dropDownHoverFill : RGBA(204, 222, 255, 1),
                errorMessageSize : 18,
                dropDownFontSize : 24,
                expenseDataCardViewOnly: RGBA(110, 110, 110, 1),
                notificationTime : 4000
            }
        );
        
        UpdateContext(
            {
                currExpenseType:
                If(
                    ViewExpenseDetail_approvals.Visible,
                    varExpenseAgainstWorkItem.'Expense type',
                    varSelectedExpenseDoc.'Expense type'
                )
            }
        );

    scr03_img_NoReceiptOuter_3 As image:
        BorderColor: =RGBA(255, 0, 37, 0.2)
        BorderStyle: =BorderStyle.Dashed
        DisplayMode: =DisplayMode.View
        Fill: =RGBA(255, 255, 255, 1)
        Height: =Parent.Height/4
        Image: |-
            =If(
                varFileFormat in ["jpg", "bmp", "jpeg", "png", "heic", "tif", "tiff", "raw"] && !IsBlank(varReceiptImage),
                varReceiptImage,
                varFileFormat in ["xlsx", "xls"],
                IconExcel,
                varFileFormat in ["docx", "doc"],
                IconWord,
                varFileFormat = "pdf",
                IconPDF,
                varFileFormat = "txt",
                IconTxt,
                IconMail
            )
        ImagePosition: |-
            =If(
                varFileFormat in ["jpg", "bmp", "jpeg", "png", "heic", "tif", "tiff", "raw"] && !IsBlank(varReceiptImage),
                ImagePosition.Stretch,
                ImagePosition.Center
            )
        RadiusBottomLeft: =18
        RadiusBottomRight: =18
        RadiusTopLeft: =18
        RadiusTopRight: =18
        Visible: =!IsBlank(varReceiptImage)
        Width: =Parent.Width -  Self.X*2
        X: =26
        Y: |-
            =If(
                scr03_lbl_PolicyViolationWarning_4.Visible,
                scr03_lbl_PolicyViolationWarning_4.Y + scr03_lbl_PolicyViolationWarning_4.Height + 27,
                scr03_lbl_ValidationWarning_4.Y + scr03_lbl_ValidationWarning_4.Height + 27
            )
        ZIndex: =1

