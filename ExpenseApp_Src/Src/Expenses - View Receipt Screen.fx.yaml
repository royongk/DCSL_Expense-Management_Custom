"'Expenses - View Receipt Screen' As screen":
    Fill: =RGBA(229, 229, 229, 1)
    OnVisible: |-
        =/*UpdateContext({varCntShowConfirmationDialog: false});
        UpdateContext({varChangeCalled : false});*/
        Set(varChangeCalled,false);
        Set(varCntShowConfirmationDialog,false);
        UpdateContext({varRotateImage: ImageRotation.None});
        
        // Initialize varCurrentReceiptIndex if not set
        If(
            IsBlank(varCurrentReceiptIndex),
            Set(varCurrentReceiptIndex, 1)
        );
        
        // Load all attached receipts for this expense line
        // [1. 최상위 If 시작] 문서 정보가 있을 때만 실행
        If(
            !varViewOnly && !IsBlank(varSelectedExpenseDoc) && !IsBlank(varSelectedExpenseDoc.'Expense transaction number (mserp_exptransnumber)'),
            
            ClearCollect(
                colAttachedReceipts,
                SortByColumns(
                    Filter(
                        'Expense Mobile Unattached Document Entity (mserp)',
                        ExpTransNumber = varSelectedExpenseDoc.'Expense transaction number (mserp_exptransnumber)'
                    ),
                    "mserp_creatingdatetime",
                    SortOrder.Descending
                )
            );
            
            // Find current receipt index
            // [2. 내부 If 시작] 컬렉션 비어있는지 확인
            If(
                !IsEmpty(colAttachedReceipts),
                // Receipts collection is available
                If(
                    !IsBlank(varSelectedReceiptForView),
                    // Find index of selected receipt
                    With(
                        {
                            receiptRecord: LookUp(colAttachedReceipts, mserp_entrecid = varSelectedReceiptForView)
                        },
                        If(
                            !IsBlank(receiptRecord),
                            // Receipt found in collection
                            With(
                                {
                                    receiptIndex: CountRows(
                                        Filter(
                                            colAttachedReceipts,
                                            mserp_entrecid <= receiptRecord.mserp_entrecid
                                        )
                                    )
                                },
                                Set(
                                    varCurrentReceiptIndex,
                                    receiptIndex
                                );
                                Set(
                                    varReceiptImage,
                                    receiptRecord.mserp_captureddocument
                                );
                                Set(
                                    varFileFormat,
                                    receiptRecord.mserp_fileextension
                                )
                            ),
                            // Receipt not found, use first receipt
                            Set(
                                varCurrentReceiptIndex,
                                1
                            );
                            Set(
                                varSelectedReceiptForView,
                                First(colAttachedReceipts).mserp_entrecid
                            );
                            Set(
                                varReceiptImage,
                                First(colAttachedReceipts).mserp_captureddocument
                            );
                            Set(
                                varFileFormat,
                                First(colAttachedReceipts).mserp_fileextension
                            )
                        )
                    ),
                    // varSelectedReceiptForView is blank, use first receipt
                    Set(
                        varCurrentReceiptIndex,
                        1
                    );
                    Set(
                        varSelectedReceiptForView,
                        First(colAttachedReceipts).mserp_entrecid
                    );
                    Set(
                        varReceiptImage,
                        First(colAttachedReceipts).mserp_captureddocument
                    );
                    Set(
                        varFileFormat,
                        First(colAttachedReceipts).mserp_fileextension
                    )
                ),
                // No receipts in collection - use AttachedReceiptId if available (backward compatibility)
                If(
                    !IsBlank(varSelectedExpenseDoc.AttachedReceiptId),
                    Set(
                        varReceiptImage,
                        LookUp('Expense Mobile Attached Document Entity (mserp)', mserp_entrecid = Value(varSelectedExpenseDoc.AttachedReceiptId), mserp_captureddocument)
                    );
                    Set(
                        varFileFormat,
                        LookUp('Expense Mobile Attached Document Entity (mserp)', mserp_entrecid = Value(varSelectedExpenseDoc.AttachedReceiptId), mserp_fileextension)
                    );
                    Set(
                        varSelectedReceiptForView,
                        Value(varSelectedExpenseDoc.AttachedReceiptId)
                    );
                    Set(
                        varCurrentReceiptIndex,
                        1
                    )
                )
            ) // [2. 내부 If 종료]
        ); // [1. 최상위 If 종료] <--- 여기에 괄호 ')'가 필요합니다.

    imageView_footer_rectangle_1 As rectangle:
        Fill: =RGBA(37, 36, 35, 1)
        Height: |-
            =If(
                varViewOnly,
                278 - scr06_btn_ChangeReceipt.Height,
                278
            )
        OnSelect: =
        Width: =Max(App.Width, App.MinScreenWidth)
        Y: =Parent.Height - Self.Height
        ZIndex: =1

    scr06_btn_ChangeReceipt As button:
        BorderColor: =RGBA(255, 255, 255, 1)
        BorderThickness: =3
        DisplayMode: |-
            =If(
                varViewOnly,
                DisplayMode.View,
                DisplayMode.Edit
            )
        Fill: =RGBA(33, 33, 33, 1)
        Height: =88
        HoverColor: =Self.Color
        HoverFill: =Self.Fill
        OnSelect: |
            =Set(varChangeCalled,true);
            If(
                varChangeReceiptItemizedExpense,
                Set(
                    varCntShowConfirmationDialogItemize,
                    true
                ),
                Set(
                    varCntShowConfirmationDialog,
                    true
                )
            );
            
            
            Set(
                varSelectedReceiptNumber, 
                Blank()
            );
        PressedBorderColor: =Self.BorderColor
        PressedColor: =Self.Color
        PressedFill: =Self.Fill
        Size: =22
        Text: |-
            =GlobalLabels.Labels.'15062:LocalizedName,msdyn_ChangeReceiptLabel'
        Visible: =!varViewOnly
        Width: |
            =Parent.Width -  Self.X*2
        X: =40
        Y: =scr06_btn_Done_1.Y + scr06_btn_Done_1.Height + 30
        ZIndex: =2

    scr06_btn_Done_1 As button:
        Fill: =RGBA(34, 102, 227, 1)
        Height: =87
        OnSelect: |-
            =If(
                varItemizedViewOnly,
                Navigate('Itemization - Itemized Expense View Only Screen'),
                locNavigateItemizedExpense,
                Navigate('Itemization - Itemized Expense Edit Screen'),
                If(
                    varViewOnly,
                    Navigate('Expenses - View Only Screen - New', ScreenTransition.None),
                    Navigate('Expenses - Edit Screen', ScreenTransition.None)
                )
            );
            UpdateContext({varItemizedViewOnly : false})
        Size: =24
        Text: |-
            =GlobalLabels.Labels.'15062:LocalizedName,msdyn_DoneButtonLabel'
        Width: |
            =Parent.Width -  Self.X*2
        X: =40
        Y: =imageView_footer_rectangle_1.Y + 25
        ZIndex: =3

    scr06_img_Receipt As image:
        Height: =imageView_footer_rectangle_1.Y - Self.Y
        Image: =varReceiptImage
        ImageRotation: =varRotateImage
        Visible: |-
            ="data:image" in varReceiptImage
        Width: =Parent.Width
        Y: =scr06_hdr_TopHeader.Height
        ZIndex: =4

    scr06_pdfViewer As pdfViewer:
        BorderColor: =RGBA(0, 0, 0, 1)
        Document: =varReceiptImage
        Fill: =RGBA(0, 0, 0, 0.5)
        Height: =scr06_img_Receipt.Height
        Visible: |-
            ="data:application/pdf" in varReceiptImage
        Width: =scr06_img_Receipt.Width
        X: =scr06_img_Receipt.X
        Y: =scr06_img_Receipt.Y
        ZIndex: =5

    scr06_lbl_NoPreview As label:
        Align: =Align.Center
        Font: =Font.'Segoe UI'
        Height: =64
        Size: =18
        Text: |-
            =GlobalLabels.Labels.'15062:LocalizedName,msdyn_FilePreviewNotSupportedLabel'
        Visible: =!(scr06_pdfViewer.Visible || scr06_img_Receipt.Visible)
        Width: =406     
        X: |
            =(Parent.Width - Self.Width)/2
        Y: =scr06_img_NoPreview.Y + scr06_img_NoPreview.Height + 10 
        ZIndex: =6

    scr06_img_NoPreview As image:
        Height: =85
        Image: |-
            =If(
                varFileFormat in ["xlsx", "xls"],
                IconExcel,
                varFileFormat in ["docx", "doc"],
                IconWord,
                varFileFormat = "txt",
                IconTxt,
                IconMail
            )
        Visible: =scr06_lbl_NoPreview.Visible
        Width: =85
        X: |
            =(Parent.Width - Self.Width)/2
        Y: =scr06_img_Receipt.Y + (scr06_img_Receipt.Height - Self.Height)/2
        ZIndex: =7

    scr06_hdr_TopHeader As hdr02_Header:
        Fill: =scr06_hdr_TopHeader.paramFill
        paramColor: =RGBA(255, 255, 255, 1)
        paramFill: |
            =RGBA(33, 33, 33, 1)
        paramTitle: |-
            =If(
                !IsEmpty(colAttachedReceipts) && CountRows(colAttachedReceipts) > 1,
                Concatenate(
                    GlobalLabels.Labels.'15062:LocalizedName,msdyn_ViewReceiptLabel',
                    " (",
                    Text(varCurrentReceiptIndex),
                    " / ",
                    Text(CountRows(colAttachedReceipts)),
                    ")"
                ),
                GlobalLabels.Labels.'15062:LocalizedName,msdyn_ViewReceiptLabel'
            )
        ZIndex: =8

    scr06_lbl_Detach As label:
        Align: =Align.Center
        Color: =RGBA(255, 255, 255, 1)
        DisplayMode: |-
            =If(
                varViewOnly,
                DisplayMode.View,
                DisplayMode.Edit
            )
        Font: =Font.'Segoe UI'
        Height: =82
        OnSelect: |-
            =If(
                varChangeReceiptItemizedExpense,
                Set(
                    varCntShowConfirmationDialogItemize,
                    true
                ),
                Set(
                    varCntShowConfirmationDialog,
                    true
                )
            )
        Size: =21
        TabIndex: =0
        Text: |-
            =GlobalLabels.Labels.'15062:LocalizedName,msdyn_DetachLabel'
        Visible: =!varViewOnly
        Width: =193
        X: =Parent.Width - Self.Width
        ZIndex: =9

    scr06_ico_Back_1 As icon.ChevronLeft:
        AccessibleLabel: ="Press to go back"
        Color: =Color.White
        Fill: =icongconfig_backbutton.Fill
        Height: =icongconfig_backbutton.Height
        Icon: =Icon.ChevronLeft
        OnSelect: =Back()
        TabIndex: =0
        Width: =icongconfig_backbutton.Width
        X: =10.5*Value(lbconfig_resolution_factor.Text)
        Y: =(scr02_hdr_TopHeader.Height-Self.Height)/2
        ZIndex: =10

    cmp02_ConfirmationDialog_HeaderExpense As cmp02_ConfirmationDialog:
        controlName: ="cmp02_ConfirmationDialog_1"
        LegalEntity: =Text(varSelectedLegalEntity)
        OnLeftButtonClick: |-
            =//UpdateContext({varCntShowConfirmationDialog:false})
            Set(varCntShowConfirmationDialog,false);
            Set(varChangeCalled,false);
        OnRightButtonClick: |-
            =//UpdateContext({varCntShowConfirmationDialog: false});
            Set(varCntShowConfirmationDialog,false);
            If(
                !IsBlank(SelectedExpense) && SelectedReceiptNumber <> "0" && !IsBlank(SelectedReceiptNumber),
                IfError(
                    // Detach receipt by setting ExpTransNumber to Blank
                    Patch(
                        'Expense Mobile Unattached Document Entity (mserp)',
                        LookUp(
                            'Expense Mobile Unattached Document Entity (mserp)',
                            EntRecId = Value(SelectedReceiptNumber)
                        ),
                        {
                            ExpTransNumber: Blank()
                        }
                    ),
                    First(
                        ClearCollect(
                            varError,
                            Substitute(
                                Match(
                                    FirstError.Details.HttpResponse,
                                    """message"":""([^""]*)"""
                                ).FullMatch,
                                """message"":",
                                ""
                            )
                        )
                    )
                )
            );
            If(
                (IsBlank(First(varError).Value) || First(varError).Value = ""),
                // Refresh receipts collection
                ClearCollect(
                    colAttachedReceipts,
                    SortByColumns(
                        Filter(
                            'Expense Mobile Unattached Document Entity (mserp)',
                            ExpTransNumber = varSelectedExpenseDoc.'Expense transaction number (mserp_exptransnumber)'
                        ),
                        "mserp_creatingdatetime",
                        SortOrder.Descending
                    )
                );
                // Update AttachedReceiptId (first receipt or blank)
                If(
                    !IsEmpty(colAttachedReceipts),
                    Patch(
                        'DCSL Expense Line Expense Moblie Entity (mserp)',
                        varSelectedExpenseDoc,
                        {
                            AttachedReceiptId: First(colAttachedReceipts).EntRecId
                        }
                    ),
                    Patch(
                        'DCSL Expense Line Expense Moblie Entity (mserp)',
                        varSelectedExpenseDoc,
                        {
                            AttachedReceiptId: Blank()
                        }
                    )
                );
                Notify(
                    GlobalLabels.Labels.'15062:LocalizedName,msdyn_ReceiptDetachedSuccessfullyLabel',
                    NotificationType.Success,
                    gblParams.notificationTime
                );
                // Update current receipt display
                If(
                    !IsEmpty(colAttachedReceipts),
                    Set(
                        varCurrentReceiptIndex,
                        1
                    );
                    Set(
                        varSelectedReceiptForView,
                        First(colAttachedReceipts).EntRecId
                    );
                    Set(
                        varReceiptImage,
                        First(colAttachedReceipts).CapturedDocument
                    );
                    Set(
                        varFileFormat,
                        First(colAttachedReceipts).FileExtension
                    ),
                    Set(
                        varReceiptImage,
                        Blank()
                    );
                    Set(
                        varSelectedReceiptForView,
                        Blank()
                    )
                ),
                Notify(
                    Substitute(First(varError).Value, """", ""),
                    NotificationType.Error,
                    gblParams.notificationTime
                ) 
                
            );
            If(
                varChangeCalled,
                Navigate('Expenses - Capture Receipt Screen'),
                Navigate('Expenses - Edit Screen')
            )
        parmInDescriptionText: |-
            =If(
                varChangeCalled,
                GlobalLabels.Labels.'15062:LocalizedName,msdyn_ConfirmReceiptChangeLabel',
                GlobalLabels.Labels.'15062:LocalizedName,msdyn_DetachReceiptConfirmationTextLabel'
            )
        parmInHeaderText: |-
            =If(
                varChangeCalled,
                Concatenate(GlobalLabels.Labels.'15062:LocalizedName,msdyn_ReceiptChangeLabel',"?"),
                GlobalLabels.Labels.'15062:LocalizedName,msdyn_DetachSelectedReceiptHeaderLabel'
            )
        parmInLeftButtonColor: =RGBA(34, 102, 227, 1)
        parmInLeftButtonText: |-
            =GlobalLabels.Labels.'15062:LocalizedName,msdyn_CancelLabel'
        parmInRightButtonColor: =RGBA(195, 39, 39, 1)
        parmInRightButtonText: |-
            =GlobalLabels.Labels.'15062:LocalizedName,msdyn_DetachLabel'
        returnFocus: ="scr06_lbl_Detach"
        SelectedExpense: |
            =varSelectedExpenseDoc.'Expense transaction number (mserp_exptransnumber)'
        SelectedReceiptNumber: |-
            =If(
                !IsBlank(varSelectedReceiptForView),
                Text(varSelectedReceiptForView),
                Text(varSelectedExpenseDoc.AttachedReceiptId)
            )
        Visible: =varCntShowConfirmationDialog
        Y: =0
        ZIndex: =11

    cmp02_ConfirmationDialog_Itemized As cmp02_ConfirmationDialog:
        controlName: ="cmp02_ConfirmationDialog_1"
        LegalEntity: =Text(varSelectedLegalEntity)
        OnLeftButtonClick: |-
            =Set(varCntShowConfirmationDialogItemize,false);
            Set(varChangeCalled,false)
        OnRightButtonClick: |-
            =//UpdateContext({varCntShowConfirmationDialog: false});
            Set(varCntShowConfirmationDialogItemize,false);
            If(
                !IsBlank(SelectedExpense) && Text(SelectedReceiptNumber) <> "0" && !IsBlank(Text(SelectedReceiptNumber)),
                IfError(
                    Patch(
                        'DCSL Expense Line Expense Moblie Entity (mserp)',
                        LookUp(
                            'DCSL Expense Line Expense Moblie Entity (mserp)',
                            'Expense transaction number (mserp_exptransnumber)' = SelectedExpense
                        ),
                        {Detach: 1}
                    ),
                    First(
                        ClearCollect(
                            varError,
                            Substitute(
                                Match(
                                    FirstError.Details.HttpResponse,
                                    """message"":""([^""]*)"""
                                ).FullMatch,
                                """message"":",
                                ""
                            )
                        )
                    )
                )
            );
            If(
                (IsBlank(First(varError).Value) || First(varError).Value = ""),
                Notify(
                    GlobalLabels.Labels.'15062:LocalizedName,msdyn_ReceiptDetachedSuccessfullyLabel',
                    NotificationType.Success,
                    gblParams.notificationTime
                );
                Set(
                    varReceiptImage,
                    Blank()
                );
                Set(
                    varSelectedReceiptNumber,
                    Blank()
                ),
                Notify(
                    Substitute(First(varError).Value, """", ""),
                    NotificationType.Error,
                    gblParams.notificationTime
                ) 
                
            );
            If(
                varChangeCalled,
                Navigate('Expenses - Capture Receipt Screen'),
                Navigate('Itemization - Itemized Expense Edit Screen')
            )
        parmInDescriptionText: |-
            =If(
                varChangeCalled,
                GlobalLabels.Labels.'15062:LocalizedName,msdyn_ConfirmReceiptChangeLabel',
                GlobalLabels.Labels.'15062:LocalizedName,msdyn_DetachReceiptConfirmationTextLabel'
            )
        parmInHeaderText: |-
            =If(
                varChangeCalled,
                Concatenate(GlobalLabels.Labels.'15062:LocalizedName,msdyn_ReceiptChangeLabel',"?"),
                GlobalLabels.Labels.'15062:LocalizedName,msdyn_DetachSelectedReceiptHeaderLabel'
            )
        parmInLeftButtonColor: =RGBA(34, 102, 227, 1)
        parmInLeftButtonText: |-
            =GlobalLabels.Labels.'15062:LocalizedName,msdyn_CancelLabel'
        parmInRightButtonColor: =RGBA(195, 39, 39, 1)
        parmInRightButtonText: |-
            =GlobalLabels.Labels.'15062:LocalizedName,msdyn_DetachLabel'
        returnFocus: ="scr06_lbl_Detach"
        SelectedExpense: |
            =varSelectedItemizedExpenseDoc.'Expense transaction number (mserp_exptransnumber)'
        SelectedReceiptNumber: =Text(varSelectedItemizedExpenseDoc.AttachedReceiptId)
        Visible: =varCntShowConfirmationDialogItemize
        Y: =0
        ZIndex: =12

    RotateImageButton_Expenses As image:
        AccessibleLabel: ="Image rotated clockwise 90 degree"
        Fill: |
            =RGBA(37, 36, 35, 0.5)
        Height: =App.Height * 0.055
        Image: =RotateReceiptIcon
        OnSelect: |-
            =Switch(varRotateImage,
                   ImageRotation.None, UpdateContext({varRotateImage:ImageRotation.Rotate90}),
                   ImageRotation.Rotate90, UpdateContext({varRotateImage:ImageRotation.Rotate180}),
                   ImageRotation.Rotate180, UpdateContext({varRotateImage:ImageRotation.Rotate270}),
                   ImageRotation.Rotate270, UpdateContext({varRotateImage:ImageRotation.None}),
                   UpdateContext({varRotateImage:ImageRotation.None})
            )
        RadiusBottomLeft: |-
            =If(
                App.Width > App.Height,
                App.Width * 0.05,
                App.Height * 0.0274
            )
        RadiusBottomRight: =Self.RadiusBottomLeft
        RadiusTopLeft: =Self.RadiusBottomLeft
        RadiusTopRight: =Self.RadiusBottomLeft
        TabIndex: =0
        Width: |
            =If(App.Width > App.Height,
            App.Width * 0.12,
            App.Width * 0.37
            )
        X: =40
        Y: =scr06_img_Receipt.Y + scr06_img_Receipt.Height * 5/6
        ZIndex: =13

    scr06_btn_PreviousReceipt As button:
        BorderColor: =RGBA(255, 255, 255, 1)
        Color: =Color.White
        Fill: =RGBA(33, 33, 33, 1)
        Height: =50
        HoverFill: =RGBA(50, 50, 50, 1)
        OnSelect: |-
            =If(
                varCurrentReceiptIndex > 1,
                With(
                    { 
                        // 1단계: 새로운 인덱스 번호를 먼저 계산하여 정의합니다.
                        newIndex: varCurrentReceiptIndex - 1 
                    },
                    With(
                        { 
                            // 2단계: 위에서 정의한 newIndex를 사용하여 레코드를 찾습니다.
                            receiptRecord: Index(colAttachedReceipts, newIndex) 
                        },
                        
                        // 3단계: 실제 동작을 수행합니다.
                        Set(
                            varCurrentReceiptIndex,
                            newIndex
                        );
                        Set(
                            varSelectedReceiptForView,
                            receiptRecord.mserp_entrecid
                        );
                        Set(
                            varReceiptImage,
                            receiptRecord.mserp_captureddocument
                        );
                        Set(
                            varFileFormat,
                            receiptRecord.mserp_fileextension
                        );
                        UpdateContext({varRotateImage: ImageRotation.None})
                    )
                )
            )
        PressedFill: =RGBA(50, 50, 50, 1)
        Size: =18
        Text: ="Previous"
        Visible: =!IsEmpty(colAttachedReceipts) && CountRows(colAttachedReceipts) > 1 && varCurrentReceiptIndex > 1
        Width: =100
        X: =40
        Y: =imageView_footer_rectangle_1.Y - Self.Height - 15
        ZIndex: =14

    scr06_btn_NextReceipt As button:
        BorderColor: =RGBA(255, 255, 255, 1)
        Color: =Color.White
        Fill: =RGBA(33, 33, 33, 1)
        Height: =50
        HoverFill: =RGBA(50, 50, 50, 1)
        OnSelect: |-
            =If(
                varCurrentReceiptIndex < CountRows(colAttachedReceipts),
                With(
                    { 
                        // 1단계: 다음 인덱스 번호 먼저 계산
                        newIndex: varCurrentReceiptIndex + 1 
                    },
                    With(
                        { 
                            // 2단계: 위에서 만든 newIndex를 사용하여 레코드 찾기
                            receiptRecord: Index(colAttachedReceipts, newIndex) 
                        },
                        
                        // 3단계: 실제 동작 수행
                        Set(
                            varCurrentReceiptIndex,
                            newIndex
                        );
                        Set(
                            varSelectedReceiptForView,
                            receiptRecord.mserp_entrecid
                        );
                        Set(
                            varReceiptImage,
                            receiptRecord.mserp_captureddocument
                        );
                        Set(
                            varFileFormat,
                            receiptRecord.mserp_fileextension
                        );
                        UpdateContext({varRotateImage: ImageRotation.None})
                    )
                )
            )
        PressedFill: =RGBA(50, 50, 50, 1)
        Size: =18
        Text: ="Next"
        Visible: =!IsEmpty(colAttachedReceipts) && CountRows(colAttachedReceipts) > 1 && varCurrentReceiptIndex < CountRows(colAttachedReceipts)
        Width: =100
        X: =Parent.Width - Self.Width - 40
        Y: =imageView_footer_rectangle_1.Y - Self.Height - 15
        ZIndex: =15

