"'Expenses - View Receipt Screen' As screen":
    Fill: =RGBA(229, 229, 229, 1)
    OnVisible: |-
        =/*UpdateContext({varCntShowConfirmationDialog: false});
        UpdateContext({varChangeCalled : false});*/
        Set(varChangeCalled,false);
        Set(varCntShowConfirmationDialog,false);
        UpdateContext({varRotateImage: ImageRotation.None});

    imageView_footer_rectangle_1 As rectangle:
        Fill: =RGBA(37, 36, 35, 1)
        Height: |-
            =If(
                varViewOnly,
                278 - scr06_btn_ChangeReceipt.Height,
                278
            )
        OnSelect: =
        Width: =Max(App.Width, App.MinScreenWidth)
        Y: =Parent.Height - Self.Height
        ZIndex: =1

    scr06_btn_ChangeReceipt As button:
        BorderColor: =RGBA(255, 255, 255, 1)
        BorderThickness: =3
        DisplayMode: |-
            =If(
                varViewOnly,
                DisplayMode.View,
                DisplayMode.Edit
            )
        Fill: =RGBA(33, 33, 33, 1)
        Height: =88
        HoverColor: =Self.Color
        HoverFill: =Self.Fill
        OnSelect: |
            =Set(varChangeCalled,true);
            If(
                varChangeReceiptItemizedExpense,
                Set(
                    varCntShowConfirmationDialogItemize,
                    true
                ),
                Set(
                    varCntShowConfirmationDialog,
                    true
                )
            );
            
            
            Set(
                varSelectedReceiptNumber, 
                Blank()
            );
        PressedBorderColor: =Self.BorderColor
        PressedColor: =Self.Color
        PressedFill: =Self.Fill
        Size: =22
        Text: |-
            =GlobalLabels.Labels.'15062:LocalizedName,msdyn_ChangeReceiptLabel'
        Visible: =!varViewOnly
        Width: |
            =Parent.Width -  Self.X*2
        X: =40
        Y: =scr06_btn_Done_1.Y + scr06_btn_Done_1.Height + 30
        ZIndex: =2

    scr06_btn_Done_1 As button:
        Fill: =RGBA(34, 102, 227, 1)
        Height: =87
        OnSelect: |-
            =If(
                varItemizedViewOnly,
                Navigate('Itemization - Itemized Expense View Only Screen'),
                locNavigateItemizedExpense,
                Navigate('Itemization - Itemized Expense Edit Screen'),
                If(
                    varViewOnly,
                    Navigate('Expenses - View Only Screen', ScreenTransition.None),
                    Navigate('Expenses - Edit Screen', ScreenTransition.None)
                )
            );
            UpdateContext({varItemizedViewOnly : false})
        Size: =24
        Text: |-
            =GlobalLabels.Labels.'15062:LocalizedName,msdyn_DoneButtonLabel'
        Width: |
            =Parent.Width -  Self.X*2
        X: =40
        Y: =imageView_footer_rectangle_1.Y + 25
        ZIndex: =3

    scr06_img_Receipt As image:
        Height: =imageView_footer_rectangle_1.Y - Self.Y
        Image: =varReceiptImage
        ImageRotation: =varRotateImage
        Visible: |-
            ="data:image" in varReceiptImage
        Width: =Parent.Width
        Y: =scr06_hdr_TopHeader.Height
        ZIndex: =4

    scr06_pdfViewer As pdfViewer:
        BorderColor: =RGBA(0, 0, 0, 1)
        Document: =varReceiptImage
        Fill: =RGBA(0, 0, 0, 0.5)
        Height: =scr06_img_Receipt.Height
        Visible: |-
            ="data:application/pdf" in varReceiptImage
        Width: =scr06_img_Receipt.Width
        X: =scr06_img_Receipt.X
        Y: =scr06_img_Receipt.Y
        ZIndex: =5

    scr06_lbl_NoPreview As label:
        Align: =Align.Center
        Font: =Font.'Segoe UI'
        Height: =64
        Size: =18
        Text: |-
            =GlobalLabels.Labels.'15062:LocalizedName,msdyn_FilePreviewNotSupportedLabel'
        Visible: =!(scr06_pdfViewer.Visible || scr06_img_Receipt.Visible)
        Width: =406     
        X: |
            =(Parent.Width - Self.Width)/2
        Y: =scr06_img_NoPreview.Y + scr06_img_NoPreview.Height + 10 
        ZIndex: =6

    scr06_img_NoPreview As image:
        Height: =85
        Image: |-
            =If(
                varFileFormat in ["xlsx", "xls"],
                IconExcel,
                varFileFormat in ["docx", "doc"],
                IconWord,
                varFileFormat = "txt",
                IconTxt,
                IconMail
            )
        Visible: =scr06_lbl_NoPreview.Visible
        Width: =85
        X: |
            =(Parent.Width - Self.Width)/2
        Y: =scr06_img_Receipt.Y + (scr06_img_Receipt.Height - Self.Height)/2
        ZIndex: =7

    scr06_hdr_TopHeader As hdr02_Header:
        Fill: =scr06_hdr_TopHeader.paramFill
        paramColor: =RGBA(255, 255, 255, 1)
        paramFill: |
            =RGBA(33, 33, 33, 1)
        paramTitle: |-
            =GlobalLabels.Labels.'15062:LocalizedName,msdyn_ViewReceiptLabel'
        ZIndex: =8

    scr06_lbl_Detach As label:
        Align: =Align.Center
        Color: =RGBA(255, 255, 255, 1)
        DisplayMode: |-
            =If(
                varViewOnly,
                DisplayMode.View,
                DisplayMode.Edit
            )
        Font: =Font.'Segoe UI'
        Height: =82
        OnSelect: |-
            =If(
                varChangeReceiptItemizedExpense,
                Set(
                    varCntShowConfirmationDialogItemize,
                    true
                ),
                Set(
                    varCntShowConfirmationDialog,
                    true
                )
            )
        Size: =21
        TabIndex: =0
        Text: |-
            =GlobalLabels.Labels.'15062:LocalizedName,msdyn_DetachLabel'
        Visible: =!varViewOnly
        Width: =193
        X: =Parent.Width - Self.Width
        ZIndex: =9

    scr06_ico_Back_1 As icon.ChevronLeft:
        AccessibleLabel: ="Press to go back"
        Color: =Color.White
        Fill: =icongconfig_backbutton.Fill
        Height: =icongconfig_backbutton.Height
        Icon: =Icon.ChevronLeft
        OnSelect: =Back()
        TabIndex: =0
        Width: =icongconfig_backbutton.Width
        X: =10.5*Value(lbconfig_resolution_factor.Text)
        Y: =(scr02_hdr_TopHeader.Height-Self.Height)/2
        ZIndex: =10

    cmp02_ConfirmationDialog_HeaderExpense As cmp02_ConfirmationDialog:
        controlName: ="cmp02_ConfirmationDialog_1"
        LegalEntity: =Text(varSelectedLegalEntity)
        OnLeftButtonClick: =true
        OnRightButtonClick: ="텍스트"
        parmInDescriptionText: |-
            =If(
                varChangeCalled,
                GlobalLabels.Labels.'15062:LocalizedName,msdyn_ConfirmReceiptChangeLabel',
                GlobalLabels.Labels.'15062:LocalizedName,msdyn_DetachReceiptConfirmationTextLabel'
            )
        parmInHeaderText: |-
            =If(
                varChangeCalled,
                Concatenate(GlobalLabels.Labels.'15062:LocalizedName,msdyn_ReceiptChangeLabel',"?"),
                GlobalLabels.Labels.'15062:LocalizedName,msdyn_DetachSelectedReceiptHeaderLabel'
            )
        parmInLeftButtonColor: =RGBA(34, 102, 227, 1)
        parmInLeftButtonText: |-
            =GlobalLabels.Labels.'15062:LocalizedName,msdyn_CancelLabel'
        parmInRightButtonColor: =RGBA(195, 39, 39, 1)
        parmInRightButtonText: |-
            =GlobalLabels.Labels.'15062:LocalizedName,msdyn_DetachLabel'
        returnFocus: ="scr06_lbl_Detach"
        SelectedExpense: |
            =varSelectedExpenseDoc.'Expense transaction number (mserp_exptransnumber)'
        SelectedReceiptNumber: =Text(varSelectedExpenseDoc.AttachedReceiptId)
        Visible: =varCntShowConfirmationDialog
        Y: =0
        ZIndex: =11

    cmp02_ConfirmationDialog_Itemized As cmp02_ConfirmationDialog:
        controlName: ="cmp02_ConfirmationDialog_1"
        LegalEntity: =Text(varSelectedLegalEntity)
        OnLeftButtonClick: =true
        OnRightButtonClick: ="텍스트"
        parmInDescriptionText: |-
            =If(
                varChangeCalled,
                GlobalLabels.Labels.'15062:LocalizedName,msdyn_ConfirmReceiptChangeLabel',
                GlobalLabels.Labels.'15062:LocalizedName,msdyn_DetachReceiptConfirmationTextLabel'
            )
        parmInHeaderText: |-
            =If(
                varChangeCalled,
                Concatenate(GlobalLabels.Labels.'15062:LocalizedName,msdyn_ReceiptChangeLabel',"?"),
                GlobalLabels.Labels.'15062:LocalizedName,msdyn_DetachSelectedReceiptHeaderLabel'
            )
        parmInLeftButtonColor: =RGBA(34, 102, 227, 1)
        parmInLeftButtonText: |-
            =GlobalLabels.Labels.'15062:LocalizedName,msdyn_CancelLabel'
        parmInRightButtonColor: =RGBA(195, 39, 39, 1)
        parmInRightButtonText: |-
            =GlobalLabels.Labels.'15062:LocalizedName,msdyn_DetachLabel'
        returnFocus: ="scr06_lbl_Detach"
        SelectedExpense: |
            =varSelectedItemizedExpenseDoc.'Expense transaction number (mserp_exptransnumber)'
        SelectedReceiptNumber: =Text(varSelectedItemizedExpenseDoc.AttachedReceiptId)
        Visible: =varCntShowConfirmationDialogItemize
        Y: =0
        ZIndex: =12

    RotateImageButton_Expenses As image:
        AccessibleLabel: ="Image rotated clockwise 90 degree"
        Fill: |
            =RGBA(37, 36, 35, 0.5)
        Height: =App.Height * 0.055
        Image: =RotateReceiptIcon
        OnSelect: |-
            =Switch(varRotateImage,
                   ImageRotation.None, UpdateContext({varRotateImage:ImageRotation.Rotate90}),
                   ImageRotation.Rotate90, UpdateContext({varRotateImage:ImageRotation.Rotate180}),
                   ImageRotation.Rotate180, UpdateContext({varRotateImage:ImageRotation.Rotate270}),
                   ImageRotation.Rotate270, UpdateContext({varRotateImage:ImageRotation.None}),
                   UpdateContext({varRotateImage:ImageRotation.None})
            )
        RadiusBottomLeft: |-
            =If(
                App.Width > App.Height,
                App.Width * 0.05,
                App.Height * 0.0274
            )
        RadiusBottomRight: =Self.RadiusBottomLeft
        RadiusTopLeft: =Self.RadiusBottomLeft
        RadiusTopRight: =Self.RadiusBottomLeft
        TabIndex: =0
        Width: |
            =If(App.Width > App.Height,
            App.Width * 0.12,
            App.Width * 0.37
            )
        X: =40
        Y: =scr06_img_Receipt.Y + scr06_img_Receipt.Height * 5/6
        ZIndex: =13

