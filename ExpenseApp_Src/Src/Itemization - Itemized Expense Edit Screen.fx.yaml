"'Itemization - Itemized Expense Edit Screen' As screen":
    Fill: =RGBA(244, 244, 244, 1)
    OnVisible: |-
        =UpdateContext({varStateSelected : Blank()});
        UpdateContext({varZipCodeSelectedRecId : -1 });
        UpdateContext({varProjectHierarchyId: Blank()});
        Set(varNavigateFromExpense , Blank());
        UpdateContext({onReloadButtonClick : false});
        // 3-level category selection variables
        UpdateContext({varSelectedDepartment: Blank()});
        UpdateContext({varSelectedBenefitType: Blank()});
        UpdateContext({curCategory : ComboBox1_9.Selected.'Expense category'});
        // Load existing Department and Benefit Type from Expense Category (reverse lookup)
        If(
            !varIsCreate && !IsBlank(varSelectedItemizedExpenseDoc.'Expense category (mserp_costtype)'),
            With(
                {
                    mappingRecord: LookUp(
                        'DCSL Expense Category Mapping Setup Entity (mserp)',
                        mserp_expensecategory = varSelectedItemizedExpenseDoc.'Expense category (mserp_costtype)'
                    )
                },
                If(
                    !IsBlank(mappingRecord),
                    UpdateContext({
                        varSelectedDepartment: mappingRecord.mserp_department
                    });
                    UpdateContext({
                        varSelectedBenefitType: mappingRecord.mserp_benefittype
                    })
                )
            )
        );
        UpdateContext({curInterCompanyProjectCategoryItemization : ComboBox1_51.Selected.'Expense category'});
        UpdateContext({curIntercompanyLE:varSelectedItemizedExpenseDoc.'Legal entity'});
        UpdateContext({curProjIdSelected : varSelectedItemizedExpenseDoc.'Project ID'});
        UpdateContext({curCountrySelected : varSelectedItemizedExpenseDoc.'Country/region (mserp_countryregion)'});
        UpdateContext({curStateSelected : varSelectedItemizedExpenseDoc.'State/province'});
        UpdateContext({curBillIssuedToSelected : varSelectedItemizedExpenseDoc.'Hotel bill issued to'});
        UpdateContext({taxModifiedByUser : false});
        
        // populate the current expense type of the selected document
        UpdateContext({currExpenseType:Coalesce(varSelectedItemizedExpenseDoc.'Expense type',LookUp('Expense category (mserp)','Expense category' = ComboBox1_9.Selected.'Expense category', 'Expense type'))});
        If(
            !varIsCreate,
            UpdateContext({msCallStartedForSalestaxCalculation : true});
            UpdateContext({varOnShowFields : false});
            UpdateContext({varOnSelectTriggered : false});
            UpdateContext({varOnChangeTriggered : false}); 
        );
        UpdateContext(
            {
                featureEnabled :
                If(userRecord.IsReimaginedUIEnabled = 'NoYes (mserp)'.Yes, "True", "False")
            }
        ); 
        //if labelTableLookUp not empty
        If(
            CountRows(labelTableLookUp) <= 0,
            Collect(
                labelTableLookUp,
                {
                    fieldName : "CostType",
                    labelName : "Expense category",
                    localisedLabelName : GlobalLabels.Labels.'15062:LocalizedName,msdyn_ExpenseCategoryLabel',
                    visible : true,
                    required : true
                },
                {
                    fieldName : "TransDate",
                    labelName : "Transaction date",
                    localisedLabelName : GlobalLabels.Labels.'15062:LocalizedName,msdyn_TransactionDateLabel',
                    visible : true,
                    required : true
                },
                {
                    fieldName : "AmountCurr",
                    labelName : "Transaction amount",
                    localisedLabelName : GlobalLabels.Labels.'15062:LocalizedName,msdyn_TransactionAmountLabel',
                    visible : true,
                    required : true
                },
                {
                    fieldName : "ExchangeCode",
                    labelName : "Currency",
                    localisedLabelName : GlobalLabels.Labels.'15062:LocalizedName,msdyn_CurrencyLabel',
                    visible : true,
                    required : true
                },
                {
                    fieldName : "PayMethod",
                    labelName : "Payment method",
                    localisedLabelName : GlobalLabels.Labels.'15062:LocalizedName,msdyn_PaymentMethodLabel',
                    visible : true,
                    required : true
                },
                {
                    fieldName : "SubmitterJustification",
                    labelName : "Employee justification",
                    localisedLabelName : GlobalLabels.Labels.'15062:LocalizedName,msdyn_EmployeeJustificationLabel',
                    visible : false,
                    required : false
                }
            );
            ForAll(
                Filter('@ExpenseManagement:ExpenseMobileFieldVisibilityEntity (mserp)',LegalEntityId = varSelectedLegalEntity) As VisibilityTable,
                Collect(
                    labelTableLookUp,
                    {
                        fieldName : VisibilityTable.FieldName,
                        labelName : VisibilityTable.Labels,
                        localisedLabelName : VisibilityTable.LocalisedLabelName
                    }
                )
            );
            If(
                featureEnabled = "True",
                ForAll(
                    Filter('@ExpenseManagement:ExpenseMobileFieldVisibilityEntity (mserp)',LegalEntityId = varSelectedLegalEntity) As VisibilityTable,
                    Patch(
                        labelTableLookUp,
                        LookUp(labelTableLookUp,fieldName = VisibilityTable.FieldName),
                        {
                            visible : VisibilityTable.VisibilityType <> 'ExpenseFieldVisibilityType (mserp)'.'Do not display',
                            required : VisibilityTable.VisibilityType = 'ExpenseFieldVisibilityType (mserp)'.Required
                        }
                    )
                ),
                ForAll(
                    Filter('Display fields (mserp)', 'Company Code' = varSelectedLegalEntity) As VisibilityTable,
                    Patch(
                        labelTableLookUp,
                        LookUp(labelTableLookUp,fieldName = VisibilityTable.FieldName),
                        {
                            visible : VisibilityTable.Visibility <> 'Visibility (mserp)'.'Do not display',
                            required : false
                        }
                    )
                )
           
            )
        );
        If(
            !IsBlank(curProjIdSelected),
            UpdateContext({
            varProjectHierarchyId :
            'Projects (mserp)'.mserp_trvexpmobileprojentity_getprojecthierarchyid(userRecord.'Expense mobile master data (mserp)',
                {
                    interCompanyLegalEntity: curIntercompanyLE,
                    projId: curProjIdSelected
                }
            ).return
        })
        );
        Set(
            varDefaultSalesTaxGroup,
            varSelectedItemizedExpenseDoc.'Sales tax group'
        );
        Set(
            varItemSalesTaxDefaultValue,
            varSelectedItemizedExpenseDoc.'Item sales tax group'
        );
        UpdateContext({
            varSalesTaxAmount : 
            Coalesce(varSalesTaxAmount, varSelectedItemizedExpenseDoc.'Actual sales tax amount')
        });
        UpdateContext({msCallStartedForSalestaxCalculation : false});
        Set(
            IsreceiptALreadyCreated, 
            false
        );
        Set(
            isProjIdCalledFromAttach, 
            false
        );
        Set(
            gblParams,
            {
                dropDownHeight : 60,
                dorpDownBorderThickness : 2,
                dropDownBorderColor : RGBA(34, 102, 227, 1),
                dropDownLabelColor : Color.Black,
                dropDownHoverFill : RGBA(204, 222, 255, 1),
                errorMessageSize : 18,
                dropDownFontSize : 24,
                expenseDataCardViewOnly: RGBA(110, 110, 110, 1),
                notificationTime : 4000
            }
        );
        //varibale determines whether any fields were changed
        UpdateContext({isDirty : false});
        
        //UpdateContext({curIntercompanyLE : ""});
        UpdateContext({categoryModified : false});
        UpdateContext({varDefaultItemSalesTaxError : Blank()});
        UpdateContext({varDefaultSalesTaxError : Blank()});
        UpdateContext({leModified : false});
        UpdateContext({varRatePerMile : Blank()});
        UpdateContext({varMileageTotal : Blank()});
        UpdateContext({varCurrentSelectedDate : 
        If(
            varIsCreate,
            If(
                IsBlank(OCRresponse),
                Today(),
                OCRresponse.transDate
            ),
            varSelectedItemizedExpenseDoc.'Transaction date'
        )
        });
        Set(
            varDefaultSalesTaxGroup,
            varSelectedItemizedExpenseDoc.'Sales tax group'
        );
        Set(
            varItemSalesTaxDefaultValue,
            varSelectedItemizedExpenseDoc.'Item sales tax group'
        );
        UpdateContext({
            varSalesTaxAmount : 
            Coalesce(varSalesTaxAmount, varSelectedItemizedExpenseDoc.'Actual sales tax amount')
        });
        Set(varCurMileage , varSelectedItemizedExpenseDoc.Mileage);
        UpdateContext({varCurVehicleType : varSelectedItemizedExpenseDoc.'Vehicle type'});
        UpdateContext({varCurNoOfPass : varSelectedItemizedExpenseDoc.'Number of passengers'});
        UpdateContext({varDefaultProjLineStatus : varSelectedItemizedExpenseDoc.Billable});
        UpdateContext({varZipCodeChanged : false});
        UpdateContext({varCityChanged : false});
        UpdateContext({varStateChanged : false});
        UpdateContext({varCountryChanged : false});
        UpdateContext({varProjectChanged : false});

    scr03_ico_Back_5 As icon.ChevronLeft:
        Color: =icongconfig_backbutton.Color
        Fill: =icongconfig_backbutton.Fill
        Height: =icongconfig_backbutton.Height
        Icon: =Icon.ChevronLeft
        OnSelect: |-
            =
            Switch(
                varNavigatedFrom,
                "scr17",
                Navigate('Reports - Edit Screen'),
                "scr20",
                Navigate('Reports - View Only Screen'),
                "scr18",
                Navigate('Reports - Attach Expenses Screen'),
                "scr19",
                Navigate('Reports - View Attached Expenses Screen'),
                Blank(),
                Navigate('Expenses - List Screen')
            );
            UpdateContext({
                varNavigatedFrom:
                Blank()
            });
            UpdateContext(
                {
                    dirtyTransAmount : Blank(),
                    dirtyTransDate : Blank(),
                    dirtyMerchant : Blank(),    
                    varOnSelectTriggered: false,
                    varOnShowFields:false,
                    varOnChangeTriggered:false,
                    varSalesTaxAmount: Blank()
                }
            );
        Visible: =false
        Width: =icongconfig_backbutton.Width
        X: =383
        Y: =99
        ZIndex: =4

    scr03_img_NoReceiptOuter_2 As image:
        BorderColor: =RGBA(255, 0, 37, 0.2)
        BorderStyle: =BorderStyle.Dashed
        Fill: =RGBA(255, 255, 255, 1)
        Height: =Parent.Height / 4
        Image: =varReceiptImage
        ImagePosition: =ImagePosition.Stretch
        RadiusBottomLeft: =18
        RadiusBottomRight: =18
        RadiusTopLeft: =18
        RadiusTopRight: =18
        Visible: =!IsBlank(varReceiptImage)
        Width: |
            =Parent.Width -  Self.X*2
        X: =24
        Y: |-
            =If(
                scr03_lbl_PolicyViolationWarning_2.Visible,
                scr03_lbl_PolicyViolationWarning_2.Y + scr03_lbl_PolicyViolationWarning_2.Height + 27 + ItemizedExpenseBackground.Height ,
                scr03_lbl_ValidationWarning_2.Y + scr03_lbl_ValidationWarning_2.Height + 27 + ItemizedExpenseBackground.Height
            )
        ZIndex: =5

    scr03_img_NoReceiptInner_2 As image:
        BorderColor: =RGBA(166, 166, 166, 1)
        BorderStyle: =BorderStyle.Dashed
        BorderThickness: =5
        Fill: =RGBA(255, 255, 255, 1)
        Height: =Parent.Height/5
        Image: =ImgWhite
        ImagePosition: =ImagePosition.Fill
        RadiusBottomLeft: =8
        RadiusBottomRight: =8
        RadiusTopLeft: =8
        RadiusTopRight: =8
        Visible: =IsBlank(varReceiptImage) 
        Width: |
            =Parent.Width -  Self.X*2
        X: =44
        Y: =scr03_img_NoReceiptOuter_2.Y +(scr03_img_NoReceiptOuter_2.Height-scr03_img_NoReceiptInner_2.Height)/2
        ZIndex: =6

    scr03_lbl_AddReceipt_2 As label:
        Align: =Align.Center
        Color: =RGBA(34, 102, 227, 1)
        Font: =Font.'Segoe UI'
        FontWeight: =FontWeight.Semibold
        Height: =Parent.Height / 4
        OnSelect: |-
            =Navigate('Expenses - Capture Receipt Screen', ScreenTransition.None);
            UpdateContext(
                {
                    varOnSelectTriggered: false,
                    varOnShowFields:false,
                    varOnChangeTriggered:false
                }
            );
            Set(varNavigateFromExpense , "NavigatedFromItemizedEditExpense");
        Size: =21
        TabIndex: =0
        Text: |-
            =GlobalLabels.Labels.'15062:LocalizedName,msdyn_AddReceiptLabel'
        Visible: =IsBlank(varReceiptImage) 
        Width: |
            =Parent.Width -  Self.X*2
        X: =26
        Y: =scr03_img_NoReceiptOuter_2.Y
        ZIndex: =7

    scr03_lbl_ChangeReceipt_2 As label:
        Color: =scr03_lbl_AddReceipt_2.Color
        Fill: =Color.White
        Height: =70
        OnSelect: |-
            =Navigate('Expenses - View Receipt Screen', ScreenTransition.None, {varViewOnly : false});
            UpdateContext(
                {
                    varOnSelectTriggered: false,
                    varOnShowFields:false,
                    varOnChangeTriggered:false
                }
            );
            Set(varNavigateFromExpense , "NavigatedFromItemizedEditExpense");
        PaddingLeft: =35 + scr03_ico_ViewReceipt_2.Width
        Size: =17
        TabIndex: =0
        Text: |-
            =GlobalLabels.Labels.'15062:LocalizedName,msdyn_ViewReceiptLabel'
        Visible: =!(IsBlank(varReceiptImage))
        Width: =scr03_img_NoReceiptOuter_2.Width+1
        X: =scr03_img_NoReceiptOuter_2.X
        Y: =scr03_img_NoReceiptOuter_2.Y + (scr03_img_NoReceiptOuter_2.Height -Self.Height)+1
        ZIndex: =8

    scr03_ico_ViewReceipt_2 As image:
        AccessibleLabel: ="View receipt"
        Height: =33
        Image: =imageicon
        OnSelect: |-
            =Navigate('Expenses - View Receipt Screen', ScreenTransition.None, {varViewOnly : false, locNavigateItemizedExpense : true});
            UpdateContext(
                {
                    varOnSelectTriggered: false,
                    varOnShowFields:false,
                    varOnChangeTriggered:false
                }
            );
            Set(varNavigateFromExpense , "NavigatedFromItemizedEditExpense");
        TabIndex: =0
        Visible: =!(IsBlank(varReceiptImage))
        Width: =18
        X: =scr03_lbl_ChangeReceipt_2.X + 25
        Y: =scr03_lbl_ChangeReceipt_2.Y + (scr03_lbl_ChangeReceipt_2.Height-scr03_ico_ViewReceipt_2.Height)/2
        ZIndex: =9

    scr03_lbl_ValidationWarning_2 As label:
        Align: =Align.Center
        Color: =RGBA(165, 33, 33, 1)
        Fill: =RGBA(249, 217, 217, 1)
        Font: =Font.'Segoe UI'
        Height: |-
            =If(
                Self.Visible,
                88,
                0
            )
        Size: =15
        Text: |-
            =//If(ctVarIsRequiredFieldEmpty,GlobalLabels.Labels.ValidationMsgExpenseNeedMoreDetails)
            //not having receipt in expense is part of policy violation
        Visible: =//ctVarIsRequiredFieldEmpty //Or ((varSelectedItemizedExpenseDoc.receiptsAttached = "No" Or IsBlank(varSelectedItemizedExpenseDoc)) And IsBlank(varReceiptImage))
        Width: =Parent.Width
        Y: =scr03_hdr_TopHeader_2.Height
        ZIndex: =10

    scr03_hdr_TopHeader_2 As hdr02_Header_5:
        Fill: =scr03_hdr_TopHeader_2.paramFill
        paramFill: =RGBA(255, 255, 255, 1)
        paramTitle: |-
            =GlobalLabels.Labels.'15062:LocalizedName,msdyn_EditItemizedExpenseLabel'
        ZIndex: =11

    scr03_ico_Back_2 As icon.ChevronLeft:
        AccessibleLabel: ="Press to go back"
        Color: =icongconfig_backbutton.Color
        Fill: =icongconfig_backbutton.Fill
        Height: =27
        Icon: =Icon.ChevronLeft
        OnSelect: |-
            =Set(varSelectedReceiptNumber, Blank());
            Set(varReceiptImage,Blank());
            Set(
                    varChangeReceiptItemizedExpense,
                    false
                );
            Navigate('Itemization - View All Itemize Expense Screen')
        TabIndex: =0
        Width: =19
        X: =24
        Y: =31
        ZIndex: =12

    scr03_lbl_PolicyViolationWarning_2 As label:
        Color: |-
            =/*If(
                !IsBlank(varMaxViolationLevel),
                If(
                    Value(varMaxViolationLevel) > 0 && Value(varMaxViolationLevel) <= 2,
                    RGBA(152, 111, 11, 1), //yellow
                    RGBA(217, 44, 44, 1)     //red
                )
            )*/
        Fill: |-
            =If(
                !IsBlank(varMaxViolationLevel),
                If(
                    Value(varMaxViolationLevel) > 0 && Value(varMaxViolationLevel) <= 2,
                    RGBA(255, 242, 195, 1), //yellow  
                    RGBA(249, 217, 217, 1)   //red
                )
            )
        Font: =Font.'Segoe UI'
        Height: |+
            =//If(ctVarIsRequiredFieldEmpty,GlobalLabels.Labels.ValidationMsgExpenseNeedMoreDetails,"Please add a receipt to this expense")
            If(
                CountRows(colPolViolations) > 0,
                88, 0
            )
            
        OnSelect: |-
            =Navigate('Expenses - Policy Violations Screen', ScreenTransition.None, {varCntExpenseTransactionNumber : varSelectedItemizedExpenseDoc.'Expense transaction number (mserp_exptransnumber)'})
        PaddingBottom: =18
        PaddingLeft: =54
        PaddingTop: =18
        Size: =15
        TabIndex: =0
        Text: |
            =Substitute(GlobalLabels.Labels.'15062:LocalizedName,msdyn_PolicyViolationExistsLabel', "$", Text(varNumViolation))
        Visible: =varNumViolation > 0
        Width: |
            =Parent.Width
        Y: =scr03_hdr_TopHeader_2.Height
        ZIndex: =13

    "'Expense Entr Container_1' As groupContainer.verticalAutoLayoutContainer":
        Height: |-
            =If(
                currExpenseType <> 'TrvExpType (mserp)'.Mileage,
                    Value(ButtonBackgroundExpense_1.Y - Self.Y - 10),
                    Value(Parent.Height - Self.Y - 10 - ExpenseInfo_3.Height)
            )
        LayoutDirection: =LayoutDirection.Vertical
        LayoutGridColumns: =6
        LayoutGridRows: =6
        LayoutMode: =LayoutMode.Auto
        LayoutOverflowY: =LayoutOverflow.Scroll
        Width: |
            =Parent.Width
        Y: =scr03_img_NoReceiptOuter_2.Y + scr03_img_NoReceiptOuter_2.Height + 30
        ZIndex: =14

        EditItemizedExpenseForm As form:
            AlignInContainer: =AlignInContainer.SetByContainer
            DataSource: ='Expense lines (mserp)'
            DefaultMode: |-
                =If(
                    varIsCreate,
                    FormMode.New,
                    FormMode.Edit
                )
            Height: |-
                =If(
                    currExpenseType <> 'TrvExpType (mserp)'.Mileage,
                        Value(scr03_btn_Done_2.Y - Self.Y - 10),
                    If(
                        currExpenseType = 'TrvExpType (mserp)'.Mileage,
                        Value(Parent.Height - Self.Y - 10 - ExpenseInfo_3.Height)
                    )
                )
            Item: =varSelectedItemizedExpenseDoc
            LayoutMaxHeight: =
            LayoutMaxWidth: =
            LayoutMinHeight: =250
            LayoutMinWidth: =320
            OnFailure: |-
                =Notify(
                    Last(Split(Text(Self.Error), ":")).Value, 
                    NotificationType.Error, 
                    gblParams.notificationTime
                )
            OnSuccess: |-
                =UpdateContext({varSubmittedExpTransNumber : varSelectedItemizedExpenseDoc.'Expense transaction number (mserp_exptransnumber)'});
                //attach receipt if any
                UpdateContext({varAttachReceiptError : Blank()});
                If(
                    IsBlank(varSelectedItemizedExpenseDoc),
                        If(
                            !IsBlank(varSubmittedExpTransNumber) && !IsBlank(varSelectedReceiptNumber),
                            IfError(
                                Patch(
                                    'Expense Mobile Unattached Document Entity (mserp)',
                                    LookUp('Expense Mobile Unattached Document Entity (mserp)', EntRecId = varSelectedReceiptNumber),
                                    {
                                        ExpTransNumber:varSubmittedExpTransNumber
                                    }
                                ),
                                UpdateContext({varAttachReceiptError : FirstError.Details})
                            );
                            If(
                            !IsBlank(varAttachReceiptError) && !(Text(varAttachReceiptError.HttpStatusCode) = NotFoundStatusCode),
                            Notify(
                                Substitute(
                                    Substitute( Match(varAttachReceiptError.HttpResponse, """message"":""([^""]*)""").FullMatch, 
                                        """message"":", 
                                        ""), """", ""),
                                NotificationType.Error,
                                gblParams.notificationTime
                            ),
                            Notify(
                                GlobalLabels.Labels.'15062:LocalizedName,msdyn_ReceiptAttachedSuccessfullyLabel',
                                NotificationType.Success,
                                gblParams.notificationTime
                            )
                            )       
                        ),
                
                        If(!IsBlank(varSelectedReceiptNumber) && (IsBlank(varSelectedItemizedExpenseDoc.AttachedReceiptId) || Value(varSelectedItemizedExpenseDoc.AttachedReceiptId) <> varSelectedReceiptNumber)              ,
                            IfError(
                                Patch(
                            'Expense Mobile Unattached Document Entity (mserp)',
                           LookUp('Expense Mobile Unattached Document Entity (mserp)', EntRecId = varSelectedReceiptNumber),
                            {
                                ExpTransNumber: varSelectedItemizedExpenseDoc.'Expense transaction number (mserp_exptransnumber)'
                            }
                            ),
                                 UpdateContext({varAttachReceiptError : FirstError.Details})
                            );
                            If(
                                !IsBlank(varAttachReceiptError) && !(Text(varAttachReceiptError.HttpStatusCode) = NotFoundStatusCode),
                                Notify(
                                    Substitute(
                                        Substitute( 
                                            Match(varAttachReceiptError.HttpResponse, """message"":""([^""]*)""").FullMatch, 
                                            """message"":", 
                                            ""
                                        ), """", ""
                                    ),
                                    NotificationType.Error,
                                    gblParams.notificationTime
                                ),
                               Notify(
                                GlobalLabels.Labels.'15062:LocalizedName,msdyn_ReceiptAttachedSuccessfullyLabel',
                                NotificationType.Success,
                                gblParams.notificationTime
                            )
                        )
                )
                );
                //create or update expense
                If(
                    varIsCreate,
                    Notify(
                        GlobalLabels.Labels.'15062:LocalizedName,msdyn_ExpenseCreateMessageLabel',
                        NotificationType.Success,
                        gblParams.notificationTime
                    ),
                    If(
                        isDirty || isExpenseReceiptAttached,
                        Notify(
                            GlobalLabels.Labels.'15062:LocalizedName,msdyn_ExpenseUpdateMessageLabel', 
                            NotificationType.Success,
                            gblParams.notificationTime)   
                    )
                );
                
                If(!IsBlank(EditItemizedExpenseForm.LastSubmit),
                Set(
                    varSelectedItemizedExpenseDoc,
                    EditItemizedExpenseForm.LastSubmit
                )
                );
                
                UpdateContext({varSubmittedExpTransNumber :Blank()});
                Set(
                    varChangeReceiptItemizedExpense,
                    false
                    );
                Set(
                    varIsCreate,
                    false
                );
                Set(
                    isExpenseReceiptAttached,
                    false
                );
                Set(
                    OCRresponse,
                    Blank()
                );
                Set(
                    gblNavigationDrawerVisibility,
                    false
                );
                If(
                    varIsCreate,
                    Navigate('Expenses - List Screen'),
                    If(
                        !IsBlank(varNavigatedFrom),
                        UpdateContext({varExpenseReportNumber : varSelectedReport.'Expense report number'});
                        Set(
                            varSelectedReport,
                            LookUp('Expense reports (mserp)','Expense report number' = varExpenseReportNumber)
                        );
                        Clear(colAttachedExpensesForReport);
                        ForAll(
                            Split(varSelectedReport.ExpTransNumber, ",") As attachedExpenses,
                            Collect(
                                colAttachedExpensesForReport,
                                LookUp('Expense lines (mserp)','Expense transaction number (mserp_exptransnumber)' = attachedExpenses[@Value] && 'Expense line type' <> 'Expense line type (mserp)'.'Itemized line')
                            )
                        );
                        ClearCollect(
                            colAttachedExpenses,
                            colAttachedExpensesForReport
                        )
                    );
                    Navigate('Itemization - View All Itemize Expense Screen',Transition.None,{varNavigatedFrom:varNavigatedFrom})    
                );
                Set(varReceiptImage, Blank());
                Set(varSelectedReceiptNumber, Blank());
                UpdateContext(
                    {
                        dirtyTransAmount:Blank(),
                        dirtyTransDate : Blank(),
                        dirtyMerchant : Blank(),
                        varOnSelectTriggered: false,
                        varOnShowFields:false,
                        varOnChangeTriggered:false,
                        varSalesTaxAmount: Blank(),
                        locItemizeButtonVisibilityFlag: false
                    }
                )
            SnapToColumns: =false
            Width: =Parent.Width
            Y: =scr03_img_NoReceiptOuter_2.Y + scr03_img_NoReceiptOuter_2.Height + 30
            ZIndex: =1

            Itemization_Department_DataCard As typedDataCard.allowedValuesStringEditCard:
                AllowedValues: |-
                    =Distinct(
                        'DCSL Expense Category Mapping Setup Entity (mserp)',
                        mserp_department
                    )
                BorderColor: =gblParams.dropDownBorderColor
                BorderStyle: =BorderStyle.Solid
                DataField: ="mserp_department"
                Default: =varSelectedDepartment
                DisplayMode: =Parent.DisplayMode
                DisplayName: ="Department"
                Fill: =RGBA(0, 0, 0, 0)
                Height: =50
                Required: =false
                Update: =Itemization_ComboBox_Department.Selected.mserp_department
                Visible: =true
                Width: =Parent.Width
                X: =1
                Y: =expenseCategoryFieldOrder_Y - 120
                ZIndex: =1

                Itemization_Department_DataCardKey As label:
                    AutoHeight: =true
                    BorderColor: =RGBA(0, 0, 0, 1)
                    Color: =gblParams.dropDownLabelColor
                    FocusedBorderThickness: =
                    Font: =Font.'Segoe UI'
                    Height: =48
                    Size: =21
                    Text: =Parent.DisplayName
                    Width: =Parent.Width - 60
                    Wrap: =false
                    X: =30
                    Y: =10
                    ZIndex: =1

                Itemization_ComboBox_Department As combobox:
                    AccessibleLabel: =Concatenate("Select ", Parent.DisplayName)
                    BorderColor: =If(IsBlank(Parent.Error), Parent.BorderColor, Color.Red)
                    BorderThickness: =If(Parent.Error, gblParams.dorpDownBorderThickness, 0)
                    DefaultSelectedItems: |-
                        =If(
                            !IsBlank(varSelectedDepartment),
                            LookUp(
                                Distinct('DCSL Expense Category Mapping Setup Entity (mserp)', mserp_department),
                                mserp_department = varSelectedDepartment
                            ),
                            []
                        )
                    DisplayFields: =["mserp_department"]
                    FocusedBorderThickness: =2
