    ExpenseInfo_3 As ExpenseInfo_2:
        Amount1: |-
            =
            If(IsBlank(
            If(
                IsBlank(varRatePerMile),
                Text(Value(varSelectedItemizedExpenseDoc.'Rate per mile'), "#,#0.000", varDefaultLanguage),
                Text(Value(varRatePerMile), "#,#0.000", varDefaultLanguage)
            )),
            Text(Value(0.00), "#,#0.000", varDefaultLanguage),
            If(
                IsBlank(varRatePerMile),
                Text(Value(varSelectedItemizedExpenseDoc.'Rate per mile'), "#,#0.000", varDefaultLanguage),
                Text(Value(varRatePerMile), "#,#0.000", varDefaultLanguage)
            )
            )
        Amount2: |-
            =
            If(IsBlank(
            If(
                IsBlank(varMileageTotal),
                Text(Value(varSelectedItemizedExpenseDoc.'Transaction amount'), "#,#0.00", varDefaultLanguage),
                Text(Value(varMileageTotal), "#,#0.00", varDefaultLanguage)
            )),
            Text(Value(0.00), "#,#0.00", varDefaultLanguage),
            If(
                IsBlank(varMileageTotal),
                Text(Value(varSelectedItemizedExpenseDoc.'Transaction amount'), "#,#0.00", varDefaultLanguage),
                Text(Value(varMileageTotal), "#,#0.00", varDefaultLanguage)
            )
            )
        CostType: =curCategory
        Currency1: =varDefaultCurrency
        Currency2: =varDefaultCurrency
        HeaderText1: |-
            =GlobalLabels.Labels.'15062:LocalizedName,msdyn_RatePerMileLabel'
        HeaderText2: |-
            =GlobalLabels.Labels.'15062:LocalizedName,msdyn_TotalLabel'
        Height: =250
        IconVisibleFlag: =ComboBox1_9.Selected.'Expense type' = 'TrvExpType (mserp)'.Mileage && !IsBlank(DataCardValue40_1.Text)
        Mileage: =varCurMileage
        NoOfPassengers: =varCurNoOfPass
        OnReload: |-
            =UpdateContext({onReloadButtonClick : true});
            UpdateContext({msCallStartedForSalestaxCalculation : true});
            Set(varCollectCacheV2,
            'Expense mobile master data (mserp)'.mserp_calckm(If(IsBlank(ExpenseInfo_3.RowId),"",ExpenseInfo_3.RowId),
                    {
                        TransDate: If(IsBlank(DatePickerCanvas1_26.SelectedDate),"",Text(DateTimeValue(DatePickerCanvas1_26.SelectedDate),"yyyy-mm-dd hh:mm:ssZ")),
                        CostType: If(IsBlank(ComboBox1_9.Selected.'Expense category'),"",ComboBox1_9.Selected.'Expense category'),
                        KmOwnCar: If(IsBlank(DataCardValue40_1.Text),0,DataCardValue40_1.Text),
                        VehicleType: If(IsBlank(VehicleTypeCombobox_1.Selected.Value),"",VehicleTypeCombobox_1.Selected.Value),
                        NumberOfPassengers: If(IsBlank(DataCardValue63_1.Text),0,DataCardValue63_1.Text)
                    }
                    )
            );
            
            UpdateContext({varRatePerMile : Text(ParseJSON(varCollectCacheV2.return).KMPrice)});
            UpdateContext({varMileageTotal : Text(ParseJSON(varCollectCacheV2.return).AmountMST)});
            If(
                !IsBlank(Text(ParseJSON(varCollectCacheV2.return).Warnings)),
                Notify(
                    Text(ParseJSON(varCollectCacheV2.return).Warnings),
                    NotificationType.Warning,
                    gblParams.notificationTime
                )
            );
            If(!IsBlank(ComboBox1_45.Selected) && !IsBlank(ComboBox1_46.Selected),
            UpdateContext({taxModifiedByUser:false});
            
            UpdateContext({
                varSalesTaxAmount : 
                IfError(
                Value('Expense mobile master data (mserp)'.mserp_getactualsalestaxamount(
                    LookUp('Expense mobile master data (mserp)',Email = User().Email,'Expense mobile master data (mserp)'),
                    {
                        TaxGroup : If(IsBlank(ComboBox1_45.Selected.'Sales tax group'), "", ComboBox1_45.Selected.'Sales tax group'),
                        TaxItemGroup : If(IsBlank(ComboBox1_46.Selected.'Item sales tax group'), "", ComboBox1_46.Selected.'Item sales tax group'),
                        ExchangeCode : If(IsBlank(ComboBox1_42.Selected.mserp_currencycode), "", ComboBox1_42.Selected.mserp_currencycode),
                        TransDate : If(IsBlank(Text(DateValue1_24.SelectedDate, "yyyy-mm-dd HH:mm:ssZ")), "", Text(DateValue1_24.SelectedDate, "yyyy-mm-dd HH:mm:ssZ")),
                        AmountCurr : Text(Value(If(IsBlank(DataCardValue4_4.Text), "0", DataCardValue4_4.Text),varDefaultLanguage), "#,#0.00","en-US"),
                        LegalEntity : If(IsBlank(DataCardValue39_4.Selected.Value),"",Text(DataCardValue39_4.Selected.Value)),
                        TaxIncluded : If('Tax included_DataCard1_4'.Visible,If(Toggle1_4.Value, "Yes", "No"),If(LookUp('Expense management parameters (mserp)','Company Code'=varDefaultLegalEntity,'Tax included')='NoYes (mserp)'.Yes,"Yes", "No"))
                    }
                ).return,"en-US"),
                UpdateContext({
                    varErrorActualTaxCal : 
                    Substitute(
                Match(
                    FirstError.Details.HttpResponse,
                    """message"":""([^""]*)"""
                ).FullMatch,
                """message"":""",
                ""
            )      
                })
                )
            });
            If(!IsBlank(varErrorActualTaxCal),
            Notify(
                Left(varErrorActualTaxCal,Len(varErrorActualTaxCal)-1),
                NotificationType.Error,
                gblParams.notificationTime
            )
            )
            );
            UpdateContext({msCallStartedForSalestaxCalculation : false})
        RowId: =LookUp('Expense mobile master data (mserp)',Email = User().Email,'Expense mobile master data (mserp)')
        TransactionDate: =varCurrentSelectedDate
        VehicleType: =varCurVehicleType
        Visible: =false
        Y: =(Parent.Height - Self.Height)
        ZIndex: =18

