            );
            If(!IsBlank(ComboBox1_75.Selected) && !IsBlank(ComboBox1_76.Selected),
            UpdateContext({taxModifiedByUser:false});
            
            UpdateContext({
                varSalesTaxAmount : 
                IfError(
                Value('Expense mobile master data (mserp)'.mserp_getactualsalestaxamount(
                    LookUp('Expense mobile master data (mserp)',Email = User().Email,'Expense mobile master data (mserp)'),
                    {
                        TaxGroup : If(IsBlank(ComboBox1_75.Selected.'Sales tax group'), "", ComboBox1_75.Selected.'Sales tax group'),
                        TaxItemGroup : If(IsBlank(ComboBox1_76.Selected.'Item sales tax group'), "", ComboBox1_76.Selected.'Item sales tax group'),
                        ExchangeCode : If(IsBlank(ComboBox1_72.Selected.mserp_currencycode), "", ComboBox1_72.Selected.mserp_currencycode),
