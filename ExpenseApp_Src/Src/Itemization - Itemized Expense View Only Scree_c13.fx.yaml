                        AmountCurr : If(IsBlank(DataCardValue4_7.Text), "0", DataCardValue4_7.Text),
                        LegalEntity : If(IsBlank(DataCardValue39_7.Selected.Value),"",Text(DataCardValue39_7.Selected.Value)),
                        TaxIncluded : If('Tax included_DataCard1_7'.Visible,If(Toggle1_7.Value, "Yes", "No"),If(LookUp('Expense management parameters (mserp)','Company Code'=varDefaultLegalEntity,'Tax included')='NoYes (mserp)'.Yes,"Yes", "No"))
                    }
                ).return),
                UpdateContext({
                    varErrorActualTaxCal : 
                    Substitute(
                Match(
                    FirstError.Details.HttpResponse,
                    """message"":""([^""]*)"""
                ).FullMatch,
                """message"":""",
                ""
            )      
                })
                )
            });
            If(!IsBlank(varErrorActualTaxCal),
            Notify(
                Left(varErrorActualTaxCal,Len(varErrorActualTaxCal)-1),
                NotificationType.Error,
                gblParams.notificationTime
            )
            )
            );
            UpdateContext({msCallStartedForSalestaxCalculation : false})
