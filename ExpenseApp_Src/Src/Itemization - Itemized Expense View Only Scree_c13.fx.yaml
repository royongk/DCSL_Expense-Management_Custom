                    BorderThickness: =0
                    Color: =
                    Default: |-
                        =If(
                            varIsCreate,
                            varSelectedLegalEntity,
                            Parent.Default
                        )
                    DisplayMode: =Parent.DisplayMode
                    FocusedBorderThickness: =
                    Height: =gblParams.dropDownHeight
                    HoverFill: =gblParams.dropDownHoverFill
                    Items: =collectionICLE
                    OnChange: |-
                        =UpdateContext({isDirty : true});
                        If(
                            Self.Selected.Value <> curIntercompanyLE,
                            Reset(ComboBox1_73); //project
                            Reset(ComboBox1_75); //sales tax
                            Reset(ComboBox1_76); //item sales tax
                            Reset(ComboBox1_74); // activity
                            Reset(ComboBox4_7); // Biilable
                            //Clear(collectionActivities); // clearing activity number collection
                            UpdateContext({varSalesTaxAmount:0});
                            Reset(DataCardValue25_7); //actual sales tax
                            Reset(DataCardValue9_7); //line status
                            Reset(DataCardValue19_7); //hotel bill issued to 
                            Reset(ComboBox1_81); //intercompany category
                            UpdateContext({curIntercompanyLE:Self.Selected.Value});
                            UpdateContext({leModified : true});
                            UpdateContext({msCallStartedForSalestaxCalculation : true});
                        Set(
                            varDefaultSalesTaxGroup,
                            Blank()
                        );
                        
                        Set(
                            varDefaultSalesTaxGroup, 
                            IfError(
                            'Expense mobile master data (mserp)'.mserp_getdefaultsalestaxvalue(
                            LookUp('Expense mobile master data (mserp)',Email = User().Email,'Expense mobile master data (mserp)'),
                            {
                                IntercompanyLE : If(IsBlank(DataCardValue39_7.Selected.Value),"",DataCardValue39_7.Selected.Value),
                                CountryRegion : If(IsBlank(ComboBox1_77.Selected.Code),"",ComboBox1_77.Selected.Code),
                                AddressState : If(IsBlank(ComboBox1_78.Selected.State),"",ComboBox1_78.Selected.State),
                                ProjId : If(IsBlank(ComboBox1_73.Selected.'Project ID'),"",ComboBox1_73.Selected.'Project ID'),
                                TrvExpTableRecId :  ""
                            }
                        ).return,
                            UpdateContext({
                                varDefaultSalesTaxError : 
                                Substitute(
                            Match(
                                FirstError.Details.HttpResponse,
                                """message"":""([^""]*)"""
                            ).FullMatch,
                            """message"":""",
                            ""
                        )      
                            })
                            )
                        );
                        If(!IsBlank(varDefaultSalesTaxError),
                        Notify(
                            Left(varDefaultSalesTaxError,Len(varDefaultSalesTaxError)-1),
                            NotificationType.Error,
                            gblParams.notificationTime
                        )
                        );
                        
                        Set(
                            varItemSalesTaxDefaultValue, 
                            IfError(
                            'Expense mobile master data (mserp)'.mserp_getdefaultitemsalestax(
                            LookUp('Expense mobile master data (mserp)',Email = User().Email,'Expense mobile master data (mserp)'),
                            {
                                SubCategoryRecId : "",
                                IntercompanyLE : If(IsBlank(DataCardValue39_7.Selected.Value),"",DataCardValue39_7.Selected.Value),
                                BillIssuedTo : If(IsBlank(DataCardValue19_7.Selected.Value),"",DataCardValue19_7.Selected.Value),
                                LineType : "Default",
                                SplitLineType : "",
                                ParentRecId : "",
                                CostType : If(IsBlank(ComboBox1_11.Selected.'Expense category'),"",ComboBox1_11.Selected.'Expense category')
                            }
                        ).return,
                            UpdateContext({
                                varDefaultItemSalesTaxError : 
                                Substitute(
                            Match(
                                FirstError.Details.HttpResponse,
                                """message"":""([^""]*)"""
                            ).FullMatch,
                            """message"":""",
                            ""
                        )      
                            })
                            )
                        );
                        If(!IsBlank(varDefaultItemSalesTaxError),
                        Notify(
                            Left(varDefaultItemSalesTaxError,Len(varDefaultItemSalesTaxError)-1),
                            NotificationType.Error,
                            gblParams.notificationTime
                        )
                        );
                        
                        If(
                            !(IsBlank(ComboBox1_75.Selected.'Sales tax group') || IsBlank(ComboBox1_76.Selected.'Item sales tax group') || IsBlank(ComboBox1_72.Selected.mserp_currencycode) || IsBlank(Text(DateValue1_36.SelectedDate, "yyyy-mm-dd HH:mm:ssZ")) || IsBlank(DataCardValue4_7.Text) || IsBlank(DataCardValue39_7.Selected.Value)),
                            UpdateContext({
                                varSalesTaxAmount : 
                                IfError(
                                Value('Expense mobile master data (mserp)'.mserp_getactualsalestaxamount(
                                    LookUp('Expense mobile master data (mserp)',Email = User().Email,'Expense mobile master data (mserp)'),
                                    {
                                        TaxGroup : If(IsBlank(ComboBox1_75.Selected.'Sales tax group'), "", ComboBox1_75.Selected.'Sales tax group'),
                                        TaxItemGroup : If(IsBlank(ComboBox1_76.Selected.'Item sales tax group'), "", ComboBox1_76.Selected.'Item sales tax group'),
                                        ExchangeCode : If(IsBlank(ComboBox1_72.Selected.mserp_currencycode), "", ComboBox1_72.Selected.mserp_currencycode),
                                        TransDate : If(IsBlank(Text(DateValue1_36.SelectedDate, "yyyy-mm-dd HH:mm:ssZ")), "", Text(DateValue1_36.SelectedDate, "yyyy-mm-dd HH:mm:ssZ")),
                                        AmountCurr : If(IsBlank(DataCardValue4_7.Text), "0", DataCardValue4_7.Text),
                                        LegalEntity : If(IsBlank(DataCardValue39_7.Selected.Value),"",Text(DataCardValue39_7.Selected.Value)),
                                        TaxIncluded : If('Tax included_DataCard1_7'.Visible,If(Toggle1_7.Value, "Yes", "No"),If(LookUp('Expense management parameters (mserp)','Company Code'=varDefaultLegalEntity,'Tax included')='NoYes (mserp)'.Yes,"Yes", "No"))
                                    }
                                ).return),
                                UpdateContext({
                                    varErrorActualTaxCal : 
                                    Substitute(
                                        Match(
                                            FirstError.Details.HttpResponse,
                                            """message"":""([^""]*)"""
                                        ).FullMatch,
                                        """message"":""",
                                        ""
                                    )      
