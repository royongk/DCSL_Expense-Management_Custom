                                FirstError.Details.HttpResponse,
                                """message"":""([^""]*)"""
                            ).FullMatch,
                            """message"":""",
                            ""
                        )      
                            })
                            )
                        );
                        If(!IsBlank(varDefaultItemSalesTaxError),
                        Notify(
                            Left(varDefaultItemSalesTaxError,Len(varDefaultItemSalesTaxError)-1),
                            NotificationType.Error,
                            gblParams.notificationTime
                        )
                        );
                        If(
                            !(IsBlank(ComboBox1_65.Selected.'Sales tax group') || IsBlank(ComboBox1_66.Selected.'Item sales tax group') || IsBlank(ComboBox1_62.Selected.mserp_currencycode) || IsBlank(Text(DateValue1_35.SelectedDate, "yyyy-mm-dd HH:mm:ssZ")) || IsBlank(DataCardValue4_6.Text) || IsBlank(DataCardValue39_6.Selected.Value)),
                            UpdateContext({
                                varSalesTaxAmount : 
