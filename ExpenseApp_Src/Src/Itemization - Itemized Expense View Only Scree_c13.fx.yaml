                            Reset(ComboBox1_64); //remove activity
                            Reset(ComboBox1_65); //sales tax
                            Reset(ComboBox1_66); //item sales tax
                            UpdateContext({varSalesTaxAmount:0});
                            Reset(DataCardValue25_6); //actual sales tax amount
                            Set(
                                varItemSalesTaxDefaultValue,
                                Blank()
                            );
                            If(Self.Selected.'Expense type' = 'TrvExpType (mserp)'.Mileage,
                                Set(varCollectCacheV23,
