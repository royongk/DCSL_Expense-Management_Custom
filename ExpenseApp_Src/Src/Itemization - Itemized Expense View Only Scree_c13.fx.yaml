                                    TransDate: If(IsBlank(DatePickerCanvas1_37.SelectedDate),"",Text(DateTimeValue(DatePickerCanvas1_37.SelectedDate),"yyyy-mm-dd hh:mm:ssZ")),
                                    CostType: If(IsBlank(ComboBox1_10.Selected.'Expense category'),"",ComboBox1_10.Selected.'Expense category'),
                                    KmOwnCar: If(IsBlank(DataCardValue40_2.Text),0,DataCardValue40_2.Text),
                                    VehicleType: If(IsBlank(VehicleTypeCombobox_2.Selected.Value),"",VehicleTypeCombobox_2.Selected.Value),
                                    NumberOfPassengers: If(IsBlank(DataCardValue63_2.Text),0,DataCardValue63_2.Text)
                                }
