    "'Expense Entr Container_2' As groupContainer.verticalAutoLayoutContainer":
        Height: |-
            =If(
                currExpenseType <> 'TrvExpType (mserp)'.Mileage,
                    Value(ButtonBackgroundExpense_2.Y - Self.Y - 10),
                    Value(Parent.Height - Self.Y - 10 - ExpenseInfo_5.Height)  
            )
        LayoutDirection: =LayoutDirection.Vertical
        LayoutGridColumns: =6
        LayoutGridRows: =6
        LayoutMode: =LayoutMode.Auto
        LayoutOverflowY: =LayoutOverflow.Scroll
        Width: |
            =Parent.Width
        Y: =scr03_img_NoReceiptOuter_4.Y + scr03_img_NoReceiptOuter_4.Height + 30
        ZIndex: =14

        ViewOnlyItemizeExpenseForm As form:
            AlignInContainer: =AlignInContainer.SetByContainer
            DataSource: ='Expense lines (mserp)'
            DefaultMode: =FormMode.View
            Height: |-
                =If(
                    currExpenseType <> 'TrvExpType (mserp)'.Mileage,
                        Value(scr03_btn_Done_3.Y - Self.Y - 10),
                    If(
                        currExpenseType = 'TrvExpType (mserp)'.Mileage,
                        Value(Parent.Height - Self.Y - 10 - ExpenseInfo_5.Height)
                    )
                )
            Item: =varSelectedItemizedExpenseDoc
            LayoutMaxHeight: =
            LayoutMaxWidth: =
            LayoutMinHeight: =250
            LayoutMinWidth: =320
            OnFailure: |-
                =Notify(
                    Last(Split(Text(Self.Error), ":")).Value, 
                    NotificationType.Error, 
                    gblParams.notificationTime
                )
            OnSuccess: |-
                =UpdateContext({varSubmittedExpTransNumber : ViewOnlyItemizeExpenseForm.LastSubmit.'Expense transaction number (mserp_exptransnumber)'});
                //attach receipt if any
                UpdateContext({varAttachReceiptError : Blank()});
                If(
                    IsBlank(varSelectedItemizedExpenseDoc),
                        If(
                            !IsBlank(varSubmittedExpTransNumber) && !IsBlank(varSelectedReceiptNumber),
                            IfError(
                                Patch(
                                    'Expense Mobile Unattached Document Entity (mserp)',
                                    LookUp('Expense Mobile Unattached Document Entity (mserp)', EntRecId = varSelectedReceiptNumber),
                                    {
                                        ExpTransNumber:varSubmittedExpTransNumber
                                    }
                                ),
                                UpdateContext({varAttachReceiptError : FirstError.Details})
                            );
                            If(
                            !IsBlank(varAttachReceiptError) && !(Text(varAttachReceiptError.HttpStatusCode) = NotFoundStatusCode),
                            Notify(
                                Substitute(
                                    Substitute( Match(varAttachReceiptError.HttpResponse, """message"":""([^""]*)""").FullMatch, 
                                        """message"":", 
                                        ""), """", ""),
                                NotificationType.Error,
                                gblParams.notificationTime
                            ),
                            Notify(
                                GlobalLabels.Labels.'15062:LocalizedName,msdyn_ReceiptAttachedSuccessfullyLabel',
                                NotificationType.Success,
                                gblParams.notificationTime
                            )
                            )       
                        ),
                
                        If(!IsBlank(varSelectedReceiptNumber) && (IsBlank(varSelectedItemizedExpenseDoc.AttachedReceiptId) || Value(varSelectedItemizedExpenseDoc.AttachedReceiptId) <> varSelectedReceiptNumber)              ,
                            IfError(
                                Patch(
                            'Expense Mobile Unattached Document Entity (mserp)',
                           LookUp('Expense Mobile Unattached Document Entity (mserp)', EntRecId = varSelectedReceiptNumber),
                            {
                                ExpTransNumber: varSelectedItemizedExpenseDoc.'Expense transaction number (mserp_exptransnumber)'
                            }
                            ),
                                 UpdateContext({varAttachReceiptError : FirstError.Details})
                            );
                            If(
                                !IsBlank(varAttachReceiptError) && !(Text(varAttachReceiptError.HttpStatusCode) = NotFoundStatusCode),
                                Notify(
                                    Substitute(
                                        Substitute( 
                                            Match(varAttachReceiptError.HttpResponse, """message"":""([^""]*)""").FullMatch, 
                                            """message"":", 
                                            ""
                                        ), """", ""
                                    ),
                                    NotificationType.Error,
                                    gblParams.notificationTime
                                ),
                               Notify(
                                GlobalLabels.Labels.'15062:LocalizedName,msdyn_ReceiptAttachedSuccessfullyLabel',
                                NotificationType.Success,
                                gblParams.notificationTime
                            )
                        )
                )
                );
                //create or update expense
                If(
                    varIsCreate,
                    Notify(
                        GlobalLabels.Labels.'15062:LocalizedName,msdyn_ExpenseCreateMessageLabel',
                        NotificationType.Success,
                        gblParams.notificationTime
                    ),
                    If(
                        isDirty || isExpenseReceiptAttached,
                        Notify(
                            GlobalLabels.Labels.'15062:LocalizedName,msdyn_ExpenseUpdateMessageLabel', 
                            NotificationType.Success,
                            gblParams.notificationTime)   
                    )
                );
                
                If(!IsBlank(ViewOnlyItemizeExpenseForm.LastSubmit),
                Set(
                    varSelectedItemizedExpenseDoc,
                    ViewOnlyItemizeExpenseForm.LastSubmit
                )
                );
                
                UpdateContext({varSubmittedExpTransNumber :Blank()});
                Set(
                    varIsCreate,
                    false
                );
                Set(
                    isExpenseReceiptAttached,
                    false
                );
                Set(
                    OCRresponse,
                    Blank()
                );
                Set(
                    gblNavigationDrawerVisibility,
                    false
                );
                If(
                    varIsCreate,
                    Navigate('Expenses - List Screen'),
                    If(
                        !IsBlank(varNavigatedFrom),
                        UpdateContext({varExpenseReportNumber : varSelectedReport.'Expense report number'});
                        Set(
                            varSelectedReport,
                            LookUp('Expense reports (mserp)_1','Expense report number' = varExpenseReportNumber)
                        );
                        Clear(colAttachedExpensesForReport);
                        ForAll(
                            Split(varSelectedReport.ExpTransNumber, ",") As attachedExpenses,
                            Collect(
                                colAttachedExpensesForReport,
                                LookUp('Expense lines (mserp)','Expense transaction number (mserp_exptransnumber)' = attachedExpenses[@Value] && 'Expense line type' <> 'Expense line type (mserp)'.'Itemized line')
                            )
                        );
                        ClearCollect(
                            colAttachedExpenses,
                            colAttachedExpensesForReport
                        )
                    );
                    Switch(
                        varNavigatedFrom,
                        "scr17",
                        Navigate('Reports - Edit Screen'),
                        "scr20",
                        Navigate('Reports - View Only Screen'),
                        "scr18",
                        Navigate('Reports - Attach Expenses Screen'),
                        "scr19",
                        Navigate('Reports - View Attached Expenses Screen'),
                        "ItemizationDetailScreen",
                        Navigate('Itemization - View All Itemize Expense Screen'),
                        Blank(),
                        Navigate('Expenses - List Screen')
                    );
                    UpdateContext({varNavigatedFrom : Blank()});
                );
                UpdateContext(
                    {
                        dirtyTransAmount:Blank(),
                        dirtyTransDate : Blank(),
                        dirtyMerchant : Blank(),
                        varOnSelectTriggered: false,
                        varOnShowFields:false,
                        varOnChangeTriggered:false,
                        varSalesTaxAmount: Blank(),
                        locItemizeButtonVisibilityFlag: false
                    }
                )
                        
            SnapToColumns: =false
            Width: =Parent.Width
            Y: =scr03_img_NoReceiptOuter_4.Y + scr03_img_NoReceiptOuter_4.Height + 30
            ZIndex: =1

            "'Expense category_DataCard3_6' As typedDataCard.allowedValuesStringEditCard":
                AllowedValues: |-
                    =Filter(
                        'Expense category (mserp)',
                        'Company Code' = varSelectedLegalEntity && Inactive = 'NoYes (mserp)'.No
                    )
                BorderColor: =gblParams.dropDownBorderColor
                BorderStyle: =BorderStyle.Solid
                DataField: ="mserp_costtype"
                Default: =varSelectedItemizedExpenseDoc.'Expense category (mserp_costtype)'
                DisplayMode: =Parent.DisplayMode
                DisplayName: =DataSourceInfo([@'Expense lines (mserp)'],DataSourceInfo.DisplayName,'Expense category (mserp_costtype)')
                Fill: =RGBA(0, 0, 0, 0)
                Height: =50
                Required: =true
                Update: =ComboBox1_10.Selected.'Expense category'
                Visible: =false
                Width: =Parent.Width
                X: =1
                Y: =expenseCategoryFieldOrder_Y
                ZIndex: =1

                DataCardKey3_6 As label:
                    AutoHeight: =true
                    BorderColor: =RGBA(0, 0, 0, 1)
                    Color: =gblParams.dropDownLabelColor
                    FocusedBorderThickness: =
                    Font: =Font.'Segoe UI'
                    Height: =48
                    Size: =21
                    Text: =LookUp(labelTableLookUp, labelName = Parent.DisplayName, localisedLabelName) 
                    Width: =Parent.Width - 60
                    Wrap: =false
                    X: =30
                    Y: =10
                    ZIndex: =1

                DataCardValue3_6 As dropdown:
                    BorderColor: =If(IsBlank(Parent.Error), Parent.BorderColor, Color.Red)
                    Default: =Parent.Default
                    DisplayMode: =Parent.DisplayMode
                    Height: =gblParams.dropDownHeight
                    HoverFill: =gblParams.dropDownHoverFill
                    Items: =Parent.AllowedValues
                    Size: =24
                    Tooltip: =varSelectedItemizedExpenseDoc.'Expense category (mserp_costtype)'
                    Visible: =false
                    Width: =Parent.Width - 60
                    X: =30
                    Y: =DataCardKey3_6.Y + DataCardKey3_6.Height + 5
                    ZIndex: =2

                ErrorMessage3_6 As label:
                    AutoHeight: =true
                    BorderColor: =RGBA(0, 0, 0, 1)
                    Color: =RGBA(168, 0, 0, 1)
                    Font: =Font.'Segoe UI'
                    FontWeight: =FontWeight.Semibold
                    Height: =10
                    Live: =Live.Assertive
                    PaddingBottom: =0
                    PaddingLeft: =0
                    PaddingRight: =0
                    PaddingTop: =0
                    Size: =gblParams.errorMessageSize
                    Text: =Parent.Error
                    Visible: =Parent.DisplayMode=DisplayMode.Edit
                    Width: =Parent.Width - 60
                    X: =30
                    Y: =DataCardValue3_6.Y + DataCardValue3_6.Height
                    ZIndex: =3

                StarVisible3_6 As label:
                    Align: =Align.Center
                    BorderColor: =RGBA(0, 0, 0, 1)
                    Color: =RGBA(0, 18, 107, 1)
                    Height: =DataCardKey3_6.Height
                    Size: =21
                    Text: ="*"
                    Visible: =And(Parent.Required, Parent.DisplayMode=DisplayMode.Edit)
                    Width: =30
                    Wrap: =false
                    Y: =DataCardKey3_6.Y
                    ZIndex: =4

                ComboBox1_10 As combobox:
                    AccessibleLabel: =Concatenate("Select ", Parent.DisplayName)
                    BorderColor: =If(IsBlank(Parent.Error), Parent.BorderColor, Color.Red)
                    BorderThickness: =If(Parent.Error, gblParams.dorpDownBorderThickness, 0)
                    DefaultSelectedItems: =LookUp('Expense category (mserp)','Expense category' = Parent.Default && 'Company Code' = varSelectedLegalEntity)
                    DisplayFields: =["mserp_expensecategory","mserp_description"]
                    FocusedBorderThickness: =2
                    Height: =gblParams.dropDownHeight
                    HoverFill: =gblParams.dropDownHoverFill
                    InputTextPlaceholder: |-
                        =GlobalLabels.Labels.'15062:LocalizedName,msdyn_EnterExpenseCategoryLabel' 
                    Items: |-
                        =Filter(
                            'Expense category (mserp)',
                            'Company Code' = varSelectedLegalEntity && Inactive = 'NoYes (mserp)'.No
                            && 'Expense type' <> 'TrvExpType (mserp)'.'Per diem'
                        )
                    NoSelectionText: |-
                        =GlobalLabels.Labels.'15062:LocalizedName,msdyn_EnterExpenseCategoryLabel' 
                    OnChange: |-
                        =UpdateContext({varOnChangeTriggered : true});
                        Reset(VehicleTypeCombobox_2);
                        UpdateContext({varDefaultVehicleType : Blank()});
                        UpdateContext({currExpenseType : LookUp('Expense category (mserp)','Expense category' = Self.Selected.'Expense category', 'Expense type')});
                        UpdateContext({msCallStartedForSalestaxCalculation : true});
                        
                        If(
                            varOnChangeTriggered && varOnSelectTriggered,
                            UpdateContext({varOnShowFields : true})
                        );
                        If(varOnShowFields,
                        If(
                            IsBlank(Self.Selected),
                            Reset(DataCardValue16_6); //remove payment method
                            Reset(ComboBox1_63);  //remove project
                            Reset(DataCardValue9_6); //remove line status
                            Reset(ComboBox1_64); //remove activity
                            Reset(ComboBox1_65); //sales tax
                            Reset(ComboBox1_66); //item sales tax
                            Reset(ComboBox4_6); // Reset Billable
                            UpdateContext({varSalesTaxAmount:0});
                            Reset(DataCardValue25_6); //actual sales tax
                            //Clear(collectionActivities),
                            If(
                                Self.Selected.'Use in Project' = 'NoYes (mserp)'.No,
                                Reset(ComboBox1_63);  //reset project
                                Reset(DataCardValue9_6); //reset line status id
                                Reset(ComboBox1_64); //remove activity
                                //Clear(collectionActivities)
                            );
                            
                            
                        );
                        If(
                            Self.Selected.'Expense category' <> curCategory,
                            
                            UpdateContext({categoryModified:true});
                            Reset(ComboBox1_63);  //remove project
                            Reset(DataCardValue9_6); //remove line status
                            Reset(ComboBox1_64); //remove activity
                            Reset(ComboBox1_65); //sales tax
                            Reset(ComboBox1_66); //item sales tax
                            UpdateContext({varSalesTaxAmount:0});
                            Reset(DataCardValue25_6); //actual sales tax amount
                            Set(
                                varItemSalesTaxDefaultValue,
                                Blank()
                            );
                            If(Self.Selected.'Expense type' = 'TrvExpType (mserp)'.Mileage,
                                Set(varCollectCacheV23,
                                'Expense mobile master data (mserp)'.mserp_calckm(If(IsBlank(ExpenseInfo_5.RowId),"",ExpenseInfo_5.RowId),
                                {
