            =GlobalLabels.Labels.'15062:LocalizedName,msdyn_RatePerMileLabel'
        HeaderText2: |-
            =GlobalLabels.Labels.'15062:LocalizedName,msdyn_TotalLabel'
        Height: =250
        IconVisibleFlag: =ComboBox1_10.Selected.'Expense type' = 'TrvExpType (mserp)'.Mileage && !IsBlank(DataCardValue40_2.Text)
        Mileage: =varCurMileage
        NoOfPassengers: =varCurNoOfPass
        OnReload: |-
            =UpdateContext({onReloadButtonClick : true});
            UpdateContext({msCallStartedForSalestaxCalculation : true});
            Set(varCollectCacheV2,
            'Expense mobile master data (mserp)'.mserp_calckm(If(IsBlank(ExpenseInfo_5.RowId),"",ExpenseInfo_5.RowId),
                    {
                        TransDate: If(IsBlank(DatePickerCanvas1_37.SelectedDate),"",Text(DateTimeValue(DatePickerCanvas1_37.SelectedDate),"yyyy-mm-dd hh:mm:ssZ")),
                        CostType: If(IsBlank(ComboBox1_10.Selected.'Expense category'),"",ComboBox1_10.Selected.'Expense category'),
                        KmOwnCar: If(IsBlank(DataCardValue40_2.Text),0,DataCardValue40_2.Text),
                        VehicleType: If(IsBlank(VehicleTypeCombobox_2.Selected.Value),"",VehicleTypeCombobox_2.Selected.Value),
                        NumberOfPassengers: If(IsBlank(DataCardValue63_2.Text),0,DataCardValue63_2.Text)
                    }
                    )
            );
            
            UpdateContext({varRatePerMile : Text(ParseJSON(varCollectCacheV2.return).KMPrice)});
            UpdateContext({varMileageTotal : Text(ParseJSON(varCollectCacheV2.return).AmountMST)});
            If(
                !IsBlank(Text(ParseJSON(varCollectCacheV2.return).Warnings)),
                Notify(
                    Text(ParseJSON(varCollectCacheV2.return).Warnings),
                    NotificationType.Warning,
                    gblParams.notificationTime
                )
            );
            If(!IsBlank(ComboBox1_65.Selected) && !IsBlank(ComboBox1_66.Selected),
            UpdateContext({taxModifiedByUser:false});
            
            UpdateContext({
                varSalesTaxAmount : 
                IfError(
                Value('Expense mobile master data (mserp)'.mserp_getactualsalestaxamount(
                    LookUp('Expense mobile master data (mserp)',Email = User().Email,'Expense mobile master data (mserp)'),
                    {
                        TaxGroup : If(IsBlank(ComboBox1_65.Selected.'Sales tax group'), "", ComboBox1_65.Selected.'Sales tax group'),
                        TaxItemGroup : If(IsBlank(ComboBox1_66.Selected.'Item sales tax group'), "", ComboBox1_66.Selected.'Item sales tax group'),
                        ExchangeCode : If(IsBlank(ComboBox1_62.Selected.mserp_currencycode), "", ComboBox1_62.Selected.mserp_currencycode),
                        TransDate : If(IsBlank(Text(DateValue1_35.SelectedDate, "yyyy-mm-dd HH:mm:ssZ")), "", Text(DateValue1_35.SelectedDate, "yyyy-mm-dd HH:mm:ssZ")),
                        AmountCurr : If(IsBlank(DataCardValue4_6.Text), "0", DataCardValue4_6.Text),
                        LegalEntity : If(IsBlank(DataCardValue39_6.Selected.Value),"",Text(DataCardValue39_6.Selected.Value)),
                        TaxIncluded : If('Tax included_DataCard1_6'.Visible,If(Toggle1_6.Value, "Yes", "No"),If(LookUp('Expense management parameters (mserp)','Company Code'=varDefaultLegalEntity,'Tax included')='NoYes (mserp)'.Yes,"Yes", "No"))
                    }
                ).return),
                UpdateContext({
                    varErrorActualTaxCal : 
                    Substitute(
                Match(
                    FirstError.Details.HttpResponse,
                    """message"":""([^""]*)"""
                ).FullMatch,
                """message"":""",
                ""
            )      
                })
                )
            });
            If(!IsBlank(varErrorActualTaxCal),
            Notify(
                Left(varErrorActualTaxCal,Len(varErrorActualTaxCal)-1),
                NotificationType.Error,
                gblParams.notificationTime
            )
            )
            );
            UpdateContext({msCallStartedForSalestaxCalculation : false})
