"'Itemization - View All Itemize Expense Screen' As screen":
    Fill: =RGBA(244, 244, 244, 1)

    "ItemizedExpensesList_Approvals As gallery.'BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0'":
        '#CopilotOverlayLabel': ="Filtered"
        AccessibleLabel: ="List of itemized Expense"
        DelayItemLoading: =true
        Fill: =Color.White
        Height: =App.Height - ViewItemizeExpenseHeader.Height - viewItemizedExpensesButtonContainer.Height
        Items: |-
            =Filter(
                'Expense Lines Attached to a Report for Approvals (mserp)',
                'Expense line type' = 'Expense line type (mserp)'.'Itemized line' && 'Expense transaction number (mserp_itemizedline_exptransnumber)' = varExpenseAgainstWorkItem.'Expense transaction number (mserp_exptransnumber)'
            )
        Layout: =Layout.Vertical
        LoadingSpinner: =LoadingSpinner.Data
        OnSelect: |-
            =
            //set details for the next screen 
            Concurrent(
                Set(
                    varIsCreate,
                    false
                ),
                Set(
                    varReceiptImage,
                    Blank()
                )
            );
            // assign the expense to a varSelectedItemizedExpenseDoc_Approvals
            Set(
                varSelectedItemizedExpenseDoc_Approvals,
                LookUp('Expense Lines Attached to a Report for Approvals (mserp)', 'Expense transaction number (mserp_exptransnumber)' = ThisItem.'Expense transaction number (mserp_exptransnumber)')
            );
            // populating base64 to show image on selection of expense
            Set(
                varReceiptImage,
                LookUp(receiptsAgainstWorkItems, ExpenseLineAttachedTo = varSelectedItemizedExpenseDoc_Approvals.'Expense transaction number (mserp_exptransnumber)',CapturedDocument) 
            );
            
            // collect policy violations
            If(
                varSelectedItemizedExpenseDoc_Approvals.PolicyViolationCount,
                ClearCollect(
                    colPolViolations,
                    Split(varSelectedItemizedExpenseDoc_Approvals.PolicyViolationErrorMessage, "~|~")
                );
                UpdateContext({varMaxViolationLevel : varSelectedItemizedExpenseDoc_Approvals.PolicyViolationsLevel});
                UpdateContext({varNumViolation : varSelectedItemizedExpenseDoc_Approvals.PolicyViolationCount}),
                Clear(colPolViolations);
                UpdateContext({varMaxViolationLevel : 0});
                UpdateContext({varNumViolation : 0})
            );
            
            Navigate('Itemization - Itemized Expense View Only Screen_Approval', ScreenTransition.None, {varMaxViolationLevel : varMaxViolationLevel, varNumViolation: varNumViolation,varNavigatedFrom : varNavigatedFrom})
        TemplatePadding: =0
        TemplateSize: =App.Height * 0.123
        Visible: =varNavigatedFrom = "scr22"
        Width: =App.Width
        Y: =ViewItemizeExpenseHeader.Height
        ZIndex: =1

        SubCategoryName2_1 As label:
            BorderColor: =RGBA(0, 0, 0, 1)
            Color: =RGBA(71, 69, 64, 1)
            DisabledColor: =RGBA(186, 186, 186, 1)
            FontWeight: =FontWeight.Semibold
            Height: =Parent.TemplateHeight * 0.55
            OnSelect: =Select(Parent)
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =Parent.TemplateHeight * 0.157
            Text: =ThisItem.'Expense subcategory name'
            Width: =App.Width - Self.X - AmountLabel2_1.Width - NextArrow5_1.Width
            X: =App.Width * 0.0234
            Y: =Parent.TemplateHeight * 0.064
            ZIndex: =2

        TransactionDateSubcategory2_1 As label:
            BorderColor: =RGBA(0, 0, 0, 1)
            Color: =RGBA(71, 69, 64, 1)
            DisabledColor: =RGBA(186, 186, 186, 1)
            Height: =Parent.TemplateHeight * 0.25
            OnSelect: =Select(Parent)
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =Parent.TemplateHeight * 0.121
            Text: |-
                =Text(
                    DateValue(ThisItem.'Transaction date'),
                    "dd mmm, yyyy"
                )
            VerticalAlign: =VerticalAlign.Top
            Width: =SubCategoryName2_1.Width
            X: =App.Width * 0.0234
            Y: =SubCategoryName2_1.Y + SubCategoryName2_1.Height + Parent.TemplateHeight * 0.0286
            ZIndex: =3

        scr01_shp_Seprator_7 As rectangle:
            Fill: =RGBA(225, 225, 225, 1)
            Height: =1
            Width: =Parent.TemplateWidth
            Y: =Parent.TemplateHeight - 1
            ZIndex: =5

        AmountLabel2_1 As label:
            Align: =Align.Right
            FontWeight: =FontWeight.Bold
            Height: =Parent.TemplateHeight * 0.514
            OnSelect: =Select(Parent)
            Size: =Parent.TemplateHeight * 0.15
            Text: |
                =If(ItemizedExpensesList_Approvals.AllItemsCount > 0,
                Concatenate(Text(Value(ThisItem.'Transaction amount'), "#,#0.00", varDefaultLanguage), " ", varSelectedExpenseDoc.'Currency (mserp_exchangecode)')
                )
            Width: =App.Width * 0.422
            X: =NextArrow5_1.X - Self.Width
            Y: =Parent.TemplateHeight * 0.06
            ZIndex: =6

        NextArrow5_1 As icon.ChevronRight:
            AccessibleLabel: =Self.Tooltip
            BorderColor: =RGBA(0, 0, 0, 1)
            Color: =RGBA(110, 110, 110, 1)
            DisabledBorderColor: =RGBA(56, 56, 56, 1)
            DisabledColor: =RGBA(119, 119, 119, 1)
            Height: =Parent.TemplateHeight
            Icon: =Icon.ChevronRight
            OnSelect: =Select(Parent)
            PaddingBottom: =16
            PaddingLeft: =16
            PaddingRight: =16
            PaddingTop: =16
            TabIndex: =0
            Tooltip: ="View itemized expense detail"
            Width: =App.Width * 0.0766
            X: =App.Width - Self.Width
            ZIndex: =7

    "ItemizedExpensesList As gallery.'BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0'":
        '#CopilotOverlayLabel': ="Filtered"
        AccessibleLabel: ="List of itemized Expense"
        DelayItemLoading: =true
        Fill: =Color.White
        Height: =App.Height - ViewItemizeExpenseHeader.Height - viewItemizedExpensesButtonContainer.Height
        Items: |-
            =Filter(
                'Expense lines (mserp)',
                'Expense line type' = 'Expense line type (mserp)'.'Itemized line' && 'Expense transaction number (mserp_itemizedline_exptransnumber)' = varSelectedExpenseDoc.'Expense transaction number (mserp_exptransnumber)'
                )
        Layout: =Layout.Vertical
        LoadingSpinner: =LoadingSpinner.Data
        OnSelect: |-
            =
            //set details for the next screen 
            Concurrent(
                Set(
                    varIsCreate,
                    false
                ),
                Set(
                    varReceiptImage,
                    Blank()
                ),
                Set(
                    varSelectedReceiptNumber,
                    Blank()
                ),
                Set(
                    varChangeReceiptItemizedExpense,
                    true
                )
            );
            // assign the expense to a varSelectedItemizedExpenseDoc
            Set(
                varSelectedItemizedExpenseDoc,
                LookUp('Expense lines (mserp)','Expense transaction number (mserp_exptransnumber)' = ThisItem.'Expense transaction number (mserp_exptransnumber)')
            );
            // populating base64 to show image on selection of expense
            Set(
                varReceiptImage,
                LookUp('Expense Mobile Attached Document Entity (mserp)', EntRecId = Value(varSelectedItemizedExpenseDoc.AttachedReceiptId),CapturedDocument) 
            );
            
            // collect policy violations
            If(
                varSelectedItemizedExpenseDoc.PolicyViolationCount,
                ClearCollect(
                    colPolViolations,
                    Split(varSelectedItemizedExpenseDoc.PolicyViolationErrorMessage, "~|~")
                );
                UpdateContext({varMaxViolationLevel : varSelectedItemizedExpenseDoc.PolicyViolationsLevel});
                UpdateContext({varNumViolation : varSelectedItemizedExpenseDoc.PolicyViolationCount}),
                Clear(colPolViolations);
                UpdateContext({varMaxViolationLevel : 0});
                UpdateContext({varNumViolation : 0})
            );
            If(varSelectedExpenseDoc.'Approval status' = 'Document status (mserp)'.Draft,
            Navigate('Itemization - Itemized Expense Edit Screen', ScreenTransition.None, {varNavigatedFrom : varNavigatedFrom, varMaxViolationLevel : varMaxViolationLevel, varNumViolation: varNumViolation, varSalesTaxAmount: Blank()}),
            Navigate('Itemization - Itemized Expense View Only Screen', ScreenTransition.None, {varMaxViolationLevel : varMaxViolationLevel, varNumViolation: varNumViolation,varNavigatedFrom : varNavigatedFrom})
            )
        TemplatePadding: =0
        TemplateSize: =App.Height * 0.123
        Visible: =!ItemizedExpensesList_Approvals.Visible
        Width: =App.Width
        Y: =ViewItemizeExpenseHeader.Height
        ZIndex: =2

