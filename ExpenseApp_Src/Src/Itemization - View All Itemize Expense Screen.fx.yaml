    viewItemizedExpensesButtonContainer As groupContainer.manualLayoutContainer:
        DropShadow: =DropShadow.ExtraBold
        Height: =DoneButtonFooter.Height * 2
        Width: =App.Width
        Y: =App.Height - Self.Height
        ZIndex: =4

        DoneButtonFooter As button:
            Height: =App.Height * 0.0616
            OnSelect: |-
                =Switch(
                    varItemizationScreen,
                    "viewOnlyExpenseScreen",
                    
                Concurrent(
                    Set(
                        varIsCreate,
                        false
                    ),
                    Set(
                        varReceiptImage,  //set as receiptUrl of attached expense
                        Blank()
                    )
                );
                
                Set(
                    varReceiptImage,
                    LookUp('Expense Mobile Attached Document Entity (mserp)', EntRecId = Value(varSelectedExpenseDoc.AttachedReceiptId),CapturedDocument)
                );
                Set(
                    varSelectedReceiptNumber,
                    Blank()
                );
                If(
                    varSelectedExpenseDoc.PolicyViolationCount,
                    ClearCollect(
                        colPolViolations,
                        Split(varSelectedExpenseDoc.PolicyViolationErrorMessage, "~|~")
                    );
                    UpdateContext({varMaxViolationLevel : varSelectedExpenseDoc.PolicyViolationsLevel});
                    UpdateContext({varNumViolation : varSelectedExpenseDoc.PolicyViolationCount}),
                    Clear(colPolViolations);
                    UpdateContext({varMaxViolationLevel : 0});
                    UpdateContext({varNumViolation : 0})
                );
                Navigate('Expenses - View Only Screen', ScreenTransition.None, {varNavigatedFrom : varNavigatedFrom,varMaxViolationLevel : varMaxViolationLevel, varNumViolation : varNumViolation})
                ,
                    "itemizationDetailScreen",
                    Navigate('Itemization - Detail Screen', ScreenTransition.None, {varNavigatedFrom : varNavigatedFrom}),
                    "viewOnlyApprovalExpenseScreen",
                    Concurrent(
                    Set(
                        varIsCreate,
                        false
                    ),
                    Set(
                        varReceiptImage,  //set as receiptUrl of attached expense
                        Blank()
                    )
                );
                
                Set(
                    varReceiptImage,
                    LookUp(receiptsAgainstWorkItems,ExpenseLineAttachedTo = varExpenseAgainstWorkItem.'Expense transaction number (mserp_exptransnumber)',CapturedDocument)
                );
                Set(
                    varSelectedReceiptNumber,
                    Blank()
                );
                If(
                    varExpenseAgainstWorkItem.PolicyViolationCount,
                    ClearCollect(
                        colPolViolations,
                        Split(varExpenseAgainstWorkItem.PolicyViolationMessage, "~|~")
                    );
                    UpdateContext({varMaxViolationLevel : varExpenseAgainstWorkItem.PolicyViolationsLevel});
                    UpdateContext({varNumViolation : varExpenseAgainstWorkItem.PolicyViolationCount}),
                    Clear(colPolViolations);
                    UpdateContext({varMaxViolationLevel : 0});
                    UpdateContext({varNumViolation : 0})
                );
                UpdateContext({testVar : varExpenseAgainstWorkItem});
                Navigate('Expenses - View Only Screen', ScreenTransition.None, {varNavigatedFrom : varNavigatedFrom, varMaxViolationLevel : varMaxViolationLevel, varNumViolation : varNumViolation})
                )
            Size: =App.Height * 0.0211
            Text: |-
                =GlobalLabels.Labels.'15062:LocalizedName,msdyn_DoneButtonLabel'
            Width: =App.Width * 0.891
            X: =App.Width/2 - Self.Width/2
            Y: =(ButtonBackground.Height / 2 - DoneButtonFooter.Height / 2)
            ZIndex: =1

