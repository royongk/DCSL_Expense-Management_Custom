"'Main Screen' As screen":
    Fill: =RGBA(245, 246, 248, 1)
    OnVisible: =

    MainScreen_Logo As image:
        Height: =If(App.Width >= 1024, 150, 100)
        Image: =DCSL_Logo
        Width: =If(App.Width >= 1024, 450, Parent.Width - 80)
        X: =(Parent.Width - Self.Width) / 2
        Y: =If(App.Width >= 1024, Parent.Height * 0.15, Parent.Height * 0.2)
        ZIndex: =1

    MainScreen_TitleLabel As label:
        Align: =Align.Center
        Color: =RGBA(30, 30, 30, 1)
        Font: =Font.'Segoe UI'
        FontWeight: =FontWeight.Bold
        Height: =If(App.Width >= 1024, 60, 50)
        Size: =If(App.Width >= 1024, 36, 28)
        Text: ="Expense Management"
        Width: =Parent.Width - 40
        X: =(Parent.Width - Self.Width) / 2
        Y: =MainScreen_Logo.Y + MainScreen_Logo.Height + 40
        ZIndex: =4

    MainScreen_WelcomeLabel As label:
        Align: =Align.Center
        Color: =RGBA(80, 80, 80, 1)
        Font: =Font.'Segoe UI'
        Height: =35
        Size: =If(App.Width >= 1024, 22, 16)
        Text: ="Welcome back, " & First(Split(User().FullName, " ")).Value & " 👋"
        Width: =Parent.Width - 40
        X: =(Parent.Width - Self.Width) / 2
        Y: =MainScreen_TitleLabel.Y + MainScreen_TitleLabel.Height + 10
        ZIndex: =5

    conMainLayout As groupContainer.horizontalAutoLayoutContainer:
        Height: =conFinanceSection.Height
        LayoutAlignItems: =LayoutAlignItems.Center
        LayoutGridColumnMinWidth: =0
        LayoutGridColumns: =6
        LayoutGridRowMinHeight: =0
        LayoutGridRows: =6
        LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
        LayoutMode: =LayoutMode.Auto
        PaddingBottom: =8
        PaddingLeft: =8
        PaddingRight: =8
        PaddingTop: =8
        Width: =Parent.Width - 40
        X: =20
        Y: =MainScreen_WelcomeLabel.Y + MainScreen_WelcomeLabel.Height + 100
        ZIndex: =6

        conFinanceSection As groupContainer.verticalAutoLayoutContainer:
            AlignInContainer: =AlignInContainer.Start
            BorderColor: =RGBA(0,0,0,0.05)
            BorderThickness: =1
            Fill: =RGBA(255, 255, 255, 1)
            Height: =conFinanceHeader.Height + galFinanceMenu.Height + 40
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGridColumnMinWidth: =0
            LayoutGridColumns: =6
            LayoutGridRowMinHeight: =0
            LayoutGridRows: =6
            LayoutMaxHeight: =0
            LayoutMaxWidth: =0
            LayoutMinHeight: =16
            LayoutMinWidth: =16
            LayoutMode: =LayoutMode.Auto
            PaddingBottom: =8
            PaddingLeft: =8
            PaddingRight: =8
            PaddingTop: =8
            RadiusBottomLeft: =16
            RadiusBottomRight: =16
            RadiusTopLeft: =16
            RadiusTopRight: =16
            Width: =Parent.Width/2
            ZIndex: =1

            conFinanceHeader As groupContainer.horizontalAutoLayoutContainer:
                FillPortions: =0
                Height: =40
                LayoutAlignItems: =LayoutAlignItems.Center
                LayoutGap: =10
                LayoutGridColumnMinWidth: =0
                LayoutGridColumns: =6
                LayoutGridRowMinHeight: =0
                LayoutGridRows: =6
                LayoutJustifyContent: =LayoutJustifyContent.Center
                LayoutMaxHeight: =0
                LayoutMaxWidth: =0
                LayoutMinHeight: =16
                LayoutMinWidth: =16
                LayoutMode: =LayoutMode.Auto
                PaddingBottom: =8
                PaddingLeft: =8
                PaddingRight: =8
                PaddingTop: =8
                Width: =Parent.Width
                X: =40
                Y: =40
                ZIndex: =1

                imgFinanceHeader As image:
                    Height: =24
                    Image: ='Receipt--Streamline-Core'
                    LayoutMaxHeight: =0
                    LayoutMaxWidth: =0
                    LayoutMinHeight: =16
                    LayoutMinWidth: =16
                    Width: =24
                    ZIndex: =1

                lblFinance As label:
                    Color: =RGBA(30, 30, 30, 1)
                    FontWeight: =FontWeight.Bold
                    Height: =Parent.Height
                    LayoutMaxHeight: =0
                    LayoutMaxWidth: =0
                    LayoutMinHeight: =16
                    LayoutMinWidth: =16
                    Size: =If(App.Width >= 1024, 18, 14)
                    Text: ="Finance Review"
                    Width: =180
                    ZIndex: =2

            galFinanceMenu As gallery.galleryVertical:
                DelayItemLoading: =true
                FillPortions: =0
                Height: =CountRows(Self.AllItems) * Self.TemplateHeight
                Items: =Filter(colLandingMenu, Category = "Finance")
                Layout: =Layout.Vertical
                LayoutMaxHeight: =0
                LayoutMaxWidth: =0
                LayoutMinHeight: =16
                LayoutMinWidth: =16
                LoadingSpinner: =LoadingSpinner.Data
                TemplatePadding: =0
                TemplateSize: =btnFinance.Height + If(App.Width >= 1024, 24, 16)
                ZIndex: =2

                btnFinance As button:
                    Align: =Align.Left
                    BorderColor: =RGBA(163, 32, 53, 0.3)
                    BorderThickness: =1.5
                    Color: =RGBA(163, 32, 53, 1)
                    Fill: =RGBA(255, 255, 255, 1)
                    Height: =If(App.Width >= 1024, 80, 60)
                    HoverColor: =RGBA(163, 32, 53, 1)
                    HoverFill: =RGBA(163, 32, 53, 0.08)
                    OnSelect: |-
                        =Set(varAppMode, ThisItem.AppMode);
                        Set(varSelectedTab, 2);
                        Navigate('Expenses - List Screen', ScreenTransition.Fade)
                    PaddingLeft: =20
                    PressedColor: =RGBA(255, 255, 255, 1)
                    PressedFill: =RGBA(163, 32, 53, 1)
                    RadiusBottomLeft: =12
                    RadiusBottomRight: =12
                    RadiusTopLeft: =12
                    RadiusTopRight: =12
                    Size: =If(App.Width >= 1024, 18, 14)
                    Text: =ThisItem.DisplayName
                    Width: =If(App.Width >= 1024, Parent.TemplateWidth * 0.7, Parent.TemplateWidth - 40)
                    X: =(Parent.TemplateWidth - Self.Width) / 2
                    Y: =(Parent.TemplateHeight - Self.Height) / 2
                    ZIndex: =1

        conHRSection As groupContainer.verticalAutoLayoutContainer:
            AlignInContainer: =AlignInContainer.Start
            BorderColor: =RGBA(0,0,0,0.05)
            BorderThickness: =1
            Fill: =RGBA(255, 255, 255, 1)
            Height: =conHRHeader.Height + galHRMenu.Height + 40
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGridColumnMinWidth: =0
            LayoutGridColumns: =6
            LayoutGridRowMinHeight: =0
            LayoutGridRows: =6
            LayoutMaxHeight: =0
            LayoutMaxWidth: =0
            LayoutMinHeight: =16
            LayoutMinWidth: =16
            LayoutMode: =LayoutMode.Auto
            PaddingBottom: =8
            PaddingLeft: =8
            PaddingRight: =8
            PaddingTop: =8
            RadiusBottomLeft: =16
            RadiusBottomRight: =16
            RadiusTopLeft: =16
            RadiusTopRight: =16
            Width: =Parent.Width/2
            ZIndex: =2

            conHRHeader As groupContainer.horizontalAutoLayoutContainer:
                FillPortions: =0
                Height: =40
                LayoutAlignItems: =LayoutAlignItems.Center
                LayoutGap: =10
                LayoutGridColumnMinWidth: =0
                LayoutGridColumns: =6
                LayoutGridRowMinHeight: =0
                LayoutGridRows: =6
                LayoutJustifyContent: =LayoutJustifyContent.Center
                LayoutMaxHeight: =0
                LayoutMaxWidth: =0
                LayoutMinHeight: =16
                LayoutMinWidth: =16
                LayoutMode: =LayoutMode.Auto
                maximumHeight: =11360
                maximumWidth: =640
                PaddingBottom: =8
                PaddingLeft: =8
                PaddingRight: =8
                PaddingTop: =8
                Width: =Parent.Width
                X: =40
                Y: =40
                ZIndex: =2

                imgHRHeader As image:
                    Height: =24
                    Image: ='User-Multiple-Group--Streamline-Core'
                    LayoutMaxHeight: =0
                    LayoutMaxWidth: =0
                    LayoutMinHeight: =16
                    LayoutMinWidth: =16
                    Width: =24
                    ZIndex: =1

                lblHR As label:
                    Color: =RGBA(30, 30, 30, 1)
                    FontWeight: =FontWeight.Bold
                    Height: =Parent.Height
                    LayoutMaxHeight: =0
                    LayoutMaxWidth: =0
                    LayoutMinHeight: =16
                    LayoutMinWidth: =16
                    Size: =If(App.Width >= 1024, 18, 14)
                    Text: ="HR Review"
                    Width: =140
                    ZIndex: =2

            galHRMenu As gallery.galleryVertical:
                DelayItemLoading: =true
                FillPortions: =0
                Height: =CountRows(Self.AllItems) * Self.TemplateHeight
                Items: =Filter(colLandingMenu, Category = "HR")
                Layout: =Layout.Vertical
                LayoutMaxHeight: =0
                LayoutMaxWidth: =0
                LayoutMinHeight: =16
                LayoutMinWidth: =16
                LoadingSpinner: =LoadingSpinner.Data
                TemplatePadding: =0
                TemplateSize: =btnHR.Height + If(App.Width >= 1024, 24, 16)
                ZIndex: =3

                btnHR As button:
                    Align: =Align.Left
                    BorderColor: =RGBA(163, 32, 53, 0.3)
                    BorderThickness: =1.5
                    Color: =RGBA(163, 32, 53, 1)
                    Fill: =RGBA(255, 255, 255, 1)
                    Height: =If(App.Width >= 1024, 80, 60)
                    HoverColor: =RGBA(163, 32, 53, 1)
                    HoverFill: =RGBA(163, 32, 53, 0.08)
                    OnSelect: |-
                        =Set(varAppMode, ThisItem.AppMode);
                        Set(varSelectedTab, 2);
                        Navigate('Expenses - List Screen', ScreenTransition.Fade)
                    PaddingLeft: =20
                    PressedColor: =RGBA(255, 255, 255, 1)
                    PressedFill: =RGBA(163, 32, 53, 1)
                    RadiusBottomLeft: =12
                    RadiusBottomRight: =12
                    RadiusTopLeft: =12
                    RadiusTopRight: =12
                    Size: =If(App.Width >= 1024, 18, 14)
                    Text: =ThisItem.DisplayName
                    Width: =If(App.Width >= 1024, Parent.TemplateWidth * 0.7, Parent.TemplateWidth - 40)
                    X: =(Parent.TemplateWidth - Self.Width) / 2
                    Y: =(Parent.TemplateHeight - Self.Height) / 2
                    ZIndex: =1

