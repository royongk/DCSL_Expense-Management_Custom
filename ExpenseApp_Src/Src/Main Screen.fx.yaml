"'Main Screen' As screen":
    Fill: =RGBA(248, 248, 248, 1)
    OnVisible: =

    MainScreen_Logo As image:
        Height: =120
        Image: =DCSL_Logo
        Width: =Parent.Width - 80
        X: =(Parent.Width - Self.Width) / 2
        Y: =Parent.Height / 4
        ZIndex: =1

    MainScreen_TitleLabel As label:
        Align: =Align.Center
        Color: =RGBA(30, 30, 30, 1)
        Font: =Font.'Segoe UI'
        FontWeight: =FontWeight.Bold
        Height: =50
        Size: =28
        Text: ="Expense Management"
        Width: =Parent.Width - 40
        X: =(Parent.Width - Self.Width) / 2
        Y: =MainScreen_Logo.Y + MainScreen_Logo.Height + 40
        ZIndex: =4

    MainScreen_WelcomeLabel As label:
        Align: =Align.Center
        Color: =RGBA(80, 80, 80, 1)
        Font: =Font.'Segoe UI'
        Height: =35
        Size: =18
        Text: ="Welcome, " & Coalesce(User().FullName, "User")
        Width: =Parent.Width - 40
        X: =(Parent.Width - Self.Width) / 2
        Y: =MainScreen_TitleLabel.Y + MainScreen_TitleLabel.Height + 10
        ZIndex: =5

    MainScreen_ExpenseReportBtn As button:
        BorderColor: =RGBA(163, 32, 53, 1)
        Color: =Color.White
        Fill: =RGBA(163, 32, 53, 1)
        Font: =Font.'Segoe UI'
        Height: =60
        HoverFill: =RGBA(123, 12, 33, 1)
        OnSelect: |-
            =Set(varAppMode, "ExpenseReport");
            Set(varSelectedTab, 2);
            Navigate('Expenses - List Screen', ScreenTransition.Fade)
        PressedFill: =RGBA(123, 12, 33, 1)
        RadiusBottomLeft: =8
        RadiusBottomRight: =8
        RadiusTopLeft: =8
        RadiusTopRight: =8
        Size: =18
        Text: ="Expense Report"
        Width: =If(App.Width > 640, (Parent.Width - 60) / 2, Parent.Width - 240)
        X: =If(App.Width > 640, 20, (Parent.Width - Self.Width) / 2)
        Y: =MainScreen_WelcomeLabel.Y + MainScreen_WelcomeLabel.Height + 50
        ZIndex: =6

    MainScreen_AirfareAllowanceBtn As button:
        BorderColor: =RGBA(163, 32, 53, 1)
        Color: =RGBA(163, 32, 53, 1)
        Fill: =Color.White
        Font: =Font.'Segoe UI'
        Height: =60
        HoverFill: =RGBA(184, 0, 0, 1)
        OnSelect: |-
            =Set(varAppMode, "AirfareAllowance");
            Set(varSelectedTab, 2);
            Navigate('Expenses - List Screen', ScreenTransition.Fade)
        PressedFill: =RGBA(240, 230, 230, 1)
        RadiusBottomLeft: =8
        RadiusBottomRight: =8
        RadiusTopLeft: =8
        RadiusTopRight: =8
        Size: =18
        Text: ="Airfare/Shipping Allowance"
        Width: =If(App.Width > 640, (Parent.Width - 60) / 2, Parent.Width - 240)
        X: =If(App.Width > 640, MainScreen_ExpenseReportBtn.X + MainScreen_ExpenseReportBtn.Width + 20, (Parent.Width - Self.Width) / 2)
        Y: =If(App.Width > 640, MainScreen_ExpenseReportBtn.Y, MainScreen_ExpenseReportBtn.Y + MainScreen_ExpenseReportBtn.Height + 20)
        ZIndex: =7

    MainScreen_BillingTripSettlementBtn As button:
        BorderColor: =RGBA(163, 32, 53, 1)
        Color: =RGBA(163, 32, 53, 1)
        Fill: =Color.White
        Font: =Font.'Segoe UI'
        Height: =60
        HoverFill: =RGBA(184, 0, 0, 1)
        OnSelect: |-
            =Set(varAppMode, "BillingTripSettlement");
            Set(varSelectedTab, 2);
            Navigate('Expenses - List Screen', ScreenTransition.Fade)
        PressedFill: =RGBA(240, 230, 230, 1)
        RadiusBottomLeft: =8
        RadiusBottomRight: =8
        RadiusTopLeft: =8
        RadiusTopRight: =8
        Size: =18
        Text: ="Billing Trip Settlement"
        Width: =If(App.Width > 640, (Parent.Width - 60) / 2, Parent.Width - 240)
        X: =If(App.Width > 640, 20, (Parent.Width - Self.Width) / 2)
        Y: =If(App.Width > 640, MainScreen_ExpenseReportBtn.Y + MainScreen_ExpenseReportBtn.Height + 20, MainScreen_AirfareAllowanceBtn.Y + MainScreen_AirfareAllowanceBtn.Height + 20)
        ZIndex: =8

    MainScreen_EmployeeBenefitBtn As button:
        BorderColor: =RGBA(163, 32, 53, 1)
        Color: =RGBA(163, 32, 53, 1)
        Fill: =Color.White
        Font: =Font.'Segoe UI'
        Height: =60
        HoverFill: =RGBA(184, 0, 0, 1)
        OnSelect: |-
            =Set(varAppMode, "EmployeeBenefit");
            Set(varSelectedTab, 2);
            Navigate('Expenses - List Screen', ScreenTransition.Fade)
        PressedFill: =RGBA(240, 230, 230, 1)
        RadiusBottomLeft: =8
        RadiusBottomRight: =8
        RadiusTopLeft: =8
        RadiusTopRight: =8
        Size: =18
        Text: ="Employee Benefit"
        Width: =If(App.Width > 640, (Parent.Width - 60) / 2, Parent.Width - 240)
        X: =If(App.Width > 640, MainScreen_BillingTripSettlementBtn.X + MainScreen_BillingTripSettlementBtn.Width + 20, (Parent.Width - Self.Width) / 2)
        Y: =If(App.Width > 640, MainScreen_BillingTripSettlementBtn.Y, MainScreen_BillingTripSettlementBtn.Y + MainScreen_BillingTripSettlementBtn.Height + 20)
        ZIndex: =9

    MainScreen_SalaryAdvanceBtn As button:
        BorderColor: =RGBA(163, 32, 53, 1)
        Color: =RGBA(163, 32, 53, 1)
        Fill: =Color.White
        Font: =Font.'Segoe UI'
        Height: =60
        HoverFill: =RGBA(184, 0, 0, 1)
        OnSelect: |-
            =Set(varAppMode, "SalaryAdvance");
            Set(varSelectedTab, 2);
            Navigate('Expenses - List Screen', ScreenTransition.Fade)
        PressedFill: =RGBA(240, 230, 230, 1)
        RadiusBottomLeft: =8
        RadiusBottomRight: =8
        RadiusTopLeft: =8
        RadiusTopRight: =8
        Size: =18
        Text: ="Salary Advance"
        Width: =If(App.Width > 640, (Parent.Width - 60) / 2, Parent.Width - 240)
        X: =If(App.Width > 640, 20, (Parent.Width - Self.Width) / 2)
        Y: =If(App.Width > 640, MainScreen_BillingTripSettlementBtn.Y + MainScreen_BillingTripSettlementBtn.Height + 20, MainScreen_EmployeeBenefitBtn.Y + MainScreen_EmployeeBenefitBtn.Height + 20)
        ZIndex: =10

    MainScreen_CashAdvanceBtn As button:
        BorderColor: =RGBA(163, 32, 53, 1)
        Color: =RGBA(163, 32, 53, 1)
        Fill: =Color.White
        Font: =Font.'Segoe UI'
        Height: =60
        HoverFill: =RGBA(184, 0, 0, 1)
        OnSelect: |-
            =Set(varAppMode, "CashAdvance");
            Set(varSelectedTab, 2);
            Navigate('Expenses - List Screen', ScreenTransition.Fade)
        PressedFill: =RGBA(240, 230, 230, 1)
        RadiusBottomLeft: =8
        RadiusBottomRight: =8
        RadiusTopLeft: =8
        RadiusTopRight: =8
        Size: =18
        Text: ="Cash Advance"
        Width: =If(App.Width > 640, (Parent.Width - 60) / 2, Parent.Width - 240)
        X: =If(App.Width > 640, MainScreen_SalaryAdvanceBtn.X + MainScreen_SalaryAdvanceBtn.Width + 20, (Parent.Width - Self.Width) / 2)
        Y: =If(App.Width > 640, MainScreen_SalaryAdvanceBtn.Y, MainScreen_SalaryAdvanceBtn.Y + MainScreen_SalaryAdvanceBtn.Height + 20)
        ZIndex: =11

