"'Main Screen' As screen":
    Fill: =RGBA(248, 248, 248, 1)
    OnVisible: =

    MainScreen_Logo As image:
        Height: =80
        Image: =DCSL_Logo
        ImagePosition: =ImagePosition.Fit
        Width: =200
        X: =(Parent.Width - Self.Width) / 2
        Y: =120
        ZIndex: =1

    MainScreen_SchoolNameLabel As label:
        Align: =Align.Center
        Color: =RGBA(50, 50, 50, 1)
        Font: =Font.'Segoe UI'
        FontWeight: =FontWeight.Semibold
        Height: =30
        Size: =14
        Text: ="DULWICH COLLEGE | SEOUL |"
        Width: =300
        X: =(Parent.Width - Self.Width) / 2
        Y: =MainScreen_Logo.Y + MainScreen_Logo.Height + 10
        ZIndex: =2

    MainScreen_SchoolNameKorLabel As label:
        Align: =Align.Center
        Color: =RGBA(100, 100, 100, 1)
        Font: =Font.'Segoe UI'
        Height: =25
        Size: =12
        Text: ="덜위치 칼리지 서울"
        Width: =300
        X: =(Parent.Width - Self.Width) / 2
        Y: =MainScreen_SchoolNameLabel.Y + MainScreen_SchoolNameLabel.Height + 5
        ZIndex: =3

    MainScreen_TitleLabel As label:
        Align: =Align.Center
        Color: =RGBA(30, 30, 30, 1)
        Font: =Font.'Segoe UI'
        FontWeight: =FontWeight.Bold
        Height: =50
        Size: =28
        Text: ="Expense Management"
        Width: =Parent.Width - 40
        X: =20
        Y: =MainScreen_SchoolNameKorLabel.Y + MainScreen_SchoolNameKorLabel.Height + 40
        ZIndex: =4

    MainScreen_WelcomeLabel As label:
        Align: =Align.Center
        Color: =RGBA(80, 80, 80, 1)
        Font: =Font.'Segoe UI'
        Height: =35
        Size: =18
        Text: ="Welcome, " & Coalesce(User().Name, "User")
        Width: =Parent.Width - 40
        X: =20
        Y: =MainScreen_TitleLabel.Y + MainScreen_TitleLabel.Height + 10
        ZIndex: =5

    MainScreen_ExpenseReportBtn As button:
        BorderColor: =RGBA(163, 32, 53, 1)
        Color: =Color.White
        Fill: =RGBA(163, 32, 53, 1)
        Font: =Font.'Segoe UI'
        FontWeight: =FontWeight.Semibold
        Height: =60
        HoverFill: =RGBA(143, 22, 43, 1)
        OnSelect: |-
            =Set(varAppMode, "ExpenseReport");
            Set(varSelectedTab, 2);
            Navigate('Expenses - List Screen', ScreenTransition.Fade)
        PressedFill: =RGBA(123, 12, 33, 1)
        RadiusBottomLeft: =8
        RadiusBottomRight: =8
        RadiusTopLeft: =8
        RadiusTopRight: =8
        Size: =18
        Text: ="Expense Report"
        Width: =Parent.Width - 80
        X: =40
        Y: =MainScreen_WelcomeLabel.Y + MainScreen_WelcomeLabel.Height + 50
        ZIndex: =6

    MainScreen_AirfareAllowanceBtn As button:
        BorderColor: =RGBA(163, 32, 53, 1)
        BorderThickness: =2
        Color: =RGBA(163, 32, 53, 1)
        Fill: =Color.White
        Font: =Font.'Segoe UI'
        FontWeight: =FontWeight.Semibold
        Height: =60
        HoverFill: =RGBA(248, 240, 240, 1)
        OnSelect: |-
            =Set(varAppMode, "AirfareAllowance");
            Set(varSelectedTab, 2);
            Navigate('Expenses - List Screen', ScreenTransition.Fade)
        PressedFill: =RGBA(240, 230, 230, 1)
        RadiusBottomLeft: =8
        RadiusBottomRight: =8
        RadiusTopLeft: =8
        RadiusTopRight: =8
        Size: =18
        Text: ="Airfare Allowance"
        Width: =Parent.Width - 80
        X: =40
        Y: =MainScreen_ExpenseReportBtn.Y + MainScreen_ExpenseReportBtn.Height + 20
        ZIndex: =7

