"'Main Screen' As screen":
    Fill: =RGBA(245, 246, 248, 1)
    OnVisible: |-
        =// 1. 사용자 이메일 및 마스터 권한 확인
        Set(varUserEmail, User().Email);
        Set(
            varIsOwner, 
            varUserEmail in ["PowerApps.Admin@dulwich-seoul.kr"]
        );
        
        // 2. [성능 최적화 및 속성 예외 처리] Office 365 그룹 권한 체크
        Concurrent(
            Set(
                varIsLocal, 
                !IsBlank(
                    LookUp(
                        Office365그룹.ListGroupMembers("b9c7b018-c604-4a68-b9ab-e61b0a265f23").value, 
                        Lower(userPrincipalName) = Lower(varUserEmail) Or Lower(mail) = Lower(varUserEmail)
                    )
                )
            ),
            Set(
                varIsFull, 
                !IsBlank(
                    LookUp(
                        Office365그룹.ListGroupMembers("f135e183-009e-48d8-b88a-71850795b8cf").value, 
                        Lower(userPrincipalName) = Lower(varUserEmail) Or Lower(mail) = Lower(varUserEmail)
                    )
                )
            ),
            Set(
                varIsExpat, 
                !IsBlank(
                    LookUp(
                        Office365그룹.ListGroupMembers("f7691104-2166-43db-a229-fbb15179fc47").value, 
                        Lower(userPrincipalName) = Lower(varUserEmail) Or Lower(mail) = Lower(varUserEmail)
                    )
                )
            )
        );
        
        // 3. Main Screen 랜딩 페이지 메뉴 구성용 컬렉션 생성 (권한 검증 완료 후 실행)
        ClearCollect(
            colLandingMenu,
            { DisplayName: "Expense Reimbursement", Category: "Finance", AppMode: "ExpenseReport", IsVisible: varIsOwner Or varIsLocal Or varIsFull Or varIsExpat },
            //{ DisplayName: "School Trip Expense Settlement", Category: "Finance", AppMode: "BillingTripSettlement", IsVisible: varIsOwner Or varIsLocal Or varIsFull Or varIsExpat },
            { DisplayName: "Cash Advance / Settlement", Category: "Finance", AppMode: "CashAdvance", IsVisible: varIsOwner Or varIsFull },
            { DisplayName: "Airfare & Shipping Allowance Claim", Category: "HR", AppMode: "AirfareAllowance", IsVisible: varIsOwner Or varIsExpat Or varIsFull },
            { DisplayName: "Employee Benefits Claim", Category: "HR", AppMode: "EmployeeBenefit", IsVisible: varIsOwner Or varIsLocal Or varIsFull },
            { DisplayName: "Salary Advance", Category: "HR", AppMode: "SalaryAdvance", IsVisible: varIsOwner Or varIsFull }
        );
        
        // 4. [동적 설정 데이터 로드] 설정 테이블에서 5개의 필수 필드값 가져오기
        With(
            { globalSettings: LookUp('Expense management parameters (mserp)','Company Code' = varSelectedLegalEntity) },
            Concurrent(
                Set(varFinanceEmail, globalSettings.'Contact Finance'),
                Set(varHREmail, globalSettings.'Contact HR'),
                Set(varTechEmail, globalSettings.'Contact for technical support'),
                Set(varInstructionLink, globalSettings.'Instruction material Link'),
                Set(varVideoLink, globalSettings.'Introduction video Link')
            )
        );

    conFooterLayout As groupContainer.verticalAutoLayoutContainer:
        Height: =lblTechSupport.Height + lblInstructionLink.Height + vidIntroVideo.Height + (Self.LayoutGap * 2) + Self.PaddingTop + Self.PaddingBottom
        LayoutAlignItems: =LayoutAlignItems.Center
        LayoutDirection: =LayoutDirection.Vertical
        LayoutGap: =20
        LayoutGridColumnMinWidth: =0
        LayoutGridColumns: =6
        LayoutGridRowMinHeight: =0
        LayoutGridRows: =6
        LayoutMode: =LayoutMode.Auto
        PaddingBottom: =8
        PaddingLeft: =8
        PaddingRight: =8
        PaddingTop: =8
        Width: =conMainLayout.Width
        X: =conMainLayout.X
        Y: =conMainLayout.Y + conMainLayout.Height + 30
        ZIndex: =1

        lblTechSupport As label:
            Align: =Align.Center
            Color: =RGBA(80, 80, 80, 1)
            FontWeight: =FontWeight.Bold
            Height: =70
            LayoutMaxHeight: =0
            LayoutMaxWidth: =0
            LayoutMinHeight: =16
            LayoutMinWidth: =16
            OnSelect: |-
                =Launch("mailto:" & varTechEmail)
            Size: =If(App.Width >= 1024, 22, 16)
            Text: |-
                ="Contact for technical support: " & Coalesce(varTechEmail, "Loading...")
            Width: =Parent.Width
            ZIndex: =1

        lblInstructionLink As label:
            Align: =Align.Center
            Color: =RGBA(0, 100, 255, 1)
            FontWeight: =FontWeight.Bold
            Height: =70
            LayoutMaxHeight: =0
            LayoutMaxWidth: =0
            LayoutMinHeight: =16
            LayoutMinWidth: =16
            OnSelect: =Launch(varInstructionLink)
            Size: =If(App.Width >= 1024, 22, 16)
            Text: |-
                ="Instruction material:" & Char(10) & "Link to more instruction material: SharePoint folder"
            Underline: =true
            Width: =Parent.Width
            ZIndex: =2

        vidIntroVideo As videoPlayback:
            Height: =Self.Width * (9/16)
            LayoutMaxHeight: =0
            LayoutMaxWidth: =0
            LayoutMinHeight: =16
            LayoutMinWidth: =16
            Media: =varVideoLink
            Width: =If(App.Width >= 1024, Min(App.Width * 0.5, 800), Parent.Width - 40)
            ZIndex: =3

    MainScreen_Logo As image:
        Height: =If(App.Width >= 1024, 180, 100)
        Image: =DCSL_Logo
        Width: =If(App.Width >= 1024, 550, 300)
        X: =(Parent.Width - Self.Width) / 2
        Y: =If(App.Width >= 1024, App.Height * 0.08, 20)
        ZIndex: =2

    MainScreen_TitleLabel As label:
        Align: =Align.Center
        Color: =RGBA(30, 30, 30, 1)
        Font: =Font.'Segoe UI'
        FontWeight: =FontWeight.Bold
        Height: =If(App.Width >= 1024, 60, 50)
        Size: =If(App.Width >= 1024, 36, 28)
        Text: ="Expense Management"
        Width: =Parent.Width - 40
        X: =(Parent.Width - Self.Width) / 2
        Y: =MainScreen_Logo.Y + MainScreen_Logo.Height + 40
        ZIndex: =3

    MainScreen_WelcomeLabel As label:
        Align: =Align.Center
        Color: =RGBA(80, 80, 80, 1)
        Font: =Font.'Segoe UI'
        Height: =35
        Size: =If(App.Width >= 1024, 22, 16)
        Text: ="Welcome back, " & First(Split(User().FullName, " ")).Value & " 👋"
        Width: =Parent.Width - 40
        X: =(Parent.Width - Self.Width) / 2
        Y: =MainScreen_TitleLabel.Y + MainScreen_TitleLabel.Height + 10
        ZIndex: =4

    conMainLayout As groupContainer.horizontalAutoLayoutContainer:
        Height: =Max(conFinanceSection.Height, conHRSection.Height)
        LayoutAlignItems: =LayoutAlignItems.Center
        LayoutGap: =If(App.Width >= 1024, 60, 20)
        LayoutGridColumnMinWidth: =0
        LayoutGridColumns: =6
        LayoutGridRowMinHeight: =0
        LayoutGridRows: =6
        LayoutJustifyContent: =LayoutJustifyContent.Center
        LayoutMode: =LayoutMode.Auto
        LayoutWrap: =true
        PaddingBottom: =8
        PaddingLeft: =8
        PaddingRight: =8
        PaddingTop: =8
        Width: =App.Width - If(App.Width >= 1024, 80, 40)
        X: =(App.Width - Self.Width) / 2
        Y: =MainScreen_WelcomeLabel.Y + MainScreen_WelcomeLabel.Height + If(App.Width >= 1024, 60, 30)
        ZIndex: =5

        conFinanceSection As groupContainer.verticalAutoLayoutContainer:
            AlignInContainer: =AlignInContainer.Start
            BorderColor: =RGBA(0,0,0,0.05)
            BorderThickness: =1
            Fill: =RGBA(255, 255, 255, 1)
            Height: |-
                =Max(
                    conFinanceHeader.Height + (CountRows(galFinanceMenu.AllItems) * galFinanceMenu.TemplateHeight) + lblContactFinance.Height + 60,
                    conHRHeader.Height + (CountRows(galHRMenu.AllItems) * galHRMenu.TemplateHeight) + lblContactHR.Height + 60
                )
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGridColumnMinWidth: =0
            LayoutGridColumns: =6
            LayoutGridRowMinHeight: =0
            LayoutGridRows: =6
            LayoutMaxHeight: =0
            LayoutMaxWidth: =0
            LayoutMinHeight: =16
            LayoutMinWidth: =16
            LayoutMode: =LayoutMode.Auto
            PaddingBottom: =If(App.Width >= 1024, 30, 16)
            PaddingLeft: =If(App.Width >= 1024, 30, 16)
            PaddingRight: =If(App.Width >= 1024, 30, 16)
            PaddingTop: =If(App.Width >= 1024, 30, 16)
            RadiusBottomLeft: =16
            RadiusBottomRight: =16
            RadiusTopLeft: =16
            RadiusTopRight: =16
            Width: =(Parent.Width - Parent.LayoutGap) / 2
            ZIndex: =1

            conFinanceHeader As groupContainer.horizontalAutoLayoutContainer:
                FillPortions: =0
                Height: =If(App.Width >= 1024, 60, 40)
                LayoutAlignItems: =LayoutAlignItems.Center
                LayoutGap: =10
                LayoutGridColumnMinWidth: =0
                LayoutGridColumns: =6
                LayoutGridRowMinHeight: =0
                LayoutGridRows: =6
                LayoutJustifyContent: =LayoutJustifyContent.Center
                LayoutMaxHeight: =0
                LayoutMaxWidth: =0
                LayoutMinHeight: =16
                LayoutMinWidth: =16
                LayoutMode: =LayoutMode.Auto
                PaddingBottom: =8
                PaddingLeft: =8
                PaddingRight: =8
                PaddingTop: =8
                Width: =Parent.Width
                X: =40
                Y: =40
                ZIndex: =1

                imgFinanceHeader As image:
                    Height: =If(App.Width >= 1024, 32, 24)
                    Image: ='Receipt--Streamline-Core'
                    LayoutMaxHeight: =0
                    LayoutMaxWidth: =0
                    LayoutMinHeight: =16
                    LayoutMinWidth: =16
                    Width: =If(App.Width >= 1024, 32, 24)
                    ZIndex: =1

                lblFinance As label:
                    Color: =RGBA(30, 30, 30, 1)
                    FontWeight: =FontWeight.Bold
                    Height: =Parent.Height
                    LayoutMaxHeight: =0
                    LayoutMaxWidth: =0
                    LayoutMinHeight: =16
                    LayoutMinWidth: =Self.Width
                    Size: =If(App.Width >= 1024, 18, 14)
                    Text: ="Finance Review"
                    Width: =If(App.Width >= 1024, 220, 180)
                    Wrap: =false
                    ZIndex: =2

            galFinanceMenu As gallery.galleryVertical:
                DelayItemLoading: =true
                FillPortions: =0
                Height: =CountRows(Self.AllItems) * Self.TemplateHeight
                Items: =Filter(colLandingMenu, Category = "Finance", IsVisible = true)
                Layout: =Layout.Vertical
                LayoutMaxHeight: =0
                LayoutMaxWidth: =0
                LayoutMinHeight: =16
                LayoutMinWidth: =16
                LoadingSpinner: =LoadingSpinner.Data
                TemplatePadding: =0
                TemplateSize: =btnFinance.Height + If(App.Width >= 1024, 30, 16)
                ZIndex: =2

                btnFinance As button:
                    Align: =Align.Left
                    BorderColor: =RGBA(163, 32, 53, 0.3)
                    BorderThickness: =1.5
                    Color: =RGBA(163, 32, 53, 1)
                    Fill: =RGBA(255, 255, 255, 1)
                    Height: =If(App.Width >= 1024, 100, 60)
                    HoverColor: =RGBA(163, 32, 53, 1)
                    HoverFill: =RGBA(163, 32, 53, 0.08)
                    OnSelect: |-
                        =Set(varAppMode, ThisItem.AppMode);
                        If(
                            ThisItem.AppMode in ["CashAdvance", "SalaryAdvance"], // CashAdvance와 SalaryAdvance 모두 처리
                            Set(varSelectedTab, 4);
                            Navigate('Cash Advance - List Screen', ScreenTransition.Fade),
                        
                            // [추가된 로직] Airfare 메뉴일 경우 Travel 화면으로 이동
                            ThisItem.AppMode = "AirfareAllowance",
                            Set(varSelectedTab, 4); 
                            Navigate('Travel - List Screen', ScreenTransition.Fade),
                        
                            // 기본 Expenses 화면 이동
                            Set(varSelectedTab, 2);
                            Navigate('Expenses - List Screen', ScreenTransition.Fade)
                        )
                    PaddingLeft: =20
                    PressedColor: =RGBA(255, 255, 255, 1)
                    PressedFill: =RGBA(163, 32, 53, 1)
                    RadiusBottomLeft: =12
                    RadiusBottomRight: =12
                    RadiusTopLeft: =12
                    RadiusTopRight: =12
                    Size: =If(App.Width >= 1024, 18, 14)
                    Text: =ThisItem.DisplayName
                    Width: =Parent.TemplateWidth - If(App.Width >= 1024, 80, 40)
                    X: =(Parent.TemplateWidth - Self.Width) / 2
                    Y: =(Parent.TemplateHeight - Self.Height) / 2
                    ZIndex: =1

            lblFinanceSpaceLabel As label:
                FillPortions: =1
                Height: =0
                LayoutMaxHeight: =0
                LayoutMaxWidth: =0
                LayoutMinHeight: =16
                LayoutMinWidth: =16
                Size: =21
                Text: =""
                Width: =Parent.Width
                ZIndex: =3

            lblContactFinance As label:
                Align: =Align.Center
                Color: =RGBA(0, 100, 255, 1)
                Font: =FontWeight.Semibold
                HoverColor: =RGBA(0, 50, 150, 1)
                LayoutMaxHeight: =0
                LayoutMaxWidth: =0
                LayoutMinHeight: =16
                LayoutMinWidth: =16
                OnSelect: |-
                    =Launch("mailto:" & varFinanceEmail)
                Size: =If(App.Width >= 1024, 14, 12)
                Text: |-
                    ="Contact Finance: " & Char(10) & Coalesce(varFinanceEmail, "Loading...")
                Width: =Parent.Width
                ZIndex: =4

        conHRSection As groupContainer.verticalAutoLayoutContainer:
            AlignInContainer: =AlignInContainer.Start
            BorderColor: =RGBA(0,0,0,0.05)
            BorderThickness: =1
            Fill: =RGBA(255, 255, 255, 1)
            Height: |-
                =Max(
                    conFinanceHeader.Height + (CountRows(galFinanceMenu.AllItems) * galFinanceMenu.TemplateHeight) + lblContactFinance.Height + 60,
                    conHRHeader.Height + (CountRows(galHRMenu.AllItems) * galHRMenu.TemplateHeight) + lblContactHR.Height + 60
                )
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGridColumnMinWidth: =0
            LayoutGridColumns: =6
            LayoutGridRowMinHeight: =0
            LayoutGridRows: =6
            LayoutMaxHeight: =0
            LayoutMaxWidth: =0
            LayoutMinHeight: =16
            LayoutMinWidth: =16
            LayoutMode: =LayoutMode.Auto
            PaddingBottom: =If(App.Width >= 1024, 30, 16)
            PaddingLeft: =If(App.Width >= 1024, 30, 16)
            PaddingRight: =If(App.Width >= 1024, 30, 16)
            PaddingTop: =If(App.Width >= 1024, 30, 16)
            RadiusBottomLeft: =16
            RadiusBottomRight: =16
            RadiusTopLeft: =16
            RadiusTopRight: =16
            Width: =(Parent.Width - Parent.LayoutGap) / 2
            ZIndex: =2

            conHRHeader As groupContainer.horizontalAutoLayoutContainer:
                FillPortions: =0
                Height: =If(App.Width >= 1024, 60, 40)
                LayoutAlignItems: =LayoutAlignItems.Center
                LayoutGap: =10
                LayoutGridColumnMinWidth: =0
                LayoutGridColumns: =6
                LayoutGridRowMinHeight: =0
                LayoutGridRows: =6
                LayoutJustifyContent: =LayoutJustifyContent.Center
                LayoutMaxHeight: =0
                LayoutMaxWidth: =0
                LayoutMinHeight: =16
                LayoutMinWidth: =16
                LayoutMode: =LayoutMode.Auto
                maximumHeight: =11360
                maximumWidth: =640
                PaddingBottom: =8
                PaddingLeft: =8
                PaddingRight: =8
                PaddingTop: =8
                Width: =Parent.Width
                X: =40
                Y: =40
                ZIndex: =1

                imgHRHeader As image:
                    Height: =If(App.Width >= 1024, 32, 24)
                    Image: ='User-Multiple-Group--Streamline-Core'
                    LayoutMaxHeight: =0
                    LayoutMaxWidth: =0
                    LayoutMinHeight: =16
                    LayoutMinWidth: =16
                    Width: =If(App.Width >= 1024, 32, 24)
                    ZIndex: =1

                lblHR As label:
                    Color: =RGBA(30, 30, 30, 1)
                    FontWeight: =FontWeight.Bold
                    Height: =Parent.Height
                    LayoutMaxHeight: =0
                    LayoutMaxWidth: =0
                    LayoutMinHeight: =16
                    LayoutMinWidth: =Self.Width
                    Size: =If(App.Width >= 1024, 18, 14)
                    Text: ="HR Review"
                    Width: =If(App.Width >= 1024, 180, 140)
                    Wrap: =false
                    ZIndex: =2

            galHRMenu As gallery.galleryVertical:
                DelayItemLoading: =true
                FillPortions: =0
                Height: =CountRows(Self.AllItems) * Self.TemplateHeight
                Items: =Filter(colLandingMenu, Category = "HR", IsVisible = true)
                Layout: =Layout.Vertical
                LayoutMaxHeight: =0
                LayoutMaxWidth: =0
                LayoutMinHeight: =16
                LayoutMinWidth: =16
                LoadingSpinner: =LoadingSpinner.Data
                TemplatePadding: =0
                TemplateSize: =btnFinance.Height + If(App.Width >= 1024, 30, 16)
                ZIndex: =2

                btnHR As button:
                    Align: =Align.Left
                    BorderColor: =RGBA(163, 32, 53, 0.3)
                    BorderThickness: =1.5
                    Color: =RGBA(163, 32, 53, 1)
                    Fill: =RGBA(255, 255, 255, 1)
                    Height: =If(App.Width >= 1024, 100, 60)
                    HoverColor: =RGBA(163, 32, 53, 1)
                    HoverFill: =RGBA(163, 32, 53, 0.08)
                    OnSelect: |-
                        =Set(varAppMode, ThisItem.AppMode);
                        If(
                            ThisItem.AppMode in ["CashAdvance", "SalaryAdvance"], // CashAdvance와 SalaryAdvance 모두 처리
                            Set(varSelectedTab, 4);
                            Navigate('Cash Advance - List Screen', ScreenTransition.Fade),
                        
                            // [추가된 로직] Airfare 메뉴일 경우 Travel 화면으로 이동
                            ThisItem.AppMode = "AirfareAllowance",
                            Set(varSelectedTab, 4); 
                            Navigate('Travel - List Screen', ScreenTransition.Fade),
                        
                            // 기본 Expenses 화면 이동
                            Set(varSelectedTab, 2);
                            Navigate('Expenses - List Screen', ScreenTransition.Fade)
                        )
                    PaddingLeft: =20
                    PressedColor: =RGBA(255, 255, 255, 1)
                    PressedFill: =RGBA(163, 32, 53, 1)
                    RadiusBottomLeft: =12
                    RadiusBottomRight: =12
                    RadiusTopLeft: =12
                    RadiusTopRight: =12
                    Size: =If(App.Width >= 1024, 18, 14)
                    Text: =ThisItem.DisplayName
                    Width: =Parent.TemplateWidth - If(App.Width >= 1024, 80, 40)
                    X: =(Parent.TemplateWidth - Self.Width) / 2
                    Y: =(Parent.TemplateHeight - Self.Height) / 2
                    ZIndex: =1

            lblHRSpaceLabel As label:
                FillPortions: =1
                Height: =0
                LayoutMaxHeight: =0
                LayoutMaxWidth: =0
                LayoutMinHeight: =16
                LayoutMinWidth: =16
                Size: =21
                Text: =""
                Width: =Parent.Width
                ZIndex: =3

            lblContactHR As label:
                Align: =Align.Center
                Color: =RGBA(0, 100, 255, 1)
                Font: =FontWeight.Semibold
                HoverColor: =RGBA(0, 50, 150, 1)
                LayoutMaxHeight: =0
                LayoutMaxWidth: =0
                LayoutMinHeight: =16
                LayoutMinWidth: =16
                OnSelect: |-
                    =Launch("mailto:" & varHREmail)
                Size: =If(App.Width >= 1024, 14, 12)
                Text: |-
                    ="Contact HR: " & Char(10) & Coalesce(varHREmail, "Loading...")
                Width: =Parent.Width
                ZIndex: =4

    GlobalLabels As Localization:
        DisplayMode: =DisplayMode.Edit
        Height: =350
        Width: =350
        X: =40
        Y: =40
        ZIndex: =6

