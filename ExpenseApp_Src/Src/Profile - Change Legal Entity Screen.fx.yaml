"'Profile - Change Legal Entity Screen' As screen":
    Fill: =RGBA(248, 248, 248, 1)
    OnVisible: |+
        =//Setting Confirmation Dialog Box Visibility to false 
        UpdateContext({locChangeLEDialogVisilibilty :false});
        
        Reset(legalEntityDropdown);
        
        //Using collection as we have to apply filter on the employee field which is virtual
        ClearCollect(
            colLegalEntity,
            'Legal entities (mserp)'
        );
        UpdateContext({currentCompany : LookUp('Legal entities (mserp)', Company = varSelectedLegalEntity).Name});

    GlobalLabels As Localization:
        DisplayMode: =DisplayMode.Edit
        Height: =350
        Width: =350
        X: =60
        Y: =60
        ZIndex: =1

    "'Change Legal Entity Top Header' As 'header-navigation-PolicyViolation'":
        BackButtonClicked: |-
            =If(IsBlank(gblScreenName),
            Navigate('Expenses - List Screen'),
            Navigate(gblScreenName)
            );
            Reset(legalEntityDropdown);
        Fill: =Color.White
        HeaderText: |-
            =GlobalLabels.Labels.'15062:LocalizedName,msdyn_ChangeLegalEntityLabel'
        Width: =App.Width

    Rectangle8 As rectangle:
        Fill: =Color.White
        Height: =changeLEDoneButton.Height * 1.6
        Width: =App.Width
        Y: =App.Height - Rectangle8.Height
        ZIndex: =2

    changeLEDoneButton As button:
        DisplayMode: |
            =If(
                IsBlank(legalEntityDropdown.Selected),
                DisplayMode.Disabled,
                DisplayMode.Edit
            )
        Fill: =RGBA(34, 102, 227, 1)
        Font: =Font.'Segoe UI'
        Height: =87
        OnSelect: |
            =UpdateContext({locChangeLEDialogVisilibilty : true})
        Size: =24
        Text: |-
            =GlobalLabels.Labels.'15062:LocalizedName,msdyn_DoneButtonLabel'
        Width: =Parent.Width -  Self.X * 2
        X: =40
        Y: =Parent.Height - Self.Height - 25
        ZIndex: =3

    ChangeLegalEntitySection As groupContainer.verticalAutoLayoutContainer:
        Height: =App.Height * 0.284
        LayoutDirection: =LayoutDirection.Vertical
        LayoutGridColumns: =6
        LayoutGridRows: =6
        LayoutMode: =LayoutMode.Auto
        Width: =App.Width
        Y: ='Change Legal Entity Top Header'.Height + 6
        ZIndex: =4

        currectLegalEntityLabel As label:
            DisplayMode: =DisplayMode.View
            Height: =ChangeLegalEntitySection.Height * 0.109
            LayoutMaxHeight: =
            LayoutMaxWidth: =
            LayoutMinHeight: =70
            LayoutMinWidth: =560
            Size: =18
            Text: |-
                =GlobalLabels.Labels.'15062:LocalizedName,msdyn_CurrentLegalEntityLabel'
            Width: =ChangeLegalEntitySection.Width
            ZIndex: =1

        currentLegalEntityValue As label:
            Height: =ChangeLegalEntitySection.Height * 0.218
            LayoutMaxHeight: =
            LayoutMaxWidth: =
            LayoutMinHeight: =70
            LayoutMinWidth: =560
            Size: =21
            Text: =currentCompany
            Width: =ChangeLegalEntitySection.Width
            ZIndex: =2

        selectedLegalEntityLabel As label:
            DisplayMode: =DisplayMode.View
            Height: =ChangeLegalEntitySection.Height * 0.109
            LayoutMaxHeight: =
            LayoutMaxWidth: =
            LayoutMinHeight: =70
            LayoutMinWidth: =560
            Size: =18
            Text: |-
                =GlobalLabels.Labels.'15062:LocalizedName,msdyn_SelectedLegalEntityLabel'
            Width: =ChangeLegalEntitySection.Width
            ZIndex: =3

        selectedLegalEntityValue As label:
            Color: |-
                =If(
                    IsBlank(legalEntityDropdown.Selected.Name),
                    RGBA(145, 145, 145, 1),
                    RGBA(0, 0, 0, 1)
                )
            Height: =ChangeLegalEntitySection.Height * 0.218
            LayoutMaxHeight: =
            LayoutMaxWidth: =
            LayoutMinHeight: =70
            LayoutMinWidth: =560
            Size: =21
            Text: |-
                =If(
                    IsBlank(legalEntityDropdown.Selected.Name),
                    GlobalLabels.Labels.'15062:LocalizedName,msdyn_NoEnititySelectedLabel',
                    legalEntityDropdown.Selected.Name
                )
            Width: =ChangeLegalEntitySection.Width
            ZIndex: =4

        legalEntityDropdown As combobox:
            AccessibleLabel: ="Select legal entity"
            BorderStyle: =BorderStyle.None
            DisplayFields: =["mserp_company"]
            FocusedBorderThickness: =0
            Height: =ChangeLegalEntitySection.Height * 0.186
            InputTextPlaceholder: |-
                =GlobalLabels.Labels.'15062:LocalizedName,msdyn_SearchPlaceholderLabel'
            Items: =Filter(colLegalEntity,IsEmployed = 'NoYes (mserp)'.Yes && Upper(Company)<> Upper(varSelectedLegalEntity))
            LayoutMaxHeight: =
            LayoutMaxWidth: =
            LayoutMinHeight: =70
            LayoutMinWidth: =575
            NoSelectionText: |-
                =GlobalLabels.Labels.'15062:LocalizedName,msdyn_SearchPlaceholderLabel'
            SearchFields: =["mserp_company"]
            SearchItems: =Search(Filter(colLegalEntity,IsEmployed='NoYes (mserp)'.Yes&&Upper(Company)<>Upper(varSelectedLegalEntity)),legalEntityDropdown.SearchText,mserp_company)
            SelectionFill: =gblParams.dropDownBorderColor
            SelectMultiple: =false
            Size: =21
            Width: =ChangeLegalEntitySection.Width
            ZIndex: =5

    confirmationDialogToChangeLE As cmp02_ConfirmationDialog:
        controlName: ="confirmationDialogToChangeLE"
        OnLeftButtonClick: |-
            =UpdateContext({locChangeLEDialogVisilibilty : false})
        OnRightButtonClick: |
            =Set(
                varSelectedLegalEntity,
                Upper(legalEntityDropdown.Selected.Company)
            );
            Clear(colGetProjectsBasedOnResourceCategory);
            ClearCollect(
                collectionICLE,
                ForAll(
                Split(LookUp('Legal entities (mserp)', Upper(Company) = varSelectedLegalEntity,IntercompanyLEs), ",") As legalEntityAlias,
                {
                    Value: Upper(legalEntityAlias.Value)
                }
                )
            );
            //setting default currency for the given legal entity
            If(
                !IsBlank(varSelectedLegalEntity),
                Set(
                    varDefaultCurrency,
                    LookUp(
                        'Legal entities (mserp)',
                        Company = varSelectedLegalEntity,
                        Currency
                    )
                )
            );
            //Changing the preferred legal entity to current selected legal entity
            Patch(
                'Expense mobile master data (mserp)',
                LookUp(
                    'Expense mobile master data (mserp)',
                    Email = User().Email
                ),
                {UserPreferredLegalEntity: varSelectedLegalEntity}
            );
            Reset(legalEntityDropdown);
            Set(
                gblNavigationDrawerVisibility,
                false
            );
            ClearCollect(
                labelTableLookUp,
                {
                    fieldName : "",
                    labelName : "",
                    localisedLabelName : "",
                    visible : true,
                    required : false
                }
            );
            Clear(labelTableLookUp);
            Clear(gblExpenseReportFieldVisibilityReImaginedLookup);
            Clear(gblExpenseReportFieldVisibilityLookup);
            Navigate('Expenses - List Screen');
        parmInDescriptionText: |
            =Substitute(Substitute(GlobalLabels.Labels.'15062:LocalizedName,msdyn_YourPreferredEntityWillBeChangedFrom', "$", currentCompany), "#", selectedLegalEntityValue.Text)
            //Concatenate("Your preferred entity will be changed from ",currentCompany," to ",selectedLegalEntityValue.Text)
        parmInHeaderText: ="Change legal entity?"
        parmInLeftButtonColor: =RGBA(34, 102, 227, 1)
        parmInLeftButtonText: |-
            =GlobalLabels.Labels.'15062:LocalizedName,msdyn_CancelLabel'
        parmInRightButtonColor: =RGBA(34, 102, 227, 1)
        parmInRightButtonText: ="Confirm"
        returnFocus: ="legalEntityDropdown"
        Visible: =locChangeLEDialogVisilibilty
        Y: =0
        ZIndex: =6

