    scr09_img_CreateReceipt As image:
        AccessibleLabel: ="Create new receipt"
        Height: =Self.Width
        Image: =CreateButton
        ImagePosition: =ImagePosition.Fill
        OnSelect: =Navigate('Receipts - Capture Receipt Screen')
        TabIndex: =0
