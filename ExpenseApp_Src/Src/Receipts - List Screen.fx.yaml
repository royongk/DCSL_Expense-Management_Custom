    ShadowElement_1 As groupContainer.horizontalAutoLayoutContainer:
        DropShadow: =DropShadow.ExtraBold
        Height: =App.Height
        LayoutGridColumnMinWidth: =0
        LayoutGridColumns: =6
        LayoutGridRowMinHeight: =0
        LayoutGridRows: =6
        LayoutMode: =LayoutMode.Auto
        Visible: =gblNavigationDrawerVisibility
