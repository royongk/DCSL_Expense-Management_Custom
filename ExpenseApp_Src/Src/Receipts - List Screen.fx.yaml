    scr09_chk_SelectAll_1 As checkbox:
        BorderStyle: =BorderStyle.None
        CheckboxBackgroundFill: =If(Self.Value, RGBA(34, 102, 227, 1),Color.White)
        CheckboxBorderColor: =RGBA(34, 102, 227, 1)
        CheckboxSize: =42
        CheckmarkFill: =Color.White
        Color: =RGBA(34, 102, 227, 1)
        Font: =Font.'Segoe UI'
        FontWeight: =FontWeight.Lighter
        Height: =35
        OnCheck: |-
            =Clear(collSelectedReceiptIds);
            ForAll(
                scr09_glr_ReceiptGrid.AllItems,
                Collect(
                    collSelectedReceiptIds,
                    {receiptId : ThisRecord.EntRecId}
                )
            )
        OnSelect: =
        OnUncheck: =Clear(collSelectedReceiptIds);
        Reset: =varCntSelect
        Size: =21
        Text: =Concatenate("All receipts ", If(Self.Value, "selected", "unselected"))
        VerticalAlign: =VerticalAlign.Bottom
        Visible: =varCntSelect
        Width: =43
        X: =18
        Y: =116
        ZIndex: =9

    "scr09_hdr_TopHeader As 'main-app-header'":
        firstIcon: =If(varCntReceiptGridView, icnTileselected, icnListSelected)
        firstIconAccessibleLabel: |
            =If(varCntReceiptGridView, "Select to open Receipt grid view", "Select to open Receipt list view")
        firstIconAction: |+
            =If(
                varCntReceiptGridView, 
                UpdateContext({varCntReceiptGridView:false});
                UpdateContext({varCntReceiptListView:true}),
                UpdateContext({varCntReceiptGridView:true});
                UpdateContext({varCntReceiptListView:false})
            )
            
        homeIcon: =homeIcon
        homeIconAccessibleLabel: ="Navigate Home"
        homeIconAction: =Navigate('Main Screen', ScreenTransition.Fade)
        OnSelectButton: |-
            =Set(
                gblNavigationDrawerVisibility,
                true
            );
            Set(
                gblScreenName,
                'Receipts - List Screen'
            );
            Refresh('Expense mobile notifications (mserp)');
            ClearCollect(
                colExpenseNoticationInfo,
                ForAll(
                    Filter('Expense mobile notifications (mserp)',NotifiedEmailId = User().Email) As ExpenseNotification,
                    {
                        RecId: ExpenseNotification.EntRecId,
                        ReadMessage: ExpenseNotification.Read
                    }
                )
            );
        paramAvatar: =Coalesce(userImage, blankImage)
        paramTitle: |-
            =GlobalLabels.Labels.'15062:LocalizedName,msdyn_ReceiptsLabel'
        refreshIconAction: |+
            =Set(
                varSelectedTab,
                1
            );
            
            Refresh('Expense Mobile Unattached Document Entity (mserp)');
            Concurrent(
                Set(
                    varFileFormat,
                    Blank()
                ),
                Set(
                    varSelectedReceiptNumber,
                    Blank()
                )
            )
            
        secondIcon: =If(CountRows(collSelectedReceiptIds)=0, DeleteIconDisabled,DeleteIconEnabled)
        secondIconAccessibleLabel: =If(Self.secondIcon = DeleteIconEnabled, "Delete receipts", "Disabled delete")
        secondIconAction: |-
            =UpdateContext({varCntDelete: false});
            If(
                CountRows(collSelectedReceiptIds) > 0,
                UpdateContext({varCntDelete: true}),
                UpdateContext({varCntDelete: false})
            )
        thirdIcon: =If(varCntSelect,SelectorCloseIcon,SelectorIcon)
        thirdIconAccessibleLabel: =If(Self.thirdIcon = SelectorIcon, "Multiselect receipts", "Cancel")
        thirdIconAction: |-
            =If(
                varCntSelect,
                UpdateContext({varCntSelect: false});
                Clear(collSelectedReceiptIds),
                UpdateContext({varCntSelect: true})
            )
        Visible: =true
        Width: =Parent.Width
        Y: =1
        ZIndex: =10

    scr09_DeleteConfirmationDialog_1 As cmp02_ConfirmationDialog:
        controlName: ="scr09_DeleteConfirmationDialog_1"
        OnLeftButtonClick: =true
        OnRightButtonClick: ="텍스트"
        parmInDescriptionText: |-
            =GlobalLabels.Labels.'15062:LocalizedName,msdyn_DeleteReceiptsConfirmationTextLabel'
        parmInHeaderText: |-
            =GlobalLabels.Labels.'15062:LocalizedName,msdyn_DeleteSelectedReceiptsHeaderLabel'
        parmInLeftButtonColor: =RGBA(34, 102, 227, 1)
        parmInLeftButtonText: |-
            =GlobalLabels.Labels.'15062:LocalizedName,msdyn_CancelLabel'
        parmInRightButtonColor: =RGBA(195, 39, 39, 1)
        parmInRightButtonText: |-
            =GlobalLabels.Labels.'15062:LocalizedName,msdyn_DeleteLabel'
        returnFocus: ="scr09_hdr_TopHeader"
        Visible: =varCntDelete
        Y: =0
        ZIndex: =11

