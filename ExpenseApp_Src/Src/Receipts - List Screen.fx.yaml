"'Receipts - List Screen' As screen.'phoneBrowseLayout_ver3.0'":
    Fill: =Color.White
    OnVisible: |
        =If(varCntSelect <> true,
        UpdateContext({varCntSelect: false})
        );
        UpdateContext({varAtctioButtonReceiptVisible: false});
        Set(
            varSelectedTab,
            1
        );
        UpdateContext({varCntReceiptListView: true});
        UpdateContext({varCntReceiptGridView: false});
        Set(varDeletionStarted, false);
        Concurrent(
            Set(
                varFileFormat,
                Blank()
            ),
            Set(
                varSelectedReceiptNumber,
                Blank()
            ),
            Set(
                varReceiptImage,
                Blank()
            )
        );
        Reset(scr09_glr_ReceiptList);
        Reset(scr09_glr_ReceiptGrid);

    emptyStateComponent_2 As emptyStateComponent:
        subTitle: |-
            =GlobalLabels.Labels.'15062:LocalizedName,msdyn_AddaReceiptToAttachToAnExpenseLabel'
        title: |-
            =GlobalLabels.Labels.'15062:LocalizedName,msdyn_NothingHereYetLabel'
        Visible: =!scr09_glr_ReceiptGrid.Visible && !scr09_glr_ReceiptList.Visible
        X: |
            =(Parent.Width - Self.Width)/2
        Y: =scr09_glr_ReceiptGrid.Y + (Parent.Height - scr09_hdr_TopHeader.Height - scr09_cmp_Footer_1.Height - Self.Height)/2

    scr09_cmp_Footer_1 As cmp_Footer_5:
        ApprovalsText: |-
            =If(
                varAppMode = "CashAdvance",
                "Cash",
                If(
                    varAppMode = "AirfareAllowance",
                    "Travel",
                    GlobalLabels.Labels.'15062:LocalizedName,msdyn_ApprovalsLabel'
                )
            )
        DisplayMode: =!IsBlank(varSelectedLegalEntity)
        ExpensesText: |-
            =GlobalLabels.Labels.'15062:LocalizedName,msdyn_ExpensesLabel'
        OnApprovalsButtonClick: |-
            =If(
                varAppMode = "CashAdvance",
                Set(varSelectedTab, 4);
                Navigate('Cash Advance - List Screen', ScreenTransition.Fade),
                If(
                    varAppMode = "AirfareAllowance",
                    Set(varSelectedTab, 4);
                    Navigate('Travel - List Screen', ScreenTransition.Fade),
                    Set(varSelectedTab, 4); Navigate('Approvals - List Screen', ScreenTransition.Fade, {varFiltersApplied:false, varSelectedProjects:Blank(), varSelectedUsers: Blank(), varcntSelectedStatus:1});
                    Reset(scr25_cmb_Project);
                    Reset(scr25_cmb_User)
                )
            )
        OnExpensesButtonClick: =Set(varSelectedTab, 2); Navigate('Expenses - List Screen',ScreenTransition.Fade)
        OnReportsButtonClick: |-
            =Set(varSelectedTab, 3); Navigate('Reports - List Screen', ScreenTransition.Fade ,{varcntSelectedStatus:1})
        paramInDefaultAppMode: =varAppMode
        paramInDefaultSelectedTab: =1
        ReportText: |-
            =GlobalLabels.Labels.'15062:LocalizedName,msdyn_ExpenseReportsLabel'
        SelectedTab: =1
        Visible: =!varCntSelect
        Y: =App.Height - Self.Height
        ZIndex: =2

    "scr09_glr_ReceiptGrid As gallery.'BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0'":
        '#CopilotOverlayLabel': ="Filtered"
        AccessibleLabel: ="Grid of unattached receipts"
        Default: ={}
        DelayItemLoading: =true
        Height: =scr09_cmp_Footer_1.Y - Self.Y
        Items: =Filter('Expense Mobile Unattached Document Entity (mserp)', IsReceiptValid = 'NoYes (mserp)'.Yes)
        Layout: =Layout.Vertical
        LoadingSpinner: =LoadingSpinner.Data
        OnSelect: |-
            =Set(
                varFileFormat,
                ThisItem.FileExtension
            );
            Set(
                varSelectedReceiptNumber,
                ThisItem.EntRecId
            );
            Set(
                varReceiptImage,
                ThisItem.CapturedDocument
            );
            Navigate('Receipts - Select Expense Screen');
        TemplatePadding: =10
        TemplateSize: =300
        Visible: =varCntReceiptListView && Self.AllItemsCount > 0
        Width: =Parent.Width
        WrapCount: =2
        Y: =If(varCntSelect,scr09_hdr_TopHeader.Height+scr09_shp_Rectangle_1.Height,scr01_hdr_TopHeader.Height)
        ZIndex: =3

        Container3_2 As groupContainer.verticalAutoLayoutContainer:
            DropShadow: =DropShadow.Regular
            Height: =Parent.TemplateHeight
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGridColumnMinWidth: =0
            LayoutGridColumns: =6
            LayoutGridRowMinHeight: =0
            LayoutGridRows: =6
            LayoutMode: =LayoutMode.Auto
            RadiusBottomLeft: =10
            RadiusBottomRight: =10
            RadiusTopLeft: =10
            RadiusTopRight: =10
            Width: =Parent.TemplateWidth
            ZIndex: =1

            Image2_2 As image:
                AccessibleLabel: =
                Height: =220
                Image: |-
                    =If(
                        ThisItem.FileExtension in ["jpg", "bmp", "jpeg", "png", "heic", "tif", "tiff", "raw"] && !IsBlank(ThisItem.CapturedDocument),
                        ThisItem.CapturedDocument,
                        ThisItem.FileExtension in ["xlsx", "xls"],
                        IconExcel,
                        ThisItem.FileExtension in ["docx", "doc"],
                        IconWord,
                        ThisItem.FileExtension = "pdf",
                        IconPDF,
                        ThisItem.FileExtension = "txt",
                        IconTxt,
                        IconMail
                    )
                ImagePosition: =ImagePosition.Center
                LayoutMaxHeight: =
                LayoutMaxWidth: =
                LayoutMinHeight: =Parent.Height - Container4_2.LayoutMinHeight
                LayoutMinWidth: =Parent.Width
                Width: =Parent.Width
                ZIndex: =1

            Container4_2 As groupContainer.horizontalAutoLayoutContainer:
                Height: =80
                LayoutGridColumnMinWidth: =0
                LayoutGridColumns: =6
                LayoutGridRowMinHeight: =0
                LayoutGridRows: =6
                LayoutMaxHeight: =
                LayoutMaxWidth: =
                LayoutMinHeight: =80
                LayoutMinWidth: =250
                LayoutMode: =LayoutMode.Auto
                ZIndex: =2

                shpBorder_7 As rectangle:
                    Fill: =Color.Transparent
                    Height: =Parent.Height
                    LayoutMaxHeight: =
                    LayoutMaxWidth: =
                    Width: |
                        =25
                    ZIndex: =1

                scr09_ico_Attach_7 As image:
                    AlignInContainer: =AlignInContainer.Center
                    BorderColor: =RGBA(34, 102, 227, 1)
                    DisabledBorderColor: =RGBA(0, 134, 208, 1)
                    DisplayMode: |
                        =DisplayMode.Edit
                    Fill: =RGBA(255, 255, 255, 1)
                    Height: =24
                    Image: =AttachIconEnabled
                    LayoutMaxHeight: =
                    LayoutMaxWidth: =
                    LayoutMinHeight: =320
                    LayoutMinWidth: =320
                    OnSelect: =Select(scr09_shp_SelectRegion_5)
                    Visible: |
                        =!varCntSelect
                    Width: =24
                    X: =
                    Y: =
                    ZIndex: =2

                scr09_chk_Select_5 As checkbox:
                    AlignInContainer: =AlignInContainer.Center
                    BorderStyle: =BorderStyle.None
                    CheckboxBackgroundFill: =If(Self.Value, RGBA(34, 102, 227, 1),Color.White)
                    CheckboxBorderColor: =RGBA(34, 102, 227, 1)
                    CheckboxSize: =42
                    CheckmarkFill: =Color.White
                    Color: =RGBA(34, 102, 227, 1)
                    Default: =!IsEmpty(Filter(collSelectedReceiptIds, receiptId = ThisItem.EntRecId))
                    Font: =Font.'Segoe UI'
                    FontWeight: =FontWeight.Lighter
                    Height: =35
                    LayoutMaxHeight: =
                    LayoutMaxWidth: =
                    LayoutMinHeight: =85
                    LayoutMinWidth: =280
                    OnCheck: |-
                        =Collect(
                            collSelectedReceiptIds, 
                            {receiptId : ThisItem.EntRecId}
                        )
                    OnSelect: =
                    OnUncheck: =RemoveIf(collSelectedReceiptIds, receiptId = ThisItem.EntRecId)
                    Reset: =varCntSelect Or scr09_chk_SelectAll_1.Value
                    Size: =21
                    Text: =Concatenate(ThisItem.Description, If(Self.Value, " selected", " unselected"))
                    VerticalAlign: =VerticalAlign.Bottom
                    Visible: =varCntSelect
                    Width: =43
                    X: =55
                    Y: =
                    ZIndex: =3

                scr09_lbl_AttachList_3 As label:
                    AlignInContainer: =AlignInContainer.Center
                    Color: =RGBA(34, 102, 227, 1)
                    FillPortions: =1
                    Font: =Font.'Segoe UI'
                    LayoutMaxHeight: =
                    LayoutMaxWidth: =
                    LayoutMinHeight: =70
                    LayoutMinWidth: =200
                    LineHeight: =22
                    OnSelect: =Select(scr09_shp_SelectRegion_5)
                    PaddingBottom: =0
                    PaddingLeft: =15
                    PaddingRight: =0
                    PaddingTop: =0
                    Size: =18
                    TabIndex: =0
                    Text: =ThisItem.mserp_filename
                    Width: =244
                    Wrap: =false
                    X: =52
                    Y: =
                    ZIndex: =4

        scr09_shp_SelectRegion_5 As rectangle:
            AccessibleLabel: =ThisItem.Description
            Fill: =RGBA(0, 0, 0, 0)
            Height: =Parent.TemplateHeight - Container4_2.Height
            OnSelect: |-
                =If(
                    varCntSelect,
                    If(
                        IsBlank(LookUp(collSelectedReceiptIds, receiptId = ThisItem.EntRecId)),
                        Collect(
                            collSelectedReceiptIds, 
                            {receiptId : ThisItem.EntRecId}
                        ),
                        RemoveIf(collSelectedReceiptIds, receiptId = ThisItem.EntRecId)
                    ),
                    Select(Parent)
                )
            Visible: =false
            Width: =305
            ZIndex: =3

        scr09_shp_GridImageRegion As rectangle:
            AccessibleLabel: =ThisItem.Description
            Fill: =RGBA(0, 0, 0, 0)
            Height: =Parent.TemplateHeight - Container4_2.Height
            OnSelect: |-
                =Set(
                    varFileFormat,
                    ThisItem.FileExtension
                );
                Set(
                    varSelectedReceiptNumber,
                    ThisItem.EntRecId
                );
                Set(
                    varReceiptImage,
                    ThisItem.CapturedDocument
                );
                Navigate('Receipts - View Receipt Screen',ScreenTransition.Fade,{varCntSelect:varCntSelect});
            Width: =Parent.TemplateWidth
            ZIndex: =4

