        Color: =RGBA(110, 110, 110, 1)
        Font: =Font.'Segoe UI'
        Height: =35
        Size: =16
        Text: |-
            =Substitute(GlobalLabels.Labels.'15062:LocalizedName,msdyn_SelectedLabel',"$",CountRows(collSelectedReceiptIds))
        Visible: =varCntSelect
        Width: =147*1
        X: =Parent.Width - Self.Width - 25
        Y: =116*1
        ZIndex: =7

    scr09_lbl_SelectAll_1 As label:
