"'Reports - Attach Expenses Screen' As screen":
    Fill: =RGBA(229, 229, 229, 1)
    OnVisible: |-
        =Clear(colExpensesToBeAttached);
        
        // 변수 초기화
        UpdateContext({varCntBack:false});
        
        // ctxTargetPurpose 값의 존재 여부 및 varAppMode에 따라 쿼리 분기 처리 (위임 문제 해결)
        If(
            IsBlank(ctxTargetPurpose),
            
            // 1. ctxTargetPurpose가 비어있을 때 (전체 표시)
            ClearCollect(
                dsExpenses,
                SortByColumns(
                    Filter(
                        'DCSL Expense Line Expense Moblie Entity (mserp)',
                        'Company Code' = varSelectedLegalEntity && 
                        'Approval status' = 'Document status (mserp)'.Draft && 
                        IsBlank('Expense report number (mserp_expnumber)') && 
                        // [핵심 추가] 전달받은 사용자 ID로 필터링
                        'Employee (mserp_creatingworker)' = ctxSelectedWorkerID &&
                        ('Expense line type' = 'Expense line type (mserp)'.Default || 'Expense line type' = 'Expense line type (mserp)'.'Itemized header')
                    ),
                    "mserp_transdate", 
                    SortOrder.Descending
                )
            ),
        
            // 2. ctxTargetPurpose가 값이 있을 때
            If(
                varAppMode = "AirfareAllowance",
                
                // 2-A. varAppMode가 "AirfareAllowance"인 경우
                ClearCollect(
                    dsExpenses,
                    SortByColumns(
                        Filter(
                            'DCSL Expense Line Expense Moblie Entity (mserp)',
                            'Company Code' = varSelectedLegalEntity && 
                            'Approval status' = 'Document status (mserp)'.Draft && 
                            IsBlank('Expense report number (mserp_expnumber)') && 
                            'Employee (mserp_creatingworker)' = ctxSelectedWorkerID &&
                            ('Expense line type' = 'Expense line type (mserp)'.Default || 'Expense line type' = 'Expense line type (mserp)'.'Itemized header') &&
                            'Expense category (mserp_costtype)' = ctxTargetPurpose // *주의: 선택(Choice) 열이라면 'Item or Service'.Value = ctxTargetPurpose 로 수정 필요
                        ),
                        "mserp_transdate", 
                        SortOrder.Descending
                    )
                ),
                
                // 2-B. varAppMode가 "AirfareAllowance"가 아닌 경우
                ClearCollect(
                    dsExpenses,
                    SortByColumns(
                        Filter(
                            'DCSL Expense Line Expense Moblie Entity (mserp)',
                            'Company Code' = varSelectedLegalEntity && 
                            'Approval status' = 'Document status (mserp)'.Draft && 
                            IsBlank('Expense report number (mserp_expnumber)') && 
                            'Employee (mserp_creatingworker)' = ctxSelectedWorkerID &&
                            ('Expense line type' = 'Expense line type (mserp)'.Default || 'Expense line type' = 'Expense line type (mserp)'.'Itemized header') &&
                            'Expense Type' = ctxTargetPurpose // *주의: 선택(Choice) 열이라면 'Expense Type'.Value 로 수정 필요
                        ),
                        "mserp_transdate", 
                        SortOrder.Descending
                    )
                )
            )
        );
        
        // 나머지 컬렉션 초기화 로직 유지
        ClearCollect(colExpensesToBeAttached, colAttachedExpenses);
        ClearCollect(colAttachedExpensesForReport, colAttachedExpenses);

    scr18_btn_Done As button:
        Fill: =RGBA(34, 102, 227, 1)
        Height: =88
        OnSelect: |-
            =// 1. 사용자가 눈으로 보고 체크한 항목을 첨부 컬렉션에 임시 확정
            ClearCollect(colAttachedExpenses, colExpensesToBeAttached);
            
            // 💡 [핵심 추가] 1-1. 전달받은 Cash Advance ID가 존재할 경우, 선택된 개별 라인에 매핑 ID 저장
            If(
                !IsBlank(ctxTargetCashAdvanceRecId),
                ForAll(
                    colAttachedExpenses As CurrentExpenseItem,
                    Patch(
                        'DCSL Expense Line Expense Moblie Entity (mserp)',
                        LookUp(
                            'DCSL Expense Line Expense Moblie Entity (mserp)', 
                            'Expense transaction number (mserp_exptransnumber)' = CurrentExpenseItem.'Expense transaction number (mserp_exptransnumber)'
                        ),
                        {
                            'Mapped To Requisition Line': ctxTargetCashAdvanceRecId
                        }
                    )
                )
            );
            
            // 2. ✨ [핵심 방어막] 보고서 번호를 고정 변수에 저장 (LookUp 실패 시 Blank가 되는 현상 방지)
            UpdateContext({locCurrentReportNum: varSelectedReport.'Expense report number'});
            
            If(
                IsBlank(locCurrentReportNum),
                Notify("Error: Expense Report Number is missing.", NotificationType.Error, gblParams.notificationTime),
                
                // 3. F&O 백엔드로 쉼표로 연결된 문자열(DEEXExpTransNumber) 전송 (헤더-라인 연결 트리거)
                Clear(varError);
                IfError(
                    Patch(
                        'DCSL Expense Moblie Report (mserp)',
                        LookUp('DCSL Expense Moblie Report (mserp)','Expense report number' = locCurrentReportNum),
                        {
                            ExpTransNumber: Concat(colAttachedExpenses, 'Expense transaction number (mserp_exptransnumber)', ","),
                            Purpose: Coalesce(ctxTargetPurpose, varSelectedReport.Purpose),
                            Location: varSelectedReport.Location
                        }
                    ),
                    First(ClearCollect(varError, Substitute(Match(FirstError.Details.HttpResponse, """message"":""([^""]*)""").FullMatch, """message"":", "")))
                );
            
                // 4. 에러 확인 후 데이터 동기화 및 네비게이션 실행
                If(
                    !(IsBlank(First(varError).Value) || First(varError).Value = ""),
                    // 에러 발생 시 알림 표시
                    Notify(Substitute(First(varError).Value, """", ""), NotificationType.Error, gblParams.notificationTime),
                    
                    // --- 에러 없이 정상 처리되었을 때의 후속 작업 ---
                    
                    // (A) 백엔드 데이터 갱신
                    Refresh('DCSL Expense Line Expense Moblie Entity (mserp)');
                    Set(varSelectedReport, LookUp('DCSL Expense Moblie Report (mserp)', 'Expense report number' = locCurrentReportNum));
                    
                    // (B) ✨ [199개 버그 차단] Blank가 아닐 때만 서버에서 필터링해서 가져오기
                    If(
                        !IsBlank(locCurrentReportNum),
                        ClearCollect(
                            colAttachedExpensesForReport,
                            Filter(
                                'DCSL Expense Line Expense Moblie Entity (mserp)',
                                'Expense report number (mserp_expnumber)' = locCurrentReportNum 
                                && 'Expense line type' <> 'Expense line type (mserp)'.'Itemized line'
                            )
                        );
                        
                        // 💡 F&O 백엔드의 비동기 처리 지연으로 인해 서버에서 아직 0건이 오더라도,
                        // 로컬에서 이미 선택해둔 데이터(colAttachedExpenses)를 유지하여 UI가 깜빡이는 것을 방지합니다.
                        If(
                            CountRows(colAttachedExpensesForReport) > 0,
                            ClearCollect(colAttachedExpenses, colAttachedExpensesForReport)
                        )
                    );
                    
                    Clear(varError);
                    
                    // (C) ✨ [가장 중요한 순서 변경] 모든 데이터 처리가 끝난 뒤에 화면을 이동합니다.
                    If(
                        varCntBack_scr17,
                        Navigate('Reports - Edit Screen', ScreenTransition.None),
                        Navigate('Reports - View Attached Expenses Screen', ScreenTransition.None)
                    )
                )
            );
        Size: =24
        Text: |-
            =GlobalLabels.Labels.'15062:LocalizedName,msdyn_DoneButtonLabel'
        Width: =Parent.Width -  Self.X*2
        X: =40
        Y: =Parent.Height - Self.Height- 25
        ZIndex: =1

    "scr18_glr_SelectExpenses_1 As gallery.'BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0'":
        '#CopilotOverlayLabel': ="Filtered"
        DelayItemLoading: =true
        Fill: =Color.White
        Height: =scr18_btn_Done.Y - Self.Y - 25
        Items: =dsExpenses
        Layout: =Layout.Vertical
        LoadingSpinner: =LoadingSpinner.Data
        OnSelect: |
            =
            //set details for the next screen 
            Concurrent(
                Set(
                    varIsCreate,
                    false
                ),
                Set(
                    varReceiptImage,
                    Blank()
                )
            );
            //assign the expense to a varSelectedExpenseDoc
            Set(
                varSelectedExpenseDoc,
                LookUp('DCSL Expense Line Expense Moblie Entity (mserp)','Expense transaction number (mserp_exptransnumber)' = ThisItem.'Expense transaction number (mserp_exptransnumber)')
            );
            
            //collect policy violations
            If(
                varSelectedExpenseDoc.PolicyViolationCount,
                ClearCollect(
                    colPolViolations,
                    Split(varSelectedExpenseDoc.PolicyViolationErrorMessage, "~|~")
                );
                UpdateContext({varMaxViolationLevel : varSelectedExpenseDoc.PolicyViolationsLevel});
                UpdateContext({varNumViolation : varSelectedExpenseDoc.PolicyViolationCount}),
                Clear(colPolViolations);
                UpdateContext({varMaxViolationLevel : 0});
                UpdateContext({varNumViolation : 0})
            );
            //set receipt image if attachedDocuRefRecId is not 0
            If(
                varSelectedExpenseDoc.AttachedReceiptId <> "0",
                Set(
                    varReceiptImage,
                    LookUp('Expense Mobile Attached Document Entity (mserp)', EntRecId = Value(varSelectedExpenseDoc.AttachedReceiptId),CapturedDocument)
                );
                Set(
                    varFileFormat,
                    LookUp('Expense Mobile Attached Document Entity (mserp)', EntRecId = Value(varSelectedExpenseDoc.AttachedReceiptId), FileExtension)
                );
                Set(
                    varSelectedReceiptNumber,
                    Blank()
                )
            );
            
            Navigate('Expenses - Edit Screen', ScreenTransition.None, {varNavigatedFrom : "scr18", varMaxViolationLevel : varMaxViolationLevel, varNumViolation: varNumViolation})
        TemplatePadding: =0
        TemplateSize: =150
        Width: =Parent.Width
        Y: =scr18_shp_Rectangle.Y + scr18_shp_Rectangle.Height
        ZIndex: =2

