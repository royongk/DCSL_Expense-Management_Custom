"'Reports - Attach Expenses Screen' As screen":
    Fill: =RGBA(229, 229, 229, 1)
    OnVisible: |-
        =// 변수 초기화
        UpdateContext({varCntBack:false});
        
        // ctxTargetPurpose 값의 존재 여부 및 varAppMode에 따라 쿼리 분기 처리 (위임 문제 해결)
        If(
            IsBlank(ctxTargetPurpose),
            
            // 1. ctxTargetPurpose가 비어있을 때 (전체 표시)
            ClearCollect(
                dsExpenses,
                SortByColumns(
                    Filter(
                        'Expense lines (mserp)',
                        'Company (mserp_company)' = varSelectedLegalEntity && 
                        'Approval status' = 'Document status (mserp)'.Draft && 
                        IsBlank('Expense report number (mserp_expnumber)') && 
                        ('Expense line type' = 'Expense line type (mserp)'.Default || 'Expense line type' = 'Expense line type (mserp)'.'Itemized header')
                    ),
                    "mserp_transdate", 
                    SortOrder.Descending
                )
            ),
        
            // 2. ctxTargetPurpose가 값이 있을 때
            If(
                varAppMode = "AirfareAllowance",
                
                // 2-A. varAppMode가 "AirfareAllowance"인 경우
                ClearCollect(
                    dsExpenses,
                    SortByColumns(
                        Filter(
                            'Expense lines (mserp)',
                            'Company (mserp_company)' = varSelectedLegalEntity && 
                            'Approval status' = 'Document status (mserp)'.Draft && 
                            IsBlank('Expense report number (mserp_expnumber)') && 
                            ('Expense line type' = 'Expense line type (mserp)'.Default || 'Expense line type' = 'Expense line type (mserp)'.'Itemized header') &&
                            'Expense category (mserp_costtype)' = ctxTargetPurpose // *주의: 선택(Choice) 열이라면 'Item or Service'.Value = ctxTargetPurpose 로 수정 필요
                        ),
                        "mserp_transdate", 
                        SortOrder.Descending
                    )
                ),
                
                // 2-B. varAppMode가 "AirfareAllowance"가 아닌 경우
                ClearCollect(
                    dsExpenses,
                    SortByColumns(
                        Filter(
                            'Expense lines (mserp)',
                            'Company (mserp_company)' = varSelectedLegalEntity && 
                            'Approval status' = 'Document status (mserp)'.Draft && 
                            IsBlank('Expense report number (mserp_expnumber)') && 
                            ('Expense line type' = 'Expense line type (mserp)'.Default || 'Expense line type' = 'Expense line type (mserp)'.'Itemized header') &&
                            'Expense Type' = ctxTargetPurpose // *주의: 선택(Choice) 열이라면 'Expense Type'.Value 로 수정 필요
                        ),
                        "mserp_transdate", 
                        SortOrder.Descending
                    )
                )
            )
        );
        
        // 나머지 컬렉션 초기화 로직 유지
        ClearCollect(colExpensesToBeAttached, colAttachedExpenses);
        ClearCollect(colAttachedExpensesForReport, colAttachedExpenses);

    scr18_btn_Done As button:
        Fill: =RGBA(34, 102, 227, 1)
        Height: =88
        OnSelect: |
            =//on pressing done, we navigate back to previous screen having updated the colAttachedExpenses based on whether checked or //unchecked
            ClearCollect(
                colAttachedExpenses,
                colExpensesToBeAttached
            );
            //colAttachedExpenses now contains those expenses which remain to be attached and those which are attached already
            //any expense not part of this list will be unattached from the chosen report
            IfError(
                Patch(
                    'Expense reports (mserp)',
                    LookUp('Expense reports (mserp)','Expense report number' = varSelectedReport.'Expense report number'),
                    {
                        ExpTransNumber: Concat(colAttachedExpenses, 'Expense transaction number (mserp_exptransnumber)', ","),
                        Purpose: If(IsBlank(ComboBox_Purpose.Selected.'Purpose (mserp_value)'),If(IsBlank(ComboBox_Purpose.SearchText),varSelectedReport.Purpose,ComboBox_Purpose.SearchText),ComboBox_Purpose.Selected.'Purpose (mserp_value)'),
                        Location : If(IsBlank(ComboBox_Location.Selected.Location),If(IsBlank(ComboBox_Location.SearchText),varSelectedReport.Location,ComboBox_Location.SearchText),ComboBox_Location.Selected.Location),
                        Description: scr17_txt_Description_1.Text
                    }
                ),
                First( ClearCollect( varError, Substitute( Match(FirstError.Details.HttpResponse, """message"":""([^""]*)""").FullMatch, """message"":", "" ) ) )
            );
            If(
                !(IsBlank(First(varError).Value) || First(varError).Value = ""),
                Notify(
                    Substitute(First(varError).Value, """", ""),
                    NotificationType.Error,
                    gblParams.notificationTime
                ),
                If(
                    varCntBack_scr17,
                    Navigate('Reports - Edit Screen'),
                    Navigate('Reports - View Attached Expenses Screen')
                )
            );
            UpdateContext({varReportNumber : varSelectedReport.'Expense report number'});
            Set(
                varSelectedReport,
                LookUp('Expense reports (mserp)','Expense report number' = varReportNumber)
            );
            ClearCollect(
                colAttachedExpensesForReport,
                Filter(
                    'Expense lines (mserp)',
                    'Expense report number (mserp_expnumber)' = varSelectedReport.'Expense report number' 
                    && 'Expense line type' <> 'Expense line type (mserp)'.'Itemized line'
                )
            );
            Refresh('Expense lines (mserp)');
            ClearCollect(
                colAttachedExpenses,
                colAttachedExpensesForReport
            );
            Clear(varError)
        Size: =24
        Text: |-
            =GlobalLabels.Labels.'15062:LocalizedName,msdyn_DoneButtonLabel'
        Width: =Parent.Width -  Self.X*2
        X: =40
        Y: =Parent.Height - Self.Height- 25
        ZIndex: =1

    "scr18_glr_SelectExpenses_1 As gallery.'BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0'":
        '#CopilotOverlayLabel': ="Filtered"
        DelayItemLoading: =true
        Fill: =Color.White
        Height: =scr18_btn_Done.Y - Self.Y - 25
        Items: =dsExpenses
        Layout: =Layout.Vertical
        LoadingSpinner: =LoadingSpinner.Data
        OnSelect: |
            =
            //set details for the next screen 
            Concurrent(
                Set(
                    varIsCreate,
                    false
                ),
                Set(
                    varReceiptImage,
                    Blank()
                )
            );
            //assign the expense to a varSelectedExpenseDoc
            Set(
                varSelectedExpenseDoc,
                LookUp('Expense lines (mserp)','Expense transaction number (mserp_exptransnumber)' = ThisItem.'Expense transaction number (mserp_exptransnumber)')
            );
            
            //collect policy violations
            If(
                varSelectedExpenseDoc.PolicyViolationCount,
                ClearCollect(
                    colPolViolations,
                    Split(varSelectedExpenseDoc.PolicyViolationErrorMessage, "~|~")
                );
                UpdateContext({varMaxViolationLevel : varSelectedExpenseDoc.PolicyViolationsLevel});
                UpdateContext({varNumViolation : varSelectedExpenseDoc.PolicyViolationCount}),
                Clear(colPolViolations);
                UpdateContext({varMaxViolationLevel : 0});
                UpdateContext({varNumViolation : 0})
            );
            //set receipt image if attachedDocuRefRecId is not 0
            If(
                varSelectedExpenseDoc.AttachedReceiptId <> "0",
                Set(
                    varReceiptImage,
                    LookUp('Expense Mobile Attached Document Entity (mserp)', EntRecId = Value(varSelectedExpenseDoc.AttachedReceiptId),CapturedDocument)
                );
                Set(
                    varFileFormat,
                    LookUp('Expense Mobile Attached Document Entity (mserp)', EntRecId = Value(varSelectedExpenseDoc.AttachedReceiptId), FileExtension)
                );
                Set(
                    varSelectedReceiptNumber,
                    Blank()
                )
            );
            
            Navigate('Expenses - Edit Screen', ScreenTransition.None, {varNavigatedFrom : "scr18", varMaxViolationLevel : varMaxViolationLevel, varNumViolation: varNumViolation})
        TemplatePadding: =0
        TemplateSize: =150
        Width: =Parent.Width
        Y: =scr18_shp_Rectangle.Y + scr18_shp_Rectangle.Height
        ZIndex: =2

        Container11_4 As groupContainer.verticalAutoLayoutContainer:
