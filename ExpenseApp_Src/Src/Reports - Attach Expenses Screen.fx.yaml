                        Text: |-
                            =Text(
                                DateValue(ThisItem.'Transaction date'),
                                "mmm dd, yyyy"
                            )
                        Width: =Parent.Width
                        ZIndex: =2

                Icon3_2 As icon.ChevronRight:
                    AlignInContainer: =AlignInContainer.Center
                    Color: =RGBA(110, 110, 110, 1)
                    Icon: =Icon.ChevronRight
                    LayoutMaxHeight: =
                    LayoutMaxWidth: =
                    OnSelect: =Select(scr18_shp_SelectRegion_RightIcon)
