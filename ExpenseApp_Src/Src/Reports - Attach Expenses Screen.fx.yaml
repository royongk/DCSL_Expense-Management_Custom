                        Text: |-
                            =If(
                                ThisItem.'Expense type' = 'TrvExpType (mserp)'.'Per diem',
                                Concatenate("Perdiem - ", ThisItem.'Location (mserp_trvlocations_location)'),
                                ThisItem.Merchant
                            )
                        Width: =Parent.Width
                        ZIndex: =1

                    Label6_8 As label:
                        AutoHeight: =true
                        Color: |-
                            =If(
                                Value(ThisItem.PolicyViolationCount) > 0,
                                If(
                                    Value(ThisItem.PolicyViolationsLevel) <= 2,
                                    RGBA(152, 111, 11, 1),
                                    RGBA(217, 44, 44, 1)
                                ),
                                RGBA(0, 0, 0, 1)
                            )
                        Font: =Font.'Segoe UI'
                        Height: =70
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        LayoutMinHeight: =70
                        LayoutMinWidth: =560
                        OnSelect: =Select(scr18_shp_SelectRegion)
                        PaddingLeft: =15
                        PaddingRight: =0
                        Size: =21
                        TabIndex: =If(IsBlank(Self.Text), -1, 0)
                        Text: |-
                            =If(
                                Value(ThisItem.PolicyViolationCount) > 0,
                                Substitute(GlobalLabels.Labels.'15062:LocalizedName,msdyn_FoundPolicyViolationLabel', "$", Text(ThisItem.PolicyViolationCount)),
                                ThisItem.ProjectName
                            )
                        Width: =Parent.Width
                        ZIndex: =2

                Container9_5 As groupContainer.verticalAutoLayoutContainer:
                    FillPortions: =0
                    Height: =225
                    LayoutAlignItems: =LayoutAlignItems.Center
                    LayoutDirection: =LayoutDirection.Vertical
                    LayoutGridColumns: =6
                    LayoutGridRows: =6
                    LayoutJustifyContent: =LayoutJustifyContent.Center
                    LayoutMaxHeight: =
                    LayoutMaxWidth: =
                    LayoutMinHeight: =112
                    LayoutMinWidth: =250
                    LayoutMode: =LayoutMode.Auto
                    Width: =200
                    ZIndex: =5

                    Label5_9 As label:
                        Align: =Align.Center
                        AutoHeight: =true
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =70
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        LayoutMinHeight: =70
                        LayoutMinWidth: =560
                        OnSelect: =Select(scr18_shp_SelectRegion_RightIcon)
                        Size: =21
                        TabIndex: =If(IsBlank(Self.Text), -1, 0)
                        Text: |+
                            =Concatenate(Text(Value(ThisItem.'Transaction amount'), "#,#0.00", varDefaultLanguage), " ", ThisItem.'Currency (mserp_exchangecode)')
                            
                        Width: =Parent.Width
                        ZIndex: =1

                    Label6_9 As label:
                        Align: =Align.Center
                        AutoHeight: =true
                        Font: =Font.'Segoe UI'
                        Height: =70
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        LayoutMinHeight: =70
                        LayoutMinWidth: =560
                        OnSelect: =Select(scr18_shp_SelectRegion_RightIcon)
                        Size: =21
