    scr18_ico_Back As icon.ChevronLeft:
        AccessibleLabel: ="Press to go back"
        Color: =icongconfig_backbutton.Color
        Fill: =icongconfig_backbutton.Fill
        Height: =icongconfig_backbutton.Height
        Icon: =Icon.ChevronLeft
        OnSelect: |+
            =UpdateContext({
                diffTable : Filter(
                    colExpensesToBeAttached,
                    !('Expense report number (mserp_expnumber)' in colAttachedExpenses[@'Expense report number (mserp_expnumber)'])
                )
            });
            If(
                CountRows(diffTable) > 0,
                UpdateContext({varCntBack: true}),
                If(
                    varCntBack_scr17,
                    Navigate('Reports - Edit Screen'),
                    Navigate('Reports - View Attached Expenses Screen')
                )
            );
            
        TabIndex: =0
        Width: =icongconfig_backbutton.Width
        X: =22
        Y: =(scr03_hdr_TopHeader_1.Height-Self.Height)/2
        ZIndex: =8

    scr18_cmp02_CancelDialog As cmp02_ConfirmationDialog:
