                            Blank()
                        ),
                        // [추가된 부분] 화면 진입 시 초기화 방지 플래그를 false로 초기화하여 OnVisible 로직이 정상 작동하게 함
                        Set(varIsAddingReceipt, false)
                    );
                    //assign the expense to a varSelectedExpenseDoc
                    Set(
                        varSelectedExpenseDoc,
                        LookUp('DCSL Expense Line Expense Moblie Entity (mserp)','Expense transaction number (mserp_exptransnumber)' = ThisItem.'Expense transaction number (mserp_exptransnumber)')
                    );
                    // [추가된 부분] 이전 항목의 영수증 목록이 갤러리에 중복 표시되지 않도록 컬렉션 초기화
                    Clear(colAttachedReceipts);
                    /*
                    Set(
                        varReceiptImage,
                        LookUp('Expense Mobile Attached Document Entity (mserp)', EntRecId = Value(varSelectedExpenseDoc.AttachedReceiptId),CapturedDocument)
                    );
                    Set(
                        varFileFormat,
                        LookUp('Expense Mobile Attached Document Entity (mserp)', EntRecId = Value(varSelectedExpenseDoc.AttachedReceiptId), FileExtension)
                    );
                    */
                    ClearCollect(
                        colAttachedReceipts,
                        SortByColumns(
                            Filter(
                                'Expense Mobile Attached Document Entity (mserp)',
                                'Reference record ID' = Value(varSelectedExpenseDoc.ExpenseRecId)
                            ),
                            "mserp_documentcreateddatetime",
                            SortOrder.Descending
                        )
                    );
                    
                    Set(
                        varExpenseAgainstWorkItem,
                        Blank()
                    );
                    Set(
                        varSelectedReceiptNumber,
                        Blank()
                    );
                    UpdateContext({
                        currExpenseType: varSelectedExpenseDoc.'Expense type'
                    });
                    
                    //collect policy violations
                    If(
                        varSelectedExpenseDoc.PolicyViolationCount,
                        ClearCollect(
                            colPolViolations,
                            Split(varSelectedExpenseDoc.PolicyViolationErrorMessage, "~|~")
                        );
                        UpdateContext({varMaxViolationLevel : varSelectedExpenseDoc.PolicyViolationsLevel});
                        UpdateContext({varNumViolation : varSelectedExpenseDoc.PolicyViolationCount}),
                        Clear(colPolViolations);
                        UpdateContext({varMaxViolationLevel : 0});
                        UpdateContext({varNumViolation : 0})
                    );
                    Navigate('Expenses - Edit Screen', ScreenTransition.None, {varNavigatedFrom : "scr17", varMaxViolationLevel : varMaxViolationLevel, varNumViolation: varNumViolation, currExpenseType:currExpenseType, varRemainingAmount: 0, locCategoryChange: false, locItemizeButtonVisibilityFlag: false})
                ShowScrollbar: =false
                TemplatePadding: =0
                TemplateSize: =129
                Visible: |
                    =If(
                        CountRows(colAttachedExpenses) > 0,
                        true,
                        false
                    )
                Width: =Parent.Width
                Y: =Container2_1.Y + Container2_1.Height
                ZIndex: =4

                scr17_img_Category_4 As image:
                    Height: =30
                    Image: |-
                        =If(
                            Value(ThisItem.PolicyViolationsLevel) = 0,
                            LookUp(dsCategoryImages,expenseType=ThisItem.'Expense type').icon,
                            Value(ThisItem.PolicyViolationsLevel) > 0 && Value(ThisItem.PolicyViolationsLevel) <= 2,
                            LookUp(dsCategoryImages,expenseType=ThisItem.'Expense type').iconYellow,
                            Value(ThisItem.PolicyViolationsLevel) > 2,
                            LookUp(dsCategoryImages,expenseType=ThisItem.'Expense type').iconRed
                        )
                    OnSelect: =Select(Parent)
                    Width: =50
                    X: =16
                    Y: =(Parent.TemplateHeight / 2) - (Self.Height / 2)
                    ZIndex: =6

                scr17_lbl_Merchant_4 As label:
                    BorderColor: =RGBA(0, 0, 0, 1)
                    Font: =Font.'Segoe UI'
                    Height: =37
                    LineHeight: =1
                    OnSelect: =Select(Parent)
                    PaddingBottom: =0
                    PaddingLeft: =0
                    PaddingRight: =0
                    PaddingTop: =0
                    Size: =21
                    TabIndex: =If(IsBlank(Self.Text), -1, 0)
                    Text: |-
                        =If(
                            ThisItem.'Expense type' = 'TrvExpType (mserp)'.'Per diem',
                            Concatenate("Perdiem - ", ThisItem.'Location (mserp_trvlocations_location)'),
                            ThisItem.Merchant
                        )
                    VerticalAlign: =VerticalAlign.Top
                    Width: =373
                    Wrap: =false
                    X: =71
                    Y: =40
                    ZIndex: =7

                scr17_shp_Seprator_4 As rectangle:
                    Fill: =RGBA(225, 225, 225, 1)
                    Height: =1
                    Width: =Parent.TemplateWidth
                    Y: =Parent.TemplateHeight - 1
                    ZIndex: =8

                scr17_lbl_Amount_4 As label:
                    Align: =Align.Right
                    BorderColor: =RGBA(0, 0, 0, 1)
                    Font: =Font.'Segoe UI'
                    FontWeight: =FontWeight.Bold
                    Height: =41
                    OnSelect: =Select(Parent)
                    PaddingBottom: =0
                    PaddingLeft: =0
                    PaddingRight: =0
                    PaddingTop: =0
                    Size: =21
                    TabIndex: =If(IsBlank(Self.Text), -1, 0)
                    Text: |
                        =Concatenate(Text(Value(ThisItem.'Transaction amount'), "#,#0.00", varDefaultLanguage), " ", ThisItem.'Currency (mserp_exchangecode)')
                        //LookUp('Currencies (mserp)', 'Currency code' = ThisItem.'Currency (mserp_exchangecode)', 'Currency code')
                    VerticalAlign: =VerticalAlign.Top
                    Width: =250
                    Wrap: =false
                    X: =Parent.Width - scr17_lbl_Amount_4.Width - 15
                    Y: =scr17_lbl_Merchant_4.Y
                    ZIndex: =9

                scr17_lbl_Date_4 As label:
                    Align: =Align.Right
                    BorderColor: =RGBA(0, 0, 0, 1)
                    Color: |
                        =RGBA(102, 102, 102, 1)
                    Font: =Font.'Segoe UI'
                    Height: =28
                    OnSelect: =Select(Parent)
                    PaddingBottom: =0
                    PaddingLeft: =0
                    PaddingRight: =0
                    PaddingTop: =0
                    Size: =16.5
                    TabIndex: =If(IsBlank(Self.Text), -1, 0)
                    Text: |-
                        =Text(
                            DateValue(ThisItem.'Transaction date'),
                            "mmm dd, yyyy"
                        )
                    VerticalAlign: =VerticalAlign.Top
                    Wrap: =false
                    X: =scr17_lbl_Amount_4.X + scr17_lbl_Amount_4.Width - Self.Width
                    Y: =86
                    ZIndex: =10

                scr17_lbl_ProjectName_4 As label:
                    BorderColor: =RGBA(0, 0, 0, 1)
                    Color: |
                        =RGBA(102, 102, 102, 1)
                    Font: =Font.'Segoe UI'
                    Height: =Self.Size*1.8
                    OnSelect: =Select(Parent)
                    PaddingBottom: =0
                    PaddingLeft: =0
                    PaddingRight: =0
                    PaddingTop: =0
                    Size: =18
                    TabIndex: =If(IsBlank(Self.Text), -1, 0)
                    Text: =ThisItem.ProjectName
                    VerticalAlign: =VerticalAlign.Top
                    Visible: =!(scr17_lbl_Warning_4.Visible)
                    Width: =scr17_lbl_Merchant_4.Width
                    Wrap: =false
                    X: =scr17_lbl_Merchant_4.X
                    Y: =scr17_lbl_Merchant_4.Y + scr17_lbl_Merchant_4.Height + 4
                    ZIndex: =11

                scr17_lbl_Warning_4 As label:
                    BorderColor: =RGBA(0, 0, 0, 1)
                    Color: |-
                        =If(
                            Value(ThisItem.PolicyViolationsLevel) <= 2,
                            RGBA(152, 111, 11, 1),
                            RGBA(217, 44, 44, 1)
                        )
                    Font: =Font.'Segoe UI'
                    Height: =Self.Size * 1.8
                    OnSelect: =Select(Parent)
                    PaddingBottom: =0
                    PaddingLeft: =0
                    PaddingRight: =0
                    PaddingTop: =0
                    Size: =18
                    TabIndex: =If(IsBlank(Self.Text), -1, 0)
                    Text: |-
                        =If(
                            Value(ThisItem.PolicyViolationCount) > 0,
                            Substitute(GlobalLabels.Labels.'15062:LocalizedName,msdyn_FoundPolicyViolationLabel', "$", Text(ThisItem.PolicyViolationCount))
                        )
                            
                    VerticalAlign: =VerticalAlign.Top
                    Visible: =Value(ThisItem.PolicyViolationCount) > 0
                    Width: =scr17_lbl_Merchant_4.Width
                    Wrap: =false
                    X: =scr17_lbl_Merchant_4.X
                    Y: =scr17_lbl_Merchant_4.Y + scr17_lbl_Merchant_4.Height + 4
                    ZIndex: =12

    scr17_hdr_TopHeader_1 As hdr02_Header:
        Fill: =scr17_hdr_TopHeader_1.paramFill
        paramFill: =RGBA(255, 255, 255, 1)
        paramTitle: |-
            =If(varIsCreateReport, GlobalLabels.Labels.'15062:LocalizedName,msdyn_CreateExpenseReportLabel', GlobalLabels.Labels.'15062:LocalizedName,msdyn_EditExpenseReportHeaderLabel')
        ZIndex: =3

    scr17_ico_Back_1 As icon.ChevronLeft:
        AccessibleLabel: ="Press to go back"
        Color: =icongconfig_backbutton.Color
        Fill: =icongconfig_backbutton.Fill
        Height: =icongconfig_backbutton.Height
        Icon: =Icon.ChevronLeft
        OnSelect: |
            =If(
                isExpReportDirty,
                UpdateContext({ctVarReportDetailsBack:true}),
                UpdateContext({ctVarReportDetailsBack: false});
                Reset(ComboBox_Purpose);
                Reset(ComboBox_Location);
                Reset(ComboBox_LegalEntity_ExpReport);
                //If( 
                //    gblIsProjectValidationFlag,
                //    Reset(ComboBox_ProjectId_ExpReport_odata),
                //    Reset(ComboBox_ProjectId_ExpReport_entity)
                //);
                Navigate('Reports - List Screen', ScreenTransition.None, {varcntSelectedStatus: 0})
            );
            Set(
                gblNavigationDrawerVisibility,
                false
            );
        TabIndex: =0
        Width: =icongconfig_backbutton.Width
        X: =22
        Y: =(scr03_hdr_TopHeader_1.Height-Self.Height)/2
        ZIndex: =4

    scr17_cmp02_CancelDialog_1 As cmp02_ConfirmationDialog:
        controlName: ="scr17_cmp02_CancelDialog_1"
        OnLeftButtonClick: |-
            =UpdateContext({ctVarReportDetailsBack: false});
        OnRightButtonClick: |-
            =UpdateContext({ctVarReportDetailsBack: false});
            Clear(colReportPostDetails);
            Reset(ComboBox_Purpose);
            Reset(ComboBox_Location);
            Reset(ComboBox_LegalEntity_ExpReport);
            Navigate('Reports - List Screen', ScreenTransition.None, {varcntSelectedStatus: 0})
        parmInDescriptionText: ="All unsaved changes will be lost."
        parmInHeaderText: ="Do you want to go back?"
        parmInLeftButtonColor: =RGBA(34, 102, 227, 1)
        parmInLeftButtonText: ="No"
        parmInRightButtonColor: =RGBA(195, 39, 39, 1)
        parmInRightButtonText: ="Yes"
        returnFocus: ="scr17_ico_Back_1"
        Visible: =ctVarReportDetailsBack
        Y: =0
        ZIndex: =5

