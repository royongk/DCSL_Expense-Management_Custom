    scr17_ico_Back_1 As icon.ChevronLeft:
        AccessibleLabel: ="Press to go back"
        Color: =icongconfig_backbutton.Color
        Fill: =icongconfig_backbutton.Fill
        Height: =icongconfig_backbutton.Height
        Icon: =Icon.ChevronLeft
        OnSelect: |
            =If(
                isExpReportDirty,
                UpdateContext({ctVarReportDetailsBack:true}),
                UpdateContext({ctVarReportDetailsBack: false});
                Reset(ComboBox_Purpose);
                Reset(ComboBox_Location);
                Reset(ComboBox_LegalEntity_ExpReport);
                If( 
                    gblIsProjectValidationFlag,
                    Reset(ComboBox_ProjectId_ExpReport_odata),
                    Reset(ComboBox_ProjectId_ExpReport_entity)
                );
                Navigate('Reports - List Screen')
            );
            Set(
                gblNavigationDrawerVisibility,
                false
            );
        TabIndex: =0
