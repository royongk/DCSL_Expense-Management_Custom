"'Reports - Edit Screen' As screen":
    Fill: =RGBA(229, 229, 229, 1)
    OnVisible: |-
        =UpdateContext({ctLabel1 : false});
        UpdateContext({ctLabel2 : false});
        UpdateContext({ctLabel3 : false});
        UpdateContext({ctLabel4 : false});
        UpdateContext({ctLabel5 : false});
        UpdateContext({ctLabel6 : false});
        UpdateContext({ctLabel7 : false});
        UpdateContext({ctLabel8 : false});
        
        UpdateContext({ctVarReportDetailsBack:false});
        UpdateContext({isExpReportDirty : false});
        If(
            IsBlank(
                LookUp(
                    colReportPostDetails,
                    fieldName = "Description"
                )
            ),
            Reset(scr17_txt_Description_1)
        );
        If(
            varIsCreateReport,
            Reset(ComboBox_Location);
            Reset(ComboBox_Purpose);
            Reset(scr17_txt_Description_1);
            Reset(ComboBox_LegalEntity_ExpReport);
            //If( 
            //    gblIsProjectValidationFlag,
            //    Reset(ComboBox_ProjectId_ExpReport_odata),
            //    Reset(ComboBox_ProjectId_ExpReport_entity)
            //);
        );
        UpdateContext(
            {
                locReimaginedfeatureEnabled: (userRecord.IsReimaginedUIEnabled = 'NoYes (mserp)'.Yes)
            }
        );
        
        // 1. 접속한 사용자의 마스터 정보 가져오기 (화면에 '본인' 이름을 표시하기 위함)
        Set(
            varCurrentD365User,
            LookUp('Expense mobile master data (mserp)', Email = User().Email)
        );
        
        // 2. [변경됨] 가상 필드 대신, 물리적 텍스트 필드(mserp_delegateduser)로 서버에서 직접 필터링합니다.
        ClearCollect(
            colActiveDelegations,
            Filter(
                '@DEEX:DEEX_20316 (mserp)',
                // 텍스트 ID 끼리 비교합니다. (varCurrentD365User.mserp_userid 가 "DEEX1.ERP" 형태)
                Delegate = varCurrentD365User.ID && 
                'Start date' <= Today() &&
                'End date' >= Today()
            )
        );
        
        // 3. 콤보박스 선택지 생성 (첫 번째: 접속자 본인)
        ClearCollect(
            colCreatingWorkerOptions,
            {
                WorkerID: userRecord.CreatingWorker, // 저장용 내 숫자 ID
                WorkerName: varCurrentD365User.ID & " (MySelf)" // 화면 표시용 내 이름
            }
        );
        
        // 4. 콤보박스 선택지 추가 (대리 신청 대상자)
        ForAll(
            colActiveDelegations,
            Collect(
                colCreatingWorkerOptions,
                {
                    // [저장용] Expense Line 테이블에 넘겨줄 위임자의 고유 숫자 ID
                    WorkerID: ThisRecord.Employee, 
                    
                    // [표시용] 새로 추가된 텍스트 'ID' 필드를 이용해 마스터 테이블에서 이름을 찾아옴!
                    WorkerName: ThisRecord.ID & " (Delegate)"
                }
            )
        );
        
        If(
            locReimaginedfeatureEnabled, 
            If(
                CountRows(gblExpenseReportFieldVisibilityReImaginedLookup) <= 0,
                ClearCollect(
                    gblExpenseReportFieldVisibilityReImaginedLookup, 
                    Filter(
                        'Expense mobile report field visibility (mserp)', 
                        LegalEntityId = varSelectedLegalEntity && 
                        VisibilityType <> 'ExpenseFieldVisibilityType (mserp)'.'Do not display'
                    )
                )
            ),
            If(
                CountRows(gblExpenseReportFieldVisibilityLookup) <= 0,
                ClearCollect(
                    gblExpenseReportFieldVisibilityLookup, 
                    Filter(
                        '@ExpenseManagement:TrvExpMobileReportAdminCustomFieldsEntity (mserp)',
                        LegalEntityId = varSelectedLegalEntity && 
                        Visibility <> 'Visibility (mserp)'.'Do not display'
                    )
                )
            )
        );

