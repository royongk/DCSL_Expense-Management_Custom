        "'Buttons - Draft' As groupContainer.manualLayoutContainer":
            AlignInContainer: =AlignInContainer.SetByContainer
            Height: =225
            LayoutGridColumnMinWidth: =0
            LayoutGridColumns: =6
            LayoutGridRowMinHeight: =0
            LayoutGridRows: =6
            LayoutMaxHeight: =
            LayoutMaxWidth: =
            LayoutMinHeight: =112
            LayoutMinWidth: =250
            Width: =Parent.Width
            ZIndex: =2

            scr17_btn_Submit_1 As button:
                BorderColor: =RGBA(34, 102, 227, 1)
                Color: |
                    =RGBA(34, 102, 227, 1)
                DisplayMode: |-
                    =If(
                        CountRows(
                            Filter(
                                'DCSL Expense Line Expense Moblie Entity (mserp)',
                                'Expense report number (mserp_expnumber)' = varSelectedReport.'Expense report number'
                            )
                        ) > 0,
                        DisplayMode.Edit,
                        DisplayMode.Disabled
                    )
                Fill: =RGBA(255, 255, 255, 1)
                Font: =Font.'Segoe UI'
                Height: =76
                OnSelect: |-
                    =Set(gblNavigationDrawerVisibility, false);
                    
                    // 1. 값 확정 및 유효성 검사 초기화 (타이밍 버그 방지)
                    UpdateContext({
                        locTargetPurpose: Coalesce(
                            ComboBox_Purpose.Selected.'Purpose (mserp_value)',
                            ComboBox_Purpose.SearchText,
                            varSelectedReport.Purpose
                        ),
                        varPurposeValidationFailed: false,
                        varAmountValidationFailed: false
                    });
                    
                    Clear(varError);
                    
                    // 2. 필수 값 유효성 검사 (Purpose)
                    If(
                        IsBlank(locTargetPurpose),
                        UpdateContext({varPurposeValidationFailed: true});
                        Notify(
                            Coalesce(GlobalLabels.Labels.'15062:LocalizedName,msdyn_EnterPurposeLabel', "Purpose field is required."),
                            NotificationType.Error,
                            gblParams.notificationTime
                        )
                    );
                    
                    // 3. 필수 값 유효성 검사 (Delegate Employee) - 💡 플래그를 추가해 실행을 완벽히 차단합니다.
                    If(
                        !IsEmpty(colActiveDelegations) && IsBlank(ComboBox_Employee.Selected.WorkerID), 
                        UpdateContext({varPurposeValidationFailed: true}); 
                        Notify(
                            "Delegate Employee field is required.",
                            NotificationType.Error,
                            gblParams.notificationTime
                        )
                    );
                    
                    // 4. 금액 한도 유효성 검사 (Amount) - 💡 플래그를 추가해 실행을 완벽히 차단합니다.
                    If(
                        !IsBlank(varSelectedTravelReq) &&
                        (CountRows(colAttachedExpenses) > 0 || CountRows(Filter('DCSL Expense Line Expense Moblie Entity (mserp)', 'Expense report number (mserp_expnumber)' = varSelectedReport.'Expense report number')) > 0) &&
                        
                        // 👇 수정된 부분: "3,000,000.00 KRW"에서 "3,000,000.00"만 추출 후 Value 변환
                        Value(First(Split(Text(varSelectedReport.'Amount (mserp_deextrvrequisitiontotalestimate)'), " ")).Value) > Value(varSelectedTravelReq.'Amount to reconcile'),
                        
                        UpdateContext({varAmountValidationFailed: true});
                        Notify(
                            "The Expense Total Amount exceeds the Remaining Amount of the Travel Requisition. Please submit a claim within the remaining balance.",
                            NotificationType.Error,
                            gblParams.notificationTime
                        )
                    );
                    
                    // 5. 모든 유효성 검사를 통과했을 때만 제출 로직 실행
                    If(
                        !varPurposeValidationFailed && !varAmountValidationFailed,
                        
                        // 5-1. 보고서 데이터 업데이트 및 제출(Submit)
                        With(
                            {
                                patchedReport: IfError(
                                    Patch(
                                        'DCSL Expense Moblie Report (mserp)',
                                        LookUp('DCSL Expense Moblie Report (mserp)', 'Expense report number' = varSelectedReport.'Expense report number'),
                                        {
                                            Purpose: locTargetPurpose,
                                            Location : If(IsBlank(ComboBox_Location.Selected.Location), If(IsBlank(ComboBox_Location.SearchText), varSelectedReport.Location, ComboBox_Location.SearchText), ComboBox_Location.Selected.Location),
                                            Description: scr17_txt_Description_1.Text,
                                            'Legal entity for expenses': If(IsBlank(ComboBox_LegalEntity_ExpReport.Selected.Value), Lower(varSelectedLegalEntity), Lower(ComboBox_LegalEntity_ExpReport.Selected.Value)),
                                            'Document Status': 'Document Status (mserp)'.Submitted, // 제출 상태로 변경
                                            'Created in Apps': 'NoYes (mserp)'.Yes,
                                            'Delegated Worker': If(!IsEmpty(colActiveDelegations) && Value(ComboBox_Employee.Selected.WorkerID) <> Value(userRecord.CreatingWorker), Value(ComboBox_Employee.Selected.WorkerID), Blank())
                                        }
                                    ),
                                    Collect(
                                        varError, 
                                        {
                                            Value: Coalesce(
                                                If(
                                                    !IsBlank(FirstError.Details.HttpResponse) && IsMatch(FirstError.Details.HttpResponse, ".*""message"":""([^""]+)"".*"), 
                                                    Substitute(Match(FirstError.Details.HttpResponse, """message"":""([^""]+)""").FullMatch, """message"":", "")
                                                ),
                                                FirstError.Message,
                                                "서버 처리 중 오류가 발생했습니다."
                                            )
                                        }
                                    );
                                    Blank()
                                )
                            },
                            If(!IsBlank(patchedReport) && IsEmpty(varError), Set(varSelectedReport, patchedReport))
                        );
                        
                        // 5-2. 출장 요청 헤더 연결 (💡 중복 매핑 방지 및 위임 경고 해결 로직 추가)
                        If(
                            !IsBlank(varSelectedTravelReq) && IsEmpty(varError),
                            With(
                                {
                                    freshReportReq: LookUp(
                                        'DCSL Expense Moblie Report (mserp)', 
                                        'Expense report number' = varSelectedReport.'Expense report number'
                                    )
                                },
                                If(
                                    !IsBlank(freshReportReq.DEEXReferenceId),
                                    // 💡 1차 해결: 레코드의 속성을 직접 참조하지 않고, 숫자형(Value) 변수로 먼저 변환합니다.
                                    With(
                                        {
                                            valRefId: Value(freshReportReq.DEEXReferenceId)
                                        },
                                        // 💡 2차 해결: 변환된 원시 타입 변수(valRefId)로 조회하면 위임 경고가 사라집니다.
                                        With(
                                            {
                                                existingMapping: LookUp(
                                                    'Expense Header to Travel Requisition Entity (mserp)', 
                                                    'Reference (mserp_trvexptable)' = valRefId
                                                )
                                            },
                                            // 없을 때만 새로 연결
                                            If(
                                                IsBlank(existingMapping),
                                                Patch(
                                                    'Expense Header to Travel Requisition Entity (mserp)',
                                                    Defaults('Expense Header to Travel Requisition Entity (mserp)'),
                                                    {
                                                        'Reference (mserp_trvexptable)': freshReportReq.DEEXReferenceId, // Patch에 넣을 때는 원본 그대로 사용
                                                        'Travel requisition number': varSelectedTravelReq.'Travel requisition number'
                                                    }
                                                )
                                            )
                                        )
                                    )
                                )
                            )
                        );
                        
                        // 5-3. 최종 결과 처리 및 화면 이동
                        If(
                            !IsEmpty(varError),
                            // 에러가 발생한 경우
                            Notify(First(varError).Value, NotificationType.Error, gblParams.notificationTime),
                            
                            // 정상 처리 시
                            Notify(GlobalLabels.Labels.'15062:LocalizedName,msdyn_ExpenseReportSubmittedSuccessfullyLabel', NotificationType.Success, gblParams.notificationTime);
                            Navigate('Reports - List Screen', ScreenTransition.None, {varcntSelectedStatus: 0})
                        )
                    )
                Size: =19.15
                Text: |-
                    =GlobalLabels.Labels.'15062:LocalizedName,msdyn_SubmitLabel'
                Width: |
                    =Parent.Width -  Self.X*2
                X: |
                    =40
                Y: =scr17_btn_SaveDraft_1.Y + scr17_btn_SaveDraft_1.Height + 20 
                ZIndex: =1

            scr17_btn_SaveDraft_1 As button:
                Fill: =RGBA(34, 102, 227, 1)
                Font: =Font.'Segoe UI'
                Height: =76
                OnSelect: |-
                    =Set(gblNavigationDrawerVisibility, false);
                    
                    // 1. 값 확정 및 유효성 검사 초기화 (타이밍 버그 방지)
                    UpdateContext({
                        locTargetPurpose: Coalesce(
                            ComboBox_Purpose.Selected.'Purpose (mserp_value)',
                            ComboBox_Purpose.SearchText,
                            varSelectedReport.Purpose
                        ),
                        varPurposeValidationFailed: false,
                        varAmountValidationFailed: false
                    });
                    
                    Clear(varError); // 에러 컬렉션 초기화
                    
                    // 2. 필수 값 유효성 검사 (Purpose)
                    If(
                        IsBlank(locTargetPurpose),
                        UpdateContext({varPurposeValidationFailed: true});
                        Notify(
                            Coalesce(GlobalLabels.Labels.'15062:LocalizedName,msdyn_EnterPurposeLabel', "Purpose field is required."),
                            NotificationType.Error,
                            gblParams.notificationTime
                        )
                    );
                    
                    // 3. 필수 값 유효성 검사 (Delegate Employee)
                    If(
                        !IsEmpty(colActiveDelegations) && IsBlank(ComboBox_Employee.Selected.WorkerID), 
                        UpdateContext({varPurposeValidationFailed: true}); // 💡 수정: 누락되었던 실행 중단 플래그 추가
                        Notify(
                            "Delegate Employee field is required.",
                            NotificationType.Error,
                            gblParams.notificationTime
                        )
                    );
                    
                    // 4. 금액 한도 유효성 검사 (Amount)
                    If(
                        !IsBlank(varSelectedTravelReq) &&
                        (CountRows(colAttachedExpenses) > 0 || CountRows(Filter('DCSL Expense Line Expense Moblie Entity (mserp)', 'Expense report number (mserp_expnumber)' = varSelectedReport.'Expense report number')) > 0) &&
                        Value(varSelectedReport.AmountTotal) > Value(varSelectedTravelReq.'Amount to reconcile'),
                        
                        UpdateContext({varAmountValidationFailed: true}); // 💡 수정: 알림만 띄우고 넘어가던 것을 방지
                        Notify(
                            "The Expense Total Amount exceeds the Remaining Amount of the Travel Requisition. Please submit a claim within the remaining balance.",
                            NotificationType.Error,
                            gblParams.notificationTime
                        )
                    );
                    
                    // 5. 모든 유효성 검사를 통과했을 때만 저장 로직 실행
                    If(
                        !varPurposeValidationFailed && !varAmountValidationFailed,
                        
                        // 5-1. 데이터 생성 또는 수정
                        With(
                            {
                                patchedReport: IfError(
                                    If(
                                        varIsCreateReport,
                                        // [신규 생성] Employee 필드 추가 및 안전한 생성
                                        Patch(
                                            'DCSL Expense Moblie Report (mserp)',
                                            Defaults('DCSL Expense Moblie Report (mserp)'),
                                            {
                                                Employee: Value(ComboBox_Employee.Selected.WorkerID), // 💡 핵심 수정: 서버 필수 값 추가
                                                Purpose: locTargetPurpose,
                                                Location : If(IsBlank(ComboBox_Location.Selected.Location), ComboBox_Location.SearchText, ComboBox_Location.Selected.Location),
                                                Description: scr17_txt_Description_1.Text,
                                                'Legal entity for expenses': If(IsBlank(ComboBox_LegalEntity_ExpReport.Selected.Value), Lower(varSelectedLegalEntity), Lower(ComboBox_LegalEntity_ExpReport.Selected.Value)),
                                                'Created in Apps': 'NoYes (mserp)'.Yes,
                                                'Delegated Worker': If(!IsEmpty(colActiveDelegations) && Value(ComboBox_Employee.Selected.WorkerID) <> Value(userRecord.CreatingWorker), Value(ComboBox_Employee.Selected.WorkerID), Blank())
                                            }
                                        ),
                                        // [기존 수정]
                                        Patch(
                                            'DCSL Expense Moblie Report (mserp)',
                                            LookUp('DCSL Expense Moblie Report (mserp)', 'Expense report number' = varSelectedReport.'Expense report number'),
                                            {
                                                Purpose: locTargetPurpose,
                                                Location : If(IsBlank(ComboBox_Location.Selected.Location), If(IsBlank(ComboBox_Location.SearchText), varSelectedReport.Location, ComboBox_Location.SearchText), ComboBox_Location.Selected.Location),
                                                Description: scr17_txt_Description_1.Text,
                                                'Legal entity for expenses': If(IsBlank(ComboBox_LegalEntity_ExpReport.Selected.Value), Lower(varSelectedLegalEntity), Lower(ComboBox_LegalEntity_ExpReport.Selected.Value)),
                                                'Delegated Worker': If(!IsEmpty(colActiveDelegations) && Value(ComboBox_Employee.Selected.WorkerID) <> Value(userRecord.CreatingWorker), Value(ComboBox_Employee.Selected.WorkerID), Blank())
                                            }
                                        )
                                    ),
                                    // 💡 핵심 수정: 에러 시 앱이 강제 종료되지 않도록 안전한 패턴(Coalesce) 적용
                                    Collect(
                                        varError, 
                                        {
                                            Value: Coalesce(
                                                If(
                                                    !IsBlank(FirstError.Details.HttpResponse) && IsMatch(FirstError.Details.HttpResponse, ".*""message"":""([^""]+)"".*"), 
                                                    Substitute(Match(FirstError.Details.HttpResponse, """message"":""([^""]+)""").FullMatch, """message"":", "")
                                                ),
                                                FirstError.Message,
                                                "서버 처리 중 오류가 발생했습니다."
                                            )
                                        }
                                    );
                                    Blank()
                                )
                            },
                            If(
                                !IsBlank(patchedReport) && IsEmpty(varError),
                                Set(varSelectedReport, patchedReport) // 성공 시 변수 업데이트
                            )
                        );
                        
                        // 5-2. 출장 요청 헤더 연결 (안전장치 및 위임 경고 해결)
                        If(
                            !IsBlank(varSelectedTravelReq) && IsEmpty(varError),
                            With(
                                {
                                    freshReportReq: LookUp(
                                        'DCSL Expense Moblie Report (mserp)', 
                                        'Expense report number' = varSelectedReport.'Expense report number'
                                    )
                                },
                                If(
                                    !IsBlank(freshReportReq.DEEXReferenceId),
                                    // 💡 1차 해결: 레코드 속성을 직접 필터에 넣지 않고, 명시적 숫자(Value)로 변환하여 내부 변수로 선언합니다.
                                    With(
                                        {
                                            valRefId: Value(freshReportReq.DEEXReferenceId)
                                        },
                                        // 💡 2차 해결: 변환된 원시 타입 변수(valRefId)를 사용하여 조회하면 위임이 완벽히 지원됩니다.
                                        With(
                                            {
                                                existingMapping: LookUp(
                                                    'Expense Header to Travel Requisition Entity (mserp)', 
                                                    'Reference (mserp_trvexptable)' = valRefId
                                                )
                                            },
                                            // 기존 연결이 없을 때만 새로 연결
                                            If(
                                                IsBlank(existingMapping),
                                                Patch(
                                                    'Expense Header to Travel Requisition Entity (mserp)',
                                                    Defaults('Expense Header to Travel Requisition Entity (mserp)'),
                                                    {
                                                        'Reference (mserp_trvexptable)': freshReportReq.DEEXReferenceId, // Patch 시에는 원본 값 유지
                                                        'Travel requisition number': varSelectedTravelReq.'Travel requisition number'
                                                    }
                                                )
                                            )
                                        )
                                    )
                                )
                            )
                        );
                        
                        // 5-3. 현금 선지급 매핑
                        If(
                            IsEmpty(varError) && !IsBlank(ComboBox_MaptoCashAdvance.Selected.'Cash advance number') && (Toggle_Settlment_1.Value = true),
                            
                            Patch(
                                'DCSL Expense Moblie Report (mserp)',
                                LookUp('DCSL Expense Moblie Report (mserp)', 'Expense report number' = varSelectedReport.'Expense report number'),
                                {
                                    'Settlement from Cash Advance': 'NoYes (mserp)'.Yes
                                }
                            );
                            With(
                                {
                                    varCashAdvance: LookUp('DCSL TrvCash Advance Entity  (mserp)', 'Cash advance number' = ComboBox_MaptoCashAdvance.Selected.'Cash advance number'),
                                    // 💡 핵심 해결: 현금 매핑에서도 최신 ReferenceId 보장을 위해 재조회
                                    freshReportCash: LookUp('DCSL Expense Moblie Report (mserp)', 'Expense report number' = varSelectedReport.'Expense report number')
                                },
                                If(
                                    !IsBlank(varCashAdvance.ReferenceId) && !IsBlank(freshReportCash.DEEXReferenceId),
                                    With(
                                        {
                                            valExpId: Value(freshReportCash.DEEXReferenceId),
                                            valCompanyCode: Text(varSelectedLegalEntity),
                                            valCashAdvanceId: Value(varCashAdvance.ReferenceId)
                                        },
                                        With(
                                            {
                                                varExistingMapping: LookUp('DCSL TrvExpTableTrvCashAdvanceTable Entity (mserp)', TrvExpTable = valExpId && 'Company Code' = valCompanyCode)
                                            },
                                            If(
                                                IsBlank(varExistingMapping),
                                                Patch(
                                                    'DCSL TrvExpTableTrvCashAdvanceTable Entity (mserp)',
                                                    Defaults('DCSL TrvExpTableTrvCashAdvanceTable Entity (mserp)'),
                                                    {
                                                        TrvCashAdvance: valCashAdvanceId,
                                                        'Company Code': valCompanyCode,
                                                        TrvExpTable: valExpId
                                                    }
                                                );
                                                Notify("Cash Advance mapping has been successfully added.", NotificationType.Success),
                                                
                                                varExistingMapping.TrvCashAdvance <> valCashAdvanceId,
                                                Patch(
                                                    'DCSL TrvExpTableTrvCashAdvanceTable Entity (mserp)',
                                                    varExistingMapping, 
                                                    { TrvCashAdvance: valCashAdvanceId }
                                                );
                                                Notify("Cash Advance mapping modified to new value", NotificationType.Success),
                                                
                                                Notify("Cash advance information is the same and has not been changed.", NotificationType.Information)
                                            )
                                        )
                                    ),
                                    Notify("The identifier (DEEXReferenceId) of the cash advance payment or expense report cannot be determined on the server.", NotificationType.Error)
                                )
                            )
                        );
                    
                        // 5-4. 최종 결과 처리 및 화면 이동
