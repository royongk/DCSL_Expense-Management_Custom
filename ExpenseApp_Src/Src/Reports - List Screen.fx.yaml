        Fill: =If(varcntSelectedStatus=1, RGBA(34, 102, 227, 1),scr16_btn_FakeButton.Fill)
        Height: =44
        HoverColor: =Self.Color
        HoverFill: =Self.Fill
        OnSelect: |-
