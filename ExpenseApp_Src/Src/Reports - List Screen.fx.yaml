"'Reports - List Screen' As screen.'phoneBrowseLayout_ver3.0'":
    Fill: =Color.White
    OnVisible: |+
        =UpdateContext({varCntSelect: false});
        UpdateContext({isExpReportDirty : false});
        Concurrent(
        Set(
            varIsCreateReport,
            false
        ),
        Set(
            varSelectedTab,
            3
        ),
        Set(
            varSelectedReport,
            Blank()
        )
        );
        Concurrent(
        Refresh('Expense reports (mserp)_1'),
        Refresh('DimAttributeTrvTravelTxtEntity (mserp)'),
        Refresh('Travel locations (mserp)')
        );
        If(
            IsEmpty(collApprovedFilterOptions),
            ClearCollect(
                collApprovedFilterOptions,
                {
                    number: 1,
                    title: GlobalLabels.Labels.'15062:LocalizedName,msdyn_FilterOneWeekLabel'  
                },
                {
                    number: 2,
                    title: GlobalLabels.Labels.'15062:LocalizedName,msdyn_FilterOneMonthLabel'  
                },
                {
                    number: 3,
                    title: GlobalLabels.Labels.'15062:LocalizedName,msdyn_FilterSixMonthsLabel'
                },
                {
                    number: 4,
                    title: GlobalLabels.Labels.'15062:LocalizedName,msdyn_FilterOneYearLabel'
                }
            )
        );
        Clear(colAttachedExpensesForReport);
        Clear(colAttachedExpenses);
        Reset(scr16_Reports_1);
        Reset(scr16_txt_SearchBox);
        

    emptyStateComponent_4 As emptyStateComponent:
        subTitle: |-
            =Switch(
                varcntSelectedStatus,
                1,
                GlobalLabels.Labels.'15062:LocalizedName,msdyn_CreateReportToGetPaidLabel',
                2,
                GlobalLabels.Labels.'15062:LocalizedName,msdyn_SubmitReportToGetPaidLabel',
                3,
                GlobalLabels.Labels.'15062:LocalizedName,msdyn_CreateAndSubmitReportToGetPaidLabel',
                4,
                "No rejected reports"
            )
        title: |-
            =GlobalLabels.Labels.'15062:LocalizedName,msdyn_NothingHereYetLabel'
        Visible: =scr16_Reports_1.AllItemsCount <= 0
        X: |
            =(Parent.Width - Self.Width)/2
        Y: |
            =scr16_Reports_1.Y + (Parent.Height - scr16_hdr_TopHeader.Height - scr16_cmp_Footer_1.Height - Self.Height)/2 - scr16_lbl_DummyLabel.Height

    "scr16_Reports_1 As gallery.'BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0'":
        '#CopilotOverlayLabel': ="Filtered"
        AccessibleLabel: |-
            =Switch(
                varcntSelectedStatus,
                1,
                "List of draft reports",
                2,
                "List of submitted reports",
                3,
                "List of approved reports",
                4,
                "List of rejected reports"
            )
        Default: ={}
        DelayItemLoading: =true
        Height: |-
            =Min(
                scr16_cmp_Footer_1.Y - Self.Y,
                Self.TemplateHeight * CountRows(Self.AllItems)
            )
        Items: |-
            =SortByColumns(
                Filter(
                    Switch(
                        varcntSelectedStatus,
                        1,
                        Filter(
                            'Expense reports (mserp)_1',
                            'Document Status' = 'Document Status (mserp)'.Draft
                        ),
                        2,
                        Filter(
                            'Expense reports (mserp)_1',
                            'Document Status' = 'Document Status (mserp)'.Submitted
                        ),
                        3,
                        Search(
                            Switch(
                                scr16_btn_DateFilter.Selected.number,
                                1,
                                Filter(
                                    'Expense reports (mserp)_1',
                                    'Document Status' = 'Document Status (mserp)'.Approved && DateAdd(DateValue(CreatedDate), 7, TimeUnit.Days) >= Today()
                                ),
                                2,
                                Filter(
                                    'Expense reports (mserp)_1',
                                    'Document Status' = 'Document Status (mserp)'.Approved && DateAdd(DateValue(CreatedDate), 30, TimeUnit.Days) >= Today()
                                ),
                                3,
                                Filter(
                                    'Expense reports (mserp)_1',
                                    'Document Status' = 'Document Status (mserp)'.Approved && DateAdd(DateValue(CreatedDate), 180, TimeUnit.Days) >= Today()
                                ),
                                4,
                                Filter(
                                    'Expense reports (mserp)_1',
                                    'Document Status' = 'Document Status (mserp)'.Approved && DateAdd(DateValue(CreatedDate), 365, TimeUnit.Days) >= Today()
                                ),
                                Filter(
                                    'Expense reports (mserp)_1',
                                    'Document Status' = 'Document Status (mserp)'.Approved
                                )
                            ),
                            scr16_txt_SearchBox.Text,
                            'Purpose (mserp_purpose)'
                        ),
                        4,
                        Filter(
                            'Expense reports (mserp)_1',
                            'Document Status' = 'Document Status (mserp)'.Rejected
                        )
                    ),
                    Upper(DEEXLegalEntity_DataArea) = Upper(varSelectedLegalEntity)
                ), 
                "mserp_createddate", SortOrder.Descending
            )
        Layout: =Layout.Vertical
        LoadingSpinner: =LoadingSpinner.Data
        OnSelect: |-
            =UpdateContext({varcntShowFilter:false});
            // ⚠️ LookUp from original data source FIRST to ensure field name compatibility
            Set(
                varSelectedReport,
                LookUp('Expense reports (mserp)','Expense report number' = ThisItem.'Expense report number' && LegalEntity_DataArea = varSelectedLegalEntity)
            );
            // ✅ Use varSelectedReport.'Document Status' from original data source for type consistency
            Set(
                varSelectedReportStatusItem,
                varSelectedReport.'Document Status'
            );
            Clear(colAttachedExpensesForReport);
            ForAll(
                Split(varSelectedReport.ExpTransNumber, ",") As attachedExpenses,
                Collect(
                    colAttachedExpensesForReport,
                    LookUp('Expense lines (mserp)','Expense transaction number (mserp_exptransnumber)' = attachedExpenses[@Value] && 'Expense line type' <> 'Expense line type (mserp)'.'Itemized line')
                )
            );
            ClearCollect(
                colAttachedExpenses,
                colAttachedExpensesForReport
            );
            
            If(
                varSelectedReportStatusItem in dsDrafts,
                Navigate('Reports - Edit Screen'),
                Navigate('Reports - View Only Screen');
            )
        TemplatePadding: =0
        TemplateSize: =150
        Width: =Parent.Width
        Y: |-
            =Switch(
                varcntSelectedStatus,
                1,
                If(
                    varCntSelect,
                    scr16_hdr_TopHeader.Height + scr16_shp_Rectangle_1.Height + scr16_shp_Rectangle_1.Height,
                    scr16_hdr_TopHeader.Height + scr16_shp_Rectangle_1.Height
                ),
                3,
                scr16_hdr_TopHeader.Height + scr16_shp_Rectangle_1.Height + scr16_txt_SearchBox.Height + 3,
                scr16_hdr_TopHeader.Height + scr16_shp_Rectangle_1.Height
            )
        ZIndex: =2

        Container11_1 As groupContainer.verticalAutoLayoutContainer:
            Height: =150
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGridColumns: =6
            LayoutGridRows: =6
            LayoutMode: =LayoutMode.Auto
            Width: =Parent.Width
            ZIndex: =2

            Container6_1 As groupContainer.horizontalAutoLayoutContainer:
                Height: =Parent.Height - scr01_shp_GalleryBaseSeparator_1.Height
                LayoutGridColumns: =6
                LayoutGridRows: =6
                LayoutMaxHeight: =
                LayoutMaxWidth: =
                LayoutMinHeight: =112
                LayoutMinWidth: =250
                LayoutMode: =LayoutMode.Auto
                Width: =Parent.Width
                ZIndex: =1

                shpBorder_4 As rectangle:
                    Fill: =Color.Transparent
                    Height: =Parent.Height
                    LayoutMaxHeight: =
                    LayoutMaxWidth: =
                    Width: =10
                    ZIndex: =1

                scr16_chk_Select_2 As checkbox:
                    AlignInContainer: =AlignInContainer.Center
                    BorderStyle: =BorderStyle.None
                    CheckboxBackgroundFill: =If(Self.Value, RGBA(34, 102, 227, 1),Color.White)
                    CheckboxBorderColor: =RGBA(34, 102, 227, 1)
                    CheckboxSize: =42
                    CheckmarkFill: =Color.White
                    Color: =RGBA(34, 102, 227, 1)
                    Default: |
                        =!IsEmpty(Filter(colSelectedReportIds,reportNumber = ThisItem.'Expense report number'))
                    Font: =Font.'Segoe UI'
                    FontWeight: =FontWeight.Lighter
                    Height: =35
                    LayoutMaxHeight: =
                    LayoutMaxWidth: =
                    LayoutMinHeight: =85
                    LayoutMinWidth: =280
                    OnCheck: |-
                        =Collect(colSelectedReportIds, {reportNumber : ThisItem.'Expense report number'})
                    OnSelect: =Select(scr16_shp_SelectRegion_4)
                    OnUncheck: =RemoveIf(colSelectedReportIds, reportNumber = ThisItem.'Expense report number')
                    Reset: =varCntSelect Or scr01_chk_SelectAll.Value
                    Size: =21
                    Text: |-
                        =If(
                            ThisItem.'Purpose (mserp_purpose)' <> "" || !IsBlank(ThisItem.'Purpose (mserp_purpose)'),
                            Concatenate("Report bearing title ", ThisItem.'Purpose (mserp_purpose)', If(Self.Value, " selected", " unselected")),
                            Concatenate("Report bearing amount ", Concatenate(Text(Value(ThisItem.Amount),"#,#0.00", varDefaultLanguage), " ", varDefaultCurrency), If(Self.Value, " selected", " unselected"))
                        )
                    VerticalAlign: =VerticalAlign.Bottom
                    Visible: =varCntSelect
                    Width: =43
                    X: =18
                    Y: =40
                    ZIndex: =2

                Container7_1 As groupContainer.verticalAutoLayoutContainer:
                    Height: =225
                    LayoutDirection: =LayoutDirection.Vertical
                    LayoutGridColumns: =6
                    LayoutGridRows: =6
                    LayoutJustifyContent: =LayoutJustifyContent.Center
                    LayoutMaxHeight: =
                    LayoutMaxWidth: =
                    LayoutMinHeight: =112
                    LayoutMinWidth: =250
                    LayoutMode: =LayoutMode.Auto
                    ZIndex: =4

                    Label5_2 As label:
                        AutoHeight: =true
                        Font: =Font.'Segoe UI'
                        Height: =70
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        LayoutMinHeight: =70
                        LayoutMinWidth: =560
                        OnSelect: =Select(scr16_shp_SelectRegion_4)
                        PaddingLeft: =15
                        PaddingRight: =0
                        Size: =21
                        TabIndex: =If(IsBlank(Self.Text), -1, 0)
                        Text: =ThisItem.'Purpose (mserp_purpose)'
                        Width: =Parent.Width
                        ZIndex: =1

                    Label6_2 As label:
                        AutoHeight: =true
                        Color: |
                            =If(
                                ThisItem.'Document Status' = 'Document Status (mserp)'.Rejected,
                                RGBA(165, 33, 33, 1),
                                RGBA(102, 102, 102, 1)
                            )
                        Font: =Font.'Segoe UI'
                        Height: =70
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        LayoutMinHeight: =70
                        LayoutMinWidth: =560
                        OnSelect: =Select(scr16_shp_SelectRegion_4)
                        PaddingLeft: =15
                        PaddingRight: =0
                        Size: =21
                        TabIndex: =If(IsBlank(Self.Text), -1, 0)
                        Text: |-
                            =If(
                                ThisItem.'Document Status' = 'Document Status (mserp)'.Rejected,
                                GlobalLabels.Labels.'15062:LocalizedName,msdyn_ReportRejectedLabel',
                                ThisItem.Description
                            )
                        Width: =Parent.Width
                        ZIndex: =2

                Container9_1 As groupContainer.verticalAutoLayoutContainer:
                    FillPortions: =0
                    Height: =225
                    LayoutAlignItems: =LayoutAlignItems.Center
                    LayoutDirection: =LayoutDirection.Vertical
                    LayoutGridColumns: =6
                    LayoutGridRows: =6
                    LayoutJustifyContent: =LayoutJustifyContent.Center
                    LayoutMaxHeight: =
                    LayoutMaxWidth: =
                    LayoutMinHeight: =112
                    LayoutMinWidth: =250
                    LayoutMode: =LayoutMode.Auto
                    Width: =200
                    ZIndex: =5

                    Label5_3 As label:
                        Align: =Align.Center
                        AutoHeight: =true
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =70
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        LayoutMinHeight: =70
                        LayoutMinWidth: =560
                        OnSelect: =Select(scr16_shp_SelectRegion_4)
                        Size: =21
                        TabIndex: =If(IsBlank(Self.Text), -1, 0)
                        Text: |-
                            =Concatenate(Text(Value(ThisItem.'Amount (mserp_amounttotal)'),"#,#0.00", varDefaultLanguage), " ", varDefaultCurrency)
                        Width: =Parent.Width
                        ZIndex: =1

                    Label6_3 As label:
                        Align: =Align.Center
                        AutoHeight: =true
                        Font: =Font.'Segoe UI'
                        Height: =70
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        LayoutMinHeight: =70
                        LayoutMinWidth: =560
                        OnSelect: =Select(scr16_shp_SelectRegion_4)
                        Size: =21
                        TabIndex: =If(IsBlank(Self.Text), -1, 0)
                        Text: |-
                            =Text(
                                DateValue(ThisItem.CreatedDate),
                                "mmm dd, yyyy"
                            )
                        Width: =Parent.Width
                        ZIndex: =2

                Icon3_1 As icon.ChevronRight:
                    AlignInContainer: =AlignInContainer.Center
                    Color: =RGBA(110, 110, 110, 1)
                    Icon: =Icon.ChevronRight
                    LayoutMaxHeight: =
                    LayoutMaxWidth: =
                    OnSelect: =Select(scr16_shp_SelectRegion_RightIcon_1);
                    PaddingBottom: =15
                    PaddingTop: =15
                    Visible: =varCntSelect
                    ZIndex: =6

            scr01_shp_GalleryBaseSeparator_1 As rectangle:
                AlignInContainer: =AlignInContainer.Center
                Fill: =RGBA(225, 225, 225, 1)
                Height: =1
                LayoutMaxHeight: =
                LayoutMaxWidth: =
                LayoutMinHeight: =1
                Width: =Parent.Width - 10
                ZIndex: =2

        scr16_shp_SelectRegion_RightIcon_1 As rectangle:
            AccessibleLabel: ="Select expense"
            Fill: =RGBA(0, 0, 0, 0)
            FocusedBorderThickness: =0
            Height: =Parent.TemplateHeight
            OnSelect: =Select(Parent)
            TabIndex: =0
            Visible: =varCntSelect
            Width: =Parent.Width - Self.X
            X: =scr16_shp_SelectRegion_4.Width
            ZIndex: =3

        scr16_shp_SelectRegion_4 As rectangle:
            AccessibleLabel: ="Select expense"
            Fill: =RGBA(0, 0, 0, 0)
            FocusedBorderThickness: =0
            Height: =Parent.TemplateHeight
            OnSelect: |-
                =If(
                    varCntSelect,
                    If(
                        IsBlank(LookUp(colSelectedReportIds, reportNumber = ThisItem.'Expense report number')) && Text(ThisItem.'Document Status') <> "Rejected",
                        Collect(colSelectedReportIds, {reportNumber : ThisItem.'Expense report number'}),
                        RemoveIf(colSelectedReportIds, reportNumber = ThisItem.'Expense report number')
                    ),
                    Select(Parent)
                )
            TabIndex: =0
            Width: =Container9_1.X + Container9_1.Width
            ZIndex: =4

    scr16_lbl_DummyLabel As label:
        Fill: =scr16_txt_SearchBox.Fill
        Height: =scr16_txt_SearchBox.Height
        Size: =21
        Text: =""
        Visible: =varcntSelectedStatus = 3
        Width: =Parent.Width
        Y: =scr16_txt_SearchBox.Y
        ZIndex: =3

    scr16_cmp_Footer_1 As cmp_Footer_3:
        ApprovalsText: |-
            =GlobalLabels.Labels.'15062:LocalizedName,msdyn_ApprovalsLabel'
        DisplayMode: =!IsBlank(varSelectedLegalEntity)
        ExpensesText: |-
            =GlobalLabels.Labels.'15062:LocalizedName,msdyn_ExpensesLabel'
        OnApprovalsButtonClick: |-
            =UpdateContext({varcntShowFilter : false});
            Set(varSelectedTab, 4); Navigate('Approvals - List Screen', ScreenTransition.Fade, {varFiltersApplied:false, varSelectedProjects:Blank(), varSelectedUsers: Blank(), varcntSelectedStatus:1});
            Reset(scr25_cmb_Project);
            Reset(scr25_cmb_User);
        OnExpensesButtonClick: |-
            =UpdateContext({varcntShowFilter : false});
            Set(varSelectedTab, 2); Navigate('Expenses - List Screen',ScreenTransition.Fade)
        OnReceiptsButtonClick: |-
            =UpdateContext({varcntShowFilter : false});
            Set(varSelectedTab, 1); Navigate('Receipts - List Screen',ScreenTransition.Fade)
        OnReportsButtonClick: |
            =UpdateContext({varcntShowFilter : false});
            Set(varSelectedTab, 3); 
            Navigate('Reports - List Screen', ScreenTransition.Fade ,{varcntSelectedStatus:1})
        paramInDefaultSelectedTab: =3
        ReceiptText: |-
            =GlobalLabels.Labels.'15062:LocalizedName,msdyn_ReceiptsLabel'
        ReportText: |-
            =GlobalLabels.Labels.'15062:LocalizedName,msdyn_ExpenseReportsLabel'
        SelectedTab: =3
        Visible: =!varCntSelect
        Y: =App.Height - Self.Height
        ZIndex: =4

    scr16_shp_Rectangle As rectangle:
        Fill: =Color.White
        Height: =105
        OnSelect: |-
            =UpdateContext({varcntShowFilter:false});
        Width: =Parent.Width
        Y: =scr16_hdr_TopHeader.Height-2
        ZIndex: =5

    scr16_btn_FakeButton As button:
        DisplayMode: =DisplayMode.View
        Fill: =RGBA(241, 241, 241, 1)
        Height: =44
        RadiusBottomLeft: =50
        RadiusBottomRight: =50
        RadiusTopLeft: =50
        RadiusTopRight: =50
        Size: =24
        TabIndex: =-1
        Text: =""
        Visible: =false
        Width: =478
