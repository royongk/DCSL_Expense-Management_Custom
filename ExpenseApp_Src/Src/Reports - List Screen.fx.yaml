        Fill: =If(varcntSelectedStatus=3, RGBA(34, 102, 227, 1),scr16_btn_FakeButton.Fill)
        Height: =44
        HoverColor: =Self.Color
        HoverFill: =Self.Fill
        OnSelect: |-
            =UpdateContext({varcntSelectedStatus:3});
            UpdateContext({varCntSelect:false});
            Clear(colSelectedReportIds);
            Reset(scr16_btn_DateFilter);
            Reset(scr16_txt_SearchBox);
        PressedColor: =Self.Color
