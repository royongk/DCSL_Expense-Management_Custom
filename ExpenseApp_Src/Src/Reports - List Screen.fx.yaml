"'Reports - List Screen' As screen.'phoneBrowseLayout_ver3.0'":
    Fill: =Color.White
    OnVisible: |+
        =UpdateContext({varCntSelect: false});
        //UpdateContext({varIsDelegateSelected: false});
        UpdateContext({isExpReportDirty : false});
        Concurrent(
        Set(
            varIsCreateReport,
            false
        ),
        Set(
            varSelectedTab,
            3
        ),
        Set(
            varSelectedReport,
            Blank()
        )
        );
        Concurrent(
        Refresh('Expense reports (mserp)_1'),
        Refresh('DimAttributeTrvTravelTxtEntity (mserp)'),
        Refresh('Travel locations (mserp)'),
        Refresh('@DEEX:DEEX_20316 (mserp)')
        );
        If(
            IsEmpty(collApprovedFilterOptions),
            ClearCollect(
                collApprovedFilterOptions,
                {
                    number: 1,
                    title: GlobalLabels.Labels.'15062:LocalizedName,msdyn_FilterOneWeekLabel'  
                },
                {
                    number: 2,
                    title: GlobalLabels.Labels.'15062:LocalizedName,msdyn_FilterOneMonthLabel'  
                },
                {
                    number: 3,
                    title: GlobalLabels.Labels.'15062:LocalizedName,msdyn_FilterSixMonthsLabel'
                },
                {
                    number: 4,
                    title: GlobalLabels.Labels.'15062:LocalizedName,msdyn_FilterOneYearLabel'
                }
            )
        );
        Clear(colAttachedExpensesForReport);
        Clear(colAttachedExpenses);
        Reset(scr16_Reports_1);
        Reset(scr16_txt_SearchBox);
        // 기존 OnVisible 코드 하단에 아래 내용 추가
        
        // 1. 접속한 사용자의 마스터 정보 가져오기
        Set(
            varCurrentD365User,
            LookUp('Expense mobile master data (mserp)', mserp_usernetworkalias = User().Email)
        );
        
        // 2. 물리적 텍스트 필드(mserp_delegateduser)로 서버에서 직접 필터링
        ClearCollect(
            colActiveDelegations,
            Filter(
                '@DEEX:DEEX_20316 (mserp)',
                mserp_delegateduser = varCurrentD365User.mserp_userid && 
                mserp_fromdateutc <= Today() &&
                mserp_todateutc >= Today()
            )
        );
        
        // 3. 콤보박스 및 갤러리 필터링용 컬렉션 생성 (첫 번째: 접속자 본인)
        ClearCollect(
            colCreatingWorkerOptions,
            {
                WorkerID: userRecord.CreatingWorker, 
                WorkerName: varCurrentD365User.ID & " (MySelf)" 
            }
        );
        
        // 4. 대리 신청 대상자 컬렉션에 추가 (본인 + 대리인 데이터 통합 완료)
        ForAll(
            colActiveDelegations,
            Collect(
                colCreatingWorkerOptions,
                {
                    WorkerID: ThisRecord.Employee, 
                    WorkerName: ThisRecord.ID & " (Delegate)"
                }
            )
        );
        

    emptyStateComponent_4 As emptyStateComponent:
        subTitle: |-
            =Switch
            (
                varcntSelectedStatus,
                1, GlobalLabels.Labels.'15062:LocalizedName,msdyn_CreateReportToGetPaidLabel',
                2, GlobalLabels.Labels.'15062:LocalizedName,msdyn_SubmitReportToGetPaidLabel',
                3, "No Finance Approved reports",
                4, "No Budget holder Approved reports",
                5, "No Finance Rejected reports",
                6, "No Budget holder Rejected reports"
            )
        title: |-
            =GlobalLabels.Labels.'15062:LocalizedName,msdyn_NothingHereYetLabel'
        Visible: =scr16_Reports_1.AllItemsCount <= 0
        X: |
            =(Parent.Width - Self.Width)/2
        Y: |
            =scr16_Reports_1.Y + (Parent.Height - scr16_hdr_TopHeader.Height - scr16_cmp_Footer_1.Height - Self.Height)/2 - scr16_lbl_DummyLabel.Height

    "scr16_Reports_1 As gallery.'BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0'":
        '#CopilotOverlayLabel': ="Filtered"
        AccessibleLabel: |-
            =Switch(
                varcntSelectedStatus,
                1,
                "List of draft reports",
                2,
                "List of submitted reports",
                3,
                "List of approved reports",
                4,
                "List of rejected reports"
            )
        Default: ={}
        DelayItemLoading: =true
        Height: |-
            =Min(
                scr16_cmp_Footer_1.Y - Self.Y,
                Self.TemplateHeight * CountRows(Self.AllItems)
            )
        Items: |-
            =With(
                {
                    // 1. varAppMode에 매핑되는 Purpose 값을 사전에 정의합니다.
                    mappedPurpose: Switch(
                        varAppMode,
                        "ExpenseReport", "Expense reimbursement",
                        "BillingTripSettlement", "Billing Trip Settlement",
                        "CashAdvance", "Cash Advance",
                        "EmployeeBenefit", "Employee Benefit",
                        "SalaryAdvance", "Salary Advance",
                        Blank()
                    ),
                    
                    // 2. 기준 과거 날짜 상수 (DateTime 형식 일치)
                    dtOneWeekAgo: DateAdd(Now(), -7, TimeUnit.Days),
                    dtOneMonthAgo: DateAdd(Now(), -30, TimeUnit.Days),
                    dtSixMonthsAgo: DateAdd(Now(), -180, TimeUnit.Days),
                    dtOneYearAgo: DateAdd(Now(), -365, TimeUnit.Days)
                },
                SortByColumns(
                    Filter(
                        // 상태별 필터링
                        Switch(
                            varcntSelectedStatus,
                            1, Filter('Expense reports (mserp)_1', 'Document Status' = 'Document Status (mserp)'.Draft),
                            2, Filter('Expense reports (mserp)_1', 'Document Status' = 'Document Status (mserp)'.Submitted),
                            // 💡 상태 3: Finance Approved
                            3, Filter('Expense reports (mserp)_1', 
                                    'Document Status' = 'Document Status (mserp)'.Approved && 
                                    /* 예시: 승인 단계 필드 추가 */ 
                                    ('Document status' = 'Document status (mserp)'.Draft || 'Document status' = 'Document status (mserp)'.Submitted || 'Document status' = 'Document status (mserp)'.'In review')
                                ),
                            // 💡 상태 4: Budget holder Approved
                            4, Filter('Expense reports (mserp)_1', 
                                    'Document Status' = 'Document Status (mserp)'.Approved && 
                                    /* 예시: 승인 단계 필드 추가 */ 
                                    'Document status' = 'Document status (mserp)'.Approved
                                ),
                            // 💡 상태 5: Finance Rejected
                            5, Filter('Expense reports (mserp)_1', 
                                    'Document Status' = 'Document Status (mserp)'.Rejected && 
                                    /* 예시: 승인 단계 필드 추가 */ 
                                    'Document status' = 'Document status (mserp)'.Draft
                                ),
                            // 💡 상태 6: Budget holder Rejected
                            6, Filter('Expense reports (mserp)_1', 
                                    'Document Status' = 'Document Status (mserp)'.Rejected && 
                                    /* 예시: 승인 단계 필드 추가 */ 
                                    'Document status' = 'Document status (mserp)'.Rejected
                                )
                        ),
                        
                        // 법인(Legal Entity) 필터링
                        Upper(DEEXLegalEntity_DataArea) = Upper(varSelectedLegalEntity),
                        
                        // 💡 3. [수정됨] 대리인/본인 상시 조회 필터링
                        // If문 없이 무조건 컬렉션 배열에 포함된 WorkerID를 조회합니다.
                        // 대리인이 없으면 본인 ID만 1개 있으므로 본인 데이터만 나오고,
                        // 대리인이 있으면 본인+대리인 ID가 모두 있으므로 통합되어 출력됩니다.
                        'Employee (mserp_creatingworker)' in colCreatingWorkerOptions.WorkerID,
                        
                        // AppMode에 따른 Purpose 필터링
                        IsBlank(mappedPurpose) || 'Purpose (mserp_purpose)' = mappedPurpose
                    ), 
                    "mserp_createddate", SortOrder.Descending
                )
            )
        Layout: =Layout.Vertical
        LoadingSpinner: =LoadingSpinner.Data
        OnSelect: |-
            =UpdateContext({varcntShowFilter:false});
            // ⚠️ LookUp from original data source FIRST to ensure field name compatibility
            Set(
                varSelectedReport,
                LookUp('Expense reports (mserp)','Expense report number' = ThisItem.'Expense report number' && LegalEntity_DataArea = varSelectedLegalEntity)
            );
            // ✅ Use varSelectedReport.'Document Status' from original data source for type consistency
            Set(
                varSelectedReportStatusItem,
                varSelectedReport.'Document Status'
            );
            // ✅ Reset varSelectedTravelReq when selecting a report from list (not from Travel Requisition)
            Set(varSelectedTravelReq, Blank());
            Clear(colAttachedExpensesForReport);
            ForAll(
                Split(varSelectedReport.ExpTransNumber, ",") As attachedExpenses,
                Collect(
                    colAttachedExpensesForReport,
                    LookUp('Expense Line Expense Mobile Entity (mserp)','Expense transaction number (mserp_exptransnumber)' = attachedExpenses[@Value] && 'Expense line type' <> 'Expense line type (mserp)'.'Itemized line')
                )
            );
            ClearCollect(
                colAttachedExpenses,
                colAttachedExpensesForReport
            );
            
            If(
                varSelectedReportStatusItem in dsDrafts,
                Navigate('Reports - Edit Screen'),
                Navigate('Reports - View Only Screen');
            )
        TemplatePadding: =0
        TemplateSize: =150
        Width: =Parent.Width
        Y: |-
            =Switch(
                varcntSelectedStatus,
                1,
                If(
                    varCntSelect,
                    scr16_hdr_TopHeader.Height + scr16_shp_Rectangle_1.Height + scr16_shp_Rectangle_1.Height,
                    scr16_hdr_TopHeader.Height + scr16_shp_Rectangle_1.Height
                ),
                3,
                scr16_hdr_TopHeader.Height + scr16_shp_Rectangle_1.Height + scr16_txt_SearchBox.Height + 3,
                scr16_hdr_TopHeader.Height + scr16_shp_Rectangle_1.Height
            )
        ZIndex: =2

