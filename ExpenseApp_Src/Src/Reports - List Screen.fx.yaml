    scr16_drp_StatusFilter As dropdown:
        Default: |-
            =Switch(
                varcntSelectedStatus,
                1, "Draft",
                2, "Submitted",
                3, "Finance Approved",
                4, "Budget holder Approved",
                5, "Finance Rejected",
                6, "Budget holder Rejected",
                "Draft" // 매칭되는 값이 없을 경우의 기본값
            )
        Height: =44
        Items: |-
            =Table(
                { ID: 1, StatusName: "Draft" },
                { ID: 2, StatusName: "Submitted" },
                { ID: 3, StatusName: "Finance Approved" },
                { ID: 4, StatusName: "Budget holder Approved" },
                { ID: 5, StatusName: "Finance Rejected" },
                { ID: 6, StatusName: "Budget holder Rejected" }
            )
        OnChange: |-
            =// 1. 선택한 항목의 ID로 상태 변수를 업데이트합니다.
            UpdateContext({varcntSelectedStatus: Self.Selected.ID});
            
            // 2. 다른 상태로 넘어갈 때 공통적으로 필터 및 다중 선택 모드를 초기화합니다.
            UpdateContext({varCntSelect: false});
            UpdateContext({varcntShowFilter: false});
            Clear(colSelectedReportIds);
            
            // 3. Approved(3, 4번) 상태로 이동할 때만 날짜 필터와 검색 박스를 초기화합니다.
            If(
                Self.Selected.ID = 3 || Self.Selected.ID = 4,
                Reset(scr16_btn_DateFilter);
                Reset(scr16_txt_SearchBox)
            )
        Size: =21
        Width: =Parent.Width
        X: =(Parent.Width - Self.Width)/2
        Y: =scr16_rct_seprator.Y - scr16_shp_Rectangle.Y - 5
        ZIndex: =8

