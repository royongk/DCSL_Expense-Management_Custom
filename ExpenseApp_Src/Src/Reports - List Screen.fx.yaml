    "scr16_hdr_TopHeader As 'main-app-header'":
        firstIcon: =
        firstIconAccessibleLabel: =
        firstIconAction: =
        homeIcon: =homeIcon
        homeIconAccessibleLabel: ="Navigate Home"
        homeIconAction: =Navigate('Main Screen',ScreenTransition.Fade)
        OnSelectButton: |-
            =Set(
                gblNavigationDrawerVisibility,
                true
            );
            Set(
                gblScreenName,
                'Reports - List Screen'
            );
            Refresh('Expense mobile notifications (mserp)');
            ClearCollect(
                colExpenseNoticationInfo,
                ForAll(
                    Filter('Expense mobile notifications (mserp)',NotifiedEmailId = User().Email) As ExpenseNotification,
                    {
                        RecId: ExpenseNotification.EntRecId,
                        ReadMessage: ExpenseNotification.Read
                    }
                )
            );
        paramAvatar: =Coalesce(userImage, blankImage)
        paramTitle: |-
            =GlobalLabels.Labels.'15062:LocalizedName,msdyn_ExpenseReportsLabel'
        refreshIconAction: |-
            =UpdateContext({varCntSelect:false});
            Set(
                varIsCreateReport,
                false
            );
            Set(
                varSelectedTab,
                3
            );
            Refresh('Expense reports (mserp)_1');
            ClearCollect(
                collectionICLE,
                ForAll(
                Split(LookUp('Legal entities (mserp)',Company = varSelectedLegalEntity,IntercompanyLEs), ",") As legalEntityAlias,
                {
                    Value: Upper(legalEntityAlias.Value)
                }
                )
            );
            If(
                IsEmpty(collApprovedFilterOptions),
                ClearCollect(
                    collApprovedFilterOptions,
                    {
                        number: 1,
                        title: GlobalLabels.Labels.'15062:LocalizedName,msdyn_FilterOneWeekLabel'  
                    },
                    {
                        number: 2,
                        title: GlobalLabels.Labels.'15062:LocalizedName,msdyn_FilterOneMonthLabel'  
                    },
                    {
                        number: 3,
                        title: GlobalLabels.Labels.'15062:LocalizedName,msdyn_FilterSixMonthsLabel'
                    },
                    {
                        number: 4,
                        title: GlobalLabels.Labels.'15062:LocalizedName,msdyn_FilterOneYearLabel'
                    }
                )
            );
            Clear(colAttachedExpensesForReport)
        secondIcon: |-
            =If(
                varcntSelectedStatus = 1,
                If(
                    varcntSelectedStatus = 1 && CountRows(colSelectedReportIds) > 0,
                    DeleteIconEnabled,
                    DeleteIconDisabled
                )
            )
        secondIconAccessibleLabel: =If(Self.secondIcon = DeleteIconEnabled, "Delete reports", "Disabled delete")
        secondIconAction: |-
            =If(
                varcntSelectedStatus = 1 && CountRows(colSelectedReportIds) > 0,
                UpdateContext({varCntDelete: true})
            )
        thirdIcon: |-
            =If(
                varcntSelectedStatus = 1,
                If(
                    varCntSelect,
                    SelectorCloseIcon,
                    SelectorIcon
                )
            )
        thirdIconAccessibleLabel: =If(Self.thirdIcon = SelectorIcon, "Multiselect reports", "Cancel")
        thirdIconAction: |-
            =If(
                varCntSelect,
                UpdateContext({varCntSelect: false}),
                UpdateContext({varCntSelect: true})
            );
            Clear(colSelectedReportIds)
        ZIndex: =23

    scr16_cmp_DeleteConfirmationDialog As cmp02_ConfirmationDialog:
        controlName: ="scr16_cmp_DeleteConfirmationDialog"
        OnLeftButtonClick: |-
            =UpdateContext({varCntDelete: false});
        OnRightButtonClick: |-
            =Clear(deleteErrorsList);
            ForAll(
                colSelectedReportIds,
                IfError(
                    Remove(
                        'Expense reports (mserp)',
                        LookUp(
                            'Expense reports (mserp)',
                            'Expense report number' = colSelectedReportIds[@reportNumber]
                        )
                    ),
                    Collect(
                        deleteErrorsList,
                        {
                            message : Last(Split(FirstError.Message, ":")).Value
                        }
                    )
                )
            );
            If(
                CountRows(deleteErrorsList) = 0,
                Notify(
                    GlobalLabels.Labels.'15062:LocalizedName,msdyn_ReportsDeletedSuccessfullyLabel',
                    NotificationType.Success, 
                    gblParams.notificationTime
                ),
                ForAll(
                    Distinct(deleteErrorsList,message),
                    Notify(
                        ThisRecord.Value,
                        NotificationType.Error, 
                        gblParams.notificationTime
                    )
                )
            );
            UpdateContext({varCntDelete: false});
            UpdateContext({varCntSelect: false});
            Clear(colSelectedReportIds);
        parmInDescriptionText: |-
            =GlobalLabels.Labels.'15062:LocalizedName,msdyn_DeleteSelectedReportsConfirmationTextLabel'
        parmInHeaderText: |-
            =GlobalLabels.Labels.'15062:LocalizedName,msdyn_DeleteSelectedReportsHeaderLabel'
        parmInLeftButtonColor: =RGBA(34, 102, 227, 1)
        parmInLeftButtonText: |-
            =GlobalLabels.Labels.'15062:LocalizedName,msdyn_CancelLabel'
        parmInRightButtonColor: =RGBA(195, 39, 39, 1)
        parmInRightButtonText: |-
            =GlobalLabels.Labels.'15062:LocalizedName,msdyn_DeleteLabel'
        returnFocus: ="scr16_hdr_TopHeader"
        Visible: =varCntDelete
        Y: =0
        ZIndex: =24

