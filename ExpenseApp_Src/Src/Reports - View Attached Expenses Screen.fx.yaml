"'Reports - View Attached Expenses Screen' As screen":
    Fill: =RGBA(229, 229, 229, 1)
    OnVisible: =

    scr19_btn_Done As button:
        Fill: =RGBA(34, 102, 227, 1)
        Height: =88
        OnSelect: |-
            =If(
                varSelectedReportStatusItem in dsDrafts,
                Navigate('Reports - Edit Screen');
                UpdateContext({varExpenseReportNumber : varSelectedReport.'Expense report number'});
                Set(
                    varSelectedReport,
                    LookUp('DCSL Expense Moblie Report (mserp)', 'Expense report number' = varExpenseReportNumber)
                ),
                Navigate('Reports - View Only Screen')
            )
        Size: =24
        Text: |-
            =GlobalLabels.Labels.'15062:LocalizedName,msdyn_DoneButtonLabel'
        Width: |
            =Parent.Width -  Self.X*2
        X: =40
        Y: =Parent.Height - Self.Height - 25
        ZIndex: =1

    "scr19_glr_AttachedExpenses As gallery.'BrowseLayout_Vertical_TwoTextOneImageVariant_ver4.0'":
        '#CopilotOverlayLabel': ="Filtered"
        AccessibleLabel: ="List of attached expenses"
        Fill: =Color.White
        FocusedBorderColor: =
        FocusedBorderThickness: =0
        Height: =Min((Self.TemplateHeight) * CountRows(Self.AllItems), scr19_btn_Done.Y - Self.Y - 25)
        Items: =colAttachedExpenses
        Layout: =Layout.Vertical
        OnSelect: |-
            =
            //set details for the next screen 
            Concurrent(
                Set(
                    varIsCreate,
                    false
                ),
                Set(
                    varReceiptImage,
                    Blank()
                )
            );
            If(
                varSelectedReportStatusItem in dsDrafts,
                //assign the expense to a varSelectedExpenseDoc
                Set(
                    varSelectedExpenseDoc,
                    LookUp('DCSL Expense Line Expense Moblie Entity (mserp)','Expense transaction number (mserp_exptransnumber)' = ThisItem.'Expense transaction number (mserp_exptransnumber)')
                );
                Set(
                    varReceiptImage,
                    LookUp('Expense Mobile Attached Document Entity (mserp)', EntRecId = Value(varSelectedExpenseDoc.AttachedReceiptId),CapturedDocument)
                );
            
                Set(
                    varSelectedReceiptNumber,
                    Blank()
                );
                Set(
                    varExpenseAgainstWorkItem,
                    Blank()
                );
                //collect policy violations
                If(
                    varSelectedExpenseDoc.PolicyViolationCount,
                    ClearCollect(
                        colPolViolations,
                        Split(varSelectedExpenseDoc.PolicyViolationErrorMessage, "~|~")
                    );
                    UpdateContext({varMaxViolationLevel : varSelectedExpenseDoc.PolicyViolationsLevel});
                    UpdateContext({varNumViolation : varSelectedExpenseDoc.PolicyViolationCount}),
                    Clear(colPolViolations);
                    UpdateContext({varMaxViolationLevel : 0});
                    UpdateContext({varNumViolation : 0})
                );
                
                Navigate('Expenses - Edit Screen', ScreenTransition.None, {varNavigatedFrom : "scr19", varMaxViolationLevel : varMaxViolationLevel, varNumViolation: varNumViolation}),
                
                Set(
                    varSelectedExpenseDoc,
                    LookUp('DCSL Expense Line Expense Moblie Entity (mserp)', 'Expense transaction number (mserp_exptransnumber)' = ThisItem.'Expense transaction number (mserp_exptransnumber)')
                );
            
                Set(
                    varReceiptImage,
                    LookUp('Expense Mobile Attached Document Entity (mserp)', EntRecId = Value(varSelectedExpenseDoc.AttachedReceiptId),CapturedDocument)
                );
                Set(
                    varFileFormat,
                    LookUp('Expense Mobile Attached Document Entity (mserp)', EntRecId = Value(varSelectedExpenseDoc.AttachedReceiptId), FileExtension)
                );
                Set(
                        varSelectedReceiptNumber,
                        Blank()
                );
                If(
                    varSelectedExpenseDoc.PolicyViolationCount,
                    ClearCollect(
                        colPolViolations,
                        Split(varSelectedExpenseDoc.PolicyViolationErrorMessage, "~|~")
                    );
                    UpdateContext({varMaxViolationLevel : varSelectedExpenseDoc.PolicyViolationsLevel});
                    UpdateContext({varNumViolation : varSelectedExpenseDoc.PolicyViolationCount}),
                    Clear(colPolViolations);
                    UpdateContext({varMaxViolationLevel : 0});
                    UpdateContext({varNumViolation : 0})
                );
                Navigate('Expenses - View Only Screen', ScreenTransition.None, {varNavigatedFrom : "scr19", varMaxViolationLevel : varMaxViolationLevel, varNumViolation : varNumViolation})
            )
        TemplatePadding: =0
        TemplateSize: =129
        Visible: |+
            =/*If(
                CountRows(colAttachedExpenses) > 0,
                true,
                false
            );*/
            true
            
        Width: =Parent.Width
        Y: =scr19_hdr_TopHeader.Height + 67
        ZIndex: =2

        scr19_img_Category As image:
            Height: =30
            Image: |-
                =If(
                    Value(ThisItem.PolicyViolationsLevel) = 0,
                    LookUp(dsCategoryImages,expenseType=ThisItem.'Expense type').icon,
                    Value(ThisItem.PolicyViolationsLevel) > 0 && Value(ThisItem.PolicyViolationsLevel) <= 2,
                    LookUp(dsCategoryImages,expenseType=ThisItem.'Expense type').iconYellow,
                    Value(ThisItem.PolicyViolationsLevel) > 2,
                    LookUp(dsCategoryImages,expenseType=ThisItem.'Expense type').iconRed
                )
            OnSelect: =Select(Parent)
            Width: =50
            X: =16
            Y: =(Parent.TemplateHeight / 2) - (Self.Height / 2)
            ZIndex: =6

        scr19_lbl_Merchant As label:
            BorderColor: =RGBA(0, 0, 0, 1)
            Font: =Font.'Segoe UI'
            Height: =37
            LineHeight: =1
            OnSelect: =Select(Parent)
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =21
            TabIndex: =If(IsBlank(Self.Text), -1, 0)
            Text: |-
                =If(
                    ThisItem.'Expense type' = 'TrvExpType (mserp)'.'Per diem',
                    Concatenate("Perdiem - ", ThisItem.'Location (mserp_trvlocations_location)'),
                    ThisItem.Merchant
                )
            VerticalAlign: =VerticalAlign.Top
            Width: =373
            X: =71
            Y: =40
            ZIndex: =7

        scr19_shp_Seprator As rectangle:
            Fill: =RGBA(225, 225, 225, 1)
            Height: =1
            Width: =Parent.TemplateWidth
            Y: =Parent.TemplateHeight - 1
            ZIndex: =8

        scr19_lbl_Amount As label:
            Align: =Align.Right
            BorderColor: =RGBA(0, 0, 0, 1)
            Font: =Font.'Segoe UI'
            FontWeight: =FontWeight.Bold
            Height: =46
            OnSelect: =Select(Parent)
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =21
            TabIndex: =If(IsBlank(Self.Text), -1, 0)
            Text: |+
                =Concatenate(Text(Value(ThisItem.'Transaction amount'), "#,#0.00", varDefaultLanguage), " ", LookUp('Currencies (mserp)', 'Currency code' = ThisItem.'Currency (mserp_exchangecode)', 'Currency code'))
                
            VerticalAlign: =VerticalAlign.Top
            Width: =250
            X: =Parent.Width - Self.Width - 15
            Y: =40
            ZIndex: =9

        scr19_lbl_Date As label:
            Align: =Align.Right
            BorderColor: =RGBA(0, 0, 0, 1)
            Color: |
                =RGBA(102, 102, 102, 1)
            Font: =Font.'Segoe UI'
            Height: =28
            OnSelect: =Select(Parent)
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =16.5
            TabIndex: =If(IsBlank(Self.Text), -1, 0)
            Text: |-
                =Text(
                    DateTimeValue(ThisItem.'Transaction date'),
                    "mmm dd, yyyy"
                )
            VerticalAlign: =VerticalAlign.Top
            X: =scr19_lbl_Amount.X + scr19_lbl_Amount.Width - Self.Width 
            Y: =86
            ZIndex: =10

        scr19_lbl_ProjectName As label:
            BorderColor: =RGBA(0, 0, 0, 1)
            Color: |
                =RGBA(102, 102, 102, 1)
            Font: =Font.'Segoe UI'
            Height: =Self.Size * 1.8
            OnSelect: =Select(Parent)
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =18
            TabIndex: =If(IsBlank(Self.Text), -1, 0)
            Text: =ThisItem.ProjectName
            VerticalAlign: =VerticalAlign.Top
            Visible: =!(scr19_lbl_Warning.Visible)
            Width: =scr19_lbl_Merchant.Width
            X: =scr19_lbl_Merchant.X
            Y: =scr19_lbl_Merchant.Y + scr19_lbl_Merchant.Height + 4
            ZIndex: =11

        scr19_lbl_Warning As label:
            BorderColor: =RGBA(0, 0, 0, 1)
            Color: |-
                =If(
                    Value(ThisItem.PolicyViolationsLevel) <= 2,
                    RGBA(152, 111, 11, 1),
                    RGBA(217, 44, 44, 1)
                )
            Font: =Font.'Segoe UI'
            Height: =Self.Size * 1.8
            OnSelect: =Select(Parent)
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            Size: =18
            TabIndex: =If(IsBlank(Self.Text), -1, 0)
            Text: |-
                =If(
                    Value(ThisItem.PolicyViolationCount) > 0,
                    Substitute(GlobalLabels.Labels.'15062:LocalizedName,msdyn_FoundPolicyViolationLabel', "$", Text(ThisItem.PolicyViolationCount))
                )
            VerticalAlign: =VerticalAlign.Top
            Visible: =(Value(ThisItem.PolicyViolationCount) > 0)
            Width: =scr19_lbl_Merchant.Width
            X: =scr19_lbl_Merchant.X
            Y: =scr19_lbl_Merchant.Y + scr19_lbl_Merchant.Height + 4
            ZIndex: =12

    scr19_EditAttachedExpenses As button:
        BorderColor: =RGBA(34, 102, 227, 1)
        Color: =RGBA(34, 102, 227, 1)
        DisplayMode: |-
            =DisplayMode.Edit
            /*
            If(
                IsMatch(varSelectedReportStatus, "create"),
                Edit,
                View
            )
            */
        Fill: ='Reports - Edit Screen'.Fill
        FocusedBorderThickness: =2
        Height: =45
        HoverBorderColor: =
        HoverColor: =Self.Color
        HoverFill: =
        OnSelect: |-
            =Navigate('Reports - Attach Expenses Screen', ScreenTransition.None, {varCntBack_scr17 : false});
        PressedBorderColor: =Self.BorderColor
        PressedColor: =Self.Color
        PressedFill: =Self.Fill
        RadiusBottomLeft: =4
        RadiusBottomRight: =4
        RadiusTopLeft: =4
        RadiusTopRight: =4
        Size: =16
        Text: |-
            =GlobalLabels.Labels.'15062:LocalizedName,msdyn_EditLabel'
        Visible: =varSelectedReportStatusItem in dsDrafts
        Width: =130
        X: =(Parent.Width - Self.Width) - 15
        Y: =93
        ZIndex: =3

    scr19_lbl_NumAttachedExp As label:
        Font: =Font.'Segoe UI'
        Height: =32
        Size: =18
        Text: |-
            =If(
                CountRows(colAttachedExpenses) = 0,
                GlobalLabels.Labels.'15062:LocalizedName,msdyn_NoAttachedExpensesLabel',
                Substitute(GlobalLabels.Labels.'15062:LocalizedName,msdyn_AttachedExpensesCountLabel',"$",CountRows(colAttachedExpenses))
            )
        Width: =500
        X: =22
        Y: =scr19_hdr_TopHeader.Height + 17.5
        ZIndex: =4

    scr19_hdr_TopHeader As hdr02_Header:
        Fill: =scr19_hdr_TopHeader.paramFill
        paramFill: =RGBA(255, 255, 255, 1)
        paramTitle: |-
            =GlobalLabels.Labels.'15062:LocalizedName,msdyn_ViewAttachedExpensesLabel'
        ZIndex: =5

    scr19_ico_Back As icon.ChevronLeft:
        AccessibleLabel: ="Press to go back"
        Color: =icongconfig_backbutton.Color
        Fill: =icongconfig_backbutton.Fill
        Height: =icongconfig_backbutton.Height
        Icon: =Icon.ChevronLeft
        OnSelect: |-
            =If(
                varSelectedReportStatusItem in dsDrafts,
                Navigate('Reports - Edit Screen'),
                Navigate('Reports - View Only Screen')
            )
        TabIndex: =0
        Width: =icongconfig_backbutton.Width
        X: =22
        Y: =(scr03_hdr_TopHeader_1.Height-Self.Height)/2
        ZIndex: =6

