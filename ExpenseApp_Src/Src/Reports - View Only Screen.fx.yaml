                        UpdateContext({varNumViolation : 0})
                    );
                    Navigate('Expenses - View Only Screen', ScreenTransition.None, {varNavigatedFrom : "scr20", varMaxViolationLevel : varMaxViolationLevel, varNumViolation : varNumViolation})
                TemplatePadding: =0
                TemplateSize: =112
                Visible: =CountRows(colAttachedExpenses) > 0
                Width: =Parent.Width
                Y: =scr20_lbl_NumAttachedExp_1.Y + scr20_lbl_NumAttachedExp_1.Height + 22.5
                ZIndex: =4

                scr20_img_Category_1 As image:
                    Height: =30
                    Image: |-
                        =If(
                            Value(ThisItem.PolicyViolationsLevel) = 0,
                            LookUp(dsCategoryImages,expenseType=ThisItem.'Expense type').icon,
                            Value(ThisItem.PolicyViolationsLevel) > 0 && Value(ThisItem.PolicyViolationsLevel) <= 2,
                            LookUp(dsCategoryImages,expenseType=ThisItem.'Expense type').iconYellow,
                            Value(ThisItem.PolicyViolationsLevel) > 2,
                            LookUp(dsCategoryImages,expenseType=ThisItem.'Expense type').iconRed
                        )
                    OnSelect: =Select(Parent)
                    TabIndex: =0
                    Width: =50
                    X: =16
                    Y: =(Parent.TemplateHeight / 2) - (Self.Height / 2)
                    ZIndex: =6

                scr20_lbl_Merchant_1 As label:
                    BorderColor: =RGBA(0, 0, 0, 1)
                    Font: =Font.'Segoe UI'
                    Height: =37
                    LineHeight: =1
                    OnSelect: =Select(Parent)
                    PaddingBottom: =0
                    PaddingLeft: =0
                    PaddingRight: =0
                    PaddingTop: =0
                    Size: =21
                    TabIndex: =If(IsBlank(Self.Text), -1, 0)
                    Text: |-
                        =If(
                            ThisItem.'Expense type' = 'TrvExpType (mserp)'.'Per diem',
                            Concatenate("Perdiem - ", ThisItem.'Location (mserp_trvlocations_location)'),
                            ThisItem.Merchant
                        )
                    VerticalAlign: =VerticalAlign.Top
                    Width: =373
                    X: =71
                    Y: =23
                    ZIndex: =7

                scr20_shp_Seprator_1 As rectangle:
                    Fill: =RGBA(225, 225, 225, 1)
                    Height: =1
                    Width: =Parent.TemplateWidth
                    Y: =Parent.TemplateHeight - 1
                    ZIndex: =8

                scr20_lbl_Amount_3 As label:
                    Align: =Align.Right
                    BorderColor: =RGBA(0, 0, 0, 1)
                    Font: =Font.'Segoe UI'
                    FontWeight: =FontWeight.Bold
                    Height: =41
                    OnSelect: =Select(Parent)
                    PaddingBottom: =0
                    PaddingLeft: =0
                    PaddingRight: =0
                    PaddingTop: =0
                    Size: =21
                    TabIndex: =If(IsBlank(Self.Text), -1, 0)
                    Text: |-
                        =Concatenate(Text(Value(ThisItem.'Transaction amount'),"#,#0.00",varDefaultLanguage)," ",ThisItem.'Currency (mserp_exchangecode)')
                        //LookUp('Currencies (mserp)','Currency code'=varDefaultCurrency,'Currency code')
                    VerticalAlign: =VerticalAlign.Top
                    Width: =250
                    X: =Parent.Width - scr20_lbl_Amount_3.Width - 15
                    Y: =scr20_lbl_Merchant_1.Y
                    ZIndex: =9

                scr20_lbl_Date_1 As label:
                    Align: =Align.Right
                    BorderColor: =RGBA(0, 0, 0, 1)
                    Color: |
                        =RGBA(102, 102, 102, 1)
                    Font: =Font.'Segoe UI'
                    Height: =28
                    OnSelect: =Select(Parent)
                    PaddingBottom: =0
                    PaddingLeft: =0
                    PaddingRight: =0
                    PaddingTop: =0
                    Size: =16.5
                    TabIndex: =If(IsBlank(Self.Text), -1, 0)
                    Text: |-
                        =Text(
                            DateValue(ThisItem.'Transaction date'),
                            "mmm dd, yyyy"
                        )
                    VerticalAlign: =VerticalAlign.Top
                    X: =scr20_lbl_Amount_3.X + scr20_lbl_Amount_3.Width - Self.Width
                    Y: =69
                    ZIndex: =10

                scr20_lbl_ProjectName_1 As label:
                    BorderColor: =RGBA(0, 0, 0, 1)
                    Color: |
                        =RGBA(102, 102, 102, 1)
                    Font: =Font.'Segoe UI'
                    Height: =Self.Size * 1.8
                    OnSelect: =Select(Parent)
                    PaddingBottom: =0
                    PaddingLeft: =0
                    PaddingRight: =0
                    PaddingTop: =0
                    Size: =18
                    TabIndex: =If(IsBlank(Self.Text), -1, 0)
                    Text: =ThisItem.ProjectName
                    VerticalAlign: =VerticalAlign.Top
                    Visible: =!(scr20_lbl_Warning_1.Visible)
                    Width: =scr20_lbl_Merchant_1.Width
                    X: =scr20_lbl_Merchant_1.X
                    Y: =scr20_lbl_Merchant_1.Y + scr20_lbl_Merchant_1.Height + 4
                    ZIndex: =11

                scr20_lbl_Warning_1 As label:
                    BorderColor: =RGBA(0, 0, 0, 1)
                    Color: |-
                        =If(
                            Value(ThisItem.PolicyViolationsLevel) <= 2,
                            RGBA(152, 111, 11, 1),
                            RGBA(217, 44, 44, 1)
                        )
                    Font: =Font.'Segoe UI'
                    Height: =Self.Size * 1.8
                    OnSelect: =Select(Parent)
                    PaddingBottom: =0
                    PaddingLeft: =0
                    PaddingRight: =0
                    PaddingTop: =0
                    Size: =18
                    TabIndex: =If(IsBlank(Self.Text), -1, 0)
                    Text: |-
                        =If(
                            Value(ThisItem.PolicyViolationCount) > 0,
                            Substitute(GlobalLabels.Labels.'15062:LocalizedName,msdyn_FoundPolicyViolationLabel', "$", Text(ThisItem.PolicyViolationCount))
                        )
                    VerticalAlign: =VerticalAlign.Top
                    Visible: |-
                        =//ThisItem.receiptsAttached ="Yes" 
                        Value(ThisItem.PolicyViolationCount) > 0
                    Width: =scr17_lbl_Merchant_4.Width
                    Wrap: =false
                    X: =scr20_lbl_Merchant_1.X
                    Y: =scr20_lbl_Merchant_1.Y + scr20_lbl_Merchant_1.Height + 4
                    ZIndex: =12

