            scr20_btn_Done_1 As button:
                Fill: =RGBA(34, 102, 227, 1)
                Font: =Font.'Segoe UI'
                Height: =76
                OnSelect: |-
                    =Set(
                        gblNavigationDrawerVisibility,
                        false
                    );
                    //navigate to previous screen
                    Navigate('Reports - List Screen');
                RadiusBottomLeft: =8
                RadiusBottomRight: =8
                RadiusTopLeft: =8
                RadiusTopRight: =8
                Size: =19.15
                Text: |-
                    =GlobalLabels.Labels.'15062:LocalizedName,msdyn_DoneButtonLabel'
                Width: |
                    =Parent.Width -  Self.X*2
