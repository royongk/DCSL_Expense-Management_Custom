"'Travel - List Screen' As screen.'phoneBrowseLayout_ver3.0'":
    Fill: =Color.White
    OnVisible: |-
        =UpdateContext({varCntSelect: false});
        Refresh('Travel requisition (mserp)');
        Set(varSelectedTravelReq, Blank());
        Reset(scrTravel_Gallery);

    emptyStateComponent_Travel As emptyStateComponent:
        subTitle: ="No approved travel requisitions available"
        title: |-
            =GlobalLabels.Labels.'15062:LocalizedName,msdyn_NothingHereYetLabel'
        Visible: =scrTravel_Gallery.AllItemsCount <= 0
        X: |
            =(Parent.Width - Self.Width)/2
        Y: |
            =scrTravel_Gallery.Y + (Parent.Height - scrTravel_hdr_TopHeader.Height - scrTravel_cmp_Footer_1.Height - Self.Height)/2

    "scrTravel_Gallery As gallery.'BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0'":
        '#CopilotOverlayLabel': ="Filtered"
        AccessibleLabel: ="List of approved travel requisitions"
        Default: ={}
        DelayItemLoading: =true
        Height: |-
            =Min(
                scrTravel_cmp_Footer_1.Y - Self.Y,
                Self.TemplateHeight * CountRows(Self.AllItems)
            )
        Items: |-
            =SortByColumns(
                Switch(
                    varcntSelectedStatus,
                    
                    // Case 1: Open 상태만 조회
                    1, 
                    Filter(
                        'Travel requisition (mserp)',
                        'Approval status' = 'Approval status (mserp)'.Approved,
                        ReferenceDataAreaId = Upper(varSelectedLegalEntity),
                        Employee = userRecord.CreatingWorker,
                        'Reconciliation status' = 'Reconciliation status (mserp)'.Open
                    ),
            
                    // Case 2: Closed 상태만 조회
                    2,
                    Filter(
                        'Travel requisition (mserp)',
                        'Approval status' = 'Approval status (mserp)'.Approved,
                        ReferenceDataAreaId = Upper(varSelectedLegalEntity),
                        Employee = userRecord.CreatingWorker,
                        'Reconciliation status' = 'Reconciliation status (mserp)'.Closed
                    ),
            
                    // Default: 1, 2가 아닐 경우 (전체 조회)
                    // Reconciliation status 조건을 뺍니다.
                    Filter(
                        'Travel requisition (mserp)',
                        'Approval status' = 'Approval status (mserp)'.Approved,
                        ReferenceDataAreaId = Upper(varSelectedLegalEntity),
                        Employee = userRecord.CreatingWorker
                    )
                ),
                "mserp_requisitiondate",
                SortOrder.Descending
            )
        Layout: =Layout.Vertical
        LoadingSpinner: =LoadingSpinner.Data
        OnSelect: |-
            =Set(
                varSelectedTravelReq,
                ThisItem
            );
            If(
                Value(ThisItem.'Amount to reconcile') = 0,
                Notify(
                    "This Travel requirement number cannot register an Expense Report because the Remaining Amount is 0 KRW.",
                    NotificationType.Error,
                    gblParams.notificationTime
                ),
                Set(
                    varSelectedReportStatusItem,
                    'Document Status (mserp)'.Draft
                );
                Set(
                    varSelectedReport,
                    Blank()
                );
                Set(
                    varIsCreateReport, 
                    true
                );
                Concurrent(
                    Clear(colAttachedExpenses),
                    Clear(colAttachedExpensesForReport),
                    ClearCollect(
                        colReportPost,
                        {
                            fieldName: "DataArea",
                            fieldValue: Text(varSelectedLegalEntity),
                            fieldType: "String"     
                        },
                        {
                            fieldName: "Company",
                            fieldValue: Lower(Text(varSelectedLegalEntity)),
                            fieldType: "String"
                        },
                        {
                            fieldName: "LegalEntityForExpenses",
                            fieldValue: Lower(Text(varSelectedLegalEntity)),
                            fieldType: "String"
                        }
                    )
                );
                Navigate('Reports - Edit Screen', ScreenTransition.Fade)
            )
        TemplatePadding: =0
        TemplateSize: =150
        Width: =Parent.Width
        Y: |-
            =//scrTravel_hdr_TopHeader.Height
            If(
                varCntSelect,
                scr16_hdr_TopHeader.Height + scr16_shp_Rectangle_1.Height + scr16_shp_Rectangle_1.Height,
                scr16_hdr_TopHeader.Height + scr16_shp_Rectangle_1.Height
            )
        ZIndex: =2

        Container11_Travel As groupContainer.verticalAutoLayoutContainer:
            Height: =150
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGridColumns: =6
            LayoutGridRows: =6
            LayoutMode: =LayoutMode.Auto
            Width: =Parent.Width
            ZIndex: =2

            Container6_Travel As groupContainer.horizontalAutoLayoutContainer:
                Height: =Parent.Height - scrTravel_shp_GalleryBaseSeparator_1.Height
                LayoutGridColumns: =6
                LayoutGridRows: =6
                LayoutMaxHeight: =
                LayoutMaxWidth: =
                LayoutMinHeight: =112
                LayoutMinWidth: =250
                LayoutMode: =LayoutMode.Auto
                Width: =Parent.Width
                ZIndex: =1

                shpBorder_Travel As rectangle:
                    Fill: =Color.Transparent
                    Height: =Parent.Height
                    LayoutMaxHeight: =
                    LayoutMaxWidth: =
                    Width: =10
                    ZIndex: =1

                Container7_Travel As groupContainer.verticalAutoLayoutContainer:
                    Height: =225
                    LayoutDirection: =LayoutDirection.Vertical
                    LayoutGridColumns: =6
                    LayoutGridRows: =6
                    LayoutJustifyContent: =LayoutJustifyContent.Center
                    LayoutMaxHeight: =
                    LayoutMaxWidth: =
                    LayoutMinHeight: =112
                    LayoutMinWidth: =250
                    LayoutMode: =LayoutMode.Auto
                    ZIndex: =4

                    Label5_TravelReqNumber As label:
                        AutoHeight: =true
                        Font: =Font.'Segoe UI'
                        Height: =70
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        LayoutMinHeight: =70
                        LayoutMinWidth: =560
                        OnSelect: =Select(scrTravel_shp_SelectRegion)
                        PaddingLeft: =15
                        PaddingRight: =0
                        Size: =21
                        TabIndex: =If(IsBlank(Self.Text), -1, 0)
                        Text: =ThisItem.'Travel requisition number'
                        Width: =Parent.Width
                        ZIndex: =1

                    Label6_BusinessPurpose As label:
                        AutoHeight: =true
                        Color: =RGBA(102, 102, 102, 1)
                        Font: =Font.'Segoe UI'
                        Height: =70
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        LayoutMinHeight: =70
                        LayoutMinWidth: =560
                        OnSelect: =Select(scrTravel_shp_SelectRegion)
                        PaddingLeft: =15
                        PaddingRight: =0
                        Size: =21
                        TabIndex: =If(IsBlank(Self.Text), -1, 0)
                        Text: =ThisItem.'Business purpose'
                        Width: =Parent.Width
                        ZIndex: =2

                Container9_Travel As groupContainer.verticalAutoLayoutContainer:
                    FillPortions: =0
                    Height: =225
                    LayoutAlignItems: =LayoutAlignItems.Center
                    LayoutDirection: =LayoutDirection.Vertical
                    LayoutGridColumns: =6
                    LayoutGridRows: =6
                    LayoutJustifyContent: =LayoutJustifyContent.Center
                    LayoutMaxHeight: =
                    LayoutMaxWidth: =
                    LayoutMinHeight: =112
                    LayoutMinWidth: =250
                    LayoutMode: =LayoutMode.Auto
                    Width: =200
                    ZIndex: =5

                    Label5_Amount As label:
                        Align: =Align.Center
                        AutoHeight: =true
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =70
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        LayoutMinHeight: =70
                        LayoutMinWidth: =560
                        OnSelect: =Select(scrTravel_shp_SelectRegion)
                        Size: =21
                        TabIndex: =If(IsBlank(Self.Text), -1, 0)
                        Text: |-
                            =Concatenate(
                                Text(
                                    Value(
                                        Substitute(Substitute(ThisItem.Amount, "KRW", ""), ",", "")
                                    ),
                                    "#,##0.00", 
                                    varDefaultLanguage
                                ),
                                " ",
                                varDefaultCurrency
                            )
                        Width: =Parent.Width
                        ZIndex: =1

                    Label6_RemainingAmount As label:
                        Align: =Align.Center
                        AutoHeight: =true
                        Font: =Font.'Segoe UI'
                        Height: =70
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        LayoutMinHeight: =70
                        LayoutMinWidth: =560
                        OnSelect: =Select(scrTravel_shp_SelectRegion)
                        Size: =21
                        TabIndex: =If(IsBlank(Self.Text), -1, 0)
                        Text: |-
                            =Concatenate(Text(Value(ThisItem.'Amount to reconcile'),"#,#0.00", varDefaultLanguage), " ", varDefaultCurrency)
                        Width: =Parent.Width
                        ZIndex: =2

                Icon3_Travel As icon.ChevronRight:
                    AlignInContainer: =AlignInContainer.Center
                    Color: =RGBA(110, 110, 110, 1)
                    Icon: =Icon.ChevronRight
                    LayoutMaxHeight: =
                    LayoutMaxWidth: =
                    OnSelect: =Select(scrTravel_shp_SelectRegion);
                    PaddingBottom: =15
                    PaddingTop: =15
                    Visible: =false
                    ZIndex: =6

            scrTravel_shp_GalleryBaseSeparator_1 As rectangle:
                AlignInContainer: =AlignInContainer.Center
                Fill: =RGBA(225, 225, 225, 1)
                Height: =1
                LayoutMaxHeight: =
                LayoutMaxWidth: =
                LayoutMinHeight: =1
                Width: =Parent.Width - 10
                ZIndex: =2

        scrTravel_shp_SelectRegion As rectangle:
            AccessibleLabel: ="Select travel requisition"
            Fill: =RGBA(0, 0, 0, 0)
            FocusedBorderThickness: =0
            Height: =Parent.TemplateHeight
            OnSelect: =Select(Parent)
            TabIndex: =0
            Width: =Parent.Width
            ZIndex: =3

    scrTravel_cmp_Footer_1 As cmp_Footer_5:
        ApprovalsText: |-
            =If(
                varAppMode = "CashAdvance",
                "Submit Cash",
                If(
                    varAppMode = "AirfareAllowance",
                    "Submit Reports",
                    GlobalLabels.Labels.'15062:LocalizedName,msdyn_ApprovalsLabel'
                )
            )
        DisplayMode: =!IsBlank(varSelectedLegalEntity)
        ExpensesText: |-
            =//GlobalLabels.Labels.'15062:LocalizedName,msdyn_ExpensesLabel'
            "Add Expenses"
        OnApprovalsButtonClick: |-
            =If(
                varAppMode = "CashAdvance",
                Set(varSelectedTab, 4);
                Navigate('Cash Advance - List Screen', ScreenTransition.Fade),
                If(
                    varAppMode = "AirfareAllowance",
                    Set(varSelectedTab, 4);
                    Navigate('Travel - List Screen', ScreenTransition.Fade),
                    Set(varSelectedTab, 4); Navigate('Approvals - List Screen', ScreenTransition.Fade, {varFiltersApplied:false, varSelectedProjects:Blank(), varSelectedUsers: Blank(), varcntSelectedStatus:1});
                    Reset(scr25_cmb_Project);
                    Reset(scr25_cmb_User)
                )
            )
        OnExpensesButtonClick: =Set(varSelectedTab, 2); Navigate('Expenses - List Screen',ScreenTransition.Fade)
        OnReportsButtonClick: |-
            =Set(varSelectedTab, 3); 
            Navigate('Reports - List Screen', ScreenTransition.Fade ,{varcntSelectedStatus:1})
        paramInDefaultAppMode: =varAppMode
        paramInDefaultSelectedTab: =4
        ReportText: |-
            =//GlobalLabels.Labels.'15062:LocalizedName,msdyn_ExpenseReportsLabel'
            If(
                varAppMode = "AirfareAllowance",
                "View Reports",
                "Submit Reports"
            )
        SelectedTab: =4
        Visible: =!varCntSelect
        Y: =App.Height - Self.Height
        ZIndex: =3

    "scrTravel_hdr_TopHeader As 'main-app-header'":
        firstIcon: =
        firstIconAccessibleLabel: =
        firstIconAction: =
        homeIconAction: =Navigate('Main Screen', ScreenTransition.None);
        OnSelectButton: |-
            =Set(
                gblNavigationDrawerVisibility,
                true
            );
            Set(
                gblScreenName,
                'Travel - List Screen'
            );
            Refresh('Expense mobile notifications (mserp)');
            ClearCollect(
                colExpenseNoticationInfo,
                ForAll(
                    Filter('Expense mobile notifications (mserp)',NotifiedEmailId = User().Email) As ExpenseNotification,
                    {
                        RecId: ExpenseNotification.EntRecId,
                        ReadMessage: ExpenseNotification.Read
                    }
                )
            );
        paramAvatar: =Coalesce(userImage, blankImage)
        paramTitle: ="Airfare Allowance"
        refreshIconAction: |-
            =Refresh('Travel requisition (mserp)');
            Reset(scrTravel_Gallery)
        secondIcon: =
        secondIconAccessibleLabel: =
        secondIconAction: =
        thirdIcon: =
        thirdIconAccessibleLabel: =
        thirdIconAction: =
        ZIndex: =4

    scr16_shp_Rectangle_2 As rectangle:
        Fill: =Color.White
        Height: =105
        OnSelect: |-
            =UpdateContext({varcntShowFilter:false});
        Width: =Parent.Width
        Y: =scr16_hdr_TopHeader.Height-2
        ZIndex: =5

    Rectangle5_Travel As rectangle:
        Fill: =RGBA(248, 248, 248, 0.6)
        Height: =App.Height
        OnSelect: |-
            =Set(
                gblNavigationDrawerVisibility,
                false
            )
        Visible: =gblNavigationDrawerVisibility
        Width: =App.Width
        ZIndex: =6

    ShadowElement_Travel As groupContainer.horizontalAutoLayoutContainer:
        DropShadow: =DropShadow.ExtraBold
        Height: =App.Height
        LayoutGridColumns: =6
        LayoutGridRows: =6
        LayoutMode: =LayoutMode.Auto
        Visible: =gblNavigationDrawerVisibility
        Width: =4
        X: ='Navigation-Drawer_1'.Width - 1
        Y: ='Navigation-Drawer_1'.Y
        ZIndex: =7

    "'Navigation-Drawer_Travel' As 'Navigation-Drawer'":
        CountNoification: =CountRows(Filter(colExpenseNoticationInfo, ReadMessage = 'NoYes (mserp)'.No))
        MenuItems: |-
            =Table({
                    Index : 1,
                    ScreenName: 'Profile - Notification Screen',
                    Icon : Notification,
                    Value : GlobalLabels.Labels.'15062:LocalizedName,msdyn_NotificationsLabel'
                },
                {
                    Index : 2,
                    ScreenName: 'Profile - Change Legal Entity Screen',
                    Icon : ChangeLE,
                    Value : GlobalLabels.Labels.'15062:LocalizedName,msdyn_ChangeLegalEntityLabel'
                },
                {
                    Index : 3,
                    ScreenName: 'Profile - About Screen',
                    Icon : About,
                    Value : GlobalLabels.Labels.'15062:LocalizedName,msdyn_AboutLabel'
                }
            )
        unreadNotificationVisibility: =CountRows(Filter(colExpenseNoticationInfo, ReadMessage = 'NoYes (mserp)'.No)) > 0
        UserEmailValue: =User().Email
        UserImageValue: =Coalesce(userImage, blankImage)
        UserLegalEntityValue: =LookUp('Legal entities (mserp)', Company = varSelectedLegalEntity).Name
        UserNameValue: =User().FullName
        Visible: =gblNavigationDrawerVisibility
        ZIndex: =8

    scr16_btn_FakeButton_1 As button:
        DisplayMode: =DisplayMode.View
        Fill: =RGBA(241, 241, 241, 1)
        Height: =44
        RadiusBottomLeft: =50
        RadiusBottomRight: =50
        RadiusTopLeft: =50
        RadiusTopRight: =50
        Size: =24
        TabIndex: =-1
        Text: =""
        Visible: =false
        Width: =228
        X: =(Parent.Width - Self.Width)/2
        Y: =scr16_rct_seprator.Y - scr16_shp_Rectangle_2.Y
        ZIndex: =9

    scr16_btn_Draft_1 As button:
        BorderStyle: =BorderStyle.None
        Color: =If(varcntSelectedStatus=1, RGBA(255, 255, 255, 1),RGBA(64, 64, 64, 1))
        Fill: =If(varcntSelectedStatus=1, RGBA(34, 102, 227, 1),scr16_btn_FakeButton_1.Fill)
        Height: =44
        HoverColor: =Self.Color
        HoverFill: =Self.Fill
        OnSelect: |-
            =UpdateContext({varcntSelectedStatus:1});UpdateContext({varcntShowFilter:false});
        PressedColor: =Self.Color
        PressedFill: =Self.Fill
        RadiusBottomLeft: =50
        RadiusBottomRight: =50
        RadiusTopLeft: =50
        RadiusTopRight: =50
        Size: =13.5
        Text: ="Open"
        Width: =103
        X: =scr16_btn_FakeButton_1.X
        Y: =scr16_btn_FakeButton_1.Y
        ZIndex: =10

    scr16_btn_Submitted_1 As button:
        BorderStyle: =BorderStyle.None
        Color: =If(varcntSelectedStatus=2, RGBA(255, 255, 255, 1),RGBA(64, 64, 64, 1))
        Fill: =If(varcntSelectedStatus=2, RGBA(34, 102, 227, 1),scr16_btn_FakeButton_1.Fill)
        Height: =44
        HoverColor: =Self.Color
        HoverFill: =Self.Fill
        OnSelect: |-
            =UpdateContext({varcntSelectedStatus:2});
            UpdateContext({varCntSelect:false});
            UpdateContext({varcntShowFilter:false});
            Clear(colSelectedReportIds);
        PressedColor: =Self.Color
        PressedFill: =Self.Fill
        RadiusBottomLeft: =50
        RadiusBottomRight: =50
        RadiusTopLeft: =50
        RadiusTopRight: =50
        Size: =13.5
        Text: ="Closed"
        Width: =103
        X: =scr16_btn_Draft_1.X + scr16_btn_Draft_1.Width + 22
        Y: =scr16_btn_FakeButton_1.Y
        ZIndex: =11

    scr16_shp_Rectangle_3 As rectangle:
        Fill: =Color.White
        Height: =105
        Visible: =varCntSelect
        Width: =Parent.Width
        Y: =213
        ZIndex: =12

    scr16_rct_seprator_1 As rectangle:
        Fill: =RGBA(200, 200, 200, 1)
        Height: =0.85
        Width: =Parent.Width
        Y: =scr16_shp_Rectangle.Y+scr16_shp_Rectangle.Height
        ZIndex: =13

    scr16_rct_seprator_2 As rectangle:
        Fill: =RGBA(200, 200, 200, 1)
        Height: =0.85
        Width: =Parent.Width
        Y: =scr16_shp_Rectangle.Y
        ZIndex: =14

