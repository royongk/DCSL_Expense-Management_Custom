"'Travel - List Screen' As screen.'phoneBrowseLayout_ver3.0'":
    Fill: =Color.White
    OnVisible: |-
        =UpdateContext({varCntSelect: false});
        Refresh('Travel requisition (mserp)');
        Set(varSelectedTravelReq, Blank());
        Reset(scrTravel_Gallery);

    emptyStateComponent_Travel As emptyStateComponent:
        subTitle: ="No approved travel requisitions available"
        title: |-
            =GlobalLabels.Labels.'15062:LocalizedName,msdyn_NothingHereYetLabel'
        Visible: =scrTravel_Gallery.AllItemsCount <= 0
        X: |
            =(Parent.Width - Self.Width)/2
        Y: |
            =scrTravel_Gallery.Y + (Parent.Height - scrTravel_hdr_TopHeader.Height - scrTravel_cmp_Footer_1.Height - Self.Height)/2

    "scrTravel_Gallery As gallery.'BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0'":
        '#CopilotOverlayLabel': ="Filtered"
        AccessibleLabel: ="List of approved travel requisitions"
        Default: ={}
        DelayItemLoading: =true
        Height: |-
            =Min(
                scrTravel_cmp_Footer_1.Y - Self.Y,
                Self.TemplateHeight * CountRows(Self.AllItems)
            )
        Items: |-
            =SortByColumns(
                Filter(
                    'Travel requisition (mserp)',
                    'Approval status' = 'Approval status (mserp)'.Approved &&
                    ReferenceDataAreaId = Upper(varSelectedLegalEntity) &&
                    Employee = userRecord.CreatingWorker
                ),
                "mserp_requisitiondate", SortOrder.Descending
            )
        Layout: =Layout.Vertical
        LoadingSpinner: =LoadingSpinner.Data
        OnSelect: |-
            =Set(
                varSelectedTravelReq,
                ThisItem
            );
            If(
                Value(ThisItem.'Amount to reconcile') = 0,
                Notify(
                    "This Travel requirement number cannot register an Expense Report because the Remaining Amount is 0 KRW.",
                    NotificationType.Error,
                    gblParams.notificationTime
                ),
                Navigate('Reports - Edit Screen', ScreenTransition.Fade)
            )
        TemplatePadding: =0
        TemplateSize: =150
        Width: =Parent.Width
        Y: =scrTravel_hdr_TopHeader.Height
        ZIndex: =2

        Container11_Travel As groupContainer.verticalAutoLayoutContainer:
            Height: =150
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGridColumns: =6
            LayoutGridRows: =6
            LayoutMode: =LayoutMode.Auto
            Width: =Parent.Width
            ZIndex: =2

            Container6_Travel As groupContainer.horizontalAutoLayoutContainer:
                Height: =Parent.Height - scrTravel_shp_GalleryBaseSeparator_1.Height
                LayoutGridColumns: =6
                LayoutGridRows: =6
                LayoutMaxHeight: =
                LayoutMaxWidth: =
                LayoutMinHeight: =112
                LayoutMinWidth: =250
                LayoutMode: =LayoutMode.Auto
                Width: =Parent.Width
                ZIndex: =1

                shpBorder_Travel As rectangle:
                    Fill: =Color.Transparent
                    Height: =Parent.Height
                    LayoutMaxHeight: =
                    LayoutMaxWidth: =
                    Width: =10
                    ZIndex: =1

                Container7_Travel As groupContainer.verticalAutoLayoutContainer:
                    Height: =225
                    LayoutDirection: =LayoutDirection.Vertical
                    LayoutGridColumns: =6
                    LayoutGridRows: =6
                    LayoutJustifyContent: =LayoutJustifyContent.Center
                    LayoutMaxHeight: =
                    LayoutMaxWidth: =
                    LayoutMinHeight: =112
                    LayoutMinWidth: =250
                    LayoutMode: =LayoutMode.Auto
                    ZIndex: =4

                    Label5_TravelReqNumber As label:
                        AutoHeight: =true
                        Font: =Font.'Segoe UI'
                        Height: =70
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        LayoutMinHeight: =70
                        LayoutMinWidth: =560
                        OnSelect: =Select(scrTravel_shp_SelectRegion)
                        PaddingLeft: =15
                        PaddingRight: =0
                        Size: =21
                        TabIndex: =If(IsBlank(Self.Text), -1, 0)
                        Text: =ThisItem.'Travel requisition number'
                        Width: =Parent.Width
                        ZIndex: =1

                    Label6_BusinessPurpose As label:
                        AutoHeight: =true
                        Color: =RGBA(102, 102, 102, 1)
                        Font: =Font.'Segoe UI'
                        Height: =70
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        LayoutMinHeight: =70
                        LayoutMinWidth: =560
                        OnSelect: =Select(scrTravel_shp_SelectRegion)
                        PaddingLeft: =15
                        PaddingRight: =0
                        Size: =21
                        TabIndex: =If(IsBlank(Self.Text), -1, 0)
                        Text: =ThisItem.'Business purpose'
                        Width: =Parent.Width
                        ZIndex: =2

                Container9_Travel As groupContainer.verticalAutoLayoutContainer:
                    FillPortions: =0
                    Height: =225
                    LayoutAlignItems: =LayoutAlignItems.Center
                    LayoutDirection: =LayoutDirection.Vertical
                    LayoutGridColumns: =6
                    LayoutGridRows: =6
                    LayoutJustifyContent: =LayoutJustifyContent.Center
                    LayoutMaxHeight: =
                    LayoutMaxWidth: =
                    LayoutMinHeight: =112
                    LayoutMinWidth: =250
                    LayoutMode: =LayoutMode.Auto
                    Width: =200
                    ZIndex: =5

                    Label5_Amount As label:
                        Align: =Align.Center
                        AutoHeight: =true
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =70
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        LayoutMinHeight: =70
                        LayoutMinWidth: =560
                        OnSelect: =Select(scrTravel_shp_SelectRegion)
                        Size: =21
                        TabIndex: =If(IsBlank(Self.Text), -1, 0)
                        Text: |-
                            =Concatenate(
                                Text(
                                    Value(
                                        Substitute(Substitute(ThisItem.Amount, "KRW", ""), ",", "")
                                    ),
                                    "#,##0.00", 
                                    varDefaultLanguage
                                ),
                                " ",
                                varDefaultCurrency
                            )
                        Width: =Parent.Width
                        ZIndex: =1

                    Label6_RemainingAmount As label:
                        Align: =Align.Center
                        AutoHeight: =true
                        Font: =Font.'Segoe UI'
                        Height: =70
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        LayoutMinHeight: =70
                        LayoutMinWidth: =560
                        OnSelect: =Select(scrTravel_shp_SelectRegion)
                        Size: =21
                        TabIndex: =If(IsBlank(Self.Text), -1, 0)
                        Text: |-
                            =Concatenate(Text(Value(ThisItem.'Amount to reconcile'),"#,#0.00", varDefaultLanguage), " ", varDefaultCurrency)
                        Width: =Parent.Width
                        ZIndex: =2

                Icon3_Travel As icon.ChevronRight:
                    AlignInContainer: =AlignInContainer.Center
                    Color: =RGBA(110, 110, 110, 1)
                    Icon: =Icon.ChevronRight
                    LayoutMaxHeight: =
                    LayoutMaxWidth: =
                    OnSelect: =Select(scrTravel_shp_SelectRegion);
                    PaddingBottom: =15
                    PaddingTop: =15
                    Visible: =false
                    ZIndex: =6

            scrTravel_shp_GalleryBaseSeparator_1 As rectangle:
                AlignInContainer: =AlignInContainer.Center
                Fill: =RGBA(225, 225, 225, 1)
                Height: =1
                LayoutMaxHeight: =
                LayoutMaxWidth: =
                LayoutMinHeight: =1
                Width: =Parent.Width - 10
                ZIndex: =2

        scrTravel_shp_SelectRegion As rectangle:
            AccessibleLabel: ="Select travel requisition"
            Fill: =RGBA(0, 0, 0, 0)
            FocusedBorderThickness: =0
            Height: =Parent.TemplateHeight
            OnSelect: =Select(Parent)
            TabIndex: =0
            Width: =Parent.Width
            ZIndex: =3

    scrTravel_cmp_Footer_1 As cmp_Footer_3:
        ApprovalsText: |-
            =If(
                varAppMode = "AirfareAllowance",
                "Travel",
                GlobalLabels.Labels.'15062:LocalizedName,msdyn_ApprovalsLabel'
            )
        DisplayMode: =!IsBlank(varSelectedLegalEntity)
        ExpensesText: |-
            =GlobalLabels.Labels.'15062:LocalizedName,msdyn_ExpensesLabel'
        OnApprovalsButtonClick: |-
            =If(
                varAppMode = "AirfareAllowance",
                Navigate('Travel - List Screen', ScreenTransition.Fade),
                Set(varSelectedTab, 4); Navigate('Approvals - List Screen', ScreenTransition.Fade, {varFiltersApplied:false, varSelectedProjects:Blank(), varSelectedUsers: Blank(), varcntSelectedStatus:1})
            );
            Reset(scr25_cmb_Project);
            Reset(scr25_cmb_User);
        OnExpensesButtonClick: =Set(varSelectedTab, 2); Navigate('Expenses - List Screen',ScreenTransition.Fade)
        OnReceiptsButtonClick: =Set(varSelectedTab, 1); Navigate('Receipts - List Screen',ScreenTransition.Fade)
        OnReportsButtonClick: |-
            =Set(varSelectedTab, 3); 
            Navigate('Reports - List Screen', ScreenTransition.Fade ,{varcntSelectedStatus:1})
        paramInDefaultAppMode: =varAppMode
        paramInDefaultSelectedTab: =4
        ReceiptText: |-
            =GlobalLabels.Labels.'15062:LocalizedName,msdyn_ReceiptsLabel'
        ReportText: |-
            =GlobalLabels.Labels.'15062:LocalizedName,msdyn_ExpenseReportsLabel'
        SelectedTab: =4
        Visible: =!varCntSelect
        Y: =App.Height - Self.Height
        ZIndex: =4

    "scrTravel_hdr_TopHeader As 'main-app-header'":
        firstIcon: =
        firstIconAccessibleLabel: =
        firstIconAction: =
        homeIconAction: =Navigate('Main Screen', ScreenTransition.Fade)
        OnSelectButton: |-
            =Set(
                gblNavigationDrawerVisibility,
                true
            );
            Set(
                gblScreenName,
                'Travel - List Screen'
            );
            Refresh('Expense mobile notifications (mserp)');
            ClearCollect(
                colExpenseNoticationInfo,
                ForAll(
                    Filter('Expense mobile notifications (mserp)',NotifiedEmailId = User().Email) As ExpenseNotification,
                    {
                        RecId: ExpenseNotification.EntRecId,
                        ReadMessage: ExpenseNotification.Read
                    }
                )
            );
        paramAvatar: =Coalesce(userImage, blankImage)
        paramTitle: ="Airfare Allowance"
        refreshIconAction: |-
            =Refresh('Travel requisition (mserp)');
            Reset(scrTravel_Gallery)
        secondIcon: =
        secondIconAccessibleLabel: =
        secondIconAction: =
        thirdIcon: =
        thirdIconAccessibleLabel: =
        thirdIconAction: =
        ZIndex: =24

    Rectangle5_Travel As rectangle:
        Fill: =RGBA(248, 248, 248, 0.6)
        Height: =App.Height
        OnSelect: |-
            =Set(
                gblNavigationDrawerVisibility,
                false
            )
        Visible: =gblNavigationDrawerVisibility
        Width: =App.Width
        ZIndex: =26

    ShadowElement_Travel As groupContainer.horizontalAutoLayoutContainer:
        DropShadow: =DropShadow.ExtraBold
        Height: =App.Height
        LayoutGridColumns: =6
        LayoutGridRows: =6
        LayoutMode: =LayoutMode.Auto
        Visible: =gblNavigationDrawerVisibility
        Width: =4
        X: ='Navigation-Drawer_1'.Width - 1
        Y: ='Navigation-Drawer_1'.Y
        ZIndex: =27

    "'Navigation-Drawer_Travel' As 'Navigation-Drawer'":
        CountNoification: =CountRows(Filter(colExpenseNoticationInfo, ReadMessage = 'NoYes (mserp)'.No))
        MenuItems: |-
            =Table({
                    Index : 1,
                    ScreenName: 'Profile - Notification Screen',
                    Icon : Notification,
                    Value : GlobalLabels.Labels.'15062:LocalizedName,msdyn_NotificationsLabel'
                },
                {
                    Index : 2,
                    ScreenName: 'Profile - Change Legal Entity Screen',
                    Icon : ChangeLE,
                    Value : GlobalLabels.Labels.'15062:LocalizedName,msdyn_ChangeLegalEntityLabel'
                },
                {
                    Index : 3,
                    ScreenName: 'Profile - About Screen',
                    Icon : About,
                    Value : GlobalLabels.Labels.'15062:LocalizedName,msdyn_AboutLabel'
                }
            )
        unreadNotificationVisibility: =CountRows(Filter(colExpenseNoticationInfo, ReadMessage = 'NoYes (mserp)'.No)) > 0
        UserEmailValue: =User().Email
        UserImageValue: =Coalesce(userImage, blankImage)
        UserLegalEntityValue: =LookUp('Legal entities (mserp)', Company = varSelectedLegalEntity).Name
        UserNameValue: =User().FullName
        Visible: =gblNavigationDrawerVisibility
        ZIndex: =28

