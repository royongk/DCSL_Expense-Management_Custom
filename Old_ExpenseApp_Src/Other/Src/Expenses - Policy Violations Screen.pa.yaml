Screens:
  Expenses - Policy Violations Screen:
    Properties:
      Fill: =RGBA(244,244,244,1)
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |-
        =ClearCollect(
            colPolViolations,
            Split(varSelectedExpenseDoc.PolicyViolationErrorMessage, "~|~")
        );
    Children:
      - scr15_btn_Done_1:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(30, 144, 255, 1)
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =RGBA(34, 102, 227, 1)
            Font: =Font.'Open Sans'
            Height: =88
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            OnSelect: =Back()
            PaddingBottom: =0
            PaddingLeft: =0
            PaddingRight: =0
            PaddingTop: =0
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            RadiusTopLeft: =8
            RadiusTopRight: =8
            Size: =18
            Text: =GlobalLabels.Labels.'15062:LocalizedName,msdyn_DoneButtonLabel'
            Width: |
              =Parent.Width -  Self.X*2
            X: =40
            Y: =Parent.Height - Self.Height - 25
      - scr15_PolicyViolation:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Flexible_SocialFeed_ver5.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            DisplayMode: =DisplayMode.View
            Height: =scr15_btn_Done_1.Y - Self.Y - 25
            Items: =colPolViolations
            TemplateFill: =Color.White
            Width: =Parent.Width
            Y: =scr15_lbl_Instruction_1.Y + scr15_lbl_Instruction_1.Height
          Children:
            - scr15_PolicyMessage:
                Control: Label@2.5.1
                Properties:
                  AutoHeight: =true
                  BorderColor: =RGBA(0, 18, 107, 1)
                  DisplayMode: =DisplayMode.View
                  Font: =Font.'Open Sans'
                  OnSelect: =Select(Parent)
                  Text: =ThisItem.Value
                  Width: =App.Width - 60
                  X: =27
                  Y: =12
      - scr15_lbl_Instruction_1:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(110, 110, 110, 1)
            Font: =Font.'Segoe UI'
            Height: =64
            Size: =18
            TabIndex: =0
            Text: |
              =GlobalLabels.Labels.'15062:LocalizedName,msdyn_PolicyViolationRibbonLabel'
            Width: =Parent.Width -  Self.X*2
            X: =22
            Y: =scr15_hdr_PolicyViolation_1.Y + scr15_hdr_PolicyViolation_1.Height + 21.5
      - scr15_hdr_PolicyViolation_1:
          Control: CanvasComponent
          ComponentName: hdr02_Header
          Properties:
            Fill: =scr15_hdr_PolicyViolation_1.paramFill
            Height: =82
            Width: =Max(App.Width, App.MinScreenWidth)
            paramColor: =RGBA(0, 0, 0, 1)
            paramFill: =RGBA(255, 255, 255, 1)
            paramTitle: =GlobalLabels.Labels.'15062:LocalizedName,msdyn_PolicyViolationLabel'
      - scr15_ico_Back_1:
          Control: Classic/Icon@2.5.0
          Properties:
            AccessibleLabel: ="Press to go back"
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =icongconfig_backbutton.Color
            Fill: =icongconfig_backbutton.Fill
            Height: =icongconfig_backbutton.Height
            Icon: =Icon.ChevronLeft
            OnSelect: =Back();
            TabIndex: =0
            Width: =icongconfig_backbutton.Width
            X: =18
            Y: =(scr03_hdr_TopHeader_1.Height-Self.Height)/2
