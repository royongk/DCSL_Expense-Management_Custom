"'header-navigation' As CanvasComponent":
    Fill: =RGBA(0, 0, 0, 1)
    header_text: ="Text"
    Height: =Max(App.Height, App.MinScreenHeight)/10
    left_navigation: =App.ActiveScreen
    right_navigation: =App.ActiveScreen
    right_navigation_text: ="Skip"
    Width: =Max(App.Width, App.MinScreenWidth)
    X: =0
    Y: =0
    ZIndex: =1

    Icon1 As icon.Add:
        AccessibleLabel: ="Back Button"
        Color: =RGBA(153, 153, 153, 1)
        Height: =30
        Icon: =Icon.ChevronLeft
        OnSelect: =Navigate('header-navigation'.left_navigation)
        Width: =30
        X: =22
        Y: =45
        ZIndex: =1

    Label2 As label:
        Align: =Align.Center
        Color: =RGBA(255, 255, 255, 1)
        Font: =Font.'Segoe UI'
        FontWeight: =FontWeight.Semibold
        Height: =70
        Size: =21
        Text: ='header-navigation'.header_text
        Width: =277
        X: =168
        Y: =25
        ZIndex: =2

    Label3 As label:
        Align: =Align.Center
        Color: =RGBA(128, 128, 128, 1)
        Font: =Font.'Segoe UI'
        Height: =70
        OnSelect: =Navigate('header-navigation'.right_navigation)
        Size: =21
        Text: ='header-navigation'.right_navigation_text
        Width: =169
        X: =459
        Y: =25
        ZIndex: =3

